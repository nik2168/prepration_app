:root{--bg:#F2F7FE;--surface:#fff;--ice:#EAF2FE;--sky:#DCE9FD;--sky2:#B5D0FA;--pri:#1F5FE0;--navy:#0C2766;--ink:#0D1F42;--mut:#51647F;--line:#DDE7F5;--on:#fff;--bad:#B23A48;--badb:#FBECEE;--hero:#0C2766;--heroink:#fff;--heromut:#BBD0F7;
--sh:0 1px 2px rgba(12,39,102,.05),0 14px 30px -22px rgba(12,39,102,.4);--r:24px;--f:Lexend,"Noto Sans Devanagari","Kohinoor Devanagari",system-ui,sans-serif;color-scheme:light}
:root[data-theme=dark]{--bg:#071329;--surface:#0F2040;--ice:#152A50;--sky:#1B3566;--sky2:#2B5199;--pri:#7FAEFF;--navy:#CFE0FF;--ink:#EAF1FF;--mut:#A3B7D8;--line:#21385F;--on:#071329;--bad:#FF9DA8;--badb:#40202F;--hero:#153A8F;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 var(--f);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer}button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px}h1{font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.015em}h2{font-size:18px;font-weight:600;line-height:1.3}h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.sm{font-size:13.5px}.grow{flex:1;min-width:0}.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:16px}.bet{justify-content:space-between}
/* frame: floating tabs on phones, sidebar from 768px */
.app{min-height:100dvh}.brand{display:none}
main{padding:18px 16px calc(env(safe-area-inset-bottom) + 112px);max-width:1180px;margin:auto}
.nav{position:fixed;z-index:20;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;border-radius:32px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 16px 36px -14px rgba(12,39,102,.45)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:27px;font-size:11.5px;font-weight:500;color:var(--mut);min-height:52px}.nav button[aria-current]{background:var(--pri);color:var(--on)}
@media(min-width:768px){.app{display:grid;grid-template-columns:232px minmax(0,1fr)}.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 20px}.brand b{display:block;font-weight:600;line-height:1.25}.nav{position:static;flex-direction:column;padding:0;background:none;box-shadow:none;border-radius:0}.nav button{flex-direction:row;gap:12px;font-size:15px;padding:11px 13px;border-radius:14px;min-height:46px}.nav button:not([aria-current]):hover{background:var(--ice)}main{padding:28px 32px 56px;width:100%}}
.focus .side{display:none}.focus.app{display:block}
/* buttons, chips, segments */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:99px;font-weight:500;background:var(--sky);color:var(--navy);white-space:nowrap}.btn.p{background:var(--pri);color:var(--on)}.btn.l{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}.btn.s{min-height:40px;padding:7px 15px;font-size:14px}.btn.w{background:#fff;color:#0C2766}
@media(hover:hover){.btn:not(:disabled):hover{filter:brightness(.96)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none;scroll-snap-type:x proximity}.chips button{flex:none;min-height:42px;padding:8px 16px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;scroll-snap-align:start}.chips button[aria-pressed=true]{background:var(--navy);color:var(--on);box-shadow:none}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible}}
.seg{display:flex;background:var(--sky);border-radius:99px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg button{flex:1 0 auto;min-height:40px;padding:6px 16px;border-radius:99px;font-size:14.5px;font-weight:500;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--surface);color:var(--navy);box-shadow:var(--sh)}
.tag{display:inline-block;font-size:12.5px;line-height:1.4;border-radius:99px;padding:2px 10px;background:var(--sky);color:var(--navy);white-space:nowrap}.tag.o{background:none;box-shadow:inset 0 0 0 1px var(--sky2)}.tag.bad{background:var(--badb);color:var(--bad)}
/* native dropdowns: the browser's own select, styled where supported */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13.5px;color:var(--mut)}
select,.inp{width:100%;min-height:48px;border:0;border-radius:15px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:10px 14px;font-size:15px;color:var(--ink);cursor:pointer}.inp{cursor:text}.inp::placeholder{color:var(--mut)}
select:hover{box-shadow:inset 0 0 0 1px var(--sky2)}
@supports (appearance:base-select){select,::picker(select){appearance:base-select}select{display:flex;align-items:center;justify-content:space-between;gap:10px}selectedcontent{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select::picker-icon{content:"";width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translate(-3px,-3px);transition:transform .18s}select:open::picker-icon{transform:rotate(225deg) translate(-3px,-3px)}select:open{box-shadow:inset 0 0 0 2px var(--pri)}
::picker(select){margin-block:7px;padding:7px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 26px 54px -20px rgba(12,39,102,.5);max-height:min(400px,60dvh);min-width:anchor-size(width);max-width:calc(100vw - 24px)}
option{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 13px;border-radius:13px;font-size:15px}option:hover,option:focus-visible{background:var(--ice);outline:0}option:checked{background:var(--sky);color:var(--navy);font-weight:500}option::checkmark{content:"✓";order:2;margin-left:auto;color:var(--pri)}optgroup{font-weight:500;color:var(--mut);font-size:13px}optgroup legend{padding:10px 13px 4px}optgroup option{color:var(--ink)}}
.sw{display:flex;align-items:center;gap:11px;min-height:48px;cursor:pointer;color:var(--ink);font-size:15px}.sw input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--sky2);position:relative;cursor:pointer;flex:none;transition:background .18s}.sw input::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .18s}.sw input:checked{background:var(--pri)}.sw input:checked::after{left:21px}
/* surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}.tint{background:var(--sky);box-shadow:none}.flat{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.hero{background:var(--hero);color:var(--heroink);border-radius:30px;padding:24px;display:grid;gap:22px;overflow:hidden;position:relative}.hero .mut{color:var(--heromut)}.hero h1{font-size:clamp(26px,4.4vw,38px)}@media(min-width:900px){.hero{grid-template-columns:1.2fr 1fr;padding:34px;align-items:center}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}.g2{display:grid;gap:14px}@media(min-width:1000px){.g2{grid-template-columns:1fr 1fr;align-items:start}}
.filters{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.filters .wide{grid-column:1/-1}@media(min-width:900px){.filters{grid-template-columns:1.4fr 1fr 1fr 1fr}.filters .wide{grid-column:auto}}
.setup{display:grid;gap:12px}@media(min-width:700px){.setup{grid-template-columns:1.5fr 1.3fr auto;align-items:end}}
.paper{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}.paper b{font-size:18px;font-weight:600;display:block}.vwrap{max-width:820px;margin:auto;padding:16px 16px 80px}.vq .opts{max-width:none}.vq .eye{flex:none}.vq .eye .i{width:20px;height:20px}@media(max-width:560px){.wd2{display:none}}
/* OMR bubbles */
.omr{display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid var(--sky2);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--mut)}
.mx{overflow-x:auto;margin:0 -18px;padding:0 18px}.mx table{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}.mx th{font-weight:500;font-size:13px;color:var(--mut);padding:4px 2px 10px;text-align:center}.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;padding-right:10px;min-width:150px;max-width:250px}.mx td{border-top:1px solid var(--line);padding:6px 2px;text-align:center;height:56px}
.b{display:inline-grid;place-items:center;border-radius:50%;background:var(--pri);color:var(--on);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}.b.z{background:none;border:1.5px solid var(--line);width:12px;height:12px}.b.y{background:var(--sky2);color:#0C2766}.b.na{background:none;color:var(--mut)}
.lnk{color:var(--pri);font-weight:500;text-align:left}.lnk:hover{text-decoration:underline}.nm{font-weight:500;color:var(--ink)}
.bar{height:8px;border-radius:9px;background:var(--sky);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}.bar.wk i{background:var(--bad)}
/* accordion */
details.acc{background:var(--surface);border-radius:20px;box-shadow:var(--sh)}.acc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 84px 52px 20px;gap:12px;align-items:center;padding:14px 18px;border-radius:20px}.acc summary::-webkit-details-marker{display:none}.acc summary .i{width:18px;transition:transform .18s}.acc[open] summary .i{transform:rotate(180deg)}.acc .in{padding:0 18px 14px}.tr{display:grid;grid-template-columns:minmax(0,1fr) 84px 52px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.tr .sm{overflow-wrap:anywhere}
@media(min-width:700px){.acc summary,.acc .tr{grid-template-columns:minmax(0,1fr) 200px 60px 20px}.acc .tr{grid-template-columns:minmax(0,1fr) 200px 80px}}
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}.li:first-child{border:0}
/* mock */

ने का अभ्यास करना।","अर्थ ग्रहण कर उसका केन्द्रीय भाव समझना।"]},{"i":"2024_32","y":2024,"n":32,"t":"HIN.verb","a":[3],"x":"वाक्य में प्रयुक्त क्रिया की दृष्टि से [[असंगत]] विकल्प का चयन कीजिए :","o":["अध्यापिका छात्राओं को भूगोल पढ़ा रही है - द्विकर्मकक्रिया","निशीथ जोर-जोर-से हँस रहा है - अकर्मक क्रिया","मदारी अनेक करतब दिखलाकर बच्चों को ललचाता है - अकर्मक क्रिया","लड़-झगड़कर वह अपना हिस्सा ले ही मरा - रंजक क्रिया"]},{"i":"2024_33","y":2024,"n":33,"t":"HIN.pas","a":[3],"x":"नया निश्चय ही एक मूल्य है। पर निरंतरता भी एक मूल्य है। साहित्य दोनों में से एक को चुनने की हिमाकत सौभाग्य से नहीं करता है, क्योंकि वह जानता है कि एक के बिना दूसरा संभव नहीं है। परंपरा अपने को पुनर्नवा किए बिना सजीव नहीं रह सकती। मनुष्य दोनों आयामों में रहता है : इतिहास में और अनन्त में। वह बदलता है और फिर भी बना रहता है। दोनों आयाम मनुष्य के यहाँ अंतर्भुक्त हैं - वे अलग-थलग या विविक्त नहीं होते। बहुत कुछ बदलता है : समाज, परिस्थितियाँ, आर्थिक व्यापार, मानव संबंध और उनके संगुफन आदि पर प्रेम, ईर्ष्या, मोह-मत्सर, राग-विराग, हर्ष-विषाद आदि वही बने रहते हैं। नयी दृष्टि होती है, तो अपने लिए अनिवार्यतः नया शिल्प भी खोजती है। विश्लेषण के लिए भले हम कथ्य और शिल्प को अलग-थलग कर लेते हैं, पर रचना में वे अद्वैत हैं। नया अंततः निरंतरता में समाहित होकर अपनी वैधता पाता है, पर वह निरंतरता को कहीं न कहीं बदल भी देता है। निरंतरता नए के हस्तक्षेप और उसके समाहार के बाद वही नहीं रह जाती, जो पहले थी। हम यह भूल जाते हैं कि आज जो पुराना लगता है, वह कभी नया था। बिना समकालीनता के कालातीत नहीं हुआ जा सकता, लेकिन सिर्फ समकालीनता के बाड़े में बँधे रहकर भी कालातीत नहीं हुआ जा सकता। नया समय को सीधे और उसके बदले हुए ब्योरों में पकड़ने के साहस से उपजता है, पर अगर वह समय के पार न देख पाये, तो टिकाऊ नहीं हो सकता। जो कालातीत है, वही हर समय नया होता चलता है।\n\nसाहित्य का अभीष्ट है :","o":["मात्र नए को चुनना","मात्र निरंतरता को चुनना","नएपन एवं निरंतरता दोनों को चुनना","मात्र समकालीन को चुनना"]},{"i":"2024_34","y":2024,"n":34,"t":"HIN.pas","a":[2],"x":"नया निश्चय ही एक मूल्य है। पर निरंतरता भी एक मूल्य है। साहित्य दोनों में से एक को  ok:(q,a)=>q.a==='*'?true:!!a&&q.a.includes(a),          // '*' = mark to all, as in the official key

 avg(l){return l.length?l.reduce((a,b)=>a+b,0)/l.length:null},

 // accuracy on each question's latest answer; unanswered questions are not counted
 acc(qs,latest,key){const m={};for(const q of qs){const a=latest[q.i];if(!a||q.a==='*')continue;const k=key(q);(m[k]=m[k]||{n:0,c:0}).n++;if(C.ok(q,a))m[k].c++}for(const k in m)m[k].pct=100*m[k].c/m[k].n;return m},

<li><b>Recruiter:</b> HPSC. Screening test (100 questions, −0.25 per wrong answer, sometimes skipped), a 150-mark subject test with a 35% minimum, then an interview.</li>
<li><b>Eligibility:</b> M.Sc CS / MCA / B.Tech CS or IT with 55%, plus HTET, plus Hindi at Matric. A 2025 corrigendum added NCTE norms (PG + B.Ed); check that you meet them.</li>
<li><b>Pay:</b> Level 8, ₹47,600 basic. With 63% DA plus HRA, about ₹82–87k gross, or about ₹74–79k in hand before tax.</li>
<li><b>Pension:</b> NPS or UPS. There is no Old Pension Scheme.</li>
<li><b>Permanence:</b> a regular government post with 1–2 years of probation. The 2012 rules said "on contract" for the first 5 years; it's not confirmed whether that clause was removed, though the 2026 advertisement shows the regular pay scale. Check the current rules.</li></ul></section></div>`;
