 विसर्ग के आगे च या छ हो तो विसर्ग का <b>श्<\/b>; ट या ठ हो तो <b>ष्<\/b>; त या थ हो तो <b>स्<\/b> हो जाता है।<\/div>\n<p class=\"eq\"><span>ः<\/span> + <span>च/छ<\/span> = <b>श्<\/b> &nbsp; <span>ः<\/span> + <span>ट/ठ<\/span> = <b>ष्<\/b> &nbsp; <span>ः<\/span> + <span>त/थ<\/span> = <b>स्<\/b><\/p>\n<p><b>क्यों:<\/b> श तालव्य, ष मूर्धन्य और स दंत्य है, यानी विसर्ग उसी स्थान की ऊष्म ध्वनि बन जाता है जिस स्थान का अगला वर्ण है: च-वर्ग (तालु) के पहले श्, ट-वर्ग (मूर्धा) के पहले ष्, त-वर्ग (दंत) के पहले स्।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>निश्चल<\/td><td>निः + चल<\/td><td>ः + च → श्<\/td><\/tr>\n<tr><td>निश्छिद्र<\/td><td>निः + छिद्र<\/td><td>ः + छ → श्<\/td><\/tr>\n<tr><td>धनुष्टंकार<\/td><td>धनुः + टंकार<\/td><td>ः + ट → ष्<\/td><\/tr>\n<tr><td>मनस्ताप<\/td><td>मनः + ताप<\/td><td>ः + त → स्<\/td><\/tr>\n<tr><td>निस्तार<\/td><td>निः + तार<\/td><td>ः + त → स्<\/td><\/tr><\/table>\n\n<h3>२. विसर्ग के आगे श, ष, स (पृ. ७९-८०, अंक ७९)<\/h3>\n<p>विसर्ग के बाद श्, ष्, स् आएँ तो विसर्ग जैसा का तैसा रहता है, अथवा उसके स्थान में आगे का वर्ण हो जाता है: दुः+शासन = दुःशासन या दुश्शासन; निः+संदेह = निःसंदेह या निस्संदेह। यानी दोनों रूप मान्य हैं।<\/p>\n\n<h3>३. विसर्ग के आगे क, ख, प, फ (पृ. ८०, अंक ८०)<\/h3>\n<div class=\"def\"><b>नियम<\/b> विसर्ग के आगे क, ख या प, फ आएँ तो विसर्ग में कोई विकार नहीं होता। पर यदि विसर्ग के पहले <b>इ या उ<\/b> हो, तो विसर्ग के बदले <b>ष्<\/b> हो जाता है।<\/div>\n<table><tr><th>स्थिति<\/th><th>उदाहरण<\/th><th>नियम<\/th><\/tr>\n<tr><td>अः + क ख प फ<\/td><td>रजःकण (रजः+कण), पयःपान, प्रातःकाल, अंतःकरण<\/td><td>विसर्ग बना रहता है<\/td><\/tr>\n<tr><td>इः/उः + क ख प फ<\/td><td>निष्कपट, दुष्कर्म, निष्फल, दुष्प्रकृति<\/td><td>ः → ष्<\/td><\/tr>\n<tr><td>कुछ शब्द<\/td><td>नमस्कार (नमः+कार), पुरस्कार, भास्कर, भास्पति<\/td><td>ः → स्<\/td><\/tr><\/table>\n<div class=\"trap\"><b>अपवाद (गुरु, पृ. ८०):<\/b> दुः+ख = दुःख (ष् नहीं बनता), निः+पक्ष = निःपक्ष या निष्पक्ष। विसर्ग को अकेले लिखने की भूल से बचें: दुख (तद्भव, विसर्ग के बिना) और दुःख (तत्सम) दोनों चलते हैं।<\/div>\n\n<h3>४. अः + घोष → ओ (पृ. ८०, अंक ८१)<\/h3>\n<div class=\"def\"><b>नियम<\/b> यदि विसर्ग के पहले 'अ' हो और आगे घोष व्यंजन हो, तो अ और विसर्ग (अः) के बदले <b>ओ<\/b> हो जाता है। यदि आगे भी 'अ' हो तो ओ के बाद दूसरे अ का लोप हो जाता है और उसकी जगह लुप्त अकार का चिह्न ऽ लगता है।<\/div>\n<p class=\"eq\"><span>अः<\/span> + <span>घोष वर्ण<\/span> = <b>ओ<\/b><\/p>\n<p class=\"eq\"><span>अः<\/span> + <span>अ<\/span> = <b>ओऽ<\/b><\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>अधोगति<\/td><td>अधः + गति<\/td><td>अः + ग → ओ<\/td><\/tr>\n<tr><td>मनोयोग<\/td><td>मनः + योग<\/td><td>अः + य → ओ<\/td><\/tr>\n<tr><td>तेजोराशि<\/td><td>तेजः + राशि<\/td><td>अः + र → ओ<\/td><\/tr>\n<tr><td>वयोवृद्ध<\/td><td>वयः + वृद्ध<\/td><td>अः + व → ओ<\/td><\/tr>\n<tr><td>मनोहर<\/td><td>मनः + हर<\/td><td>अः + ह → ओ<\/td><\/tr>\n<tr><td>तपोवन<\/td><td>तपः + वन<\/td><td>अः + व → ओ<\/td><\/tr>\n<tr><td>प्रथमोऽध्याय<\/td><td>प्रथमः + अध्याय<\/td><td>अः + अ → ओऽ<\/td><\/tr>\n<tr><td>मनोऽनुसार<\/td><td>मनः + अनुसार<\/td><td>अः + अ → ओऽ<\/td><\/tr><\/table>\n<div class=\"trap\"><b>अशुद्ध रूप (गुरु, पृ. ८०):<\/b> वनोवास और मनोकामना अशुद्ध हैं। 'वनवास' सीधा समास है (विसर्ग है ही नहीं), और 'मनःकामना' में विसर्ग के आगे क है, इसलिए ः बना रहता है (मनःकामना)। <b>सबसे ज़रूरी पहचान:<\/b> पहला पद ः पर समाप्त हो और ठीक पहले अ हो, तो 'ओ'।<\/div>\n\n<h3>५. इः/उः आदि + घोष → र् (पृ. ८०-८१, अंक ८२)<\/h3>\n<div class=\"def\"><b>नियम<\/b> यदि विसर्ग के पहले अ, आ को छोड़कर कोई स्वर हो और आगे कोई घोष वर्ण हो, तो विसर्ग के स्थान में <b>र्<\/b> हो जाता है।<\/div>\n<p class=\"eq\"><span>इः/उः<\/span> + <span>घोष<\/span> = <b>र्<\/b> + घोष<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>निराशा<\/td><td>निः + आशा<\/td><td>इः + आ → र्<\/td><\/tr>\n<tr><td>निर्गुण<\/td><td>निः + गुण<\/td><td>इः + ग → र्<\/td><\/tr>\n<tr><td>निरंतर<\/td><td>निः + अंतर<\/td><td>इः + अ → र्<\/td><\/tr>\n<tr><td>दुरुपयोग<\/td><td>दुः + उपयोग<\/td><td>उः + उ → र्<\/td><\/tr>\n<tr><td>दुर्जन<\/td><td>दुः + जन<\/td><td>उः + ज → र्<\/td><\/tr>\n<tr><td>बहिर्मुख<\/td><td>बहिः + मुख<\/td><td>इः + म → र्<\/td><\/tr>\n<tr><td>आशीर्वाद<\/td><td>आशीः + वाद<\/td><td>ईः + व → र्<\/td><\/tr><\/table>\n<p><b>र् के आगे र् (अ):<\/b> यदि विसर्ग से बने र् के आगे फिर र आए, तो पहले र् का लोप हो जाता है और उसके पहले का ह्रस्व स्वर दीर्घ हो जाता है: निः+रस = नीरस, निः+रोग = नीरोग। (यहाँ र्+र दो बार नहीं बोला जाता, इसलिए एक र् हटता है और उसकी कमी स्वर को लंबा करके पूरी की जाती है, जिसे 'पूर्वस्वर-दीर्घ' कहते हैं।)<\/p>\n\n<h3>६. अः + अ से भिन्न स्वर: विसर्ग का लोप (पृ. ८१, अंक ८३)<\/h3>\n<p>यदि 'अ' के आगे विसर्ग हो और उसके आगे अ को छोड़कर कोई और स्वर हो, तो विसर्ग का लोप हो जाता है और पास-पास आए हुए स्वरों की फिर संधि नहीं होती: अतः+एव = अतएव। ध्यान दें कि अ+ए की गुण या वृद्धि संधि नहीं हुई।<\/p>\n\n<h3>७. अंत्य स् और र् से बना विसर्ग (पृ. ८१, अंक ८४-८५)<\/h3>\n<p>कई विसर्ग वास्तव में 'स्' या 'र्' से बने हैं। संधि में वह मूल स्/र् लौट आता है, इसलिए रूप चौंकाने वाला दिखता है:<\/p>\n<table><tr><th>मूल रूप<\/th><th>बीच का रूप<\/th><th>अंतिम शब्द<\/th><\/tr>\n<tr><td>निस् + गुण<\/td><td>निः + गुण<\/td><td>निर्गुण<\/td><\/tr>\n<tr><td>अधस् + गति<\/td><td>अधः + गति<\/td><td>अधोगति<\/td><\/tr>\n<tr><td>यशस् + दा<\/td><td>यशः + दा<\/td><td>यशोदा<\/td><\/tr>\n<tr><td>प्रातर् + काल<\/td><td>प्रातः + काल<\/td><td>प्रातःकाल<\/td><\/tr>\n<tr><td>अंतर् + करण<\/td><td>अंतः + करण<\/td><td>अंतःकरण<\/td><\/tr>\n<tr><td>पुनर् + उक्ति<\/td><td>पुनः + उक्ति<\/td><td>पुनरुक्ति<\/td><\/tr>\n<tr><td>पुनर् + जन्म<\/td><td>पुनः + जन्म<\/td><td>पुनर्जन्म<\/td><\/tr><\/table>\n<p>यदि मूल र् के बाद अघोष आए तो विसर्ग का कोई विकार नहीं होता (प्रातःकाल, अंतःपुर)। यदि घोष आए तो र् ज्यों का त्यों रहता है (पुनर्जन्म, पुनरुक्ति)।<\/p>\n<div class=\"trap\"><b>पहचान की सीमा (गुरु, पृ. ८१):<\/b> इसी कारण 'तिरस्+हित = तिरः+हित = तिरोहित' भी <b>विसर्ग संधि<\/b> है, क्योंकि पहला पद विसर्ग (स् → ः) पर समाप्त हुआ और 'अः + घोष (ह) = ओ' लगा। 'वयोवृद्ध' (वयः+वृद्ध) और 'पुरोधा' (पुरः+धा) भी इसी तरह विसर्ग संधि हैं।<\/div>\n\n<h2>पहचान की विधि: MCQ कैसे हल करें<\/h2>\n<ol class=\"steps\">\n<li><b>सवाल क्या है?<\/b> संधि का <b>भेद<\/b> पूछा है, या <b>विच्छेद<\/b> की जाँच, या \"असंगत/अनुपयुक्त\" विकल्प ढूँढना है? असंगत वाले प्रश्न में जो विकल्प नियम के विरुद्ध हो, उसे ढूँढना है, इसलिए चारों जाँचने पड़ते हैं।<\/li>\n<li><b>शब्द को तोड़ें।<\/b> विच्छेद में पहले पद का आख़िरी वर्ण देखें: स्वर → स्वर संधि; हल् व्यंजन (त्, क्, म् आदि) → व्यंजन संधि; विसर्ग (ः) → विसर्ग संधि।<\/li>\n<li><b>स्वर संधि हो तो दोनों स्वर लिखें।<\/b> सवर्ण (अ-आ, इ-ई, उ-ऊ) → दीर्घ। पहला अ/आ और दूसरा इ/उ/ऋ → गुण। पहला अ/आ और दूसरा ए/ऐ/ओ/औ → वृद्धि। पहला इ/उ/ऋ और दूसरा असवर्ण → यण् (जोड़ में य्/व्/र् दिखे)। पहला ए/ऐ/ओ/औ → अयादि (जोड़ में अय/आय/अव/आव दिखे)।<\/li>\n<li><b>व्यंजन संधि हो तो पहला व्यंजन और दूसरा वर्ण देखें।<\/b> त्/द् + च, ज, ट, ड, ल, श, ह या स्वर/घोष? म् + स्पर्श या अंतस्थ? स्वर + छ? न → ण (ऋ र ष के बाद)? स → ष (इ-उ के बाद)? पहले पद के अंत में क्, च्, ट्, प् हों और बाद में घोष तो तीसरा वर्ण।<\/li>\n<li><b>विसर्ग संधि हो तो विसर्ग के पहले का स्वर देखें:<\/b> अः + घोष → ओ; इः/उः + घोष → र्; ः + च-छ/ट-ठ/त-थ → श्/ष्/स्; ः + क ख प फ → ः बना रहे या इः/उः के बाद ष्।<\/li>\n<li><b>विकल्प को वापस जोड़कर देखें।<\/b> विच्छेद दिया हो तो नियम से जोड़कर देखें कि वही शब्द बनता है या नहीं (कुश+असन से कुशासन नहीं बनता, कुश+आसन से बनता है, क्योंकि 'आसन' में आ है)।<\/li>\n<li><b>शब्द का अर्थ भी जाँचें।<\/b> 'जानकीश' = जानकी (सीता) के ईश (राम) → जानकी+ईश, 'जनक+ईश' (जनक के ईश) नहीं।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>जोड़ा<\/th><th>कैसे अलग करें<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>दीर्घ / गुण<\/td><td>दूसरा स्वर अ/आ हो → दीर्घ; इ/उ/ऋ हो → गुण (पहला अ/आ दोनों में)<\/td><td>विद्यालय (दीर्घ), महेश (गुण)<\/td><\/tr>\n<tr><td>गुण / वृद्धि<\/td><td>दूसरा इ ई उ ऊ ऋ → गुण; ए ऐ ओ औ → वृद्धि<\/td><td>महेश / सदैव<\/td><\/tr>\n<tr><td>गुण / यण्<\/td><td>पहला अ/आ → गुण; पहला इ/उ/ऋ → यण्<\/td><td>देवेंद्र / अत्यंत<\/td><\/tr>\n<tr><td>यण् / अयादि<\/td><td>जोड़ में आधा य्/व्/र् पहले आए → यण्; पहले अ/आ फिर य/व आए → अयादि<\/td><td>स्वागत / पावन<\/td><\/tr>\n<tr><td>दीर्घ (दैत्यारि) / यण्<\/td><td>पहले शब्द के अंत में 'य' दिखने भर से यण् नहीं; विच्छेद खोलें: दैत्य+अरि (अ+अ)<\/td><td>दैत्यारि दीर्घ, अत्यंत यण्<\/td><\/tr>\n<tr><td>व्यंजन / विसर्ग<\/td><td>पहले पद का अंत त्/क्/म् आदि हो तो व्यंजन; ः हो तो विसर्ग<\/td><td>जगदीश / मनोहर<\/td><\/tr>\n<tr><td>अः + घोष (ओ) / गुण (ओ)<\/td><td>'ओ' दिखे तो पूछें: बीच में ः था? ः था → विसर्ग; अ+उ था → गुण<\/td><td>मनोहर / चंद्रोदय<\/td><\/tr>\n<tr><td>संधि / समास<\/td><td>वर्ण-मेल → संधि; अर्थ-संबंध (का, के लिए) → समास<\/td><td>जगदीश (दोनों)<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n<h3>HTET 2020 Q37<\/h3>\n<p>प्रश्न: किस विकल्प में व्यंजन संधि का प्रयोग <b>नहीं<\/b> हुआ है? (A) चिदाभास (B) वागीश्वर (C) तदर्थ (D) तिरोहित<\/p>\n<div class=\"ex\"><b>नियम से उत्तर: (D) तिरोहित<\/b><ol class=\"steps\">\n<li>(A) चिदाभास = चित् + आभास। पहला पद 'त्' (व्यंजन) पर समाप्त, त् + आ → द्: व्यंजन संधि।<\/li>\n<li>(B) वागीश्वर = वाक् + ईश्वर। क् + ई → ग्: व्यंजन संधि।<\/li>\n<li>(C) तदर्थ = तत् + अर्थ। त् + अ → द्: व्यंजन संधि।<\/li>\n<li>(D) तिरोहित = तिरः (मूल तिरस्) + हित। पहला पद विसर्ग पर समाप्त, अः + ह (घोष) → ओ: यह <b>विसर्ग संधि<\/b> है, व्यंजन संधि नहीं।<\/li><\/ol>\n<b>कुंजी का मामला:<\/b> इस प्रश्न की उपलब्ध उत्तर-कुंजी में (B) दर्ज है, यानी वागीश्वर। पर वाक्+ईश्वर में क्+ई → ग् होना गुरु के नियम (पृ. ७७, अंक ६७) से साफ़ व्यंजन संधि है, जैसे वाक्+ईश = वागीश। इसलिए नियम की दृष्टि से सही उत्तर (D) बनता है, और कुंजी संदिग्ध मानी जानी चाहिए। परीक्षा में जब कुंजी और नियम में टकराव दिखे, तो नियम को पक्का आधार मानें और ऐसे प्रश्न से नियम ही सीखें।<\/div>\n<h3>HTET 2021 Q34<\/h3>\n<p>प्रश्न: निम्न में से <b>सही<\/b> संधि-युक्त शब्द कौन-सा है? (A) युधि + स्थिर = युधिष्ठिर (B) गुरु + उपदेश = गुरोपदेश (C) अभि + इप्सा = अभिप्सा (D) गति + अवरोध = गत्यावरोध<\/p>\n<div class=\"ex\"><b>उत्तर: (A)<\/b><ol class=\"steps\">\n<li>(A) युधि+स्थिर: इ के बाद 'स' → 'ष' (और स्थ → ष्ठ), इसलिए युधिष्ठिर। सही (गुरु, पृ. ७८, अंक ७६)।<\/li>\n<li>(B) गुरु+उपदेश: उ+उ सवर्ण हैं, इसलिए दीर्घ → ऊ: गुरूपदेश। 'गुरोपदेश' ग़लत (उ+उ से 'ओ' नहीं बनता)।<\/li>\n<li>(C) अभि+इप्सा: इ+इ = ई (दीर्घ), इसलिए अभीप्सा। 'अभिप्सा' ग़लत।<\/li>\n<li>(D) गति+अवरोध: इ+अ → य (यण्), इसलिए गत्यवरोध। 'गत्यावरोध' में फ़ालतू 'आ' जुड़ गया, ग़लत।<\/li><\/ol><\/div>\n<h3>HTET 2022 Q39<\/h3>\n<p>प्रश्न: किस विकल्प में विसर्ग संधि का प्रयोग हुआ है? (A) युधिष्ठिर (B) वयोवृद्ध (C) परोपदेश (D) निष्ठुर<\/p>\n<div class=\"ex\"><b>उत्तर: (B) वयोवृद्ध<\/b><ol class=\"steps\">\n<li>(A) युधिष्ठिर = युधि+स्थिर, पहला पद इ (स्वर) पर समाप्त, स → ष: व्यंजन संधि (स का ष होना)।<\/li>\n<li>(B) वयोवृद्ध = वयः + वृद्ध। पहला पद विसर्ग पर समाप्त, अः + व (घोष) → ओ: विसर्ग संधि (गुरु, पृ. ८०, अंक ८१)।<\/li>\n<li>(C) परोपदेश = पर + उपदेश। अ+उ = ओ: स्वर (गुण) संधि। इसमें 'ओ' दिखता है, पर बीच में विसर्ग नहीं था।<\/li>\n<li>(D) निष्ठुर में 'निः' के बाद ठ दिखता है, पर इसे सामान्यतः एक अखंड शब्द के रूप में पढ़ा जाता है, इसलिए प्रश्न का स्पष्ट उत्तर (B) ही है।<\/li><\/ol><\/div>\n<h3>HTET 2023 Q34<\/h3>\n<p>प्रश्न: निम्नलिखित में से किस विकल्प का शब्द संधि-विच्छेद की दृष्टि से <b>संगत<\/b> है? (A) कुशासन = कुश + असन (B) वार्तालाप = वार्ता + अलाप (C) जानकीश = जनक + ईश (D) लघूर्मि = लघु + ऊर्मि<\/p>\n<div class=\"ex\"><b>उत्तर: (D)<\/b><ol class=\"steps\">\n<li>(A) कुशासन: कुश+आसन (अ+आ = आ)। 'असन' लेने पर कुशसन बनता, इसलिए ग़लत।<\/li>\n<li>(B) वार्तालाप: वार्ता+आलाप (आ+आ = आ)। 'अलाप' से वार्तालाप नहीं बनता, ग़लत।<\/li>\n<li>(C) जानकीश: जानकी+ईश (ई+ई = ई, दीर्घ)। 'जनक+ईश' से जनकेश बनता, ग़लत।<\/li>\n<li>(D) लघूर्मि = लघु+ऊर्मि: उ+ऊ = ऊ (दीर्घ, गुरु पृ. ७४)। सही।<\/li><\/ol><\/div>\n<h3>HTET 2024 Q39<\/h3>\n<p>प्रश्न: संधि की दृष्टि से <b>अनुपयुक्त<\/b> विकल्प चुनिए: (A) दैत्यारि, गत्यानुसार, अगन्याशय: यण् संधि (B) मिताहार, विकलांग, भूर्ध्व: दीर्घ संधि (C) दिग्विजय, अब्ज, वृहन्नेत्र: व्यंजन संधि (D) वयोवृद्ध, पुरोधा, प्रादुर्भूत: विसर्ग संधि<\/p>\n<div class=\"ex\"><b>उत्तर: (A)<\/b><ol class=\"steps\">\n<li>(A) में 'दैत्यारि' = दैत्य+अरि है। यहाँ अ+अ = आ, यह <b>दीर्घ<\/b> संधि है, यण् नहीं। इसलिए यह समूह \"यण् संधि\" कहना अनुपयुक्त है। (गत्यनुसार और अग्न्याशय यण् हैं।)<\/li>\n<li>(B) मिताहार = मित+आहार (अ+आ = आ), विकलांग = विकल+अंग (अ+अ = आ), भूर्ध्व = भू+ऊर्ध्व (ऊ+ऊ = ऊ): सभी दीर्घ। उपयुक्त।<\/li>\n<li>(C) दिग्विजय = दिक्+विजय, अब्ज = अप्+ज, वृहन्नेत्र = बृहत्+नेत्र (त् + न → न्): सभी व्यंजन। उपयुक्त।<\/li>\n<li>(D) वयोवृद्ध = वयः+वृद्ध, पुरोधा = पुरः+धा, प्रादुर्भूत = प्रादुः+भूत (उः + भ → र्): सभी विसर्ग। उपयुक्त।<\/li><\/ol>\n<b>नोट:<\/b> विकल्पों में 'अगन्याशय' और 'वृहन्नेत्र' की वर्तनी भी मानक नहीं है (अग्न्याशय, बृहन्नेत्र)। पर प्रश्न का निर्णायक कारण (A) में संधि का भेद ग़लत होना है।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>संधि = दो वर्णों के पास आने पर उच्चारण की सुविधा के लिए होने वाला विकार (गुरु, पृ. ७२)। संयोग में वर्ण ज्यों के त्यों रहते हैं; समास शब्दों का मेल है।<\/li>\n<li>तीन भेद: स्वर (पहला पद स्वर पर), व्यंजन (हल् व्यंजन पर), विसर्ग (ः पर)।<\/li>\n<li>दीर्घ: सवर्ण स्वर मिलें → आ, ई, ऊ। गुण: अ/आ + इ/ई = ए, + उ/ऊ = ओ, + ऋ = अर्।<\/li>\n<li>वृद्धि: अ/आ + ए/ऐ = ऐ; + ओ/औ = औ।<\/li>\n<li>यण्: इ/ई → य्, उ/ऊ → व्, ऋ → र् (आगे असमान स्वर); अयादि: ए → अय्, ऐ → आय्, ओ → अव्, औ → आव्।<\/li>\n<li>व्यंजन: क्,च्,ट्,प् + घोष → ग्,ज्,ड्,ब्; + न/म → ङ्,ण्,न्,म्। त् → द् (घोष), च्, ज्, ट्, ड्, ल् (संबंधित वर्ण के आगे); त्+श = च्छ; त्+ह = द्ध।<\/li>\n<li>स्वर + छ → च्छ; म् + स्पर्श = अनुस्वार/पंचम; म् + य र ल व श ष स ह = अनुस्वार; ऋ-र-ष के बाद न → ण; इ-उ के बाद स → ष।<\/li>\n<li>विसर्ग: अः + घोष → ओ; इः/उः + घोष → र्; ः + च-छ → श्, ट-ठ → ष्, त-थ → स्; ः + क-ख-प-फ → ः बना रहे (इः/उः के बाद ष्)।<\/li>\n<li>याद रखने वाले अपवाद: दुःख, सम्राट, विस्मरण/अनुसरण/विसर्ग, गुरूपदेश, अभीप्सा, अक्षौहिणी, प्रौढ, खैर।<\/li>\n<li>HTET में जाल: दैत्यारि (दीर्घ), गत्यवरोध (गत्यावरोध नहीं), गुरूपदेश (गुरोपदेश नहीं), वयोवृद्ध-तिरोहित (विसर्ग), चिदाभास-तदर्थ-वागीश (व्यंजन)।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: 'महोत्सव' का संधि-विच्छेद और भेद: (A) महा+उत्सव, गुण (B) महा+उत्सव, वृद्धि (C) मह+उत्सव, दीर्घ (D) महो+त्सव, यण्<\/summary><p><b>उत्तर: (A)<\/b> आ+उ = ओ, गुण संधि (गुरु पृ. ७४)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'अन्वेषण' में कौन-सी संधि है? (A) गुण (B) वृद्धि (C) यण् (D) अयादि<\/summary><p><b>उत्तर: (C)<\/b> अनु+एषण: उ → व्, यण् संधि।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'पावन' का संधि-विच्छेद: (A) पा+वन (B) पो+अन (C) पौ+अन (D) पै+अन<\/summary><p><b>उत्तर: (C)<\/b> औ → आव्: पौ+अन = पावन (अयादि)। पो+अन = पवन।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'उज्ज्वल' का सही संधि-विच्छेद: (A) उज्+ज्वल (B) उत्+ज्वल (C) उद्+ज्वल (D) उच्+ज्वल<\/summary><p><b>उत्तर: (B)<\/b> त् + ज → ज्: उज्ज्वल, व्यंजन संधि (पृ. ७७)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: विसर्ग संधि का उदाहरण नहीं है: (A) मनोहर (B) निराश (C) उन्नति (D) दुष्कर्म<\/summary><p><b>उत्तर: (C)<\/b> उन्नति = उत्+नति, त्+न → न्: व्यंजन संधि। बाकी तीनों में निः/मनः/दुः हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'सज्जन' = (A) सद्+जन (B) सत्+जन (C) सः+जन (D) सज्+जन<\/summary><p><b>उत्तर: (B)<\/b> त् + ज → ज्, इसलिए सज्जन। व्यंजन संधि।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'विद्यार्थी' में संधि: (A) गुण (B) दीर्घ (C) वृद्धि (D) यण्<\/summary><p><b>उत्तर: (B)<\/b> विद्या+अर्थी: आ+अ = आ, दीर्घ।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'निश्चल' का विच्छेद: (A) नि+चल (B) निः+चल (C) निर्+चल (D) निश्+चल<\/summary><p><b>उत्तर: (B)<\/b> निः+चल: विसर्ग + च → श्। (पृ. ७९)<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: जो शब्द गुण संधि का नहीं है: (A) देवेंद्र (B) रमेश (C) सदैव (D) सप्तर्षि<\/summary><p><b>उत्तर: (C)<\/b> सदैव = सदा+एव, आ+ए = ऐ, यह वृद्धि संधि है। बाकी तीनों गुण हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'संयोग' = सम्+योग में म् का क्या हुआ? (A) न् (B) अनुस्वार (C) ङ् (D) लोप<\/summary><p><b>उत्तर: (B)<\/b> म् + अंतस्थ (य) = अनुस्वार (पृ. ७८, अंक ७४)।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामता प्रसाद गुरु, हिंदी व्याकरण: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७२\">पृ. ७२<\/a> (संधि की परिभाषा, संधि और संयोग), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७३\">७३-७४<\/a> (तीन भेद, दीर्घ संधि), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७५\">७५-७७<\/a> (गुण, वृद्धि, यण्, अयादि), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७७\">७७-७९<\/a> (व्यंजन संधि), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७९\">७९-८१<\/a> (विसर्ग संधि); संयोग: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५९\">पृ. ५९<\/a>। 'अयादि' नाम और स्वर संधि के पाँच भेदों की गिनती स्कूली पाठ्यपुस्तकों की परंपरा है; गुरु इनके नियम तो देते हैं पर यह नाम नहीं।<\/p>\n","hin-sam":"<p class=\"key\"><b>HTET में क्या पूछा गया:<\/b> समास से 2020–2024 में 6 प्रश्न (लगभग हर साल 1)। 5 प्रश्न \"असंगत / नहीं / संगत\" वाले भेद-पहचान के थे: किसी शब्द को ग़लत समास-नाम या ग़लत विग्रह दिया गया है, उसे पकड़ना है। एक प्रश्न सीधा था: \"अव्ययीभाव कौन-सा?\" पूछे गए समास: बहुव्रीहि, तत्पुरुष (कर्म, करण, अपादान, अधिकरण, संबंध), कर्मधारय, द्विगु, द्वंद्व (इतरेतर, समाहार) और अव्ययीभाव। यानी हर समास तैयार रखना है, और सबसे ज़्यादा पैसा \"कर्मधारय / बहुव्रीहि / द्विगु\" की पहचान और \"तत्पुरुष के कारक-भेद\" पर लगा है।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जब दो या अधिक शब्द आपस में जुड़कर एक नया, छोटा शब्द बनाते हैं और उनके बीच का संबंध बताने वाले शब्द या विभक्ति-चिह्न (का, के, की, को, से, में, और, या आदि) लुप्त हो जाते हैं, तो इस जुड़ाव को <b>समास<\/b> कहते हैं। बना हुआ शब्द <b>सामासिक शब्द<\/b> (समस्त पद) कहलाता है। समस्त पद को वापस तोड़कर लिखना <b>विग्रह<\/b> कहलाता है।<\/div>\n<p>कामता प्रसाद गुरु की परिभाषा (अं. ४४५, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६३\">पृ. ४६३<\/a>): \"दो या अधिक शब्दों का परस्पर संबंध बतानेवाले शब्दों अथवा प्रत्ययों का लोप होने पर उन दो या अधिक शब्दों से जो एक स्वतंत्र शब्द बनता है उस शब्द को सामासिक शब्द कहते हैं और उन दो या अधिक शब्दों का जो संयोग होता है वह समास कहलाता है।\" उनका उदाहरण: <b>प्रेमसागर<\/b> = प्रेम का समुद्र। यहाँ \"का\" लुप्त हुआ, इसलिए प्रेमसागर सामासिक शब्द है।<\/p>\n<p>विग्रह की परिभाषा (अं. ४४७, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६४\">पृ. ४६४<\/a>): \"सामासिक शब्दों का संबंध व्यक्त कर दिखाने की रीति को विग्रह कहते हैं।\" जैसे \"धन-संपन्न\" का विग्रह \"धन से संपन्न\" है, जिससे पता चलता है कि दोनों शब्द करण कारक से जुड़े हैं।<\/p>\n<p><b>समास किसलिए?<\/b> भाषा में कम शब्दों में ज़्यादा बात कहने के लिए। \"राजा का पुत्र\" कहने की जगह \"राजपुत्र\"; \"दस हैं मुँह जिसके\" कहने की जगह \"दशानन\"। रोज़ की भाषा में तार (टेलीग्राम) या SMS की तरह छोटा रूप: \"घर जल्दी आओ, पैसे की ज़रूरत\" जैसी संक्षिप्तता। समास का सबसे बड़ा काम यही है कि लंबा वाक्यांश एक शब्द बन जाए।<\/p>\n\n<h2>मूल अवधारणा: समास कैसे काम करता है<\/h2>\n<h3>पूर्वपद, उत्तरपद और प्रधान पद<\/h3>\n<p>समस्त पद में जो पहला शब्द है उसे <b>पूर्वपद<\/b> और दूसरे को <b>उत्तरपद<\/b> कहते हैं। \"राजपुत्र\" में राज पूर्वपद है, पुत्र उत्तरपद। अब सवाल: अर्थ किस पद पर टिका है? उसे <b>प्रधान पद<\/b> कहते हैं। राजपुत्र में पुत्र प्रधान है (बात पुत्र की हो रही है, राजा की नहीं)। गुरु का विभाजन-आधार यही प्रधानता है (अं. ४४९, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६५\">पृ. ४६५<\/a>): \"जिस समास में पहला शब्द प्रायः प्रधान होता है उसे अव्ययीभाव, जिसमें दूसरा शब्द प्रधान रहता है उसे तत्पुरुष, जिसमें दोनों पद प्रधान हों वह द्वंद्व, और जिसमें कोई भी शब्द प्रधान नहीं होता उसे बहुब्रीहि कहते हैं।\"<\/p>\n<table><tr><th>समास<\/th><th>प्रधान पद<\/th><th>एक पंक्ति में पहचान<\/th><\/tr>\n<tr><td>अव्ययीभाव<\/td><td>पूर्वपद<\/td><td>पूरा शब्द क्रिया-विशेषण (अव्यय) जैसा चलता है<\/td><\/tr>\n<tr><td>तत्पुरुष (कर्मधारय, द्विगु इसके उपभेद)<\/td><td>उत्तरपद<\/td><td>पहले पद के साथ कारक-चिह्न (को, से, के लिए...) छिपा है<\/td><\/tr>\n<tr><td>द्वंद्व<\/td><td>दोनों पद<\/td><td>बीच में \"और / या\" छिपा है<\/td><\/tr>\n<tr><td>बहुव्रीहि<\/td><td>कोई नहीं; अर्थ किसी तीसरे का<\/td><td>\"जिसका / जिसमें / जो\" लगाकर तीसरे को पकड़ना पड़ता है<\/td><\/tr><\/table>\n\n<h3>एक नियम: विभक्ति अंत में लगती है<\/h3>\n<p>समस्त पद में कारक-चिह्न लगाना हो तो वह <b>अंतिम शब्द के बाद<\/b> लगता है (अं. ४४८, पृ. ४६४): माँ-बाप से, राजकुल में, भाई-बहनों को। बीच में नहीं।<\/p>\n\n<h3>समास और सन्धि का अंतर<\/h3>\n<table><tr><th>बात<\/th><th>सन्धि<\/th><th>समास<\/th><\/tr>\n<tr><td>क्या जुड़ता है<\/td><td>दो <b>वर्णों<\/b> का मेल (ध्वनि बदलती है)<\/td><td>दो <b>शब्दों<\/b> का मेल (अर्थ-संबंध)<\/td><\/tr>\n<tr><td>क्या लुप्त होता है<\/td><td>कुछ नहीं; वर्ण बदलकर नया वर्ण बनता है<\/td><td>बीच के कारक-चिह्न / योजक शब्द<\/td><\/tr>\n<tr><td>तोड़ना कहलाता है<\/td><td>सन्धि-विच्छेद<\/td><td>समास-विग्रह<\/td><\/tr>\n<tr><td>उदाहरण<\/td><td>विद्या + आलय = विद्यालय<\/td><td>विद्या का आलय = विद्यालय<\/td><\/tr><\/table>\n<p>\"विद्यालय\" एक ही शब्द है और दोनों तरह से तोड़ा जा सकता है, इसलिए यह भ्रम का कारण बनता है। प्रश्न में \"विच्छेद\" लिखा हो तो वर्णों को तोड़ें (विद्या + आलय); \"विग्रह\" लिखा हो तो अर्थ-संबंध खोलें (विद्या का आलय)। गुरु (अं. ४४६, पृ. ४६३) बताते हैं कि समास में संस्कृत शब्दों की सन्धि अवश्य होती है (राम + अवतार = रामावतार), पर हिंदी और दूसरी भाषाओं के शब्दों में बहुधा नहीं होती (घर-आँगन, बेईमान)।<\/p>\n\n<h3>गुरु की गिनती और स्कूल की गिनती<\/h3>\n<div class=\"trap\"><b>ध्यान दें:<\/b> गुरु (पृ. ४६५) समास के <b>चार<\/b> मुख्य भेद मानते हैं: अव्ययीभाव, तत्पुरुष, द्वंद्व, बहुव्रीहि। कर्मधारय को वे समानाधिकरण तत्पुरुष (पृ. ४६८, ४७२) और द्विगु को \"संख्यापूर्वपद कर्मधारय\" (पृ. ४७३) कहते हैं। स्कूली पाठ्यपुस्तकों में, और इसलिए HTET में, कर्मधारय और द्विगु को अलग गिनकर <b>छह समास<\/b> पढ़ाए जाते हैं। इस पाठ में स्कूल की गिनती चलेगी, गुरु की बात जहाँ अलग है वहाँ बता दी गई है।<\/div>\n\n<div class=\"cards\">\n<div><h3>अव्ययीभाव<\/h3><p>पूर्वपद प्रधान, पूरा शब्द अव्यय<\/p><p class=\"eq\"><span>प्रति<\/span> + <span>दिन<\/span> = <b>प्रतिदिन<\/b><\/p><\/div>\n<div><h3>तत्पुरुष<\/h3><p>उत्तरपद प्रधान, कारक-चिह्न लुप्त<\/p><p class=\"eq\"><span>राजा का<\/span> + <span>पुत्र<\/span> = <b>राजपुत्र<\/b><\/p><\/div>\n<div><h3>कर्मधारय<\/h3><p>उत्तरपद प्रधान, विशेषण-विशेष्य / उपमान-उपमेय<\/p><p class=\"eq\"><span>नीला<\/span> + <span>कमल<\/span> = <b>नीलकमल<\/b><\/p><\/div>\n<div><h3>द्विगु<\/h3><p>पूर्वपद संख्या, समूह का बोध<\/p><p class=\"eq\"><span>पाँच वटों का समूह<\/span> = <b>पंचवटी<\/b><\/p><\/div>\n<div><h3>द्वंद्व<\/h3><p>दोनों पद प्रधान, \"और / या\" लुप्त<\/p><p class=\"eq\"><span>माँ<\/span> + <span>बाप<\/span> = <b>माँ-बाप<\/b><\/p><\/div>\n<div><h3>बहुव्रीहि<\/h3><p>कोई पद प्रधान नहीं, अर्थ तीसरे का<\/p><p class=\"eq\"><span>दस हैं मुँह जिसके<\/span> = <b>दशानन<\/b><\/p><\/div>\n<\/div>\n\n<h2>अव्ययीभाव समास<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस समास में <b>पहला पद प्रधान<\/b> हो और पूरा समस्त पद <b>क्रिया-विशेषण अव्यय<\/b> की तरह चले (रूप कभी न बदले), वह अव्ययीभाव है। गुरु, अं. ४५०, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६५\">पृ. ४६५<\/a>: \"जिस समास में पहला शब्द प्रधान होता है और जो समूचा शब्द क्रिया-विशेषण अव्यय होता है।\"<\/div>\n<p><b>पहचान:<\/b> समस्त पद को वाक्य में रखकर देखें। \"वह <u>प्रतिदिन<\/u> आता है।\" यहाँ प्रतिदिन \"कब / कैसे\" का उत्तर देता है और लिंग-वचन से नहीं बदलता, यानी अव्यय है।<\/p>\n\n<h3>1. संस्कृत अव्यय से बने (गुरु अं. ४५१, पृ. ४६६)<\/h3>\n<p>पूर्वपद में ये अव्यय आते हैं: <b>यथा<\/b> (अनुसार), <b>आ<\/b> (तक), <b>प्रति<\/b> (प्रत्येक), <b>यावत्<\/b> (जब तक), <b>वि<\/b> (बिना)।<\/p>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>पूर्वपद का अर्थ<\/th><\/tr>\n<tr><td>यथाशक्ति<\/td><td>शक्ति के अनुसार<\/td><td>यथा = अनुसार<\/td><\/tr>\n<tr><td>यथाविधि, यथाक्रम, यथास्थान, यथासंभव<\/td><td>विधि / क्रम / स्थान / संभव के अनुसार<\/td><td>यथा = अनुसार<\/td><\/tr>\n<tr><td>आजन्म, आमरण<\/td><td>जन्म तक, मरण तक<\/td><td>आ = तक<\/td><\/tr>\n<tr><td>आकंठ<\/td><td>कंठ तक<\/td><td>आ = तक<\/td><\/tr>\n<tr><td>यावज्जीवन<\/td><td>जीवन भर, जब तक जीवन है<\/td><td>यावत् = जब तक<\/td><\/tr>\n<tr><td>प्रतिदिन, प्रतिमास<\/td><td>दिन-दिन, मास-मास<\/td><td>प्रति = प्रत्येक<\/td><\/tr>\n<tr><td>व्यर्थ<\/td><td>अर्थ के बिना<\/td><td>वि = बिना<\/td><\/tr><\/table>\n<p>एक विशेष बात: \"अक्षि\" (आँख) अव्ययीभाव के अंत में \"अक्ष\" बन जाता है: <b>प्रत्यक्ष<\/b> (आँख के आगे), <b>समक्ष<\/b> (सामने), <b>परोक्ष<\/b> (आँख के पीछे) (अं. ४५१-आ, पृ. ४६६)।<\/p>\n\n<h3>2. हिंदी, उर्दू और मिश्रित (गुरु अं. ४५२, पृ. ४६६)<\/h3>\n<ul><li><b>हिंदी:<\/b> निडर, निधड़क, भरपेट, भरदौड़, अनजाने, भरसक<\/li>\n<li><b>उर्दू (फ़ारसी/अरबी):<\/b> हरराज, हरसाल, बेशक, बेफ़ायदा, बख़ूबी, नाहक<\/li>\n<li><b>मिश्रित:<\/b> हरघड़ी, हरदिन, बेकाम, बेखटके<\/li><\/ul>\n<div class=\"trap\"><b>ध्यान दें:<\/b> \"हर\" शब्द विशेषण है, इसलिए हरघड़ी, हरदिन को कर्मधारय मान लेने का भ्रम होता है। गुरु (पृ. ४६६ की सूचना) कहते हैं: इन समस्त शब्दों का उपयोग क्रिया-विशेषण की तरह होता है, इसलिए इन्हें <b>अव्ययीभाव<\/b> ही मानना चाहिए।<\/div>\n\n<h3>3. शब्द की द्विरुक्ति से (गुरु अं. ४५३-४५४, पृ. ४६७)<\/h3>\n<p>संस्कृत में \"प्रति\" लगता था (दिने-दिने = प्रतिदिन); हिंदी में उसी संज्ञा को दोहरा देते हैं: घर-घर, पल-पल, हाथोंहाथ, दिनोंदिन, रातोंरात, बीचोंबीच। अव्ययों की द्विरुक्ति से भी बनता है: धीरे-धीरे, पहले-पहल, धड़ाधड़, बराबर।<\/p>\n<div class=\"trap\"><b>ध्यान दें:<\/b> गुरु (पृ. ४६७ की सूचना) कहते हैं कि यही दोहराए शब्द जब संज्ञा या विशेषण की तरह आएँ तो वे <b>कर्मधारय<\/b> हैं: \"कौड़ी-कौड़ी जोड़कर\" (कौड़ी-कौड़ी विशेषण), \"नस-नस में ऐब\" (संज्ञा)। पर \"घर-घर डोलत\" (क्रिया-विशेषण) में अव्ययीभाव है। फ़ैसला उपयोग से होता है।<\/div>\n\n<h3>4. \"-पूर्वक\", \"स-\" वाले शब्द<\/h3>\n<p>प्रेमपूर्वक, विनयपूर्वक, कृपापूर्वक, सादर, सविनय, सप्रेम: गुरु (अं. ४७०, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४८३\">पृ. ४८३<\/a>) कहते हैं कि \"किसी-किसी बहुव्रीहि समास का उपयोग अव्ययीभाव के समान होता है।\" स्कूल/HTET में इन्हें <b>अव्ययीभाव<\/b> गिना जाता है (विग्रह: प्रेम के साथ, विनय के साथ), इसलिए \"अव्ययीभाव चुनिए\" वाले प्रश्न में कृपापूर्वक सही उत्तर है।<\/p>\n<div class=\"ex\"><b>अभ्यास-विग्रह:<\/b> यथाशक्ति = शक्ति के अनुसार (यथा-अनुसार); आजन्म = जन्म तक; प्रत्येक दिन = प्रतिदिन; भरपेट = पेट भरकर (भर = पूरा); बेफ़ायदा = बिना फ़ायदे के (बे = बिना); रातोंरात = रात ही रात में।<\/div>\n\n<h2>तत्पुरुष समास<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस समास में <b>दूसरा पद (उत्तरपद) प्रधान<\/b> हो और पहले पद के साथ कर्ता तथा संबोधन को छोड़कर कोई कारक-चिह्न लुप्त हो, उसे तत्पुरुष कहते हैं। गुरु, अं. ४५५, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६७\">पृ. ४६७<\/a>: \"जिस समास में दूसरा शब्द प्रधान होता है उसे तत्पुरुष कहते हैं... इसके विग्रह में कर्ता और संबोधन कारकों को छोड़ शेष कारकों की विभक्तियाँ लगती हैं।\"<\/div>\n<p><b>इसे ऐसे समझें:<\/b> \"राजपुत्र\" में असली बात पुत्र की है; \"राज\" उसकी पहचान बताता है। पहले पद के बाद छिपा \"का\" पहचान है। ठीक यही ढाँचा सब कारकों में चलता है।<\/p>\n<p>गुरु (अं. ४५६, पृ. ४६८) तत्पुरुष के दो भेद बताते हैं: <b>व्यधिकरण<\/b> (विग्रह में दोनों पदों में अलग-अलग विभक्ति, जैसे \"राजा <u>का<\/u> पुत्र\": यही असली तत्पुरुष है) और <b>समानाधिकरण<\/b> (दोनों में एक ही विभक्ति, यानी कर्मधारय, जिसे आगे देखेंगे)।<\/p>\n\n<h3>कारक के अनुसार तत्पुरुष (गुरु अं. ४५७, पृ. ४६८-४६९)<\/h3>\n<p>नाम इससे तय होता है कि पहले पद की कौन-सी विभक्ति लुप्त है। (संस्कृत में इन्हें द्वितीया, तृतीया... तत्पुरुष कहते हैं।)<\/p>\n\n<h4>1. कर्म तत्पुरुष (को)<\/h4>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>लुप्त चिह्न<\/th><\/tr>\n<tr><td>स्वर्गप्राप्त<\/td><td>स्वर्ग को प्राप्त<\/td><td>को<\/td><\/tr>\n<tr><td>जलपिपासु<\/td><td>जल को पीने का इच्छुक<\/td><td>को<\/td><\/tr>\n<tr><td>देशगत<\/td><td>देश को गया हुआ<\/td><td>को<\/td><\/tr>\n<tr><td>आशातीत<\/td><td>आशा को लाँघकर गया हुआ<\/td><td>को<\/td><\/tr><\/table>\n\n<h4>2. करण तत्पुरुष (से, द्वारा: साधन या कारण)<\/h4>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>लुप्त चिह्न<\/th><\/tr>\n<tr><td>तुलसीकृत<\/td><td>तुलसी द्वारा रचित<\/td><td>द्वारा<\/td><\/tr>\n<tr><td>ईश्वरदत्त<\/td><td>ईश्वर द्वारा दिया हुआ<\/td><td>द्वारा<\/td><\/tr>\n<tr><td>मदांध<\/td><td>मद से अंधा<\/td><td>से<\/td><\/tr>\n<tr><td>कष्टसाध्य, श्रमसाध्य<\/td><td>कष्ट / श्रम से साध्य<\/td><td>से<\/td><\/tr>\n<tr><td>मनमाना, मुँहमाँगा<\/td><td>मन से माना हुआ, मुँह से माँगा<\/td><td>से<\/td><\/tr>\n<tr><td>गुणहीन<\/td><td>गुण से हीन<\/td><td>से<\/td><\/tr><\/table>\n\n<h4>3. सम्प्रदान तत्पुरुष (के लिए)<\/h4>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>लुप्त चिह्न<\/th><\/tr>\n<tr><td>रसोईघर<\/td><td>रसोई के लिए घर<\/td><td>के लिए<\/td><\/tr>\n<tr><td>देशभक्ति<\/td><td>देश के लिए भक्ति<\/td><td>के लिए<\/td><\/tr>\n<tr><td>कृष्णार्पण<\/td><td>कृष्ण के लिए अर्पण<\/td><td>के लिए<\/td><\/tr>\n<tr><td>हथकड़ी, राहखर्च, बलि-पशु<\/td><td>हाथ के लिए कड़ी, राह के लिए खर्च, बलि के लिए पशु<\/td><td>के लिए<\/td><\/tr><\/table>\n\n<h4>4. अपादान तत्पुरुष (से: अलग होना, दूर होना)<\/h4>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>लुप्त चिह्न<\/th><\/tr>\n<tr><td>ऋणमुक्त<\/td><td>ऋण से मुक्त<\/td><td>से (अलगाव)<\/td><\/tr>\n<tr><td>पदच्युत<\/td><td>पद से च्युत<\/td><td>से<\/td><\/tr>\n<tr><td>जन्मांध<\/td><td>जन्म से अंधा<\/td><td>से<\/td><\/tr>\n<tr><td>जातिभ्रष्ट, धर्मविमुख<\/td><td>जाति से भ्रष्ट, धर्म से विमुख<\/td><td>से<\/td><\/tr>\n<tr><td>देशनिकाला, कामचोर<\/td><td>देश से निकाला, काम से जी चुराने वाला<\/td><td>से<\/td><\/tr><\/table>\n<div class=\"trap\"><b>करण और अपादान दोनों में \"से\" है।<\/b> भेद: जहाँ \"से\" का मतलब <b>साधन / कारण<\/b> (किससे किया) है वहाँ करण; जहाँ <b>अलग होना / दूरी / भय या मुक्ति<\/b> है वहाँ अपादान। मदांध (मद के कारण अंधा) = करण; जन्मांध (जन्म से ही अंधा, जन्म-बिंदु से आरंभ) और ऋणमुक्त (ऋण से छूटा) = अपादान।<\/div>\n\n<h4>5. संबंध तत्पुरुष (का, के, की)<\/h4>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>टिप्पणी<\/th><\/tr>\n<tr><td>राजपुत्र, राजदरबार, राजपूत<\/td><td>राजा का पुत्र / दरबार / पुत्र<\/td><td>सबसे अधिक पाया जाने वाला<\/td><\/tr>\n<tr><td>देवालय, पितृगृह, सेनानायक<\/td><td>देव का आलय, पिता का घर, सेना का नायक<\/td><td><\/td><\/tr>\n<tr><td>पराधीन, प्रजापति<\/td><td>पर के अधीन, प्रजा का पति<\/td><td><\/td><\/tr>\n<tr><td>बैलगाड़ी, पनचक्की, रामकहानी<\/td><td>बैलों की गाड़ी, पानी की चक्की, राम की कहानी<\/td><td>हिंदी के<\/td><\/tr>\n<tr><td>सचिवालय<\/td><td>सचिवों का आलय<\/td><td>(2022 का प्रश्न)<\/td><\/tr><\/table>\n<p>गुरु की सूचना (पृ. ४६९): षष्ठी (संबंध) तत्पुरुष के उदाहरण सब भाषाओं में बहुत मिलते हैं; अधिकांश व्यक्तिवाचक संज्ञाएँ इसी से बनती हैं।<\/p>\n\n<h4>6. अधिकरण तत्पुरुष (में, पर)<\/h4>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>लुप्त चिह्न<\/th><\/tr>\n<tr><td>ग्रामवास<\/td><td>ग्राम में वास<\/td><td>में<\/td><\/tr>\n<tr><td>गृहस्थ<\/td><td>गृह में स्थित<\/td><td>में<\/td><\/tr>\n<tr><td>कलाप्रवीण<\/td><td>कला में प्रवीण<\/td><td>में<\/td><\/tr>\n<tr><td>कूपमंडूक<\/td><td>कूप का (में रहने वाला) मेंढक<\/td><td>में<\/td><\/tr>\n<tr><td>प्रेममग्न, देशाटन, दानवीर<\/td><td>प्रेम में मग्न, देश में अटन, दान में वीर<\/td><td>में<\/td><\/tr>\n<tr><td>आपबीती, कानाफूसी<\/td><td>आप पर बीती, कान में फुसफुस<\/td><td>पर / में<\/td><\/tr><\/table>\n<div class=\"trap\"><b>कारक-नाम विग्रह पर टिका है।<\/b> गुरु (अं. ४५७ की सूचना, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७०\">पृ. ४७०<\/a>) साफ़ कहते हैं: विभक्तियों के संबंध से मतभेद की संभावना रहती है, पर यह अप्रधान है; \"कोई एक तत्पुरुष किस कारक का है, इसका निर्णय उस समास के योग्य विग्रह पर अवलंबित है।\" उनके अपने उदाहरण: \"वचन-चातुरी\" अधिकरण है (\"वचन में चातुरी\"), पर कोई \"वचन की चातुरी\" विग्रह करके संबंध मान ले तो वह भी अशुद्ध नहीं। इसलिए परीक्षा में पहले यह जाँचें कि दिए गए कारक-नाम वाले विग्रह से शब्द का अर्थ सधता है या नहीं।<\/div>\n\n<h3>तत्पुरुष के अन्य उपभेद<\/h3>\n<h4>नञ् तत्पुरुष (निषेध / अभाव)<\/h4>\n<p>अभाव या निषेध के अर्थ में शब्द के पहले <b>अ<\/b> (स्वर से पहले <b>अन्<\/b>) लगने पर बनता है (गुरु अं. ४६०, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७१\">पृ. ४७१<\/a>)।<\/p>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>भाषा<\/th><\/tr>\n<tr><td>अधर्म, अन्याय, अयोग्य<\/td><td>न धर्म, न न्याय, न योग्य<\/td><td>संस्कृत<\/td><\/tr>\n<tr><td>अनाचार, अनिष्ट<\/td><td>न आचार, न इष्ट (अन्, क्योंकि आगे स्वर)<\/td><td>संस्कृत<\/td><\/tr>\n<tr><td>अनबन, अनजाना, अधूरा, अटूट, अलग<\/td><td>बन न होना, जाना न हुआ...<\/td><td>हिंदी<\/td><\/tr>\n<tr><td>नापसंद, नालायक, ग़ैरहाज़िर<\/td><td>पसंद नहीं, लायक नहीं, हाज़िर नहीं<\/td><td>उर्दू<\/td><\/tr><\/table>\n<p>निषेध के चार अर्थ (गुरु की सूचना): <b>भिन्नता<\/b> (अब्राह्मण = ब्राह्मण से भिन्न), <b>अभाव<\/b> (अज्ञान = ज्ञान का अभाव), <b>अयोग्यता<\/b> (अकाल = अनुचित काल), <b>विरोध<\/b> (अनीति = नीति का उलटा)। कहीं \"न\" अव्यय आता है: नक्षत्र, नास्तिक, नपुंसक।<\/p>\n\n<h4>उपपद तत्पुरुष<\/h4>\n<p>जब तत्पुरुष का दूसरा पद ऐसा कृदंत हो जिसका <b>अकेले (स्वतंत्र) प्रयोग नहीं हो सकता<\/b>, तब उपपद समास होता है (गुरु अं. ४५९, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७०\">पृ. ४७०-४७१<\/a>)।<\/p>\n<ul><li>संस्कृत: ग्रंथकार, तटस्थ, जलद (जल देने वाला), उरग (छाती से चलने वाला), कृतघ्न, कृतज्ञ, नृप। यहाँ कार, स्थ, द, ग, घ्न, ज्ञ, प अकेले नहीं चलते।<\/li>\n<li>हिंदी: लकड़फोड़, तिलचट्टा, कनकटा, मुँडचीरा, बटमार, चिड़ीमार, पनडुब्बी, घर-घुसा।<\/li>\n<li>उर्दू: ग़रीबनिवाज़, कलमतराश, चोबदार, सौदागर।<\/li><\/ul>\n<div class=\"trap\"><b>उपपद नहीं:<\/b> गुरु के अनुसार जलधर, पापहर, जलचर उपपद नहीं हैं, क्योंकि धर, हर, चर का दूसरी जगह स्वतंत्र प्रयोग होता है। गुरु जलज को अधिकरण तत्पुरुष (जल में जन्मा, पृ. ४६९) मानते हैं; स्कूलों में जलज, पंकज जैसे \"-ज\" वाले शब्द उपपद गिने जाने का चलन है। प्रश्न में दोनों में से जो विकल्प दिया हो, उसे देखकर चलें।<\/div>\n\n<h4>उपसर्गपूर्व (गुरु: \"आदि\") तत्पुरुष<\/h4>\n<p>जिस तत्पुरुष में पहले स्थान पर उपसर्ग हो (अं. ४६१, पृ. ४७१): प्रतिध्वनि, अतिक्रम, प्रतिबिंब, अतिवृष्टि, उपवेद, प्रगति, दुर्गुण। \"ई\" लगकर बने वशीकरण, फलीभूत, स्पष्टीकरण भी एक प्रकार के तत्पुरुष हैं (पृ. ४७२)।<\/p>\n\n<h4>अलुक् तत्पुरुष<\/h4>\n<p>जिस तत्पुरुष में पहले पद की विभक्ति <b>लुप्त नहीं होती<\/b>, उसे अलुक् समास कहते हैं (गुरु अं. ४५८, पृ. ४७०): मनसिज (मन में उत्पन्न: \"में\" की विभक्ति \"सि\" बची), युधिष्ठिर (युद्ध में स्थिर), खेचर (आकाश में चलने वाला), वाचस्पति, आत्मनेपद। हिंदी में: ऊटपटाँग, चूहेमार।<\/p>\n<p>बीच में एक नियम: \"दीनानाथ\" में \"दीन\" का \"ना\" लंबा हो गया है, फिर भी यह संबंध तत्पुरुष है (दीनों का नाथ) (पृ. ४७०)।<\/p>\n\n<h2>कर्मधारय समास<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस तत्पुरुष समास में <b>दोनों पदों के साथ एक ही विभक्ति<\/b> (कर्ता की) आती है, उसे समानाधिकरण तत्पुरुष या कर्मधारय कहते हैं। उत्तरपद प्रधान रहता है। पूर्वपद उत्तरपद की विशेषता बताता है, या उससे उसकी तुलना की जाती है। (गुरु अं. ४६२, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७२\">पृ. ४७२<\/a>)<\/div>\n<p><b>विग्रह का साँचा:<\/b> \"<u>... है जो<\/u> ...\" या \"<u>... रूपी<\/u> ...\" या \"<u>... के समान<\/u> ...\". कारक-चिह्न (को, से, का) नहीं आता; आता है \"है जो\", \"रूपी\", \"-सा / के समान\"।<\/p>\n<p class=\"eq\"><span>पीत<\/span> + <span>अंबर<\/span> = <b>पीतांबर<\/b> (पीला है जो वस्त्र)<\/p>\n\n<h3>क. विशेषता बताने वाला (विशेषण-विशेष्य)<\/h3>\n<table><tr><th>प्रकार<\/th><th>उदाहरण<\/th><th>विग्रह<\/th><\/tr>\n<tr><td>पहला पद विशेषण<\/td><td>महाजन, नीलकमल, परमानंद, सद्गुण<\/td><td>महान जो जन; नीला जो कमल; परम जो आनंद<\/td><\/tr>\n<tr><td><\/td><td>कालीमिर्च, नीलगाय, खड़ीबोली, कालापानी, भलामानस<\/td><td>काली जो मिर्च; नीली जो गाय (हिंदी के)<\/td><\/tr>\n<tr><td>दूसरा पद विशेषण<\/td><td>पुरुषोत्तम, नराधम, मुनिवर<\/td><td>पुरुषों में जो उत्तम; नरों में जो अधम<\/td><\/tr>\n<tr><td>दोनों पद विशेषण<\/td><td>नीलपीत, शीतोष्ण, लालपीला, भलाबुरा, मोटाताजा<\/td><td>जो नीला भी है पीला भी<\/td><\/tr>\n<tr><td>अव्यय/उपसर्ग पहले<\/td><td>दुर्वचन, निराशा, सुयोग, अधमरा<\/td><td>बुरा वचन; आशा से रहित<\/td><\/tr><\/table>\n<p>गुरु की सूचना (पृ. ४७२): हिंदी में विशेषण-पूर्वपद कर्मधारय के चुने हुए उदाहरण मिलते हैं, क्योंकि हिंदी में विशेषण विभक्ति छोड़कर विशेष्य में नहीं मिलता। इसीलिए कालीमिर्च, छुटभैया, बड़ाघर जैसे वे ही शब्द बनते हैं जिनमें रूपांतर हो या कोई विशेष वस्तु का बोध हो।<\/p>\n\n<h3>ख. तुलना वाला (उपमान-उपमेय)<\/h3>\n<table><tr><th>प्रकार<\/th><th>उदाहरण<\/th><th>विग्रह<\/th><\/tr>\n<tr><td>उपमान पहले<\/td><td>चंद्रमुख, घनश्याम<\/td><td>चंद्र के समान मुख; घन के समान श्याम<\/td><\/tr>\n<tr><td>उपमान बाद में<\/td><td>चरणकमल, पाणिपल्लव<\/td><td>कमल के समान चरण; पल्लव के समान पाणि (हाथ)<\/td><\/tr>\n<tr><td>रूपक (\"ही / रूपी\")<\/td><td>गुरुदेव, पुरुषरत्न, बुद्धिबल<\/td><td>गुरु ही देव; पुरुष रूपी रत्न; बुद्धि ही बल<\/td><\/tr><\/table>\n<p>गुरु (अं. ४६४, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७४\">पृ. ४७४-४७५<\/a>) इन्हें उपमावाचक कर्मधारय कहते हैं और चार भेद करते हैं: उपमान-पूर्वपद (चंद्रमुख), उपमानोत्तरपद (चरणकमल), अवधारणा-पूर्वपद (गुरुदेव: गुरु ही देव), अवधारणोत्तरपद (साधु-समाज-प्रयाग: साधुसमाज रूपी प्रयाग)।<\/p>\n\n<h3>ग. मध्यमपदलोपी<\/h3>\n<p>जहाँ बीच का कोई शब्द छिपा हो और विग्रह में खोलना पड़े (गुरु अं. ४६३-७, पृ. ४७४): दही-बड़ा (दही में डूबा हुआ बड़ा), पर्णशाला (पर्ण से बनी शाला), गुड़धानी, जेबघड़ी (जेब में रखी जाने वाली घड़ी), छायातरु। इसे लुप्तपद या मध्यमपदलोपी कहते हैं।<\/p>\n<div class=\"ex\"><b>कर्मधारय के और उदाहरण (पिछले प्रश्नों से):<\/b> कनकलता = कनक (सोने) के समान लता; पाषाणहृदय = पाषाण के समान हृदय; दीर्घश्वास = दीर्घ है जो श्वास; नवयुवक = नया है जो युवक; शुभंकर (शुभ को करने वाला) यहाँ तत्पुरुष है।<\/div>\n\n<h2>द्विगु समास<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस समास का <b>पहला पद संख्यावाचक<\/b> हो और जिससे <b>समूह या समाहार<\/b> का बोध हो, उसे द्विगु कहते हैं। गुरु (अं. ४६३-६, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७३\">पृ. ४७३<\/a>) इसे \"संख्यापूर्वपद कर्मधारय\" कहते हैं और लिखते हैं कि \"इसी समास को संस्कृत व्याकरण में द्विगु कहते हैं।\"<\/div>\n<p><b>विग्रह का साँचा:<\/b> \"<u>(संख्या)<\/u> ... का समूह / समाहार\".<\/p>\n<table><tr><th>शब्द<\/th><th>विग्रह<\/th><th>टिप्पणी<\/th><\/tr>\n<tr><td>त्रिभुवन<\/td><td>तीन भुवनों का समाहार<\/td><td>गुरु का अपना उदाहरण<\/td><\/tr>\n<tr><td>त्रैलोक्य / त्रिलोकी<\/td><td>तीनों लोकों का समाहार<\/td><td><\/td><\/tr>\n<tr><td>पंचवटी<\/td><td>पाँच वटों का समूह<\/td><td><\/td><\/tr>\n<tr><td>चौराहा<\/td><td>चार राहों का समूह<\/td><td>2022 का प्रश्न<\/td><\/tr>\n<tr><td>चौमासा, दोपहर<\/td><td>चार मासों का समूह, दो पहरों का समूह<\/td><td>हिंदी<\/td><\/tr>\n<tr><td>पंसेरी, दुअन्नी, सतसई<\/td><td>पाँच सेर का माप, दो आने का सिक्का, सात सौ का समूह<\/td><td>हिंदी<\/td><\/tr>\n<tr><td>नवरात्र<\/td><td>नौ रात्रियों का समूह<\/td><td>रात्रि अंत में \"रात्र\" बनती है (पृ. ४८४)<\/td><\/tr><\/table>\n<p>गुरु की सूची (पृ. ४७३) में चतुष्पदी, त्रिकाल, अष्टाध्यायी, छटाम, दुपट्टा, चौघड़ा, सतनजा आदि भी हैं। संख्या का रूप अक्सर बदल जाता है: दो → दु, तीन → ति, चार → चौ, पाँच → पच, छः → छ, सात → सत, आठ → अठ (पृ. ४८६-४८७)। इसलिए चौराहा, सतनजा, अठन्नी पर नज़र रखें।<\/p>\n<div class=\"trap\"><b>द्विगु का मतलब \"संख्या वाला\" नहीं, \"संख्या + समूह\" है।<\/b> \"नौ\" से शुरू होने भर से द्विगु नहीं बन जाता। \"नवयुवक\" में नौ युवकों का समूह नहीं, \"नया है जो युवक\" है, इसलिए वह कर्मधारय है (2021 का प्रश्न)। और \"त्रिभुज\" (तीन हैं भुजाएँ जिसकी) बहुव्रीहि है, द्विगु नहीं।<\/div>\n\n<h2>द्वंद्व समास<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस समास में <b>सब पद या उनका समाहार प्रधान<\/b> हो, उसे द्वंद्व कहते हैं (गुरु अं. ४६५, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७५\">पृ. ४७५<\/a>)। विग्रह में \"और\" या \"या\" आता है। तीन भेद हैं।<\/div>\n\n<h3>1. इतरेतर द्वंद्व (और)<\/h3>\n<p>जिसके पद \"और\" से जुड़े हों और \"और\" लुप्त हो; प्रत्येक पद अपना अलग अर्थ रखता है। गुरु: राधाकृष्ण, ऋषि-मुनि, कंद-मूल-फल; हिंदी: गाय-बैल, माँ-बाप, भाई-बहन, सुख-दुःख, तन-मन-धन।<\/p>\n<ul><li>विग्रह: राधा <u>और<\/u> कृष्ण; माँ <u>और<\/u> बाप।<\/li>\n<li>गुरु की सूचना (पृ. ४७५-४७६): द्रव्यवाचक संज्ञाएँ एकवचन में आती हैं (दाल-रोटी, दूध-भात, घी-गुड़), शेष द्वंद्व बहुधा बहुवचन में। लिंग: अलग-अलग लिंग हों तो बहुधा पुल्लिंग (भाई-बहन, माँ-बाप), पर दूध-रोटी, चिट्ठी-पाती स्त्रीलिंग भी।<\/li><\/ul>\n\n<h3>2. समाहार द्वंद्व (और भी, समूह)<\/h3>\n<p>जिसमें पदों के अपने अर्थ के साथ <b>उसी जैसा और भी बहुत कुछ<\/b> जुड़ा समझा जाए। गुरु (पृ. ४७६): सेठ-साहूकार (सेठ और साहूकारों के सिवा और भी धनी लोग), आहार-निद्रा-भय (प्राणियों के सब धर्म), भूल-चूक, हाथ-पाँव, दाल-रोटी, रुपया-पैसा।<\/p>\n<table><tr><th>उपभेद (गुरु, पृ. ४७६-४७८)<\/th><th>उदाहरण<\/th><th>भाव<\/th><\/tr>\n<tr><td>एक ही अर्थ के पद<\/td><td>कपड़े-लत्ते, बासन-बर्तन, चाल-चलन, मार-पीट, घास-फूस<\/td><td>एक ही जाति का समूह<\/td><\/tr>\n<tr><td>मिलते-जुलते अर्थ के पद<\/td><td>अन्न-जल, घर-द्वार, आचार-विचार, नाच-रंग, साँप-बिच्छू<\/td><td>आसपास की चीज़ें भी शामिल<\/td><\/tr>\n<tr><td>परस्पर विरुद्ध अर्थ<\/td><td>आगा-पीछा, लेन-देन, कहा-सुनी<\/td><td>दोनों छोर, पूरी क्रिया<\/td><\/tr>\n<tr><td>एक सार्थक, दूसरा निरर्थक / अनुप्रास<\/td><td>आमने-सामने, आस-पास, बात-चीत, देख-भाल, भीड़-भाड़<\/td><td>एक ही भाव को पुष्ट<\/td><\/tr><\/table>\n\n<h3>3. वैकल्पिक द्वंद्व (या)<\/h3>\n<p>जहाँ पदों के बीच \"या / अथवा\" छिपा हो; बहुधा परस्पर-विरोधी शब्द (गुरु अं. ४६५-३, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७८\">पृ. ४७८<\/a>): पाप-पुण्य, भला-बुरा, थोड़ा-बहुत, ऊँच-नीच, जात-कुजात, धर्माधर्म। विग्रह: पाप या पुण्य; भला या बुरा।<\/p>\n<div class=\"trap\"><b>इतरेतर या समाहार?<\/b> पूछें: क्या \"और भी बहुत कुछ\" जुड़ा है? सेठ-साहूकार का मतलब सिर्फ़ दो व्यक्ति नहीं, पूरा धनी वर्ग: समाहार। राम-लक्ष्मण का मतलब ठीक दो व्यक्ति: इतरेतर। \"आपस में बिलकुल उलटे या विकल्प\" हों तो वैकल्पिक।<\/div>\n<div class=\"trap\"><b>विशेषण बनाम द्वंद्व:<\/b> लँगड़ा-लूला, भूखा-प्यासा, भरा-पूरा जैसे दोहरे विशेषण जब संज्ञा की तरह प्रयोग हों तो द्वंद्व हैं, और विशेषण की तरह प्रयोग हों तो कर्मधारय (गुरु की सूचना, पृ. ४७७)।<\/div>\n\n<h2>बहुव्रीहि समास<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस समास में <b>कोई पद प्रधान नहीं<\/b> होता और जो अपने पदों से भिन्न किसी संज्ञा का विशेषण होता है, उसे बहुव्रीहि कहते हैं (गुरु अं. ४६६, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७८\">पृ. ४७८-४७९<\/a>)। उदाहरण: चंद्रमौलि (चंद्र है सिर पर जिसके, यानी शिव), अनंत (नहीं है अंत जिसका, यानी ईश्वर)।<\/div>\n<p><b>असली बात:<\/b> समस्त पद का अर्थ उसके दोनों शब्दों से नहीं, <b>किसी तीसरे व्यक्ति या वस्तु<\/b> से बनता है। दशानन का अर्थ \"दस मुँह\" नहीं, \"रावण\" है। विग्रह में \"<u>जिसका / जिसकी / जिसमें / जिसके द्वारा / जो<\/u>\" अवश्य आएगा।<\/p>\n<p class=\"eq\"><span>दस<\/span> + <span>आनन<\/span> = <b>दशानन<\/b> (दस हैं मुँह जिसके: रावण)<\/p>\n\n<h3>कारक के अनुसार भेद (गुरु अं. ४६७, पृ. ४७९-४८०)<\/h3>\n<table><tr><th>भेद<\/th><th>उदाहरण<\/th><th>विग्रह<\/th><\/tr>\n<tr><td>कर्म बहुव्रीहि<\/td><td>प्राप्तोदक (ग्राम)<\/td><td>प्राप्त हुआ है जल जिसको<\/td><\/tr>\n<tr><td>करण बहुव्रीहि<\/td><td>कृतकार्य, दत्तचित्त, प्राप्तकाम<\/td><td>किया गया है कार्य जिसके द्वारा; दिया है चित्त जिसने<\/td><\/tr>\n<tr><td>सम्प्रदान बहुव्रीहि<\/td><td>दत्तधन<\/td><td>दिया गया है धन जिसको<\/td><\/tr>\n<tr><td>अपादान बहुव्रीहि<\/td><td>निर्जन, निर्विकार, विमल<\/td><td>निकल गया है जन जिसमें से<\/td><\/tr>\n<tr><td>संबंध बहुव्रीहि<\/td><td>दशानन, पीतांबर, चतुर्भुज, नीलकंठ, सहस्रबाहु, चंद्रमौलि<\/td><td>जिसके / जिसका<\/td><\/tr>\n<tr><td>अधिकरण बहुव्रीहि<\/td><td>इंद्रादि, प्रफुल्लकमल (तालाब)<\/td><td>इंद्र है आदि में जिनके; खिले हैं कमल जिसमें<\/td><\/tr><\/table>\n<p>हिंदी बहुव्रीहि (गुरु): कनफटा, दुधमुँहा, मिठबोला, बारहसिंगा, अनमोल, हँसमुख, सिरकटा, मनचला, पतझड़, त्रिकोण। उर्दू: कमज़ोर, बदनसीब, ख़ुशदिल, नेकनाम।<\/p>\n<p>गुरु (अं. ४६८, पृ. ४८०) एक और भेद करते हैं: <b>समानाधिकरण<\/b> (दोनों पदों में एक ही विभक्ति: नीलकंठ = नीला है कंठ जिसका) और <b>व्यधिकरण<\/b> (अलग-अलग: चंद्रमौलि = चंद्र है मौलि में जिसके)।<\/p>\n\n<h3>रूप के अनुसार प्रमुख भेद (गुरु अं. ४६९, पृ. ४८०-४८२)<\/h3>\n<ul><li><b>विशेषण-पूर्वपद:<\/b> पीतांबर, लंबकर्ण, दीर्घबाहु, साफ़दिल<\/li>\n<li><b>उपमान-पूर्वपद:<\/b> चंद्रमुखी, राजीवलोचन, वज्रदेही, पाषाणहृदय (पत्थर जैसा हृदय है जिसका)<\/li>\n<li><b>नञ् बहुव्रीहि:<\/b> अनाथ, अव्यय, अद्वितीय, अचेत, अथाह, अनगिनती<\/li>\n<li><b>संख्यापूर्वपद:<\/b> त्रिभुज, चतुष्पद, पंचानन, दशमुख, दुनाली, तिमंजला, सितार (तीन हैं तार जिसमें)<\/li>\n<li><b>सह बहुव्रीहि (\"स-\" = साथ):<\/b> सपुत्र, सपरिवार, सविनय, सावधान, सफल<\/li>\n<li><b>प्रादि / उपसर्गपूर्व:<\/b> निर्दय, निर्धन, विफल, विधवा, कुरूप, सुडौल<\/li>\n<li><b>मध्यमपदलोपी:<\/b> कोकिलकंठा (कोकिल के कंठ के समान कंठ है जिसका), मृगनेत्रा, गजानन<\/li>\n<li><b>व्यतिहार (आपस की क्रिया):<\/b> लठालठी, मारामारी, धक्काधकी, मुष्टामुष्टि<\/li><\/ul>\n<p>गुरु की सूचना (पृ. ४८५): \"सपत्नीक, सकर्मक, अकर्मक, निरर्थक\" जैसे शब्दों के अंत में \"क\" जुड़ता है; \"सह / समान\" की जगह \"स\" आता है (सादर, सवर्ण)।<\/p>\n<div class=\"ex\"><b>विग्रह के उदाहरण:<\/b> पीतांबर = पीत है अंबर जिसका (कृष्ण); नीलकंठ = नीला है कंठ जिसका (शिव); चतुर्भुज = चार हैं भुजाएँ जिसकी (विष्णु); आशुतोष = आशु (शीघ्र) तुष्ट होता है जो (शिव); पशुपति = पशुओं का पति (शिव); पंचशर = पाँच हैं शर (बाण) जिसके (कामदेव); मंदोदरी = मंद है उदर जिसका (रावण की पत्नी); शेषशायी = शेष (नाग) पर शयन करता है जो (विष्णु); क्षपानाथ = क्षपा (रात) का नाथ (चंद्रमा); चक्षुश्रवा = चक्षु ही हैं श्रवण (कान) जिसके (साँप)।<\/div>\n\n<h2>पहचान की विधि<\/h2>\n<h3>सामान्य प्रक्रिया<\/h3>\n<ol class=\"steps\">\n<li><b>पहले देखें कि पूरा शब्द अव्यय जैसा चलता है या नहीं।<\/b> यदि पहला पद यथा, आ, प्रति, यावत्, भर, बे, हर जैसा है और शब्द क्रिया-विशेषण है, तो अव्ययीभाव (यथाशक्ति, आजन्म, प्रतिदिन, हाथोंहाथ)।<\/li>\n<li><b>विग्रह में \"और / या\" आता है?<\/b> हाँ तो द्वंद्व। \"और\" = इतरेतर या समाहार, \"या\" = वैकल्पिक।<\/li>\n<li><b>विग्रह में \"जिसका / जिसमें / जो\" लगाने पर ही अर्थ पूरा होता है, और अर्थ किसी तीसरे का है?<\/b> हाँ तो बहुव्रीहि।<\/li>\n<li><b>पहला पद संख्या है और अर्थ \"समूह / समाहार\" है?<\/b> हाँ तो द्विगु।<\/li>\n<li><b>विग्रह में \"है जो / के समान / रूपी / ही\" आता है?<\/b> हाँ तो कर्मधारय।<\/li>\n<li><b>विग्रह में कारक-चिह्न (को, से, के लिए, का, में) आता है?<\/b> हाँ तो तत्पुरुष, फिर चिह्न देखकर कारक (कर्म, करण, सम्प्रदान, अपादान, संबंध, अधिकरण)।<\/li>\n<li>शब्द के पहले \"अ / अन् / ना / ग़ैर\" है? तो नञ् तत्पुरुष। दूसरा पद \"-कार / -द / -ज्ञ / -घ्न\" जैसा अकेले न चलने वाला कृदंत? तो उपपद।<\/li><\/ol>\n\n<h3>कर्मधारय, बहुव्रीहि और द्विगु को अलग करने की विधि<\/h3>\n<p>ये तीनों सबसे ज़्यादा उलझाते हैं, क्योंकि एक ही शब्द विग्रह बदलने से तीनों में जा सकता है। गुरु (अं. ४८३, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४८७\">पृ. ४८७-४८८<\/a>) कहते हैं: \"कभी-कभी एक ही समास का विग्रह अर्थ-भेद से कई प्रकार का होता है... ऐसी अवस्था में समास का विग्रह केवल पूर्वापर संबंध से हो सकता है।\" इसलिए विधि यह है:<\/p>\n<ol class=\"steps\">\n<li><b>पहला प्रश्न: शब्द का अर्थ किसके बारे में है?<\/b> समस्त पद का अर्थ यदि उन्हीं दो शब्दों से बनी \"वस्तु\" का है (पीला कमल, तीन भुवन), तो कर्मधारय या द्विगु। यदि अर्थ <b>किसी अलग व्यक्ति / देवता / प्राणी<\/b> का है (शिव, विष्णु, रावण, साँप), तो बहुव्रीहि।<\/li>\n<li><b>दूसरा प्रश्न: पहला पद संख्या है?<\/b> नहीं तो द्विगु की संभावना ख़त्म; अब कर्मधारय या बहुव्रीहि में ही निर्णय। हाँ तो अगले क़दम पर जाएँ।<\/li>\n<li><b>तीसरा प्रश्न (संख्या वाले शब्द में): समूह बन रहा है या अन्य का बोध?<\/b> \"तीन भुवनों का <u>समाहार<\/u>\" = द्विगु (त्रिभुवन)। \"चार हैं भुजाएँ <u>जिसकी<\/u>\" = बहुव्रीहि (चतुर्भुज, विष्णु)।<\/li>\n<li><b>चौथा प्रश्न (संख्या न हो): विग्रह \"है जो\" से पूरा हो जाता है या \"जिसका\" की ज़रूरत है?<\/b> \"पीला है जो वस्त्र\" = कर्मधारय। \"पीला है वस्त्र <u>जिसका<\/u>\" = बहुव्रीहि (पीतांबर = कृष्ण)।<\/li>\n<li><b>पाँचवाँ प्रश्न: संदर्भ।<\/b> यदि प्रश्न में \"विष्णु / शिव / रावण\" जैसा संकेत नहीं और शब्द सीधे वस्तु का है, तो प्रायः कर्मधारय। यदि विकल्पों में एक ही शब्द दो समासों में दिया है, तो वही विग्रह चुनें जो प्रश्न के अर्थ से मेल खाए।<\/li><\/ol>\n<table><tr><th>शब्द<\/th><th>अर्थ-1 और समास<\/th><th>अर्थ-2 और समास<\/th><\/tr>\n<tr><td>पीतांबर<\/td><td>पीला वस्त्र: कर्मधारय<\/td><td>पीला वस्त्र है जिसका (कृष्ण): बहुव्रीहि<\/td><\/tr>\n<tr><td>त्रिनेत्र<\/td><td>तीन आँखें: कर्मधारय / द्विगु (गुरु: कर्मधारय)<\/td><td>तीन आँखें हैं जिसकी (शिव): बहुव्रीहि<\/td><\/tr>\n<tr><td>मंदमति<\/td><td>मंद है जो मति: कर्मधारय<\/td><td>मंद है मति जिसकी: बहुव्रीहि (गुरु पृ. ४८७)<\/td><\/tr>\n<tr><td>सत्यव्रत<\/td><td>सत्य ही व्रत: कर्मधारय; सत्य का व्रत: तत्पुरुष; सत्य और व्रत: द्वंद्व<\/td><td>सत्य है व्रत जिसका: बहुव्रीहि<\/td><\/tr>\n<tr><td>लक्ष्मीकांत<\/td><td>लक्ष्मी का कांत (पति): तत्पुरुष<\/td><td>लक्ष्मी है कांता जिसकी: बहुव्रीहि; अर्थ एक ही, इसलिए कोई एक विग्रह स्वीकार (गुरु पृ. ४८८)<\/td><\/tr><\/table>\n<div class=\"ex\"><b>गुरु का तर्क:<\/b> महादेव के अर्थ में \"त्रिनेत्र\" बहुव्रीहि है और \"तीन आँखें\" के अर्थ में कर्मधारय (पृ. ४८७)। सत्यव्रत के चार विग्रह चार अलग समास देते हैं, इसलिए विग्रह सोचकर ही नाम तय करें, शब्द देखकर नहीं।<\/div>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>जोड़ा<\/th><th>भेद कैसे करें<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>कर्मधारय / तत्पुरुष<\/td><td>कर्मधारय में \"है जो / के समान\"; तत्पुरुष में को/से/का/में<\/td><td>नीलकमल (नीला जो कमल) बनाम राजपुत्र (राजा का पुत्र)<\/td><\/tr>\n<tr><td>कर्मधारय / बहुव्रीहि<\/td><td>अर्थ वस्तु का या तीसरे का<\/td><td>पीतांबर, नीलकंठ<\/td><\/tr>\n<tr><td>द्विगु / बहुव्रीहि<\/td><td>समूह का बोध या अन्य का<\/td><td>त्रिभुवन बनाम त्रिभुज, चतुर्भुज<\/td><\/tr>\n<tr><td>द्विगु / कर्मधारय<\/td><td>पहला पद संख्या और समूह-अर्थ<\/td><td>चौराहा बनाम नवयुवक<\/td><\/tr>\n<tr><td>अव्ययीभाव / बहुव्रीहि<\/td><td>पूरा शब्द अव्यय (क्रिया-विशेषण) बनता है<\/td><td>आकंठ (कंठ तक) बनाम पीतांबर; प्रेमपूर्वक<\/td><\/tr>\n<tr><td>अव्ययीभाव / कर्मधारय<\/td><td>वाक्य में क्रिया-विशेषण या संज्ञा/विशेषण?<\/td><td>घर-घर बनाम जन-जन<\/td><\/tr>\n<tr><td>इतरेतर / समाहार द्वंद्व<\/td><td>ठीक वही दो, या और भी?<\/td><td>राधाकृष्ण बनाम सेठ-साहूकार<\/td><\/tr>\n<tr><td>करण / अपादान<\/td><td>\"से\" का अर्थ साधन या अलगाव<\/td><td>मदांध बनाम ऋणमुक्त<\/td><\/tr>\n<tr><td>सन्धि / समास<\/td><td>वर्णों का मेल या शब्दों का<\/td><td>विद्यालय: विद्या + आलय बनाम विद्या का आलय<\/td><\/tr><\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b>\n<ul><li><b>आकंठ<\/b> (कंठ तक; \"आ\" = तक, गुरु पृ. ४६६) = अव्ययीभाव, बहुव्रीहि नहीं (2022)।<\/li>\n<li><b>-पूर्वक<\/b>: गुरु (पृ. ४८३) बहुव्रीहि कहते हैं जो अव्ययीभाव की तरह चलता है; स्कूल में अव्ययीभाव गिना जाता है।<\/li>\n<li><b>आपादमस्तक<\/b> (पाँव से सिर तक): \"आ\" = तक, अव्ययीभाव; बहुव्रीहि नहीं (2024)।<\/li>\n<li>\"ही\" से जुड़े द्वंद्व और कर्मधारय में अंतर: गुरुदेव = गुरु ही देव (कर्मधारय), गुरु-देव = गुरु और देव (द्वंद्व)।<\/li><\/ul><\/div>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2020 Q39<\/h3>\n<p>समास की दृष्टि से <b>असंगत<\/b> विकल्प छाँटिए: (A) भयभीत: करण तत्पुरुष (B) सेठ-साहूकार: समाहार द्वंद्व (C) विद्याहीन: अपादान तत्पुरुष (D) स्वर्गगत: कर्म तत्पुरुष<\/p>\n<div class=\"ex\"><b>कुंजी में दिया उत्तर: (A)।<\/b> हल: (B) सेठ-साहूकार सेठ और साहूकार और भी धनी लोग, समाहार द्वंद्व सही (गुरु पृ. ४७६)। (D) स्वर्ग को गया, कर्म तत्पुरुष सही (गुरु का \"देशगत\" इसी साँचे का)। (A) भयभीत = भय से भीत: यहाँ \"भय से डरा हुआ\" में भय कारण नहीं, भय का स्रोत है; स्कूली पुस्तकें इसे अपादान (भय से भीत) कहती हैं, इसलिए \"करण\" कहना असंगत बनता है। (C) विद्याहीन = विद्या से हीन: करण या अपादान दोनों कहे जा सकते हैं। उत्तर (A)।<\/div>\n<div class=\"trap\"><b>कुंजी संदिग्ध है।<\/b> गुरु (पृ. ४६८ व ४७०) गुणहीन को करण में रखते हैं और कहते हैं कि कारक-नाम विग्रह पर निर्भर है। उनके अनुसार \"हीन\" वाले शब्द करण हैं, तो विद्याहीन \"अपादान\" कहना असंगत बन सकता है, यानी (C)। \"भयभीत: करण\" भी विग्रह के अनुसार चल सकता है। प्रश्न विवादित है; पर कुंजी (A) है। परीक्षा में ऐसा प्रश्न आए तो स्पष्ट सही विकल्प (B), (D) काट दें और बाकी दो में स्कूली पुस्तक का चलन देखें (भयभीत = अपादान, हीन = करण/अपादान)।<\/div>\n\n<h3>HTET 2020 Q43<\/h3>\n<p>किस विकल्प में अव्ययीभाव समास है? (A) विरोधजनक (B) कृपापूर्वक (C) अवसरवंचित (D) स्वाधीन<\/p>\n<div class=\"ex\"><b>कुंजी में दिया उत्तर: (C)<\/b>, पर हल से (B) निकलता है। हल: (A) विरोधजनक = विरोध को जन्म देने वाला: उपपद तत्पुरुष। (C) अवसरवंचित = अवसर से वंचित: अपादान तत्पुरुष। (D) स्वाधीन = स्व के अधीन: संबंध तत्पुरुष। (B) कृपापूर्वक = कृपा के साथ: पूरा शब्द क्रिया-विशेषण बनकर चलता है, इसलिए अव्ययीभाव (गुरु पृ. ४८३ इसे अव्ययीभाव की तरह चलने वाला बहुव्रीहि कहते हैं)।<\/div>\n<div class=\"trap\"><b>कुंजी संदिग्ध है।<\/b> डेटा में उत्तर (C) दर्ज है, पर (C) में कोई अव्यय-पद नहीं है; उसमें \"से वंचित\" का अपादान-संबंध है। पाठ्यपुस्तकों के आधार पर सही विकल्प (B) है। परीक्षा के लिए यही सीखें: <b>-पूर्वक, -वश, यथा-, आ-, प्रति-<\/b> से बने शब्द अव्ययीभाव।<\/div>\n\n<h3>HTET 2021 Q39<\/h3>\n<p>समास-विग्रह की दृष्टि से <b>असंगत<\/b> विकल्प: (A) शुभंकर: शुभ को करने वाला (B) रसमलाई: रस में डूबी हुई मलाई (C) नवयुवक: नौ युवकों का समूह (D) शाखामृग: शाखाओं पर रहने/दौड़ने वाला मृग<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> हल: (A) शुभंकर = शुभ + कर (उपपद तत्पुरुष), सही। (B) रसमलाई = रस में डूबी मलाई: मध्यमपदलोपी कर्मधारय (दही-बड़ा की तरह, गुरु पृ. ४७४), सही। (D) शाखामृग = शाखाओं पर चलने वाला मृग (बंदर): सही। (C) \"नव\" यहाँ नौ नहीं, \"नया\" है, इसलिए नवयुवक = नया है जो युवक (कर्मधारय); \"नौ युवकों का समूह\" ग़लत है, और द्विगु भी नहीं बनता।<\/div>\n\n<h3>HTET 2022 Q38<\/h3>\n<p>समास की दृष्टि से <b>असंगत<\/b> विकल्प: (A) कनकलता: कर्मधारय (B) सचिवालय: तत्पुरुष (C) चौराहा: द्विगु (D) आकंठ: बहुव्रीहि<\/p>\n<div class=\"ex\"><b>उत्तर: (D)।<\/b> हल: (A) कनक के समान लता (उपमान-पूर्वपद कर्मधारय), सही। (B) सचिवों का आलय, संबंध तत्पुरुष, सही। (C) चार राहों का समूह, द्विगु, सही। (D) आकंठ = कंठ तक (\"आ\" = तक): अव्ययीभाव, बहुव्रीहि नहीं, इसलिए यही असंगत है (गुरु पृ. ४६६)।<\/div>\n\n<h3>HTET 2023 Q35<\/h3>\n<p>किस विकल्प के समस्त पद में बहुव्रीहि समास का उदाहरण <b>नहीं<\/b> है? (A) शेषशायी, क्षपानाथ (B) दीर्घश्वास, पाषाणहृदय (C) आशुतोष, मंदोदरी (D) पंचशर, पशुपति<\/p>\n<div class=\"ex\"><b>उत्तर: (B)।<\/b> हल: (A) शेषशायी (शेष पर शयन करता है जो: विष्णु), क्षपानाथ (रात का नाथ: चंद्रमा) अन्य का बोध कराते हैं। (C) आशुतोष (शीघ्र प्रसन्न होता है जो: शिव), मंदोदरी (मंद है उदर जिसका)। (D) पंचशर (पाँच बाण जिसके: कामदेव), पशुपति (शिव)। (B) दीर्घश्वास = दीर्घ है जो श्वास; पाषाणहृदय = पाषाण के समान हृदय: दोनों में अर्थ उन्हीं शब्दों का है, इसलिए कर्मधारय।<\/div>\n<div class=\"trap\"><b>ध्यान दें:<\/b> गुरु (पृ. ४८१) \"पाषाणहृदय\" को बहुव्रीहि के उपमान-पूर्वपद में गिनाते हैं, यानी \"पत्थर जैसा है हृदय जिसका (व्यक्ति)\"। जब यह किसी <b>कठोर व्यक्ति<\/b> के लिए आए तब बहुव्रीहि, और केवल \"पत्थर जैसा हृदय\" के अर्थ में कर्मधारय। यहाँ कुंजी दूसरे अर्थ को ले रही है। शेषशायी और क्षपानाथ को कुछ लोग तत्पुरुष कहते हैं, पर विकल्प (A) में अन्य का बोध ही माना गया है।<\/div>\n\n<h3>HTET 2024 Q41<\/h3>\n<p>समास की दृष्टि से <b>संगत<\/b> विकल्प: (A) चक्षुश्रवा: इतरेतर द्वंद्व (B) आपादमस्तक: बहुव्रीहि (C) जातिगत: अधिकरण तत्पुरुष (D) श्रमसाध्य: करण तत्पुरुष<\/p>\n<div class=\"ex\"><b>उत्तर: (D)।<\/b> हल: (A) चक्षुश्रवा = चक्षु ही हैं श्रवण जिसके (साँप), बहुव्रीहि: द्वंद्व नहीं। (B) आपादमस्तक = पाँव से मस्तक तक, \"आ\" = तक: अव्ययीभाव। (C) जातिगत में विग्रह \"जाति से संबंधित / जाति में गत\" बनता है, जो किसी स्पष्ट कारक में नहीं बँधता। (D) श्रमसाध्य = श्रम से साध्य: करण तत्पुरुष (गुरु पृ. ४६८ का \"कष्टसाध्य\" ठीक यही साँचा है)।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>समास = शब्दों का मेल जिसमें बीच के कारक-चिह्न / योजक लुप्त; तोड़ना = विग्रह। सन्धि वर्णों का मेल, समास शब्दों का।<\/li>\n<li>प्रधानता: अव्ययीभाव में पूर्वपद, तत्पुरुष (कर्मधारय, द्विगु) में उत्तरपद, द्वंद्व में दोनों, बहुव्रीहि में कोई नहीं (अर्थ तीसरे का)।<\/li>\n<li>अव्ययीभाव: पूरा शब्द अव्यय; यथा-, आ-, प्रति-, भर-, बे-, हर-, -पूर्वक; आकंठ, आपादमस्तक, यथाशक्ति, घर-घर।<\/li>\n<li>तत्पुरुष के छह कारक-भेद: को (कर्म), से/द्वारा (करण), के लिए (सम्प्रदान), से-अलग (अपादान), का (संबंध), में/पर (अधिकरण); नाम विग्रह से तय होता है।<\/li>\n<li>नञ् (अ/अन्/ना), उपपद (-कार, -ज्ञ, -द जैसे अकेले न चलने वाले), अलुक् (मनसिज, युधिष्ठिर) तत्पुरुष के ही उपभेद हैं।<\/li>\n<li>कर्मधारय: \"है जो / के समान / रूपी / ही\"; विशेषण-विशेष्य या उपमान-उपमेय।<\/li>\n<li>द्विगु: पहला पद संख्या + समूह का अर्थ (चौराहा, त्रिभुवन, पंचवटी)। नवयुवक द्विगु नहीं।<\/li>\n<li>द्वंद्व: इतरेतर (और, ठीक वही दो), समाहार (\"और भी\", सेठ-साहूकार), वैकल्पिक (या, पाप-पुण्य)।<\/li>\n<li>बहुव्रीहि: विग्रह में \"जिसका / जिसमें\"; अर्थ किसी अन्य का (पीतांबर, चतुर्भुज, दशानन, आशुतोष)।<\/li>\n<li>एक ही शब्द विग्रह से समास बदल देता है (पीतांबर, त्रिनेत्र, सत्यव्रत); अर्थ और प्रश्न का संदर्भ देखें।<\/li><\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: 'यथाशक्ति' में समास है: (A) तत्पुरुष (B) अव्ययीभाव (C) द्विगु (D) बहुव्रीहि<\/summary><p><b>उत्तर: (B)<\/b> यथा (अनुसार) अव्यय पहला पद; पूरा शब्द \"शक्ति के अनुसार\" क्रिया-विशेषण।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: 'चतुर्भुज' (विष्णु) में समास: (A) द्विगु (B) कर्मधारय (C) बहुव्रीहि (D) द्वंद्व<\/summary><p><b>उत्तर: (C)<\/b> चार हैं भुजाएँ जिसकी, अर्थ विष्णु का। \"चार भुजाओं का समूह\" लेते तो द्विगु होता, पर यहाँ अन्य का बोध है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: 'देशनिकाला' का सही विग्रह एवं समास: (A) देश से निकाला: अपादान (B) देश को निकाला: कर्म (C) देश में निकाला: अधिकरण (D) देश के लिए निकाला: सम्प्रदान<\/summary><p><b>उत्तर: (A)<\/b> \"से\" अलगाव का है, अपादान (गुरु पृ. ४६९)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: 'सेठ-साहूकार' में समास: (A) इतरेतर द्वंद्व (B) समाहार द्वंद्व (C) कर्मधारय (D) द्विगु<\/summary><p><b>उत्तर: (B)<\/b> सेठ-साहूकार और अन्य धनी लोग: समूह-बोध (गुरु पृ. ४७६)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: कौन-सा शब्द कर्मधारय नहीं है? (A) नीलकमल (B) महाजन (C) चंद्रमुख (D) नीलकंठ (शिव)<\/summary><p><b>उत्तर: (D)<\/b> नीलकंठ का अर्थ शिव है, अन्य का बोध: बहुव्रीहि। बाक़ी तीन में अर्थ उन्हीं पदों का (नीला कमल, महान जन, चंद्र-सा मुख)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: 'पंचवटी' और 'त्रिभुज' के समास क्रम से हैं: (A) द्विगु, बहुव्रीहि (B) बहुव्रीहि, द्विगु (C) दोनों द्विगु (D) कर्मधारय, तत्पुरुष<\/summary><p><b>उत्तर: (A)<\/b> पंचवटी = पाँच वटों का समूह (द्विगु)। त्रिभुज = तीन हैं भुजाएँ जिसकी (बहुव्रीहि, गुरु पृ. ४८१)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: 'ऋणमुक्त' में कौन-सा तत्पुरुष है? (A) करण (B) सम्प्रदान (C) अपादान (D) अधिकरण<\/summary><p><b>उत्तर: (C)<\/b> ऋण से मुक्त: अलगाव, अपादान (गुरु पृ. ४६९)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: 'अनाथ' और 'अनाचार' क्रम से: (A) बहुव्रीहि, नञ् तत्पुरुष (B) नञ् तत्पुरुष, बहुव्रीहि (C) दोनों नञ् तत्पुरुष (D) दोनों बहुव्रीहि<\/summary><p><b>उत्तर: (A)<\/b> अनाथ = नहीं है नाथ जिसका (नञ् बहुव्रीहि, गुरु पृ. ४८१); अनाचार = न आचार (नञ् तत्पुरुष, पृ. ४७१)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: 'हाथ-पाँव' में समास है: (A) वैकल्पिक द्वंद्व (B) समाहार द्वंद्व (C) कर्मधारय (D) अव्ययीभाव<\/summary><p><b>उत्तर: (B)<\/b> हाथ-पाँव और शरीर के अन्य अंग भी: समाहार (गुरु पृ. ४७६)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: 'भरपेट' में समास: (A) अव्ययीभाव (B) कर्मधारय (C) तत्पुरुष (D) द्विगु<\/summary><p><b>उत्तर: (A)<\/b> \"भर\" (पूरा) पूर्वपद, पूरा शब्द क्रिया-विशेषण (\"भरपेट खाया\"): हिंदी अव्ययीभाव (गुरु पृ. ४६६)।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामता प्रसाद गुरु, हिंदी व्याकरण (नागरी प्रचारिणी सभा), समास-प्रकरण, अं. ४४५-४८५: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६३\">पृ. ४६३-४६५<\/a> (परिभाषा, विग्रह, चार भेद), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६६\">४६६-४६७<\/a> (अव्ययीभाव), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६८\">४६८-४७१<\/a> (तत्पुरुष, अलुक्, उपपद, नञ्), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७२\">४७२-४७५<\/a> (कर्मधारय, द्विगु), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७५\">४७५-४७८<\/a> (द्वंद्व), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४७९\">४७९-४८२<\/a> (बहुव्रीहि), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४८३\">४८३-४८८<\/a> (विशेष नियम, एक शब्द के कई विग्रह)। पृष्ठ-संख्या विकिस्रोत की स्कैन-पृष्ठ संख्या है (लिंक में वही)। पिछले HTET प्रश्न (2020–24)। आपादमस्तक, चक्षुश्रवा, भयभीत, आशुतोष, मंदोदरी, पंचशर, पशुपति, शेषशायी, क्षपानाथ, रसमलाई, शुभंकर, विरोधजनक, अवसरवंचित, जातिगत गुरु की पुस्तक में नहीं मिले; इनका विश्लेषण गुरु के सिद्धांतों और स्कूली पाठ्यपुस्तकों के चलन से किया गया है।<\/p>\n","hin-upa":"<p class=\"key\"><b>HTET में क्या पूछा गया:<\/b> उपसर्ग-प्रत्यय से 2020–2024 में <b>11 प्रश्न<\/b> (हर साल 2–3): यह समास के बाद नहीं, बल्कि हिंदी का दूसरा सबसे अधिक पूछा जाने वाला विषय है। प्रश्नों के प्रकार: (1) कौन-सा शब्द किस उपसर्ग से बना है (आ, अन्, अप, निस्, परि, प्रति, अति); (2) एक से अधिक उपसर्ग वाला शब्द; (3) उपसर्ग-विभाजन सही है या नहीं; (4) प्रत्यय-विभाजन (इल, इयल, आवट, आहट, इक, य/एय, ईय, ऐत, अ, अनीय); (5) विदेशी (फ़ारसी/अरबी) प्रत्यय पहचानना (खोर, गार)। अधिकतर प्रश्न \"असंगत / नहीं / असुमेलित\" वाले हैं, यानी सही-ग़लत के बारीक भेद की परीक्षा।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>उपसर्ग:<\/b> वह अक्षर या अक्षर-समूह जो किसी शब्द के <b>पहले<\/b> जुड़कर उसके अर्थ में विशेषता, परिवर्तन या उलटापन ला दे। <b>प्रत्यय:<\/b> वह अक्षर या अक्षर-समूह जो शब्द (या धातु) के <b>बाद<\/b> जुड़कर नया शब्द या नया अर्थ बनाए। दोनों अकेले शब्द की तरह नहीं चलते।<\/div>\n<p>कामता प्रसाद गुरु (अं. ४३०, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३९६\">पृ. ३९६<\/a>) के शब्दों में: \"शब्द के पूर्व जो अक्षर वा अक्षर-समूह लगाया जाता है उसे उपसर्ग कहते हैं, जैसे 'वन' शब्द के पूर्व 'अन' निषेधार्थी अक्षर-समूह लगाने से 'अनबन' शब्द बनता है। ... शब्दों के पश्चात् जो अक्षर वा अक्षर-समूह लगाया जाता है उसे प्रत्यय कहते हैं, जैसे 'बड़ा' शब्द में 'आई' से 'बड़ाई' बनता है।\"<\/p>\n<p><b>रोज़ की मिसाल:<\/b> \"सम्मान\" में कुछ जुड़ा हो तो \"अपमान\" बनता है, \"प्रमाण\" बने तो अर्थ बदलता है। आप \"मान\" को आधार मानें और आगे-पीछे अक्षर जोड़ते जाएँ तो पूरा शब्द-परिवार बन जाता है: मान, सम्मान, अपमान, मानी, मानव, मानवीय, मानवता। यही उपसर्ग-प्रत्यय का खेल है: एक मूल से बहुत शब्द।<\/p>\n\n<h2>मूल अवधारणा<\/h2>\n<h3>शब्द बनाने के तीन तरीक़े<\/h3>\n<p>गुरु (अं. ४३०, पृ. ३९६) एक ही भाषा के शब्द से नया शब्द बनाने के तीन तरीक़े बताते हैं:<\/p>\n<ol class=\"steps\">\n<li><b>आगे अक्षर लगाकर<\/b> (उपसर्ग): अन + बन = अनबन।<\/li>\n<li><b>पीछे अक्षर लगाकर<\/b> (प्रत्यय): बड़ा + आई = बड़ाई।<\/li>\n<li><b>दूसरा शब्द मिलाकर<\/b> (समास): रसोई + घर = रसोईघर।<\/li><\/ol>\n<p>इस प्रकार बने शब्दों को <b>यौगिक<\/b> शब्द कहते हैं; जिनके टुकड़े करने पर कोई सार्थक खंड न मिले वे <b>रूढ़<\/b> हैं (जैसे घर, हाथ)। पुनरुक्त (घर-घर) और अनुकरणवाची (खटखट) शब्द इनके अलावा हैं (अं. ४३१, पृ. ३९७)।<\/p>\n\n<h3>उपसर्ग का काम: धातु का अर्थ बदलना<\/h3>\n<p>गुरु (पृ. ३९९) संस्कृत का यह प्रसिद्ध श्लोक उद्धृत करते हैं: <b>\"उपसर्गेण धात्वर्थो बलादन्यत्र नीयते। प्रहाराहारसंहारविहारपरिहारवत्॥\"<\/b> यानी उपसर्ग धातु (क्रिया की जड़) के अर्थ को ज़ोर से दूसरी ओर मोड़ देता है। एक ही \"हार\" पर अलग उपसर्ग लगाकर देखिए:<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>अर्थ<\/th><\/tr>\n<tr><td>प्रहार<\/td><td>प्र + हार<\/td><td>चोट करना<\/td><\/tr>\n<tr><td>आहार<\/td><td>आ + हार<\/td><td>भोजन (अपनी ओर लेना)<\/td><\/tr>\n<tr><td>संहार<\/td><td>सम् + हार<\/td><td>पूरी तरह नाश<\/td><\/tr>\n<tr><td>विहार<\/td><td>वि + हार<\/td><td>घूमना-फिरना<\/td><\/tr>\n<tr><td>परिहार<\/td><td>परि + हार<\/td><td>चारों ओर से हटाना, दूर करना<\/td><\/tr><\/table>\n<p>उपसर्ग तीन तरह से अर्थ बदलते हैं: (1) <b>विपरीत अर्थ<\/b> देना (सम्मान से अपमान); (2) <b>अर्थ में विशेषता / तीव्रता<\/b> लाना (बल से प्रबल); (3) <b>अर्थ को बिलकुल नया मोड़<\/b> देना (हार से विहार, आहार, संहार)।<\/p>\n<div class=\"trap\"><b>गुरु का एक मत जो जानने लायक है:<\/b> संस्कृत में केवल कुछ नियत अक्षर ही उपसर्ग कहलाते हैं और शेष अव्यय माने जाते हैं। पर गुरु (अं. ४३० की सूचना) कहते हैं कि \"हिंदी में ऐसा अंतर मानने का कोई कारण नहीं है\", इसलिए हिंदी में उपसर्ग शब्द अधिक व्यापक अर्थ में आता है। इसी वजह से अ, कु, सु, सह, स्व, हर, बे जैसे शब्द भी हिंदी की सूचियों में उपसर्ग की तरह पढ़ाए जाते हैं।<\/div>\n\n<h3>\"शब्द\" और \"उपसर्ग / प्रत्यय\" में फ़र्क़ कैसे करें<\/h3>\n<p>गुरु (अं. ४३०-इ की सूचना, पृ. ३९७) का कसौटी-नियम: जिस अक्षर या अक्षर-समूह में <b>स्वतंत्र रूप से अर्थ<\/b> पाया जाए और जो अकेले चले, वह शब्द है; जिसका स्वतंत्र प्रयोग न हो और जो किसी शब्द के आश्रय से आगे या पीछे आकर ही अर्थवान बने, वह उपसर्ग या प्रत्यय है। (इसीलिए \"पन\" प्रत्यय है, \"घर\" नहीं।)<\/p>\n\n<h3>प्रत्यय के दो मुख्य भेद<\/h3>\n<p>गुरु (अं. ४३२, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३९८\">पृ. ३९८<\/a>): \"धातुओं से परे जो प्रत्यय लगाए जाते हैं उन्हें <b>कृत्<\/b> कहते हैं, और कृत् प्रत्ययों के योग से जो शब्द बनते हैं वे <b>कृदंत<\/b> कहलाते हैं। धातुओं को छोड़कर शेष शब्दों के आगे प्रत्यय लगाने से जो शब्द तैयार होते हैं उन्हें <b>तद्धित<\/b> कहते हैं।\"<\/p>\n<div class=\"cards\">\n<div><h3>कृत् प्रत्यय<\/h3><p>क्रिया की <b>धातु<\/b> से जुड़ते हैं<\/p><p class=\"eq\"><span>लिख<\/span> + <span>आवट<\/span> = <b>लिखावट<\/b><\/p><\/div>\n<div><h3>तद्धित प्रत्यय<\/h3><p><b>संज्ञा / सर्वनाम / विशेषण<\/b> से जुड़ते हैं<\/p><p class=\"eq\"><span>सुंदर<\/span> + <span>ता<\/span> = <b>सुंदरता<\/b><\/p><\/div>\n<\/div>\n<p>एक और बारीकी (गुरु पृ. ३९६-३९७): कारक-प्रत्यय (को, से, में) और काल-प्रत्यय <b>चरम<\/b> प्रत्यय हैं, उनके बाद कुछ नहीं लगता। पर व्युत्पत्ति के प्रत्ययों के बाद और प्रत्यय लग सकते हैं (चतुराई + से = चतुराई से)।<\/p>\n\n<h2>उपसर्ग (prefix)<\/h2>\n<h3>संस्कृत के उपसर्ग<\/h3>\n<p>गुरु (अं. ४३३, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३९९\">पृ. ३९९-४०१<\/a>) की सूची के उपसर्ग, मुख्य अर्थ और उदाहरण (प्रत्येक के तीन-तीन उदाहरण):<\/p>\n<table><tr><th>उपसर्ग<\/th><th>अर्थ<\/th><th>उदाहरण (विच्छेद सहित)<\/th><\/tr>\n<tr><td>अति<\/td><td>अधिक, उस पार, ऊपर<\/td><td>अत्यंत (अति+अंत), अत्याचार (अति+आचार), अतिरिक्त (अति+रिक्त)<\/td><\/tr>\n<tr><td>अधि<\/td><td>ऊपर, स्थान में, श्रेष्ठ<\/td><td>अधिकार (अधि+कार), अध्यात्म (अधि+आत्म), अधिराज<\/td><\/tr>\n<tr><td>अनु<\/td><td>पीछे, समान<\/td><td>अनुकरण (अनु+करण), अनुज (अनु+ज), अनुशासन<\/td><\/tr>\n<tr><td>अप<\/td><td>बुरा, विरुद्ध, अभाव<\/td><td>अपमान, अपराध, अपहरण<\/td><\/tr>\n<tr><td>अभि<\/td><td>ओर, पास, सामने<\/td><td>अभिमान, अभ्यास (अभि+आस), अभ्युदय (अभि+उदय)<\/td><\/tr>\n<tr><td>अव<\/td><td>नीचे, हीन, अभाव<\/td><td>अवगुण, अवतार, अवनत<\/td><\/tr>\n<tr><td>आ<\/td><td>तक, ओर, समेत, उलटा<\/td><td>आगमन, आजन्म (आ+जन्म), आक्रमण<\/td><\/tr>\n<tr><td>उत्<\/td><td>ऊपर, ऊँचा, श्रेष्ठ<\/td><td>उत्कर्ष, उन्नति (उत्+नति), उल्लेख (उत्+लेख)<\/td><\/tr>\n<tr><td>उप<\/td><td>निकट, सदृश, गौण<\/td><td>उपकार, उपवन, उपनाम<\/td><\/tr>\n<tr><td>दुर्, दुस्<\/td><td>बुरा, कठिन, दुष्ट<\/td><td>दुर्गुण, दुर्बल, दुष्कर्म (दुस्+कर्म)<\/td><\/tr>\n<tr><td>नि<\/td><td>भीतर, नीचे, बाहर<\/td><td>निवास, निपात, नियुक्त<\/td><\/tr>\n<tr><td>निर्, निस्<\/td><td>बाहर, निषेध<\/td><td>निर्भय, निरपराध, निश्चल (निस्+चल)<\/td><\/tr>\n<tr><td>परा<\/td><td>पीछे, उलटा<\/td><td>पराजय, पराक्रम, पराभव<\/td><\/tr>\n<tr><td>परि<\/td><td>आसपास, चारों ओर, पूर्ण<\/td><td>परिक्रमा, परिधि, पर्याप्त (परि+आप्त)<\/td><\/tr>\n<tr><td>प्र<\/td><td>अधिक, आगे, ऊपर<\/td><td>प्रकाश, प्रबल, प्रसार<\/td><\/tr>\n<tr><td>प्रति<\/td><td>विरुद्ध, सामने, एक-एक<\/td><td>प्रतिकूल, प्रत्यक्ष (प्रति+अक्ष), प्रत्येक (प्रति+एक)<\/td><\/tr>\n<tr><td>वि<\/td><td>भिन्न, विशेष, अभाव<\/td><td>विज्ञान, विदेश, विशेष<\/td><\/tr>\n<tr><td>सम्<\/td><td>अच्छा, साथ, पूर्ण<\/td><td>संगम, संतोष, संयोग (सम्+योग)<\/td><\/tr>\n<tr><td>सु<\/td><td>अच्छा, सहज, अधिक<\/td><td>सुगम, सुलभ, सुशिक्षित<\/td><\/tr><\/table>\n<p>गुरु की इस सूची में 19 मुख्य उपसर्ग हैं (दुर्/दुस् और निर्/निस् को दो-दो रूप गिनकर)। स्कूली पाठ्यपुस्तकों में प्रायः \"22 उपसर्ग\" पढ़ाए जाते हैं, जिनमें इन्हीं रूपों को अलग गिना जाता है और \"अपि\" भी शामिल रहता है; अपि गुरु की सूची में नहीं है। परीक्षा में अधिकतर ऊपर की सूची के उपसर्ग ही आते हैं।<\/p>\n<p><b>कुछ विशेष बातें (गुरु)<\/b><\/p>\n<ul><li><b>अति<\/b> हिंदी में स्वतंत्र शब्द की तरह भी चलता है (\"अति बुरी होती है\")।<\/li>\n<li><b>अव<\/b> का रूप पुरानी कविता में \"औ\" हो जाता है: औगुन, औसर।<\/li>\n<li><b>निर्, निस्<\/b> हिंदी में प्रायः \"नि\" हो जाता है: निधन, निबल, निडर।<\/li>\n<li><b>दो-तीन उपसर्ग एक साथ<\/b> (अं. ४३४, पृ. ४०१): निराकरण (निर्+आ+करण), प्रत्युपकार (प्रति+उप+कार), समालोचना (सम्+आ+लोचना), समभिव्याहार (सम्+अभि+वि+आ+हार)।<\/li><\/ul>\n<div class=\"ex\"><b>उदाहरण (एक से अधिक उपसर्ग):<\/b> व्याधि = वि + आ + धि (धि = धारण करना, धातु-अंश): दो उपसर्ग, इसलिए \"वि\" और \"आ\"। (2022 के प्रश्न का उत्तर)। परंतु अन्वेषण = अनु + एषण और अनुष्ठान = अनु + स्थान में एक ही उपसर्ग (अनु) है, और अध्यापक = अधि + आपक में भी एक (अधि)।<\/div>\n\n<h3>उपसर्ग-जैसे शब्द (गुरु अं. ४३५, पृ. ४०१-४०३)<\/h3>\n<p>संस्कृत में कुछ विशेषण और अव्यय भी उपसर्ग की तरह चलते हैं, क्योंकि ये प्रायः अकेले नहीं आते:<\/p>\n<table><tr><th>शब्द<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>अ / अन्<\/td><td>अभाव, निषेध<\/td><td>अगम, अज्ञान, अधर्म, अनीति; (स्वर से पहले) अनंतर, अनिष्ट, अनाचार, अनायास<\/td><\/tr>\n<tr><td>अधस्<\/td><td>नीचे<\/td><td>अधोगति, अधोमुख, अधःपतन<\/td><\/tr>\n<tr><td>अंतर्<\/td><td>भीतर<\/td><td>अंतःकरण, अंतर्धान, अंतर्भाव<\/td><\/tr>\n<tr><td>कु (का, कद)<\/td><td>बुरा<\/td><td>कुकर्म, कुरूप, कापुरुष, कदाचार<\/td><\/tr>\n<tr><td>चिर<\/td><td>बहुत समय का<\/td><td>चिरकाल, चिरायु<\/td><\/tr>\n<tr><td>पुनर्<\/td><td>फिर<\/td><td>पुनर्जन्म, पुनर्विवाह, पुनरुक्त<\/td><\/tr>\n<tr><td>स / सह<\/td><td>सहित, साथ<\/td><td>सावधान, सफल, सपरिवार; सहकारी, सहचर, सहोदर<\/td><\/tr>\n<tr><td>सत्<\/td><td>अच्छा<\/td><td>सज्जन, सत्कर्म, सद्गुरु<\/td><\/tr>\n<tr><td>स्व, स्वयं<\/td><td>अपना, अपने आप<\/td><td>स्वतंत्र, स्वदेश, स्वराज्य; स्वयंवर, स्वयंसेवक<\/td><\/tr>\n<tr><td>इति, नाना, पुरस्, प्राक्, प्रादुर्, बहिर्, आविर्, अलम्, तिरस्<\/td><td>क्रमशः: ऐसा, बहुत, सामने, पहले का, प्रकट, बाहर, प्रकट, सुंदर, तुच्छ<\/td><td>इतिहास, नानारूप, पुरस्कार, प्राक्कथन, प्रादुर्भाव, बहिष्कार, आविष्कार, अलंकार, तिरस्कार<\/td><\/tr><\/table>\n<p>गुरु की एक और सूचना (पृ. ४०३): कृ, भू धातुओं से पहले कई संज्ञा-विशेषण \"ई\" वाले अव्यय बनकर आते हैं: स्वीकार, वर्गीकरण, वशीकरण, फलीभूत, भस्मीभूत, समीकरण।<\/p>\n\n<h3>\"अ\" और \"अन्\" का नियम (2023 के प्रश्न का आधार)<\/h3>\n<p>गुरु (पृ. ४०१): \"स्वरादि शब्दों के पहले 'अ' के स्थान में 'अन्' हो जाता है और 'अन्' के 'न्' में आगे का स्वर मिल जाता है।\"<\/p>\n<table><tr><th>आगे का वर्ण<\/th><th>रूप<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>व्यंजन (क, न, ग...)<\/td><td>अ<\/td><td>अनीति (अ+नीति), अगम, अज्ञान, अधर्म<\/td><\/tr>\n<tr><td>स्वर (अ, आ, इ, उ...)<\/td><td>अन्<\/td><td>अनंतर (अन्+अंतर), अनिष्ट (अन्+इष्ट), अनाचार (अन्+आचार), अनायास (अन्+आयास)<\/td><\/tr><\/table>\n<p><b>हिंदी में अपवाद<\/b> (गुरु पृ. ४०३): हिंदी के कुछ शब्दों में <b>व्यंजन से पहले भी \"अन\"<\/b> आ जाता है: अनगिनती, अनबन, अनमेल, अनहित, अनभल।<\/p>\n\n<h3>हिंदी के उपसर्ग (गुरु, पृ. ४०३-४०४)<\/h3>\n<p>ये बहुधा संस्कृत उपसर्गों के अपभ्रंश हैं और तद्भव शब्दों से पहले आते हैं।<\/p>\n<table><tr><th>उपसर्ग<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>अ<\/td><td>अभाव, निषेध<\/td><td>अचेत, अजान, अथाह, अबेर, अलग<\/td><\/tr>\n<tr><td>अन<\/td><td>निषेध (व्यंजन से पहले भी)<\/td><td>अनगिनती, अनबन, अनमेल, अनहित<\/td><\/tr>\n<tr><td>अध<\/td><td>आधा<\/td><td>अधपका, अधमरा, अधपई<\/td><\/tr>\n<tr><td>उन<\/td><td>एक कम<\/td><td>उन्नीस, उनतीस, उनचास, उनसठ<\/td><\/tr>\n<tr><td>औ<\/td><td>हीन, निषेध (अव से)<\/td><td>औगुन, औसर, औढर, औदसा<\/td><\/tr>\n<tr><td>दु<\/td><td>बुरा, हीन (दुर् से)<\/td><td>दुकाल, दुचला<\/td><\/tr>\n<tr><td>नि<\/td><td>रहित (निर् से)<\/td><td>निकम्मा, निडर, निधड़क, निहत्था, निरोगी<\/td><\/tr>\n<tr><td>बिन<\/td><td>बिना, निषेध<\/td><td>बिनजाते, बिन-बेया, बिन-ब्याहा<\/td><\/tr>\n<tr><td>भर<\/td><td>पूरा, ठीक<\/td><td>भरपेट, भरपूर, भरसक, भरदौड़<\/td><\/tr><\/table>\n\n<h3>उर्दू (और अंग्रेज़ी) के उपसर्ग (गुरु, पृ. ४०४-४०६)<\/h3>\n<table><tr><th>उपसर्ग<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>कम<\/td><td>थोड़ा, हीन<\/td><td>कमज़ोर, कमबख़्त, कमउम्र, कमहिम्मत<\/td><\/tr>\n<tr><td>ख़ुश<\/td><td>अच्छा<\/td><td>ख़ुशबू, ख़ुशदिल, ख़ुशक़िस्मत<\/td><\/tr>\n<tr><td>ग़ैर<\/td><td>भिन्न, विरुद्ध<\/td><td>ग़ैरसरकारी, ग़ैरमुल्क, ग़ैरवाजिब<\/td><\/tr>\n<tr><td>ना<\/td><td>अभाव<\/td><td>नादान, नापसंद, नाराज़, नालायक<\/td><\/tr>\n<tr><td>बद<\/td><td>बुरा<\/td><td>बदनाम, बदबू, बदमाश, बदक़िस्मत<\/td><\/tr>\n<tr><td>बे<\/td><td>बिना<\/td><td>बेईमान, बेचारा, बेरहम, बेवक़ूफ़<\/td><\/tr>\n<tr><td>ला<\/td><td>बिना, अभाव<\/td><td>लाचार, लावारिस, लाजवाब<\/td><\/tr>\n<tr><td>बा<\/td><td>साथ<\/td><td>बाक़ायदा, बातमीज़<\/td><\/tr>\n<tr><td>हम<\/td><td>साथ, समान<\/td><td>हमउम्र, हमदर्दी, हमनाम<\/td><\/tr>\n<tr><td>हर<\/td><td>प्रत्येक<\/td><td>हरसाल, हरदिन, हरघड़ी<\/td><\/tr>\n<tr><td>सर<\/td><td>मुख्य<\/td><td>सरकार, सरदार, सरहद<\/td><\/tr>\n<tr><td>अल, ऐन, दर, फ़ी, ब, बर, बिल, बिला<\/td><td>क्रमशः: निश्चित, ठीक, में, में/पर, अनुसार, ऊपर, साथ, बिना<\/td><td>अलबत्ता, ऐनवक़्त, दरअसल, फ़िलहाल, बनाम, बराबर, बिलकुल, बिलाशक<\/td><\/tr>\n<tr><td>सब (अंग्रेज़ी)<\/td><td>अधीन, भीतरी<\/td><td>सब-जज, सब-रजिस्ट्रार, सब-कमेटी<\/td><\/tr><\/table>\n<p>गुरु की सूचना: \"बे\" हिंदी शब्दों में भी लगता है (बेकाम, बेचैन, बेजोड़, बेमन, बेडौल); \"ला\" और \"बे\" का अर्थ एक है: बिना।<\/p>\n\n<h3>उपसर्ग जुड़ने पर सन्धि (शब्द का रूप कैसे बदलता है)<\/h3>\n<p>संस्कृत उपसर्ग जब शब्द के साथ जुड़ते हैं तो सन्धि के नियम चलते हैं (गुरु अं. ४४६, पृ. ४६३: \"संस्कृत शब्दों में संधि अवश्य होती है\"), इसलिए रूप बदल जाता है। हिंदी और उर्दू के उपसर्गों में सन्धि बहुधा नहीं होती (अन+बन = अनबन, बे+ईमान = बेईमान)। उपसर्ग-विच्छेद वाले प्रश्न हल करने की चाबी यही है कि <b>बदले रूप को मूल उपसर्ग तक लौटाया जाए<\/b>। गुरु के सन्धि-प्रकरण (अं. ६०-८५, पृ. ७३-८१) के नियम:<\/p>\n<h4>(क) स्वर सन्धि: उपसर्ग के अंत का स्वर<\/h4>\n<table><tr><th>नियम<\/th><th>उदाहरण<\/th><th>उपसर्ग<\/th><\/tr>\n<tr><td>इ/ई + असवर्ण स्वर: य् (यण)<\/td><td>अति+आचार = अत्याचार; प्रति+उपकार = प्रत्युपकार; नि+ऊन = न्यून; प्रति+एक = प्रत्येक; अधि+आत्म = अध्यात्म; परि+आप्त = पर्याप्त<\/td><td>अति, प्रति, नि, अधि, परि<\/td><\/tr>\n<tr><td>उ/ऊ + असवर्ण स्वर: व् (यण)<\/td><td>अनु+एषण = अन्वेषण; सु+आगत = स्वागत; अनु+इत = अन्वित<\/td><td>अनु, सु<\/td><\/tr>\n<tr><td>अ + अ / आ: दीर्घ<\/td><td>उप+अध्यक्ष = उपाध्यक्ष; अव+आप्ति = अवाप्ति<\/td><td>उप, अव<\/td><\/tr>\n<tr><td>अ + इ / उ: गुण (ए, ओ)<\/td><td>उप+उक्त = उपोक्त; प्र+ईक्षा = प्रेक्षा<\/td><td>उप, प्र<\/td><\/tr>\n<tr><td>अ + ऊ: वृद्धि (अपवाद)<\/td><td>प्र+ऊढ = प्रौढ़<\/td><td>प्र<\/td><\/tr><\/table>\n<p>गुरु के अपने स्वर-सन्धि उदाहरण: यदि+अपि = यद्यपि, इति+आदि = इत्यादि, प्रति+उपकार = प्रत्युपकार, नि+ऊन = न्यून, प्रति+एक = प्रत्येक, अनु+एषण = अन्वेषण, सु+आगत = स्वागत, अनु+इत = अन्वित (पृ. ७५-७६)।<\/p>\n<h4>(ख) व्यंजन सन्धि: \"उत्\" और \"सम्\" और \"नि/अभि/वि\" के बाद \"स\"<\/h4>\n<table><tr><th>नियम<\/th><th>उदाहरण<\/th><th>कारण<\/th><\/tr>\n<tr><td>उत् के \"त्\" का बदलाव<\/td><td>उत्+चारण = उच्चारण; उत्+लेख = उल्लेख; उत्+ज्वल = उज्ज्वल; उत्+हार = उद्धार; उत्+गम = उद्गम; उत्+नति = उन्नति<\/td><td>त् आगे वाले वर्ण से मिलकर बदलता है (पृ. ७७-७८)<\/td><\/tr>\n<tr><td>सम् + वर्ग-वर्ण: अनुस्वार या पंचमाक्षर<\/td><td>सम्+कल्प = संकल्प / सङ्कल्प; सम्+तोष = संतोष / सन्तोष; सम्+पूर्ण = संपूर्ण / सम्पूर्ण<\/td><td>विकल्प से दोनों रूप (पृ. ७८)<\/td><\/tr>\n<tr><td>सम् + अंतस्थ/ऊष्म: अनुस्वार<\/td><td>सम्+योग = संयोग; सम्+वाद = संवाद; सम्+हार = संहार<\/td><td>म् → ं (पृ. ७८); अपवाद: सम्+राज = सम्राज<\/td><\/tr>\n<tr><td>इ/उ स्वर के बाद \"स\" → \"ष\"<\/td><td>अभि+सेक = अभिषेक; नि+सिद्ध = निषिद्ध; वि+सम = विषम; अनु+स्थान = अनुष्ठान<\/td><td>(पृ. ७८-७९)<\/td><\/tr>\n<tr><td>अपवाद: जहाँ \"स\" के बाद ऋ/र वाली धातु<\/td><td>वि+स्मरण = विस्मरण; अनु+सरण = अनुसरण; वि+सर्ग = विसर्ग<\/td><td>\"स\" ष नहीं बनता (पृ. ७९)<\/td><\/tr>\n<tr><td>स्वर + छ: च्छ<\/td><td>आ+छादन = आच्छादन; परि+छेद = परिच्छेद; वि+छेद = विच्छेद<\/td><td>(पृ. ७८)<\/td><\/tr>\n<tr><td>र/ष के बाद न → ण<\/td><td>प्र+मान = प्रमाण; परि+नाम = परिणाम; प्र+नाम = प्रणाम<\/td><td>(पृ. ७८)<\/td><\/tr><\/table>\n<h4>(ग) विसर्ग सन्धि: निः / दुः (निस् / दुस् / निर् / दुर्)<\/h4>\n<p>निर्/निस् और दुर्/दुस् असल में \"निः\", \"दुः\" (विसर्ग वाले) रूप हैं। आगे के वर्ण के अनुसार वे बदलते हैं (गुरु पृ. ७९-८१):<\/p>\n<table><tr><th>आगे का वर्ण<\/th><th>बदलाव<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>च, छ<\/td><td>विसर्ग → श्<\/td><td>निः+चल = निश्चल; निः+छिद्र = निश्छिद्र; निः+शुल्क = निश्शुल्क<\/td><\/tr>\n<tr><td>त, थ<\/td><td>विसर्ग → स्<\/td><td>निः+तार = निस्तार; दुः+तर = दुस्तर; मनः+ताप = मनस्ताप<\/td><\/tr>\n<tr><td>क, ख, प, फ (इ/उ के बाद)<\/td><td>विसर्ग → ष्<\/td><td>निः+कपट = निष्कपट; दुः+कर्म = दुष्कर्म; निः+फल = निष्फल; निः+पक्ष = निःपक्ष / निष्पक्ष (अपवाद: दुःख)<\/td><\/tr>\n<tr><td>श, ष, स<\/td><td>विसर्ग वैसा ही या आगे वाला वर्ण दोहरा<\/td><td>दुः+शासन = दुःशासन / दुश्शासन; निः+संदेह = निःसंदेह / निस्संदेह<\/td><\/tr>\n<tr><td>स्वर या घोष वर्ण (ग, द, ब, र...)<\/td><td>विसर्ग → र्<\/td><td>निः+आशा = निराशा; दुः+उपयोग = दुरुपयोग; निः+गुण = निर्गुण; निः+भय = निर्भय; दुः+गम = दुर्गम<\/td><\/tr>\n<tr><td>र<\/td><td>र् का लोप, पहला स्वर दीर्घ<\/td><td>निः+रस = नीरस; निः+रोग = नीरोग<\/td><\/tr><\/table>\n<div class=\"trap\"><b>2024 के प्रश्न की जड़:<\/b> निश्शुल्क, निष्पक्ष, निस्स्वार्थ तीनों में उपसर्ग <b>\"निस्\"<\/b> ही है। निश्शुल्क = निस्+शुल्क (स्+श → श्श), निष्पक्ष = निस्+पक्ष (स्→ष), निस्स्वार्थ = निस्+स्वार्थ। इसलिए \"निस्\" वाला विभाजन नियमानुसार है। अपरिग्रह, अपरोक्ष में उपसर्ग \"अ\" है (\"अप\" नहीं: अ+परिग्रह, अ+परोक्ष); आरण्यक, आधुनिक में \"आ\" उपसर्ग नहीं; \"व्याधि\" में \"वी\" नहीं, \"वि+आ\" है।<\/div>\n\n<h2>प्रत्यय (suffix)<\/h2>\n<p class=\"eq\"><span>मूल शब्द / धातु<\/span> + <span>प्रत्यय<\/span> = <b>नया शब्द<\/b><\/p>\n<p>पहले देखें कि प्रत्यय <b>कौन-सी भाषा का<\/b> है (संस्कृत, हिंदी, उर्दू/फ़ारसी/अरबी), फिर कि <b>कृत्<\/b> है या <b>तद्धित<\/b>। गुरु ने इन्हीं के आधार पर पूरा अध्याय बाँटा है: \"तीसरा अध्याय: संस्कृत प्रत्यय\" (पृ. ४०७-४२१), \"हिंदी प्रत्यय\" (पृ. ४२१-४४९), \"उर्दू प्रत्यय\" (पृ. ४४९-४५६)।<\/p>\n\n<h3>कृत् प्रत्यय (धातु से), अर्थ के आधार पर<\/h3>\n<p>कृदंत शब्द कुछ तरह के अर्थ देते हैं (गुरु इन्हीं नामों से बाँटते हैं): <b>कर्तृवाचक<\/b> (करने वाला), <b>कर्मवाचक<\/b> (जिस पर क्रिया हो), <b>करणवाचक<\/b> (साधन), <b>भाववाचक<\/b> (क्रिया का भाव), <b>विशेषण / योग्यार्थक<\/b>, और क्रिया-द्योतक कृदंत (वर्तमानकालिक, भूतकालिक, पूर्वकालिक, अपूर्ण-क्रिया-द्योतक)।<\/p>\n\n<h4>संस्कृत कृत् (गुरु पृ. ४०७-४१४)<\/h4>\n<table><tr><th>प्रत्यय<\/th><th>अर्थ<\/th><th>उदाहरण (धातु → शब्द)<\/th><\/tr>\n<tr><td>अक<\/td><td>कर्तृवाचक<\/td><td>लिख → लेखक; पठ → पाठक; दा → दायक; गै → गायक; युज् → योजक<\/td><\/tr>\n<tr><td>अन<\/td><td>कर्तृ / भाव / करण<\/td><td>नंद → नंदन; साधु → साधन; सह → सहन; पाल → पालन; भू → भूषण; वह → वाहन<\/td><\/tr>\n<tr><td>अना<\/td><td>भाववाचक<\/td><td>वंद → वंदना; रच → रचना; तुल → तुलना; सूच → सूचना<\/td><\/tr>\n<tr><td>अनीय<\/td><td>योग्यार्थक<\/td><td>दृश् → दर्शनीय; स्मृ → स्मरणीय; रम् → रमणीय; मन् → माननीय; आ+दृ → आदरणीय<\/td><\/tr>\n<tr><td>आ<\/td><td>भाववाचक<\/td><td>पूज → पूजा; क्रीड् → क्रीड़ा; चिंत् → चिंता; शिक्ष → शिक्षा<\/td><\/tr>\n<tr><td>इन् (ई)<\/td><td>कर्तृवाचक<\/td><td>त्यज् → त्यागी; दुष् → दोषी; वद् → वादी; सम्+यम् → संयमी<\/td><\/tr>\n<tr><td>इष्णु, उ, उक, उर्<\/td><td>कर्तृवाचक / योग्यार्थक<\/td><td>सह → सहिष्णु; भिक्ष् → भिक्षु; भू → भावुक; भंज् → भंगुर; भास् → भासुर<\/td><\/tr>\n<tr><td>त (भूतकालिक)<\/td><td>जो बीत चुका<\/td><td>गम् → गत; भू → भूत; कृ → कृत; मृ → मृत; दृश् → दृष्ट<\/td><\/tr>\n<tr><td>ता / तृ<\/td><td>कर्तृवाचक<\/td><td>दा → दाता; नी → नेता; कृ → कर्ता; वच् → वक्ता; भुज् → भोक्ता<\/td><\/tr>\n<tr><td>तव्य<\/td><td>योग्यार्थक<\/td><td>कृ → कर्तव्य; भू → भवितव्य; वच् → वक्तव्य<\/td><\/tr>\n<tr><td>ति<\/td><td>भाववाचक<\/td><td>कृ → कृति; मन् → मति; गम् → गति; स्मृ → स्मृति; बुध् → बुद्धि<\/td><\/tr>\n<tr><td>त्र<\/td><td>करणवाचक<\/td><td>नी → नेत्र; पा → पात्र; शास् → शास्त्र; शस् → शस्त्र<\/td><\/tr>\n<tr><td>न<\/td><td>भाववाचक<\/td><td>यत् → यत्न; स्वप् → स्वप्न; प्रच्छ → प्रश्न<\/td><\/tr>\n<tr><td>मान<\/td><td>वर्तमानकालिक<\/td><td>विद् → विद्यमान; वृत् → वर्तमान; वि+रज् → विराजमान<\/td><\/tr>\n<tr><td>य<\/td><td>योग्यार्थक<\/td><td>कृ → कार्य; पठ → पाठ्य; वच् → वाच्य; दृश् → दृश्य<\/td><\/tr>\n<tr><td>या<\/td><td>भाववाचक<\/td><td>विद् → विद्या; कृ → क्रिया; सम्+अस् → समस्या<\/td><\/tr><\/table>\n<div class=\"trap\"><b>\"अनीय\" और \"ईय\" का भेद (2024 का प्रश्न):<\/b> \"अनीय\" कृत् है (धातु से): दर्शनीय (दृश्), माननीय। \"ईय\" तद्धित है (संज्ञा से): नारदीय, पाणिनीय, भवदीय, स्थानीय, मानवीय। इसलिए \"नारदीय, स्थानीय, मानवीय\" का प्रत्यय <b>ईय<\/b> है, अनीय नहीं।<\/div>\n\n<h4>हिंदी कृत् (गुरु पृ. ४२१-४३७)<\/h4>\n<table><tr><th>प्रत्यय<\/th><th>अर्थ<\/th><th>उदाहरण (धातु → शब्द)<\/th><\/tr>\n<tr><td>अ (शून्य)<\/td><td>भाववाचक<\/td><td>लूटना → लूट; मारना → मार; जाँचना → जाँच; समझना → समझ<\/td><\/tr>\n<tr><td>आ<\/td><td>भाववाचक / भूतकालिक<\/td><td>घेरना → घेरा; झगड़ना → झगड़ा; मरना → मरा; बैठना → बैठा<\/td><\/tr>\n<tr><td>आई<\/td><td>भाववाचक<\/td><td>लड़ना → लड़ाई; चढ़ना → चढ़ाई; पढ़ना → पढ़ाई; सुनना → सुनाई; खुदना → खुदाई<\/td><\/tr>\n<tr><td>आऊ<\/td><td>योग्यता / कर्तृवाचक<\/td><td>टिकना → टिकाऊ; बिकना → बिकाऊ; जलना → जलाऊ; खाना → खाऊ<\/td><\/tr>\n<tr><td>आक, आकू, अक्कड़<\/td><td>कर्तृवाचक<\/td><td>तैरना → तैराक; लड़ना → लड़ाकू; भूलना → भुलक्कड़; पीना → पियक्कड़<\/td><\/tr>\n<tr><td>आन<\/td><td>भाववाचक<\/td><td>उड़ना → उड़ान; उठना → उठान; मिलना → मिलान<\/td><\/tr>\n<tr><td>आव<\/td><td>भा
