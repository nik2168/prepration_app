/* Pastel theme, same as the Family Money app. Pastels look the same in both themes and always carry dark text. */
:root{--bg:#F5F5F7;--surface:#fff;--ice:#F1F1F3;--sky:#F1F1F3;--sky2:#B9A5F3;--pri:#0B0B0C;--navy:#0B0B0C;--ink:#0B0B0C;--mut:#6B6B70;--line:#ECECEF;--on:#fff;--bad:#B42318;--badb:#F7D9D9;--hero:#0B0B0C;--heroink:#fff;--heromut:#A1A1A6;
--lavender:#E8DDFB;--mint:#D7F2DC;--butter:#F8E9B8;--blush:#F7D9D9;--peri:#DCDDF6;--pastel-ink:#0B0B0C;
--sh:0 1px 2px rgba(11,11,12,.04),0 10px 28px -18px rgba(11,11,12,.28);--r:28px;--f:Lexend,"Noto Sans Devanagari","Kohinoor Devanagari",system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--surface:#1C1C1E;--ice:#2A2A2C;--sky:#2A2A2C;--sky2:#5A5A5E;--pri:#fff;--navy:#fff;--ink:#fff;--mut:#A1A1A6;--line:#2C2C2E;--on:#0B0B0C;--bad:#FF8A80;--badb:#3A1F1F;--hero:#1C1C1E;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#000;--surface:#1C1C1E;--ice:#2A2A2C;--sky:#2A2A2C;--sky2:#5A5A5E;--pri:#fff;--navy:#fff;--ink:#fff;--mut:#A1A1A6;--line:#2C2C2E;--on:#0B0B0C;--bad:#FF8A80;--badb:#3A1F1F;--hero:#1C1C1E;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}html{background:var(--bg);-webkit-text-size-adjust:100%}html,body{touch-action:manipulation} /* no double-tap zoom */
body{font:400 15px/1.5 var(--f);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer}button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px}h1{font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.015em}h2{font-size:18px;font-weight:600;line-height:1.3}h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.sm{font-size:13.5px}.grow{flex:1;min-width:0}.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:16px}.bet{justify-content:space-between}
/* frame: floating tabs on phones, sidebar from 768px */
.app{min-height:100dvh}.brand{display:none}
main{padding:18px 16px calc(env(safe-area-inset-bottom) + 112px);max-width:1180px;margin:auto}
.nav{position:fixed;z-index:20;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;border-radius:32px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 16px 36px -14px rgba(11,11,12,.45)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:27px;font-size:11.5px;font-weight:500;color:var(--mut);min-height:52px}.nav button[aria-current]{background:var(--pri);color:var(--on)}
@media(min-width:768px){.app{display:grid;grid-template-columns:232px minmax(0,1fr)}.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 20px}.brand b{display:block;font-weight:600;line-height:1.25}.nav{position:static;flex-direction:column;padding:0;background:none;box-shadow:none;border-radius:0}.nav button{flex-direction:row;gap:12px;font-size:15px;padding:11px 13px;border-radius:14px;min-height:46px}.nav button:not([aria-current]):hover{background:var(--ice)}main{padding:28px 32px 56px;width:100%}}
.focus .side{display:none}.focus.app{display:block}
/* buttons, chips, segments */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:99px;font-weight:500;background:var(--sky);color:var(--navy);white-space:nowrap}.btn.p{background:var(--pri);color:var(--on)}.btn.l{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}.btn.s{min-height:40px;padding:7px 15px;font-size:14px}.btn.w{background:#fff;color:#0B0B0C}
@media(hover:hover){.btn:not(:disabled):hover{filter:brightness(.96)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none;scroll-snap-type:x proximity}.chips button{flex:none;min-height:42px;padding:8px 16px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;scroll-snap-align:start}.chips button[aria-pressed=true]{background:var(--navy);color:var(--on);box-shadow:none}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible}}
.seg{display:flex;background:var(--sky);border-radius:99px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg button{flex:1 0 auto;min-height:40px;padding:6px 16px;border-radius:99px;font-size:14.5px;font-weight:500;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--surface);color:var(--navy);box-shadow:var(--sh)}
.tag{display:inline-block;font-size:12.5px;line-height:1.4;border-radius:99px;padding:2px 10px;background:var(--sky);color:var(--navy);white-space:nowrap}.tag.o{background:none;box-shadow:inset 0 0 0 1px var(--sky2)}.tag.bad{background:var(--badb);color:var(--bad)}
/* native dropdowns: the browser's own select, styled where supported */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13.5px;color:var(--mut)}
select,.inp{width:100%;min-height:48px;border:0;border-radius:15px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:10px 14px;font-size:16px;color:var(--ink);cursor:pointer}.inp{cursor:text}.inp::placeholder{color:var(--mut)}
select:hover{box-shadow:inset 0 0 0 1px var(--sky2)}
@supports (appearance:base-select){select,::picker(select){appearance:base-select}select{display:flex;align-items:center;justify-content:space-between;gap:10px}selectedcontent{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select::picker-icon{content:"";width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translate(-3px,-3px);transition:transform .18s}select:open::picker-icon{transform:rotate(225deg) translate(-3px,-3px)}select:open{box-shadow:inset 0 0 0 2px var(--pri)}
::picker(select){margin-block:7px;padding:7px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 26px 54px -20px rgba(11,11,12,.5);max-height:min(400px,60dvh);min-width:anchor-size(width);max-width:calc(100vw - 24px)}
option{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 13px;border-radius:13px;font-size:15px}option:hover,option:focus-visible{background:var(--ice);outline:0}option:checked{background:var(--sky);color:var(--navy);font-weight:500}option::checkmark{content:"✓";order:2;margin-left:auto;color:var(--pri)}optgroup{font-weight:500;color:var(--mut);font-size:13px}optgroup legend{padding:10px 13px 4px}optgroup option{color:var(--ink)}}
.sw{display:flex;align-items:center;gap:11px;min-height:48px;cursor:pointer;color:var(--ink);font-size:15px}.sw input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--sky2);position:relative;cursor:pointer;flex:none;transition:background .18s}.sw input::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .18s}.sw input:checked{background:var(--pri)}.sw input:checked::after{left:21px}
/* surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}.tint{background:var(--lavender);color:var(--pastel-ink);box-shadow:none}.tint .mut{color:#3A3A3C}.flat{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.hero{background:var(--hero);color:var(--heroink);border-radius:30px;padding:24px;display:grid;gap:22px;overflow:hidden;position:relative}.hero .mut{color:var(--heromut)}.hero h1{font-size:clamp(26px,4.4vw,38px)}@media(min-width:900px){.hero{grid-template-columns:1.2fr 1fr;padding:34px;align-items:center}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}.g2{display:grid;gap:14px}@media(min-width:1000px){.g2{grid-template-columns:1fr 1fr;align-items:start}}
.filters{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.filters .wide{grid-column:1/-1}@media(min-width:900px){.filters{grid-template-columns:1.4fr 1fr 1fr 1fr}.filters .wide{grid-column:auto}}
.setup{display:grid;gap:12px}@media(min-width:700px){.setup{grid-template-columns:1.5fr 1.3fr auto;align-items:end}}
.paper{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}.paper b{font-size:18px;font-weight:600;display:block}.vwrap{max-width:820px;margin:auto;padding:16px 16px 80px}.vq .opts{max-width:none}.vq .eye{flex:none}.vq .eye .i{width:20px;height:20px}@media(max-width:560px){.wd2{display:none}}
/* OMR bubbles */
.omr{display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid var(--sky2);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--mut)}
.mx{overflow-x:auto;margin:0 -18px;padding:0 18px}.mx table{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}.mx th{font-weight:500;font-size:13px;color:var(--mut);padding:4px 2px 10px;text-align:center}.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;padding-right:10px;min-width:150px;max-width:250px}.mx td{border-top:1px solid var(--line);padding:6px 2px;text-align:center;height:56px}
.b{display:inline-grid;place-items:center;border-radius:50%;background:var(--pri);color:var(--on);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}.b.z{background:none;border:1.5px solid var(--line);width:12px;height:12px}.b.y{background:var(--sky2);color:#0B0B0C}.b.na{background:none;color:var(--mut)}
.lnk{color:var(--pri);font-weight:500;text-align:left}.lnk:hover{text-decoration:underline}.nm{font-weight:500;color:var(--ink)}
.bar{height:8px;border-radius:9px;background:var(--sky);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}.bar.wk i{background:var(--bad)}

), (b), (c) and (d)"]},{"i":"2024_19","y":2024,"n":19,"t":"CDP.tch","a":[2],"x":"Which one of the following is not a component of progressive education ?","o":["Discussion","Memorization","Experientation","Interaction"]},{"i":"2024_20","y":2024,"n":20,"t":"CDP.ass","a":[4],"x":"Which of the following is not a feature of continuous and comprehensive evaluation ?","o":["Regularity of assessment","Frequency of unit tests","Diagnosis of learning gaps","Measuring only scholastic achievement"]},{"i":"2024_21","y":2024,"n":21,"t":"CDP.lrn","a":[4],"x":"Which of the following is not an environmental factor affecting teaching-learning ?","o":["Learning material","Physical conditions","Recreational facilities","Maturation"]},{"i":"2024_22","y":2024,"n":22,"t":"CDP.inc","a":[4],"x":"Which of the following is not a characteristic of inclusive education ?","o":["It supports special educational needs","It says to celebrate diversity","This ensures the participation of teacher, parents, child and society","It is limited to the special education of disabled children"]},{"i":"2024_23","y":2024,"n":23,"t":"CDP.psy","a":[1],"x":"Match the following stages of Kohlberg's moral development theory with their characteristics :\nMoral Stages | Characteristics\n(a) Conforming to obtain reward | (i) Getting the approval of others\n(b) Maintaining social order | (ii) Stage based on self-interest\n(c) Good interpersonal relationships | (iii) Eternal value accepted by conscience\n(d) Universal ethical principles | (iv) Importance of justice and law\nChoose the correct code :\n(a) (b) (c) (d)","o":["(ii) (iv) (i) (iii)","(iii) (i) (ii) (iv)","(iv) (iii) (i) (ii)","(i) (ii) (iv) (iii)"]},{"i":"2024_24","y":2024,"n":24,"t":"CDP.cre","a":[3],"x":"Which tests can be administered by the teacher to identify creative children ? (a) Figure construction test (b) Product improvement test (c) Usual uses test (d) Picture completion test Choose the correct code :","o":["(a) and (d)","(b) and (c)","(a), (b) and (d)","(a), (b), (c) and (d)"]},{"i":"2024_25","y":2024,"n":25,"t":"CDP.cog","a":[3],"x":"According to Piaget's cognitive development theory, when the learner maintaining a proper balance between himself/herself and his/her environment, this mechanism is called as :","o":["Accommodation","Assimilation","Equilibration","Integration"]},{"i":"2024_26","y":2024,"n":26,"t":"CDP.ado","a":[3],"x":"Which option is correct regarding emotions in early adolescence ?","o":["Intense and rational","Uncontrolled and rational","Uncontrolled and irrational","Controlled and intense"]},{"i":"2024_27","y":2024,"n":27,"t":"CDP.lrn","a":[1],"x":"Arrange the steps of Bandura's social learning theory in sequence : (a) Perception of behaviour (b) Reinforcement of behaviour (c) Remember of behaviour (d) Convert the memory into action Choose the correct code :","o":["(a), (c), (d), (b)","(b), (a), (c), (d)","(c), (d), (a), (b)","(b), (c), (d), (a)"]},{"i":"2024_28","y":2024,"n":28,"t":"CDP.inc","a":[3],"x":"Which of the following should not be a need of children with impairment from the point of view of inclusive education ?","o":["Need for coping with own's impairment","Need for proper guidance & counselling","Need for being dependent on others","Need for assistive equipments"]},{"i":"2024_29","y":2024,"n":29,"t":"CDP.lrn","a":[3],"x":"In a learning situation presenting relevant facts separately from non- relevant facts, is indicative of which principle of learning ?","o":["Principle of multiple response","Principle of analogy","Principle of prepotency of elements","Principle of associative shifting"]},{"i":"2024_30","y":2024,"n":30,"t":"CDP.mot","a":[1],"x":"According to McDougall, the emotion of 'disgust' is associated with which basic instinct ?","o":["Repulsion","Escape","Combat","Curiosity"]},{"i":"2024_31","y":2024,"n":31,"t":"HIN.ped","a":[3],"x":"निम्नलिखित में से मौन वाचन का उद्देश्य [[नहीं]] है :","o":["उचित लय और गति प्रदान करना।","स्वाध्याय की आदत विकसित करना।","तीव्र गति से पढ़ , narrative or scientific) with questions on comprehension, grammar and verbal ability."},{"id":"eng-ped","name":"English teaching","tags":["ENG.ped"],"syl":"Learning and acquisition, principles of language teaching, listening and speaking, role of grammar, teaching a diverse classroom, language difficulties and errors, language skills, teaching-learning materials."}]},{"name":"Grammar asked in past papers","topics":[{"id":"eng-gram","name":"Grammar","tags":["ENG.tense","ENG.art","ENG.pos","ENG.voice","ENG.sent","ENG.err"],"syl":"Tenses, articles, prepositions, parts of speech, voice and narration, sentence ordering, error spotting."},{"id":"eng-voc","name":"Vocabulary and idioms","tags":["ENG.voc","ENG.idi"],"syl":"Synonyms, antonyms, one-word substitution, idioms and phrasal verbs."}]}]},{"id":"gk","name":"Haryana GK and Awareness","marks":10,"units":[{"name":"Official syllabus","topics":[{"id":"gk-his","name":"History, culture, art and literature","tags":["G.his"],"syl":"Haryana related history, literature, culture, art and traditions."},{"id":"gk-geo","name":"Geography and environment","tags":["G.geo"],"syl":"Geography and environment of Haryana."},{"id":"gk-pol","name":"Civics and administration","tags":["G.pol"],"syl":"Civics of Haryana."},{"id":"gk-sch","name":"Welfare schemes","tags":["G.sch"],"syl":"Welfare schemes of the Haryana Government."},{"id":"gk-cur","name":"Current affairs, sports and awards","tags":["G.spo"],"syl":"Haryana current affairs."}]}]},{"id":"rea","name":"Reasoning Ability","marks":10,"units":[{"name":"Official syllabus","topics":[{"id":"r-ana","name":"Analogy, classification and series","tags":["R.ana","R.ser"],"syl":"Semantic, symbolic/number and figural analogy, classification and series, Venn diagrams, embedded figures."},{"id":"r-cod","name":"Coding-decoding and word building","tags":["R.cod","R.wor"],"syl":"Coding and decoding, word building, small and capital letters/numbers coding, indexing, address and date matching."},{"id":"r-rel","name":"Relations, directions, ranking and calendar","tags":["R.blo","R.dir","R.ran","R.cal"],"syl":"Relationship concepts, space orientation, problem solving, arithmetical reasoning."},{"id":"r-log","name":"Logic and non-verbal reasoning","tags":[],"syl":"Statement and conclusion, syllogism, drawing inferences, punched hole and paper folding, figural pattern completion, critical thinking, emotional and social intelligence."}]}]},{"id":"qa","name":"Quantitative Aptitude","marks":10,"units":[{"name":"Official syllabus","topics":[{"id":"q-num","name":"Numbers and simplification","tags":["Q.num"],"syl":"Whole numbers, decimals, fractions, relationships between numbers, square roots, elementary surds."},{"id":"q-pct","name":"Percentage, profit-loss and interest","tags":["Q.pct","Q.int"],"syl":"Percentage, interest, profit and loss, discount."},{"id":"q-rat","name":"Ratio, average, partnership and mixture","tags":["Q.rat"],"syl":"Ratio and proportion, averages, partnership business, mixture and alligation."},{"id":"q-tim","name":"Time, work and distance","tags":["Q.tim"],"syl":"Time and distance, time and work."},{"id":"q-alg","name":"Algebra","tags":["Q.alg"],"syl":"Basic algebraic identities, graphs of linear equations."},{"id":"q-geo","name":"Geometry, mensuration and trigonometry","tags":["Q.geo"],"syl":"Triangles and their centres, congruence and similarity, circles, chords and tangents, quadrilaterals, regular polygons, prism, cone, cylinder, sphere, hemisphere, cuboid, pyramid, trigonometric ratios, degree and radian, identities, heights and distances."},{"id":"q-di","name":"Data interpretation","tags":[],"syl":"Histogram, frequency polygon, bar diagram and pie chart."}]}]}],"sylsrc":"BSEH HTET Information Bulletin, Annexure-I, Level-III (PGT), Parts I-IV. Questions follow the BSEH class IX-XII syllabus, difficulty up to PG level.","notes":{"cs-sql":"<p class=\"key\"><b>Most asked:<\/b> which command is DDL or DML (4 times since 2020), VIEW = virtual table (3), UPDATE changes values (2), DROP vs DELETE (2). Also asked: ALTER adds a column, HAVING vs WHERE, ORDER BY, aggregate functions.<\/p>\n\n<h2>Command groups<\/h2>\n<table>\n<tr><th>Group<\/th><th>Commands<\/th><th>What it changes<\/th><\/tr>\n<tr><td><b>DDL<\/b>: Data Definition<\/td><td>CREATE, ALTER, DROP, TRUNCATE, RENAME<\/td><td>The structure (schema) of tables<\/td><\/tr>\n<tr><td><b>DML<\/b>: Data Manipulation<\/td><td>SELECT, INSERT, UPDATE, DELETE<\/td><td>The rows (data) inside tables<\/td><\/tr>\n<tr><td><b>DCL<\/b>: Data Control<\/td><td>GRANT, REVOKE<\/td><td>Who may do what<\/td><\/tr>\n<tr><td><b>TCL<\/b>: Transaction Control<\/td><td>COMMIT, ROLLBACK, SAVEPOINT<\/td><td>Saving or undoing changes<\/td><\/tr>\n<\/table>\n<ul>\n<li>\"Query and modification commands\" (query, insert, delete) are <b>DML<\/b>. \"Creating the structure of relations\" is <b>DDL<\/b>.<\/li>\n<li><b>UPDATE is not DDL<\/b> (it is DML). TRUNCATE <i>is<\/i> DDL.<\/li>\n<li>The result of a SELECT is always a <b>table<\/b> (a relation).<\/li>\n<\/ul>\n\n<h2>Look-alike commands<\/h2>\n<table>\n<tr><th>Task<\/th><th>Command<\/th><\/tr>\n<tr><td>Add, remove or change a <b>column<\/b><\/td><td><code>ALTER TABLE t ADD col INT;<\/code><\/td><\/tr>\n<tr><td>Change <b>values<\/b> in rows<\/td><td><code>UPDATE t SET marks = 90 WHERE id = 5;<\/code><\/td><\/tr>\n<tr><td>Remove rows but <b>keep the table<\/b><\/td><td><code>DELETE FROM t;<\/code> (can use WHERE, can be rolled back)<\/td><\/tr>\n<tr><td>Remove all rows fast, keep the structure<\/td><td><code>TRUNCATE TABLE t;<\/code> (no WHERE)<\/td><\/tr>\n<tr><td>Remove the <b>table and its data<\/b><\/td><td><code>DROP TABLE t;<\/code><\/td><\/tr>\n<\/table>\n<p>2022 Q134 pattern: \"keep R but empty it\" → <code>DELETE FROM R<\/code>; \"remove R completely\" → <code>DROP TABLE R<\/code>.<\/p>\n\n<h2>SELECT and its clauses<\/h2>\n<pre>SELECT dept, COUNT(*)      -- columns\nFROM   staff               -- table\nWHERE  salary &gt; 30000      -- filters rows, before grouping\nGROUP BY dept              -- makes groups\nHAVING COUNT(*) &gt; 5        -- filters groups, after grouping\nORDER BY dept DESC;        -- sorts (ASC is the default)<\/pre>\n<ul>\n<li>Sorting uses <b>ORDER BY<\/b> (not SORT BY).<\/li>\n<li><b>HAVING<\/b> is like WHERE, but it works on groups and can use aggregate functions. WHERE cannot use aggregates.<\/li>\n<li>Aggregate functions: <b>COUNT, SUM, AVG, MAX, MIN<\/b>. COMPUTE is <i>not<\/i> one. COUNT(*) counts every row; COUNT(col) skips NULLs.<\/li>\n<li>Other clauses that get asked: DISTINCT, BETWEEN, IN, LIKE (<code>%<\/code> = any characters, <code>_<\/code> = one character), IS NULL.<\/li>\n<\/ul>\n\n<h2>Views and nested queries<\/h2>\n<ul>\n<li>A <b>VIEW<\/b> is a <b>virtual table<\/b> made from other tables by a stored query: <code>CREATE VIEW v AS SELECT …;<\/code> It stores no data of its own.<\/li>\n<li>A <b>nested query (subquery)<\/b> is a complete SELECT-FROM-WHERE block inside another query: <code>… WHERE marks &gt; (SELECT AVG(marks) FROM t)<\/code>.<\/li>\n<\/ul>\n\n<h2>Relational algebra links<\/h2>\n<ul>\n<li><b>Select (σ)<\/b> picks rows that satisfy a <b>selection condition<\/b>; <b>Project (π)<\/b> picks columns.<\/li>\n<li>Set operations: (R − S) and (S − R) never share a tuple, so <b>(R − S) ∩ (S − R) = φ<\/b>.<\/li>\n<\/ul>\n\n<h2>Constraints and keys in SQL<\/h2>\n<ul>\n<li>PRIMARY KEY (unique + not null), UNIQUE, NOT NULL, DEFAULT, CHECK, FOREIGN KEY (REFERENCES another table).<\/li>\n<\/ul>\n\n<p class=\"src\">Sources: the 19 SQL questions in HTET 2020–2024 papers (in this app), and standard SQL as taught in the BSEH class XI–XII Informatics Practices / Computer Science books.<\/p>\n","hin-pas":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2024 में एक अपठित गद्यांश (साहित्य में नएपन और निरंतरता पर) से 4 प्रश्न आए (Q33 से Q36), यानी हिंदी के 15 अंकों में से 4 अंक। प्रश्न चार प्रकार के थे: साहित्य का अभीष्ट (केंद्रीय भाव), सत्य कथन, असत्य कथन और निष्कर्ष (नयापन कब टिकाऊ होता है)। कोई व्याकरण या शब्दार्थ का प्रश्न नहीं आया, सब अनुच्छेद-आधारित थे। BSEH की सूचना के अनुसार इस खंड में गद्य, नाटक या पद्य में से कोई एक अंश आता है, और उससे बोध, अनुमान, व्याकरण तथा भाषा-क्षमता के प्रश्न पूछे जा सकते हैं, इसलिए तैयारी में सब तरह के प्रश्न रखें।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> अपठित (un-seen) अंश वह गद्य या पद्य है जो आपने पहले नहीं पढ़ा। इसमें आपकी भाषा का नहीं, आपकी समझने की क्षमता का परीक्षण होता है: अंश क्या कहता है, लेखक का आशय क्या है, किस बात का समर्थन है और क्या अंश से सिद्ध नहीं होता। उत्तर पूरी तरह अंश पर आधारित होना चाहिए, आपकी निजी जानकारी या राय पर नहीं।<\/div>\n<p>पाठ्यक्रम में यह इसलिए है कि शिक्षक को ख़ुद पढ़कर अर्थ-निर्माण आना चाहिए। NCF 2005 के भाषा-शिक्षण आधार-पत्र में भी पढ़ने का उद्देश्य \"समझ के साथ पढ़ना, केवल डिकोड करना नहीं\" बताया गया है (पृ. १०, खंड 2.3(b)): पाठक को संकेतों से अनुमान लगाना, अपने पूर्व ज्ञान से जोड़ना और आलोचनात्मक दृष्टि से पाठ पर प्रश्न उठाना सीखना चाहिए। अपठित इन्हीं तीनों क्षमताओं की जाँच है।<\/p>\n<p><b>रोज़ की मिसाल:<\/b> कोई अनजान शहर के बस-स्टैंड पर लगा नक़्शा देखे तो पहले अपनी जगह ढूँढ़ता है, फिर रास्ते का अंदाज़ा लगाता है, फिर पूछता है कि \"इस रास्ते से मंज़िल मिलेगी या नहीं।\" अपठित में नक़्शा अंश है, आपकी जगह वह वाक्य है जिसमें उत्तर लिखा है, और रास्ते का अंदाज़ा अनुमान है।<\/p>\n\n<h2>अपठित हल करने की पूरी विधि<\/h2>\n<ol class=\"steps\">\n<li><b>पहले प्रश्न और विकल्प पढ़ें<\/b> (30 सेकंड)। इससे पता चलता है कि अंश में क्या खोजना है: भाव, कथन, शब्दार्थ या व्याकरण।<\/li>\n<li><b>अंश पहली बार धीरे और पूरा पढ़ें।<\/b> पहले और अंतिम वाक्य पर विशेष ध्यान दें। प्रायः पहला वाक्य विषय बताता है और अंतिम वाक्य निष्कर्ष।<\/li>\n<li><b>मोड़ वाले शब्द पकड़ें:<\/b> पर, लेकिन, किंतु, परंतु, फिर भी, अतः, इसलिए, क्योंकि, बल्कि। विचार यहीं पलटता है या कारण-परिणाम बँधते हैं।<\/li>\n<li><b>हर विकल्प को अंश की पंक्ति से मिलाएँ।<\/b> जिस पंक्ति से मेल खाए, उसे मन में चिह्नित करें। जो विकल्प अंश में न मिले, चाहे बाहर से कितना भी सच हो, वह उत्तर नहीं है।<\/li>\n<li><b>अतिवादी शब्द सावधानी से देखें:<\/b> ही, मात्र, केवल, सदैव, कभी नहीं, सब, हर। अंश संतुलित बात कहे तो ऐसे शब्द वाला विकल्प प्रायः ग़लत होता है।<\/li>\n<li><b>कठिन शब्द का अर्थ संदर्भ से लगाएँ,<\/b> पूरे वाक्य को पढ़कर, शब्द को अलग निकालकर नहीं।<\/li>\n<li><b>अंत में उत्तर को अंश में ढूँढ़कर पुष्ट करें।<\/b> एक पंक्ति में तर्क दे पाएँ कि \"अंश की अमुक पंक्ति के अनुसार यही उत्तर है।\"<\/li>\n<\/ol>\n\n<h2>प्रश्नों के प्रकार और हर एक पर कैसे चलें<\/h2>\n<div class=\"cards\">\n<div><h3>1. केंद्रीय भाव / अभीष्ट<\/h3><p>पूरे अंश का सार। जो विकल्प दोनों पक्ष (जैसे नया और निरंतरता) समेटे, वही सही। जो केवल एक पंक्ति पर टिके, ग़लत।<\/p><\/div>\n<div><h3>2. शीर्षक<\/h3><p>संक्षिप्त, पूरे अंश को समेटने वाला और विषय बताने वाला। कथन की तरह लंबा या केवल एक पैरे का शीर्षक ग़लत।<\/p><\/div>\n<div><h3>3. सत्य कथन<\/h3><p>चार कथनों को बारी-बारी अंश की पंक्ति से मिलाएँ। जिसकी पंक्ति सीधे मिल जाए, वही उत्तर।<\/p><\/div>\n<div><h3>4. असत्य कथन<\/h3><p>तीन सही कथन अंश में मिल जाएँगे, चौथा अंश के उलटा या अंश में अनुपस्थित होगा। प्रायः उलटा-पुलटा रूप।<\/p><\/div>\n<div><h3>5. शब्दार्थ / भावार्थ<\/h3><p>रेखांकित शब्द या पंक्ति का अर्थ संदर्भ से। जैसे कालातीत = समय से परे, अद्वैत = जो दो न हों, अभिन्न।<\/p><\/div>\n<div><h3>6. अनुमान (inference)<\/h3><p>जो लिखा नहीं पर जिसकी ओर अंश संकेत करता है। ऐसा निष्कर्ष चुनें जिसे अंश सीधे या तर्क से समर्थन दे, अतिवादी निष्कर्ष नहीं।<\/p><\/div>\n<div><h3>7. व्याकरण-आधारित<\/h3><p>अंश के शब्द पर समास, संधि, उपसर्ग-प्रत्यय, विशेषण, काल, वाच्य। संबंधित अध्याय के नियम लगाएँ।<\/p><\/div>\n<div><h3>8. लेखक का दृष्टिकोण / स्वर<\/h3><p>लेखक समर्थन में है, आलोचना में या तटस्थ। भाषा के स्वर (चिंता, व्यंग्य, गर्व) से पकड़ें।<\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>जाल:<\/b> असत्य कथन में विकल्प अक्सर अंश का उलटा होता है। 2024 में \"कथ्य और शिल्प एक-दूसरे से स्वायत्त हैं\" असत्य था, क्योंकि अंश उन्हें रचना में अद्वैत (अभिन्न) बताता है। \"मनुष्य की मूल प्रवृत्तियाँ परिवर्तनशील हैं\" भी ग़लत था, क्योंकि अंश में प्रेम, ईर्ष्या, राग-विराग \"वही बने रहते हैं\"। प्रत्येक बार विकल्प में एक ऐसा वाक्य होगा जो अंश के शब्दों को लेकर उसका मतलब पलट देता है।<\/div>\n\n<h2>गद्यांश के लिए अलग से<\/h2>\n<ul>\n<li>हर पैरे का एक पंक्ति में सार मन में बना लें: पैरा 1 में क्या, पैरा 2 में क्या।<\/li>\n<li>उदाहरण या कथा अपने-आप में उत्तर नहीं होते; वे केवल मुख्य विचार को पुष्ट करते हैं।<\/li>\n<li>प्रश्न \"अंश के अनुसार\" पूछे तो अपनी राय छोड़ें; \"लेखक के अनुसार\" का अर्थ भी वही है।<\/li>\n<li>वैचारिक निबंध (जैसे 2024 का अंश) में संकल्पना-शब्द (निरंतरता, कालातीत) पर अर्थ का ध्यान रखें।<\/li>\n<\/ul>\n<h2>पद्यांश के लिए अलग से<\/h2>\n<ol class=\"steps\">\n<li><b>अन्वय करें:<\/b> पंक्तियों को गद्य के सीधे क्रम में रखें (कर्ता, कर्म, क्रिया), जैसे \"जो बीत गया उसकी चिंता मत कर\" जैसा गद्य बना लें।<\/li>\n<li><b>भाव पकड़ें:<\/b> कवि क्या कहना चाहता है, शब्दशः नहीं, प्रतीक से। नदी = जीवन की गति, दीपक = ज्ञान या आशा, अँधेरा = अज्ञान या निराशा।<\/li>\n<li><b>अलंकार और भाषा देखें:<\/b> रूपक, उपमा, अनुप्रास आदि पूछे जाएँ तो पंक्ति में 'समान, जैसे, सा' शब्द उपमा, और एकरूपता (मुख-चंद्र) रूपक की सूचना देते हैं।<\/li>\n<li><b>अंतिम दो पंक्तियाँ<\/b> अक्सर संदेश या निष्कर्ष देती हैं।<\/li>\n<li><b>शीर्षक:<\/b> कविता की पहली और अंतिम पंक्ति के सामान्य भाव से।<\/li>\n<\/ol>\n\n<h2>HTET के प्रश्न, हल सहित (2024, अंश: साहित्य में नया और निरंतरता)<\/h2>\n<p><b>अंश का सार, पैरा-दर-पैरा:<\/b> (क) नया एक मूल्य है और निरंतरता भी; साहित्य दोनों में से एक नहीं चुनता क्योंकि एक के बिना दूसरा संभव नहीं। परंपरा बिना पुनर्नवा हुए जीवित नहीं रहती। (ख) मनुष्य इतिहास में भी रहता है और अनंत में भी; समाज, परिस्थितियाँ बदलते हैं पर प्रेम, ईर्ष्या, राग-विराग, हर्ष-विषाद वही रहते हैं। (ग) नई दृष्टि अपना नया शिल्प खोजती है; कथ्य और शिल्प विश्लेषण में अलग हो सकते हैं पर रचना में अद्वैत (एक) हैं। (घ) नया निरंतरता में समाहित होकर वैधता पाता है और निरंतरता को बदल भी देता है; जो आज पुराना है वह कभी नया था। (ङ) समकालीनता के बिना कालातीत नहीं हुआ जा सकता, पर केवल समकालीनता में बँधकर भी नहीं; जो कालातीत है वही हर समय नया होता चलता है।<\/p>\n\n<h3>HTET 2024 Q33<\/h3>\n<p>साहित्य का अभीष्ट है: (1) मात्र नए को चुनना (2) मात्र निरंतरता को चुनना (3) नएपन एवं निरंतरता दोनों को चुनना (4) मात्र समकालीन को चुनना<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> अंश का आरंभ ही यही कहता है: \"साहित्य दोनों में से एक को चुनने की हिमाकत... नहीं करता, क्योंकि वह जानता है कि एक के बिना दूसरा संभव नहीं है।\" (1), (2) और (4) में 'मात्र' है, जो अंश के संतुलन के विरुद्ध है। यह केंद्रीय-भाव वाला प्रश्न है, इसलिए दोनों पक्ष समेटने वाला विकल्प चुनें।<\/div>\n\n<h3>HTET 2024 Q34<\/h3>\n<p>निम्नलिखित में से कौन-सा कथन सत्य है? (1) मनुष्य की मूल प्रवृत्तियाँ समय के साथ परिवर्तनशील हैं। (2) मनुष्य का समाज समय के साथ परिवर्तनशील है। (3) मनुष्य मात्र इतिहास में जीता है। (4) निरंतरता सदैव अपरिवर्तनीय होती है।<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> अंश: \"बहुत कुछ बदलता है: समाज, परिस्थितियाँ, आर्थिक व्यापार, मानव संबंध।\" (1) ग़लत: प्रेम, ईर्ष्या आदि \"वही बने रहते हैं\"। (3) ग़लत: मनुष्य \"इतिहास में और अनन्त में\" दोनों आयामों में रहता है, और 'मात्र' अतिवादी है। (4) ग़लत: \"निरंतरता नए के हस्तक्षेप के बाद वही नहीं रह जाती\", और 'सदैव' अतिवादी है।<\/div>\n\n<h3>HTET 2024 Q35<\/h3>\n<p>कौन-सा कथन असत्य है? (1) साहित्य में दृष्टि का अवबोधन कथ्य से होता है। (2) नवीन कथ्य अपने लिए नवीन शिल्प भी लाता है। (3) कथ्य और शिल्प दोनों एक-दूसरे से स्वायत्त होते हैं। (4) साहित्यिक रचना में कथ्य और शिल्प परस्पर अनुस्यूत होते हैं।<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> अंश: \"विश्लेषण के लिए भले हम कथ्य और शिल्प को अलग-थलग कर लेते हैं, पर रचना में वे अद्वैत हैं।\" 'अद्वैत' का अर्थ है अभिन्न; स्वायत्त का अर्थ है स्वतंत्र, आत्म-नियंत्रित। यह उलटा है। (2) अंश की पंक्ति \"नयी दृष्टि... अपने लिए अनिवार्यतः नया शिल्प भी खोजती है\" से मिलता है। (4) में 'अनुस्यूत' का अर्थ पिरोया हुआ, परस्पर गुँथा; यह अद्वैत का ही रूप है।<\/div>\n\n<h3>HTET 2024 Q36<\/h3>\n<p>नयापन टिकाऊ होता है: (1) जब वह समकालीन हो (2) जब वह समकालीन भी हो और कालातीत भी (3) जब उसमें चमत्कार हो (4) जब वह परंपरा को बदलता हो<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> अंश की अंतिम पंक्तियाँ: \"नया समय को सीधे... पकड़ने के साहस से उपजता है, पर अगर वह समय के पार न देख पाये, तो टिकाऊ नहीं हो सकता।\" यानी समकालीन (समय को पकड़ना) और कालातीत (समय के पार देखना), दोनों चाहिए। (1) में केवल समकालीनता है, अपर्याप्त। (3) चमत्कार का अंश में कोई ज़िक्र नहीं। (4) परंपरा बदलना नएपन का परिणाम है, टिकाऊपन की शर्त नहीं।<\/div>\n<p><b>2024 से सीख:<\/b> चारों उत्तर \"दोनों को साथ रखने\" या अंश के सीधे वाक्य से निकले, और ग़लत विकल्पों में 'मात्र', 'सदैव' जैसे शब्द थे। यही अपठित का स्वभाव है।<\/p>\n\n<h2>अभ्यास-अंश 1 (गद्य): श्रम का मूल्य<\/h2>\n<div class=\"ex\"><b>अंश:<\/b> कहा जाता है कि प्रतिभा जन्म से मिलती है, पर इतिहास गवाह है कि ऊँचाइयाँ केवल प्रतिभा से नहीं, निरंतर परिश्रम से छूई गई हैं। जो विद्यार्थी हर दिन थोड़ा-थोड़ा पढ़ता है, वह परीक्षा के दिनों में घबराता नहीं, क्योंकि उसकी नींव पक्की होती है। इसके विपरीत, जो केवल परीक्षा के निकट जागता है, उसकी सफलता संयोग पर टिकी रहती है। परिश्रम केवल सफलता नहीं दिलाता, वह चरित्र भी गढ़ता है: धैर्य, अनुशासन और आत्मविश्वास उसकी देन हैं। फिर भी परिश्रम का अर्थ अंधाधुंध जुट जाना नहीं है; दिशा न हो तो श्रम भटक जाता है। अतः लक्ष्य की स्पष्टता के साथ किया गया निरंतर प्रयास ही वास्तविक श्रम है।<\/div>\n<details class=\"quiz\"><summary>प्रश्न 1: अंश का केंद्रीय भाव है: (A) प्रतिभा ही सब कुछ है (B) परिश्रम तभी सार्थक है जब निरंतर और दिशा के साथ हो (C) परीक्षा से पहले ही पढ़ना ठीक है (D) संयोग सबसे बड़ा है<\/summary><p><b>उत्तर: (B)<\/b> अंश का अंतिम वाक्य \"लक्ष्य की स्पष्टता के साथ किया गया निरंतर प्रयास ही वास्तविक श्रम है\" पूरे पैरे का निचोड़ है। (A) अंश के आरंभ का खंडन है, (C) और (D) अंश के उलटे हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: अंश के अनुसार असत्य कथन है: (A) प्रतिदिन पढ़ने वाला परीक्षा में नहीं घबराता (B) परिश्रम से चरित्र का निर्माण होता है (C) अंधाधुंध जुटना ही सच्चा श्रम है (D) परीक्षा के निकट जागने वाले की सफलता संयोग पर टिकी है<\/summary><p><b>उत्तर: (C)<\/b> अंश कहता है \"परिश्रम का अर्थ अंधाधुंध जुट जाना नहीं है।\" बाक़ी तीन कथन अंश में हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: 'नींव पक्की होती है' का आशय है: (A) घर मज़बूत बना है (B) ज्ञान का आधार दृढ़ है (C) परीक्षा आसान है (D) पुस्तकें अधिक हैं<\/summary><p><b>उत्तर: (B)<\/b> यह लाक्षणिक प्रयोग है: प्रतिदिन पढ़ने से बुनियादी समझ मज़बूत बनती है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: 'वह केवल सफलता नहीं दिलाता' में रेखांकित सर्वनाम 'वह' किसके लिए आया है? (A) विद्यार्थी (B) परिश्रम (C) इतिहास (D) चरित्र<\/summary><p><b>उत्तर: (B)<\/b> पिछला वाक्य \"परिश्रम केवल सफलता नहीं दिलाता, वह चरित्र भी गढ़ता है\" में 'वह' परिश्रम के लिए है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: अंश के लिए सबसे उपयुक्त शीर्षक: (A) प्रतिभा बनाम भाग्य (B) परीक्षा का भय (C) दिशा सहित निरंतर परिश्रम (D) इतिहास की गवाही<\/summary><p><b>उत्तर: (C)<\/b> यह शीर्षक पूरे अंश के दोनों पक्ष (निरंतरता और दिशा) समेटता है। (A) और (B) विषय से भटकते हैं, (D) केवल पहले वाक्य पर टिका है।<\/p><\/details>\n\n<h2>अभ्यास-अंश 2 (पद्य): दीपक<\/h2>\n<div class=\"ex\"><b>पद्यांश:<\/b><br>\nअँधियारा कितना भी गहरा हो, दीपक डरता नहीं,<br>\nछोटी-सी लौ लेकर वह रात-भर जलता रहा।<br>\nआँधियाँ आईं, हवाओं ने झकझोरा बहुत,<br>\nपर वह हथेली की ओट में पलता रहा।<br>\nजो कहते थे, \"इतनी-सी रोशनी से क्या होगा\",<br>\nसुबह ने देखा, वही रास्ता दिखाता रहा।<br>\nमत गिन कि रोशनी कितनी है तेरे पास,<br>\nजला भर दे, अँधेरा ख़ुद ही हटता रहा।<\/div>\n<details class=\"quiz\"><summary>प्रश्न 1: कविता का केंद्रीय भाव है: (A) दीपक की सुंदरता (B) छोटे प्रयास भी साहस और निरंतरता से अँधेरे को हरा सकते हैं (C) आँधियों से डरना चाहिए (D) रात बहुत लंबी होती है<\/summary><p><b>उत्तर: (B)<\/b> अंतिम दो पंक्तियाँ संदेश देती हैं: रोशनी कम हो तो भी जलाओ, अँधेरा हटता है। पद्य में अंतिम पंक्तियाँ संदेश वाली होती हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: 'दीपक' यहाँ प्रतीक है: (A) धनवान का (B) आशा और छोटे किंतु दृढ़ प्रयास का (C) घर की सजावट का (D) आँधी का<\/summary><p><b>उत्तर: (B)<\/b> अँधेरे का सामना और रास्ता दिखाना आशा और प्रयास के गुण हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: 'वह हथेली की ओट में पलता रहा' का आशय है: (A) दीपक हाथ में रखा था (B) कठिनाइयों में भी सहारे और सुरक्षा से लौ बची रही (C) दीपक बच्चा था (D) हाथ जल गया<\/summary><p><b>उत्तर: (B)<\/b> हथेली की ओट सहारे या सुरक्षा का चित्र है, जिसमें आँधी के बीच भी लौ बची रही।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: 'जो कहते थे इतनी-सी रोशनी से क्या होगा' के बारे में कवि का स्वर है: (A) समर्थन का (B) उन आलोचकों को सुबह के परिणाम से उत्तर देने का (C) भय का (D) निराशा का<\/summary><p><b>उत्तर: (B)<\/b> कवि कहता है \"सुबह ने देखा, वही रास्ता दिखाता रहा\", यानी परिणाम ही उत्तर है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: 'अँधियारा' शब्द का तद्भव या तत्सम रूप: (A) अंधकार (तत्सम) (B) अंधकार (तद्भव) (C) अँधेरा (तत्सम) (D) दीप (तद्भव)<\/summary><p><b>उत्तर: (A)<\/b> अंधकार तत्सम है और अँधियारा/अँधेरा उसका तद्भव रूप। दीप तत्सम है, दीया तद्भव।<\/p><\/details>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>भ्रम<\/th><th>ऐसे अलग करें<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>केंद्रीय भाव / शीर्षक<\/td><td>भाव = पूरी बात का सार (वाक्य); शीर्षक = संक्षिप्त नाम (शब्द-समूह)<\/td><td>भाव: परिश्रम दिशा सहित हो; शीर्षक: सार्थक श्रम<\/td><\/tr>\n<tr><td>अनुमान / कथन<\/td><td>कथन अंश में लिखा; अनुमान लिखे से निकला<\/td><td>-<\/td><\/tr>\n<tr><td>'सत्य' / 'असत्य' प्रश्न<\/td><td>प्रश्न की शर्त पहले देखें; दोनों में विकल्प एक-सा लगता है<\/td><td>2024 Q34 सत्य, Q35 असत्य<\/td><\/tr>\n<tr><td>अद्वैत / स्वायत्त<\/td><td>एक, अभिन्न / स्वतंत्र, अलग<\/td><td>2024 Q35<\/td><\/tr><\/table>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>अपठित में उत्तर हमेशा अंश से निकलता है, निजी ज्ञान या राय से नहीं।<\/li>\n<li>पहले प्रश्न-विकल्प, फिर अंश, फिर हर विकल्प को पंक्ति से मिलाएँ।<\/li>\n<li>मोड़ वाले शब्द पकड़ें: पर, लेकिन, अतः, क्योंकि।<\/li>\n<li>'ही, मात्र, केवल, सदैव' वाले विकल्प प्रायः ग़लत होते हैं।<\/li>\n<li>केंद्रीय भाव वही विकल्प जो अंश के सभी पक्ष समेटे।<\/li>\n<li>असत्य कथन में अंश का उलटा या अंश के बाहर की बात होती है।<\/li>\n<li>2024 में सब चार प्रश्न अनुच्छेद-आधारित थे: अभीष्ट, सत्य, असत्य, निष्कर्ष।<\/li>\n<li>पद्य में अन्वय करें, प्रतीक से भाव निकालें, अंतिम पंक्तियों में संदेश देखें।<\/li>\n<li>शब्दार्थ संदर्भ से, पूरे वाक्य को पढ़कर।<\/li>\n<li>NCF 2005 के अनुसार पढ़ना डिकोड करना नहीं, अर्थ-निर्माण और आलोचनात्मक पाठ है।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: अपठित गद्यांश में 'केवल' और 'मात्र' जैसे शब्द वाले विकल्प के बारे में सही रणनीति: (A) हमेशा चुनें (B) सतर्क रहें, ऐसे अतिवादी विकल्प प्रायः ग़लत होते हैं (C) अनदेखा करें (D) केवल पद्यांश में देखें<\/summary><p><b>उत्तर: (B)<\/b> अतिवादी शब्द अंश की संतुलित बात को बदल देते हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: \"लेकिन, किंतु, परंतु\" जैसे शब्द अंश में क्या सूचित करते हैं? (A) कारण (B) विचार का मोड़ या विरोध (C) उदाहरण (D) अंत<\/summary><p><b>उत्तर: (B)<\/b> ये विरोध या मोड़ बताते हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'अन्वय' का अर्थ है: (A) कठिन शब्दों की सूची (B) पद्य की पंक्ति को गद्य के सीधे क्रम में रखना (C) अलंकार पहचानना (D) कविता का शीर्षक<\/summary><p><b>उत्तर: (B)<\/b> अन्वय में कर्ता, कर्म, क्रिया के सीधे क्रम से अर्थ पकड़ा जाता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अंश में एक वाक्य लिखा है \"परंपरा अपने को पुनर्नवा किए बिना सजीव नहीं रह सकती।\" इसका निष्कर्ष है: (A) परंपरा स्थिर रहे (B) परंपरा नवीनता के साथ ही जीवित रहती है (C) परंपरा बेकार है (D) नवीनता ख़तरा है<\/summary><p><b>उत्तर: (B)<\/b> 'पुनर्नवा' = फिर से नया; बिना नए हुए परंपरा जी नहीं सकती।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: \"जो कालातीत है, वही हर समय नया होता चलता है।\" 'कालातीत' का अर्थ: (A) समय बीत चुका (B) समय की सीमा से परे (C) बहुत पुराना (D) देर से आया<\/summary><p><b>उत्तर: (B)<\/b> काल + अतीत = समय से पार; यानी जो हर काल में प्रासंगिक रहे।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अपठित में उत्तर चुनते समय सबसे महत्त्वपूर्ण कसौटी: (A) अपनी राय (B) अंश की पंक्ति में समर्थन (C) सबसे लंबा विकल्प (D) सबसे छोटा विकल्प<\/summary><p><b>उत्तर: (B)<\/b> सही उत्तर वही है जिसके लिए अंश में प्रमाण हो।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: शीर्षक के बारे में सही कथन: (A) लंबा वाक्य हो (B) संक्षिप्त और पूरे अंश का प्रतिनिधि हो (C) केवल पहली पंक्ति से बने (D) लेखक का नाम हो<\/summary><p><b>उत्तर: (B)<\/b> शीर्षक पूरे अंश का सार बताने वाला संक्षिप्त नाम है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: \"पर अगर वह समय के पार न देख पाये, तो टिकाऊ नहीं हो सकता।\" इसमें 'पर' का कार्य: (A) कारण बताना (B) पिछली बात में सीमा या मोड़ जोड़ना (C) उदाहरण देना (D) प्रश्न पूछना<\/summary><p><b>उत्तर: (B)<\/b> 'पर' विरोध/शर्त दिखाने वाला योजक है।<\/p><\/details>\n\n<p class=\"src\">स्रोत: HTET 2024 प्रश्न-पत्र (Q33 से Q36, इसी ऐप में) और BSEH HTET पाठ्यक्रम (Level-III, Language-I)। पढ़ने की समझ पर <a href=\"https://ncert.nic.in/pdf/focus-group/Indian_Languages.pdf\">NCF 2005, Teaching of Indian Languages<\/a>, खंड 2.3(b), पृ. १०। दोनों अभ्यास-अंश और उनके प्रश्न इसी ऐप के लिए लिखे गए हैं (किसी पुस्तक से नहीं लिए गए)। प्रश्न-प्रकार की रणनीति सामान्य पठन-पद्धति है।<\/p>\n","hin-ped":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2024 में इस विषय से 2 प्रश्न आए, दोनों \"नहीं है\" वाले: Q31 में मौन वाचन का उद्देश्य <i>क्या नहीं है<\/i>, और Q43 में हिंदी अध्यापक की विशिष्ट विशेषता में <i>क्या सम्मिलित नहीं है<\/i> (उत्तर: शिक्षा तथा उपाधियाँ)। 2020 से 2023 में इस टैग का कोई प्रश्न नहीं मिला, पर पाठ्यक्रम की नौ पंक्तियाँ (नीचे) एक-एक करके पूछी जा सकती हैं, इसलिए पूरी तैयारी चाहिए। आधार-पत्र: NCERT का NCF 2005 \"Teaching of Indian Languages\", जिसके पृष्ठ-क्रमांक इस पन्ने में छपे अंकों के अनुसार दिए हैं।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> हिंदी शिक्षण (भाषा-शिक्षण-शास्त्र, pedagogy) वह विषय है जो बताता है कि बच्चे भाषा कैसे सीखते हैं, और शिक्षक उन्हें हिंदी सुनना, बोलना, पढ़ना और लिखना कैसे सिखाए। यह हिंदी के व्याकरण से भिन्न है: व्याकरण में पूछा जाता है \"संधि क्या है?\", शिक्षण-शास्त्र में पूछा जाता है \"कक्षा में संधि कैसे सिखाएँगे और यह क्यों उपयोगी है?\"<\/div>\n<p>इस पन्ने का आधार <b>NCF 2005 का आधार-पत्र \"Teaching of Indian Languages\"<\/b> (NCERT, 2006) है। इसकी मूल बात यह है कि भाषा केवल \"संप्रेषण का साधन\" नहीं है; वह हमारी सोच ढालती है, समाज में हमारे संबंध तय करती है और हर विषय की पढ़ाई का आधार है (संक्षिप्त सार और पृ. १)। दूसरी मूल बात: बच्चा स्कूल आने से पहले ही अपनी भाषा सीख चुका होता है, इसलिए शिक्षक का काम भाषा \"भरना\" नहीं, उसे सँवारना और बढ़ाना है।<\/p>\n<p><b>रोज़ की मिसाल:<\/b> कोई बच्चा माँ से \"पानी दो\" सीखता है, किसी ने उसे संज्ञा, क्रिया की परिभाषा नहीं रटाई। तीन साल की उम्र तक वह अपनी भाषा की मूल व्यवस्था सीख लेता है। स्कूल में वही बच्चा जब \"संज्ञा की परिभाषा बताओ\" से जूझता है, तो अक्सर भाषा से ही दूर हो जाता है। शिक्षण-शास्त्र यही दूरी कम करना सिखाता है।<\/p>\n<p>पाठ्यक्रम की नौ पंक्तियाँ नीचे इसी क्रम में हैं: (1) अधिगम और अर्जन, (2) भाषा-शिक्षण के सिद्धांत, (3) श्रवण-वाचन की भूमिका, (4) भाषा के प्रकार्य, (5) व्याकरण की भूमिका, (6) विविधतापूर्ण कक्षा की चुनौतियाँ, (7) भाषा-कठिनाइयाँ, त्रुटियाँ और विकार, (8) भाषा-कौशल, (9) शिक्षण-अधिगम सामग्री। इसके बाद शिक्षण-विधियाँ, वाचन के प्रकार, लेखन, मूल्यांकन और शिक्षक की भूमिका।<\/p>\n\n<h2>1. अधिगम और अर्जन (Learning and Acquisition)<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> <b>अर्जन (acquisition)<\/b>: भाषा का स्वाभाविक, अचेतन आत्मसात्, जो परिवेश में रहकर होता है, बिना औपचारिक सिखाए, जैसे बच्चा घर में मातृभाषा सीखता है। <b>अधिगम (learning)<\/b>: कक्षा में, सचेत प्रयास, नियमों और निर्देश के साथ भाषा सीखना।<\/div>\n<div class=\"cards\">\n<div><h3>अर्जन<\/h3><p>परिवेश, खेल, बातचीत से; बिना नियम रटे; चिंता-रहित; अर्थ पर ध्यान; मातृभाषा का तरीक़ा।<\/p><\/div>\n<div><h3>अधिगम<\/h3><p>स्कूल में, निर्देश से; नियमों और अभ्यास के साथ; मूल्यांकन के दबाव के साथ; दूसरी भाषा का तरीक़ा।<\/p><\/div>\n<\/div>\n<h3>NCF 2005 का आधार<\/h3>\n<ul>\n<li><b>अंतर्निहित भाषा-क्षमता:<\/b> NCF कहता है कि सामान्य बच्चे तीन वर्ष की आयु से पहले ही अपनी भाषा की मूल व्यवस्था और उसके सामाजिक उपयोग (भाषिक ही नहीं, संप्रेषणात्मक क्षमता भी) सीख लेते हैं (पृ. १, खंड 1.2)। इससे दो शिक्षण-निष्कर्ष निकलते हैं: \"पर्याप्त संपर्क (exposure) मिले तो बच्चे नई भाषाएँ सहजता से सीखेंगे, और शिक्षण में ध्यान व्याकरण से ज़्यादा अर्थ पर होना चाहिए\" (पृ. १)।<\/li>\n<li><b>सिद्धांतों की रस्साकशी (पृ. ८, खंड 2.1):<\/b> व्यवहारवादी पावलोव और स्किनर के लिए भाषा-सीखना उद्दीपन-प्रतिक्रिया का संबंध था, यानी अनुकरण, पैटर्न-अभ्यास और रटना। चॉम्स्की ने 1959 में इस पर प्रश्न उठाया और कहा कि जन्मजात भाषा-क्षमता माने बिना जटिल भाषा-व्यवस्थाओं का अर्जन समझाना कठिन है। पियाजे और वाइगोत्स्की इन दोनों के बीच की स्थिति में हैं।<\/li>\n<li><b>पियाजे का दृष्टिकोण (पृ. ८-९, खंड 2.1, 2.2):<\/b> भाषा, किसी भी संज्ञानात्मक व्यवस्था की तरह, परिवेश से अंतःक्रिया में बनती है। बच्चा पूर्व-संक्रियात्मक, मूर्त-संक्रियात्मक और औपचारिक-संक्रियात्मक अवस्थाओं से गुज़रता है। NCF के अनुसार शिक्षा-क्षेत्र पर पियाजे का प्रभाव सबसे गहरा रहा है (पृ. ८)।<\/li>\n<li><b>वाइगोत्स्की (पृ. ८, ११):<\/b> बच्चे की वाणी समाज से अंतःक्रिया का परिणाम है; वह दो प्रकार की वाणी बोलता है, आत्मकेंद्रित (अपने से) और सामाजिक (दूसरों से)। उनकी \"निकटतम विकास का क्षेत्र\" (zone of proximal development) की अवधारणा ने बाल-केंद्रित भाषा-शिक्षण को दिशा दी (पृ. ११)।<\/li>\n<li><b>क्रैशन का सिद्धांत (पृ. १०-११, खंड 2.4):<\/b> जब बच्चे को चिंता-मुक्त वातावरण में बोधगम्य निवेश (comprehensible input) मिले तो वह भाषा का व्याकरण सहज ही रच लेता है। निवेश तभी आत्मसात् (intake) बनता है जब \"भावात्मक छलनी\" (affective filter) नीची हो, यानी रवैया सकारात्मक हो और प्रेरणा प्रबल।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> कक्षा 6 में पहले दिन \"मेरा गाँव\" पर बच्चों को बोलने दें: अपने गाँव का वर्णन, चित्र बनाना, आपस में बातचीत। इसमें किसी नियम की कक्षा नहीं, भाषा का अर्जन हो रहा है। इसके बाद शिक्षक कुछ बच्चों के वाक्यों में से क्रियाओं को लेकर बातचीत कराए (\"हमने खेत देखे, हम खेत जाते हैं\": क्रिया कैसे बदली?), यह अधिगम है। दोनों साथ चलें, यही NCF का सुझाव है।<\/div>\n<div class=\"trap\"><b>ध्यान दें:<\/b> अधिगम और अर्जन में कौन-सा बेहतर है, यह प्रश्न नहीं है। मातृभाषा के लिए अर्जन स्वाभाविक है; दूसरी और विदेशी भाषा में अधिगम का हिस्सा बढ़ता जाता है। NCF भी यही कहता है कि पहली से दूसरी और फिर विदेशी भाषा की ओर बढ़ते हुए व्याकरण-शिक्षण पर ज़ोर बढ़ सकता है (पृ. १९, खंड 4.5)।<\/div>\n\n<h2>2. भाषा-शिक्षण के सिद्धांत<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> भाषा-शिक्षण के सिद्धांत वे मार्गदर्शक बातें हैं जिन पर कोई भी विधि चले। NCF 2005 (पृ. २२-२३, खंड 6.3) ऐसे छह मूल सिद्धांत देता है और कहता है कि हर शिक्षक कक्षा की सामाजिक, मनोवैज्ञानिक, भाषाई स्थितियों के अनुसार अपनी विधि स्वयं विकसित करेगा।<\/div>\n<table><tr><th>सिद्धांत (NCF खंड 6.3)<\/th><th>अर्थ<\/th><th>कक्षा का उदाहरण<\/th><\/tr>\n<tr><td>(क) शिक्षार्थी<\/td><td>विद्यार्थी \"ख़ाली बर्तन\" नहीं, सीखने की प्रक्रिया का केंद्र है। शिक्षक उसकी रुचियों और संज्ञानात्मक क्षमता को जानकर विधि ढाले।<\/td><td>पहले पूछें कि बच्चे कौन-सी कहानियाँ घर में सुनते हैं, फिर पाठ चुनें।<\/td><\/tr>\n<tr><td>(ख) दृष्टिकोण<\/td><td>शिक्षक सब बच्चों के प्रति जाति, रंग, पंथ, लिंग से परे सकारात्मक रहे; इससे प्रेरणा बढ़ती और चिंता घटती है।<\/td><td>किसी बच्चे की बोली का मज़ाक न उड़ाएँ।<\/td><\/tr>\n<tr><td>(ग) निवेश<\/td><td>निवेश समृद्ध, रोचक और चुनौतीपूर्ण हो, और ऐसे विषयों पर जो सहपाठी-अधिगम को बढ़ावा दें।<\/td><td>समूह में कहानी पढ़कर समाचार बनाना।<\/td><\/tr>\n<tr><td>(घ) बहुभाषिकता एक संसाधन<\/td><td>कक्षा की कई भाषाओं का उपयोग सीखने के लिए करें; अनुवाद भी शक्तिशाली औज़ार है।<\/td><td>बच्चों से कहें कि अपनी बोली में 'पानी' के शब्द बताएँ।<\/td><\/tr>\n<tr><td>(ङ) लिंग और पर्यावरण<\/td><td>भाषा-शिक्षण से लैंगिक और पर्यावरणी चेतना निहित रूप से बने।<\/td><td>पाठों में स्त्रियों की सक्रिय भूमिका वाले उदाहरण।<\/td><\/tr>\n<tr><td>(च) मूल्यांकन<\/td><td>मूल्यांकन शिक्षण-प्रक्रिया का हिस्सा हो; परीक्षा के लिए कक्षा रोकने पर चिंता बढ़ती है और सीखना बिगड़ता है।<\/td><td>रोज़ के कार्य का आकलन, एक बड़ी परीक्षा की जगह।<\/td><\/tr><\/table>\n<p>इन सिद्धांतों के अतिरिक्त NCF (पृ. ११) यह भी कहता है कि \"हर संभव प्रयास किया जाए कि औपचारिक कक्षा भी प्राकृतिक भाषा-अधिगम की स्थितियों के यथासंभव निकट हो।\" इसी के उदाहरण में वह एकलव्य की \"प्रशिका\" परियोजना और उसकी \"खुशी-खुशी\" पुस्तकों का उल्लेख करता है, जो रूप से अधिक अर्थ पर केंद्रित थीं और हिंदी-शिक्षण में एक मील का पत्थर मानी गईं।<\/p>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> 'वर्षा' पर पाठ पढ़ाते समय पहले बच्चों से पूछें कि उन्होंने बारिश में क्या किया, फिर चित्र दिखाएँ, फिर पाठ पढ़ें, फिर समूह में वर्षा पर कविता बनवाएँ। इसमें बच्चा केंद्र में है (क), डर के बिना बोल सकता है (ख), निवेश रोचक है (ग)।<\/div>\n\n<h2>3. भाषा-शिक्षण में श्रवण और वाचन की भूमिका<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> श्रवण (सुनना) और भाषण (बोलना) भाषा के मौखिक-श्रव्य कौशल हैं। इन्हें भाषा सीखने के स्वाभाविक आरंभ के रूप में देखा जाता है; बच्चा बोलने से पहले महीनों सुनता है।<\/div>\n<ul>\n<li><b>NCF का उद्देश्य (क):<\/b> \"सुनी हुई बात को समझने की क्षमता\": विद्यार्थी वक्ता के गैर-मौखिक संकेतों (चेहरे के भाव, हाव-भाव, स्वर) से अर्थ लगाए और सुनते हुए संबंध जोड़कर अनुमान निकाले (पृ. ९-१०, खंड 2.3(a))।<\/li>\n<li><b>उद्देश्य (ग):<\/b> \"सहज अभिव्यक्ति\": विभिन्न परिस्थितियों में अपनी बात कहने के लिए शैलियों का भंडार हो, और वह तार्किक, विश्लेषणात्मक और रचनात्मक ढंग से चर्चा कर सके (पृ. १०)।<\/li>\n<li><b>कौशल एक-दूसरे में गुँथे हैं:<\/b> NCF चेताता है कि कौशलों को अलग-अलग देखना हानिकारक रहा है, क्योंकि \"बोलते समय हम सुनते भी हैं और लिखते समय पढ़ते भी हैं\" (पृ. ९)। इसलिए सुनने-बोलने की गतिविधियाँ पढ़ने-लिखने से जुड़ी हों।<\/li>\n<li><b>BICS और CALP:<\/b> कुमिन्स के अनुसार <b>BICS<\/b> (Basic Interpersonal Communicative Skills) रोज़मर्रा, संदर्भ-समृद्ध, \"यहाँ और अभी\" की बातचीत का स्तर है; <b>CALP<\/b> (Cognitive Advanced Language Proficiency) संदर्भ-रहित, चिंतन-प्रधान स्तर है, जैसे अपरिचित विषय पर निबंध लिखना या संपादकीय की आलोचना करना (पृ. २१)। BICS हर भाषा में लगभग नए सिरे से सीखा जाता है, पर बहुभाषी भारत में स्वाभाविक अर्जन से सरल हो जाता है; CALP प्रायः शिक्षण से आता है और एक भाषा से दूसरी में स्थानांतरित हो जाता है (पृ. २१-२२)।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण (श्रवण):<\/b> शिक्षक कहानी पढ़ता है, बीच में रुककर पूछता है \"अब क्या होगा?\", फिर बच्चे अनुमान लगाते हैं। <b>(भाषण):<\/b> बच्चे \"मेरा प्रिय त्योहार\" पर दो मिनट बोलते हैं; सहपाठी एक प्रश्न पूछते हैं। यह BICS से CALP की ओर पुल है।<\/div>\n\n<h2>4. भाषा के प्रकार्य (Functions of Language)<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> भाषा के प्रकार्य वे काम हैं जो भाषा समाज और व्यक्ति के लिए करती है। NCF का कहना है कि अधिकतर लोग भाषा को केवल संप्रेषण का साधन समझते हैं, जबकि भाषा को बहुआयामी रूप से (संरचनात्मक, साहित्यिक, सामाजिक, सांस्कृतिक, मनोवैज्ञानिक, सौंदर्यात्मक) देखना चाहिए (पृ. १, खंड 1.1)।<\/div>\n<table><tr><th>प्रकार्य<\/th><th>NCF का आधार<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>संप्रेषण<\/td><td>भाषा सामाजिक संप्रेषण का सबसे महत्त्वपूर्ण और सार्वभौम साधन है (पृ. ३)।<\/td><td>सूचना देना-लेना<\/td><\/tr>\n<tr><td>चिंतन और ज्ञान-निर्माण<\/td><td>भाषा हमारी सोच को आकार देती है और अज्ञात क्षेत्रों में ले जाती है (पृ. ६-७, खंड 1.11)। भारतीय परंपरा में भाषा केवल संप्रेषण नहीं, संज्ञान भी है (पृ. २)।<\/td><td>किसी अवधारणा को शब्द देना<\/td><\/tr>\n<tr><td>सामाजिक संबंध और शक्ति<\/td><td>भाषा से सामाजिक संबंध (शक्ति और समानता) तय होते हैं; कुछ भाषाएँ प्रतिष्ठित होकर सत्ता से जुड़ जाती हैं (पृ. ५, खंड 1.9)।<\/td><td>मानक बनाम बोली का दर्जा<\/td><\/tr>\n<tr><td>पहचान<\/td><td>भाषा \"पहचान-निर्माण\" का साधन है, न कि केवल पहले से मौजूद पहचान का चिह्न (पृ. ५, खंड 1.8)।<\/td><td>मातृभाषा से लगाव<\/td><\/tr>\n<tr><td>सौंदर्य और रचनात्मकता<\/td><td>कविता, गद्य, नाटक भाषा में सौंदर्य-बोध और पठन-बोध बढ़ाते हैं; चुटकुले, व्यंग्य, कथा भी भाषा के साहित्यिक रूप हैं (पृ. ३, खंड 1.5)।<\/td><td>कविता-पाठ, नाटक-मंचन<\/td><\/tr>\n<tr><td>संस्कृति का संचरण<\/td><td>भाषा सांस्कृतिक प्रसार और संज्ञानात्मक संरचना का मुख्य स्रोत है (पृ. ६)।<\/td><td>लोककथाएँ, गीत<\/td><\/tr><\/table>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> प्रेमचंद की 'ईदगाह' पढ़ाते समय केवल शब्दार्थ न पूछें; बच्चों से मेले के दृश्य पर बातचीत (संप्रेषण), हामिद की सोच पर चर्चा (चिंतन), कहानी की भाषा में ग्रामीण शब्दों की पहचान (संस्कृति) और अंत में पत्र लिखना (रचनात्मकता) भी कराएँ। NCF के शब्दों में भाषा का मतलब \"कविताओं, निबंधों और कहानियों से कहीं अधिक\" है (पृ. १)।<\/div>\n\n<h2>5. व्याकरण की भूमिका<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> व्याकरण किसी भाषा के नियमों का अध्ययन है। NCF में व्याकरण दो रूपों में है: (क) भाषा की <i>नियमबद्ध व्यवस्था<\/i> के रूप में (पृ. १-२, खंड 1.3), (ख) शिक्षण में एक <i>साधन<\/i> के रूप में।<\/div>\n<ul>\n<li><b>व्यवस्था के रूप में:<\/b> भाषा में ध्वनि, शब्द और वाक्य, तीनों स्तरों पर नियम हैं। जैसे हिंदी में '-आ' अंत वाले पुल्लिंग शब्दों (लड़का) के तीन बहुवचन रूप हैं: लड़के, लड़कों, लड़को; नए ऐसे शब्द पर वही नियम लगता है, इसलिए हर रूप अलग-अलग नहीं रटना पड़ता (पृ. २)। हिंदी में प्रश्नवाचक शब्द वहीं आता है जहाँ उत्तर आता: \"वह घर जा रहा है / वह कहाँ जा रहा है\" (पृ. २)।<\/li>\n<li><b>शिक्षण में:<\/b> NCF नियम रटाने के विरुद्ध है और वैज्ञानिक जाँच का विकल्प देता है: कक्षा में बच्चे आँकड़े (भाषा के उदाहरण) एकत्र करें, उनका अवलोकन करें, समानता-भिन्नता के आधार पर वर्गीकरण करें, परिकल्पना बनाएँ और उसे परखें; \"यह मानक व्याकरण-नियम पढ़ाने से कहीं बेहतर होगा\" (पृ. १०, खंड 2.3(f); पृ. ८-९ में चॉम्स्की का संदर्भ)। यह बहुभाषी कक्षा में विशेष रूप से प्रभावी बताया गया है।<\/li>\n<li><b>कब बढ़ता है महत्त्व:<\/b> \"संभव है कि पहली से दूसरी और अंततः विदेशी भाषा की ओर जाते हुए व्याकरण-शिक्षण पर ज़ोर बढ़ता जाए\" (पृ. १९, खंड 4.5)। तब भी NCF कहता है कि विदेशी भाषा के शिक्षण में भी बोधगम्य पाठ सबसे शक्तिशाली औज़ार हैं।<\/li>\n<li><b>शुद्धता का आग्रह:<\/b> NCF सौंदर्य-बोध की बात करते हुए कहता है कि इससे \"शुद्धता और सही होने के आग्रह की जगह भाषा की जीवंतता और रचनात्मकता\" को वरीयता मिलेगी (पृ. ३)।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण (आगमन विधि से व्याकरण):<\/b> बोर्ड पर लिखें: \"लड़का खेलता है\", \"लड़की खेलती है\", \"बच्चे खेलते हैं\"। पूछें: \"खेलता, खेलती, खेलते में क्या बदला और क्यों?\" बच्चे स्वयं खोजें कि क्रिया कर्ता के लिंग-वचन के अनुसार बदलती है। नियम बच्चों के मुँह से निकलता है, शिक्षक के मुँह से नहीं। (आगमन-निगमन के बारे में खंड 10 देखें।)<\/div>\n<div class=\"trap\"><b>ध्यान दें:<\/b> इसका अर्थ यह नहीं कि व्याकरण पढ़ाना ही बंद कर दें। NCF का आशय है कि व्याकरण अर्थ और प्रयोग से जुड़कर पढ़ाया जाए और खोज के रूप में सिखाया जाए, अलग से रटवाया न जाए।<\/div>\n\n<h2>6. विविधतापूर्ण (बहुभाषी) कक्षा की चुनौतियाँ<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> एक ही कक्षा में अलग-अलग मातृभाषा, बोली, पृष्ठभूमि, सामाजिक-आर्थिक स्थिति और सीखने के स्तर वाले बच्चों का होना विविधतापूर्ण कक्षा है। NCF के अनुसार भारत की कक्षाओं में यही सामान्य स्थिति है।<\/div>\n<ul>\n<li><b>मातृभाषा की परिभाषा (पृ. १९, खंड 4.5):<\/b> मातृभाषा वे भाषाएँ हैं जो बच्चा स्कूल आने से पहले घर, पड़ोस और मित्र-मंडली में सीखता है (बहुवचन में)। स्कूल में सीखी पर परिवेश का हिस्सा भाषाएँ दूसरी भाषाएँ हैं; जो भाषा-समुदाय पहुँच में न हो, वह विदेशी है।<\/li>\n<li><b>संसाधन, बाधा नहीं (पृ. ३१, सिफ़ारिश 15):<\/b> \"बहुभाषी कक्षाओं को, जो भारत की सबसे आम स्थिति हैं, शिक्षा में बाधा नहीं बल्कि संसाधन माना जाए।\"<\/li>\n<li><b>चुनौती: घर की भाषा और स्कूल की भाषा का अंतर:<\/b> NCF के अनुसार कई बच्चे इसलिए स्कूल छोड़ देते हैं कि स्कूल की भाषा उनके घर और पड़ोस की भाषाओं से नहीं जुड़ती (पृ. v, कार्यकारी सारांश)। बच्चे स्कूल में \"बहुभाषी क्षमता\" लेकर आते हैं। उदाहरणतः आदिवासी स्कूलों में अध्यापक विद्यार्थियों की भाषा नहीं जानते, कभी-कभी बच्चों को स्कूल में अपनी भाषा बोलने से मना किया जाता है (पृ. २७)। NCF की सिफ़ारिश: अध्यापक को विद्यार्थियों की भाषा सीखना चाहिए (पृ. २७)।<\/li>\n<li><b>द्विभाषिकता के लाभ (पृ. २१):<\/b> द्विभाषी बच्चे अधिक रचनात्मक और सामाजिक रूप से सहिष्णु होते हैं और अपसारी चिंतन में आगे रहते हैं; भाषा के उन्नत कौशल एक भाषा से दूसरी में बिना अतिरिक्त परिश्रम के स्थानांतरित हो जाते हैं।<\/li>\n<li><b>मानक और बोली (पृ. ५):<\/b> विज्ञान की दृष्टि से मानक भाषा, शुद्ध भाषा, बोली, किस्म, इन सबमें कोई अंतर नहीं है। \"मानक\" सत्ता के साथ बदलता रहता है। बोलियों के प्रति पूर्वाग्रह त्वचा के रंग या धर्म के आधार पर किए पूर्वाग्रह जितने ही घातक हैं।<\/li>\n<li><b>लैंगिक और सामाजिक पूर्वाग्रह (पृ. ६, खंड 1.10):<\/b> भाषा में लैंगिक पूर्वाग्रह गुँथे होते हैं। पाठ्य-पुस्तकों और शिक्षकों को चाहिए कि स्त्रियों की निष्क्रिय और आश्रित भूमिकाओं को सामाजिक रचना मानकर उन्हें दूर करें।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> हरियाणा की कक्षा में कुछ बच्चे हरियाणवी, कुछ पंजाबी, कुछ भोजपुरी बोलते हैं। 'पानी' के लिए सबके शब्द बोर्ड पर लिखें (पाणी, जल, पानी), फिर मानक हिंदी शब्द से तुलना कराएँ। इस तरह किसी की बोली छोटी नहीं ठहरती, और बच्चे की भाषा-जागरूकता (metalinguistic awareness) बढ़ती है (पृ. २३, खंड 6.3(d))।<\/div>\n\n<h2>7. भाषा-कठिनाइयाँ, त्रुटियाँ और विकार<\/h2>\n<h3>(क) त्रुटियाँ<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> त्रुटि वह ग़लती है जो सीखने की प्रक्रिया में होती है, जैसे बच्चा \"गया\" की जगह \"जाया\" कहे क्योंकि उसने \"खेला-खेल\" का नियम सामान्यीकृत कर लिया।<\/div>\n<ul>\n<li><b>NCF का दृष्टिकोण:<\/b> अवस्थाबद्ध संज्ञानात्मक विकास पर बल ने शिक्षकों को त्रुटियों को \"मिटाए जाने योग्य रोग\" की बजाय \"सीखने की प्रक्रिया के चरण\" मानने की ओर प्रेरित किया (पृ. ११, खंड 2.4)। संवेदनशील शिक्षक \"त्रुटियों को चरणों के रूप में, लगभग अनिवार्य चरणों के रूप में\" देख सके (पृ. २८, खंड 8.5)।<\/li>\n<li>बोली और लिखित भाषा में अंतर स्वाभाविक है (पृ. २, खंड 1.4); जो शिक्षक यह समझ जाते हैं वे त्रुटियों के प्रति दृष्टिकोण बदल लेते हैं।<\/li>\n<li><b>लेखन में संपादन:<\/b> क्रैशन के अनुसार बच्चे जब पर्याप्त समय और स्वतंत्रता पाते हैं तो अपने लिखे को स्वयं सुधारकर निर्गत बेहतर बनाते हैं (पृ. ११)।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> बच्चे ने लिखा \"मैंने खाना खायी।\" शिक्षक लाल क़लम से काटने के बजाय पूछे: \"तुमने क्या खाया? 'खाना' पुल्लिंग है या स्त्रीलिंग?\" फिर उसी वाक्य को बच्चे से ही ठीक करवाए। ग़लती से बच्चा सोचता है और सीखता है।<\/div>\n<h3>(ख) भाषा-कठिनाइयाँ<\/h3>\n<p>NCF के अनुसार अनेक भारतीय बच्चे स्कूल में पढ़ने की समझ और लेखन में \"दयनीय\" स्तर पर रह जाते हैं, और इसके कारणों में भाषा की प्रकृति और भाषा-शिक्षण-प्रक्रियाओं की समझ का अभाव, बहुभाषी संदर्भ की अनदेखी, और घर-पड़ोस की भाषा की भूमिका का न मानना हैं (पृ. v)। तथ्य: पाँचवीं कक्षा तक कई आदिवासी बच्चे पाठ्य-पुस्तक का पूरा वाक्य नहीं पढ़ पाते (पृ. २७)। सामान्य कठिनाइयाँ (कारण: स्कूल-भाषा बनाम घर-भाषा का अंतर, कठिन शब्दावली, नीरस पाठ, चिंता) इन्हीं कारणों से जुड़ी हैं। NCF यह भी कहता है कि जब भाषा का रूप बच्चे की अपनी भाषा-किस्म से बहुत दूर हो (जैसे बहुत संस्कृतनिष्ठ हिंदी), तो कठिनाई बढ़ती है; इसका उपाय \"ज्ञात से अज्ञात की ओर\" चलना है (पृ. १९, खंड 4.6)।<\/p>\n<h3>(ग) भाषा-विकार (Disorders)<\/h3>\n<p>पाठ्यक्रम में \"language difficulties, errors and disorders\" है, पर NCF 2005 के इस आधार-पत्र में डिस्लेक्सिया, डिस्ग्राफ़िया या अफ़ेज़िया जैसे विकारों का कोई विवेचन नहीं है, इसलिए इनकी परिभाषाएँ यहाँ प्रामाणिक स्रोत से नहीं दी जा रहीं। इतना ही कहा जा सकता है कि NCF सिफ़ारिश 20 (पृ. ३२) में विशेष आवश्यकता वाले बच्चों के लिए विशेष रूप से बनी सामग्री और तकनीक की उपलब्धता कहता है। विकारों का विस्तृत वर्गीकरण (डिस्लेक्सिया = पढ़ने में, डिस्ग्राफ़िया = लिखने में, अफ़ेज़िया = मस्तिष्क-क्षति से भाषा-क्षमता में हानि) मानक शिक्षा-मनोविज्ञान की प्रचलित शब्दावली है, इस आधार-पत्र की नहीं; परीक्षा में इन्हें केवल नाम और अर्थ के स्तर तक याद रखें।<\/p>\n\n<h2>8. भाषा-कौशल (LSRW)<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> भाषा-कौशल चार हैं: <b>सुनना (Listening)<\/b>, <b>बोलना (Speaking)<\/b>, <b>पढ़ना (Reading)<\/b> और <b>लिखना (Writing)<\/b>। पहले दो ग्रहण/निर्गम के मौखिक रूप हैं, अंतिम दो लिखित रूप। स्वाभाविक क्रम सुनना, बोलना, पढ़ना, लिखना है।<\/div>\n<p>NCF इन चारों को \"उद्देश्य\" के रूप में देता है, पर चेतावनी के साथ: \"विविक्त कौशलों पर विशेष बल के विपरीत परिणाम हुए हैं\", और यह दिखाता है कि वास्तविक जीवन में कौशल साथ-साथ चलते हैं (पृ. ९)। NCF के आठ उद्देश्य (पृ. ९-१०, खंड 2.3):<\/p>\n<table><tr><th>उद्देश्य<\/th><th>NCF का आशय<\/th><th>कक्षा-गतिविधि<\/th><\/tr>\n<tr><td>(क) सुनकर समझना<\/td><td>गैर-मौखिक संकेतों का उपयोग, अनुमान निकालना<\/td><td>कहानी सुनकर क्रम बताना<\/td><\/tr>\n<tr><td>(ख) समझ सहित पढ़ना, केवल डिकोड नहीं<\/td><td>अरैखिक पढ़ना, अनुमान, पूर्व ज्ञान से जोड़, आलोचनात्मक दृष्टि और प्रश्न<\/td><td>अपठित पर लेखक के आशय की चर्चा<\/td><\/tr>\n<tr><td>(ग) सहज अभिव्यक्ति<\/td><td>अलग स्थितियों के लिए शैलियाँ, तार्किक-रचनात्मक चर्चा<\/td><td>वाद-विवाद, भाषण<\/td><\/tr>\n<tr><td>(घ) सुसंगत लेखन<\/td><td>लेखन यांत्रिक नहीं; व्याकरण, शब्द, विषयवस्तु, विराम-चिह्न का नियंत्रण; विषय चुनना, विचार संगठित करना, पाठक का ध्यान; <b>लेखन प्रक्रिया है, उत्पाद नहीं<\/b><\/td><td>मसौदा, संशोधन, प्रकाशन<\/td><\/tr>\n<tr><td>(ङ) रजिस्टर पर नियंत्रण<\/td><td>भाषा के भिन्न रूप (विषय, संगीत, खेल, फ़िल्म, कृषि, पाककला की भाषा)<\/td><td>खेल-समीक्षा, रेसिपी लिखना<\/td><\/tr>\n<tr><td>(च) भाषा का वैज्ञानिक अध्ययन<\/td><td>आँकड़े जुटाना, वर्गीकरण, परिकल्पना; नियम रटाने से बेहतर<\/td><td>शब्दों के लिंग पर खोज<\/td><\/tr>\n<tr><td>(छ) रचनात्मकता<\/td><td>कल्पना और सृजन के लिए खुली जगह<\/td><td>कहानी पूरी करना<\/td><\/tr>\n<tr><td>(ज) संवेदनशीलता<\/td><td>संस्कृति, विरासत, आसपास और राष्ट्र के प्रति<\/td><td>स्थानीय लोकगीत संकलन<\/td><\/tr><\/table>\n<p><b>एकीकृत कौशल (पृ. २६, खंड 7.8):<\/b> रोज़मर्रा में हम कौशलों को अकेले नहीं, एक साथ इस्तेमाल करते हैं, इसलिए पाठ्य-पुस्तकों को ऐसे काम देने चाहिए जिनमें कौशल स्वाभाविक रूप से मिलें; इससे प्रेरणा बढ़ती है (मैकडोनो और शॉ का उद्धरण)। जैसे मित्रों का मिलकर नाटक पढ़ना, नोट्स लेना और मंचन की तैयारी करना (पृ. ९)।<\/p>\n\n<h3>वाचन (पढ़ना) के प्रकार<\/h3>\n<p>पढ़ने के दो मुख्य रूप स्कूलों में पढ़ाए जाते हैं। (वर्गीकरण स्कूली शिक्षण-शास्त्र का प्रचलित है; NCF इसे इस नाम से नहीं देता, पर पढ़ने के उद्देश्य (ख) से जुड़ता है।)<\/p>\n<div class=\"cards\">\n<div><h3>सस्वर वाचन<\/h3><p>आवाज़ के साथ पढ़ना। उद्देश्य: शुद्ध उच्चारण, उचित गति और लय, आरोह-अवरोह, विराम-चिह्नों का ध्यान, हाव-भाव, झिझक दूर करना, श्रोताओं तक भाव पहुँचाना। भेद: आदर्श वाचन (शिक्षक), अनुकरण वाचन (बच्चे दोहराएँ), व्यक्तिगत और सामूहिक वाचन।<\/p><\/div>\n<div><h3>मौन वाचन<\/h3><p>बिना आवाज़ के, आँखों से पढ़ना। उद्देश्य: अर्थ-ग्रहण और केंद्रीय भाव की समझ, स्वाध्याय की आदत, एकाग्रता, अपनी गति से पढ़ना, पढ़ने की गति का विकास, अधिक पढ़ने का अभ्यास।<\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>जाल, HTET 2024 Q31:<\/b> प्रश्न था कि मौन वाचन का उद्देश्य <i>क्या नहीं है<\/i>। विकल्प: (A) उचित लय और गति प्रदान करना, (B) स्वाध्याय की आदत, (C) तीव्र गति से पढ़ने का अभ्यास, (D) अर्थ ग्रहण कर केंद्रीय भाव समझना। शिक्षण-शास्त्र की दृष्टि से (B) और (D) निश्चित रूप से मौन वाचन के उद्देश्य हैं, और उचित लय और गति सस्वर वाचन का उद्देश्य है (क्योंकि लय तभी बनती है जब बोला जाए), इसलिए तर्क से उत्तर (A) बनता है। पर BSEH की अंतिम उत्तर-कुंजी ने (C) &lsquo;तीव्र गति से पढ़ने का अभ्यास&rsquo; को \"उद्देश्य नहीं\" माना। यह प्रश्न विवादित है। ऐसा प्रश्न दोबारा आए तो BSEH की कुंजी याद रखें, पर सोचने का तर्क ऊपर वाला है।<\/div>\n<p><b>अन्य वर्गीकरण (स्कूली प्रचलन):<\/b> गहन वाचन (intensive: पाठ्य-पुस्तक का बारीक पाठ, शब्दार्थ-सहित) और द्रुत या विस्तृत वाचन (extensive: रुचि से बड़े पाठ, पुस्तकालय की किताबें)। NCF सिफ़ारिश 23 (पृ. ३२) कहती है कि पढ़ने की आदत डालने के लिए हर स्कूल में अच्छा पुस्तकालय हो जहाँ बच्चे पाठ्यक्रम से हटकर पढ़ने-लिखने में लगें।<\/p>\n\n<h3>लेखन<\/h3>\n<ul>\n<li><b>लेखन एक प्रक्रिया है (NCF पृ. १०):<\/b> विषय चुनना, विचार संगठित करना, पाठकों को ध्यान में रखकर लिखना; इसे उत्पाद की तरह नहीं, प्रक्रिया की तरह देखा जाए (मसौदा, सुधार, पुनर्लेखन)।<\/li>\n<li><b>लेखन के अंग (स्कूली प्रचलन):<\/b> सुलेख (सुंदर लिखावट), श्रुतलेख (सुनकर लिखना), अनुलेख (देखकर नक़ल), वर्तनी-शुद्धि, विराम-चिह्न, पत्र, निबंध, रचनात्मक लेखन। (प्रचलित शब्दावली है, NCF का नहीं।)<\/li>\n<li><b>लेखन-सुधार:<\/b> बच्चे को संपादन का समय और स्वतंत्रता दें (पृ. ११)।<\/li>\n<\/ul>\n\n<h2>9. शिक्षण-अधिगम सामग्री (TLM): पाठ्य-पुस्तक, मल्टीमीडिया, बहुभाषी संसाधन<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> NCF (पृ. २३, खंड 7.1) के अनुसार \"सामग्री\" में वह सब कुछ आता है जो भाषा-अधिगम को सुगम बनाए। यह भाषिक, दृश्य, श्रव्य या गतिबोधी हो सकती है, और मुद्रित, जीवंत प्रस्तुति, कैसेट, सीडी-रॉम, डीवीडी या इंटरनेट के रूप में हो सकती है। सामग्री सूचनात्मक, प्रयोगात्मक, उद्दीपक (भाषा-प्रयोग को प्रेरित करने वाली) या अन्वेषणात्मक हो सकती है।<\/div>\n<h3>(क) पाठ्य-पुस्तक (खंड 7.2, 7.3, 7.4, पृ. २३-२५)<\/h3>\n<ul>\n<li>\"कोई भी एक पाठ्य-पुस्तक किसी भी कक्षा के लिए आदर्श नहीं हो सकती।\" प्रभावी शिक्षक सामग्री का मूल्यांकन करता है, उसे ढालता है और स्वयं बनाता है; हर शिक्षक सामग्री-निर्माता हो सकता है (पृ. २३-२४)।<\/li>\n<li>पाठ्य-पुस्तकें प्रायः नीरस और कल्पनाहीन होती हैं; विशेषकर प्राथमिक पुस्तकें संवेदना, संदर्भ-समृद्धि और रचनात्मकता को चुनौती देने वाली हों, केवल कहानी-कविता न हों (पृ. २४)।<\/li>\n<li><b>स्पष्ट बनाम संप्रेषणात्मक शिक्षण:<\/b> अधिकांश पुस्तकें रूप-केंद्रित निर्देश के ऊपर संप्रेषणात्मक गतिविधियाँ जोड़ देती हैं; क्रैशन से प्रेरित पाठ्य-सामग्री चर्चा, परियोजना, खेल, अनुरूपण और नाटक से अनौपचारिक अर्जन का मार्ग खोलती है (पृ. २४)।<\/li>\n<li><b>प्रामाणिक बनाम गढ़ी हुई:<\/b> गढ़ी हुई सामग्री छोटी और सरल होती है, पर उसमें स्वाभाविक पुनरावृत्ति (redundancy) हटने से पाठ कृत्रिम और बेतुका बन जाता है। NCF प्रामाणिक पाठ लेने और उनमें बदलाव न करने का सुझाव देता है; बदलाव ज़रूरी हो तो लेखक की अनुमति से (पृ. २४-२५)।<\/li>\n<li>पाठ्य-पुस्तकें विभिन्न विषयों के साथ भाषा के विभिन्न रूप भी दिखाएँ, भारत का भाषा-मानचित्र दें और भाषा-विविधता का परिचय कराएँ (पृ. २५, खंड 7.6)।<\/li>\n<\/ul>\n<h3>(ख) मल्टीमीडिया (श्रव्य-दृश्य, तकनीक)<\/h3>\n<ul>\n<li>पाठ्य-सामग्री में कैसेट, सीडी-रॉम, डीवीडी, इंटरनेट शामिल हैं (पृ. २३, खंड 7.1)। \"आधुनिक तकनीक इस संबंध में स्कूलों की सार्थक मदद कर सकती है\" (पृ. २३, खंड 6.3(ग))।<\/li>\n<li>सिफ़ारिश 21 (पृ. ३२): भारतीय भाषाओं के ऑनलाइन संवादात्मक शिक्षण और रोचक दूरदर्शन कार्यक्रम, जो भाषा-अधिगम और भाषा-चेतना (metalinguistic awareness) में मदद करें।<\/li>\n<li>सिफ़ारिश 20 (पृ. ३२): विशेष आवश्यकता वाले शिक्षार्थियों को आधुनिक तकनीक और विशेष रूप से बनी सामग्री तक विशेष पहुँच।<\/li>\n<\/ul>\n<h3>(ग) बहुभाषी संसाधन<\/h3>\n<ul>\n<li>\"स्थानीय शब्दकोश, दीवार-पत्रिकाएँ, लोककथाएँ और गीत, नृवंशविज्ञान आख्यान, वृत्तचित्र\" कक्षा-व्यवहार के प्रभावी स्थल बन रहे हैं (पृ. २५-२६, खंड 7.7)।<\/li>\n<li>बच्चों और शिक्षकों द्वारा मिलकर बनाई सामग्री उनके लिए और कनिष्ठ कक्षाओं के लिए अधिगम-सामग्री बन सकती है। सबसे प्रभावी सामग्री वह है जो शिक्षकों, प्रशिक्षकों और विश्वविद्यालयी विद्वानों की कार्यशालाओं में बनी और कक्षा में परखी गई (पृ. २५)।<\/li>\n<li>अनुवाद एक शक्तिशाली औज़ार है, क्योंकि कक्षा की बहुभाषिकता (बच्चों की भाषाएँ) संसाधन है (पृ. २३, खंड 6.3(घ))। NCF इस पर भी आपत्ति करता है कि एक भाषा में \"मास्टर पाठ्य-पुस्तक\" बनाकर दूसरी भाषाओं में अनूदित की जाती है; यह भाषा, चिंतन और संस्कृति के संबंध का \"उपहास\" है (पृ. २४)।<\/li>\n<li>सिफ़ारिश 26 (पृ. ३२): भाषा-पाठ्य-पुस्तकों और विज्ञान-सामाजिक विज्ञान की पुस्तकों के बीच भाषा-सेतु बनें, क्योंकि कई बार वैज्ञानिक और सामाजिक अवधारणाएँ \"भाषा की समस्याओं\" के कारण ही समझ में नहीं आतीं।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> 'पर्यावरण' पाठ के लिए शिक्षक पाठ्य-पुस्तक के साथ एक पोस्टर (दृश्य), किसी पक्षी की आवाज़ की रिकॉर्डिंग (श्रव्य), बच्चों के घरों की बोलियों में पेड़ों के नामों की सूची (बहुभाषी), और दीवार-पत्रिका के लिए \"मेरे गाँव का पेड़\" लेखन का काम दे। यह सब एक ही पाठ में।<\/div>\n\n<h2>10. शिक्षण-विधियाँ<\/h2>\n<p>NCF (पृ. २२, खंड 6.1, 6.2) ने भाषा-शिक्षण की विधियों की सूची दी है: व्याकरण-अनुवाद विधि, प्रत्यक्ष विधि, श्रव्य-भाषिक उपागम (Audio-lingual), संप्रेषणात्मक उपागम, कंप्यूटर-सहायित भाषा-शिक्षण, सामुदायिक भाषा-अधिगम (CLL), साइलेंट वे, सजेस्टोपीडिया, कुल शारीरिक प्रतिक्रिया (TPR), और क्रैशन का मॉनिटर मॉडल व शुमान का संस्कृति-आत्मसात् मॉडल जैसे द्वितीय-भाषा-अर्जन सिद्धांतों से निकली विधियाँ। इनमें से प्रत्येक एक विशेष ऐतिहासिक संदर्भ में विशेष आवश्यकता के उत्तर में बनी थी, इसलिए सबकी अपनी सीमा है (पृ. २२)।<\/p>\n<div class=\"cards\">\n<div><h3>व्याकरण-अनुवाद<\/h3><p>नियम सिखाकर अनुवाद। NCF: यह व्यवहारवाद, संरचनात्मक भाषाविज्ञान और औपनिवेशिक सरकार की ज़रूरतों से जुड़ी थी, पर इसने दिखाया कि साहित्यिक भाषा विषयवस्तु और समग्र पाठ पर बल देने से प्रभावी ढंग से सीखी जा सकती है (पृ. २२)। बोलचाल में कमज़ोर।<\/p><\/div>\n<div><h3>प्रत्यक्ष विधि<\/h3><p>सीधे लक्ष्य-भाषा में, अनुवाद के बिना; बोलचाल पर बल। मातृभाषा बीच में नहीं आती।<\/p><\/div>\n<div><h3>संप्रेषणात्मक उपागम<\/h3><p>वास्तविक संवाद-स्थितियाँ, अर्थ और प्रयोग पर बल; चर्चा, खेल, नाटक, परियोजना।<\/p><\/div>\n<div><h3>TPR<\/h3><p>कुल शारीरिक प्रतिक्रिया। NCF: आरंभिक चरण में सीखने वाले की झिझक तोड़कर बहुत सफल हो सकती है (पृ. २२)।<\/p><\/div>\n<div><h3>आगमन विधि<\/h3><p>उदाहरण से नियम (विशेष से सामान्य)। व्याकरण में बच्चा स्वयं नियम खोजता है। NCF के \"वैज्ञानिक जाँच\" वाले सुझाव से मेल खाती है (पृ. १०)।<\/p><\/div>\n<div><h3>निगमन विधि<\/h3><p>नियम पहले, फिर उदाहरण (सामान्य से विशेष)। तेज़ है पर बच्चा निष्क्रिय रहता है।<\/p><\/div>\n<\/div>\n<p>NCF के निष्कर्ष (पृ. २२): यदि हम व्याकरण-अनुवाद विधि को आज के लिए अपनाएँ तो उसे बदलना होगा और प्रत्यक्ष, श्रव्य-भाषिक तथा संप्रेषणात्मक उपागमों की बातें लेकर बोलचाल के घटक का ध्यान रखना होगा। हर शिक्षक अपनी विधि स्वयं विकसित करेगा।<\/p>\n<div class=\"trap\"><b>ध्यान दें:<\/b> आगमन और निगमन के नाम NCF में नहीं हैं; ये स्कूली शिक्षण-शास्त्र की प्रचलित शब्दावली है। भाव वही है कि व्याकरण में खोज द्वारा सिखाना रटाने से बेहतर है। परीक्षा में प्रश्न आए तो \"आगमन = उदाहरण से नियम, निगमन = नियम से उदाहरण\" याद रखें।<\/div>\n\n<h2>11. मूल्यांकन<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> मूल्यांकन शिक्षार्थी की प्रगति जाँचने और शिक्षण सुधारने के लिए सूचना जुटाने की प्रक्रिया है। NCF (पृ. २८, खंड 9.1): \"मूल्यांकन शिक्षण-अधिगम प्रक्रिया का अभिन्न अंग है।\" यह निरंतर चलने वाली प्रक्रिया है, जिसका प्रमुख उद्देश्य है विधियों, सामग्री, शिक्षक-प्रशिक्षण और कक्षा-व्यवहार में सुधार हेतु प्रतिपुष्टि लेना (पृ. २९)।<\/div>\n<ul>\n<li><b>चिंता का प्रभाव:<\/b> अंतिम परीक्षा-केंद्रित प्रक्रियाएँ भारी चिंता पैदा करती हैं और चिंता प्रदर्शन के विपरीत संबंधित है (पृ. २८)। मूल्यांकन \"चुनौतीपूर्ण और आनंददायक\" बने, उबाऊ और डरावना नहीं।<\/li>\n<li><b>क्या जाँचें:<\/b> भाषा की संरचना और रूप का ज्ञान, उसे प्रामाणिक संप्रेषण-स्थितियों में प्रयोग करने की क्षमता, और भाषा के सौंदर्य-पक्ष की सराहना (पृ. २८)।<\/li>\n<li><b>परीक्षण के प्रकार (खंड 9.2, पृ. २९):<\/b> (क) अभिक्षमता परीक्षण (aptitude), (ख) मानदंड-संदर्भित (criterion-referenced): निदानात्मक (diagnostic: इकाई के अंत में प्रगति बताने वाला) और उपलब्धि परीक्षण (achievement), (ग) मानक-संदर्भित (norm-referenced): प्लेसमेंट और प्रवीणता परीक्षण। साथ ही वस्तुनिष्ठ और व्यक्तिनिष्ठ परीक्षण।<\/li>\n<li><b>परीक्षण-कार्य (खंड 9.4, पृ. ३०):<\/b> अनुत्पादक कार्य (मिलान, बहुविकल्पीय, क्रम-निर्धारण), उत्पादक कार्य (क्लोज़, श्रुतलेख, अनुवाद, नोट-टेकिंग, रचना) और <b>पोर्टफ़ोलियो मूल्यांकन<\/b> (विद्यार्थी की रचनात्मकता का एक संकलन, मानकीकृत परीक्षण का विकल्प, जो उसे अपने सीखने की ज़िम्मेदारी देता है)। क्लोज़ विधि (पैरे से शब्द हटाकर भरवाना) एकीकृत परीक्षण का उदाहरण है।<\/li>\n<li><b>सिफ़ारिश 19 (पृ. ३२):<\/b> मूल्यांकन अंतिम (terminal) न हो और केवल व्याकरण-ज्ञान या स्थानीय पठन-बोध तक सीमित न रहे; वह सतत हो और विभिन्न रजिस्टर, विधाओं और पाठ्यक्रम-व्यापी संप्रेषणात्मक कार्यों को देखे।<\/li>\n<\/ul>\n<div class=\"ex\"><b>कक्षा का उदाहरण:<\/b> एक इकाई के अंत में शिक्षक पत्र-लेखन का निदानात्मक परीक्षण करता है; जिन बच्चों की औपचारिक शैली कमज़ोर है, उन्हें अगले हफ़्ते अभ्यास दिलाता है। साल भर बच्चे अपनी कविताएँ एक फ़ाइल (पोर्टफ़ोलियो) में रखते हैं। अंत में सिर्फ़ एक परीक्षा नहीं, पूरी फ़ाइल देखी जाती है।<\/div>\n\n<h2>12. हिंदी शिक्षक की विशेषताएँ और भूमिका<\/h2>\n<ul>\n<li><b>NCF के आधार पर:<\/b> शिक्षक के बिना कोई विकल्प नहीं: \"पेशेवर रूप से प्रशिक्षित और सामाजिक रूप से संवेदनशील शिक्षकों का कोई विकल्प नहीं है\" (पृ. २६, खंड 8.1)। शिक्षक अपने-आप में शोधकर्ता हो सके (पृ. २६-२८, खंड 8.1, 8.5); उसे भाषा की प्रकृति, संरचना, प्रकार्य, भाषा-अर्जन और भाषा-परिवर्तन के प्रति संवेदनशील होना चाहिए और बहुभाषी कक्षा के संसाधनों का उपयोग करना आना चाहिए (पृ. २७, खंड 8.4)।<\/li>\n<li>शिक्षक को बच्चों की भाषाएँ सीखनी चाहिए (पृ. २७), बच्चों को ख़ाली बर्तन नहीं मानना चाहिए (पृ. २३), त्रुटियों को अधिगम का चरण मानना चाहिए (पृ. २८), और कविता की लय, गद्य की सटीकता तथा स्वर-आरोह का बोध कराने वाला होना चाहिए (पृ. २८)।<\/li>\n<li><b>शिक्षक की विशेषताएँ (HTET 2024 Q43):<\/b> साहित्य का ज्ञान, भाषा-शिक्षण की विधियों का ज्ञान, हिंदी भाषा पर विशिष्ट अधिकार, ये सब हिंदी अध्यापक की विशिष्ट विशेषताएँ हैं। \"शिक्षा तथा उपाधियाँ\" (डिग्रियाँ) योग्यता का प्रमाण हैं, गुण नहीं, इसलिए विशिष्ट विशेषता में शामिल नहीं।<\/li>\n<\/ul>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li>\"नहीं है\" वाला प्रश्न हो तो पहले तीन सही बातों को छाँटें और जो बची उसे चुनें।<\/li>\n<li>प्रश्न का विषय पहचानें: अर्जन/अधिगम, कौशल, वाचन, व्याकरण, विधि, मूल्यांकन या शिक्षक।<\/li>\n<li>NCF का मूल स्वर याद रखें: बच्चा केंद्र में, चिंता-रहित वातावरण, अर्थ पहले व्याकरण बाद में, त्रुटि सीखने का चरण, बहुभाषिकता संसाधन, मूल्यांकन सतत। जो विकल्प इनके विरुद्ध हो वह ग़लत।<\/li>\n<li>वाचन के प्रश्न में सस्वर बनाम मौन उद्देश्यों का भेद करें (लय/उच्चारण बनाम अर्थ-ग्रहण/स्वाध्याय)।<\/li>\n<li>विधि के प्रश्न में प्रक्रिया की दिशा देखें: उदाहरण से नियम = आगमन; नियम से उदाहरण = निगमन; अनुवाद-नियम = व्याकरण-अनुवाद; सीधे लक्ष्य-भाषा = प्रत्यक्ष।<\/li>\n<li>शिक्षक के गुण में योग्यता-प्रमाण (उपाधि, अनुभव के वर्ष) और ज्ञान-कौशल (साहित्य, विधियाँ, भाषा पर अधिकार) में भेद करें।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>भ्रम<\/th><th>अंतर<\/th><th>नोट<\/th><\/tr>\n<tr><td>अर्जन / अधिगम<\/td><td>स्वाभाविक, परिवेश से / सचेत, कक्षा में<\/td><td>मातृभाषा = अर्जन<\/td><\/tr>\n<tr><td>BICS / CALP<\/td><td>रोज़ की बोलचाल / चिंतन-प्रधान, संदर्भ-रहित<\/td><td>CALP स्थानांतरित होती है<\/td><\/tr>\n<tr><td>सस्वर / मौन वाचन<\/td><td>आवाज़ से, उच्चारण-लय / चुपचाप, अर्थ-ग्रहण<\/td><td>2024 Q31 की कुंजी विवादित<\/td><\/tr>\n<tr><td>आगमन / निगमन<\/td><td>उदाहरण से नियम / नियम से उदाहरण<\/td><td>व्याकरण में आगमन बेहतर<\/td><\/tr>\n<tr><td>निदानात्मक / उपलब्धि परीक्षण<\/td><td>इकाई-स्तर पर प्रगति बताता है / स्तर की तुलना और उद्देश्यों की प्राप्ति<\/td><td>NCF खंड 9.2<\/td><\/tr>\n<tr><td>मातृभाषा / द्वितीय / विदेशी<\/td><td>स्कूल-पूर्व घर-पड़ोस / स्कूल में, परिवेश का हिस्सा / परिवेश में उपलब्ध नहीं<\/td><td>NCF खंड 4.5<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2024 Q31<\/h3>\n<p>निम्नलिखित में से मौन वाचन का उद्देश्य नहीं है: (1) उचित लय और गति प्रदान करना। (2) स्वाध्याय की आदत विकसित करना। (3) तीव्र गति से पढ़ने का अभ्यास करना। (4) अर्थ ग्रहण कर उसका केन्द्रीय भाव समझना।<\/p>\n<div class=\"ex\"><b>BSEH कुंजी के अनुसार उत्तर: (3)<\/b> जाँच: (2) और (4) निश्चित रूप से मौन वाचन के उद्देश्य हैं (स्वाध्याय; अर्थ-ग्रहण)। (1) लय और गति देना प्रायः सस्वर वाचन से जुड़ता है, इसीलिए शिक्षण-शास्त्र के तर्क से वही \"उद्देश्य नहीं\" बनता है। (3) में तीव्र गति से पढ़ने का अभ्यास मौन वाचन से जुड़ता है (आँख बोलने की सीमा से मुक्त रहती है)। फिर भी BSEH की जारी कुंजी में (3) \"नहीं है\" माना गया है। इसलिए: तर्क (1) की ओर जाता है, कुंजी (3) की ओर; यह प्रश्न विवादित है और परीक्षा के लिए कुंजी का उत्तर (3) याद रखें।<\/div>\n<div class=\"trap\"><b>दोनों पक्ष:<\/b> (1) पक्ष: मौन वाचन में आवाज़ नहीं होती, इसलिए \"लय\" उसका उद्देश्य नहीं हो सकती। (3) पक्ष: मौन वाचन का उद्देश्य \"अर्थ-ग्रहण की गति\" है, केवल \"तेज़ पढ़ना\" नहीं, इसलिए कुछ प्रश्न-निर्माता इसे अनुचित मान सकते हैं। BSEH का उत्तर (3) है।<\/div>\n\n<h3>HTET 2024 Q43<\/h3>\n<p>हिंदी अध्यापक की विशिष्ट विशेषताओं में सम्मिलित नहीं है: (1) साहित्य का ज्ञान (2) भाषा शिक्षण की विधियों का ज्ञान (3) हिंदी भाषा पर विशिष्ट अधिकार (4) शिक्षा तथा उपाधियाँ<\/p>\n<div class=\"ex\"><b>उत्तर: (4)<\/b> पहले तीन विशेषताएँ ज्ञान और कौशल हैं जो कक्षा में भाषा सिखाने के लिए सीधे काम आती हैं। \"शिक्षा तथा उपाधियाँ\" योग्यता का औपचारिक प्रमाण हैं, गुण नहीं। NCF भी शिक्षक के गुणों में संवेदनशीलता, शोध-दृष्टि, भाषा का बोध और बहुभाषी कक्षा का उपयोग गिनाता है, डिग्रियाँ नहीं (पृ. २६-२८)।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>अर्जन = स्वाभाविक (मातृभाषा), अधिगम = सचेत (कक्षा)। बच्चे तीन साल की उम्र तक अपनी भाषा की मूल व्यवस्था सीख लेते हैं (NCF पृ. १)।<\/li>\n<li>NCF के दो शिक्षण-निष्कर्ष: पर्याप्त संपर्क से नई भाषाएँ सहज सीखी जाएँगी, और ध्यान व्याकरण से अधिक अर्थ पर हो।<\/li>\n<li>क्रैशन: बोधगम्य निवेश, चिंता-रहित वातावरण, नीची भावात्मक छलनी, तब निवेश आत्मसात् होता है (पृ. १०-११)।<\/li>\n<li>छह सिद्धांत: शिक्षार्थी केंद्र में, सकारात्मक दृष्टिकोण, समृद्ध निवेश, बहुभाषिकता संसाधन, लिंग-पर्यावरण, मूल्यांकन प्रक्रिया का अंग (पृ. २२-२३)।<\/li>\n<li>भाषा केवल संप्रेषण नहीं: चिंतन, सामाजिक संबंध, पहचान, सौंदर्य, संस्कृति भी (पृ. १-७)।<\/li>\n<li>व्याकरण नियम रटाने के बदले आँकड़े-वर्गीकरण-परिकल्पना का वैज्ञानिक अनुभव (पृ. १०); विदेशी भाषा में महत्त्व बढ़ता है (पृ. १९)।<\/li>\n<li>त्रुटियाँ सीखने के चरण हैं, दंडनीय दोष नहीं (पृ. ११, २८)। भाषा-विकारों का विवेचन इस आधार-पत्र में नहीं है।<\/li>\n<li>चार कौशल अलग-अलग नहीं, गुँथे हुए हैं; लेखन उत्पाद नहीं, प्रक्रिया है (पृ. ९-१०)।<\/li>\n<li>सस्वर वाचन: उच्चारण, लय, भाव; मौन वाचन: अर्थ-ग्रहण, स्वाध्याय, एकाग्रता। 2024 Q31 की BSEH कुंजी (3) है पर विवादित।<\/li>\n<li>सामग्री: कोई एक पाठ्य-पुस्तक आदर्श नहीं; प्रामाणिक पाठ, मल्टीमीडिया और स्थानीय बहुभाषी संसाधन (पृ. २३-२६)।<\/li>\n<li>मूल्यांकन सतत, चिंता कम करने वाला, पोर्टफ़ोलियो-सहित (पृ. २८-३०)। बहुभाषी कक्षा संसाधन है (पृ. ३१)।<\/li>\n<li>शिक्षक की विशिष्ट विशेषता में उपाधियाँ नहीं आतीं (2024 Q43)।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: NCF 2005 के अनुसार त्रुटियाँ हैं: (A) दंडनीय (B) सीखने की अवस्थाएँ (C) विकार (D) शिक्षक का दोष<\/summary><p><b>उत्तर: (B)<\/b> त्रुटि को अधिगम-प्रक्रिया का चरण माना गया है (पृ. ११, २८)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'नियम पहले, उदाहरण बाद में' किस विधि में होता है? (A) आगमन (B) निगमन (C) प्रत्यक्ष (D) संप्रेषणात्मक<\/summary><p><b>उत्तर: (B)<\/b> सामान्य से विशेष की ओर चलना निगमन है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: भाषा-कौशलों का स्वाभाविक क्रम है: (A) लिखना-पढ़ना-बोलना-सुनना (B) पढ़ना-लिखना-सुनना-बोलना (C) सुनना-बोलना-पढ़ना-लिखना (D) बोलना-सुनना-लिखना-पढ़ना<\/summary><p><b>उत्तर: (C)<\/b> पहले श्रवण और भाषण, बाद में पठन और लेखन।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: NCF 2005 में बहुभाषिकता को माना गया है: (A) बाधा (B) संसाधन (C) समस्या (D) अनावश्यक<\/summary><p><b>उत्तर: (B)<\/b> बहुभाषी कक्षा संसाधन है (पृ. ३१, सिफ़ारिश 15)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: क्रैशन के अनुसार निवेश 'आत्मसात्' (intake) तब बनता है जब: (A) भावात्मक छलनी नीची हो (B) परीक्षा निकट हो (C) व्याकरण रटाया जाए (D) अनुवाद हो<\/summary><p><b>उत्तर: (A)<\/b> सकारात्मक रवैया और प्रबल प्रेरणा होने पर।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: NCF के अनुसार लेखन को देखा जाए: (A) यांत्रिक कौशल (B) प्रक्रिया के रूप में, उत्पाद की तरह नहीं (C) केवल सुलेख (D) केवल श्रुतलेख<\/summary><p><b>उत्तर: (B)<\/b> विषय चुनना, विचार संगठित करना, संशोधन; यह प्रक्रिया है (पृ. १०)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: BICS का उदाहरण है: (A) अपरिचित विषय पर निबंध (B) दोस्तों से रोज़मर्रा की बातचीत (C) संपादकीय की आलोचना (D) तकनीकी शोध-पत्र<\/summary><p><b>उत्तर: (B)<\/b> BICS संदर्भ-समृद्ध, संज्ञानात्मक रूप से कम माँग वाली बातचीत है; (A), (C), (D) CALP हैं (पृ. २१)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: मौन वाचन के उद्देश्यों में सबसे सटीक रूप से शामिल है: (A) शुद्ध उच्चारण सिखाना (B) अर्थ-ग्रहण और स्वाध्याय की आदत (C) आरोह-अवरोह का अभ्यास (D) सामूहिक पाठ<\/summary><p><b>उत्तर: (B)<\/b> (A), (C), (D) सस्वर वाचन के उद्देश्य हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: पोर्टफ़ोलियो मूल्यांकन क्या है? (A) एक दिन की परीक्षा (B) सीखने वाले के कार्यों का समय के साथ संकलन, जो मानकीकृत परीक्षण का विकल्प है (C) शिक्षक की रिपोर्ट (D) मौखिक परीक्षा<\/summary><p><b>उत्तर: (B)<\/b> NCF खंड 9.4, पृ. ३०।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: NCF के अनुसार पाठ्य-पुस्तक के बारे में सही कथन है: (A) एक पुस्तक सब कक्षाओं के लिए आदर्श है (B) कोई एक पुस्तक आदर्श नहीं, शिक्षक अतिरिक्त सामग्री भी बनाए (C) अनुवादित पुस्तकें श्रेष्ठ हैं (D) पुस्तक अनावश्यक है<\/summary><p><b>उत्तर: (B)<\/b> पृ. २३-२४, खंड 7.2।<\/p><\/details>\n\n<p class=\"src\">स्रोत: <a href=\"https://ncert.nic.in/pdf/focus-group/Indian_Languages.pdf\">NCF 2005, Position Paper: Teaching of Indian Languages (NCERT, 2006)<\/a>; पृष्ठ-क्रमांक पुस्तक के छपे अंकों के अनुसार (खंड 1.2 पृ. १; 1.3 पृ. १-२; 1.4 पृ. २; 1.5 पृ. ३; 1.9, 1.10, 1.11 पृ. ५-७; 2.1-2.4 पृ. ८-११; 4.5, 4.6 पृ. १९; 5.3 पृ. २१; 6.1-6.3 पृ. २२-२३; 7.1-7.8 पृ. २३-२६; 8.1-8.5 पृ. २६-२८; 9.1-9.4 पृ. २८-३०; सिफ़ारिशें पृ. ३०-३२)। सस्वर और मौन वाचन के भेद, आगमन-निगमन, गहन-द्रुत वाचन, लेखन के अंग (श्रुतलेख, अनुलेख आदि) और भाषा-विकारों के नाम स्कूली शिक्षण-शास्त्र की प्रचलित शब्दावली हैं, NCF के इस आधार-पत्र में नहीं। HTET 2024 Q31 और Q43 पाठ्यक्रम से।<\/p>\n","hin-var":"<p class=\"key\"><b>HTET में क्या पूछा गया:<\/b> 2021 से 2024 में 3 प्रश्न, और तीनों \"वर्ण का स
