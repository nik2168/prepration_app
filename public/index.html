पोथी&rsquo; मुख्य कर्म।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: निम्न में प्रेरणार्थक क्रिया का दूसरा रूप कौन-सा है? (A) गिरना (B) गिराना (C) गिरवाना (D) गिर पड़ना<\/summary><p><b>उत्तर: (C)<\/b> मूल गिरना, पहला रूप गिराना, दूसरा गिरवाना।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: &lsquo;रोटी खाई जाती है&rsquo; में वाच्य है: (A) कर्तृ (B) कर्म (C) भाव (D) संयुक्त<\/summary><p><b>उत्तर: (B)<\/b> उद्देश्य &lsquo;रोटी&rsquo; कर्म है; क्रिया &lsquo;खाई जाती है&rsquo; कर्म के लिंग के अनुसार।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: &lsquo;यहाँ बैठा नहीं जाता&rsquo; में वाच्य है: (A) कर्तृवाच्य (B) कर्मवाच्य (C) भाववाच्य (D) कोई नहीं<\/summary><p><b>उत्तर: (C)<\/b> अकर्मक क्रिया, न कर्ता उद्देश्य न कर्म, असमर्थता का भाव (गुरु का अपना उदाहरण)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: &lsquo;वह स्कूल जा चुका है&rsquo; में काल है: (A) सामान्य भूत (B) आसन्न भूत (C) संदिग्ध भूत (D) अपूर्ण भूत<\/summary><p><b>उत्तर: (B)<\/b> &lsquo;चुका है&rsquo; से काम अभी-अभी पूरा हुआ, &lsquo;है&rsquo; के साथ: आसन्न भूत (गुरु का पूर्ण वर्तमान)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: &lsquo;वह दौड़ता हुआ घर <b>के पास<\/b> पहुँचा&rsquo; में &lsquo;के पास&rsquo; है: (A) क्रियाविशेषण (B) संबंधसूचक (C) समुच्चयबोधक (D) विस्मयादिबोधक<\/summary><p><b>उत्तर: (B)<\/b> &lsquo;घर&rsquo; संज्ञा के साथ आकर उसका संबंध क्रिया &lsquo;पहुँचा&rsquo; से जोड़ता है (स्थानवाचक)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: &lsquo;वह थका था, <b>इसलिए<\/b> जल्दी सो गया&rsquo; में &lsquo;इसलिए&rsquo; है: (A) संयोजक (B) विभाजक (C) विरोधदर्शक (D) परिणामदर्शक<\/summary><p><b>उत्तर: (D)<\/b> पिछली बात (थकान) का फल बताता है: समानाधिकरण समुच्चयबोधक का परिणामदर्शक भेद।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: &lsquo;<b>यदि<\/b> वर्षा होगी <b>तो<\/b> फ़सल अच्छी होगी&rsquo; में &lsquo;यदि&mdash;तो&rsquo; है: (A) संकेतवाचक (B) उद्देशवाचक (C) कारणवाचक (D) स्वरूपवाचक<\/summary><p><b>उत्तर: (A)<\/b> व्यधिकरण समुच्चयबोधक का संकेतवाचक भेद; जोड़े से आता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: &lsquo;वह बोल उठा&rsquo; में &lsquo;उठा&rsquo; किस अर्थ का सहकारी है? (A) अचानकता (B) लाभ दूसरे को (C) उग्रता (D) धृष्टता<\/summary><p><b>उत्तर: (A)<\/b> गुरु: &lsquo;उठना&rsquo; से अचानकता; &lsquo;बैठना&rsquo; से धृष्टता; &lsquo;डालना&rsquo; से उग्रता।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: &lsquo;हाय! यह क्या हो गया!&rsquo; में &lsquo;हाय&rsquo; किस भाव का सूचक है? (A) हर्ष (B) शोक (C) तिरस्कार (D) स्वीकार<\/summary><p><b>उत्तर: (B)<\/b> &lsquo;हाय&rsquo; शोकबोधक विस्मयादिबोधक है (गुरु अंक २४९)।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामताप्रसाद गुरु, <i>हिंदी व्याकरण<\/i>: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१६२\">क्रिया, धातु (१६२–१६३)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१६४\">सकर्मक-अकर्मक, पूर्ति, द्विकर्मक (१६४–१६८)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१६९\">यौगिक धातु, प्रेरणार्थक (१६९–१७४)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१७५\">नामधातु, अनुकरण-धातु (१७५–१७६)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३१५\">वाच्य (३१५–३२०)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३२०\">काल, अर्थ (३२०–३२७)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३२८\">प्रयोग (३२८–३२९)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३७७\">संयुक्त क्रिया (३७६–३८८)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१७७\">क्रियाविशेषण (१७७–१९८)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१९९\">संबंधसूचक (१९९–२१३)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२१४\">समुच्चयबोधक (२१४–२३४)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२३४\">विस्मयादिबोधक (२३४–२३५)<\/a>। स्कूली वर्गीकरण (काल के 12 रूप, रंजक, निपात के प्रकार, वाच्य-परिवर्तन के चरण) पाठ्यपुस्तकों की परिपाटी है; गुरु में नहीं।<\/p>\n","hin-voc":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2020 से 2024 तक शब्द-ज्ञान से कुल 17 प्रश्न आए (हर साल 3 से 4), यानी यह हिंदी का सबसे अधिक पूछा जाने वाला विषय है। इनमें विलोम 5, पर्यायवाची 4, शब्द-प्रकृति (तत्सम/तद्भव/देशज/विदेशज) 3, अनेक शब्दों के लिए एक शब्द 2, श्रुतिसम-भिन्नार्थक 2 और वर्णानुक्रम 1 प्रश्न हैं। लगभग सभी प्रश्न \"असंगत / अनुचित / बेमेल जोड़ा चुनिए\" वाले हैं: चार विकल्पों में तीन सही होते हैं, एक ग़लत। इसलिए आपको हर शब्द का पक्का अर्थ आना चाहिए, केवल अंदाज़ा नहीं चलता।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> शब्द-ज्ञान (शब्द-भंडार, vocabulary) का अर्थ है शब्दों को उनके स्रोत, अर्थ और आपसी संबंध के साथ जानना। इसके पाँच बड़े भाग हैं: (1) शब्द किस भाषा से आया (तत्सम, तद्भव, देशज, विदेशज), (2) समान अर्थ वाले शब्द (पर्यायवाची), (3) उलटे अर्थ वाले शब्द (विलोम), (4) अनेक शब्दों की जगह एक शब्द, (5) सुनने में एक-से पर अर्थ में अलग शब्द (श्रुतिसम-भिन्नार्थक) और एक शब्द के दो अर्थ (अनेकार्थी)।<\/div>\n<p>कामताप्रसाद गुरु ने अपने <i>हिंदी व्याकरण<\/i> में शब्दों को उनकी उत्पत्ति के आधार पर बाँटा है। वे लिखते हैं कि फ़ारसी, अरबी, तुर्की, अँगरेज़ी आदि विदेशी भाषाओं के शब्दों को (जिनकी संख्या बहुत थोड़ी, केवल दशमांश है) छोड़कर हिंदी के अन्य शब्द मुख्य तीन प्रकार के हैं: तत्सम, तद्भव और अर्द्ध-तत्सम (पृ. ५०)। इसके अलावा देशज, अनुकरणवाचक और विदेशी शब्द अलग हैं (पृ. ५२)। गुरु पर्यायवाची, विलोम या मुहावरों को व्याकरण का विषय नहीं मानते (पृ. ६, ३०), इसलिए इन भागों की सामग्री पिछले HTET प्रश्नों और मानक कोश-प्रयोग पर आधारित है।<\/p>\n<p><b>रोज़ की मिसाल:<\/b> शब्द एक परिवार की तरह हैं। 'आग' और 'अग्नि' एक ही सदस्य के दो रूप हैं (तद्भव और तत्सम)। 'अग्नि, पावक, अनल' जुड़वाँ भाई हैं (पर्याय)। पर हर शब्द का विलोम नहीं होता: 'अग्नि' का कोई सर्वमान्य विलोम नहीं। परीक्षा में यही परिवार-संबंध पूछे जाते हैं।<\/p>\n\n<h2>1. शब्द-प्रकृति: उत्पत्ति के आधार पर शब्द<\/h2>\n<div class=\"cards\">\n<div><h3>तत्सम<\/h3><p>तत् + सम = उसके समान। संस्कृत के वे शब्द जो हिंदी में अपने असली रूप में चलते हैं।<\/p><\/div>\n<div><h3>तद्भव<\/h3><p>तत् + भव = उससे बना। प्राकृत से, या प्राकृत के रास्ते संस्कृत से आकर बदला हुआ रूप।<\/p><\/div>\n<div><h3>अर्द्ध-तत्सम<\/h3><p>संस्कृत शब्द जो बिगड़ते-बिगड़ते आधे बदले रूप में बचे हैं (गुरु का वर्ग)।<\/p><\/div>\n<div><h3>देशज<\/h3><p>जिनका संस्कृत या प्राकृत मूल पता नहीं चलता; देश की बोलियों से आए।<\/p><\/div>\n<div><h3>अनुकरणवाचक<\/h3><p>ध्वनि की नक़ल से बने: खटखटाना, धड़ाम, चट।<\/p><\/div>\n<div><h3>विदेशज<\/h3><p>फ़ारसी, अरबी, तुर्की, अँगरेज़ी, पुर्तगाली आदि से आए।<\/p><\/div>\n<\/div>\n\n<h3>तत्सम शब्द<\/h3>\n<p>गुरु की परिभाषा (पृ. ५०): \"तत्सम वे संस्कृत शब्द हैं जो अपने असली स्वरूप में हिंदी भाषा में प्रचलित हैं\", जैसे राजा, पिता, कवि, आज्ञा, अग्नि, वायु, वत्स, भ्राता।<\/p>\n<p><b>पहचान:<\/b> तत्सम शब्दों में प्रायः संयुक्त अक्षर और संस्कृत की ध्वनियाँ मिलती हैं: ऋ (ऋषि, कृषि), ष (दोष, भाषा), क्ष और ज्ञ (क्षमा, ज्ञान), विसर्ग (प्रातः, दुःख), श्र और त्र (श्रम, पुत्र), र्य और ् वाले रूप (कार्य, सूर्य)। इनका उच्चारण बोलचाल की तुलना में कठिन होता है। कुछ और तत्सम शब्द: गोस्वामी, भिक्षुक, मस्तक, रज्जु, लोमशा, प्रस्तर, दुग्ध, हस्त, कर्ण, पुष्प, नेत्र, अश्रु, स्वर्ण।<\/p>\n\n<h3>तद्भव शब्द<\/h3>\n<p>गुरु (पृ. ५०): \"तद्भव वे शब्द हैं जो या तो सीधे प्राकृत से हिंदी में आ गए हैं या प्राकृत के द्वारा संस्कृत से निकले हैं\", जैसे राय, खेत, दाहिना, किसान। गुरु यह भी लिखते हैं (पृ. ५१) कि हिंदी की क्रियाएँ प्रायः सब की सब तद्भव हैं, और यही हाल सर्वनामों का है (मैं, तू, वह, कौन)।<\/p>\n<p><b>पहचान:<\/b> तद्भव सरल, बोलचाल के शब्द होते हैं; संयुक्ताक्षर घिसकर कम हो जाते हैं (हस्त → हाथ, कर्म → काम, सर्प → साँप, अक्षि → आँख)। ध्वनि बदलने के कुछ बार-बार दिखने वाले नियम: ष, श → स या ख (शिक्षा → सीख, षष्ठ → छठा), क्ष → ख या छ (क्षेत्र → खेत, क्षमा → छिमा), य → ज (यश → जस, यम → जम), व → ब (वधू → बहू, वंश → बाँस), संयुक्त व्यंजन में एक घटकर पहले का स्वर दीर्घ (दुग्ध → दूध, हस्त → हाथ, सप्त → सात)।<\/p>\n\n<h3>अर्द्ध-तत्सम<\/h3>\n<p>गुरु (पृ. ५१): \"अर्द्ध-तत्सम उन संस्कृत शब्दों को कहते हैं जो प्राकृत भाषा बोलने वालों के उच्चारण से बिगड़ते-बिगड़ते कुछ और ही रूप के हो गए हैं\", जैसे बच्छ, अग्यां, मुँह, बंस। यह वर्ग स्कूली पुस्तकों में कम आता है, पर गुरु का तीन-स्तर वाला क्रम समझ लें: तत्सम (अग्नि) → अर्द्ध-तत्सम (अगिन) → तद्भव (आग)।<\/p>\n<p>गुरु की तालिका (पृ. ५१, ५२):<\/p>\n<table><tr><th>तत्सम<\/th><th>अर्द्ध-तत्सम<\/th><th>तद्भव<\/th><\/tr>\n<tr><td>आज्ञा<\/td><td>अग्यां<\/td><td>आन<\/td><\/tr>\n<tr><td>वत्स<\/td><td>बच्छ<\/td><td>बच्चा<\/td><\/tr>\n<tr><td>अग्नि<\/td><td>अगिन<\/td><td>आग<\/td><\/tr>\n<tr><td>कार्य<\/td><td>कारज<\/td><td>काज<\/td><\/tr>\n<tr><td>अक्षर<\/td><td>अच्छर<\/td><td>अक्खर, आखर<\/td><\/tr>\n<tr><td>राजा, स्वामी, कर्ण<\/td><td>-<\/td><td>राय, साईं, कान<\/td><\/tr>\n<tr><td>पक्ष, वायु, सर्व<\/td><td>-<\/td><td>पंख या पाख, बयार, सब<\/td><\/tr><\/table>\n<div class=\"trap\"><b>गुरु का रोचक अवलोकन (पृ. ५१):<\/b> तत्सम और तद्भव में रूप के साथ बहुधा अर्थ का भी भेद होता है। तत्सम शब्द प्रायः सामान्य अर्थ में आता है और तद्भव विशेष अर्थ में, जैसे \"स्थान\" सामान्य नाम है पर \"थाना\" एक विशेष स्थान। कभी तत्सम से बड़प्पन झलकता है और तद्भव से छोटापन, जैसे \"देखना\" साधारण लोगों के लिए पर \"दर्शन\" बड़े आदमी या देवता के लिए। कभी तत्सम के दो अर्थों में तद्भव केवल एक बताता है: \"वंश\" का अर्थ कुटुंब भी है और बाँस भी, पर तद्भव \"बाँस\" केवल एक अर्थ देता है।<\/div>\n\n<h3>तत्सम और तद्भव की बड़ी जोड़ी-सूची<\/h3>\n<p>इन्हें समूहों में याद करें। हर पंक्ति में पहला शब्द तत्सम, दूसरा तद्भव है।<\/p>\n<div class=\"cards\">\n<div><h3>शरीर के अंग<\/h3><p>अक्षि–आँख, कर्ण–कान, हस्त–हाथ, मुख–मुँह, नासिका–नाक, दंत–दाँत, जिह्वा–जीभ, पृष्ठ–पीठ, मस्तक–माथा, अंगुली–उँगली, स्तन–थन, अश्रु–आँसू, श्वास–साँस, चर्म–चमड़ा, कक्ष–काँख<\/p><\/div>\n<div><h3>प्राणी<\/h3><p>सर्प–साँप, मयूर–मोर, उलूक–उल्लू, काक–कौआ, मक्षिका–मक्खी, गर्दभ–गधा, घोटक–घोड़ा, उष्ट्र–ऊँट, हस्ती–हाथी, लोमशा–लोमड़ी, कपोत–कबूतर<\/p><\/div>\n<div><h3>घर, खेती, वस्तुएँ<\/h3><p>गृह–घर, ग्राम–गाँव, क्षेत्र–खेत, कर्म–काम, कार्य–काज, चक्र–चाक, दीपक–दीया, रज्जु–रस्सी, प्रस्तर–पत्थर, स्वर्ण–सोना, रजत–चाँदी (रूपा), लौह–लोहा, तैल–तेल, घृत–घी, दुग्ध–दूध, दधि–दही, अग्नि–आग, तृण–तिनका, अट्टालिका–अटारी, पर्यंक–पलंग<\/p><\/div>\n<div><h3>संबंध<\/h3><p>पुत्र–पूत या बेटा, भ्राता–भाई, भगिनी–बहन, वधू–बहू, श्वसुर–ससुर, श्वश्रू–सास, स्वामी–साईं, वत्स–बच्चा, ज्येष्ठ–जेठ<\/p><\/div>\n<div><h3>प्रकृति और संख्या<\/h3><p>सूर्य–सूरज, चंद्र–चाँद, रात्रि–रात, विद्युत–बिजली, वायु–बयार या हवा, अंधकार–अँधेरा, ज्योत्स्ना–चाँदनी, सप्त–सात, अष्ट–आठ, नव–नौ, द्वितीय–दूसरा, चतुर्थ–चौथा, लक्ष–लाख, पक्ष–पंख या पाख<\/p><\/div>\n<div><h3>भाव और अन्य<\/h3><p>आश्चर्य–अचरज, धैर्य–धीरज, नृत्य–नाच, हास्य–हँसी, शिक्षा–सीख, भिक्षा–भीख, स्वप्न–सपना, तीक्ष्ण–तीखा, उच्च–ऊँचा, बधिर–बहरा, मूल्य–मोल, फाल्गुन–फागुन, यश–जस, आम्र–आम, इक्षु–ईख, कर्पूर–कपूर, कुम्भकार–कुम्हार, सर्व–सब<\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>जाल:<\/b> 2022 Q45 में पाषाण–पत्थर को \"असंगत\" माना गया। कारण: 'पत्थर' का तत्सम रूप प्रस्तर है (प्रस्तर → पत्थर), पाषाण का तद्भव 'पाहन' है। इसी तरह मस्तक–माथा सही जोड़ा है, पर 2023 Q33 में \"मस्तक – तद्भव शब्द\" असंगत था: मस्तक स्वयं तत्सम है, तद्भव उसका 'माथा' है।<\/div>\n\n<h3>देशज शब्द<\/h3>\n<p>गुरु (पृ. ५२): \"देशज वे शब्द हैं जो किसी संस्कृत (या प्राकृत) मूल से निकले हुए नहीं जान पड़ते और जिनकी व्युत्पत्ति का पता नहीं लगता\", जैसे तेंदुआ, खिड़की, घूआ, ठेस। वे यह भी कहते हैं कि ऐसे शब्द बहुत थोड़े हैं और आगे शोध से इनकी संख्या और कम हो सकती है। इसलिए देशज की कोई एक पक्की सूची नहीं है। स्कूली पुस्तकों में प्रायः इन्हें देशज गिना जाता है: तेंदुआ, खिड़की, ठेस, झाड़ू, लोटा, कटोरा, चिमटा, थैला, ठेला, डिबिया, पगड़ी, टाँग, झोला, कचरा, भोंपू, गड़बड़, खटपट, फुनगी, कुल्हड़, खुरपी। HTET 2023 Q33 में 'खिचड़ी' को देशज माना गया है, इसलिए परीक्षा में इसे देशज ही मानें।<\/p>\n<h3>अनुकरणवाचक शब्द<\/h3>\n<p>गुरु (पृ. ५२): पदार्थ की यथार्थ या कल्पित ध्वनि को ध्यान में रखकर जो शब्द बनाए गए हैं, जैसे खटखटाना, धड़ाम, चट। और: सनसन, टपटप, छनछन, भिनभिनाना, कलकल, सरसराहट, चहचहाना, गड़गड़ाहट।<\/p>\n\n<h3>विदेशज (विदेशी) शब्द<\/h3>\n<p>गुरु (पृ. ५२, ५३): फ़ारसी, अरबी, तुर्की, अँगरेज़ी आदि भाषाओं से जो शब्द हिंदी में आए हैं, वे विदेशी कहलाते हैं। अँगरेज़ी से आज भी शब्दों की भरती जारी है। गुरु की सूची (पृ. ५३):<\/p>\n<table><tr><th>भाषा<\/th><th>गुरु के उदाहरण<\/th><th>और उदाहरण<\/th><\/tr>\n<tr><td>फ़ारसी<\/td><td>आदमी, उम्मेदवार, कमर, ख़र्च, गुलाब, चश्मा, चाकू, चापलूस, दाग़, दुकान, बाग़, मोज़ा<\/td><td>बाज़ार, ज़मीन, सरकार, दरवाज़ा, शादी, सब्ज़ी, आराम, आवाज़, कारीगर<\/td><\/tr>\n<tr><td>अरबी<\/td><td>अदालत, इम्तिहान, ऐतराज़, औरत, तनख़ाह, तारीख़, मुक़द्दमा, सिफ़ारिश, हाल<\/td><td>किताब, क़ानून, ख़बर, जवाब, दुनिया, वकील, इनाम, मौसम, मालिक, ग़रीब, हिसाब<\/td><\/tr>\n<tr><td>तुर्की<\/td><td>कोतल, चकमक, तग़मा, तोप, लाश<\/td><td>कैंची, कुली, बेगम, बहादुर<\/td><\/tr>\n<tr><td>पुर्तगाली<\/td><td>कमरा, नीलाम, पादरी, मारतौल, पेरू<\/td><td>अलमारी, कमीज़, गोदाम, चाबी, तौलिया, बाल्टी, साबुन<\/td><\/tr>\n<tr><td>अँगरेज़ी<\/td><td>अपील, इंच, कलक्टर, कमेटी, कोट, गिलास, टिकट, टीन, नोटिस, डाक्टर, डिगरी, पतलून, फंड, फ़ीस, फुट, मील, रेल, लाट, लालटैन, समन, स्कूल<\/td><td>स्टेशन, पुलिस, बैंक, कॉलेज, रेडियो, पेन, बस, कंप्यूटर<\/td><\/tr>\n<tr><td>मराठी, बँगला<\/td><td>मराठी: प्रगति, लागू, चालू, बाड़ा, बाजू; बँगला: उपन्यास, गल्प, नितांत, भद्रलोग<\/td><td>-<\/td><\/tr><\/table>\n<p><b>संकर शब्द<\/b> (hybrid): वे शब्द जिनके दो भाग अलग-अलग भाषाओं के हों। यह नाम स्कूली पुस्तकों का है (गुरु की सूची में अलग वर्ग नहीं)। उदाहरण: तहसीलदार (तहसील = अरबी + दार = फ़ारसी), रेलगाड़ी (रेल = अँगरेज़ी + गाड़ी = हिंदी), डबलरोटी (डबल = अँगरेज़ी + रोटी = हिंदी), सीलबंद (सील = अँगरेज़ी + बंद = फ़ारसी), लाठीचार्ज (लाठी = हिंदी + चार्ज = अँगरेज़ी)। HTET 2021 Q38 में \"तहसीलदार – संकर शब्द\" सही जोड़ा था।<\/p>\n<div class=\"trap\"><b>जाल:<\/b> मुक़द्दमा देशज नहीं है, अरबी (विदेशी) है; गुरु ने स्वयं इसे अरबी की सूची में रखा है (पृ. ५३)। 'पंख' तद्भव है (पक्ष का), 'गोस्वामी' और 'भिक्षुक' तत्सम हैं, 'अमानत' अरबी मूल का विदेशज शब्द है।<\/div>\n\n<h2>2. पर्यायवाची शब्द<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिन शब्दों के अर्थ समान या बहुत पास-पास हों, वे पर्यायवाची (समानार्थी) कहलाते हैं। पर्यायवाची में भी बारीक भेद होते हैं (जैसे 'नदी' तटिनी तक) पर परीक्षा में इन्हें समान मानकर पूछा जाता है।<\/div>\n<p>HTET की चाल: चार विकल्पों में हर एक में किसी वस्तु के तीन पर्याय दिए जाते हैं। एक विकल्प में उसी वर्ग का कोई ग़लत शब्द घुसा दिया जाता है (गरुड़ के साथ काक, बकरी के साथ वर्धकी)। इसलिए हर शब्द के 4 से 6 पर्याय याद रखें और परिचित शब्द पहले छाँटें।<\/p>\n<div class=\"cards\">\n<div><h3>प्रकृति<\/h3><p>आकाश: गगन, नभ, अंबर, व्योम, अंतरिक्ष, आसमान<br>सूर्य: रवि, भानु, दिनकर, दिवाकर, भास्कर, प्रभाकर, आदित्य, मार्तंड<br>चंद्रमा: शशि, इंदु, सोम, शशांक, हिमांशु, निशाकर, मयंक, विधु, हिमकर, अमृतांशु, महताब<br>पृथ्वी: धरा, धरती, भूमि, वसुधा, अवनि, धरणी, मही, वसुंधरा<br>पवन: वायु, हवा, समीर, अनिल, मारुत<br>अग्नि: आग, अनल, पावक, वह्नि, कृशानु, दहन<\/p><\/div>\n<div><h3>जल, नदी, समुद्र<\/h3><p>जल: पानी, नीर, वारि, तोय, सलिल, अंबु, पय<br>नदी: सरिता, तटिनी, तरंगिणी, निम्नगा, आपगा, सरि<br>गंगा: सुरसरि, भागीरथी, जाह्नवी, मंदाकिनी, त्रिपथगा, अमरतटिनी<br>समुद्र: सागर, जलधि, उदधि, रत्नाकर, पारावार, सिंधु, अर्णव, वारिधि<br>तालाब: सरोवर, सर, तड़ाग, जलाशय, पुष्कर<br>बादल: मेघ, घन, जलद, वारिद, अंबुद, पयोद, जलधर, नीरद<\/p><\/div>\n<div><h3>दिन-रात, पर्वत, वन<\/h3><p>दिन: दिवस, वासर, दिवा, अह<br>रात: रात्रि, निशा, रजनी, यामिनी, शर्वरी, विभावरी, क्षपा<br>पर्वत: पहाड़, गिरि, अचल, शैल, भूधर, नग, अद्रि<br>वन: जंगल, अरण्य, कानन, विपिन, अटवी<br>वृक्ष: पेड़, तरु, पादप, विटप, द्रुम, शाखी<br>पुष्प: फूल, कुसुम, सुमन, प्रसून, पुहुप<br>कमल: पंकज, जलज, नीरज, सरोज, अरविंद, पद्म, राजीव, नलिन<br>बिजली: विद्युत, चपला, तड़ित, दामिनी, सौदामिनी<\/p><\/div>\n<div><h3>पशु-पक्षी<\/h3><p>हाथी: गज, हस्ती, कुंजर, मतंग, द्विप, करी<br>घोड़ा: अश्व, हय, तुरंग, घोटक, वाजी, सैंधव<br>शेर: सिंह, केसरी, मृगराज, वनराज, शार्दूल<br>गधा: गर्दभ, लंबकर्ण, वैशाखनंदन, रासभ<br>बकरी: अजा, छागी, छेरी<br>साँप: सर्प, भुजंग, उरग, विषधर, अहि, नाग, व्याल<br>मेंढक: दादुर, भेक, मंडूक, शालूर<br>कोयल: कोकिला, पिक, कलकंठी, परभृता, वसंतदूत<br>भौंरा: भ्रमर, मधुकर, अलि, मधुप, षट्पद, द्विरेफ<br>गरुड़: वैनतेय, सुपर्ण, गरुत्मान, खगराज<br>मछली: मीन, मत्स्य, झष, शफरी<br>पक्षी: खग, विहग, पंछी, द्विज, अंडज<\/p><\/div>\n<div><h3>मनुष्य और संबंध<\/h3><p>मनुष्य: मानव, नर, मनुज, आदमी<br>स्त्री: नारी, महिला, औरत, अबला, वनिता, ललना, कामिनी<br>पुत्र: बेटा, सुत, तनय, आत्मज, नंदन, सुअन<br>पति: स्वामी, भर्ता, कांत, प्राणेश, वल्लभ<br>पत्नी: भार्या, अर्द्धांगिनी, दारा, वामा, गृहिणी<br>मित्र: दोस्त, सखा, साथी, सहचर, मीत<br>शत्रु: दुश्मन, अरि, रिपु, बैरी, अमित्र<br>राजा: नृप, भूप, नरेश, नृपति, भूपति, महीप<br>ग्वाला: गोप, आभीर, अहीर, ग्वाल<\/p><\/div>\n<div><h3>शरीर, घर, धन<\/h3><p>आँख: नेत्र, नयन, चक्षु, लोचन, अक्षि, दृग<br>हाथ: कर, हस्त, पाणि, भुजा<br>शरीर: तन, देह, काया, वपु, गात<br>घर: गृह, भवन, आलय, निकेतन, सदन, आवास, धाम<br>नाव: नौका, तरणी, तरी, डोंगी<br>तलवार: असि, खड्ग, कृपाण, शमशीर<br>सोना: कनक, स्वर्ण, हेम, कंचन, सुवर्ण, हिरण्य<br>धन: द्रव्य, वित्त, संपत्ति, दौलत<br>चंदन: मलयज, श्रीखंड, सर्पावास, गोरोचन (HTET 2023 में सही माना)<\/p><\/div>\n<div><h3>देवी-देवता<\/h3><p>शिव: शंकर, महेश, शंभु, त्रिलोचन, नीलकंठ, चंद्रशेखर<br>विष्णु: हरि, नारायण, माधव, केशव, चक्रधर<br>कृष्ण: श्याम, गोपाल, मुरारी, मोहन, गिरिधर<br>गणेश: गजानन, लंबोदर, विनायक, एकदंत<br>लक्ष्मी: कमला, पद्मा, रमा, श्री, इंदिरा<br>सरस्वती: शारदा, वाणी, भारती, गिरा, वीणापाणि<br>अमृत: सुधा, पीयूष, अमिय<br>असुर: दानव, दैत्य, राक्षस, दनुज, निशाचर<\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>ध्यान दें:<\/b> 'वर्धकी' का अर्थ बढ़ई है, बकरी नहीं (2020 Q35)। 'काक' कौआ है और 'वृषभी, भद्रा' गरुड़ के नाम नहीं (2022 Q31, 2023 Q38)। 'गणिका' के पर्याय सर्ववल्लभा, वारांगना, पतुरिया HTET 2022 में सही माने गए। गंगा के पर्याय में 'अद्रिजा' भी HTET 2023 की कुंजी में सही माना गया है, जबकि सामान्य कोशों में 'अद्रिजा' मुख्यतः पार्वती है। परीक्षा में कुंजी के अनुसार चलें।<\/div>\n\n<h2>3. विलोम शब्द<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिन शब्दों के अर्थ एक-दूसरे के उलटे हों, वे विलोम (विपरीतार्थक) शब्द कहलाते हैं: दिन–रात, सुख–दुःख।<\/div>\n<h3>विलोम बनाने के तरीक़े<\/h3>\n<p>अधिकांश विलोम शब्द के आगे उपसर्ग जोड़कर बनते हैं। गुरु के <i>हिंदी व्याकरण<\/i> में उपसर्गों के अर्थ दिए हैं (पृ. ३९९ से ४०६): अ/अन् = अभाव, निषेध; वि = अभाव, भिन्न; निर्/निस् = निषेध; अप = विरुद्ध, अभाव; प्रति = विरुद्ध; दुर् = बुरा, कठिन; सु = अच्छा; उर्दू के उपसर्ग ना, बे, ला, बद, गैर, बिला भी निषेध या बुरे अर्थ में आते हैं। इसी से विलोम के छह तरीक़े निकलते हैं:<\/p>\n<table><tr><th>तरीक़ा<\/th><th>उदाहरण<\/th><th>जोड़ा गया भाग<\/th><\/tr>\n<tr><td>अ / अन् जोड़कर<\/td><td>ज्ञान–अज्ञान, धर्म–अधर्म, आदर–अनादर, अभिज्ञ–अनभिज्ञ, आदि–अनादि<\/td><td>अभाव, निषेध<\/td><\/tr>\n<tr><td>वि / निर् / निस्<\/td><td>सफल–विफल, राग–विराग, मुख–विमुख, गुण–निर्गुण, दोष–निर्दोष, कलंकित–निष्कलंक<\/td><td>अभाव या उलटा<\/td><\/tr>\n<tr><td>सु और दुर्/दुः<\/td><td>सुगम–दुर्गम, सज्जन–दुर्जन, सुलभ–दुर्लभ, सदाशय–दुराशय, सुकर्म–दुष्कर्म<\/td><td>अच्छा बनाम बुरा<\/td><\/tr>\n<tr><td>सम् बनाम वि<\/td><td>संयोग–वियोग, संधि–विग्रह, संतोष–असंतोष<\/td><td>मेल बनाम बिखराव<\/td><\/tr>\n<tr><td>उर्दू उपसर्ग<\/td><td>ईमानदार–बेईमान, क़ानूनी–ग़ैरक़ानूनी, पसंद–नापसंद, लायक–नालायक, रहम–बेरहम<\/td><td>बे, ग़ैर, ना, ला<\/td><\/tr>\n<tr><td>बिलकुल अलग शब्द<\/td><td>अमृत–विष, दिन–रात, अमर–मर्त्य, जंगम–स्थावर, नूतन–पुरातन, विधि–निषेध, खल–सज्जन<\/td><td>कोई उपसर्ग नहीं, पूरा शब्द बदल जाता है<\/td><\/tr><\/table>\n<p><b>ध्यान रहे:<\/b> गुरु के अनुसार 'परा' का अर्थ 'पीछे, उलटा' है (जय–पराजय) और 'आ' का एक अर्थ 'उलटा' भी (पृ. ४००)। फिर भी उपसर्ग हटाने या लगाने से हर विलोम नहीं बनता: 'आह्वान' का उलटा 'अनाह्वान' नहीं बल्कि विसर्जन है।<\/p>\n<h3>विलोम की बड़ी सूची<\/h3>\n<div class=\"cards\">\n<div><h3>गुण और भाव<\/h3><p>आशा–निराशा, उत्साह–निरुत्साह, आदर–अनादर, सत्कार–तिरस्कार, प्रशंसा–निंदा, मान–अपमान, कुत्सा–प्रशंसा, आस्तिक–नास्तिक, कृतज्ञ–कृतघ्न, गुण–दोष, अनुराग–विराग, मैत्री–वैर (शत्रुता), प्रीति–घृणा, हर्ष–विषाद, लाभ–हानि, सुख–दुःख, स्वतंत्र–परतंत्र, स्वाधीन–पराधीन<\/p><\/div>\n<div><h3>दशा और क्रिया<\/h3><p>उत्थान–पतन, उन्नति–अवनति, उदय–अस्त, आरंभ–अंत, आगमन–प्रस्थान, आय–व्यय, उपकार–अपकार, ऋण–उऋण, जय–पराजय, जन्म–मृत्यु, संयोग–वियोग, स्वीकार–अस्वीकार, आकर्षण–विकर्षण, आकृष्ट–विकृष्ट, सृजन–संहार, विधि–निषेध<\/p><\/div>\n<div><h3>विशेषण<\/h3><p>उचित–अनुचित, सरल–कठिन, गुरु–लघु, स्थूल–सूक्ष्म, कोमल–कठोर, तीव्र–मंद, सजीव–निर्जीव, सभ्य–असभ्य, सफल–विफल, ऐहिक–पारलौकिक, नूतन–पुरातन, मौलिक–कृत्रिम, कल्पना–यथार्थ, उपत्यका–अधित्यका, उन्मुख–विमुख, जंगम–स्थावर, लंबा–नाटा, प्रकट–गुप्त, आर्द्र–शुष्क<\/p><\/div>\n<div><h3>संज्ञा और दूसरे<\/h3><p>अमृत–विष, अंधकार–प्रकाश, देव–दानव, स्वर्ग–नरक, शीत–उष्ण, पुण्य–पाप, सत्य–असत्य, सज्जन–दुर्जन, खल–सज्जन, वीर–कायर, धनी–निर्धन, अपना–पराया, मित्र–शत्रु, विवाद–संवाद, गृहस्थ–संन्यासी, अर्थ–अनर्थ, शांति–अशांति<\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>जाल:<\/b> वैर का विलोम मैत्री या प्रेम है, क्रोध नहीं (क्रोध का विलोम क्षमा या शांति)। उन्मुख का विलोम विमुख है, अभिमुख नहीं (अभिमुख तो उसका समानार्थी जैसा है)। दनुज और दानव पर्याय हैं, विलोम नहीं। HTET 2020 में 'अनुरक्ति–विराग' असंगत माना गया; ठीक जोड़ा अनुरक्ति–विरक्ति या अनुराग–विराग है।<\/div>\n\n<h2>4. अनेक शब्दों के लिए एक शब्द<\/h2>\n<p>वाक्यांश का पूरा भाव एक शब्द में कहना। तरीक़ा: वाक्यांश में आए मुख्य शब्द के उपसर्ग या अर्थ से अनुमान लगाएँ और चारों विकल्पों में अर्थ मिलाएँ। HTET में जाल प्रायः यह होता है कि एक शब्द का दूसरा अर्थ दे दिया जाता है (आयास = प्रयास, अनायास = बिना प्रयास)।<\/p>\n<table><tr><th>वाक्यांश<\/th><th>एक शब्द<\/th><th>जाल या नोट<\/th><\/tr>\n<tr><td>किसी कथा के भीतर दूसरी कथा<\/td><td>अन्तर्कथा<\/td><td>-<\/td><\/tr>\n<tr><td>सर्वाधिकार-संपन्न शासक<\/td><td>अधिनायक<\/td><td>-<\/td><\/tr>\n<tr><td>बिना प्रयास के<\/td><td>अनायास<\/td><td>आयास = प्रयास<\/td><\/tr>\n<tr><td>जिसे शाप दिया गया हो<\/td><td>अभिशप्त<\/td><td>-<\/td><\/tr>\n<tr><td>जो क़ानून से उचित न हो<\/td><td>अवैध<\/td><td>-<\/td><\/tr>\n<tr><td>जिसमें छिद्र न हो<\/td><td>नीरन्ध्र<\/td><td>-<\/td><\/tr>\n<tr><td>समुद्र में लगने वाली आग<\/td><td>बड़वानल<\/td><td>दावानल = वन की आग<\/td><\/tr>\n<tr><td>जो भोजन रोगी के लिए उचित हो<\/td><td>पथ्य<\/td><td>अपथ्य = अनुचित<\/td><\/tr>\n<tr><td>जिसका कोई शत्रु न जन्मा हो<\/td><td>अजातशत्रु<\/td><td>-<\/td><\/tr>\n<tr><td>जो पहले कभी न हुआ हो<\/td><td>अभूतपूर्व<\/td><td>-<\/td><\/tr>\n<tr><td>जो दिखाई न दे<\/td><td>अदृश्य<\/td><td>-<\/td><\/tr>\n<tr><td>जो सुनाई न दे<\/td><td>अश्रव्य<\/td><td>-<\/td><\/tr>\n<tr><td>जिसे जीता न जा सके<\/td><td>अजेय<\/td><td>-<\/td><\/tr>\n<tr><td>जिसकी कोई उपमा न हो<\/td><td>अनुपम<\/td><td>-<\/td><\/tr>\n<tr><td>जिसका आदि न हो<\/td><td>अनादि<\/td><td>जिसका अंत न हो = अनंत<\/td><\/tr>\n<tr><td>जो इंद्रियों से परे हो<\/td><td>अतींद्रिय<\/td><td>-<\/td><\/tr>\n<tr><td>जो सब कुछ जानता हो<\/td><td>सर्वज्ञ<\/td><td>-<\/td><\/tr>\n<tr><td>जो सब जगह व्याप्त हो<\/td><td>सर्वव्यापी<\/td><td>-<\/td><\/tr>\n<tr><td>जो सबके लिए हितकर हो<\/td><td>सर्वहितकारी<\/td><td>-<\/td><\/tr>\n<tr><td>जो ईश्वर को न माने<\/td><td>नास्तिक<\/td><td>ईश्वर को मानने वाला = आस्तिक<\/td><\/tr>\n<tr><td>जो उपकार को माने<\/td><td>कृतज्ञ<\/td><td>उपकार न माने = कृतघ्न<\/td><\/tr>\n<tr><td>जो दूसरों पर उपकार करे<\/td><td>परोपकारी<\/td><td>-<\/td><\/tr>\n<tr><td>जो अपने देश से प्रेम करे<\/td><td>देशभक्त<\/td><td>-<\/td><\/tr>\n<tr><td>जो मांस न खाए<\/td><td>शाकाहारी<\/td><td>मांस खाने वाला = मांसाहारी<\/td><\/tr>\n<tr><td>जो सब कुछ खाए<\/td><td>सर्वभक्षी<\/td><td>-<\/td><\/tr>\n<tr><td>जो क्षमा न किया जा सके<\/td><td>अक्षम्य<\/td><td>-<\/td><\/tr>\n<tr><td>जो कभी नष्ट न हो<\/td><td>अविनाशी या अनश्वर<\/td><td>-<\/td><\/tr>\n<tr><td>जो पढ़ा-लिखा न हो<\/td><td>निरक्षर<\/td><td>-<\/td><\/tr>\n<tr><td>जिसके पास कुछ न हो<\/td><td>निर्धन या अकिंचन<\/td><td>-<\/td><\/tr>\n<tr><td>जिसे किसी बात का डर न हो<\/td><td>निडर या निर्भय<\/td><td>-<\/td><\/tr>\n<tr><td>जो बहुत बोलता हो<\/td><td>वाचाल<\/td><td>-<\/td><\/tr>\n<tr><td>जो कम बोलता हो<\/td><td>मितभाषी<\/td><td>-<\/td><\/tr>\n<tr><td>जिसकी पत्नी मर गई हो<\/td><td>विधुर<\/td><td>पति मर गया हो = विधवा<\/td><\/tr>\n<tr><td>जिसका पति परदेश गया हो<\/td><td>प्रोषितपतिका<\/td><td>-<\/td><\/tr>\n<tr><td>जो अपने ऊपर निर्भर हो<\/td><td>आत्मनिर्भर<\/td><td>-<\/td><\/tr>\n<tr><td>जो रात में विचरण करे<\/td><td>निशाचर<\/td><td>-<\/td><\/tr>\n<tr><td>जिसने भलीभाँति पढ़ा हो<\/td><td>सुशिक्षित<\/td><td>-<\/td><\/tr>\n<tr><td>किसी विषय का विशेष जानकार<\/td><td>विशेषज्ञ<\/td><td>-<\/td><\/tr>\n<tr><td>जो पूर्व से परिचित हो<\/td><td>पूर्वपरिचित<\/td><td>-<\/td><\/tr>\n<tr><td>जिसके हाथ में चक्र हो<\/td><td>चक्रपाणि<\/td><td>-<\/td><\/tr>\n<tr><td>वन में लगने वाली आग<\/td><td>दावानल<\/td><td>बड़वानल = समुद्र की<\/td><\/tr>\n<tr><td>पेट की आग<\/td><td>जठराग्नि<\/td><td>-<\/td><\/tr><\/table>\n\n<h2>5. श्रुतिसम (समश्रुत) भिन्नार्थक शब्द<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> श्रुति = सुनना, सम = समान। जो शब्द सुनने में लगभग एक-से लगें पर अर्थ अलग हों, वे श्रुतिसम (समश्रुत) भिन्नार्थक शब्द कहलाते हैं। ये अधिकतर वर्तनी के छोटे भेद (ि/ी, ृ/र, श/स, न/ण) से बनते हैं। ग़लत वर्तनी से अर्थ ही बदल जाता है, इसलिए इन्हें वाक्य में पढ़कर याद करें।<\/div>\n<h3>HTET में आए जोड़े<\/h3>\n<table><tr><th>शब्द-जोड़ा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>सदेह / सन्देह<\/td><td>देह सहित / संशय<\/td><td>संत सदेह स्वर्ग गए; मुझे उसकी बात पर संदेह है।<\/td><\/tr>\n<tr><td>सुअन / सुमन<\/td><td>पुत्र / फूल<\/td><td>दशरथ के सुअन राम थे; बाग़ में सुमन खिले।<\/td><\/tr>\n<tr><td>सुकृति / सुकृती<\/td><td>सत्कर्म / पुण्यवान<\/td><td>यह उसकी सुकृति है; वह सुकृती पुरुष है।<\/td><\/tr>\n<tr><td>स्वजन / श्वजन<\/td><td>अपने लोग (बंधु) / कुत्ता<\/td><td>स्वजन दुःख में साथ देते हैं।<\/td><\/tr>\n<tr><td>बाज़ी / वाजी<\/td><td>दाँव, खेल की चाल / घोड़ा<\/td><td>उसने बाज़ी जीत ली; वाजी तेज़ दौड़ा।<\/td><\/tr>\n<tr><td>मेध / मेघ<\/td><td>यज्ञ, हवन / बादल<\/td><td>अश्वमेध यज्ञ हुआ; आकाश में मेघ छाए।<\/td><\/tr>\n<tr><td>मुक्ता / मुक्ति<\/td><td>मोती / मोक्ष<\/td><td>सीप में मुक्ता मिला; साधु ने मुक्ति पाई।<\/td><\/tr>\n<tr><td>माणिक्य / माणिक्या<\/td><td>माणिक नामक रत्न (चर्बी नहीं)<\/td><td>HTET 2023 Q32 में 'माणिक्य = चर्बी' ग़लत था।<\/td><\/tr><\/table>\n<h3>और महत्त्वपूर्ण जोड़े<\/h3>\n<table><tr><th>शब्द-जोड़ा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>अन्न / अन्य<\/td><td>अनाज / दूसरा<\/td><td>अन्न का दान करो; अन्य लोग बाहर हैं।<\/td><\/tr>\n<tr><td>अनल / अनिल<\/td><td>आग / हवा<\/td><td>अनल से घर जला; अनिल मंद बह रही है।<\/td><\/tr>\n<tr><td>कुल / कूल<\/td><td>वंश / किनारा<\/td><td>रघुकुल प्रसिद्ध है; नदी के कूल पर बैठो।<\/td><\/tr>\n<tr><td>दिन / दीन<\/td><td>दिवस / ग़रीब, दुःखी<\/td><td>दीन की सहायता करो।<\/td><\/tr>\n<tr><td>अपेक्षा / उपेक्षा<\/td><td>आशा या तुलना / अनादर<\/td><td>मुझे आपसे अपेक्षा है; बड़ों की उपेक्षा न करें।<\/td><\/tr>\n<tr><td>अगम / आगम<\/td><td>पहुँच से परे / आगमन<\/td><td>अगम पथ; वर्षा का आगम।<\/td><\/tr>\n<tr><td>आभरण / आवरण<\/td><td>गहना / परदा, ढक्कन<\/td><td>स्वर्ण आभरण; पुस्तक का आवरण।<\/td><\/tr>\n<tr><td>चरण / चारण<\/td><td>पैर / भाट, स्तुति गाने वाला<\/td><td>गुरु के चरण छुए; चारण कविता सुनाते थे।<\/td><\/tr>\n<tr><td>जलद / जलज<\/td><td>बादल / कमल<\/td><td>जलद गरजा; सरोवर में जलज खिला।<\/td><\/tr>\n<tr><td>दशा / दिशा<\/td><td>हालत / ओर<\/td><td>उसकी दशा बिगड़ी; पूरब दिशा से सूर्य उगता है।<\/td><\/tr>\n<tr><td>परिणाम / परिमाण<\/td><td>नतीजा / मात्रा<\/td><td>परीक्षा का परिणाम; जल का परिमाण।<\/td><\/tr>\n<tr><td>पवन / पावन<\/td><td>हवा / पवित्र<\/td><td>शीतल पवन; पावन गंगा।<\/td><\/tr>\n<tr><td>प्रसाद / प्रासाद<\/td><td>देवता को चढ़ा भोग, कृपा / महल<\/td><td>प्रसाद बाँटा; राजा का प्रासाद।<\/td><\/tr>\n<tr><td>प्रणय / परिणय<\/td><td>प्रेम / विवाह<\/td><td>प्रणय भाव; परिणय संस्कार।<\/td><\/tr>\n<tr><td>वसन / व्यसन<\/td><td>वस्त्र / बुरी लत<\/td><td>श्वेत वसन; जुए का व्यसन।<\/td><\/tr>\n<tr><td>शर / सर<\/td><td>बाण / तालाब<\/td><td>अर्जुन का शर; कमल का सर।<\/td><\/tr>\n<tr><td>सुत / सूत<\/td><td>पुत्र / धागा, सारथी<\/td><td>राजा का सुत; सूत कात लिया।<\/td><\/tr>\n<tr><td>सुधि / सुधी<\/td><td>स्मृति, याद / बुद्धिमान<\/td><td>माँ की सुधि आई; सुधी जन।<\/td><\/tr>\n<tr><td>भवन / भुवन<\/td><td>मकान / संसार<\/td><td>विशाल भवन; तीनों भुवन।<\/td><\/tr>\n<tr><td>कृति / कृती<\/td><td>रचना / कुशल<\/td><td>यह प्रेमचंद की कृति है; वह कृती शिल्पी है।<\/td><\/tr>\n<tr><td>गृह / ग्रह<\/td><td>घर / आकाशीय पिंड<\/td><td>गृह-प्रवेश; मंगल ग्रह।<\/td><\/tr>\n<tr><td>शमन / शयन<\/td><td>शांत करना / सोना<\/td><td>क्रोध का शमन; शयन-कक्ष।<\/td><\/tr>\n<tr><td>कपट / कपाट<\/td><td>छल / दरवाज़ा<\/td><td>कपट मत करो; कपाट खोलो।<\/td><\/tr>\n<tr><td>निशित / निश्चित<\/td><td>तेज़ / तय<\/td><td>निशित बाण; निश्चित समय।<\/td><\/tr><\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> HTET 2022 Q34 में 'सुकृती = सत्कर्म, सुकृति = पुण्यवान' लिखकर अर्थ उलट दिए गए थे; सही अर्थ सुकृति = सत्कर्म, सुकृती = पुण्यवान। जाल बनाने का यही तरीक़ा है: शब्द सही, अर्थ अदल-बदल।<\/div>\n\n<h2>6. अनेकार्थी शब्द (दोहरे अर्थ)<\/h2>\n<p>एक ही शब्द के एक से अधिक अर्थ। संदर्भ देखकर अर्थ चुनें।<\/p>\n<table><tr><th>शब्द<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>कनक<\/td><td>सोना, धतूरा<\/td><td>कनक की चमक।<\/td><\/tr>\n<tr><td>कर<\/td><td>हाथ, किरण, टैक्स, हाथी की सूँड<\/td><td>सूर्य के कर; व्यापारी कर देता है।<\/td><\/tr>\n<tr><td>अर्थ<\/td><td>धन, मतलब<\/td><td>शब्द का अर्थ।<\/td><\/tr>\n<tr><td>काल<\/td><td>समय, मृत्यु, अकाल<\/td><td>काल बड़ा बलवान है।<\/td><\/tr>\n<tr><td>वर्ण<\/td><td>अक्षर, रंग, जाति<\/td><td>वर्ण-व्यवस्था।<\/td><\/tr>\n<tr><td>पत्र<\/td><td>चिट्ठी, पत्ता<\/td><td>पत्र लिखो; वृक्ष के पत्र।<\/td><\/tr>\n<tr><td>हरि<\/td><td>विष्णु, सिंह, घोड़ा, बंदर<\/td><td>हरि का नाम।<\/td><\/tr>\n<tr><td>मधु<\/td><td>शहद, वसंत, मदिरा<\/td><td>मधु का छत्ता।<\/td><\/tr>\n<tr><td>द्विज<\/td><td>ब्राह्मण, पक्षी, दाँत<\/td><td>द्विज का आशीर्वाद।<\/td><\/tr>\n<tr><td>अंबर<\/td><td>आकाश, वस्त्र<\/td><td>नीलांबर।<\/td><\/tr>\n<tr><td>गुण<\/td><td>विशेषता, रस्सी या धनुष की डोरी<\/td><td>उसमें गुण हैं।<\/td><\/tr>\n<tr><td>तीर<\/td><td>बाण, किनारा<\/td><td>नदी के तीर।<\/td><\/tr>\n<tr><td>नाग<\/td><td>साँप, हाथी<\/td><td>नागराज।<\/td><\/tr>\n<tr><td>सैंधव<\/td><td>नमक, घोड़ा<\/td><td>सैंधव लवण।<\/td><\/tr>\n<tr><td>पानी<\/td><td>जल, चमक, इज़्ज़त<\/td><td>मोती का पानी; पानी उतरना।<\/td><\/tr>\n<tr><td>सोना<\/td><td>धातु, नींद लेना<\/td><td>सोना महँगा है; बच्चा सोना चाहता है।<\/td><\/tr>\n<tr><td>कल<\/td><td>बीता या आने वाला दिन, मशीन, चैन<\/td><td>कल मिलेंगे; रात को कल नहीं पड़ा।<\/td><\/tr>\n<tr><td>लाल<\/td><td>पुत्र, रंग, रत्न<\/td><td>माँ का लाल।<\/td><\/tr>\n<tr><td>अक्ष<\/td><td>आँख, धुरी, पासा<\/td><td>अक्ष-रेखा।<\/td><\/tr>\n<tr><td>पद<\/td><td>पैर, ओहदा, छंद का चरण<\/td><td>पद की गरिमा।<\/td><\/tr>\n<tr><td>सारंग<\/td><td>हिरन, मोर, साँप, हाथी<\/td><td>सारंग वन में फिरता है।<\/td><\/tr><\/table>\n\n<h2>7. शब्दकोश में वर्णानुक्रम<\/h2>\n<p>शब्दकोश में शब्द वर्णमाला के क्रम में रखे जाते हैं: पहले स्वर (अ, आ, इ, ई, उ, ऊ, ऋ, ए, ऐ, ओ, औ), फिर व्यंजन (क से ह तक)। पहले अक्षर समान हों तो अगला अक्षर देखें, फिर अगला। नियम की सीढ़ी:<\/p>\n<ol class=\"steps\">\n<li>सबसे पहले पहले अक्षर की तुलना करें।<\/li>\n<li>समान हों तो अगले वर्ण की तुलना करें। ध्यान रहे कि संयुक्त अक्षर श्र = श् + र, क्ष = क् + ष, त्र = त् + र, ज्ञ = ज् + ञ टूटकर देखे जाते हैं।<\/li>\n<li>स्वर की मात्रा भी क्रम तय करती है: अ पहले, फिर आ, इ आदि।<\/li>\n<li>अनुस्वार (ं) और चंद्रबिंदु सामान्यतः उसी अक्षर के बाद, व्यंजन से पहले आते हैं।<\/li>\n<\/ol>\n<p>उदाहरण: श्रद्धा बनाम श्रमिक में पहले दो वर्ण (श्+र) समान हैं। अगला वर्ण द और म है। वर्णमाला में द (त वर्ग) म (प वर्ग) से पहले आता है, इसलिए श्रद्धा पहले आएगा। जबकि श्याम में श् के बाद य है और य, र से पहले आता है (य र ल व)।<\/p>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li>प्रश्न की शर्त देखें: \"असंगत/अनुचित/नहीं\" है तो तीन सही विकल्प छोड़ने हैं और एक ग़लत ढूँढ़ना है।<\/li>\n<li>सबसे परिचित जोड़ा पहले जाँचें और उसे सही मान लें।<\/li>\n<li>पर्यायवाची में उसी वर्ग का कोई दूसरा प्राणी या वस्तु (वर्धकी, काक) पकड़ें।<\/li>\n<li>विलोम में देखें कि जोड़ा कहीं पर्याय (दनुज–दानव) या भाव का सहचर (वैर–क्रोध) तो नहीं है।<\/li>\n<li>एक शब्द में वाक्यांश का मुख्य अर्थ तय करें, फिर पास-पास के शब्द (आयास/अनायास, बड़वानल/दावानल) तौलें।<\/li>\n<li>श्रुतिसम में प्रश्न में दिए दोनों अर्थ बारी-बारी जाँचें; अर्थ आपस में अदल-बदल तो नहीं हुए।<\/li>\n<li>तत्सम-तद्भव में देखें कि जिसे तद्भव कहा गया वह स्वयं संस्कृत शब्द (मस्तक) तो नहीं है।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>भ्रम<\/th><th>सही बात<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>बड़वानल / दावानल<\/td><td>समुद्र की आग / जंगल की आग<\/td><td>HTET 2023 Q45<\/td><\/tr>\n<tr><td>आयास / अनायास<\/td><td>प्रयास / बिना प्रयास<\/td><td>HTET 2020 Q40<\/td><\/tr>\n<tr><td>उन्मुख / अभिमुख / विमुख<\/td><td>उन्मुख = तैयार; अभिमुख = सामने; विमुख = उलटा मुख<\/td><td>उन्मुख का विलोम विमुख<\/td><\/tr>\n<tr><td>वैर / क्रोध<\/td><td>वैर = शत्रुता (विलोम मैत्री), क्रोध = ग़ुस्सा (विलोम क्षमा)<\/td><td>HTET 2021 Q32<\/td><\/tr>\n<tr><td>पाषाण / प्रस्तर / पत्थर<\/td><td>पत्थर का तत्सम प्रस्तर है; पाषाण का तद्भव पाहन<\/td><td>HTET 2022 Q45<\/td><\/tr>\n<tr><td>मस्तक / माथा<\/td><td>मस्तक तत्सम, माथा तद्भव<\/td><td>HTET 2023 Q33<\/td><\/tr>\n<tr><td>सुकृति / सुकृती<\/td><td>सत्कर्म / पुण्यवान<\/td><td>HTET 2022 Q34<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2020 Q33<\/h3>\n<p>विलोम की दृष्टि से असंगत जोड़ा: (1) लंबा–नाटा (2) अभिज्ञ–अनभिज्ञ (3) अनुरक्ति–विराग (4) सत्कार–तिरस्कार<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> लंबा–नाटा, अभिज्ञ (जानकार)–अनभिज्ञ (अ + न उपसर्ग से) और सत्कार–तिरस्कार सही विलोम हैं। अनुरक्ति (आसक्ति, प्रेम) का विलोम विरक्ति है; 'विराग' भी वैराग्य का भाव देता है पर HTET की कुंजी ने इस जोड़े को असंगत माना। सुरक्षित जोड़े: अनुरक्ति–विरक्ति या अनुराग–विराग।<\/div>\n\n<h3>HTET 2020 Q35<\/h3>\n<p>'बकरी' का पर्याय नहीं है: (1) वर्धकी (2) छागी (3) अजा (4) छेरी<\/p>\n<div class=\"ex\"><b>उत्तर: (1)<\/b> अजा, छागी, छेरी बकरी के नाम हैं। वर्धकी का अर्थ बढ़ई (काष्ठ-शिल्पी) है।<\/div>\n\n<h3>HTET 2020 Q40<\/h3>\n<p>वाक्यांश के लिए एक शब्द की दृष्टि से असंगत: (1) कथा के भीतर दूसरी कथा – अन्तर्कथा (2) सर्वाधिकार संपन्न शासक – अधिनायक (3) बिना प्रयास के – आयास (4) जिसे शाप दिया गया – अभिशप्त<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> 'बिना प्रयास के' का शब्द अनायास है। आयास का अर्थ प्रयास, परिश्रम है, यानी उलटा। बाक़ी तीन ठीक हैं।<\/div>\n\n<h3>HTET 2021 Q32<\/h3>\n<p>अनुचित विलोम युग्म: (1) विधि–निषेध (2) खल–सज्जन (3) अमर–मर्त्य (4) वैर–क्रोध<\/p>\n<div class=\"ex\"><b>उत्तर: (4)<\/b> वैर (शत्रुता) का विलोम मैत्री या प्रेम होता है; क्रोध का अपना विलोम क्षमा है। विधि (करना) का उलटा निषेध (मना करना), खल का सज्जन, अमर (जो मरे नहीं) का मर्त्य (मरणशील) सही हैं।<\/div>\n\n<h3>HTET 2021 Q38<\/h3>\n<p>शब्द-प्रकृति की दृष्टि से असंगत: (1) गोस्वामी – तत्सम (2) मुकद्दमा – देशज (3) पंख – तद्भव (4) तहसीलदार – संकर<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> मुक़द्दमा अरबी का शब्द है, यानी विदेशी, देशज नहीं (गुरु पृ. ५३ की अरबी सूची में इसी शब्द का नाम है)। गोस्वामी संस्कृत है; पंख पक्ष का तद्भव है; तहसीलदार = तहसील (अरबी) + दार (फ़ारसी), इसलिए संकर।<\/div>\n\n<h3>HTET 2021 Q45<\/h3>\n<p>'दादुर, भेक, शालूर' किसके पर्याय हैं? (1) हाथी (2) बंदर (3) मेंढक (4) सिंह<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> दादुर, भेक, शालूर, मंडूक, दर्दुर सब मेंढक के नाम हैं।<\/div>\n\n<h3>HTET 2022 Q31<\/h3>\n<p>पर्यायवाची की दृष्टि से असंगत: (1) गधा – लंबकर्ण, वैशाखनंदन, गर्दभ (2) गरुड़ – वैनतेय, कामारि, काक (3) गणिका – सर्ववल्लभा, वारांगना, पतुरिया (4) ग्वाला – आभीर, अहीर, गोप<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> गरुड़ के नाम वैनतेय (विनता का पुत्र), सुपर्ण, गरुत्मान हैं। काक का अर्थ कौआ है, और कामारि काम का शत्रु यानी शिव है; इसलिए यह पंक्ति असंगत है। शेष तीन विकल्प HTET ने सही माने।<\/div>\n\n<h3>HTET 2022 Q34<\/h3>\n<p>समश्रुत भिन्नार्थक शब्दों का बेमेल अर्थ-भेद: (1) सदेह – देह सहित; सन्देह – संशय (2) सुअन – पुत्र; सुमन – फूल (3) सुकृती – सत्कर्म; सुकृति – पुण्यवान (4) स्वजन – बंधु; श्वजन – कुत्ता<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> सही अर्थ सुकृति = सत्कर्म (अच्छा कर्म) और सुकृती = पुण्य करने वाला। दिए गए विकल्प में दोनों उलट हैं।<\/div>\n\n<h3>HTET 2022 Q40<\/h3>\n<p>शब्दकोश में 'श्रद्धा' किस शब्द के पहले आएगा? (1) शौर्य (2) श्याम (3) शृंगार (4) श्रमिक<\/p>\n<div class=\"ex\"><b>उत्तर: (4)<\/b> श्रद्धा = श्+र+द्+ध+आ; श्रमिक = श्+र+म+ि+क। पहले दो वर्ण समान, तीसरे में द और म; द पहले आता है, इसलिए श्रद्धा पहले। श्याम (श्+य) में य, र से पहले है; शृंगार में ऋ तथा शौर्य में औ स्वर हैं, जो श्र से पहले आते हैं। इसलिए ये तीनों श्रद्धा से पहले आएँगे।<\/div>\n\n<h3>HTET 2022 Q41<\/h3>\n<p>विलोम की दृष्टि से असंगत: (1) उपत्यका–अधित्यका (2) उन्मुख–अभिमुख (3) कल्पना–यथार्थ (4) कुत्सा–प्रशंसा<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> उन्मुख का विलोम विमुख है। उपत्यका (पहाड़ के नीचे की भूमि)–अधित्यका (ऊपर का मैदान), कल्पना–यथार्थ और कुत्सा (निंदा)–प्रशंसा सही हैं।<\/div>\n\n<h3>HTET 2022 Q45<\/h3>\n<p>तत्सम-तद्भव की दृष्टि से असंगत: (1) लोमशा–लोमड़ी (2) रज्जु–रस्सी (3) पाषाण–पत्थर (4) मस्तक–माथा<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> पत्थर का तत्सम प्रस्तर है (पाषाण का तद्भव पाहन)। बाक़ी तीन तत्सम-तद्भव के सही जोड़े हैं।<\/div>\n\n<h3>HTET 2023 Q32<\/h3>\n<p>किस विकल्प में शब्द-युग्म का सही अर्थ-भेद नहीं है? (1) बाज़ी – दाँव, वाजी – घोड़ा (2) मेध – हवन, मेघ – बादल (3) माणिक्य – चर्बी, माणिक्या – मछली (4) मुक्ता – मोती, मुक्ति – मोक्ष<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> माणिक्य का अर्थ माणिक नामक रत्न है, चर्बी नहीं। बाक़ी तीनों सही हैं।<\/div>\n\n<h3>HTET 2023 Q33<\/h3>\n<p>कौन-सा युग्म संगत नहीं है? (1) भिक्षुक – तत्सम (2) मस्तक – तद्भव (3) खिचड़ी – देशज (4) अमानत – विदेशज<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> मस्तक तत्सम है; उसका तद्भव माथा है। खिचड़ी को HTET ने देशज माना है; अमानत (अरबी) विदेशज है; भिक्षुक संस्कृत होने से तत्सम है।<\/div>\n\n<h3>HTET 2023 Q38<\/h3>\n<p>पर्यायवाची के संबंध में अनुचित: (1) चंद्रमा – हिमकर, अमृतांशु, महताब (2) गरुड़ – खगनाथ, वृषभी, भद्रा (3) चन्दन – गोरोचन, मलयज, सर्पावास (4) गंगा – अमरतटिनी, अद्रिजा, सुरसरि<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> वृषभी और भद्रा गरुड़ के नाम नहीं हैं। गरुड़ के नाम वैनतेय, सुपर्ण, गरुत्मान, खगराज आदि हैं। अन्य तीन HTET की कुंजी में सही माने गए।<\/div>\n\n<h3>HTET 2023 Q44<\/h3>\n<p>विपरीतार्थक युग्म असंगत है: (1) नूतन–पुरातन (2) दुराशय–सदाशय (3) दनुज–दानव (4) जंगम–स्थावर<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> दनुज और दानव दोनों राक्षस हैं, यानी समानार्थी। बाक़ी जोड़े विलोम हैं: जंगम (चलने वाला)–स्थावर (स्थिर)।<\/div>\n\n<h3>HTET 2023 Q45<\/h3>\n<p>वाक्यांश के लिए एकल शब्द में अनुचित: (1) जो क़ानून की दृष्टि से उचित न हो – अवैध (2) जिसमें छिद्र न हो – नीरन्ध्र (3) समुद्र में लगने वाली आग – दावानल (4) जो भोजन रोगी के लिए उचित है – पथ्य<\/p>\n<div class=\"ex\"><b>उत्तर: (3)<\/b> समुद्र की आग बड़वानल है; दावानल वन की आग है।<\/div>\n\n<h3>HTET 2024 Q45<\/h3>\n<p>विलोम की दृष्टि से असंगत: (1) आकृष्ट–विकृष्ट (2) आह्वान–अनाह्वान (3) कलंकित–निष्कलंक (4) ऐहिक–पारलौकिक<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> आह्वान (बुलाना) का विलोम विसर्जन है (जैसे देवी का आह्वान और विसर्जन); 'अनाह्वान' अपरिचित और अप्रचलित रूप है। आकृष्ट–विकृष्ट, कलंकित–निष्कलंक, ऐहिक (इस लोक का)–पारलौकिक सही हैं।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>तत्सम = संस्कृत जैसा का तैसा; तद्भव = बदला हुआ; अर्द्ध-तत्सम = आधा बिगड़ा (गुरु पृ. ५०, ५१)।<\/li>\n<li>देशज की व्युत्पत्ति अज्ञात (तेंदुआ, खिड़की, ठेस); अनुकरणवाचक ध्वनि की नक़ल (धड़ाम, चट)।<\/li>\n<li>मुक़द्दमा अरबी है; तहसीलदार संकर; मस्तक तत्सम; पंख तद्भव; खिचड़ी (HTET के अनुसार) देशज।<\/li>\n<li>पर्यायवाची में उसी वर्ग का घुसपैठिया पकड़ें: वर्धकी (बढ़ई), काक (कौआ), वृषभी, भद्रा।<\/li>\n<li>विलोम उपसर्ग से बनते हैं (अ, वि, निर्, दुर्, ना, बे, ला), पर कई जोड़े अलग शब्द हैं (अमर–मर्त्य)।<\/li>\n<li>जाल जोड़े: वैर–क्रोध, उन्मुख–अभिमुख, आह्वान–अनाह्वान, दनुज–दानव, अनुरक्ति–विराग।<\/li>\n<li>बड़वानल = समुद्र की आग, दावानल = वन की आग; आयास = प्रयास, अनायास = बिना प्रयास।<\/li>\n<li>सुकृति = सत्कर्म, सुकृती = पुण्यवान; माणिक्य = रत्न, चर्बी नहीं।<\/li>\n<li>श्रुतिसम में एक अक्षर से अर्थ बदलता है: कुल/कूल, दिन/दीन, अनल/अनिल, मेध/मेघ।<\/li>\n<li>शब्दकोश-क्रम में श्र = श् + र टूटकर देखें; श्रद्धा, श्रमिक से पहले (द से म)।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: 'भेक' का पर्याय है: (A) साँप (B) मेंढक (C) चूहा (D) घोड़ा<\/summary><p><b>उत्तर: (B)<\/b> दादुर, भेक, मंडूक सब मेंढक हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: असंगत विलोम जोड़ा: (A) नूतन–पुरातन (B) जंगम–स्थावर (C) उन्मुख–अभिमुख (D) विधि–निषेध<\/summary><p><b>उत्तर: (C)<\/b> उन्मुख का विलोम विमुख है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'जंगल की आग' के लिए एक शब्द: (A) बड़वानल (B) दावानल (C) जठराग्नि (D) अनल<\/summary><p><b>उत्तर: (B)<\/b> बड़वानल समुद्र की आग है; जठराग्नि पेट की।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: सही अर्थ-भेद: (A) कुल – किनारा (B) कूल – वंश (C) कुल – वंश, कूल – किनारा (D) दीन – दिवस<\/summary><p><b>उत्तर: (C)<\/b> दीन का अर्थ ग़रीब है, दिन का दिवस।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: तत्सम-तद्भव का सही जोड़ा: (A) तत्सम दुग्ध – तद्भव दूध (B) तत्सम माथा – तद्भव मस्तक (C) तत्सम हाथ – तद्भव हस्त (D) तत्सम आग – तद्भव अग्नि<\/summary><p><b>उत्तर: (A)<\/b> बाक़ी तीनों में तत्सम-तद्भव उलटे रखे गए हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'सूर्य' का पर्याय नहीं है: (A) भास्कर (B) दिवाकर (C) निशाकर (D) प्रभाकर<\/summary><p><b>उत्तर: (C)<\/b> निशाकर चंद्रमा का नाम है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'जो ईश्वर को न माने' के लिए एक शब्द: (A) आस्तिक (B) नास्तिक (C) कृतघ्न (D) अनीश्वर्य<\/summary><p><b>उत्तर: (B)<\/b> आस्तिक ईश्वर को मानता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'सुत' और 'सूत' के अर्थ क्रमशः हैं: (A) बेटा, धागा (B) धागा, बेटा (C) तारा, बेटा (D) रथ, धागा<\/summary><p><b>उत्तर: (A)<\/b> सुत = पुत्र; सूत = धागा या सारथी।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अरबी मूल का शब्द है: (A) दुकान (B) किताब (C) बाग़ (D) चश्मा<\/summary><p><b>उत्तर: (B)<\/b> दुकान, बाग़ और चश्मा गुरु की फ़ारसी सूची में हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: शब्दकोश-क्रम में सबसे पहले आएगा: (A) क्षमा (B) कमल (C) कृषि (D) कला<\/summary><p><b>उत्तर: (B)<\/b> कमल (क+म) कला (क+ल) से भी पहले; कृ और क्ष बाद में।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामताप्रसाद गुरु, हिंदी व्याकरण: तत्सम, तद्भव, अर्द्ध-तत्सम <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५०\">पृ. ५०<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५१\">५१<\/a>; देशज, अनुकरणवाचक, विदेशी <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५२\">पृ. ५२<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५३\">५३<\/a>; उपसर्गों के अर्थ <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३९९\">पृ. ३९९<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४००\">४००<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४०१\">४०१<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४०३\">४०३<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४०५\">४०५<\/a>। गुरु ने पर्यायवाची, विलोम, एक शब्द और श्रुतिसम को व्याकरण का विषय नहीं बनाया (<a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६\">पृ. ६<\/a>); इनकी शब्द-सूचियाँ पिछले HTET प्रश्नों (2020 से 2024) और मानक कोश-प्रयोग पर आधारित हैं।<\/p>\n","hin-idi":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> मुहावरे-लोकोक्ति से 2021 में 2 और 2023 में 1, कुल 3 प्रश्न आए। 2021 Q41 और 2023 Q41 में \"असंगत अर्थ वाला मुहावरा\" छाँटना था (चार में तीन के अर्थ सही, एक ग़लत), और 2021 Q33 में एक लोकोक्ति ('चिकना मुँह पेट खाली') का अर्थ पूछा गया। इसलिए जितने ज़्यादा मुहावरों-लोकोक्तियों के पक्के अर्थ आपको आते हैं, उतना ही अंदाज़े की जगह निश्चय से उत्तर मिलता है।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> <b>मुहावरा<\/b> ऐसा वाक्यांश है जो अपने साधारण (शब्दकोश के) अर्थ को छोड़कर कोई विशेष, लाक्षणिक या व्यंग्य अर्थ देता है, जैसे 'नाक में दम करना' का अर्थ नाक में साँस रुकना नहीं, बल्कि बहुत तंग करना है। <b>लोकोक्ति<\/b> (कहावत) लोक में चलता हुआ पूरा वाक्य है जो अनुभव से निकली किसी सीख या नीति को कहता है, जैसे 'जैसी करनी वैसी भरनी'।<\/div>\n<p><b>गुरु इस बारे में क्या कहते हैं:<\/b> कामताप्रसाद गुरु ने अपने <i>हिंदी व्याकरण<\/i> की भूमिका में लिखा है कि कुछ लोग हिंदी के \"सर्वांग-पूर्ण\" व्याकरण में साहित्य का इतिहास, छंद, रस, अलंकार, कहावतें और मुहावरे भी चाहते हैं, पर \"ये सब स्वतन्त्र विषय हैं और व्याकरण से इनका कोई प्रत्यक्ष संबंध नहीं है\" (पृ. ६)। पुस्तक के आरंभिक परिचय में वे फिर दोहराते हैं: \"कहावतें और मुहावरे भी जो बहुधा व्याकरण की पुस्तकों में लिख दिये जाते हैं, व्याकरण के विषय नहीं हैं\" (पृ. ३०)। गुरु इनका केवल भाषा-बोध की दृष्टि से उल्लेख करते हैं; एक जगह यह भी बताते हैं कि अरबी का 'मुहाबरत' (स्त्रीलिंग) हिंदुस्तानी में 'मुहावरा' (पुल्लिंग) हो गया है (पृ. २४८, लिंग-परिवर्तन के उदाहरण के रूप में, प्लाट्स के हवाले से)। इसलिए इनके अर्थ गुरु से नहीं, पिछले HTET प्रश्नों और प्रचलित मानक अर्थों से लिए गए हैं।<\/p>\n<p><b>रोज़ की मिसाल:<\/b> कोई कहे \"मेरी तो आँखें बिछी थीं\", तो आँखें सचमुच ज़मीन पर नहीं बिछीं; मतलब इंतज़ार था। मुहावरे बात को छोटा और असरदार बना देते हैं। अनुभव की बात 'जैसी करनी वैसी भरनी' जैसे पूरे वाक्य में कही जाती है। यही दोनों का फ़र्क़ है।<\/p>\n\n<h2>मुहावरा और लोकोक्ति में अंतर<\/h2>\n<table><tr><th>बिंदु<\/th><th>मुहावरा<\/th><th>लोकोक्ति<\/th><\/tr>\n<tr><td>रूप<\/td><td>वाक्यांश, अपने-आप में अधूरा<\/td><td>पूरा वाक्य, अपने-आप में पूर्ण<\/td><\/tr>\n<tr><td>प्रयोग<\/td><td>वाक्य का अंग बनता है; क्रिया लिंग, वचन और काल के अनुसार बदलती है (आँखें बिछाना, आँखें बिछाईं)<\/td><td>जैसा है वैसा ही उद्धृत होता है, रूप नहीं बदलता<\/td><\/tr>\n<tr><td>अर्थ<\/td><td>लाक्षणिक या विशेष अर्थ<\/td><td>सीख, नीति या व्यंग्य; पूरी बात<\/td><\/tr>\n<tr><td>उदाहरण<\/td><td>आँखों का तारा होना<\/td><td>ऊँट के मुँह में जीरा<\/td><\/tr><\/table>\n<div class=\"ex\"><b>पहचानने की तरकीब:<\/b> विकल्प को अपने वाक्य में बिठाकर देखें। \"वह मेरी बात सुनकर ____\" में 'पानी-पानी हो गया' बैठ जाता है (मुहावरा)। पर 'अधजल गगरी छलकत जाय' अपने-आप में एक पूरा वाक्य है, उसे जोड़ना नहीं पड़ता (लोकोक्ति)। मुहावरे के अंत में प्रायः क्रिया (होना, करना, लगना, देना, लेना) आती है, लोकोक्ति में नहीं।<\/div>\n\n<h2>मुहावरों के अर्थ और प्रयोग<\/h2>\n<h3>शरीर के अंगों से बने मुहावरे: आँख<\/h3>\n<table><tr><th>मुहावरा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>आँखों का तारा होना<\/td><td>बहुत प्यारा होना<\/td><td>श्याम अपनी माँ की आँखों का तारा है।<\/td><\/tr>\n<tr><td>आँखें खुलना<\/td><td>होश आना, सच्चाई जान लेना<\/td><td>नुक़सान के बाद उसकी आँखें खुल गईं।<\/td><\/tr>\n<tr><td>आँखें बिछाना<\/td><td>बहुत स्वागत करना, इंतज़ार करना<\/td><td>गाँव वालों ने मेहमानों के लिए आँखें बिछा दीं।<\/td><\/tr>\n<tr><td>आँखें चुराना<\/td><td>सामने आने से बचना<\/td><td>क़र्ज़ वाला मुझे देखकर आँखें चुराने लगा।<\/td><\/tr>\n<tr><td>आँखों में धूल झोंकना<\/td><td>धोखा देना<\/td><td>ठग ने पुलिस की आँखों में धूल झोंक दी।<\/td><\/tr>\n<tr><td>आँख लगना<\/td><td>नींद आना<\/td><td>थकान से आँख लग गई।<\/td><\/tr>\n<tr><td>आँख का काँटा होना<\/td><td>बुरा लगना, खटकना<\/td><td>ईमानदार अफ़सर घूसख़ोरों की आँख का काँटा था।<\/td><\/tr>\n<tr><td>आँख दिखाना<\/td><td>क्रोध से डराना<\/td><td>बॉस ने काम न करने पर आँख दिखाई।<\/td><\/tr>\n<tr><td>आँखों में खटकना<\/td><td>बुरा लगना<\/td><td>उसकी तरक़्क़ी सबकी आँखों में खटकती थी।<\/td><\/tr>\n<tr><td>आँखें फेर लेना<\/td><td>बेरुख़ी करना, पहले जैसा व्यवहार छोड़ना<\/td><td>बुरे समय में मित्र ने आँखें फेर लीं।<\/td><\/tr><\/table>\n<h3>कान<\/h3>\n<table><tr><th>मुहावरा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>कान भरना<\/td><td>चुगली करना, किसी के विरुद्ध भड़काना<\/td><td>उसने मालिक के कान भर दिए।<\/td><\/tr>\n<tr><td>कान पकड़ना<\/td><td>भूल मानना, तौबा करना<\/td><td>मैंने कान पकड़े कि दोबारा देर नहीं करूँगा।<\/td><\/tr>\n<tr><td>कानों-कान ख़बर न होना<\/td><td>किसी को पता न चलना<\/td><td>शादी की बात किसी को कानों-कान ख़बर न हुई।<\/td><\/tr>\n<tr><td>कान खड़े होना<\/td><td>सतर्क हो जाना, शक होना<\/td><td>अजीब आवाज़ सुनकर उसके कान खड़े हो गए।<\/td><\/tr>\n<tr><td>कान काटना<\/td><td>किसी से बहुत बढ़कर होना<\/td><td>वह चालाकी में सबके कान काटता है।<\/td><\/tr>\n<tr><td>कान पर जूँ न रेंगना<\/td><td>बिलकुल असर न होना<\/td><td>कितना समझाया, पर उसके कान पर जूँ न रेंगी।<\/td><\/tr><\/table>\n<h3>हाथ और पैर<\/h3>\n<table><tr><th>मुहावरा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>हाथ मलना<\/td><td>पछताना<\/td><td>अवसर चूककर वह हाथ मलता रह गया।<\/td><\/tr>\n<tr><td>हाथ खड़े करना<\/td><td>असमर्थता जताना, हार मान लेना<\/td><td>डॉक्टर ने हाथ खड़े कर दिए।<\/td><\/tr>\n<tr><td>हाथों के तोते उड़ना<\/td><td>घबरा जाना<\/td><td>चोरी की ख़बर सुनकर उसके हाथों के तोते उड़ गए।<\/td><\/tr>\n<tr><td>हाथ पीले करना<\/td><td>कन्या का विवाह करना<\/td><td>पिता ने बेटी के हाथ पीले कर दिए।<\/td><\/tr>\n<tr><td>हाथ साफ़ करना<\/td><td>चुरा लेना<\/td><td>चोर ने गहनों पर हाथ साफ़ कर दिया।<\/td><\/tr>\n<tr><td>हाथ-पाँव फूलना<\/td><td>घबरा जाना<\/td><td>अचानक बाढ़ आने से सबके हाथ-पाँव फूल गए।<\/td><\/tr>\n<tr><td>हाथ बँटाना<\/td><td>सहायता करना<\/td><td>बेटे ने खेत में पिता का हाथ बँटाया।<\/td><\/tr>\n<tr><td>हाथ लगना<\/td><td>प्राप्त होना<\/td><td>मेहनत से सफलता हाथ लगी।<\/td><\/tr>\n<tr><td>अपने पैरों पर खड़ा होना<\/td><td>आत्मनिर्भर होना<\/td><td>नौकरी पाकर वह अपने पैरों पर खड़ा हो गया।<\/td><\/tr>\n<tr><td>पैर उखड़ना<\/td><td>हार जाना, टिक न पाना<\/td><td>बड़ी सेना देखकर शत्रु के पैर उखड़ गए।<\/td><\/tr>\n<tr><td>पैरों तले ज़मीन खिसकना<\/td><td>होश उड़ जाना<\/td><td>सच जानकर उसके पैरों तले ज़मीन खिसक गई।<\/td><\/tr>\n<tr><td>पाँव पकड़ना<\/td><td>विनती करना<\/td><td>उसने माफ़ी के लिए पाँव पकड़ लिए।<\/td><\/tr>\n<tr><td>एक पैर पर खड़ा होना<\/td><td>सेवा को तत्पर रहना<\/td><td>नौकर मालकिन के लिए एक पैर पर खड़ा रहता है।<\/td><\/tr><\/table>\n<h3>नाक, मुँह, दाँत, सिर, पेट और अन्य अंग<\/h3>\n<table><tr><th>मुहावरा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>नाक में दम करना<\/td><td>बहुत तंग करना<\/td><td>शरारती बच्चों ने माँ की नाक में दम कर दिया।<\/td><\/tr>\n<tr><td>नाक कटना<\/td><td>इज़्ज़त जाना<\/td><td>बेटे की करतूत से परिवार की नाक कट गई।<\/td><\/tr>\n<tr><td>नाक रगड़ना<\/td><td>बहुत गिड़गिड़ाना<\/td><td>अपराधी ने क्षमा के लिए नाक रगड़ी।<\/td><\/tr>\n<tr><td>नाक पर मक्खी न बैठने देना<\/td><td>अपने ऊपर कोई दोष न आने देना, घमंडी होना<\/td><td>वह किसी की बात पर नाक पर मक्खी नहीं बैठने देता।<\/td><\/tr>\n<tr><td>मुँह की खाना<\/td><td>हार जाना<\/td><td>पहले ही मुक़ाबले में शत्रु ने मुँह की खाई।<\/td><\/tr>\n<tr><td>मुँह में पानी आना<\/td><td>लालच होना<\/td><td>मिठाई देखकर बच्चे के मुँह में पानी आ गया।<\/td><\/tr>\n<tr><td>मुँह लटकाना<\/td><td>उदास होना<\/td><td>फेल होकर वह मुँह लटकाए बैठा रहा।<\/td><\/tr>\n<tr><td>अपना-सा मुँह लेकर रह जाना<\/td><td>असफल होने पर लज्जित होना<\/td><td>तर्क में हारकर वह अपना-सा मुँह लेकर रह गया।<\/td><\/tr>\n<tr><td>मुँह काला करना<\/td><td>कलंकित होना<\/td><td>उसने बुरा काम करके अपना मुँह काला किया।<\/td><\/tr>\n<tr><td>दाँतों तले उँगली दबाना<\/td><td>आश्चर्य करना<\/td><td>जादू देखकर सब दाँतों तले उँगली दबाने लगे।<\/td><\/tr>\n<tr><td>दाँत खट्टे करना<\/td><td>बुरी तरह हराना<\/td><td>हमारी टीम ने विपक्षी के दाँत खट्टे कर दिए।<\/td><\/tr>\n<tr><td>दाँत काटी रोटी होना<\/td><td>गहरी दोस्ती होना<\/td><td>दोनों में दाँत काटी रोटी है।<\/td><\/tr>\n<tr><td>सिर पर सवार होना<\/td><td>पीछे पड़ना, हावी होना<\/td><td>परीक्षा सिर पर सवार है।<\/td><\/tr>\n<tr><td>सिर-आँखों पर बैठाना<\/td><td>बहुत सम्मान देना<\/td><td>गाँव वालों ने गुरुजी को सिर-आँखों पर बैठाया।<\/td><\/tr>\n<tr><td>सिर उठाना<\/td><td>विरोध करना, विद्रोह करना<\/td><td>अत्याचार देखकर जनता ने सिर उठाया।<\/td><\/tr>\n<tr><td>सिर पर चढ़ाना<\/td><td>अधिक लाड़ करके बिगाड़ना<\/td><td>नौकर को ज़्यादा सिर पर मत चढ़ाओ।<\/td><\/tr>\n<tr><td>पेट में चूहे कूदना<\/td><td>बहुत भूख लगना<\/td><td>सुबह से कुछ नहीं खाया, पेट में चूहे कूद रहे हैं।<\/td><\/tr>\n<tr><td>पेट काटना<\/td><td>कंजूसी से बचत करना<\/td><td>उसने पेट काटकर बेटे को पढ़ाया।<\/td><\/tr>\n<tr><td>पेट पालना<\/td><td>जीविका चलाना<\/td><td>वह मज़दूरी से परिवार का पेट पालता है।<\/td><\/tr>\n<tr><td>छाती पर साँप लोटना<\/td><td>ईर्ष्या होना<\/td><td>पड़ोसी की तरक़्क़ी देखकर उसकी छाती पर साँप लोट गया।<\/td><\/tr>\n<tr><td>कमर टूटना<\/td><td>हिम्मत, साधन ख़त्म होना<\/td><td>महँगाई से ग़रीब की कमर टूट गई।<\/td><\/tr>\n<tr><td>गला घोंटना<\/td><td>अत्याचार करना, दबा देना<\/td><td>सेठ ने मज़दूरों का गला घोंट दिया।<\/td><\/tr>\n<tr><td>जी जलाना<\/td><td>दुखी या क्रोधित करना<\/td><td>तुम्हारी बातें मेरा जी जलाती हैं।<\/td><\/tr>\n<tr><td>कलेजा मुँह को आना<\/td><td>बहुत घबराना या दुख होना<\/td><td>बेटे की चोट देखकर माँ का कलेजा मुँह को आ गया।<\/td><\/tr>\n<tr><td>दिल बैठ जाना<\/td><td>निराश होना<\/td><td>हार की ख़बर सुनकर उसका दिल बैठ गया।<\/td><\/tr>\n<tr><td>रोंगटे खड़े होना<\/td><td>भय या रोमांच होना<\/td><td>वह दृश्य देखकर रोंगटे खड़े हो गए।<\/td><\/tr><\/table>\n\n<h3>पशु-पक्षियों से बने मुहावरे<\/h3>\n<table><tr><th>मुहावरा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>उल्लू सीधा करना<\/td><td>अपना स्वार्थ साधना<\/td><td>वह मीठी बातों से अपना उल्लू सीधा करता है।<\/td><\/tr>\n<tr><td>उल्लू बनाना<\/td><td>मूर्ख बनाना<\/td><td>ठग ने भोले ग्राहक को उल्लू बनाया।<\/td><\/tr>\n<tr><td>अंधे के हाथ बटेर लगना<\/td><td>बिना प्रयास के कुछ पा लेना<\/td><td>बिना पढ़े भी उसे अच्छे अंक मिले, अंधे के हाथ बटेर लग गई।<\/td><\/tr>\n<tr><td>ऊँट के मुँह में जीरा<\/td><td>ज़रूरत से बहुत कम (यह लोकोक्ति भी है)<\/td><td>पहलवान को दो रोटी देना ऊँट के मुँह में जीरा है।<\/td><\/tr>\n<tr><td>ऊँट का सूई की नोक से निकलना<\/td><td>असंभव कार्य होना<\/td><td>बिना अभ्यास के परीक्षा पास करना ऊँट का सूई की नोक से निकलना है।<\/td><\/tr>\n<tr><td>ऊँट किस करवट बैठता है देखना<\/td><td>परिणाम की प्रतीक्षा करना<\/td><td>चुनाव का नतीजा देखें, ऊँट किस करवट बैठता है।<\/td><\/tr>\n<tr><td>गिरगिट की तरह रंग बदलना<\/td><td>बार-बार अपनी बात या पक्ष बदलना<\/td><td>नेता गिरगिट की तरह रंग बदलते हैं।<\/td><\/tr>\n<tr><td>कुत्ते की दुम टेढ़ी की टेढ़ी<\/td><td>स्वभाव न बदलना<\/td><td>कितना समझाया, पर वह कुत्ते की दुम ही रहा।<\/td><\/tr>\n<tr><td>बगुला भगत<\/td><td>ढोंगी, ऊपर से सज्जन<\/td><td>वह बगुला भगत निकला।<\/td><\/tr>\n<tr><td>साँप सूँघ जाना<\/td><td>चुप या स्तब्ध हो जाना<\/td><td>शिक्षक के आते ही कक्षा को साँप सूँघ गया।<\/td><\/tr>\n<tr><td>आस्तीन का साँप<\/td><td>विश्वासघाती मित्र<\/td><td>जिसे अपना समझा, वह आस्तीन का साँप निकला।<\/td><\/tr>\n<tr><td>शेर की माँद में जाना<\/td><td>ख़तरे में जाना<\/td><td>वह अकेले शत्रु के घर शेर की माँद में चला गया।<\/td><\/tr>\n<tr><td>घड़ियाली आँसू बहाना<\/td><td>झूठा रोना, दिखावटी दुख<\/td><td>उसने मृतक के लिए घड़ियाली आँसू बहाए।<\/td><\/tr>\n<tr><td>चींटी के पर निकलना<\/td><td>विनाश का समय निकट आना<\/td><td>अहंकार में उसके चींटी के पर निकल आए हैं।<\/td><\/tr>\n\n<tr><td>भैंस के आगे बीन बजाना<\/td><td>मूर्ख को उपदेश देना, व्यर्थ प्रयास<\/td><td>उसे समझाना भैंस के आगे बीन बजाना है।<\/td><\/tr>\n<tr><td>तोते की तरह रटना<\/td><td>बिना समझे याद करना<\/td><td>उसने पाठ तोते की तरह रट लिया।<\/td><\/tr>\n<tr><td>नौ-दो-ग्यारह होना<\/td><td>भाग जाना<\/td><td>पुलिस को देखकर चोर नौ-दो-ग्यारह हो गए।<\/td><\/tr>\n<\/table>\n\n<h3>दूसरे प्रसिद्ध मुहावरे<\/h3>\n<table><tr><th>मुहावरा<\/th><th>अर्थ<\/th><th>वाक्य<\/th><\/tr>\n<tr><td>घी के दिए जलाना<\/td><td>खुशी मनाना<\/td><td>बेटे की सफलता पर घर में घी के दिए जले।<\/td><\/tr>\n<tr><td>चार चाँद लगाना<\/td><td>शोभा बढ़ाना<\/td><td>उनके आने से समारोह में चार चाँद लग गए।<\/td><\/tr>\n<tr><td>कमान से तीर निकल जाना<\/td><td>अवसर हाथ से निकल जाना, जो हो गया वापस न लौटना<\/td><td>अब पछताना व्यर्थ है, कमान से तीर निकल चुका है।<\/td><\/tr>\n<tr><td>टेढ़ी खीर होना<\/td><td>बहुत कठिन काम<\/td><td>बिना मेहनत परीक्षा पास करना टेढ़ी खीर है।<\/td><\/tr>\n<tr><td>आग बबूला होना<\/td><td>बहुत क्रोधित होना<\/td><td>झूठ सुनकर पिता आग बबूला हो गए।<\/td><\/tr>\n<tr><td>पानी-पानी होना<\/td><td>बहुत शर्मिंदा होना<\/td><td>चोरी पकड़े जाने पर वह पानी-पानी हो गया।<\/td><\/tr>\n<tr><td>ख़याली पुलाव पकाना<\/td><td>व्यर्थ की कल्पनाएँ करना<\/td><td>बिना मेहनत अमीर बनने के ख़याली पुलाव मत पकाओ।<\/td><\/tr>\n<tr><td>अँधेरे घर का उजाला<\/td><td>इकलौता पुत्र या एकमात्र सहारा<\/td><td>वह बूढ़े माता-पिता के अँधेरे घर का उजाला है।<\/td><\/tr>\n<tr><td>एक घाट पानी पीना<\/td><td>सबके साथ समान और प्रेम से रहना, एकता (HTET की कुंजी में संगत)<\/td><td>राजा के राज्य में शेर-बकरी एक घाट पानी पीते थे।<\/td><\/tr>\n<tr><td>ईंट से ईंट बजाना<\/td><td>पूरी तरह नष्ट करना<\/td><td>सेना ने शत्रु के क़िले की ईंट से ईंट बजा दी।<\/td><\/tr>\n<tr><td>खून-पसीना एक करना<\/td><td>कठोर परिश्रम करना<\/td><td>किसान ने खून-पसीना एक कर फ़सल उगाई।<\/td><\/tr>\n<tr><td>गागर में सागर भरना<\/td><td>थोड़े में बहुत कहना<\/td><td>बिहारी के दोहे गागर में सागर हैं।<\/td><\/tr>\n<tr><td>डींग हाँकना<\/td><td>शेखी बघारना<\/td><td>वह हमेशा डींग हाँकता रहता है।<\/td><\/tr>\n<tr><td>तिल का ताड़ बनाना<\/td><td>छोटी बात को बड़ा बनाना<\/td><td>बात छोटी थी, तुमने तिल का ताड़ बना दिया।<\/td><\/tr>\n<tr><td>दो टूक बात करना<\/td><td>साफ़-साफ़ कहना<\/td><td>मंत्री ने दो टूक जवाब दिया।<\/td><\/tr>\n<tr><td>धूल चटाना<\/td><td>बुरी तरह हराना<\/td><td>पहलवान ने प्रतिद्वंद्वी को धूल चटा दी।<\/td><\/tr>\n<tr><td>पापड़ बेलना<\/td><td>बहुत कष्ट उठाना<\/td><td>नौकरी पाने के लिए बहुत पापड़ बेलने पड़े।<\/td><\/tr>\n<tr><td>फूले न समाना<\/td><td>अत्यंत प्रसन्न होना<\/td><td>बेटे की जीत पर माँ फूली न समाई।<\/td><\/tr>\n<tr><td>बाल-बाल बचना<\/td><td>बिलकुल बच जाना<\/td><td>दुर्घटना में वह बाल-बाल बचा।<\/td><\/tr>\n<tr><td>मक्खन लगाना<\/td><td>चापलूसी करना<\/td><td>उसने अफ़सर को मक्खन लगाकर काम निकाल लिया।<\/td><\/tr>\n<tr><td>मैदान मारना<\/td><td>जीत जाना<\/td><td>इस बार हमारी टीम ने मैदान मार लिया।<\/td><\/tr>\n<tr><td>रंग में भंग पड़ना<\/td><td>आनंद में बाधा आना<\/td><td>अचानक बारिश से उत्सव के रंग में भंग पड़ गया।<\/td><\/tr>\n<tr><td>लोहा मानना<\/td><td>श्रेष्ठता स्वीकार करना<\/td><td>सबने उसकी प्रतिभा का लोहा माना।<\/td><\/tr>\n<tr><td>सब्ज़ बाग़ दिखाना<\/td><td>झूठी आशा दिलाना<\/td><td>दलाल ने सस्ते घर के सब्ज़ बाग़ दिखाए।<\/td><\/tr>\n<tr><td>हवा से बातें करना<\/td><td>बहुत तेज़ चलना<\/td><td>घोड़ा हवा से बातें करने लगा।<\/td><\/tr>\n<tr><td>नमक-मिर्च लगाना<\/td><td>बढ़ा-चढ़ाकर कहना<\/td><td>उसने बात में नमक-मिर्च लगाकर सुनाई।<\/td><\/tr>\n<tr><td>जान पर खेलना<\/td><td>जोखिम उठाना<\/td><td>सिपाही ने देश के लिए जान पर खेलकर लड़ाई लड़ी।<\/td><\/tr>\n<tr><td>सोने पे सुहागा<\/td><td>अच्छी बात में और अच्छी बात जुड़ना<\/td><td>सुंदर और गुणी भी, यह तो सोने पे सुहागा है।<\/td><\/tr>\n<tr><td>नीम हकीम ख़तरा-ए-जान<\/td><td>अधकचरा ज्ञान ख़तरनाक<\/td><td>बिना जाने दवा देना नीम हकीम ख़तरा-ए-जान है।<\/td><\/tr><\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> परीक्षा में ग़लत अर्थ प्रायः किसी दूसरे मुहावरे से उठाया जाता है। HTET 2023 Q41 में 'कमान से तीर निकल जाना' का अर्थ \"किसी का भेद खुलना\" दिया गया था, जो ग़लत है; सही अर्थ है अवसर या बात का हाथ से निकल जाना। HTET 2021 Q41 में 'ऊँट का सूई की नोक से निकलना' का अर्थ \"शक्तिशाली का कमज़ोर होना\" लिखा था, जो ग़लत है; सही अर्थ है असंभव कार्य होना।<\/div>\n\n<h2>लोकोक्तियाँ और उनका प्रयोग<\/h2>\n<p>नीचे लोकोक्तियाँ अर्थ और प्रयोग के साथ विषय के अनुसार दी हैं। लोकोक्ति जैसी है, वैसी ही बोली जाती है।<\/p>\n<h3>दिखावा, घमंड, ओछापन<\/h3>\n<table><tr><th>लोकोक्ति<\/th><th>अर्थ<\/th><th>प्रयोग<\/th><\/tr>\n<tr><td>अधजल गगरी छलकत जाय<\/td><td>कम ज्ञान वाला ज़्यादा दिखावा करता है<\/td><td>कम पढ़ा-लिखा ही सबसे ज़्यादा बोलता है, अधजल गगरी छलकत जाय।<\/td><\/tr>\n<tr><td>थोथा चना बाजे घना<\/td><td>ओछा आदमी अधिक बोलता है<\/td><td>वह काम कम करता है, बातें ज़्यादा; थोथा चना बाजे घना।<\/td><\/tr>\n<tr><td>ऊँची दुकान फीका पकवान<\/td><td>नाम बड़ा, गुण कम<\/td><td>नामी होटल का खाना बेस्वाद निकला, ऊँची दुकान फीका पकवान।<\/td><\/tr>\n<tr><td>चिकना मुँह पेट खाली<\/td><td>देखने में सुखी, भीतर से दुःखी<\/td><td>बाहर से रईस दिखने वाला वह क़र्ज़ में डूबा है; चिकना मुँह पेट खाली।<\/td><\/tr>\n<tr><td>हाथी के दाँत खाने के और, दिखाने के और<\/td><td>कहना कुछ, करना कुछ<\/td><td>उसके भाषण और आचरण में फ़र्क़ है, हाथी के दाँत खाने के और दिखाने के और।<\/td><\/tr>\n<tr><td>ढोल के भीतर पोल<\/td><td>बाहर से बड़ा, भीतर से खोखला<\/td><td>उसकी शान ढोल के भीतर पोल निकली।<\/td><\/tr>\n<tr><td>दूर के ढोल सुहावने<\/td><td>दूर की चीज़ अच्छी लगती है<\/td><td>पास जाने पर हक़ीक़त खुली, दूर के ढोल सुहावने होते हैं।<\/td><\/tr><\/table>\n<h3>कमी, दोष, ग़लती<\/h3>\n<table><tr><th>लोकोक्ति<\/th><th>अर्थ<\/th><th>प्रयोग<\/th><\/tr>\n<tr><td>ऊँट के मुँह में जीरा<\/td><td>ज़रूरत से बहुत कम<\/td><td>इतनी बड़ी कंपनी को दस हज़ार की मदद ऊँट के मुँह में जीरा है।<\/td><\/tr>\n<tr><td>नाच न जाने आँगन टेढ़ा<\/td><td>अपनी कमी का दोष दूसरों पर डालना<\/td><td>लिखना नहीं आता तो क़लम को दोष देना नाच न जाने आँगन टेढ़ा है।<\/td><\/tr>\n<tr><td>चोर की दाढ़ी में तिनका<\/td><td>दोषी सदा शंकित रहता है<\/td><td>जाँच की बात सुनते ही वह घबरा गया, चोर की दाढ़ी में तिनका।<\/td><\/tr>\n<tr><td>बंदर क्या जाने अदरक का स्वाद<\/td><td>मूर्ख गुण की क़द्र नहीं जानता<\/td><td>उसे कविता का रस क्या मालूम, बंदर क्या जाने अदरक का स्वाद।<\/td><\/tr>\n<tr><td>खिसियानी बिल्ली खंभा नोचे<\/td><td>लज्जित व्यक्ति दूसरों पर ग़ुस्सा निकालता है<\/td><td>हारकर वह साथियों पर बरसने लगा, खिसियानी बिल्ली खंभा नोचे।<\/td><\/tr>\n<tr><td>अंधों में काना राजा<\/td><td>अज्ञानियों में थोड़ा ज्ञानी भी श्रेष्ठ<\/td><td>अनपढ़ों के गाँव में वह मास्टर अंधों में काना राजा था।<\/td><\/tr><\/table>\n<h3>नीति और सीख<\/h3>\n<table><tr><th>लोकोक्ति<\/th><th>अर्थ<\/th><th>प्रयोग<\/th><\/tr>\n<tr><td>जैसी करनी वैसी भरनी<\/td><td>कर्म के अनुसार फल मिलता है<\/td><td>बुरे काम का नतीजा सामने आया, जैसी करनी वैसी भरनी।<\/td><\/tr>\n<tr><td>दूध का जला छाछ भी फूँक-फूँक कर पीता है<\/td><td>एक बार धोखा खाने वाला सावधान रहता है<\/td><td>ठगे जाने के बाद वह हर सौदा जाँचता है।<\/td><\/tr>\n<tr><td>आम के आम गुठलियों के दाम<\/td><td>दोहरा लाभ<\/td><td>किताब पढ़ी और बेचकर पैसे भी मिले, आम के आम गुठलियों के दाम।<\/td><\/tr>\n<tr><td>का वर्षा जब कृषि सुखाने<\/td><td>समय बीतने पर मदद व्यर्थ<\/td><td>परीक्षा के बाद पढ़ाई का क्या लाभ, का वर्षा जब कृषि सुखाने।<\/td><\/tr>\n<tr><td>अब पछताए होत क्या जब चिड़िया चुग गई खेत<\/td><td>अवसर निकलने पर पछताना बेकार<\/td><td>समय गँवाकर रोने से क्या होगा।<\/td><\/tr>\n<tr><td>जो गरजते हैं वे बरसते नहीं<\/td><td>अधिक बोलने वाले काम नहीं करते<\/td><td>वह बहुत धमकाता है पर करता कुछ नहीं।<\/td><\/tr>\n<tr><td>बिन माँगे मोती मिलें, माँगे मिले न भीख<\/td><td>बिना माँगे सब कुछ मिल जाना, माँगने पर भी न मिलना<\/td><td>भाग्य की बात है।<\/td><\/tr>\n<tr><td>एक और एक ग्यारह<\/td><td>एकता में शक्ति<\/td><td>दोनों भाइयों ने मिलकर काम किया तो एक और एक ग्यारह हो गए।<\/td><\/tr>\n<tr><td>सब्र का फल मीठा होता है<\/td><td>धैर्य का परिणाम अच्छा<\/td><td>वर्षों के परिश्रम के बाद उसे सफलता मिली।<\/td><\/tr>\n<tr><td>जहाँ चाह वहाँ राह<\/td><td>इच्छा हो तो उपाय निकल आता है<\/td><td>गाँव के बालक ने साधनहीन होकर भी पढ़ाई पूरी की।<\/td><\/tr><\/table>\n<h3>परिश्रम और परिणाम<\/h3>\n<table><tr><th>लोकोक्ति<\/th><th>अर्थ<\/th><th>प्रयोग<\/th><\/tr>\n<tr><td>खोदा पहाड़ निकली चुहिया<\/td><td>बहुत मेहनत, थोड़ा फल<\/td><td>पूरी रात मेहनत की, निकला कुछ नहीं; खोदा पहाड़ निकली चुहिया।<\/td><\/tr>\n<tr><td>एक अनार सौ बीमार<\/td><td>वस्तु कम, चाहने वाले अधिक<\/td><td>एक पद के लिए सैकड़ों उम्मीदवार, एक अनार सौ बीमार।<\/td><\/tr>\n<tr><td>नौ दिन चले अढ़ाई कोस<\/td><td>बहुत धीमा काम<\/td><td>सड़क का काम नौ दिन चले अढ़ाई कोस की चाल से हो रहा है।<\/td><\/tr>\n<tr><td>न नौ मन तेल होगा न राधा नाचेगी<\/td><td>शर्त पूरी न हो इसलिए टालमटोल<\/td><td>बहाना बनाकर काम टाला जा रहा है।<\/td><\/tr>\n<tr><td>सौ सुनार की एक लोहार की<\/td><td>एक ही ज़ोरदार प्रहार सैकड़ों छोटे प्रहारों के बराबर<\/td><td>बलवान का एक वार भारी पड़ा।<\/td><\/tr>\n<tr><td>नेकी कर दरिया में डाल<\/td><td>उपकार करके भूल जाओ<\/td><td>किसी पर एहसान जताना ठीक नहीं।<\/td><\/tr>\n<tr><td>दाल में कुछ काला होना<\/td><td>कुछ गड़बड़ होना (मुहावरे की तरह भी चलता है)<\/td><td>उसका बार-बार झूठ बोलना दाल में कुछ काला होना दिखाता है।<\/td><\/tr><\/table>\n<div class=\"ex\"><b>उदाहरण:<\/b> 'चिकना मुँह पेट खाली' लोकोक्ति है, क्योंकि पूरा वाक्य है और उसका अर्थ है बाहर से सुखी दिखना, भीतर से दुःखी होना। 'अँधेरे घर का उजाला' मुहावरा है: एकमात्र पुत्र या सहारा। दूसरी ओर 'ऊँट के मुँह में जीरा' दोनों जगह मिलता है; वाक्य में जुड़कर चले तो मुहावरा, स्वतंत्र पूरा कथन हो तो लोकोक्ति।<\/div>\n\n<h2>मुहावरा-प्रश्न हल करने की विधि<\/h2>\n<ol class=\"steps\">\n<li>प्रश्न की शर्त पढ़ें: \"संगत नहीं\" का मतलब चार में से ग़लत अर्थ वाला विकल्प ढूँढ़ना है।<\/li>\n<li>सबसे परिचित मुहावरों का अर्थ पहले मिलाएँ और उन्हें सही मानकर छोड़ें (जैसे आत्मनिर्भर, अंधे के हाथ बटेर)।<\/li>\n<li>जो अर्थ अटपटा लगे, उसे अपने वाक्य में रखकर देखें: क्या इस अर्थ से वाक्य बनता है?<\/li>\n<li>शब्दों से अर्थ न निकालें; अर्थ लाक्षणिक होता है (ऊँट के सूई की नोक से निकलने का अर्थ ऊँट का छोटा होना नहीं)।<\/li>\n<li>याद रखें कि ग़लत विकल्प का अर्थ अक्सर किसी दूसरे मुहावरे का होता है (कमान से तीर निकलना = भेद खुलना ग़लत, क्योंकि भेद खुलना 'पोल खुलना' या 'राज़ फ़ाश होना' है)।<\/li>\n<li>लोकोक्ति के अर्थ में पूरा भाव देखें, एक शब्द नहीं। विकल्पों में चिकना, सुखी, दुःखी जैसे शब्दों के जोड़े से भाव पकड़ें।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>भ्रम<\/th><th>सही बात<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>पानी-पानी होना / पानी फेरना<\/td><td>शर्मिंदा होना / बेकार कर देना<\/td><td>उसने मेरे सपनों पर पानी फेर दिया।<\/td><\/tr>\n<tr><td>नौ-दो-ग्यारह होना / एक और एक ग्यारह<\/td><td>भाग जाना (मुहावरा) / एकता में शक्ति (लोकोक्ति)<\/td><td>-<\/td><\/tr>\n<tr><td>आँख लगना / आँख लगाना<\/td><td>नींद आना / ध्यान से देखना या प्रेम होना<\/td><td>-<\/td><\/tr>\n<tr><td>हाथ खड़े करना / हाथ उठाना<\/td><td>हार मानना / मारने के लिए तैयार होना<\/td><td>-<\/td><\/tr>\n<tr><td>सिर पर चढ़ाना / सिर चढ़ना<\/td><td>लाड़ से बिगाड़ना / बहुत बिगड़ जाना<\/td><td>-<\/td><\/tr>\n<tr><td>मुँह की खाना / मुँह लगाना<\/td><td>हारना / हद से ज़्यादा छूट देना<\/td><td>-<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2021 Q33<\/h3>\n<p>'चिकना मुँह पेट खाली' लोकोक्ति का सही अर्थ: (1) अपने हाथ से दान देना (2) देखने में सुखी, भीतर से दुःखी (3) अत्यधिक प्यारा होना (4) ज़बरदस्ती गले पड़ना<\/p>\n<div class=\"ex\"><b>उत्तर: (2)<\/b> 'चिकना मुँह' बाहरी चमक-दमक का, 'पेट खाली' भीतरी अभाव और दुःख का प्रतीक है। बाहर से सुखी, भीतर से दुःखी। बाक़ी तीन विकल्प किसी और मुहावरे के अर्थ हैं (गले पड़ना, आँखों का तारा आदि)।<\/div>\n\n<h3>HTET 2021 Q41<\/h3>\n<p>अर्थ की दृष्टि से कौन-सा मुहावरा संगत नहीं है? (1) ख़याली पुलाव पकाना – व्यर्थ की बातें करना (2) अपना-सा मुँह लेकर रह जाना – असफल होने पर लज्जित होना (3) अँधेरे घर का उजाला – एकमात्र सहारा (4) ऊँट का सूई की नोक से निकलना – शक्तिशाली का कमज़ोर होना<\/p>\n<div class=\"ex\"><b>उत्तर: (4)<\/b> ऊँट बहुत बड़ा है और सूई की नोक (छेद) बहुत छोटी; ऊँट का उससे निकल पाना असंभव है। इसलिए मुहावरे का अर्थ असंभव कार्य होना है। 'शक्तिशाली का कमज़ोर होना' ग़लत है। विकल्प (1), (2), (3) के अर्थ ठीक हैं।<\/div>\n\n<h3>HTET 2023 Q41<\/h3>\n<p>किस मुहावरे का अर्थ संगत नहीं है? (1) अपने पैरों पर खड़ा होना – आत्मनिर्भर होना (2) अंधे के हाथ बटेर लगना – बिना प्रयास के कोई चीज़ प्राप्त कर लेना (3) एक घाट पानी पीना – एकता और सहिष्णुता होना (4) कमान से तीर निकल जाना – किसी का भेद खुलना<\/p>\n<div class=\"ex\"><b>उत्तर: (4)<\/b> छूटा हुआ तीर वापस नहीं आता, इसलिए इसका अर्थ है मौक़ा या बात हाथ से निकल जाना, जो हो गया वह लौटाया नहीं जा सकता। 'भेद खुलना' इसका अर्थ नहीं (वह 'पोल खुलना' या 'भंडा फूटना' से कहा जाता है)। (1) और (2) स्पष्ट रूप से सही हैं। (3) में 'एक घाट पानी पीना' का भाव सबके साथ समान बर्ताव और मेल-जोल है; कुंजी ने इसे संगत माना है।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>मुहावरा वाक्यांश है और वाक्य में जुड़ता है, इसकी क्रिया बदलती है; लोकोक्ति पूरा वाक्य है और बदलती नहीं।<\/li>\n<li>मुहावरे का अर्थ लाक्षणिक होता है, शब्दकोश के अर्थ से अलग।<\/li>\n<li>गुरु (पृ. ६, ३०) के अनुसार कहावतें और मुहावरे व्याकरण के विषय नहीं हैं; उनके अर्थ प्रचलित और कोश से लिए जाते हैं।<\/li>\n<li>असंगत अर्थ वाले प्रश्न में ग़लत विकल्प का अर्थ प्रायः किसी और मुहावरे का होता है।<\/li>\n<li>ऊँट का सूई की नोक से निकलना = असंभव कार्य; कमान से तीर निकल जाना = अवसर हाथ से निकलना।<\/li>\n<li>चिकना मुँह पेट खाली = बाहर सुखी, भीतर दुःखी।<\/li>\n<li>अपना-सा मुँह लेकर रह जाना = असफल होने पर लज्जित; अँधेरे घर का उजाला = एकमात्र सहारा; ख़याली पुलाव = व्यर्थ कल्पनाएँ।<\/li>\n<li>अंधे के हाथ बटेर = बिना प्रयास पाना; अपने पैरों पर खड़ा होना = आत्मनिर्भर।<\/li>\n<li>शरीर के अंगों वाले मुहावरे सबसे अधिक पूछे जाने की संभावना रखते हैं: आँख, कान, हाथ, नाक की सूची दोहराएँ।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: 'नौ दो ग्यारह होना' का अर्थ: (A) धनी होना (B) भाग जाना (C) गणित में दक्ष होना (D) मिल जाना<\/summary><p><b>उत्तर: (B)<\/b> भाग जाना।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: लोकोक्ति है: (A) नाक में दम करना (B) पानी-पानी होना (C) अधजल गगरी छलकत जाय (D) आँखों का तारा<\/summary><p><b>उत्तर: (C)<\/b> पूरा वाक्य और नीति।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: असंगत अर्थ: (A) उल्लू सीधा करना – स्वार्थ साधना (B) चार चाँद लगाना – शोभा बढ़ाना (C) दाँतों तले उँगली दबाना – क्रोध करना (D) टेढ़ी खीर – कठिन काम<\/summary><p><b>उत्तर: (C)<\/b> दाँतों तले उँगली दबाना का अर्थ आश्चर्य करना है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'ऊँट के मुँह में जीरा' का भाव: (A) बहुत अधिक (B) ज़रूरत से बहुत कम (C) कठिन काम (D) विश्वासघात<\/summary><p><b>उत्तर: (B)<\/b> ऊँट बहुत बड़ा, जीरा बहुत थोड़ा।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'कान भरना' का अर्थ है: (A) ध्यान से सुनना (B) चुगली करना, भड़काना (C) बहरा होना (D) गहने पहनना<\/summary><p><b>उत्तर: (B)<\/b> किसी के विरुद्ध बात कहकर मन बदलना।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'आस्तीन का साँप' से तात्पर्य है: (A) डरपोक (B) विश्वासघाती मित्र (C) ज़हरीला जीव (D) सँपेरा<\/summary><p><b>उत्तर: (B)<\/b> जो अपना बनकर नुक़सान करे।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'एक अनार सौ बीमार' का भाव है: (A) औषधि का गुण (B) वस्तु कम, चाहने वाले अधिक (C) बहुत स्वास्थ्य (D) रोग का फैलना<\/summary><p><b>उत्तर: (B)<\/b> एक पद, सैकड़ों उम्मीदवार जैसी स्थिति।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'आँखों में धूल झोंकना' का अर्थ: (A) आँखें ख़राब करना (B) धोखा देना (C) धूल साफ़ करना (D) क्रोध करना<\/summary><p><b>उत्तर: (B)<\/b> किसी को चकमा देना।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'अब पछताए होत क्या जब चिड़िया चुग गई खेत' का आशय: (A) खेत की रखवाली (B) अवसर निकलने पर पछताना व्यर्थ (C) चिड़िया पालना (D) खेती का महत्त्व<\/summary><p><b>उत्तर: (B)<\/b> पहले ही सावधान रहना चाहिए।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'छाती पर साँप लोटना' का अर्थ: (A) डर लगना (B) ईर्ष्या होना (C) साँस रुकना (D) बहुत ख़ुश होना<\/summary><p><b>उत्तर: (B)<\/b> दूसरे की उन्नति देख जलन होना।<\/p><\/details>\n\n<p class=\"src\">स्रोत: मुहावरे और कहावतें गुरु के हिंदी व्याकरण का विषय नहीं हैं (<a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६\">पृ. ६<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३०\">पृ. ३०<\/a>); 'मुहावरा' शब्द के लिंग का उल्लेख <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२४८\">पृ. २४८<\/a> पर। अर्थ पिछले HTET प्रश्नों (2021, 2023) और मानक प्रचलित अर्थों पर आधारित हैं; सूचियों के लिए कोई पृथक् पुस्तक-पृष्ठ उद्धृत नहीं किया गया है।<\/p>\n","hin-sent":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2020–2022 में हर साल 1 प्रश्न, कुल 3: &lsquo;शुद्ध वाक्य&rsquo; चुनना (2020 Q38), &lsquo;अशुद्ध वाक्य&rsquo; चुनना (2022 Q36) और अर्थ के आधार पर वाक्य-भेद का सुमेल (2021 Q44, जिसमें &lsquo;सुमेलित नहीं&rsquo; वाला विकल्प पूछा गया था)। इसलिए इस पृष्ठ में <b>वाक्य-शुद्धि<\/b> और <b>अर्थ के आधार पर आठ भेद<\/b> सबसे ज़्यादा ध्यान माँगते हैं; रचना के भेद और उपवाक्य अगली सीढ़ी हैं।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जो शब्द-समूह एक पूरा विचार या भाव प्रकट करे, उसे <b>वाक्य<\/b> कहते हैं। &ldquo;राम पुस्तक पढ़ रहा है&rdquo; वाक्य है; &ldquo;नदी के किनारे&rdquo; वाक्य नहीं, क्योंकि पूरी बात नहीं कही गई।<\/div>\n<p>कामताप्रसाद गुरु (अंक ६७७, पृ. ६०४): &ldquo;एक विचार पूर्णता से प्रगट करनेवाले शब्द-समूह को वाक्य कहते हैं।&rdquo; गुरु का तर्क है कि व्याकरण का मुख्य उद्देश्य वाक्य का अर्थ स्पष्ट करना है (अंक ५०६, पृ. ४९९); इसलिए शब्दों को अलग-अलग जानना काफ़ी नहीं, उनका आपसी संबंध भी जानना होता है। यही संबंध <b>वाक्य-विन्यास<\/b> कहलाता है।<\/p>\n<p><b>रोज़मर्रा का उदाहरण:<\/b> अगर कोई कहे &ldquo;कल मैं&rdquo;, तो आप पूछेंगे &ldquo;कल तुम क्या?&rdquo; यानी बात अधूरी है। &ldquo;कल मैं दिल्ली जाऊँगा&rdquo; सुनकर कुछ पूछना नहीं पड़ता। यह पूर्णता ही वाक्य की पहचान है।<\/p>\n<h3>वाक्य की तीन कसौटियाँ (स्कूली परंपरा)<\/h3>\n<p><b>स्कूली पाठ्यपुस्तकों में<\/b> (संस्कृत काव्यशास्त्र की परंपरा से) वाक्य के लिए तीन शर्तें बताई जाती हैं। गुरु इन तीन शब्दों का नाम लेकर चर्चा नहीं करते; यह स्कूल की परिपाटी है।<\/p>\n<ul>\n<li><b>आकांक्षा:<\/b> वाक्य ऐसा हो कि सुननेवाले को आगे कुछ जानने की इच्छा न बचे। (&ldquo;राम ने&rdquo; में आकांक्षा बाकी है; &ldquo;राम ने खाना खाया&rdquo; में पूरी हो गई।)<\/li>\n<li><b>योग्यता:<\/b> शब्दों के अर्थ में तालमेल हो, बात असंभव न हो। &ldquo;वह आग से सींचता है&rdquo; में योग्यता नहीं है, क्योंकि आग से सींचना संभव नहीं; &ldquo;वह पानी से सींचता है&rdquo; ठीक है।<\/li>\n<li><b>आसक्ति (आसत्ति):<\/b> शब्द पास-पास और सही क्रम में हों। &ldquo;राम खाता है आम&rdquo; की जगह बीच में बहुत दूर के शब्द डाल देने पर अर्थ बिखर जाता है।<\/li>\n<\/ul>\n<p>अर्थात् अच्छा वाक्य वही है जिसमें पूरी बात हो (आकांक्षा), बात संभव हो (योग्यता) और शब्द सही जगह हों (आसक्ति)।<\/p>\n\n<h2>मूल अवधारणा: उद्देश्य और विधेय<\/h2>\n<p>गुरु (अंक ६७८, पृ. ६०४) के अनुसार वाक्य के मुख्य दो अवयव होते हैं:<\/p>\n<div class=\"def\"><b>उद्देश्य:<\/b> जिस वस्तु या व्यक्ति के विषय में कुछ कहा जाए, उसे बतानेवाले शब्द। <b>विधेय:<\/b> उद्देश्य के विषय में जो कहा जाए (विधान किया जाए), उसे बतानेवाले शब्द।<\/div>\n<table>\n<tr><th>वाक्य<\/th><th>उद्देश्य<\/th><th>विधेय<\/th><\/tr>\n<tr><td>आत्मा अमर है।<\/td><td>आत्मा<\/td><td>अमर है<\/td><\/tr>\n<tr><td>घोड़ा दौड़ रहा है।<\/td><td>घोड़ा<\/td><td>दौड़ रहा है<\/td><\/tr>\n<tr><td>राम ने रावण को मारा।<\/td><td>राम ने<\/td><td>रावण को मारा<\/td><\/tr>\n<\/table>\n<p><b>सूत्र:<\/b> किसके बारे में? &rarr; उद्देश्य। उसके बारे में क्या? &rarr; विधेय। भाववाच्य में उद्देश्य अकसर क्रिया में ही छिपा होता है: &ldquo;मुझसे चला नहीं जाता&rdquo; (अंक ६७९, पृ. ६०४–६०५)।<\/p>\n<h3>उद्देश्य और विधेय का विस्तार<\/h3>\n<p>गुरु का क्रम (अंक ६८२–६९७, पृ. ६०६–६१८):<\/p>\n<ul>\n<li><b>साधारण उद्देश्य:<\/b> मुख्य संज्ञा/सर्वनाम (बहुधा कर्ता): &lsquo;लड़का&rsquo;। इसे बढ़ानेवाले शब्द <b>उद्देश्य-वर्धक<\/b> कहलाते हैं: विशेषण, संबंध-कारक, समानाधिकरण शब्द, वाक्यांश। &ldquo;<b>अच्छा<\/b> लड़का आज्ञा मानता है&rdquo;: &lsquo;अच्छा&rsquo; उद्देश्य-वर्धक है।<\/li>\n<li><b>साधारण विधेय:<\/b> मुख्य क्रिया (&lsquo;मानता है&rsquo;)।<\/li>\n<li><b>विधेय-पूरक:<\/b> क्रिया का अर्थ पूरा करनेवाले शब्द। इसमें <b>कर्म<\/b> (सकर्मक के साथ) और <b>पूर्ति<\/b> (अपूर्ण क्रिया के साथ: &lsquo;वह आदमी <b>पागल<\/b> हो गया&rsquo;) आते हैं।<\/li>\n<li><b>विधेय-विस्तारक (विधेय-वर्धक):<\/b> क्रिया की विशेषता बतानेवाले शब्द, यानी कब, कहाँ, कैसे, कितना, क्यों का उत्तर: &ldquo;मीर कासिम ने मुँगेर को अपनी राजधानी बनाया&rdquo;।<\/li>\n<\/ul>\n<div class=\"ex\"><b>वाक्य-पृथक्करण का एक पूरा उदाहरण (गुरु, पृ. ६१८–६१९):<\/b> &ldquo;सभापति ने अपना भाषण पढ़ा।&rdquo;\n<ol class=\"steps\">\n<li>साधारण उद्देश्य: <i>सभापति ने<\/i> (उद्देश्य-वर्धक: कोई नहीं)।<\/li>\n<li>साधारण विधेय: <i>पढ़ा<\/i>।<\/li>\n<li>विधेय-पूरक (कर्म): <i>अपना भाषण<\/i>।<\/li>\n<li>विधेय-विस्तारक: कोई नहीं।<\/li>\n<\/ol><\/div>\n<h3>वाक्यांश और उपवाक्य<\/h3>\n<table>\n<tr><th>बिंदु<\/th><th>वाक्यांश<\/th><th>उपवाक्य<\/th><\/tr>\n<tr><td>अर्थ<\/td><td>पूर्ण विचार नहीं, केवल एक या अधिक भावनाएँ<\/td><td>बड़े वाक्य का वह भाग जिसमें अपनी क्रिया (उद्देश्य-विधेय) हो<\/td><\/tr>\n<tr><td>रूप<\/td><td>प्रायः क्रिया नहीं; कृदंत या संबंधसूचक होता है<\/td><td>एक समापिका क्रिया होती है<\/td><\/tr>\n<tr><td>उदाहरण<\/td><td>नदी के किनारे; सबेरे जल्दी उठना; दूर से आया हुआ<\/td><td>जब सबेरा हुआ (तब हम बाहर गए)<\/td><\/tr>\n<\/table>\n<p>गुरु (अंक ६८१, पृ. ६०६): &ldquo;वाक्य में एक पूर्ण विचार रहता है, परंतु वाक्यांश में केवल एक या अधिक भावनाएँ रहती हैं। रूप के अनुसार वाक्य में एक क्रिया रहती है; वाक्यांश में बहुधा कृदंत या संबंधसूचक अव्यय।&rdquo; उपवाक्य वह है जिसमें क्रिया तो है पर जो अकेले पूरा अर्थ न दे सके (आश्रित) या जो स्वतंत्र हो (मुख्य)।<\/p>\n\n<h2>रचना के आधार पर तीन भेद<\/h2>\n<div class=\"cards\">\n<div><h3>साधारण (सरल)<\/h3><p>एक उद्देश्य, एक विधेय; एक ही समापिका क्रिया<\/p><p>बिजली चमकती है।<\/p><\/div>\n<div><h3>संयुक्त<\/h3><p>दो या अधिक स्वतंत्र (मुख्य) उपवाक्य, योजक से जुड़े<\/p><p>वर्षा हुई और नदियाँ भर गईं।<\/p><\/div>\n<div><h3>मिश्र<\/h3><p>एक मुख्य उपवाक्य + एक या अधिक आश्रित उपवाक्य<\/p><p>जब सबेरा हुआ तब हम बाहर गए।<\/p><\/div>\n<\/div>\n<h3>साधारण वाक्य<\/h3>\n<p>गुरु (अंक ६८०-क, पृ. ६०५): जिसमें एक उद्देश्य और एक विधेय रहता है। &ldquo;आज बहुत पानी गिरा।&rdquo; &ldquo;बिजली चमकती है।&rdquo; (गुरु इसे &lsquo;साधारण&rsquo; कहते हैं; स्कूल में &lsquo;सरल&rsquo;।) पहचान: वाक्य में केवल एक समापिका क्रिया।<\/p>\n<h3>संयुक्त वाक्य<\/h3>\n<p>गुरु (अंक ६८०-ग, पृ. ६०५–६०६): जिसमें साधारण या मिश्र वाक्यों का मेल हो; इसके मुख्य वाक्य एक-दूसरे पर आश्रित नहीं होते, इसलिए उन्हें <b>समानाधिकरण उपवाक्य<\/b> कहते हैं। &ldquo;संपूर्ण प्रजा अब शांतिपूर्वक व्यवहार करती है <b>और<\/b> जातिद्वेष क्रमशः घटता जाता है&rdquo; (दो साधारण वाक्य)।<\/p>\n<p><b>जोड़नेवाले शब्द (योजक):<\/b> और, तथा, एवं, या, अथवा, पर, परंतु, किंतु, लेकिन, इसलिए, अतः, नहीं तो। ये गुरु के <b>समानाधिकरण समुच्चयबोधक<\/b> हैं (अंक २४४, पृ. २१६)।<\/p>\n<h3>मिश्र वाक्य<\/h3>\n<p>गुरु (अंक ६८०-ख, पृ. ६०५): जिस वाक्य में मुख्य उद्देश्य और मुख्य विधेय के सिवा एक या अधिक समापिका क्रियाएँ हों। उदाहरण: &ldquo;जब लड़का पाँच बरस का हुआ तब पिता ने उसे मदरसे को भेजा।&rdquo; यहाँ &lsquo;तब पिता ने उसे मदरसे को भेजा&rsquo; मुख्य उपवाक्य है और &lsquo;जब लड़का पाँच बरस का हुआ&rsquo; आश्रित।<\/p>\n<p>गुरु: &ldquo;आश्रित उपवाक्य स्वयं सार्थक नहीं होते, पर मुख्य वाक्य के साथ आने से उनका अर्थ निकलता है।&rdquo; आश्रित उपवाक्य को जोड़नेवाले शब्द: कि, क्योंकि, यदि&mdash;तो, जब&mdash;तब, जहाँ&mdash;वहाँ, जो&mdash;वह, ताकि, यद्यपि&mdash;तथापि। ये <b>व्यधिकरण समुच्चयबोधक<\/b> या संबंधवाचक शब्द हैं।<\/p>\n<h3>आश्रित उपवाक्य के तीन भेद (गुरु, अंक ६९९–७०१, पृ. ६२०–६२३)<\/h3>\n<div class=\"def\">आश्रित उपवाक्य जिस शब्द-भेद के बदले आता है, उसी के नाम से जाना जाता है। इसलिए ठीक <b>तीन ही भेद<\/b> होते हैं: संज्ञा-उपवाक्य, विशेषण-उपवाक्य और क्रियाविशेषण-उपवाक्य। क्रिया के बदले कोई उपवाक्य नहीं आ सकता, इसलिए चौथा भेद नहीं होता (अंक ७०१)।<\/div>\n<table>\n<tr><th>भेद<\/th><th>किसके बदले<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>संज्ञा-उपवाक्य<\/td><td>मुख्य उपवाक्य की संज्ञा (उद्देश्य, कर्म, पूर्ति) के बदले; बहुधा &lsquo;कि&rsquo; से<\/td><td>मैंने सुना है <b>कि आपके देश में अच्छा राज-प्रबंध है<\/b>।<\/td><\/tr>\n<tr><td>विशेषण-उपवाक्य<\/td><td>किसी संज्ञा की विशेषता बताता है; बहुधा &lsquo;जो&rsquo; से<\/td><td><b>जो मनुष्य धनवान् होता है<\/b>, उसे सभी चाहते हैं।<\/td><\/tr>\n<tr><td>क्रियाविशेषण-उपवाक्य<\/td><td>मुख्य क्रिया की विशेषता (समय, स्थान, कारण, शर्त) बताता है<\/td><td><b>जब सबेरा हुआ<\/b> तब हम बाहर गए।<\/td><\/tr>\n<\/table>\n<p><b>कैसे पहचानें (गुरु की युक्ति, पृ. ६२१–६२२):<\/b> आश्रित उपवाक्य को हटाकर उसकी जगह एक शब्द रखकर देखिए।<\/p>\n<ul>\n<li>&ldquo;<i>जो मनुष्य धनवान् होता है<\/i> उसे सभी चाहते हैं&rdquo; &rarr; &ldquo;<i>धनवान्<\/i> मनुष्य को सभी चाहते हैं&rdquo;: विशेषण आया, इसलिए <b>विशेषण-उपवाक्य<\/b>।<\/li>\n<li>&ldquo;<i>जब सबेरा हुआ<\/i> तब हम बाहर गए&rdquo; &rarr; &ldquo;<i>सबेरे<\/i> हम बाहर गए&rdquo;: क्रियाविशेषण आया, इसलिए <b>क्रियाविशेषण-उपवाक्य<\/b>।<\/li>\n<li>&ldquo;तुमको कब योग्य है <i>कि वन में बसो<\/i>&rdquo; &rarr; &ldquo;तुमको <i>वन में बसना<\/i> कब योग्य है&rdquo;: संज्ञा-वाक्यांश आया, इसलिए <b>संज्ञा-उपवाक्य<\/b>।<\/li>\n<\/ul>\n<p>गुरु का नियम: जब आश्रित उपवाक्यों की जगह उसी जाति का शब्द रख दें तो मिश्र वाक्य <b>साधारण<\/b> हो जाता है, और उलटा करने पर साधारण वाक्य <b>मिश्र<\/b> बन जाता है (पृ. ६२२)।<\/p>\n<p><b>संज्ञा-उपवाक्य किन स्थानों पर आता है<\/b> (अंक ७०२, पृ. ६२३): उद्देश्य (&lsquo;मालूम होता है कि हिंदू लोग इसी घाटी से आए थे&rsquo;), कर्म (&lsquo;वह जानती भी नहीं कि धर्म किसे कहते हैं&rsquo;), पूर्ति (&lsquo;मेरा विचार है कि हिंदी का साप्ताहिक पत्र निकालूँ&rsquo;) और समानाधिकरण शब्द के रूप में।<\/p>\n<div class=\"trap\"><b>नामों का फ़र्क:<\/b> गुरु का &lsquo;साधारण&rsquo; वाक्य = स्कूल का &lsquo;सरल&rsquo; वाक्य। गुरु के अनुसार <b>संयुक्त<\/b> वाक्य साधारण और मिश्र वाक्यों का मेल हो सकता है, यानी संयुक्त के भीतर मिश्र भी रह सकता है (अंक ६८०-ग)। स्कूल की परीक्षा में आम तौर पर &lsquo;और/परंतु/या&rsquo; से जुड़े बराबर के वाक्य संयुक्त और &lsquo;कि/जो/जब/यदि&rsquo; वाले मिश्र माने जाते हैं।<\/div>\n\n<h3>रचना-भेद पहचानने की कसौटी<\/h3>\n<ol class=\"steps\">\n<li>वाक्य में <b>समापिका क्रियाएँ गिनिए<\/b>। एक ही हो तो साधारण/सरल।<\/li>\n<li>एक से अधिक हों तो देखिए कि क्रियाएँ <b>बराबर महत्व<\/b> की हैं (और, पर, या से जुड़ीं) &rarr; संयुक्त।<\/li>\n<li>अगर एक उपवाक्य बिना दूसरे के अधूरा लगे (कि, जो, जब, यदि, क्योंकि से शुरू) &rarr; मिश्र।<\/li>\n<\/ol>\n<table>\n<tr><th>वाक्य<\/th><th>भेद<\/th><th>कारण<\/th><\/tr>\n<tr><td>बिजली चमकती है।<\/td><td>सरल<\/td><td>एक क्रिया<\/td><\/tr>\n<tr><td>वर्षा हुई और नदियाँ भर गईं।<\/td><td>संयुक्त<\/td><td>दो स्वतंत्र उपवाक्य, &lsquo;और&rsquo;<\/td><\/tr>\n<tr><td>यदि वर्षा होगी तो फ़सल अच्छी होगी।<\/td><td>मिश्र<\/td><td>&lsquo;यदि&rsquo; वाला उपवाक्य आश्रित<\/td><\/tr>\n<tr><td>वह जानता है कि मैं आऊँगा।<\/td><td>मिश्र (संज्ञा-उपवाक्य)<\/td><td>&lsq
