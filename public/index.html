(रूप-रचना)<\/h2>\n<p>गुरु बताते हैं कि संज्ञाओं की तरह सर्वनामों में वचन और कारक होते हैं, पर <b>लिंग<\/b> के कारण रूप नहीं बदलता (पृ. २९५)। यानी 'मैं' पुरुष या स्त्री दोनों के लिए एक-सा है, पर क्रिया बदलती है: 'मैं गया' / 'मैं गई'।<\/p>\n<ul>\n<li><b>विभक्ति-रहित बहुवचन:<\/b> केवल मैं-हम, तू-तुम, यह-ये, वह-वे बदलते हैं। आप, जो, कौन, क्या, सो, कोई, कुछ नहीं बदलते (पृ. २९५)।<\/li>\n<li><b>विकृत रूप:<\/b> विभक्ति आने पर रूप बदलता है। मैं→मुझ, तू→तुझ; यह→इस; वह→उस; जो→जिस; कौन→किस; कोई→किसी। बहुवचन में प्रायः 'हम, तुम, इन, उन, जिन, किन'।<\/li>\n<li><b>कर्म और संप्रदान:<\/b> 'आप', 'कोई', 'क्या', 'कुछ' को छोड़ शेष सर्वनामों में 'को' के अलावा एक और रूप आता है (एकवचन में 'ए', बहुवचन में 'एँ'): <b>मुझको / मुझे, हमको / हमें, तुझे, तुम्हें, उसे, उन्हें, इसे, किसे, जिसे<\/b> (पृ. २९६)।<\/li>\n<li><b>कर्ता 'ने':<\/b> विकृत रूप में 'ने' जुड़ता है: मैंने, तूने, हमने, तुमने, उसने, उन्होंने, इसने, किसने, जिसने। निजवाचक 'आप' के साथ 'ने' नहीं आता (पृ. २९८)।<\/li>\n<li><b>संबंध कारक:<\/b> पुरुषवाचक सर्वनामों में का-के-की के बदले रा-रे-री: मेरा, तेरा, हमारा, तुम्हारा। निजवाचक में ना-ने-नी: अपना, अपने, अपनी (पृ. २९६)।<\/li>\n<li><b>संबोधन:<\/b> सर्वनामों में संबोधन कारक नहीं होता, क्योंकि पुकारते समय नाम लिया जाता है (पृ. २९६)।<\/li>\n<\/ul>\n<table>\n<tr><th>कारक<\/th><th>मैं (एकवचन)<\/th><th>हम (बहुवचन)<\/th><\/tr>\n<tr><td>कर्ता<\/td><td>मैं, मैंने<\/td><td>हम, हमने<\/td><\/tr>\n<tr><td>कर्म / संप्रदान<\/td><td>मुझको, मुझे<\/td><td>हमको, हमें<\/td><\/tr>\n<tr><td>करण / अपादान<\/td><td>मुझसे<\/td><td>हमसे<\/td><\/tr>\n<tr><td>संबंध<\/td><td>मेरा, मेरे, मेरी<\/td><td>हमारा, हमारे, हमारी<\/td><\/tr>\n<tr><td>अधिकरण<\/td><td>मुझमें, मुझपर<\/td><td>हममें, हमपर<\/td><\/tr>\n<\/table>\n<p>निजवाचक 'आप' का विकृत रूप 'अपना' है। कर्म, करण, अधिकरण में 'अपने' या 'आप' के साथ विभक्ति: अपनेको, आपको, अपनेसे, अपनेमें (पृ. २९८)। अवधारण के लिए विभक्ति के साथ 'ही': मुझीको, तुझीसे, हमींने।<\/p>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li>सबसे पहले देखें कि शब्द <b>किसके बदले<\/b> है। संज्ञा के बदले हो तो सर्वनाम; संज्ञा के साथ आकर उसकी विशेषता बताए तो सार्वनामिक विशेषण।<\/li>\n<li>वक्ता, श्रोता या किसी तीसरे का सीधा बोध हो तो पुरुषवाचक (मैं, तू, तुम, वह, वे)।<\/li>\n<li>'आप' दिखे तो वाक्य में कर्ता खोजें। कर्ता अलग मौजूद हो और 'आप' का अर्थ 'स्वयं' निकले तो निजवाचक। श्रोता को आदर से कहा गया हो तो आदरसूचक।<\/li>\n<li>अपना, अपने, स्वयं, खुद, आपस दिखें तो निजवाचक।<\/li>\n<li>यह, वह, सो पास-दूर की निश्चित वस्तु बताएँ तो निश्चयवाचक।<\/li>\n<li>'जो' के बाद 'वह' या 'सो' वाला दूसरा उपवाक्य हो तो संबंधवाचक।<\/li>\n<li>प्रश्न का भाव हो (कौन, क्या) तो प्रश्नवाचक।<\/li>\n<li>कोई या कुछ अनिश्चित बोध दे, प्रश्न नहीं हो, तो अनिश्चयवाचक।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table>\n<tr><th>जोड़ा<\/th><th>अंतर<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>आदरसूचक आप / निजवाचक आप<\/td><td>श्रोता को आदर से कहा गया 'आप' / कर्ता का 'स्वयं'<\/td><td>आप बैठिए / लड़के आप ही गए<\/td><\/tr>\n<tr><td>कोई / कौन<\/td><td>अनिश्चित / प्रश्न<\/td><td>कोई आया है / कौन आया है?<\/td><\/tr>\n<tr><td>कुछ / क्या<\/td><td>अनिश्चित पदार्थ / प्रश्न<\/td><td>कुछ खाओ / क्या खाओगे?<\/td><\/tr>\n<tr><td>सर्वनाम / सार्वनामिक विशेषण<\/td><td>अकेला है या संज्ञा के साथ<\/td><td>वह आया / वह लड़का आया<\/td><\/tr>\n<tr><td>जो (संबंधवाचक) / जो (वाक्य में 'यदि')<\/td><td>नित्य-संबंधी 'वह/सो' के साथ संबंधवाचक<\/td><td>जो पढ़ेगा, वह पास होगा<\/td><\/tr>\n<tr><td>तू / तुम / आप<\/td><td>निरादर या प्यार / सामान्य / आदर<\/td><td>तू आ / तुम आओ / आप आइए<\/td><\/tr>\n<\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n<h3>HTET 2020 Q31<\/h3>\n<p>प्रश्न: निजवाचक सर्वनाम युक्त वाक्य छाँटिए: (A) आप अत्यन्त आकर्षक व्यक्तित्व के स्वामी हैं। (B) लड़के आप ही चले जाएँगे। (C) आप लोग शान्त हो जाएँ। (D) आप हुजूर ज़रूर पधारें।<\/p>\n<div class=\"ex\"><b>उत्तर: (B)।<\/b> (A), (C) और (D) में 'आप' श्रोता के लिए आदर में आया है। (A) में 'आप' अकेला है, (C) में 'आप लोग' बहुत्व और आदर के लिए है, (D) में 'आप हुजूर' आदर की अधिकता है। ये सब आदरसूचक पुरुषवाचक (मध्यम पुरुष) हैं। (B) में कर्ता 'लड़के' पहले से मौजूद है और 'आप ही' का अर्थ 'स्वयं' है, यानी 'लड़के स्वयं चले जाएँगे'। गुरु के अनुसार निजवाचक 'आप' अवधारण (ज़ोर) के लिए 'ही' के साथ आता है (पृ. ११६)। इसलिए (B) निजवाचक है।<\/div>\n<h3>HTET 2022 Q32<\/h3>\n<p>प्रश्न: किस विकल्प में निजवाचक सर्वनाम का प्रयोग हुआ है? (A) हमें अपना काम स्वयं करना चाहिए। (B) तेते पाँव पसारिये, जेती लाँबी सौर। (C) हम किसी का कुछ नहीं बिगाड़ सकते। (D) जैसा करोगे, वैसा ही भरोगे।<\/p>\n<div class=\"ex\"><b>उत्तर: (A)।<\/b> (A) में 'अपना' (आप का विकृत रूप, संबंध कारक) और 'स्वयं' दोनों निजवाचक हैं। 'हमें' पुरुषवाचक है। (B) में 'तेते', 'जेती' यौगिक सार्वनामिक विशेषण (परिमाणवाचक) हैं, निजवाचक नहीं। (C) में 'किसी' और 'कुछ' अनिश्चयवाचक हैं। (D) में 'जैसा-वैसा' यौगिक सार्वनामिक विशेषण (संबंधवाचक रूप) हैं। केवल (A) में कर्ता से जुड़ा 'अपना/स्वयं' है।<\/div>\n<h3>HTET 2023 Q43<\/h3>\n<p>प्रश्न: सर्वनाम के संबंध में कौन-सा कथन असत्य है? (A) प्रयोग के आधार पर सर्वनाम के छह भेद हैं। (B) 'कोई' तथा 'कुछ' अनिश्चयवाचक सर्वनाम शब्द हैं। (C) 'पुरुषवाचक' सर्वनाम के चार भेद माने जाते हैं। (D) जिस सर्वनाम से वक्ता के पास अथवा दूर की किसी वस्तु का बोध होता है, उसे निश्चयवाचक सर्वनाम कहते हैं।<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> (A) सही: पुरुषवाचक, निजवाचक, निश्चयवाचक, अनिश्चयवाचक, संबंधवाचक, प्रश्नवाचक (गुरु, पृ. १०६)। (B) सही: कोई और कुछ अनिश्चयवाचक हैं (पृ. १२१)। (D) सही: यह गुरु की निश्चयवाचक की परिभाषा है (पृ. ११८)। (C) असत्य: पुरुष तीन ही हैं (उत्तम, मध्यम, अन्य), इसलिए पुरुषवाचक के भेद तीन हैं।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>सर्वनाम संज्ञा के बदले आता है; बार-बार संज्ञा दोहराने से बचाता है। उसका अर्थ प्रसंग से तय होता है।<\/li>\n<li>गुरु के 11 सर्वनाम: मैं, तू, आप, यह, वह, सो, जो, कोई, कुछ, कौन, क्या। प्रयोग के आधार पर 6 भेद।<\/li>\n<li>पुरुष तीन: उत्तम (मैं, हम), मध्यम (तू, तुम, आप), अन्य (वह, वे, यह, जो...)। पुरुषवाचक के तीन भेद, चार नहीं।<\/li>\n<li>आदरसूचक 'आप': मध्यम/अन्य पुरुष, अकेला आता है, बहुवचन क्रिया। निजवाचक 'आप': कर्ता 'स्वयं', तीनों पुरुषों में, किसी संज्ञा/सर्वनाम के साथ।<\/li>\n<li>अपना, अपने, स्वयं, खुद, आपस निजवाचक के रूप या साथी हैं।<\/li>\n<li>निश्चयवाचक: यह, वह, सो। अनिश्चयवाचक: कोई (प्राणी), कुछ (पदार्थ)। प्रश्नवाचक: कौन (प्राणी), क्या (पदार्थ)। संबंधवाचक: जो (नित्य-संबंधी वह/सो के साथ)।<\/li>\n<li>सर्वनाम अकेला हो तो सर्वनाम; संज्ञा के साथ हो तो सार्वनामिक विशेषण (वह नौकर, कोई नौकर, कौन मनुष्य)।<\/li>\n<li>मैं, तू, आप संज्ञा के साथ आकर विशेषण नहीं बनते।<\/li>\n<li>इतना, उतना, जितना, कितना और ऐसा, वैसा, जैसा, कैसा यौगिक सार्वनामिक विशेषण हैं।<\/li>\n<li>सर्वनाम का रूप लिंग से नहीं बदलता; वचन और कारक से बदलता है: मैंने, मुझे/मुझको, मुझसे, मेरा, हमें, उसने, उन्हें।<\/li>\n<li>सर्वनामों में संबोधन कारक नहीं होता; निजवाचक 'आप' के साथ 'ने' नहीं आता।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: 'लड़का आप आया था' में 'आप' है: (A) आदरसूचक पुरुषवाचक (B) निजवाचक (C) प्रश्नवाचक (D) संबंधवाचक<\/summary><p><b>उत्तर: (B)<\/b> 'आप' का अर्थ 'स्वयं' है और कर्ता 'लड़का' अलग शब्द है। निजवाचक 'आप' किसी संज्ञा के साथ आता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: 'जो परिश्रम करेगा, वह सफल होगा' में 'जो' है: (A) संबंधवाचक (B) निश्चयवाचक (C) प्रश्नवाचक (D) निजवाचक<\/summary><p><b>उत्तर: (A)<\/b> 'जो' दो उपवाक्यों को जोड़ता है और 'वह' से नित्य संबंध रखता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: सर्वनाम के संबंध में कौन-सा कथन गलत है? (A) भेद छह हैं (B) 'तुम' मध्यम पुरुष है (C) पुरुषवाचक के पाँच भेद हैं (D) 'कौन' प्रश्नवाचक है<\/summary><p><b>उत्तर: (C)<\/b> पुरुष तीन हैं: उत्तम, मध्यम, अन्य।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: अनिश्चयवाचक सर्वनाम वाला वाक्य: (A) कौन आया है? (B) कोई द्वार खटखटा रहा है। (C) वह घर गया। (D) जो पढ़ेगा, वही पास होगा।<\/summary><p><b>उत्तर: (B)<\/b> 'कोई' किसी अनिश्चित व्यक्ति का बोध कराता है। (A) में 'कौन' प्रश्नवाचक है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: 'यह पुस्तक बहुत अच्छी है' में 'यह' क्या है? (A) सर्वनाम (B) सार्वनामिक विशेषण (C) क्रियाविशेषण (D) संबंधबोधक<\/summary><p><b>उत्तर: (B)<\/b> 'यह' संज्ञा 'पुस्तक' के साथ आकर उसकी विशेषता (निश्चय) बता रहा है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: कौन-सा सर्वनाम केवल पदार्थ या धर्म के बारे में प्रश्न करता है? (A) कौन (B) कोई (C) क्या (D) कुछ<\/summary><p><b>उत्तर: (C)<\/b> 'क्या' प्रश्नवाचक है और पदार्थ या धर्म के लिए आता है; 'कौन' प्राणी (विशेषकर मनुष्य) के लिए। 'कोई' और 'कुछ' अनिश्चयवाचक हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: 'वह अपने को सुधार रहा है' में 'अपने' है: (A) पुरुषवाचक (B) निजवाचक (C) संबंधवाचक (D) प्रश्नवाचक<\/summary><p><b>उत्तर: (B)<\/b> 'अपने' निजवाचक 'आप' का विकृत रूप है (अपना, अपने, अपनी) और कर्ता 'वह' का ही बोध कराता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: 'उसने मुझे बुलाया' में रेखांकित शब्दों का क्रम है: (A) अन्य पुरुष, उत्तम पुरुष (B) उत्तम, मध्यम (C) मध्यम, अन्य (D) दोनों उत्तम<\/summary><p><b>उत्तर: (A)<\/b> 'उसने' (वह का विकृत रूप + ने) अन्य पुरुष है; 'मुझे' (मैं का विकृत रूप) उत्तम पुरुष है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: 'आप' का वह प्रयोग जो केवल मध्यम और अन्य पुरुष में आता है और सदा बहुवचन क्रिया लेता है: (A) निजवाचक (B) आदरसूचक (C) निश्चयवाचक (D) संबंधवाचक<\/summary><p><b>उत्तर: (B)<\/b> गुरु के अनुसार आदरसूचक 'आप' केवल मध्यम और अन्य पुरुष में आता है; निजवाचक 'आप' तीनों पुरुषों में।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: 'कितना काम बचा है?' में 'कितना' क्या है? (A) सर्वनाम (B) यौगिक सार्वनामिक विशेषण (C) संज्ञा (D) क्रिया<\/summary><p><b>उत्तर: (B)<\/b> 'कौन' से बना 'कितना' संज्ञा 'काम' के साथ आकर उसका परिमाण पूछ रहा है। इसे परिमाणवाचक सार्वनामिक विशेषण कहते हैं।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामताप्रसाद गुरु, <i>हिंदी व्याकरण<\/i>, हिंदी विकिस्रोत, पृष्ठ <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१०५\">१०५–१०७<\/a> (परिभाषा, ११ सर्वनाम, ६ भेद, पुरुष), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१०८\">१०८–११५<\/a> (मैं, हम, तू, तुम, वह, वे, आदरसूचक आप), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/११६\">११६–११८<\/a> (निजवाचक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/११८\">११८–१२१<\/a> (निश्चयवाचक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१२१\">१२१–१२४<\/a> (अनिश्चयवाचक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१२५\">१२५–१२८<\/a> (संबंधवाचक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१२८\">१२८–१३१<\/a> (प्रश्नवाचक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१३५\">१३५<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१३८\">१३८–१४०<\/a> (सार्वनामिक विशेषण), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२९५\">२९५–२९८<\/a> (सर्वनाम की कारक-रचना); पिछले HTET प्रश्न (2020–2023)। 'स्वयं/खुद' को निजवाचक गिनना और जैसा-वैसा आदि को सर्वनाम सूची में रखना स्कूली पुस्तकों की परिपाटी है।<\/p>\n","hin-adj":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2020 से 2024 तक हर साल 1 प्रश्न, कुल 4: <b>अनिश्चित संख्यावाचक विशेषण<\/b> पहचानना (2020), <b>संज्ञा से बना विशेषण<\/b> (2022: पशु से पाशविक), <b>तुलना की अवस्थाएँ<\/b> (2023: 'पवित्रतम' उत्तमावस्था है) और <b>सार्वनामिक विशेषण<\/b> पहचानना (2024)। 2023 के प्रश्न में 'परिश्रमी' और 'आलस्य' जैसे शब्दों से भी विशेषण और भाववाचक संज्ञा का मेल जाँचा गया। इसलिए इस पृष्ठ के पाँच भाग सबसे ज़रूरी हैं: संख्यावाचक के भेद, परिमाणवाचक बनाम अनिश्चित संख्यावाचक, सार्वनामिक विशेषण, तुलना की अवस्थाएँ और विशेषण बनाने के प्रत्यय।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जो शब्द संज्ञा (या सर्वनाम) की विशेषता बताए, उसे <b>विशेषण<\/b> कहते हैं। जिसकी विशेषता बताई जाए, वह <b>विशेष्य<\/b> है। जैसे: \"ठंडी हवा चली।\" में 'ठंडी' विशेषण और 'हवा' विशेष्य है।<\/div>\n<p>गुरु की परिभाषा: \"जिस विकारी शब्द से संज्ञा की व्याप्ति मर्यादित होती है, उसे विशेषण कहते हैं; जैसे बड़ा, काला, दयालु, भारी, एक, दो, सब\" (पृ. १३६)। और: \"विशेषण के योग से जिस संज्ञा की व्याप्ति मर्यादित होती है उसे विशेष्य कहते हैं\" (पृ. १३८)।<\/p>\n<h3>'व्याप्ति मर्यादित करना' का अर्थ<\/h3>\n<p>व्याप्ति यानी वह दायरा जिसमें संज्ञा लागू होती है। 'घोड़ा' कहने से दुनिया के सब घोड़ों का बोध होता है। 'काला घोड़ा' कहने से केवल काले घोड़ों का। 'दौड़ता हुआ काला घोड़ा' और भी कम का। हर विशेषण के जुड़ने से दायरा घटता जाता है (पृ. १३७)। यही विशेषण का मूल काम है। एक रोज़ की मिसाल: भीड़ में किसी दोस्त को ढूँढ़ना हो तो कहते हैं, 'वह लंबा, चश्मे वाला लड़का'। हर विशेषण भीड़ को छोटा करता जाता है।<\/p>\n<p><b>दो ज़रूरी अपवाद (गुरु, पृ. १३७):<\/b> व्यक्तिवाचक संज्ञा के साथ विशेषण दायरा नहीं घटाता, क्योंकि वह संज्ञा पहले से एक ही व्यक्ति है। 'पतिव्रता सीता', 'प्रतापी भोज', 'दयालु ईश्वर' में विशेषण केवल अर्थ को स्पष्ट करता है। इसी तरह जातिवाचक संज्ञा के साथ उसका साधारण धर्म बताने वाला विशेषण भी दायरा नहीं घटाता: 'मूक पशु', 'ठंडी बर्फ', 'काला कौआ'।<\/p>\n<p><b>प्रविशेषण (स्कूली शब्द):<\/b> जो शब्द विशेषण की भी विशेषता बताए, उसे स्कूली व्याकरण में प्रविशेषण कहते हैं। जैसे 'बहुत मीठा आम' में 'बहुत' प्रविशेषण, 'मीठा' विशेषण और 'आम' विशेष्य है। गुरु की पुस्तक में 'प्रविशेषण' शब्द नहीं मिलता; यह स्कूली परिपाटी है।<\/p>\n\n<h2>मूल अवधारणा: विशेषण का प्रयोग और भेदों की रूपरेखा<\/h2>\n<h3>विशेष्य-विशेषण और विधेय-विशेषण (पृ. १३८)<\/h3>\n<p>गुरु के अनुसार विशेषण का प्रयोग दो तरह से होता है: संज्ञा के साथ और क्रिया के साथ। पहले को <b>विशेष्य-विशेषण<\/b> कहते हैं, दूसरे को <b>विधेय-विशेषण<\/b>।<\/p>\n<table>\n<tr><th>प्रकार<\/th><th>स्थिति<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>विशेष्य-विशेषण<\/td><td>विशेष्य के ठीक पहले; वाक्य के उद्देश्य में<\/td><td>ठंडी हवा चली। सुंदर फूल खिला।<\/td><\/tr>\n<tr><td>विधेय-विशेषण<\/td><td>क्रिया के साथ; विधेय में<\/td><td>यह बात सच है। यह ब्राह्मण चपल है। संसार सूना देख पड़ता है।<\/td><\/tr>\n<\/table>\n<p><b>पहचान:<\/b> विशेषण हटाने पर क्या होता है? 'ठंडी हवा चली' से 'ठंडी' हटाएँ तो 'हवा चली' बचता है, यानी विशेषण विशेष्य के साथ जुड़ा था। 'यह बात सच है' में 'सच' हटाएँ तो वाक्य अधूरा रह जाता है, क्योंकि वह विधेय का हिस्सा है। गुरु कहते हैं कि विधेय-विशेषण 'समानाधिकरण' होता है: 'यह ब्राह्मण चपल है' में 'यह' के कारण 'ब्राह्मण' की व्यापकता घट चुकी है, 'चपल' उसे और कम नहीं करता, केवल एक नई बात बताता है।<\/p>\n<h3>भेदों की रूपरेखा<\/h3>\n<div class=\"cards\">\n<div><h3>गुणवाचक<\/h3><p>गुण, दशा, रंग, आकार, स्थान, काल<\/p><p class=\"eq\"><span>भला<\/span> <span>लाल<\/span> <span>पुराना<\/span><\/p><\/div>\n<div><h3>संख्यावाचक<\/h3><p>संख्या या गिनती का बोध<\/p><p class=\"eq\"><span>दो<\/span> <span>पहला<\/span> <span>कई<\/span><\/p><\/div>\n<div><h3>परिमाणवाचक<\/h3><p>माप या तौल का बोध<\/p><p class=\"eq\"><span>दो सेर<\/span> <span>थोड़ा<\/span> <span>सारा<\/span><\/p><\/div>\n<div><h3>सार्वनामिक<\/h3><p>सर्वनाम जो संज्ञा के साथ आए<\/p><p class=\"eq\"><span>यह घर<\/span> <span>कौन मनुष्य<\/span><\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>गुरु बनाम स्कूली पुस्तकें:<\/b> स्कूली पुस्तकों में विशेषण के चार भेद पढ़ाए जाते हैं: गुणवाचक, संख्यावाचक, परिमाणवाचक, सार्वनामिक। गुरु तीन मुख्य भेद मानते हैं: सार्वनामिक, गुणवाचक और संख्यावाचक (पृ. १३८, १४५)। वे परिमाणबोधक को संख्यावाचक के तीन उपभेदों (निश्चित संख्यावाचक, अनिश्चित संख्यावाचक, परिमाणबोधक) में गिनते हैं। HTET में 'अनिश्चित संख्यावाचक' और 'परिमाणवाचक' दोनों के विकल्प आते हैं, इसलिए दोनों नाम याद रखिए।<\/div>\n\n<h2>गुणवाचक विशेषण<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जो विशेषण संज्ञा के गुण, दशा, रंग, आकार, स्थान या काल का बोध कराए, वह गुणवाचक है।<\/div>\n<p>गुरु के अनुसार गुणवाचक विशेषणों की संख्या सब विशेषणों से अधिक होती है (पृ. १४३)। उनके मुख्य अर्थ:<\/p>\n<table>\n<tr><th>अर्थ<\/th><th>उदाहरण<\/th><th>भाव<\/th><\/tr>\n<tr><td>काल<\/td><td>नया, पुराना, ताज़ा, प्राचीन, अगला, पिछला, आगामी<\/td><td>कब का<\/td><\/tr>\n<tr><td>स्थान<\/td><td>लंबा, चौड़ा, ऊँचा, नीचा, गहरा, तिरछा, भीतरी, बाहरी<\/td><td>कहाँ या कितना फैला<\/td><\/tr>\n<tr><td>आकार<\/td><td>गोल, चौकोर, सुडौल, सुंदर, नुकीला<\/td><td>कैसा बना<\/td><\/tr>\n<tr><td>रंग<\/td><td>लाल, पीला, नीला, हरा, सफ़ेद, काला, सुनहरी<\/td><td>किस रंग का<\/td><\/tr>\n<tr><td>दशा<\/td><td>दुबला, मोटा, भारी, गीला, सूखा, गरीब, उद्यमी, रोगी, पालतू<\/td><td>किस हालत में<\/td><\/tr>\n<tr><td>गुण<\/td><td>भला, बुरा, उचित, सच, झूठ, पापी, दानी, दुष्ट, शांत<\/td><td>कैसे स्वभाव का<\/td><\/tr>\n<\/table>\n<h3>गुणवाचक की विशेष बातें (पृ. १४४–१४५)<\/h3>\n<ul>\n<li><b>'सा' प्रत्यय:<\/b> गुणवाचक के साथ हीनता के अर्थ में जुड़ता है: 'बड़ा-सा पेड़', 'ऊँची-सी दीवार'। इसका अर्थ 'कुछ' या 'थोड़ा' होता है, जैसे 'भारी-सा सिर'।<\/li>\n<li><b>'नाम' या 'नामक', 'संबंधी', 'रूपी'<\/b> संज्ञा के साथ मिलकर विशेषण बन जाते हैं: 'बाहुक-नाम सारथी', 'परतप-नामक राजा', 'घर-संबंधी काम', 'तृष्णा-रूपी नदी'।<\/li>\n<li><b>सरीखा, समान, तुल्य, योग्य:<\/b> समानता और योग्यता बताते हैं। 'सरीखा' संबंधसूचक की तरह भी आता है: 'हरिश्चंद्र सरीखा दानी'।<\/li>\n<li><b>संज्ञा का संबंध कारक विशेषण का काम करता है:<\/b> 'घरू झगड़ा' = 'घर का झगड़ा'; 'जंगली जानवर' = 'जंगल का जानवर'।<\/li>\n<li><b>विशेष्य का लोप:<\/b> जब विशेष्य छिपा हो तो विशेषण संज्ञा बन जाता है: 'बड़ों का आदर करो', 'दीनों को मत सताओ', 'ठंडे में'।<\/li>\n<\/ul>\n<div class=\"trap\"><b>ध्यान दें:<\/b> 'परिश्रमी', 'रोगी', 'उद्यमी', 'शक्तिशाली', 'दानी' गुणवाचक विशेषण हैं, भाववाचक संज्ञा नहीं (2023 Q31 के विकल्प 'परिश्रमी: गुणवाचक विशेषण' सही है)। इनकी भाववाचक संज्ञा 'परिश्रम', 'रोग', 'शक्ति' आदि हैं।<\/div>\n\n<h2>संख्यावाचक विशेषण<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जो विशेषण संज्ञा की संख्या (गिनती) बताए, वह संख्यावाचक है। गुरु के अनुसार इसके मुख्य तीन भेद हैं: निश्चित संख्यावाचक, अनिश्चित संख्यावाचक और परिमाणबोधक (पृ. १४५)।<\/div>\n<h3>क. निश्चित संख्यावाचक (पाँच उपभेद, पृ. १४५–१५३)<\/h3>\n<p>जिससे वस्तुओं की निश्चित संख्या का बोध हो: एक लड़का, पच्चीस रुपये, दसवाँ भाग, दूना मोल, पाँचों इंद्रियाँ, हर आदमी (पृ. १४५)।<\/p>\n<table>\n<tr><th>उपभेद<\/th><th>अर्थ और बनावट<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>गणनावाचक<\/td><td>गिनती बताता है। (1) पूर्णांक: एक, दो, चार, सौ, हज़ार। (2) अपूर्णांक: पाव, आधा, पौन, सवा, डेढ़, ढाई, साढ़े तीन<\/td><td>दो लड़के, आधा किलो, ढाई सौ, सवा सेर<\/td><\/tr>\n<tr><td>क्रमवाचक<\/td><td>क्रम बताता है। पहले चार अनियमित: पहला, दूसरा, तीसरा, चौथा; पाँच से आगे 'वाँ': पाँचवाँ, दसवाँ<\/td><td>पहला दिन, पाँचवाँ पाठ, बीसवाँ वर्ष<\/td><\/tr>\n<tr><td>आवृत्तिवाचक<\/td><td>कितने गुना है। पूर्णांक + 'गुना'; परत या प्रकार के लिए 'हरा'<\/td><td>दुगुना, तिगुना, चौगुना, सौगुना; इकहरा, दुहरा, तिहरा<\/td><\/tr>\n<tr><td>समुदायवाचक<\/td><td>पूरे समुदाय का बोध। पूर्णांक + 'ओं'<\/td><td>दोनों हाथ, चारों पाँव, आठों लड़के, चालीसों चोर<\/td><\/tr>\n<tr><td>प्रत्येकबोधक<\/td><td>कई वस्तुओं में से प्रत्येक का बोध। 'हर', 'प्रति', 'प्रत्येक' या संख्या की द्विरुक्ति<\/td><td>हर घड़ी, प्रत्येक बालक, एक-एक लड़का, दो-दो घंटे<\/td><\/tr>\n<\/table>\n<p><b>कुछ महत्त्वपूर्ण बातें (पृ. १४८–१५३):<\/b><\/p>\n<ul>\n<li>'पाव', 'पौन' अकेले आते हैं, पर एक से अधिक के साथ 'सवा' (सवा दो) और 'पौने' (पौने तीन) आते हैं। तीन और उससे ऊपर में आधे के लिए 'साढ़े' (साढ़े चार)। 'पौने' और 'साढ़े' अकेले नहीं आते।<\/li>\n<li>पूर्णांक के साथ 'एक' लगाने से 'लगभग' का अर्थ बनता है: 'दस एक आदमी' (लगभग दस)।<\/li>\n<li>अनिश्चय के लिए दो पूर्णांक साथ आते हैं: 'दो-चार दिन', 'दस-बीस रुपये', 'सौ-दो सौ आदमी'। 'बीस, पचास, सैकड़ा, हज़ार, लाख, करोड़' में 'ओं' जोड़ने से भी अनिश्चय: 'सैकड़ों रुपये', 'हज़ारों बरस'।<\/li>\n<li>'एकाध', 'एक-आध' अनिश्चय के लिए। 'दोनों' प्रायः सर्वनाम की तरह भी आता है। 'एक' का समुदायवाचक रूप 'अकेला' है।<\/li>\n<li>'पहला' (पहले चार नियम-रहित) और संस्कृत क्रमवाचक भी चलते हैं: प्रथम, द्वितीय, तृतीय, चतुर्थ। आवृत्तिवाचक के संस्कृत रूप: द्विगुण, त्रिगुण, चतुर्गुण।<\/li>\n<\/ul>\n<h3>ख. अनिश्चित संख्यावाचक (पृ. १५४–१५८)<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> जिस संख्यावाचक विशेषण से किसी निश्चित संख्या का बोध न हो, वह अनिश्चित संख्यावाचक है। इसका प्रयोग बहुवचन संज्ञा के साथ होता है। (गुरु, पृ. १५४)<\/div>\n<table>\n<tr><th>शब्द<\/th><th>पर्याय या विशेषता<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>सब<\/td><td>सर्व, सकल, समस्त, कुल; पूरी संख्या, पर अनिश्चित रूप से<\/td><td>सब लड़के, सब पेड़, सब के सब<\/td><\/tr>\n<tr><td>बहुत<\/td><td>'थोड़ा' का उलटा; बहुतसे, बहुत-सारे<\/td><td>बहुत आदमी, बहुतसे लोग<\/td><\/tr>\n<tr><td>अनेक, कई, नाना<\/td><td>'एक' का उलटा; कई एक, अनेकों<\/td><td>अनेक रोग, कई रंग<\/td><\/tr>\n<tr><td>अधिक, ज़्यादा; कम<\/td><td>तुलना में आते हैं<\/td><td>अधिक रुपया, कम दाम<\/td><\/tr>\n<tr><td>कुछ<\/td><td>'बहुत' का उलटा<\/td><td>कुछ लोग, कुछ फल, कुछ तारे<\/td><\/tr>\n<tr><td>दूसरा, अन्य, और<\/td><td>प्रकृत से भिन्न<\/td><td>दूसरी बात, अन्य पदार्थ<\/td><\/tr>\n<tr><td>आदि, इत्यादि, वगैरह<\/td><td>'और ऐसे ही दूसरे'<\/td><td>टोपी, रूमाल आदि<\/td><\/tr>\n<tr><td>अमुक, फ़लाना; कै<\/td><td>कोई एक; प्रश्नवाचक 'कितने' जैसा<\/td><td>अमुक बात, कै लड़के<\/td><\/tr>\n<\/table>\n<ul>\n<li>'एक' पूर्णांक होने पर भी अनिश्चय के लिए आता है ('एक दिन ऐसा हुआ')। 'एक-एक' कभी 'यह-वह' के अर्थ में सर्वनाम की तरह भी आता है।<\/li>\n<li>'अनेक' में 'ओं' जोड़कर 'अनेकों'; 'कई' के साथ 'एक': 'कई एक'।<\/li>\n<li>'आदि', 'इत्यादि' का प्रयोग: एक उदाहरण के बाद 'आदि', एक से अधिक के बाद 'इत्यादि' (गुरु की सूचना, पृ. १५८)।<\/li>\n<\/ul>\n<h3>ग. परिमाणबोधक या परिमाणवाचक (पृ. १५८–१६०)<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> जिस विशेषण से किसी वस्तु की नाप या तौल का बोध हो, वह परिमाणबोधक (परिमाणवाचक) है। (गुरु, पृ. १५८)<\/div>\n<p>गुरु के उदाहरण: और, सब, सारा, समूचा, अधिक (ज़्यादा), बहुत, बहुतेरा, कुछ (अल्प, किंचित, ज़रा), कम, थोड़ा, पूरा, अधूरा, यथेष्ट।<\/p>\n<h3>परिमाणवाचक बनाम अनिश्चित संख्यावाचक: वही शब्द, दो रूप (पृ. १५९)<\/h3>\n<p>गुरु का सूत्र: ये विशेषण <b>एकवचन संज्ञा के साथ परिमाणबोधक<\/b> और <b>बहुवचन संज्ञा के साथ अनिश्चित संख्यावाचक<\/b> होते हैं।<\/p>\n<table>\n<tr><th>परिमाणबोधक (एकवचन)<\/th><th>अनिश्चित संख्यावाचक (बहुवचन)<\/th><th>कसौटी<\/th><\/tr>\n<tr><td>बहुत दूध<\/td><td>बहुत आदमी<\/td><td>नाप बनाम गिनती<\/td><\/tr>\n<tr><td>सब जंगल<\/td><td>सब पेड़<\/td><td>एक पूरा बनाम अनेक<\/td><\/tr>\n<tr><td>सारा देश<\/td><td>सारे देश<\/td><td>एक देश बनाम कई देश<\/td><\/tr>\n<tr><td>बहुतेरा काम<\/td><td>बहुतेरे उपाय<\/td><td>काम (परिमाण) बनाम उपाय (गिनती)<\/td><\/tr>\n<tr><td>पूरा आनंद<\/td><td>पूरे टुकड़े<\/td><td>भाव बनाम गिनने योग्य<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>HTET का जाल:<\/b> 'अल्प', 'किंचित' और 'ज़रा' केवल परिमाणबोधक हैं (पृ. १५९)। 'थोड़ा-सा नमक' और 'सारा काम' (परिमाण) अनिश्चित संख्यावाचक नहीं हैं। 'सारे देश' (गिनी जा सकने वाली वस्तु, बहुवचन) अनिश्चित संख्यावाचक है। इसी को 2020 Q41 ने पूछा है।<\/div>\n<h3>निश्चित परिमाण कैसे बताएँ (पृ. १५९–१६०)<\/h3>\n<ul>\n<li>संख्यावाचक विशेषण के साथ परिमाण-बोधक संज्ञा: 'दो सेर घी', 'चार गज मलमल', 'दस हाथ जगह'। यहाँ 'दो सेर' को गुरु संख्यावाचक + परिमाण-संज्ञा मानते हैं; स्कूली पुस्तकें इसे निश्चित परिमाणवाचक कहती हैं।<\/li>\n<li>परिमाण-संज्ञा में 'ओं' जोड़ने से अनिश्चित परिमाण: 'ढेरों इलायची', 'मनों घी'।<\/li>\n<li>एक का परिमाण बताने को 'भर': 'गज-भर कपड़ा', 'तोले-भर सोना', 'हाथ-भर जगह'।<\/li>\n<li>निश्चय के अर्थ में 'सा': 'बहुतसा लाभ', 'थोड़ी-सी विद्या', 'ज़रा-सी बात'।<\/li>\n<\/ul>\n<p>कुछ परिमाणवाचक शब्द क्रियाविशेषण भी बनते हैं: 'नल ने दमयंती को बहुत समझाया' (बहुत समझाने की मात्रा बता रहा है, संज्ञा की नहीं)।<\/p>\n\n<h2>सार्वनामिक विशेषण<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> सर्वनाम जब अकेला न आकर संज्ञा के साथ आए और उसकी व्याप्ति सीमित करे, तब वह सार्वनामिक विशेषण है। (गुरु, पृ. १३८–१३९)<\/div>\n<p>पुरुषवाचक (मैं, तू) और निजवाचक (आप) को छोड़ बाकी सर्वनाम (यह, वह, सो, जो, कौन, क्या, कोई, कुछ) संज्ञा के साथ आने पर विशेषण का काम करते हैं।<\/p>\n<table>\n<tr><th>वाक्य<\/th><th>शब्द<\/th><th>क्या है<\/th><\/tr>\n<tr><td>नौकर आया है; वह बाहर खड़ा है।<\/td><td>वह<\/td><td>सर्वनाम (नौकर के बदले)<\/td><\/tr>\n<tr><td>वह नौकर नहीं आया।<\/td><td>वह<\/td><td>सार्वनामिक विशेषण<\/td><\/tr>\n<tr><td>किसी को बुलाओ।<\/td><td>किसी<\/td><td>सर्वनाम<\/td><\/tr>\n<tr><td>किसी ब्राह्मण को बुलाओ।<\/td><td>किसी<\/td><td>सार्वनामिक विशेषण<\/td><\/tr>\n<tr><td>यह पुस्तक किससे मँगवाऊँ?<\/td><td>यह; किससे<\/td><td>यह: विशेषण; किससे: सर्वनाम<\/td><\/tr>\n<tr><td>आपके घर से कल कोई नौकर आया था।<\/td><td>कोई<\/td><td>सार्वनामिक विशेषण (नौकर के साथ)<\/td><\/tr>\n<tr><td>जिसने परिश्रम किया, वह सफल हो गया।<\/td><td>जिसने, वह<\/td><td>दोनों सर्वनाम (अकेले आए)<\/td><\/tr>\n<\/table>\n<p><b>सूत्र:<\/b> सर्वनाम के ठीक बाद संज्ञा आए और सर्वनाम उसकी विशेषता बताए तो सार्वनामिक विशेषण; सर्वनाम स्वयं संज्ञा का स्थान ले तो सर्वनाम। 'मैं मोहनलाल इकरार करता हूँ' में 'मैं' विशेषण नहीं है (पृ. १३९)।<\/p>\n<h3>दो प्रकार (पृ. १३९–१४०)<\/h3>\n<ul>\n<li><b>मूल सार्वनामिक:<\/b> बिना रूप बदले संज्ञा के साथ आते हैं: यह घर, वह लड़का, कोई नौकर, कुछ काम, कौन मनुष्य, क्या बात।<\/li>\n<li><b>यौगिक सार्वनामिक:<\/b> मूल सर्वनामों में प्रत्यय लगने से बनते हैं: ऐसा आदमी, कैसा घर, उतना काम, जैसा देश वैसा भेष।<\/li>\n<\/ul>\n<table>\n<tr><th>सर्वनाम<\/th><th>परिमाणवाचक रूप<\/th><th>गुणवाचक रूप<\/th><\/tr>\n<tr><td>यह<\/td><td>इतना<\/td><td>ऐसा<\/td><\/tr>\n<tr><td>वह<\/td><td>उतना<\/td><td>वैसा<\/td><\/tr>\n<tr><td>जो<\/td><td>जितना<\/td><td>जैसा<\/td><\/tr>\n<tr><td>कौन<\/td><td>कितना<\/td><td>कैसा<\/td><\/tr>\n<\/table>\n<p>'निज' (अपना) और 'पराया' (दूसरे का) भी सार्वनामिक विशेषण हैं: निज देश, पराया माल (पृ. १४३)। परिमाणवाचक यौगिक रूप बहुवचन में संख्यावाचक हो जाते हैं: 'इतने गुणज्ञ लोग', 'जितने प्रजाजन' (पृ. १४२)। बिना विशेष्य के आने पर ये संज्ञा की तरह चलते हैं: 'जैसा करोगे वैसा पाओगे' (पृ. १४०–१४१)।<\/p>\n<div class=\"trap\"><b>सावधानी:<\/b> स्कूली पुस्तकें 'जो', 'कौन' आदि को विशेषण के बजाय केवल सर्वनाम की सूची में देती हैं। प्रश्न में वाक्य दिया हो तो शब्द की <b>स्थिति<\/b> (अकेला या संज्ञा के साथ) देखकर निर्णय करें। 'जिसने', 'किससे', 'जो' जैसे शब्द क्रिया-कर्ता के रूप में अकेले आएँ तो सर्वनाम ही हैं।<\/div>\n\n<h2>तुलना की अवस्थाएँ<\/h2>\n<p>गुरु के अनुसार हिंदी में विशेषणों की तुलना के लिए उनमें कोई विकार नहीं होता; अर्थ इन तरीकों से सूचित किया जाता है (पृ. ३१०–३१२):<\/p>\n<ul>\n<li><b>दो में तुलना:<\/b> जिससे तुलना हो उस नाम (उपमान) को अपादान कारक में रखते हैं: \"मारनेवाले से पालनेवाला बड़ा होता है।\" \"कारण ते कारज कठिन होइ।\"<\/li>\n<li><b>'अपेक्षा', 'बनिस्बत'<\/b> के साथ 'अधिक' या 'कम': \"राजकन्या से भी अधिक सुंदरी।\" \"लड़के की अपेक्षा लड़की कम प्यारी नहीं।\"<\/li>\n<li><b>'बढ़कर' या 'कहीं':<\/b> \"मुझसे बढ़कर और कौन पुण्यात्मा है?\"<\/li>\n<li><b>सर्वोत्तमता के लिए:<\/b> विशेषण से पहले 'सबसे': \"सबसे बड़ी हानि।\" या विशेषण की द्विरुक्ति: \"अच्छे से अच्छे पंडित\", \"बड़े-बड़े राजा\", \"एक से एक सुंदर फूल\"।<\/li>\n<li><b>अतिशयता:<\/b> अत्यंत, परम, अतिशय, बहुत ही: \"परम मनोहर रूप\"। कुछ रंगों के साथ: काला-भुजंग, लाल-अंगारा, पीला-जर्द।<\/li>\n<\/ul>\n<h3>संस्कृत के तीन अवस्था-रूप (पृ. ३१२–३१३)<\/h3>\n<table>\n<tr><th>अवस्था<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>मूलावस्था<\/td><td>तुलना नहीं होती<\/td><td>सोना पीला है। उच्च स्थान। लघु, गुरु, महत्, पवित्र<\/td><\/tr>\n<tr><td>उत्तरावस्था (+तर)<\/td><td>दो वस्तुओं में एक के गुण की अधिकता या न्यूनता<\/td><td>लघुतर, गुरुतर, महत्तर, दृढ़तर, घोरतर, पवित्रतर<\/td><\/tr>\n<tr><td>उत्तमावस्था (+तम)<\/td><td>दो से अधिक में सबसे अधिक गुण<\/td><td>लघुतम, गुरुतम, महत्तम, उच्चतम, प्राचीनतम, पवित्रतम<\/td><\/tr>\n<\/table>\n<p>गुरु के अनुसार संस्कृत में उत्तरावस्था के लिए 'तर' या 'ईयस्' और उत्तमावस्था के लिए 'तम' या 'इष्ट' प्रत्यय आते हैं; हिंदी में 'तर' और 'तम' का प्रचार अधिक है (पृ. ३१३)। 'ईयस्/इष्ट' के कुछ शब्द: बलिष्ठ (बली), स्वादिष्ठ (स्वादु), गरिष्ठ (गुरु), श्रेष्ठ। <b>उर्दू शब्द:<\/b> बेहतर (अधिक अच्छा), बदतर (अधिक बुरा), ज़्यादातर, पेशतर, कमतरीन (पृ. ३१४)।<\/p>\n<div class=\"trap\"><b>अटकने वाली बातें:<\/b> (1) -तर वाले शब्द उत्तरावस्था के हैं, -तम वाले उत्तमावस्था के। 'पवित्रतम' उत्तमावस्था है, उत्तरावस्था नहीं (2023 Q31)। (2) 'श्रेष्ठ' का मूल शब्द पता नहीं; हिंदी में वह प्रायः उत्तरावस्था के अर्थ में आता है: 'धन से विद्या श्रेष्ठ है' (गुरु, पृ. ३१४)। (3) 'उत्तर' शब्द हिंदी में प्रायः 'जवाब' या 'दिशा' के अर्थ में आता है, इसलिए 'उत्तर-अवस्था' नाम से भ्रम न करें। (4) 'उत्तम' शब्द हिंदी में अपने मूल अर्थ 'अच्छा' में भी आता है।<\/div>\n\n<h2>अन्य शब्दों से विशेषण बनाना<\/h2>\n<p>प्रश्न का रूप: 'अमुक शब्द से बना विशेषण है', 'अमुक किस शब्द-भेद से बना है'। इन्हें प्रत्यय से पहचानिए। नीचे गुरु के प्रत्यय (पृ. ४१६–४२१, ४२७) और HTET तथा स्कूली पुस्तकों के सामान्य उदाहरण हैं।<\/p>\n<table>\n<tr><th>मूल शब्द<\/th><th>प्रत्यय<\/th><th>विशेषण<\/th><\/tr>\n<tr><td>संज्ञा से: पशु, समाज, शरीर, समय<\/td><td>इक (संबंधवाचक)<\/td><td>पाशविक, सामाजिक, शारीरिक, सामयिक<\/td><\/tr>\n<tr><td>संज्ञा से: भारत, नगर, राष्ट्र<\/td><td>ईय, इक, ईन<\/td><td>भारतीय, नागरिक, राष्ट्रीय<\/td><\/tr>\n<tr><td>संज्ञा से: धन, गुण, विद्या, रूप<\/td><td>वान् (वत्)<\/td><td>धनवान्, गुणवान्, विद्यावान्, रूपवान्<\/td><\/tr>\n<tr><td>संज्ञा से: बुद्धि, श्री<\/td><td>मान् (मत्)<\/td><td>बुद्धिमान्, श्रीमान्, आयुष्मान्<\/td><\/tr>\n<tr><td>संज्ञा से: दया, श्रद्धा, कृपा<\/td><td>लु<\/td><td>दयालु, श्रद्धालु, कृपालु<\/td><\/tr>\n<tr><td>संज्ञा से: तेज, यश, माया<\/td><td>वी (विन्)<\/td><td>तेजस्वी, यशस्वी, मायावी<\/td><\/tr>\n<tr><td>संज्ञा से: क्रोध, धन, रोग, सुख<\/td><td>ई (इन्)<\/td><td>क्रोधी, धनी, रोगी, सुखी<\/td><\/tr>\n<tr><td>संज्ञा से: फल, पुष्प, हर्ष, आनंद<\/td><td>इत<\/td><td>फलित, पुष्पित, हर्षित, आनंदित<\/td><\/tr>\n<tr><td>संज्ञा से: जट, पंक<\/td><td>इल<\/td><td>जटिल, पंकिल<\/td><\/tr>\n<tr><td>क्रिया से: भूलना, पीना, बूझना<\/td><td>अक्कड़<\/td><td>भुलक्कड़, पियक्कड़, बुझक्कड़<\/td><\/tr>\n<tr><td>सर्वनाम से: यह, वह, कौन<\/td><td>यौगिक रूप<\/td><td>ऐसा, वैसा, कैसा<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>पाशविक या पशुता?<\/b> 'पशु' से बना विशेषण 'पाशविक' है (पशु + इक; पहला स्वर बढ़ता है)। 'पशुता', 'पशुत्व' भाववाचक संज्ञाएँ हैं (ता और त्व भाववाचक प्रत्यय, पृ. ४१९)। 'पशुपति' एक समस्त संज्ञा (शिव) है। इसी कारण 2022 Q44 में उत्तर (A) 'पाशविक' है। 'गुण', 'धन' + 'वत्' (वान्) से विशेषण बनते हैं (पृ. ४२१); 'भुलक्कड़' में 'अक्कड़' कर्तृवाचक प्रत्यय है (पृ. ४२७)। 'बुद्धिवान्' अशुद्ध है, शुद्ध 'बुद्धिमान्' (पृ. ४२०)।<\/div>\n<p><b>विशेषण से भाववाचक संज्ञा:<\/b> विशेषण में ता, त्व, पन, आई, आस, ई लगाकर भाववाचक संज्ञा बनती है: चतुर-चतुराई, मीठा-मिठास, कठोर-कठोरता, बड़ा-बड़प्पन, गरम-गरमी। 'आलसी' से 'आलस्य' भी इसी प्रकार (यह HTET 2023 Q31 के विकल्प में आया है)।<\/p>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li>सबसे पहले देखें कि शब्द संज्ञा के साथ आकर उसकी विशेषता बता रहा है या अकेला संज्ञा के बदले आ रहा है। बदले में आए तो सर्वनाम।<\/li>\n<li>शब्द सर्वनाम-जैसा हो (यह, वह, कोई, कौन, ऐसा, कितना) और संज्ञा के साथ हो तो सार्वनामिक विशेषण।<\/li>\n<li>अगर गुण, रंग, आकार, दशा बताए तो गुणवाचक। अगर 'कितने?' (गिनती) का उत्तर हो तो संख्यावाचक। अगर 'कितना?' (माप-तौल) का उत्तर हो तो परिमाणवाचक।<\/li>\n<li>संख्यावाचक में पूछें: निश्चित संख्या बताई गई है (दो, पहला, दुगुना, दोनों, हर) या नहीं (कुछ, कई, सब, अनेक)? निश्चित हो तो उपभेद देखें: गणना, क्रम, आवृत्ति, समुदाय, प्रत्येक।<\/li>\n<li>एक ही शब्द (बहुत, सब, सारा) हो तो संज्ञा देखें: एकवचन या नापी-तौली जाने वाली संज्ञा हो तो परिमाणवाचक; बहुवचन या गिनी जा सकने वाली हो तो अनिश्चित संख्यावाचक।<\/li>\n<li>तुलना की अवस्था में: -तर उत्तरावस्था, -तम उत्तमावस्था, सादा रूप मूलावस्था। हिंदी में 'से' और 'सबसे' भी यही काम करते हैं।<\/li>\n<li>विशेषण-निर्माण में: शब्द के अंत का प्रत्यय देखें (इक, ईय, वान्, मान्, लु, वी, ई) और ध्यान रखें कि 'ता', 'त्व', 'पन' भाववाचक संज्ञा बनाते हैं, विशेषण नहीं।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table>\n<tr><th>जोड़ा<\/th><th>अंतर<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>विशेषण / प्रविशेषण<\/td><td>विशेषण संज्ञा की विशेषता; प्रविशेषण विशेषण की विशेषता (स्कूली)<\/td><td>बहुत (प्रवि.) मीठा (विशे.) आम<\/td><\/tr>\n<tr><td>परिमाणवाचक / अनिश्चित संख्यावाचक<\/td><td>एकवचन या नापी-तौली संज्ञा / बहुवचन या गिनती वाली संज्ञा<\/td><td>बहुत दूध / बहुत आदमी<\/td><\/tr>\n<tr><td>सर्वनाम / सार्वनामिक विशेषण<\/td><td>अकेला या संज्ञा के साथ<\/td><td>कोई आया / कोई नौकर आया<\/td><\/tr>\n<tr><td>विशेष्य-विशेषण / विधेय-विशेषण<\/td><td>संज्ञा के साथ / क्रिया के साथ विधेय में<\/td><td>ठंडी हवा चली / हवा ठंडी है<\/td><\/tr>\n<tr><td>उत्तरावस्था / उत्तमावस्था<\/td><td>-तर (दो में) / -तम (अनेक में)<\/td><td>श्रेष्ठतर / पवित्रतम<\/td><\/tr>\n<tr><td>विशेषण / भाववाचक संज्ञा<\/td><td>गुणवाला / गुण का नाम<\/td><td>शक्तिशाली / शक्ति; पाशविक / पशुता<\/td><\/tr>\n<\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n<h3>HTET 2020 Q41<\/h3>\n<p>प्रश्न: अनिश्चित संख्यावाचक विशेषण चुनिए: (A) पिछले वर्ष की तुलना में इस बार अधिक वर्षा हुई। (B) सब्ज़ी में थोड़ा-सा नमक डालिए। (C) सारा काम मुझे ही करना होगा। (D) सारे देश आतंकवाद के ख़िलाफ़ खड़े हैं।<\/p>\n<div class=\"ex\"><b>उत्तर: (D)।<\/b> (A) 'अधिक वर्षा': वर्षा नापी जाने वाली राशि है, एकवचन में, इसलिए परिमाणवाचक। (B) 'थोड़ा-सा नमक': नमक तौला जाता है, यह परिमाणवाचक है। (C) 'सारा काम': 'काम' एकवचन, नापने योग्य, इसलिए परिमाणवाचक। (D) 'सारे देश': 'देश' गिने जा सकने वाले बहुवचन में हैं और संख्या निश्चित नहीं बताई गई, इसलिए अनिश्चित संख्यावाचक। गुरु का यही सूत्र है: \"सारा देश\" (परिमाण) बनाम \"सारे देश\" (अनिश्चित संख्या) (पृ. १५९)।<\/div>\n<h3>HTET 2022 Q44<\/h3>\n<p>प्रश्न: 'पशु' शब्द से निर्मित विशेषण है: (A) पाशविक (B) पशुपति (C) पशुता (D) पशुत्व।<\/p>\n<div class=\"ex\"><b>उत्तर: (A)।<\/b> पशु + इक = पाशविक (संबंधवाचक विशेषण; आदि स्वर बढ़ता है: पशु से पाश)। (B) पशुपति: 'पशुओं के पति', एक समस्त संज्ञा (शिव)। (C) पशुता और (D) पशुत्व: ता और त्व प्रत्यय भाववाचक संज्ञा बनाते हैं (गुरु, पृ. ४१९)। इसलिए विशेषण केवल पाशविक है।<\/div>\n<h3>HTET 2023 Q31<\/h3>\n<p>प्रश्न: विशेषण के संबंध में कौन-सा सही सुमेलित <b>नहीं<\/b> है? (A) भारतीय: संज्ञा से निर्मित विशेषण। (B) पवित्रतम: विशेषण की उत्तरावस्था। (C) परिश्रमी: गुणवाचक विशेषण। (D) आलस्य: विशेषण से निर्मित भाववाचक संज्ञा।<\/p>\n<div class=\"ex\"><b>उत्तर: (B)।<\/b> (A) भारत (संज्ञा) + ईय = भारतीय, सही। (C) 'परिश्रमी' स्वभाव या गुण बताता है, गुणवाचक विशेषण है, सही। (D) आलसी (विशेषण) से आलस्य (भाववाचक), प्रश्न की कुंजी के अनुसार सही। (B) में 'पवित्रतम' का -तम प्रत्यय उत्तमावस्था का है (पवित्र → पवित्रतर → पवित्रतम), उत्तरावस्था का नहीं। इसलिए यही मेल गलत है (गुरु, पृ. ३१२–३१३)।<\/div>\n<h3>HTET 2024 Q38<\/h3>\n<p>प्रश्न: किस विकल्प में सार्वनामिक विशेषण का प्रयोग <b>नहीं<\/b> हुआ है? (A) जिसने परिश्रम किया, वह सफल हो गया। (B) यह पुस्तक किससे मँगवाऊँ। (C) ऐसे व्यक्ति पर कभी विश्वास मत करो। (D) आपके घर से कल कोई नौकर आया था।<\/p>\n<div class=\"ex\"><b>उत्तर: (A)।<\/b> (B) 'यह' संज्ञा 'पुस्तक' के साथ आकर उसकी विशेषता बताता है: सार्वनामिक विशेषण। (C) 'ऐसे' यौगिक सार्वनामिक विशेषण है और 'व्यक्ति' की विशेषता बताता है। (D) 'कोई' संज्ञा 'नौकर' के साथ है: सार्वनामिक विशेषण। (A) में 'जिसने' (संबंधवाचक) और 'वह' (निश्चयवाचक) संज्ञा के बदले अकेले आए हैं; दोनों सर्वनाम हैं, विशेषण नहीं। इसलिए यहाँ सार्वनामिक विशेषण नहीं है (गुरु, पृ. १३८–१३९)।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>विशेषण संज्ञा या सर्वनाम की विशेषता बताता है; जिसकी विशेषता बताई जाए वह विशेष्य है। 'व्याप्ति मर्यादित करना' = दायरा घटाना।<\/li>\n<li>विशेषण की विशेषता बताने वाला शब्द स्कूली व्याकरण में प्रविशेषण है (बहुत मीठा)।<\/li>\n<li>विशेषण का प्रयोग: विशेष्य-विशेषण (ठंडी हवा) और विधेय-विशेषण (हवा ठंडी है)।<\/li>\n<li>स्कूली चार भेद: गुणवाचक, संख्यावाचक, परिमाणवाचक, सार्वनामिक। गुरु के तीन: सार्वनामिक, गुणवाचक, संख्यावाचक (परिमाण उसके अंदर)।<\/li>\n<li>गुणवाचक: काल, स्थान, आकार, रंग, दशा, गुण। 'सा' हीनता या अनिश्चय के अर्थ में जुड़ता है।<\/li>\n<li>निश्चित संख्यावाचक के पाँच उपभेद: गणना (पूर्णांक, अपूर्णांक), क्रम, आवृत्ति, समुदाय, प्रत्येकबोधक।<\/li>\n<li>अनिश्चित संख्यावाचक: कुछ, कई, सब, अनेक, बहुत (बहुवचन के साथ), अधिक, कम, आदि।<\/li>\n<li>एकवचन संज्ञा के साथ परिमाणवाचक (सारा देश, बहुत दूध); बहुवचन के साथ अनिश्चित संख्यावाचक (सारे देश, बहुत आदमी)। 'अल्प', 'किंचित', 'ज़रा' केवल परिमाणवाचक।<\/li>\n<li>सर्वनाम + संज्ञा = सार्वनामिक विशेषण; अकेला = सर्वनाम। ऐसा, कैसा, उतना, जितना यौगिक सार्वनामिक विशेषण हैं।<\/li>\n<li>तुलना: मूलावस्था (सादा), उत्तरावस्था (-तर), उत्तमावस्था (-तम)। हिंदी में 'से', 'सबसे' से भी तुलना होती है।<\/li>\n<li>पशु से पाशविक (विशेषण); पशुता, पशुत्व भाववाचक संज्ञाएँ। शक्तिशाली, परिश्रमी विशेषण हैं।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: 'दो सेर घी लाओ।' में 'दो सेर' कौन-सा विशेषण है? (A) गुणवाचक (B) निश्चित परिमाणवाचक (C) अनिश्चित संख्यावाचक (D) सार्वनामिक<\/summary><p><b>उत्तर: (B)<\/b> घी तौला जाता है और माप निश्चित है। गुरु इसे संख्यावाचक + परिमाण-संज्ञा मानते हैं (पृ. १५९)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: 'अनेक' शब्द का भेद है: (A) निश्चित संख्यावाचक (B) अनिश्चित संख्यावाचक (C) गुणवाचक (D) निश्चित परिमाणवाचक<\/summary><p><b>उत्तर: (B)<\/b> गिनती है पर निश्चित संख्या नहीं बताई।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: 'महत्तम' किस अवस्था का रूप है? (A) मूलावस्था (B) उत्तरावस्था (C) उत्तमावस्था (D) प्रविशेषण<\/summary><p><b>उत्तर: (C)<\/b> 'तम' प्रत्यय उत्तमावस्था का है (महत् → महत्तर → महत्तम)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: 'कितने लोग आए?' में 'कितने' है: (A) सार्वनामिक विशेषण (B) सर्वनाम (C) क्रियाविशेषण (D) संज्ञा<\/summary><p><b>उत्तर: (A)<\/b> 'कौन' से बना 'कितने' संज्ञा 'लोग' के साथ आकर संख्या पूछ रहा है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: 'बहुत मीठा आम' में 'बहुत' है: (A) विशेष्य (B) प्रविशेषण (C) विशेषण (D) संज्ञा<\/summary><p><b>उत्तर: (B)<\/b> यह विशेषण 'मीठा' की विशेषता बताता है। (स्कूली शब्द 'प्रविशेषण')।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: 'पाँचवाँ' किस प्रकार का संख्यावाचक विशेषण है? (A) गणनावाचक (B) क्रमवाचक (C) आवृत्तिवाचक (D) समुदायवाचक<\/summary><p><b>उत्तर: (B)<\/b> पाँच से आगे 'वाँ' जोड़ने से क्रमवाचक बनते हैं (पृ. १५१)। 'दुगुना' आवृत्तिवाचक, 'दोनों' समुदायवाचक है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: 'थोड़ा पानी पियो' में 'थोड़ा' विशेषण है: (A) निश्चित संख्यावाचक (B) अनिश्चित संख्यावाचक (C) परिमाणवाचक (D) सार्वनामिक<\/summary><p><b>उत्तर: (C)<\/b> पानी नापा जाता है और एकवचन है, इसलिए 'थोड़ा' अनिश्चित परिमाणवाचक है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: 'दोनों हाथ' में 'दोनों' किस भेद का विशेषण है? (A) गणनावाचक (B) क्रमवाचक (C) आवृत्तिवाचक (D) समुदायवाचक<\/summary><p><b>उत्तर: (D)<\/b> 'दो' + 'ओं' = दोनों, पूरे समुदाय का बोध (पृ. १५२)। इसी प्रकार चारों, आठों।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: 'संज्ञा से बना विशेषण' का उदाहरण है: (A) मित्रता (B) सामाजिक (C) सुंदरता (D) बुढ़ापा<\/summary><p><b>उत्तर: (B)<\/b> समाज + इक = सामाजिक (संबंधवाचक विशेषण)। शेष तीनों भाववाचक संज्ञाएँ हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: 'यह बात सच है' में 'सच' का प्रयोग है: (A) विशेष्य-विशेषण (B) विधेय-विशेषण (C) प्रविशेषण (D) सार्वनामिक विशेषण<\/summary><p><b>उत्तर: (B)<\/b> 'सच' क्रिया 'है' के साथ विधेय में आया है, इसलिए विधेय-विशेषण (गुरु का अपना उदाहरण, पृ. १३८)।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामताप्रसाद गुरु, <i>हिंदी व्याकरण<\/i>, हिंदी विकिस्रोत, पृष्ठ <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१३६\">१३६–१३८<\/a> (परिभाषा, विशेष्य, विधेय-विशेषण, भेद), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१३८\">१३८–१४३<\/a> (सार्वनामिक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१४३\">१४३–१४५<\/a> (गुणवाचक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१४५\">१४५–१६०<\/a> (संख्यावाचक और परिमाणबोधक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३१०\">३१०–३१४<\/a> (तुलना), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४१६\">४१६–४२१, ४२७<\/a> (प्रत्यय); पिछले HTET प्रश्न (2020–2024)। 'प्रविशेषण', स्कूली चार भेद और 'पाशविक' (पशु + इक) का उदाहरण स्कूली परिपाटी और HTET की कुंजी से हैं; गुरु में ये नहीं मिले।<\/p>\n","hin-verb":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2020–2024 में इस विषय से 7 प्रश्न आए: सकर्मक/अकर्मक की पहचान (2020 Q42, 2021 Q43), द्विकर्मक, प्रेरणार्थक, नामधातु और रंजक क्रिया (2023 Q42, 2024 Q32), कर्मवाच्य में रूपांतर (2021 Q42), क्रियाविशेषण का भेद (2022 Q33) और संबंधसूचक अव्यय की पहचान (2021 Q31)। यानी हर साल लगभग 1 प्रश्न। इस पृष्ठ में क्रिया, काल, वाच्य और अव्यय, चारों का पूरा पाठ है।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस शब्द से किसी काम का करना या होना, किसी की दशा या स्थिति का पता चले, उसे <b>क्रिया<\/b> कहते हैं। जैसे: पढ़ना, सोना, गिरना, होना। वाक्य में क्रिया ही वह शब्द है जो बताती है कि कर्ता के बारे में <i>क्या कहा गया है<\/i>।<\/div>\n<p>कामताप्रसाद गुरु की परिभाषा: &ldquo;जिस विकारी शब्द के प्रयोग से हम किसी वस्तु के विषय में कुछ विधान करते हैं उसे क्रिया कहते हैं।&rdquo; (अंक १८७, पृ. १६२)। &lsquo;विकारी&rsquo; का अर्थ है कि क्रिया का रूप लिंग, वचन, पुरुष, काल और वाच्य के अनुसार बदलता है (अंक ३४८, पृ. ३१५)। इसी कारण क्रिया &lsquo;विकारी&rsquo; शब्द है, पर अव्यय (क्रियाविशेषण आदि) &lsquo;अविकारी&rsquo; हैं: उनका रूप कभी नहीं बदलता।<\/p>\n<p><b>सरल उदाहरण:<\/b> &ldquo;राम पुस्तक पढ़ता है&rdquo;: यहाँ &lsquo;पढ़ता है&rsquo; क्रिया है। अगर कर्ता &lsquo;सीता&rsquo; हो तो &lsquo;पढ़ती है&rsquo;, और अगर काल बदले तो &lsquo;पढ़ा&rsquo;, &lsquo;पढ़ेगा&rsquo;। रूप बदलता है, पर &lsquo;पढ़&rsquo; वाला अंश नहीं बदलता। यह न बदलनेवाला अंश <b>धातु<\/b> है।<\/p>\n<p>इस पृष्ठ में चार बातें क्रम से हैं: (1) क्रिया के भेद, (2) काल, (3) वाच्य, (4) अव्यय। परीक्षा में अधिकतर प्रश्न इन्हीं चारों से बनते हैं।<\/p>\n\n<h2>मूल अवधारणा: धातु और क्रिया का रूप<\/h2>\n<p><b>धातु<\/b> वह मूल शब्द है जिसमें प्रत्यय लगाने से क्रिया बनती है। गुरु: &ldquo;जिस मूल शब्द में विकार होने से क्रिया बनती है उसे धातु कहते हैं&rdquo; (अंक १८८, पृ. १६२)। उदाहरण: &lsquo;भागा&rsquo; का धातु &lsquo;भाग&rsquo;, &lsquo;जाऊँगा&rsquo; का धातु &lsquo;जा&rsquo;, &lsquo;होती है&rsquo; का धातु &lsquo;हो&rsquo; है।<\/p>\n<p>धातु के अंत में &lsquo;ना&rsquo; जोड़ने पर <b>क्रिया का साधारण रूप<\/b> बनता है: भाग+ना = भागना, जा+ना = जाना। कोश में यही रूप लिखा जाता है। गुरु (पृ. १६३) बताते हैं कि साधारण रूप स्वयं क्रिया नहीं है, क्योंकि उससे किसी के बारे में विधान नहीं होता; उसका प्रयोग संज्ञा जैसा होता है (&lsquo;पढ़ना एक गुण है&rsquo;)।<\/p>\n<p class=\"eq\"><span>पढ़<\/span> (धातु) + <span>ना<\/span> = <b>पढ़ना<\/b> (साधारण रूप) &nbsp; | &nbsp; <span>पढ़<\/span> + <span>ता है<\/span> = <b>पढ़ता है<\/b> (क्रिया)<\/p>\n<p>धातु दो तरह के होते हैं (अंक १९८–२०१, पृ. १६८–१६९):<\/p>\n<ul>\n<li><b>मूल धातु:<\/b> जो किसी और शब्द से न बने हों: करना, बैठना, चलना, लेना।<\/li>\n<li><b>यौगिक धातु:<\/b> जो किसी और शब्द से बनें। इनके तीन रास्ते हैं: (1) धातु में प्रत्यय जोड़कर प्रेरणार्थक (और सकर्मक) धातु, (2) संज्ञा/विशेषण में प्रत्यय जोड़कर नामधातु, (3) एक धातु में एक या दो धातु जोड़कर संयुक्त धातु।<\/li>\n<\/ul>\n\n<h2>क्रिया के भेद: एक नज़र में<\/h2>\n<div class=\"cards\">\n<div><h3>सकर्मक<\/h3><p>कर्म के साथ आती है; फल कर्ता से निकलकर कर्म पर पड़ता है<\/p><p class=\"eq\"><span>पकड़ना<\/span> <span>लाना<\/span> <span>लिखना<\/span><\/p><\/div>\n<div><h3>अकर्मक<\/h3><p>कर्म नहीं; काम और फल दोनों कर्ता पर<\/p><p class=\"eq\"><span>चलना<\/span> <span>सोना<\/span> <span>खिलना<\/span><\/p><\/div>\n<div><h3>द्विकर्मक<\/h3><p>सकर्मक, दो कर्म: गौण (प्राणी) और मुख्य (वस्तु)<\/p><p class=\"eq\"><span>देना<\/span> <span>कहना<\/span> <span>पढ़ाना<\/span><\/p><\/div>\n<div><h3>प्रेरणार्थक<\/h3><p>कर्ता किसी की प्रेरणा से काम करे<\/p><p class=\"eq\"><span>सुनना<\/span> → <span>सुनाना<\/span> → <b>सुनवाना<\/b><\/p><\/div>\n<div><h3>नामधातु<\/h3><p>संज्ञा/विशेषण से बनी क्रिया<\/p><p class=\"eq\"><span>बात<\/span> → <b>बतियाना<\/b><\/p><\/div>\n<div><h3>संयुक्त क्रिया<\/h3><p>दो या अधिक क्रियाओं का मेल<\/p><p class=\"eq\"><span>खा<\/span> + <span>लिया<\/span> = <b>खा लिया<\/b><\/p><\/div>\n<\/div>\n\n<h2>सकर्मक और अकर्मक क्रिया<\/h2>\n<h3>सकर्मक क्रिया<\/h3>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस क्रिया का फल कर्ता से निकलकर किसी दूसरी वस्तु (कर्म) पर पड़े, वह सकर्मक है। गुरु (अंक १९०, पृ. १६४): &ldquo;सिपाही चोर को पकड़ता है&rdquo; में फल सिपाही से निकलकर चोर पर पड़ता है, इसलिए &lsquo;पकड़ता है&rsquo; सकर्मक है। &lsquo;सकर्मक&rsquo; का अर्थ ही है &lsquo;कर्म के सहित&rsquo;।<\/div>\n<h3>अकर्मक क्रिया<\/h3>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस क्रिया का व्यापार और फल कर्ता पर ही पड़े, वह अकर्मक है (अंक १९१, पृ. १६५)। &ldquo;गाड़ी चली&rdquo;, &ldquo;लड़का सोता है&rdquo;: दोनों में कर्म नहीं है। &lsquo;अकर्मक&rsquo; का अर्थ है &lsquo;कर्म-रहित&rsquo;।<\/div>\n<h3>पहचानने की कसौटी<\/h3>\n<p>क्रिया के पहले <b>&lsquo;क्या&rsquo;<\/b> या <b>&lsquo;किसे/किसको&rsquo;<\/b> लगाकर प्रश्न बनाइए। उत्तर मिले तो वह कर्म है और क्रिया सकर्मक; उत्तर न मिले तो अकर्मक।<\/p>\n<table>\n<tr><th>वाक्य<\/th><th>प्रश्न<\/th><th>निर्णय<\/th><\/tr>\n<tr><td>माँ ने खाना पकाया।<\/td><td>क्या पकाया? &rarr; खाना<\/td><td>सकर्मक<\/td><\/tr>\n<tr><td>बच्चा सो रहा है।<\/td><td>क्या/किसे सो रहा है? &rarr; कोई उत्तर नहीं<\/td><td>अकर्मक<\/td><\/tr>\n<tr><td>बहन ने भाई को मिठाई खिलाई।<\/td><td>किसे? भाई को। क्या? मिठाई<\/td><td>सकर्मक (द्विकर्मक)<\/td><\/tr>\n<tr><td>मछलियाँ तालाब में तैर रही हैं।<\/td><td>&lsquo;तालाब में&rsquo; स्थान है, कर्म नहीं<\/td><td>अकर्मक<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>ध्यान दें (गुरु की सूक्ष्म बातें):<\/b>\n<ul>\n<li><b>कर्ता और कर्म अलग शब्द हों तो सकर्मक:<\/b> &ldquo;लड़का अपने को सुधार रहा है&rdquo;: फल कर्ता पर ही पड़ता है, फिर भी &lsquo;अपने को&rsquo; अलग शब्द (कर्म) है, इसलिए क्रिया सकर्मक है (पृ. १६६)।<\/li>\n<li><b>उभयविध धातु:<\/b> कुछ धातु प्रयोग के अनुसार दोनों हो जाते हैं: खुजलाना, भरना, लजाना, भूलना, घिसना, बदलना, ऐंठना, ललचाना, घबराना (अंक १९२, पृ. १६६)। &ldquo;मेरे हाथ खुजलाते हैं&rdquo; में अकर्मक, पर &ldquo;उसका बदन खुजलाकर&rdquo; में सकर्मक। &ldquo;लोगों का जी ललचाता है&rdquo; अकर्मक है, पर &ldquo;मदारी बच्चों को ललचाता है&rdquo; में &lsquo;बच्चों को&rsquo; कर्म है, इसलिए सकर्मक।<\/li>\n<li><b>कर्म छिपा हो सकता है:<\/b> जब फल सब पर पड़ता है, कर्म नहीं बताते: &ldquo;बहरा सुनता है, गूँगा बोलता है&rdquo;, &ldquo;कितने लड़के पढ़ते हैं?&rdquo; यहाँ क्रियाएँ सकर्मक हैं (अंक १९३)।<\/li>\n<li><b>सजातीय कर्म:<\/b> कुछ अकर्मक क्रियाओं के साथ उसी धातु से बनी संज्ञा कर्म जैसी आती है: &ldquo;लड़का अच्छी चाल चलता है&rdquo;, &ldquo;सिपाही कई लड़ाइयाँ लड़ा&rdquo; (अंक १९७, पृ. १६८)।<\/li>\n<\/ul><\/div>\n<h3>अपूर्ण क्रियाएँ और पूर्ति<\/h3>\n<p>कुछ क्रियाओं का अर्थ अकेले कर्ता या कर्म से पूरा नहीं होता, इसलिए साथ में एक संज्ञा या विशेषण आता है, जिसे <b>पूर्ति<\/b> कहते हैं (अंक १९४, १९६, पृ. १६६–१६८)।<\/p>\n<ul>\n<li><b>अपूर्ण अकर्मक<\/b> (पूर्ति = उद्देश्य-पूर्ति): होना, रहना, बनना, दिखना, निकलना, ठहरना। &ldquo;लड़का <b>चतुर<\/b> है&rdquo;, &ldquo;साधु <b>चोर<\/b> निकला&rdquo;। यहाँ &lsquo;चतुर&rsquo; और &lsquo;चोर&rsquo; पूर्ति हैं, कर्म नहीं।<\/li>\n<li><b>अपूर्ण सकर्मक<\/b> (पूर्ति = कर्म-पूर्ति): करना, बनाना, समझना, पाना, मानना। &ldquo;मैंने चोर को <b>साधु<\/b> समझा&rdquo;, &ldquo;अहल्याबाई ने गंगाधर को अपना <b>दीवान<\/b> बनाया&rdquo;।<\/li>\n<\/ul>\n<p>पहचान: अपूर्ण अकर्मक की पूर्ति कर्ता की ही स्थिति बताती है (&lsquo;मंत्री राजा बन गया&rsquo;: मंत्री ही राजा हुआ), जबकि सकर्मक का कर्म कर्ता से भिन्न होता है (&lsquo;मंत्री ने राजा को बुलाया&rsquo;)।<\/p>\n\n<h2>द्विकर्मक क्रिया<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस सकर्मक क्रिया के साथ दो कर्म हों, वह द्विकर्मक है। गुरु (अंक १९५, पृ. १६७): देना, बतलाना, कहना, सुनाना और इन्हीं अर्थों की क्रियाओं में दो कर्म रहते हैं। एक कर्म बहुधा पदार्थ का बोध कराता है, वह <b>मुख्य कर्म<\/b>; दूसरा बहुधा प्राणी का वाचक होता है, वह <b>गौण कर्म<\/b>।<\/div>\n<p class=\"eq\"><span>गुरु ने<\/span> (कर्ता) <span>शिष्य को<\/span> (गौण कर्म) <span>पोथी<\/span> (मुख्य कर्म) <b>दी<\/b>।<\/p>\n<p><b>तरकीब:<\/b> &lsquo;किसे&rsquo; का उत्तर गौण कर्म (प्राणी, बहुधा &lsquo;को&rsquo; के साथ) और &lsquo;क्या&rsquo; का उत्तर मुख्य कर्म (वस्तु) देता है। &ldquo;अध्यापिका छात्राओं को भूगोल पढ़ा रही है&rdquo;: किसे? छात्राओं को; क्या? भूगोल: द्विकर्मक।<\/p>\n<p>गुरु के अनुसार गौण कर्म कभी छिपा रहता है: &ldquo;राजा ने दान दिया&rdquo; (अंक १९५-अ)। साथ ही पीना, खाना, देखना, समझना, देना, पढ़ना, सुनना जैसी क्रियाओं के दोनों प्रेरणार्थक रूप द्विकर्मक होते हैं: &ldquo;प्यासे को पानी पिलाओ&rdquo; (पृ. १६९)।<\/p>\n\n<h2>प्रेरणार्थक क्रिया<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जब कर्ता स्वयं काम न करके किसी और से उसे करवाए या करने की प्रेरणा दे, तो उस क्रिया को प्रेरणार्थक कहते हैं। गुरु (अंक २०२, पृ. १६९): &ldquo;बाप लड़के से चिट्ठी लिखवाता है&rdquo; में &lsquo;लिखवा&rsquo; प्रेरणार्थक है; &lsquo;बाप&rsquo; प्रेरक कर्ता है और &lsquo;लड़का&rsquo; प्रेरित कर्ता।<\/div>\n<p>मूल धातु से <b>दो प्रेरणार्थक रूप<\/b> बनते हैं (अंक २०३–२०४, पृ. १७०–१७१):<\/p>\n<table>\n<tr><th>मूल धातु<\/th><th>पहला प्रेरणार्थक (+ आ)<\/th><th>दूसरा प्रेरणार्थक (+ वा)<\/th><\/tr>\n<tr><td>गिरना<\/td><td>गिराना<\/td><td>गिरवाना<\/td><\/tr>\n<tr><td>चलना<\/td><td>चलाना<\/td><td>चलवाना<\/td><\/tr>\n<tr><td>पढ़ना<\/td><td>पढ़ाना<\/td><td>पढ़वाना<\/td><\/tr>\n<tr><td>सुनना<\/td><td>सुनाना<\/td><td>सुनवाना<\/td><\/tr>\n<tr><td>लिखना<\/td><td>लिखाना<\/td><td>लिखवाना<\/td><\/tr>\n<\/table>\n<p>फर्क समझिए: <b>पहला रूप<\/b> बहुधा सकर्मक क्रिया का अर्थ देता है (&ldquo;घर गिरता है&rdquo; &rarr; &ldquo;कारीगर घर गिराता है&rdquo;); <b>दूसरा रूप<\/b> सच्ची प्रेरणा बताता है (&ldquo;कारीगर नौकर से घर गिरवाता है&rdquo;)। उदाहरण में तीन चरण देखिए: <i>लोग कथा सुनते हैं<\/i> (मूल) &rarr; <i>पंडित लोगों को कथा सुनाते हैं<\/i> (पहला) &rarr; <i>पंडित शिष्य से श्रोताओं को कथा सुनवाते हैं<\/i> (दूसरा)।<\/p>\n<p><b>अन्य नियम (गुरु):<\/b><\/p>\n<ul>\n<li>दो अक्षर के धातु में आदि का दीर्घ स्वर ह्रस्व हो जाता है (ऐ, औ को छोड़कर): जागना &rarr; जगाना, जीतना &rarr; जिताना, डूबना &rarr; डुबाना, भूलना &rarr; भुलाना, लेटना &rarr; लिटाना (पृ. १७१)।<\/li>\n<li>एकाक्षरी धातु में &lsquo;ला/लवा&rsquo; लगता है: खाना &rarr; खिलाना &rarr; खिलवाना, पीना &rarr; पिलाना, देना &rarr; दिलाना, सोना &rarr; सुलाना, धोना &rarr; धुलाना (पृ. १७२)।<\/li>\n<li>कुछ धातुओं में पहला रूप &lsquo;ला/आ&rsquo; से: कहना &rarr; कहाना/कहलाना, दिखना &rarr; दिखाना/दिखलाना (पृ. १७२)।<\/li>\n<li>आना, जाना, सकना, होना, रुचना, पाना जैसे धातुओं से प्रेरणार्थक रूप नहीं बनते (अंक २०३)।<\/li>\n<li><b>अकर्मक से सकर्मक<\/b> (प्रेरणार्थक से अलग रास्ता): आदि स्वर दीर्घ करके कटना &rarr; काटना, मरना &rarr; मारना; या गुण करके खुलना &rarr; खोलना, दिखना &rarr; देखना; या ट &rarr; ड करके टूटना &rarr; तोड़ना, फटना &rarr; फाड़ना (अंक २०७, पृ. १७३–१७४)।<\/li>\n<\/ul>\n<div class=\"trap\"><b>सबसे बड़ा फंदा (HTET 2023 Q42):<\/b> गुरु का स्पष्ट कथन है, &ldquo;सब प्रेरणार्थक क्रियाएँ <b>सकर्मक<\/b> होती हैं&rdquo;, जैसे &ldquo;लड़के ने कपड़ा सिलवाया&rdquo; (अंक २०३-अ, पृ. १७० का नोट)। इसलिए &ldquo;सभी प्रेरणार्थक क्रियाएँ अकर्मक होती हैं&rdquo; गलत कथन है। &lsquo;कहलाना&rsquo; जैसे इक्के-दुक्के रूप अपूर्ण अकर्मक हो सकते हैं (&lsquo;ग्रंथकार कहलाते हैं&rsquo;), पर नियम सकर्मक का ही है।<\/div>\n<p>एक और बात: कुछ धातु रूप में प्रेरणार्थक दिखते हैं पर असल में मूल अकर्मक हैं: कुम्हलाना, घबराना, मचलाना, इठलाना (अंक २०६)।<\/p>\n\n<h2>नामधातु<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जो क्रिया संज्ञा, सर्वनाम या विशेषण शब्द में प्रत्यय जोड़कर बने, वह नामधातु है। गुरु (अंक २०९, पृ. १७५): धातु को छोड़ दूसरे शब्दों में प्रत्यय जोड़ने से बने धातु; वे संज्ञा या विशेषण के अंत में &lsquo;ना&rsquo; जोड़ने से बनते हैं।<\/div>\n<table>\n<tr><th>मूल शब्द<\/th><th>नामधातु<\/th><th>शब्द-भेद<\/th><\/tr>\n<tr><td>बात<\/td><td>बतियाना<\/td><td>संज्ञा से<\/td><\/tr>\n<tr><td>लाठी<\/td><td>लठियाना<\/td><td>संज्ञा से<\/td><\/tr>\n<tr><td>हाथ<\/td><td>हथियाना<\/td><td>संज्ञा से<\/td><\/tr>\n<tr><td>अपना<\/td><td>अपनाना<\/td><td>विशेषण/सर्वनाम से<\/td><\/tr>\n<tr><td>चिकना<\/td><td>चिकनाना<\/td><td>विशेषण से<\/td><\/tr>\n<tr><td>खरीद, गुज़र<\/td><td>खरीदना, गुज़रना<\/td><td>अरबी-फ़ारसी शब्द से<\/td><\/tr>\n<\/table>\n<p>हिंदी शब्दों से बनाते समय शब्द के अंत में &lsquo;आ&rsquo; करके और आदि के &lsquo;आ&rsquo; को ह्रस्व कर देते हैं (बात &rarr; बतियाना)। गुरु का सुझाव है कि ऐसे प्रयोग शिष्ट सम्मति से ही चलते हैं; इनके बदले बहुधा संयुक्त क्रिया बोली जाती है: बतियाना = बात करना, दुखाना = दुख देना।<\/p>\n<p><b>अनुकरण-धातु:<\/b> ध्वनि की नकल से बने धातु, जैसे खटखट &rarr; खटखटाना, बड़बड़ &rarr; बड़बड़ाना, थरथर &rarr; थरथराना (अंक २१०, पृ. १७५–१७६)। नामधातु और अनुकरण-धातु, दोनों अकर्मक और सकर्मक हो सकते हैं।<\/p>\n<div class=\"trap\"><b>HTET 2023 Q42:<\/b> &lsquo;बतियाना, लठियाना, अपनाना&rsquo; तीनों नामधातु के उदाहरण हैं; ये गुरु के अपने उदाहरण हैं (पृ. १७५)। विकल्प में यह कथन सही था, गलत कथन सिर्फ &lsquo;सभी प्रेरणार्थक अकर्मक&rsquo; था।<\/div>\n\n<h2>संयुक्त क्रिया<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> दो या अधिक क्रियाओं (या क्रिया और संज्ञा/विशेषण) के मेल से बनी क्रिया संयुक्त क्रिया है। पहली क्रिया <b>मुख्य<\/b> होती है और बाद की <b>सहकारी<\/b> (सहायक)। उदाहरण: खा लिया, बोल उठा, पी गया, मार डाला।<\/div>\n<p><b>गुरु का मत:<\/b> गुरु (अंक ४०२–४०३, पृ. ३७६–३७७) संयुक्त क्रिया में 17 सहकारी क्रियाएँ गिनाते हैं: <b>होना, पड़ना, चाहना, चुकना, सकना, पाना, देना, लगना, लेना, रहना, डालना, जाना, करना, आना, उठना, बैठना, बनना<\/b>। रूप के अनुसार वे इसके आठ भेद करते हैं: क्रियार्थक संज्ञा, वर्तमानकालिक कृदंत, भूतकालिक कृदंत, पूर्वकालिक कृदंत, अपूर्ण क्रियाद्योतक कृदंत, पूर्ण क्रियाद्योतक कृदंत, संज्ञा/विशेषण, और पुनरुक्त के मेल से बनी।<\/p>\n<p><b>स्कूली पाठ्यपुस्तकों में<\/b> संयुक्त क्रिया के साथ एक नाम और चलता है: <b>रंजक क्रिया<\/b>। वहाँ मुख्य क्रिया के बाद आकर अर्थ में खास रंग (तेज़ी, तत्परता, पूर्णता, अचानकता आदि) भरनेवाली क्रिया को रंजक कहते हैं (जैसे जाना, लेना, देना, पड़ना, उठना, डालना, बैठना)। &lsquo;रंजक&rsquo; शब्द गुरु का नहीं है, गुरु इन्हें &lsquo;सहकारी&rsquo; कहते हैं।<\/p>\n<h3>सहकारी क्रिया का अर्थ-भेद (गुरु, अंक ४१२, पृ. ३८३–३८६)<\/h3>\n<table>\n<tr><th>सहकारी क्रिया<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>उठना<\/td><td>अचानकता (स्थितिदर्शक क्रियाओं के साथ)<\/td><td>बोल उठना, चिल्ला उठना, चौंक उठना<\/td><\/tr>\n<tr><td>बैठना<\/td><td>धृष्टता; विशेष क्रियाओं के साथ<\/td><td>कह बैठना, चढ़ बैठना, खो बैठना<\/td><\/tr>\n<tr><td>जाना<\/td><td>पूर्णता; व्यापार-क्रियाओं में शीघ्रता<\/td><td>मर जाना, बन जाना; खा जाना, पी जाना<\/td><\/tr>\n<tr><td>लेना<\/td><td>लाभ कर्ता को मिले (आत्मनेपद जैसा)<\/td><td>खा लेना, कर लेना, सुन लेना<\/td><\/tr>\n<tr><td>देना<\/td><td>लाभ दूसरे को मिले (परस्मैपद जैसा)<\/td><td>कह देना, खिला देना, कर देना<\/td><\/tr>\n<tr><td>डालना<\/td><td>उग्रता; केवल सकर्मक के साथ<\/td><td>मार डालना, तोड़ डालना, फाड़ डालना<\/td><\/tr>\n<tr><td>पड़ना<\/td><td>अकर्मक के साथ &lsquo;घटना&rsquo;; आवश्यकता<\/td><td>गिर पड़ना, कूद पड़ना; जाना पड़ता है<\/td><\/tr>\n<tr><td>रहना<\/td><td>क्रिया की अपूर्णता/निरंतरता<\/td><td>खेल रहा है, बैठ रहो<\/td><\/tr>\n<\/table>\n<h3>अन्य बोधक संयुक्त क्रियाएँ (गुरु, अंक ४०५–४२०)<\/h3>\n<ul>\n<li><b>आवश्यकता-बोधक:<\/b> क्रियार्थक संज्ञा + पड़ना/होना/चाहिए: करना पड़ता है, जाना चाहिए।<\/li>\n<li><b>आरंभ-बोधक:<\/b> + लगना: वह कहने लगा। <b>अनुमति-बोधक:<\/b> + देना: मुझे जाने दीजिए। <b>अवकाश-बोधक:<\/b> + पाना: बात न होने पाई।<\/li>\n<li><b>नित्यता-बोधक:<\/b> वर्तमानकालिक कृदंत + आना/जाना/रहना: पानी बरसता रहेगा, पेड़ बढ़ता गया।<\/li>\n<li><b>अभ्यास-बोधक:<\/b> भूतकालिक कृदंत + करना: लड़का पढ़ा करता है। <b>इच्छा-बोधक:<\/b> + चाहना: वह देखा चाहता है।<\/li>\n<li><b>शक्ति-बोधक:<\/b> + सकना: खा सकना, जा सकना। <b>पूर्णता-बोधक:<\/b> + चुकना: पढ़ चुकना, खा चुकना (अंक ४१४–४१५, पृ. ३८७)।<\/li>\n<li><b>योग्यता-बोधक:<\/b> अपूर्ण क्रियाद्योतक कृदंत + बनना: उससे चलते नहीं बनता (अंक ४१६, पृ. ३८८)।<\/li>\n<li><b>नाम-बोधक:<\/b> संज्ञा/विशेषण + करना/होना/देना: स्वीकार करना, नाश होना, दिखाई देना (अंक ४२०–४२१)।<\/li>\n<\/ul>\n<div class=\"trap\"><b>HTET 2024 Q32 का फंदा:<\/b> विकल्प D में &ldquo;ले ही मरा&rdquo; को रंजक क्रिया कहा गया है। गुरु की 17 सहकारी क्रियाओं में &lsquo;मरना&rsquo; नहीं है, फिर भी स्कूली परंपरा में &lsquo;लेना + मरना&rsquo; संयुक्त प्रयोग माना गया और परीक्षा में D को सही माना गया। इसलिए &lsquo;ले ही मरा&rsquo; को अकर्मक क्रिया का उदाहरण मत बनाइए; यह संयुक्त क्रिया है।<\/div>\n\n<h2>काल<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> क्रिया के उस रूप को काल कहते हैं जिससे काम के होने का समय और उसकी पूर्ण या अपूर्ण अवस्था का पता चले (गुरु, अंक ३५७, पृ. ३२०)। समय के तीन भाग माने जाते हैं: जिस समय वक्ता बोल रहा है वह <b>वर्तमान<\/b>, उससे पहले का <b>भूत<\/b>, और बाद का <b>भविष्यत्<\/b>।<\/div>\n<p>गुरु की याद रखने की बात: काल <i>क्रिया के रूप<\/i> का नाम है। &lsquo;आज, कल, अभी&rsquo; जैसे शब्द काल बताते हैं पर &lsquo;काल&rsquo; नहीं कहलाते (पृ. ३२०)।<\/p>\n<h3>स्कूली वर्गीकरण (HTET का आधार)<\/h3>\n<p><b>स्कूली पाठ्यपुस्तकों में<\/b> काल के 3 मुख्य भेद और उनके उपभेद पढ़ाए जाते हैं (कुल 12 रूप):<\/p>\n<table>\n<tr><th>काल<\/th><th>उपभेद<\/th><th>पहचान-चिह्न और उदाहरण<\/th><\/tr>\n<tr><td>भूतकाल (6)<\/td><td>सामान्य<\/td><td>क्रिया के अंत में आ/ई/ए: वह गया, गई, गए<\/td><\/tr>\n<tr><td><\/td><td>आसन्न<\/td><td>आ/ई/ए + है/हैं: वह गया है<\/td><\/tr>\n<tr><td><\/td><td>पूर्ण<\/td><td>आ/ई/ए + था/थी/थे: वह गया था<\/td><\/tr>\n<tr><td><\/td><td>अपूर्ण<\/td><td>रहा था, ता था: जा रहा था, जाता था<\/td><\/tr>\n<tr><td><\/td><td>संदिग्ध<\/td><td>आ + होगा: गया होगा<\/td><\/tr>\n<tr><td><\/td><td>हेतुहेतुमद<\/td><td>ता/ती/ते + (तो) शर्त का भाव: जाता तो, पढ़ता तो पास होता<\/td><\/tr>\n<tr><td>वर्तमान (3)<\/td><td>सामान्य<\/td><td>ता/ती/ते + है/हैं: वह जाता है<\/td><\/tr>\n<tr><td><\/td><td>अपूर्ण<\/td><td>रहा/रही/रहे + है: जा रहा है<\/td><\/tr>\n<tr><td><\/td><td>संदिग्ध<\/td><td>ता + होगा: जाता होगा<\/td><\/tr>\n<tr><td>भविष्यत् (3)<\/td><td>सामान्य<\/td><td>गा/गी/गे: जाएगा<\/td><\/tr>\n<tr><td><\/td><td>संभाव्य<\/td><td>ए/ओ अंत; संभावना: शायद वह जाए<\/td><\/tr>\n<tr><td><\/td><td>हेतुहेतुमद<\/td><td>एक काम दूसरे पर निर्भर: वर्षा होगी तो फ़सल होगी / वह आता तो काम होता<\/td><\/tr>\n<\/table>\n<p><b>याद रखने की तरकीब:<\/b> पहले अंतिम शब्द देखिए। &lsquo;था&rsquo; हो तो भूत (पूर्ण या अपूर्ण); &lsquo;है&rsquo; हो तो वर्तमान या आसन्न भूत; &lsquo;गा/गी/गे&rsquo; हो तो भविष्य; &lsquo;होगा&rsquo; और क्रिया के साथ भूतकालिक रूप (गया होगा) हो तो संदिग्ध भूत।<\/p>\n<h3>गुरु का काल-विभाजन<\/h3>\n<div class=\"trap\">गुरु इसे अलग ढंग से करते हैं (अंक ३५८–३६१, पृ. ३२०–३२७)। वे काल को <b>समय और पूर्णता-अपूर्णता<\/b> के आधार पर बाँटते हैं और <b>अर्थ<\/b> (निश्चय, संभावना, संदेह, आज्ञा, संकेत) को अलग आधार मानते हैं। उनके सात काल:\n<ul>\n<li>वर्तमान: <b>सामान्य<\/b> (वह चलता है), <b>अपूर्ण<\/b> (वह चल रहा है), <b>पूर्ण<\/b> (वह चला है)।<\/li>\n<li>भूत: <b>सामान्य<\/b> (वह चला), <b>अपूर्ण<\/b> (वह चल रहा था / चलता था), <b>पूर्ण<\/b> (वह चला था)।<\/li>\n<li>भविष्यत्: केवल <b>सामान्य<\/b> (वह चलेगा)।<\/li>\n<\/ul>\nस्कूल का &lsquo;आसन्न भूत&rsquo; गुरु का &lsquo;पूर्ण वर्तमान&rsquo; है। गुरु ने &lsquo;आसन्न भूत&rsquo; नाम इसलिए बदला कि इसमें काम भूतकाल में शुरू होकर पूर्णता वर्तमान में बताता है (पृ. ३२३)। &lsquo;संदिग्ध&rsquo;, &lsquo;संभाव्य&rsquo;, &lsquo;हेतुहेतुमद&rsquo; उनके यहाँ अलग <b>अर्थ<\/b> हैं, जिनके 16 रूप मिलाकर गिने जाते हैं (पृ. ३२६–३२७)। परीक्षा में स्कूली तालिका ही चलती है; गुरु का भेद केवल जानकारी के लिए है।<\/div>\n<h3>गुरु के पाँच अर्थ (अंक ३६०, पृ. ३२४–३२६)<\/h3>\n<ul>\n<li><b>निश्चयार्थ:<\/b> विधान का निश्चय: &ldquo;लड़का आता है।&rdquo;<\/li>\n<li><b>संभावनार्थ:<\/b> अनुमान, इच्छा, कर्तव्य: &ldquo;कदाचित् पानी बरसे&rdquo;, &ldquo;तुम्हारी जय हो&rdquo;।<\/li>\n<li><b>संदेहार्थ:<\/b> &ldquo;लड़का आता होगा&rdquo;, &ldquo;नौकर गया होगा&rdquo;।<\/li>\n<li><b>आज्ञार्थ:<\/b> आज्ञा, उपदेश, निषेध: &ldquo;तुम जाओ&rdquo;, &ldquo;वहाँ मत जाना&rdquo;।<\/li>\n<li><b>संकेतार्थ:<\/b> दो घटनाओं में कार्य-कारण, पर दोनों अधूरी: &ldquo;यदि मेरे पास धन होता तो मैं चार काम करता&rdquo;।<\/li>\n<\/ul>\n\n<h2>वाच्य<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> क्रिया के उस रूपांतर को वाच्य कहते हैं जिससे पता चले कि वाक्य में विधान <b>कर्ता<\/b> के विषय में है, <b>कर्म<\/b> के विषय में है या केवल <b>भाव<\/b> के विषय में। गुरु (अंक ३४९, पृ. ३१५): &ldquo;स्त्री कपड़ा सीती है&rdquo; (कर्ता), &ldquo;कपड़ा सिया जाता है&rdquo; (कर्म), &ldquo;यहाँ बैठा नहीं जाता&rdquo; (भाव)।<\/div>\n<h3>तीन वाच्य<\/h3>\n<div class=\"cards\">\n<div><h3>कर्तृवाच्य<\/h3><p>उद्देश्य (प्रधान) कर्ता है; सकर्मक और अकर्मक दोनों में<\/p><p class=\"eq\"><span>सचिन<\/span> <span>क्रिकेट<\/span> <b>खेलता है<\/b>।<\/p><\/div>\n<div><h3>कर्मवाच्य<\/h3><p>उद्देश्य कर्म है; केवल सकर्मक में<\/p><p class=\"eq\"><b>सचिन के द्वारा क्रिकेट खेला जाता है।<\/b><\/p><\/div>\n<div><h3>भाववाच्य<\/h3><p>उद्देश्य न कर्ता न कर्म; केवल अकर्मक में; बहुधा असमर्थता<\/p><p class=\"eq\"><b>मुझसे चला नहीं जाता।<\/b><\/p><\/div>\n<\/div>\n<p>गुरु (अंक ३५२, पृ. ३१७): &ldquo;कर्तृवाच्य अकर्मक और सकर्मक दोनों प्रकार की क्रियाओं में होता है; कर्मवाच्य केवल सकर्मक क्रियाओं में और भाववाच्य केवल अकर्मक क्रियाओं में।&rdquo; यदि कर्मवाच्य या भाववाच्य में कर्ता लिखना ज़रूरी हो तो वह करण कारक में रखते हैं (&lsquo;लड़के <b>से<\/b> रोटी नहीं खाई गई&rsquo;); कर्मवाच्य में कभी &lsquo;द्वारा&rsquo; भी लगता है (&lsquo;मेरे द्वारा पुस्तक पढ़ी गई&rsquo;)।<\/p>\n<h3>कर्तृवाच्य से कर्मवाच्य: चरण-दर-चरण<\/h3>\n<ol class=\"steps\">\n<li>कर्म को वाक्य के आरंभ में उद्देश्य बनाइए (&lsquo;को&rsquo; हटा दीजिए)।<\/li>\n<li>कर्ता को &lsquo;से&rsquo; या &lsquo;के द्वारा&rsquo; के साथ बाद में लगाइए (&lsquo;ने&rsquo; हटा दीजिए)।<\/li>\n<li>क्रिया का <b>धातु-रूप (भूतकालिक कृदंत)<\/b> + <b>&lsquo;जाना&rsquo; क्रिया का वही काल<\/b> लगाइए।<\/li>\n<li>क्रिया का <b>लिंग-वचन कर्म के अनुसार<\/b> रखिए।<\/li>\n<li><b>काल वही रखिए<\/b>; बदलने पर उत्तर गलत हो जाता है।<\/li>\n<\/ol>\n<table>\n<tr><th>कर्तृवाच्य<\/th><th>कर्मवाच्य<\/th><th>नियम<\/th><\/tr>\n<tr><td>सचिन क्रिकेट खेलता है।<\/td><td>सचिन के द्वारा क्रिकेट खेला जाता है।<\/td><td>वर्तमान: खेला + जाता है<\/td><\/tr>\n<tr><td>मैं पत्र लिखता हूँ।<\/td><td>मेरे द्वारा पत्र लिखा जाता है।<\/td><td>कर्म &lsquo;पत्र&rsquo; पुल्लिंग<\/td><\/tr>\n<tr><td>माँ रोटी बनाती है।<\/td><td>माँ से रोटी बनाई जाती है।<\/td><td>रोटी स्त्रीलिंग: बनाई जाती<\/td><\/tr>\n<tr><td>सिपाही ने चोर को पकड़ा।<\/td><td>सिपाही से चोर पकड़ा गया।<\/td><td>भूत: पकड़ा + गया<\/td><\/tr>\n<tr><td>वह कविता लिखेगा।<\/td><td>उससे कविता लिखी जाएगी।<\/td><td>भविष्य: लिखी + जाएगी<\/td><\/tr>\n<\/table>\n<h3>कर्तृवाच्य से भाववाच्य<\/h3>\n<p>अकर्मक वाक्य में कर्ता को करण (&lsquo;से&rsquo;) में रखिए और क्रिया को &lsquo;साधारण रूप/भूतकालिक कृदंत + जाना&rsquo; बनाकर <b>सदा अन्य पुरुष, पुल्लिंग, एकवचन<\/b> में रखिए: &ldquo;मैं चल नहीं सकता&rdquo; &rarr; &ldquo;मुझसे चला नहीं जाता&rdquo;; &ldquo;वह उड़ नहीं सकती&rdquo; &rarr; &ldquo;उससे उड़ा नहीं जाता&rdquo;। भाववाच्य बहुधा <b>असमर्थता<\/b> के अर्थ में आता है (अंक ३५५, पृ. ३१९)।<\/p>\n<div class=\"trap\"><b>ध्यान दें:<\/b>\n<ul>\n<li>गुरु (पृ. ३१६ टिप्पणी): &ldquo;लड़के ने पुस्तक पढ़ी&rdquo; रूप के हिसाब से कर्म के अनुसार चलती है, पर अर्थ से कर्ता की प्रधानता है, इसलिए इसे <b>कर्तृवाच्य<\/b> ही माना जाता है।<\/li>\n<li>वाच्य बदलने पर काल वही रहे: &lsquo;खेलता है&rsquo; &rarr; &lsquo;खेला जाता है&rsquo;; &lsquo;खेला जाता था&rsquo; गलत है, क्योंकि वह भूत हो गया।<\/li>\n<li>गुरु (अंक ३६५, पृ. ३२८–३२९) &lsquo;प्रयोग&rsquo; को अलग मानते हैं: कर्तरि (क्रिया कर्ता के अनुसार), कर्मणि (क्रिया कर्म के अनुसार) और भावे (क्रिया न कर्ता, न कर्म के अनुसार)। स्कूल में &lsquo;प्रयोग&rsquo; पर आम तौर पर प्रश्न नहीं आते, पर नाम पहचानें।<\/li>\n<li>गुरु (अंक ३५३, पृ. ३१८) बताते हैं कि कर्मवाच्य तब आता है जब कर्ता अज्ञात हो (&lsquo;चोर पकड़ा गया&rsquo;), कानूनी भाषा हो (&lsquo;सख्त कार्रवाई की जाएगी&rsquo;), या असमर्थता हो।<\/li>\n<\/ul><\/div>\n\n<h2>अव्यय (अविकारी शब्द)<\/h2>\n<div class=\"def\"><b>परिभाषा:<\/b> जिन शब्दों का रूप लिंग, वचन, कारक या काल के कारण कभी नहीं बदलता, वे अव्यय या अविकारी शब्द हैं। &lsquo;अव्यय&rsquo; का अर्थ है जो व्यय न हो, घटे-बढ़े नहीं। जैसे &lsquo;यहाँ&rsquo;, &lsquo;और&rsquo;, &lsquo;वाह&rsquo;: चाहे कर्ता पुरुष हो या स्त्री, ये ज्यों के त्यों रहते हैं।<\/div>\n<p>अव्यय के चार प्रमुख भेद हैं: क्रियाविशेषण, संबंधसूचक, समुच्चयबोधक और विस्मयादिबोधक। स्कूल में पाँचवाँ वर्ग <b>निपात<\/b> भी पढ़ाया जाता है।<\/p>\n\n<h3>1. क्रियाविशेषण<\/h3>\n<div class=\"def\"><b>परिभाषा:<\/b> जिस अव्यय से क्रिया की कोई विशेषता (स्थान, काल, रीति, परिमाण) जानी जाए, वह क्रियाविशेषण है (गुरु, अंक २११, पृ. १७७)। जैसे: यहाँ, जल्दी, धीरे, अभी, बहुत। ये कभी विशेषण और दूसरे क्रियाविशेषण की विशेषता भी बताते हैं (&lsquo;बहुत सुंदर&rsquo;, &lsquo;बहुत धीरे&rsquo;)।<\/div>\n<p><b>अर्थ के अनुसार चार भेद<\/b> (अंक २२०–२२४, पृ. १८२–१८५); HTET में इन्हीं से प्रश्न बनते हैं:<\/p>\n<table>\n<tr><th>भेद<\/th><th>उपभेद<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>स्थानवाचक<\/td><td>स्थितिवाचक, दिशावाचक<\/td><td>यहाँ, वहाँ, आगे, ऊपर, भीतर; इधर, उधर, दूर, चारों ओर<\/td><\/tr>\n<tr><td>कालवाचक<\/td><td>समयवाचक, अवधिवाचक, पौनःपुन्यवाचक<\/td><td>आज, कल, अब, अभी, तुरंत; आजकल, सदा, दिनभर; बार-बार, प्रतिदिन<\/td><\/tr>\n<tr><td>परिमाणवाचक<\/td><td>अधिकता, न्यूनता, पर्याप्ति, तुलना, श्रेणी<\/td><td>बहुत, अत्यंत; थोड़ा, ज़रा; काफ़ी, केवल; अधिक, कम; थोड़ा-थोड़ा<\/td><\/tr>\n<tr><td>रीतिवाचक<\/td><td>प्रकार, निश्चय, अनिश्चय, स्वीकार, कारण, निषेध, अवधारण<\/td><td>धीरे, अचानक, चुपके; अवश्य, सचमुच; शायद; हाँ; इसलिए; नहीं, न; ही, तो, तक<\/td><\/tr>\n<\/table>\n<p><b>पहचान:<\/b> क्रिया से पूछिए। <i>कहाँ?<\/i> &rarr; स्थानवाचक। <i>कब?<\/i> &rarr; कालवाचक। <i>कितना?<\/i> &rarr; परिमाणवाचक। <i>कैसे?<\/i> &rarr; रीतिवाचक। गुरु के अनुसार जो शब्द पहले तीन में न बैठें, वे सब रीतिवाचक में रखे जाते हैं (अंक २२४)।<\/p>\n<p><b>प्रयोग और रूप के अनुसार<\/b> (गुरु, अंक २१३–२१८): साधारण (&lsquo;अब मैं क्या करूँ&rsquo;), संयोजक (जो उपवाक्य जोड़े: जब, जहाँ, जैसे), अनुबद्ध (अवधारण के लिए: ही, तक, भर); और रूप से मूल (ठीक, दूर, फिर), यौगिक (धीरे, प्रेमपूर्वक), स्थानीय (किसी स्थान पर क्रियाविशेषण बना हुआ: &lsquo;स्त्री सुंदर सीती है&rsquo;)।<\/p>\n<div class=\"trap\"><b>HTET 2022 Q33:<\/b> &ldquo;आनन्दा <b>चुपके-से<\/b> चली गई&rdquo;। &lsquo;कैसे गई?&rsquo; &rarr; चुपके-से: यह <b>रीतिवाचक<\/b> है। &lsquo;कब&rsquo; या &lsquo;कहाँ&rsquo; का उत्तर नहीं है।<\/div>\n\n<h3>2. संबंधसूचक (स्कूल में &lsquo;संबंधबोधक&rsquo;)<\/h3>\n<div class=\"def\"><b>परिभाषा:<\/b> जो अव्यय संज्ञा (या सर्वनाम) के बाद आकर उसका संबंध वाक्य के किसी दूसरे शब्द से जोड़े। गुरु (अंक २२९, पृ. १९९): &ldquo;धन <b>के बिना<\/b> किसीका काम नहीं चलता&rdquo;, &ldquo;नौकर गाँव <b>तक<\/b> गया&rdquo;, &ldquo;रात <b>भर<\/b> जागना&rdquo;। स्कूल में इसी का नाम &lsquo;संबंधबोधक&rsquo; है।<\/div>\n<p><b>क्रियाविशेषण और संबंधसूचक में फ़र्क:<\/b> अगर वही शब्द अकेला क्रिया की विशेषता बताए तो क्रियाविशेषण, और संज्ञा के साथ आए तो संबंधसूचक (अंक २३०, पृ. १९९)।<\/p>\n<table>\n<tr><th>क्रियाविशेषण<\/th><th>संबंधसूचक<\/th><\/tr>\n<tr><td>नौकर <b>यहाँ<\/b> रहता है।<\/td><td>नौकर मालिक <b>के यहाँ<\/b> रहता है।<\/td><\/tr>\n<tr><td>यह काम <b>पहले<\/b> करो।<\/td><td>जाने से <b>पहले<\/b> यह काम करो।<\/td><\/tr>\n<tr><td>वह <b>बाहर<\/b> गया।<\/td><td>घर <b>के बाहर<\/b> खड़ा है।<\/td><\/tr>\n<\/table>\n<p><b>अर्थ के अनुसार भेद<\/b> (अंक २३८, पृ. १९९–२०४; गुरु इन्हें केवल याद रखने के लिए सूची मानते हैं): कालवाचक (पहले, बाद, पश्चात्), स्थानवाचक (ऊपर, नीचे, पास, भीतर), दिशावाचक (ओर, तरफ, प्रति), साधनवाचक (द्वारा, मारफ़त), हेतुवाचक (लिए, कारण, मारे), विषयवाचक (बाबत, विषय), व्यतिरेकवाचक (सिवा, बिना, अतिरिक्त), विनिमयवाचक (बदले, जगह), सादृश्यवाचक (समान, तरह, सरीखा, जैसा), विरोधवाचक (विरुद्ध, खिलाफ़), सहचारवाचक (साथ, संग, सहित), संग्रहवाचक (तक, भर, मात्र), तुलनावाचक (अपेक्षा)।<\/p>\n<p><b>उदाहरण:<\/b> &ldquo;शीला <b>के समान<\/b> कोई आलसी नहीं है&rdquo;: &lsquo;के समान&rsquo; संज्ञा &lsquo;शीला&rsquo; का संबंध &lsquo;कोई&rsquo; से जोड़ता है और सादृश्य बताता है, इसलिए संबंधसूचक है।<\/p>\n<div class=\"trap\"><b>गुरु की सूचना:<\/b> ने, को, से, का-के-की, में जैसे विभक्ति-प्रत्यय अनुबद्ध संबंधसूचक की तरह दिखते हैं पर उन्हें संबंधसूचक नहीं गिनते, क्योंकि वे स्वतंत्र शब्द नहीं हैं और संस्कृत विभक्तियों से बने हैं (अंक २३२-ग, पृ. २००)। साथ ही गुरु (अंक २३३) बताते हैं कि संबंधसूचक के पहले बहुधा &lsquo;के&rsquo; आता है (धन के लिए, उसके पास), पर स्त्रीलिंग शब्दों (ओर, तरफ़, जगह, खातिर) के पहले &lsquo;की&rsquo; आता है।<\/div>\n\n<h3>3. समुच्चयबोधक (योजक)<\/h3>\n<div class=\"def\"><b>परिभाषा:<\/b> जो अव्यय (क्रिया की विशेषता न बताकर) एक वाक्य का संबंध दूसरे वाक्य से मिलाए, वह समुच्चयबोधक है (गुरु, अंक २४२, पृ. २१४)। जैसे: और, यदि, तो, क्योंकि, इसलिए। कभी ये दो शब्दों को भी जोड़ते हैं (&lsquo;राम और श्याम&rsquo;)।<\/div>\n<p>गुरु के दो मुख्य भेद (अंक २४३–२४५, पृ. २१६–२२६):<\/p>\n<div class=\"cards\">\n<div><h3>समानाधिकरण<\/h3><p>बराबर के (मुख्य) वाक्यों को जोड़ते हैं<\/p><p class=\"eq\"><span>और<\/span> <span>या<\/span> <span>पर<\/span> <span>इसलिए<\/span><\/p><\/div>\n<div><h3>व्यधिकरण<\/h3><p>मुख्य वाक्य के साथ आश्रित वाक्य को जोड़ते हैं<\/p><p class=\"eq\"><span>क्योंकि<\/span> <span>ताकि<\/span> <span>यदि&mdash;तो<\/span> <span>कि<\/span><\/p><\/div>\n<\/div>\n<h3>समानाधिकरण के चार उपभेद<\/h3>\n<table>\n<tr><th>उपभेद<\/th><th>काम<\/th><th>शब्द<\/th><\/tr>\n<tr><td>संयोजक<\/td><td>जोड़ना / संग्रह<\/td><td>और, व, तथा, एवं, भी<\/td><\/tr>\n<tr><td>विभाजक<\/td><td>चुनाव या त्याग<\/td><td>या, वा, अथवा, किंवा, या&mdash;या, चाहे&mdash;चाहे, न&mdash;न, नहीं तो<\/td><\/tr>\n<tr><td>विरोधदर्शक<\/td><td>पहली बात का निषेध/सीमा<\/td><td>पर, परंतु, किंतु, लेकिन, मगर, बल्कि, वरन<\/td><\/tr>\n<tr><td>परिणामदर्शक<\/td><td>पिछली बात का फल<\/td><td>इसलिए, सो, अतः, अतएव<\/td><\/tr>\n<\/table>\n<h3>व्यधिकरण के चार उपभेद<\/h3>\n<table>\n<tr><th>उपभेद<\/th><th>काम<\/th><th>शब्द और उदाहरण<\/th><\/tr>\n<tr><td>कारणवाचक<\/td><td>पहले वाक्य का कारण<\/td><td>क्योंकि, जोकि: वह फेल हुआ, क्योंकि उसने पढ़ाई नहीं की<\/td><\/tr>\n<tr><td>उद्देशवाचक<\/td><td>उद्देश्य/हेतु<\/td><td>कि, जो, ताकि, इसलिए कि: मैं मेहनत करता हूँ ताकि पास हो जाऊँ<\/td><\/tr>\n<tr><td>संकेतवाचक<\/td><td>जोड़े से आते हैं, पहली घटना पर दूसरी निर्भर<\/td><td>जो&mdash;तो, यदि&mdash;तो, यद्यपि&mdash;तथापि<\/td><\/tr>\n<tr><td>स्वरूपवाचक<\/td><td>पहली बात का स्पष्टीकरण<\/td><td>कि, अर्थात्, याने, मानो<\/td><\/tr>\n<\/table>\n<p>स्कूल में आम तौर पर समुच्चयबोधक के दो ही भेद सिखाए जाते हैं: <b>समानाधिकरण<\/b> और <b>व्यधिकरण<\/b>, और उप-भेद ऊपर वाले ही हैं।<\/p>\n<div class=\"trap\"><b>गुरु की टिप्पणी:<\/b> &lsquo;क्योंकि&rsquo; और &lsquo;इसलिए&rsquo; के बारे में वैयाकरणों में मतभेद है। गुरु का निर्णय: &lsquo;इसलिए&rsquo; समानाधिकरण (परिणामदर्शक) और &lsquo;क्योंकि&rsquo; व्यधिकरण (कारणवाचक) है, क्योंकि &lsquo;क्योंकि&rsquo; से शुरू होनेवाला वाक्य आश्रित होता है (अंक २४५-अ, पृ. २२३)। इसके अलावा &lsquo;भी&rsquo; गुरु के यहाँ संयोजक है और &lsquo;इसलिए&rsquo; कभी क्रियाविशेषण भी बन जाता है (पृ. १९०)। &lsquo;कि&rsquo; के तीन रूप याद रखें: विभाजक (कविता में), उद्देशवाचक, स्वरूपवाचक।<\/div>\n\n<h3>4. विस्मयादिबोधक<\/h3>\n<div class=\"def\"><b>परिभाषा:<\/b> जिन अव्ययों का वाक्य से व्याकरणिक संबंध नहीं होता और जो केवल वक्ता के हर्ष, शोक आदि भाव प्रकट करते हैं (गुरु, अंक २४८, पृ. २३४)। &ldquo;हाय! अब मैं क्या करूँ!&rdquo;: &lsquo;हाय&rsquo; शोक बताता है पर वाक्य के किसी शब्द से जुड़ा नहीं।<\/div>\n<table>\n<tr><th>भाव<\/th><th>शब्द<\/th><\/tr>\n<tr><td>हर्ष<\/td><td>आहा! वाह! शाबाश! जय!<\/td><\/tr>\n<tr><td>शोक<\/td><td>हाय! आह! हा राम! बाप रे!<\/td><\/tr>\n<tr><td>आश्चर्य<\/td><td>अरे! ओहो! क्या! हैं!<\/td><\/tr>\n<tr><td>तिरस्कार<\/td><td>छिः! धिक्! हट! चुप!<\/td><\/tr>\n<tr><td>स्वीकार<\/td><td>हाँ! जी हाँ! ठीक! बहुत अच्छा!<\/td><\/tr>\n<tr><td>सम्बोधन<\/td><td>अरे! अजी! हे! अहो!<\/td><\/tr>\n<\/table>\n<p>(अंक २४९, पृ. २३५)। स्कूल में इसे अलग शब्द-भेद के रूप में भी पढ़ाते हैं और विस्मयसूचक चिह्न (!) देखकर पहचानते हैं।<\/p>\n\n<h3>5. निपात (स्कूल की संज्ञा)<\/h3>\n<div class=\"def\"><b>परिभाषा (स्कूली पाठ्यपुस्तकों में):<\/b> जो अव्यय शब्द या वाक्य के अर्थ में विशेष बल, भाव या सीमा जोड़ता है, उसे निपात कहते हैं। यह कोई नया शब्द-भेद नहीं, किसी भी शब्द के बाद लगकर अर्थ को कसता है। उदाहरण: ही, भी, तो, तक, मात्र, केवल, भर, न, नहीं, मत, क्या, काश, जी।<\/div>\n<p><b>उदाहरण:<\/b> &ldquo;राम <b>ही<\/b> आया&rdquo; (केवल राम), &ldquo;राम <b>भी<\/b> आया&rdquo; (राम के साथ और भी), &ldquo;वह आया <b>तो<\/b> सही&rdquo; (आग्रह), &ldquo;मैंने उसे देखा <b>तक<\/b> नहीं&rdquo; (सीमा)। स्कूल की पुस्तकों में निपात के कई प्रकार (स्वीकार, नकार, निषेध, प्रश्न, विस्मय, बलदायक, तुलना, अवधारण, आदर) गिनाए जाते हैं; इनमें अवधारण/बलदायक वाले (ही, भी, तो, तक, मात्र, केवल, भर) सबसे अधिक पूछे जाते हैं।<\/p>\n<div class=\"trap\"><b>गुरु:<\/b> &lsquo;निपात&rsquo; को अलग भेद नहीं मानते। &lsquo;ही, तो, तक, भर, मात्र&rsquo; उनके यहाँ <b>अनुबद्ध क्रियाविशेषण<\/b> हैं (अवधारण के लिए: &ldquo;यह किसीने धोखा <b>ही<\/b> दिया है&rdquo;); &lsquo;तक, भर, मात्र&rsquo; संज्ञा के साथ <b>संबंधसूचक<\/b> भी बनते हैं (&lsquo;रात भर&rsquo;, &lsquo;नगर तक&rsquo;) और &lsquo;भी&rsquo; संयोजक समुच्चयबोधक है (पृ. १८३, १९१–१९३, २१७–२१८)। इसीलिए परीक्षा में प्रश्न का आधार देखिए: स्कूल का हो तो निपात, गुरु का हो तो अनुबद्ध क्रियाविशेषण।<\/div>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li><b>सकर्मक/अकर्मक:<\/b> क्रिया से पहले &lsquo;क्या/किसे&rsquo; पूछिए। उत्तर मिले तो सकर्मक। दो उत्तर (किसे + क्या) मिलें तो द्विकर्मक।<\/li>\n<li><b>प्रेरणार्थक:<\/b> क्रिया में &lsquo;आ&rsquo; या &lsquo;वा&rsquo; जुड़ा हो (सुनाना, सुनवाना)? किसी और से कराने का भाव? तो प्रेरणार्थक। सब प्रेरणार्थक सकर्मक होते हैं।<\/li>\n<li><b>नामधातु:<\/b> क्रिया के मूल में कोई संज्ञा/विशेषण दिखे (बात, हाथ, अपना, लाठी)? तो नामधातु।<\/li>\n<li><b>संयुक्त/रंजक:<\/b> क्रिया दो टुकड़ों में है और दूसरा टुकड़ा (लेना, जाना, देना, उठना, डालना) अर्थ में रंग भरता है? तो संयुक्त।<\/li>\n<li><b>काल:<\/b> अंतिम शब्द देखिए: था &rarr; भूत; है + (ता/रहा) &rarr; वर्तमान; गा &rarr; भविष्य; होगा + पूर्ण रूप &rarr; संदिग्ध।<\/li>\n<li><b>वाच्य:<\/b> कर्ता &lsquo;ने/से/द्वारा&rsquo; के साथ और क्रिया में &lsquo;जाना&rsquo; हो तो कर्मवाच्य (सकर्मक) या भाववाच्य (अकर्मक, असमर्थता)। नहीं तो कर्तृवाच्य।<\/li>\n<li><b>अव्यय:<\/b> शब्द के रूप-परिवर्तन न होने से पहचानिए; फिर काम देखिए: क्रिया की विशेषता (क्रियाविशेषण), संज्ञा के साथ संबंध (संबंधसूचक), दो वाक्य जोड़ना (समुच्चयबोधक), भाव प्रकट (विस्मयादिबोधक), बल देना (निपात)।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table>\n<tr><th>जोड़ा<\/th><th>फ़र्क कैसे करें<\/th><\/tr>\n<tr><td>सकर्मक बनाम अपूर्ण अकर्मक<\/td><td>&lsquo;लड़का चतुर है&rsquo; में &lsquo;चतुर&rsquo; पूर्ति है, कर्म नहीं; इसलिए क्रिया अकर्मक<\/td><\/tr>\n<tr><td>द्विकर्मक बनाम प्रेरणार्थक<\/td><td>द्विकर्मक में दो कर्म; प्रेरणार्थक में कराने का भाव। &lsquo;पढ़ाना&rsquo; दोनों हो सकता है<\/td><\/tr>\n<tr><td>प्रेरणार्थक बनाम नामधातु<\/td><td>प्रेरणार्थक धातु से बनता है (सुन&rarr;सुनाना), नामधातु संज्ञा/विशेषण से (बात&rarr;बतियाना)<\/td><\/tr>\n<tr><td>क्रियाविशेषण बनाम संबंधसूचक<\/td><td>अकेला = क्रियाविशेषण; संज्ञा + के/की के साथ = संबंधसूचक<\/td><\/tr>\n<tr><td>इसलिए (क्रियाविशेषण/समुच्चयबोधक)<\/td><td>दो वाक्य जोड़कर परिणाम बताए तो समुच्चयबोधक; क्रिया का कारण बताए तो क्रियाविशेषण<\/td><\/tr>\n<tr><td>कर्मवाच्य बनाम भाववाच्य<\/td><td>कर्म हो तो कर्मवाच्य (सकर्मक); कर्म नहीं और असमर्थता हो तो भाववाच्य (अकर्मक)<\/td><\/tr>\n<tr><td>आसन्न भूत बनाम पूर्ण भूत<\/td><td>&lsquo;गया है&rsquo; आसन्न; &lsquo;गया था&rsquo; पूर्ण<\/td><\/tr>\n<\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2020 Q42<\/h3>\n<p>सकर्मक क्रिया युक्त वाक्य चुनिए: (A) भिखारी मंदिर के बाहर चिल्ला रहे थे। (B) मछलियाँ तालाब में तैर रही हैं। (C) धावक सड़क पर दौड़ रहे हैं। (D) बहन ने भाई को मिठाई खिलाई।<\/p>\n<div class=\"ex\"><b>उत्तर: (D)<\/b>\n<ol class=\"steps\">\n<li>A: &lsquo;क्या चिल्ला रहे थे?&rsquo; कोई उत्तर नहीं; &lsquo;मंदिर के बाहर&rsquo; स्थान है। अकर्मक।<\/li>\n<li>B: &lsquo;तालाब में&rsquo; स्थान; कर्म नहीं। अकर्मक।<\/li>\n<li>C: &lsquo;सड़क पर&rsquo; स्थान। अकर्मक।<\/li>\n<li>D: &lsquo;किसे खिलाई? भाई को। क्या खिलाई? मिठाई&rsquo;: दो कर्म, इसलिए सकर्मक (द्विकर्मक, प्रेरणार्थक रूप)।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2021 Q31<\/h3>\n<p>कौन-सा वाक्य संबंधसूचक अव्यय का उदाहरण है? (A) इतना खा लिया, इसे कैसे पचाओगे। (B) शीला के समान कोई आलसी नहीं है। (C) मैंने पर्याप्त पढ़ लिया है, अब थोड़ा आराम करूँगा। (D) ज़रा सोच-समझकर बोलिए।<\/p>\n<div class=\"ex\"><b>उत्तर: (B)<\/b>\n<ol class=\"steps\">\n<li>A: &lsquo;इतना&rsquo; क्रिया &lsquo;खा लिया&rsquo; की मात्रा बताता है: परिमाणवाचक क्रियाविशेषण।<\/li>\n<li>B: &lsquo;के समान&rsquo; संज्ञा &lsquo;शीला&rsquo; का संबंध &lsquo;कोई (आलसी)&rsquo; से जोड़कर समानता बताता है: सादृश्यवाचक संबंधसूचक।<\/li>\n<li>C: &lsquo;पर्याप्त&rsquo; (पढ़ने की मात्रा) और &lsquo;थोड़ा&rsquo; (आराम की मात्रा): परिमाणवाचक क्रियाविशेषण।<\/li>\n<li>D: &lsquo;ज़रा&rsquo; परिमाण और &lsquo;सोच-समझकर&rsquo; रीति बताते हैं: क्रियाविशेषण।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2021 Q42<\/h3>\n<p>&lsquo;सचिन क्रिकेट खेलता है।&rsquo; को कर्मवाच्य में बदलिए: (A) सचिन क्रिकेट खेलेगा। (B) सचिन क्रिकेट नहीं खेलता है। (C) सचिन से क्रिकेट खेला जाता था। (D) सचिन के द्वारा क्रिकेट खेला जाता है।<\/p>\n<div class=\"ex\"><b>उत्तर: (D)<\/b>\n<ol class=\"steps\">\n<li>कर्म &lsquo;क्रिकेट&rsquo; उद्देश्य बनेगा; कर्ता &lsquo;सचिन&rsquo; &lsquo;के द्वारा/से&rsquo; के साथ।<\/li>\n<li>क्रिया = खेला + जाता है, और काल वही (वर्तमान)।<\/li>\n<li>A में काल बदलकर भविष्य हो गया और वाच्य वही रहा; B निषेध में बदल गया, वाच्य नहीं बदला; C में कर्मवाच्य तो है पर काल भूत (&lsquo;जाता था&rsquo;) हो गया।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2021 Q43<\/h3>\n<p>निम्न में से किस विकल्प की सभी क्रियाएँ &lsquo;अकर्मक&rsquo; हैं? (A) चलना, मुस्काराना, खिलना (B) दौड़ना, रूठना, लिखना (C) हँसना, खाना, सोना (D) रोना, उठना, काटना<\/p>\n<div class=\"ex\"><b>उत्तर: (A)<\/b>\n<ol class=\"steps\">\n<li>A: चलना, मुस्कराना, खिलना (कर्म नहीं लेते): सब अकर्मक।<\/li>\n<li>B: &lsquo;लिखना&rsquo; सकर्मक (क्या लिखा? पत्र)।<\/li>\n<li>C: &lsquo;खाना&rsquo; सकर्मक (क्या खाया?)।<\/li>\n<li>D: &lsquo;काटना&rsquo; सकर्मक (क्या काटा?)। इसलिए सिर्फ़ A पूरी तरह अकर्मक।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2022 Q33<\/h3>\n<p>&ldquo;आनन्दा चुपके-से चली गई।&rdquo; वाक्य में किस प्रकार के क्रियाविशेषण का प्रयोग हुआ है? (A) कालवाचक (B) रीतिवाचक (C) परिमाणवाचक (D) स्थानवाचक<\/p>\n<div class=\"ex\"><b>उत्तर: (B) रीतिवाचक<\/b>\n<ol class=\"steps\">\n<li>क्रिया है &lsquo;गई&rsquo;। &lsquo;कैसे गई?&rsquo; &rarr; &lsquo;चुपके-से&rsquo;।<\/li>\n<li>&lsquo;कब&rsquo; (काल), &lsquo;कितना&rsquo; (परिमाण) या &lsquo;कहाँ&rsquo; (स्थान) का उत्तर नहीं बनता।<\/li>\n<li>गुरु के अनुसार &lsquo;चुपके&rsquo; विशेषण से बना यौगिक क्रियाविशेषण है और रीति बताता है (पृ. १८०, १८४)।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2023 Q42<\/h3>\n<p>क्रिया के संबंध में <b>अनुचित<\/b> विकल्प चुनिए: (A) कर्म के आधार पर क्रिया के &lsquo;सकर्मक&rsquo; एवं &lsquo;अकर्मक&rsquo; दो भेद माने जाते हैं। (B) सभी प्रेरणार्थक क्रियाएँ अकर्मक होती हैं। (C) &lsquo;पिता पुत्र से पत्र लिखवाता है।&rsquo; में प्रेरणार्थक क्रिया है। (D) &lsquo;बतियाना&rsquo;, &lsquo;लठियाना&rsquo; एवं &lsquo;अपनाना&rsquo; नामधातु क्रिया के उदाहरण हैं।<\/p>\n<div class=\"ex\"><b>उत्तर: (B)<\/b>\n<ol class=\"steps\">\n<li>A सही है: कर्म के आधार पर दो भेद (गुरु अंक १८९)।<\/li>\n<li>B गलत है: गुरु के अनुसार &ldquo;सब प्रेरणार्थक क्रियाएँ सकर्मक होती हैं&rdquo; (अंक २०३-अ)। &lsquo;लिखवाता है&rsquo; में &lsquo;पत्र&rsquo; कर्म है।<\/li>\n<li>C सही है: &lsquo;लिखवाना&rsquo; दूसरा प्रेरणार्थक रूप है; पिता प्रेरक कर्ता, पुत्र प्रेरित कर्ता।<\/li>\n<li>D सही है: तीनों गुरु के उदाहरण हैं (अंक २०९)। इसलिए अनुचित कथन B।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2024 Q32<\/h3>\n<p>वाक्य में प्रयुक्त क्रिया की दृष्टि से <b>असंगत<\/b> विकल्प: (A) अध्यापिका छात्राओं को भूगोल पढ़ा रही है &mdash; द्विकर्मक क्रिया (B) निशीथ जोर-जोर-से हँस रहा है &mdash; अकर्मक क्रिया (C) मदारी अनेक करतब दिखलाकर बच्चों को ललचाता है &mdash; अकर्मक क्रिया (D) लड़-झगड़कर वह अपना हिस्सा ले ही मरा &mdash; रंजक क्रिया<\/p>\n<div class=\"ex\"><b>उत्तर: (C)<\/b>\n<ol class=\"steps\">\n<li>A: कर्म दो (छात्राओं को, भूगोल): द्विकर्मक, सही।<\/li>\n<li>B: &lsquo;हँसना&rsquo; में कर्म नहीं: अकर्मक, सही।<\/li>\n<li>C: &lsquo;ललचाना&rsquo; उभयविध धातु है (गुरु अंक १९२)। यहाँ &lsquo;बच्चों को&rsquo; कर्म है और गुरु का अपना उदाहरण है &ldquo;मदारी बच्चों को ललचाता है&rdquo;; इसलिए यहाँ क्रिया <b>सकर्मक<\/b> है। &lsquo;अकर्मक&rsquo; कहना असंगत है।<\/li>\n<li>D: &lsquo;ले (ही) मरा&rsquo; संयुक्त क्रिया का प्रयोग (परीक्षा-कुंजी में रंजक)।<\/li>\n<\/ol><\/div>\n<div class=\"trap\">D पर शंका हो सकती है (गुरु की सूची में &lsquo;मरना&rsquo; नहीं), पर परीक्षा में D को सही माना गया और असंगत केवल C ठहरा। इसलिए C ही उत्तर है।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li><b>क्रिया<\/b> = विकारी शब्द जिससे कर्ता के बारे में विधान हो; मूल अंश <b>धातु<\/b>, धातु+ना = साधारण रूप।<\/li>\n<li><b>सकर्मक<\/b> की जाँच: &lsquo;क्या/किसे&rsquo; का उत्तर मिले तो सकर्मक; <b>द्विकर्मक<\/b> में गौण (प्राणी) + मुख्य (वस्तु) कर्म।<\/li>\n<li><b>उभयविध<\/b> धातु (ललचाना, भरना, बदलना, खुजलाना, भूलना) कर्म हो तो सकर्मक, नहीं तो अकर्मक।<\/li>\n<li><b>प्रेरणार्थक:<\/b> + आ (पहला), + वा (दूसरा); गुरु: सब प्रेरणार्थक क्रियाएँ <b>सकर्मक<\/b> हैं।<\/li>\n<li><b>नामधातु:<\/b> संज्ञा/विशेषण से बनी (बात&rarr;बतियाना, अपना&rarr;अपनाना, लाठी&rarr;लठियाना); ध्वनि से बनी अनुकरण-धातु (खटखटाना)।<\/li>\n<li><b>संयुक्त क्रिया:<\/b> मुख्य + सहकारी (गुरु की 17 में से); स्कूल में इन्हें रंजक कहते हैं।<\/li>\n<li><b>काल:<\/b> भूत 6 (सामान्य, आसन्न, पूर्ण, अपूर्ण, संदिग्ध, हेतुहेतुमद), वर्तमान 3, भविष्य 3; गुरु के 7 काल और 5 अर्थ अलग।<\/li>\n<li><b>वाच्य:<\/b> कर्तृ (दोनों क्रियाएँ), कर्म (केवल सकर्मक), भाव (केवल अकर्मक, असमर्थता); रूपांतर में <b>काल वही रखें<\/b>।<\/li>\n<li><b>क्रियाविशेषण<\/b> के 4 भेद: स्थान, काल, परिमाण, रीति। <b>संबंधसूचक<\/b> संज्ञा के साथ (के समान, के बिना)।<\/li>\n<li><b>समुच्चयबोधक:<\/b> समानाधिकरण (संयोजक, विभाजक, विरोधदर्शक, परिणामदर्शक) और व्यधिकरण (कारण, उद्देश, संकेत, स्वरूप)। <b>विस्मयादिबोधक<\/b> का वाक्य से संबंध नहीं।<\/li>\n<li><b>निपात<\/b> (ही, भी, तो, तक, मात्र) स्कूल की संज्ञा; गुरु इन्हें अनुबद्ध क्रियाविशेषण कहते हैं।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: &lsquo;गुरु ने शिष्य को पोथी दी&rsquo; में &lsquo;शिष्य को&rsquo; क्या है? (A) मुख्य कर्म (B) गौण कर्म (C) पूर्ति (D) संप्रदान कारक की क्रिया<\/summary><p><b>उत्तर: (B)<\/b> &lsquo;शिष्य&rsquo; प्राणी है, इसलिए गौण कर्म; &lsquo;
