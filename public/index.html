्थान या गुण\" पर हैं। 2021 Q35 और 2024 Q44 में चार वर्णों के गुण दिए थे और जो गुण-सूची <b>असंगत<\/b> (ग़लत) हो, वह चुनना था। 2022 Q43 सीधा था: 'ल' का उच्चारण स्थान क्या है। यानी परीक्षा में रटी हुई सूची नहीं, हर वर्ण का स्थान, प्राण और घोष एक साथ जाँचना पड़ता है। इस पूरे पाठ का लक्ष्य यही है कि आप किसी भी वर्ण के तीनों गुण दो सेकंड में बता सकें।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> वह सबसे छोटी ध्वनि, जिसके और टुकड़े नहीं हो सकते, <b>वर्ण<\/b> कहलाती है। जैसे 'कमल' शब्द में क्, अ, म्, अ, ल्, अ, ये अलग-अलग ध्वनियाँ हैं और हर एक वर्ण है। वर्णों के व्यवस्थित समूह को <b>वर्णमाला<\/b> कहते हैं। वर्णों के बारे में पढ़ाने वाले व्याकरण के भाग को <b>वर्ण-विचार<\/b> कहते हैं। इसमें वर्णों की गिनती, उनके भेद, बोलने का स्थान और ढंग, और लिखने का रूप (लिपि) आते हैं।<\/div>\n<p>कामता प्रसाद गुरु की परिभाषा: \"वर्णों के समुदाय को वर्णमाला कहते हैं। हिंदी वर्णमाला में ४६ वर्ण हैं। इनके दो भेद हैं, (१) स्वर (२) व्यंजन\" (पृ. ५५, अंक ३)। साथ ही वे कहते हैं कि लिखित भाषा में मूल ध्वनियों के लिए जो चिह्न माने गए हैं, वे भी वर्ण कहलाते हैं और जिस रूप में वर्ण लिखे जाते हैं, उसे <b>लिपि<\/b> कहते हैं। हिंदी देवनागरी लिपि में लिखी जाती है (पृ. ५७, अंक ८)।<\/p>\n<p>यह पाठ आगे के सब पाठों की नींव है। सन्धि इसी पर टिकी है: जब 'त्' के बाद 'च' आता है तो 'त्' का 'च्' हो जाता है (उत्+चारण = उच्चारण), और यह समझने के लिए जानना पड़ता है कि 'त' दंत्य है और 'च' तालव्य। वर्तनी भी यहीं से जुड़ी है: अनुस्वार कब लगेगा और पंचमाक्षर कब, यह वर्ग के नियम से तय होता है।<\/p>\n<p><b>एक रोज़मर्रा का उदाहरण:<\/b> वर्ण वैसे हैं जैसे ईंट। एक ईंट को और तोड़ें तो वह ईंट नहीं रहती। ईंटों से दीवार (अक्षर), दीवारों से कमरा (शब्द) और कमरों से मकान (वाक्य) बनता है। वर्ण-विचार ईंट की जाँच है: कितनी तरह की ईंटें हैं, कौन-सी कहाँ बनती है (स्थान), किस ज़ोर से बनती है (प्राण) और बनते समय आवाज़ गूँजती है या नहीं (घोष)।<\/p>\n\n<h2>मूल अवधारणा: ध्वनि कैसे बनती है<\/h2>\n<p>हर वर्ण के पीछे तीन सवाल हैं, और पूरा वर्ण-विचार इन्हीं के जवाब हैं।<\/p>\n<ol class=\"steps\">\n<li><b>कहाँ से?<\/b> मुँह के किस भाग से ध्वनि निकली: कंठ, तालु, मूर्धा, दाँत, ओठ या नाक। यह <b>उच्चारण स्थान<\/b> है। गुरु इसे \"स्थान\" कहते हैं (पृ. ६१, अंक ३०): \"मुख के जिस भाग से जिस अक्षर का उच्चारण होता है, उसे उस अक्षर का स्थान कहते हैं\"।<\/li>\n<li><b>कैसे?<\/b> ध्वनि निकलते समय स्वर-यंत्र और जीभ ने क्या किया: बंद रहे, खुले रहे, घिसे। यह <b>प्रयत्न<\/b> है। गुरु (पृ. ६२, अंक ३२) के अनुसार \"वर्णों के उच्चारण की रीति को प्रयत्न कहते हैं।\" इसके दो हिस्से हैं: <b>आभ्यंतर प्रयत्न<\/b> (ध्वनि निकलने से पहले की क्रिया) और <b>बाह्य प्रयत्न<\/b> (ध्वनि के अंत की क्रिया)।<\/li>\n<li><b>कितना ज़ोर और कितनी गूँज?<\/b> साँस कितनी ज़्यादा लगी (अल्पप्राण या महाप्राण) और स्वर-तंत्री में कंपन हुआ या नहीं (घोष या अघोष)। ये दोनों बाह्य प्रयत्न के अंतर्गत आते हैं।<\/li>\n<\/ol>\n<p><b>स्वयं जाँचें:<\/b> कान बंद करके 'ग' और 'क' बोलिए। 'ग' में गले के अंदर हल्की गूँज (कंपन) महसूस होगी, 'क' में नहीं। यही घोष-अघोष का अंतर है। अब 'क' और 'ख' के आगे हथेली रखकर बोलिए। 'ख' में हवा का झोंका ज़्यादा लगेगा, क्योंकि उसमें 'ह' जैसी ध्वनि मिली हुई है (क्+ह)। यही अल्पप्राण-महाप्राण का अंतर है।<\/p>\n\n<h2>वर्णों के मुख्य भेद: स्वर और व्यंजन<\/h2>\n<div class=\"cards\">\n<div><h3>स्वर (११)<\/h3><p>अ आ इ ई उ ऊ ऋ ए ऐ ओ औ। इनका उच्चारण स्वतंत्र होता है।<\/p><\/div>\n<div><h3>व्यंजन (३३)<\/h3><p>क से ह तक। स्वर की सहायता के बिना नहीं बोले जा सकते।<\/p><\/div>\n<div><h3>संयुक्त (३)<\/h3><p>क्ष, त्र, ज्ञ। गुरु के अनुसार अलग वर्ण नहीं, दो व्यंजनों का मेल।<\/p><\/div>\n<div><h3>अयोगवाह (२)<\/h3><p>अनुस्वार (ं) और विसर्ग (ः)। गुरु इन्हें \"व्यंजनों में दो वर्ण\" कहते हैं।<\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>गिनती का भ्रम (गुरु बनाम स्कूल):<\/b> गुरु ने ४६ वर्ण गिने हैं: ११ स्वर + ३३ व्यंजन + अनुस्वार और विसर्ग = ४६ (पृ. ५५-५६)। क्ष, त्र, ज्ञ को वे अलग नहीं गिनते, पर बताते हैं कि \"इनके सिवा वर्णमाला में तीन व्यंजन और मिला दिये जाते हैं।\" स्कूली पाठ्यपुस्तकों में चौथा संयुक्त व्यंजन 'श्र' भी जोड़ा जाता है (श्+र), इसलिए संयुक्त व्यंजन ४ कहे जाते हैं, और अनुस्वार-विसर्ग को 'अयोगवाह' (न स्वर, न व्यंजन) कहा जाता है। गुरु 'अयोगवाह' शब्द का प्रयोग नहीं करते। परीक्षा में प्रश्न जिस पुस्तक के हिसाब से हो, उसी संख्या को चुनें। विकल्पों में ४४, ४५, ४६, ५२ आदि अलग-अलग मान्यताओं के कारण आते हैं।<\/div>\n\n<h2>स्वर<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिन वर्णों का उच्चारण स्वतंत्रता से होता है और जो व्यंजनों के उच्चारण में सहायक होते हैं, वे स्वर हैं (गुरु, पृ. ५५, अंक ४)। इनके उच्चारण में वागिंद्रिय (स्वर-यंत्र का मार्ग) खुली रहती है, इसीलिए इनका आभ्यंतर प्रयत्न <b>विवृत<\/b> कहलाता है (पृ. ६२)।<\/div>\n<p>हिंदी में स्वर ११ हैं: अ आ इ ई उ ऊ ऋ ए ऐ ओ औ। गुरु की टिप्पणी: संस्कृत में ऋ, ऌ, ॡ ये तीन और स्वर हैं, पर हिंदी में इनका प्रयोग नहीं होता। ऋ भी केवल तत्सम शब्दों में आता है: ऋषि, ऋण, ऋतु, कृपा, नृत्य, मृत्यु।<\/p>\n\n<h3>१. उत्पत्ति के अनुसार: मूल स्वर और संधि-स्वर<\/h3>\n<p>गुरु (पृ. ६३, अंक ३५) स्वरों को दो भागों में बाँटते हैं। जिन स्वरों की उत्पत्ति किसी दूसरे स्वर से नहीं है, वे <b>मूल स्वर<\/b> हैं और ये चार हैं: अ, इ, उ, ऋ। मूल स्वरों के मेल से बने हुए स्वर <b>संधि-स्वर<\/b> हैं: आ, ई, ए, ऐ, ओ, औ।<\/p>\n<p>संधि-स्वर के भी दो उपभेद हैं (अंक ३६): <b>दीर्घ<\/b> (एक ही मूल स्वर में उसी को मिलाने से: अ+अ = आ, इ+इ = ई, उ+उ = ऊ) और <b>संयुक्त<\/b> (भिन्न स्वरों के मेल से: अ+इ = ए, अ+उ = ओ, आ+ए = ऐ, आ+ओ = औ)।<\/p>\n\n<h3>२. मात्रा-काल के अनुसार: ह्रस्व, दीर्घ, प्लुत<\/h3>\n<p>उच्चारण में लगने वाले समय को मात्रा कहते हैं (अंक ३७)। जिस स्वर के बोलने में एक मात्रा का समय लगे वह <b>लघु<\/b> (ह्रस्व) है, और दो मात्रा का समय लगे तो वह <b>गुरु<\/b> (दीर्घ) है।<\/p>\n<table><tr><th>भेद<\/th><th>समय<\/th><th>स्वर<\/th><\/tr>\n<tr><td>ह्रस्व (लघु)<\/td><td>एक मात्रा<\/td><td>अ, इ, उ, ऋ<\/td><\/tr>\n<tr><td>दीर्घ (गुरु)<\/td><td>दो मात्राएँ<\/td><td>आ, ई, ऊ, ए, ऐ, ओ, औ<\/td><\/tr>\n<tr><td>प्लुत<\/td><td>तीन मात्राएँ<\/td><td>दीर्घ स्वर के आगे ३ का अंक: ओ३म्, राम३<\/td><\/tr><\/table>\n<p>गुरु की सूचना (पृ. ६३-६४): संस्कृत में प्लुत तीसरा भेद माना जाता है, पर हिंदी में उसका उपयोग नहीं होता। 'प्लुत' का अर्थ \"उछला हुआ\" है। यह प्रायः दूर से पुकारने, रोने, गाने और चिल्लाने में आता है, जैसे \"लड़के ३\"। स्कूली पुस्तकों में भी प्लुत की पहचान यही है: दीर्घ के आगे ३ का अंक।<\/p>\n<div class=\"trap\"><b>ध्यान दें:<\/b> गुरु लिखते हैं कि सब मूल स्वर लघु हैं और सब संधि-स्वर गुरु। ए, ऐ, ओ, औ की गिनती <b>दीर्घ<\/b> में ही होती है, ये ह्रस्व नहीं हैं। 'ऋ' ह्रस्व है। परीक्षा में \"दीर्घ स्वर नहीं है\" वाले प्रश्न में उत्तर प्रायः ऋ होता है।<\/div>\n\n<h3>३. जाति के अनुसार: सवर्ण और असवर्ण<\/h3>\n<p>गुरु (पृ. ६४, अंक ३८): समान स्थान और प्रयत्न से उत्पन्न स्वर <b>सवर्ण<\/b> (सजातीय) हैं, जैसे अ-आ, इ-ई, उ-ऊ। जिनके स्थान और प्रयत्न एक से नहीं हैं, वे <b>असवर्ण<\/b> (विजातीय) हैं, जैसे अ-इ, अ-ऊ, इ-ऊ। ए, ऐ, ओ, औ में आपस में सवर्णता नहीं मानी जाती, क्योंकि ये असवर्ण स्वरों से बने हैं। यह भेद सन्धि में सीधे काम आता है: सवर्ण स्वर मिले तो दीर्घ बनता है, असवर्ण मिले तो गुण, वृद्धि या यण् होता है।<\/p>\n\n<h3>४. अनुनासिकता के अनुसार: सानुनासिक और निरनुनासिक<\/h3>\n<p>अगर साँस पूरी तरह मुँह से निकले तो शुद्ध (निरनुनासिक) ध्वनि निकलती है। अगर साँस का कुछ अंश नाक से भी निकले तो ध्वनि सानुनासिक होती है। इसका चिह्न चंद्रबिंदु (ँ) है: गाँव, ऊँचा, आँख (पृ. ६४, अंक ३९)।<\/p>\n\n<h3>५. स्वर-वर्गीकरण की आधुनिक विधि (HTET 2021 और 2024 का आधार)<\/h3>\n<p>गुरु की पुस्तक में स्वरों का यह वर्गीकरण नहीं मिलता। HTET के प्रश्न (2021 Q35, 2024 Q44) स्कूली पाठ्यपुस्तकों वाली इस विधि पर हैं, जिसमें स्वर को तीन आधारों पर परखा जाता है।<\/p>\n<table><tr><th>आधार<\/th><th>भेद<\/th><th>स्वर<\/th><\/tr>\n<tr><td>जीभ का भाग<\/td><td>अग्र / मध्य / पश्च<\/td><td>अग्र: इ ई ए ऐ; मध्य: अ; पश्च: आ उ ऊ ओ औ<\/td><\/tr>\n<tr><td>मुख का खुलना<\/td><td>संवृत / अर्धसंवृत / अर्धविवृत / विवृत<\/td><td>संवृत: इ ई उ ऊ; अर्धसंवृत: ए ओ; अर्धविवृत: अ ऐ औ; विवृत: आ<\/td><\/tr>\n<tr><td>होठों की आकृति<\/td><td>वृत्तमुखी / अवृत्तमुखी<\/td><td>वृत्तमुखी (गोल): उ ऊ ओ औ; शेष अवृत्तमुखी<\/td><\/tr><\/table>\n<p>'अ' को \"उदासीन\" भी कहा जाता है, क्योंकि यह जीभ के न आगे और न पीछे बनता है। इस तालिका में ऋ का उच्चारण हिंदी में 'रि' जैसा होता है, इसलिए इसे इ के निकट अग्र, संवृत और <b>अवृत्तमुखी<\/b> माना जाता है (यह स्कूली परंपरा है, गुरु का नहीं)। इसी से 2024 Q44 का उत्तर निकलता है।<\/p>\n<p><b>याद करने की युक्ति:<\/b> 'अग्र' = जीभ आगे = इ-वर्ग (इ ई ए ऐ)। 'वृत्तमुखी' = होंठ गोल = उ-वर्ग (उ ऊ ओ औ)। 'विवृत' = मुँह सबसे ज़्यादा खुला = आ।<\/p>\n\n<h3>मात्रा और बारहखड़ी<\/h3>\n<p>गुरु (पृ. ५७-५८, अंक ९-१४): व्यंजनों में मिलने पर स्वर का जो बदला हुआ रूप होता है, वह <b>मात्रा<\/b> कहलाता है। 'अ' की कोई मात्रा नहीं है। व्यंजन में 'अ' मिला होता है, इसलिए क्+अ = क। मात्राओं की जगह:<\/p>\n<table><tr><th>जगह<\/th><th>मात्राएँ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>व्यंजन के आगे (दाएँ)<\/td><td>ा, ी, ो, ौ<\/td><td>का, की, को, कौ<\/td><\/tr>\n<tr><td>व्यंजन के पहले (बाएँ)<\/td><td>ि<\/td><td>कि<\/td><\/tr>\n<tr><td>व्यंजन के ऊपर<\/td><td>े, ै<\/td><td>के, कै<\/td><\/tr>\n<tr><td>व्यंजन के नीचे<\/td><td>ु, ू, ृ<\/td><td>कु, कू, कृ<\/td><\/tr><\/table>\n<p>अनुस्वार स्वर के ऊपर और विसर्ग स्वर के पीछे आता है: कं, काः। र् में उ और ऊ की मात्राएँ अलग आकार लेती हैं: रु, रू। ऋ की मात्रा को छोड़कर, अं और अः को लेकर व्यंजन के साथ सब स्वरों के मेल को <b>बारहखड़ी<\/b> कहते हैं (गुरु के अनुसार यह शब्द 'द्वादशाक्षरी' का अपभ्रंश है)। क की बारहखड़ी: क, का, कि, की, कु, कू, के, कै, को, कौ, कं, कः। स्वर या स्वरांत व्यंजन को <b>अक्षर<\/b> कहते हैं।<\/p>\n\n<h2>व्यंजन<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> व्यंजन वे वर्ण हैं जो स्वर की सहायता के बिना नहीं बोले जा सकते (गुरु, पृ. ५५, अंक ५)। व्यंजनों में बोलने की सुविधा के लिए 'अ' मिला दिया गया है। जब व्यंजन में कोई स्वर नहीं मिला होता, तब उसके नीचे हल् (्) लगाते हैं: क्, थ्, म्।<\/div>\n<p>गुरु के अनुसार व्यंजन ३३ हैं: क ख ग घ ङ, च छ ज झ ञ, ट ठ ड ढ ण, त थ द ध न, प फ ब भ म, य र ल व, श ष स ह। आभ्यंतर प्रयत्न (उच्चारण में वागिंद्रिय की स्थिति) के अनुसार इनके चार भेद हैं, और स्वर मिलाकर यह वर्गीकरण (पृ. ६२, अंक ३३) पूरा होता है:<\/p>\n<table><tr><th>भेद<\/th><th>वर्ण<\/th><th>उच्चारण में क्या होता है<\/th><\/tr>\n<tr><td>विवृत<\/td><td>सब स्वर<\/td><td>वागिंद्रिय खुली रहती है<\/td><\/tr>\n<tr><td>स्पृष्ट (स्पर्श)<\/td><td>क से म तक २५<\/td><td>वागिंद्रिय का द्वार बंद रहता है<\/td><\/tr>\n<tr><td>ईषत्-विवृत (अंतस्थ)<\/td><td>य र ल व<\/td><td>कुछ खुली रहती है<\/td><\/tr>\n<tr><td>ईषत्-स्पृष्ट (ऊष्म)<\/td><td>श ष स ह<\/td><td>कुछ बंद रहती है, घर्षण होता है<\/td><\/tr><\/table>\n\n<h3>१. स्पर्श व्यंजन (२५)<\/h3>\n<p>'क' से 'म' तक के २५ व्यंजन, जिनके उच्चारण में जीभ मुख के किसी स्थान को छूती है, स्पर्श हैं। इनके पाँच <b>वर्ग<\/b> हैं और हर वर्ग का नाम उसके पहले वर्ण से रखा गया है (पृ. ६६, अंक ४३):<\/p>\n<table><tr><th>वर्ग<\/th><th>वर्ण<\/th><th>स्थान<\/th><\/tr>\n<tr><td>क-वर्ग<\/td><td>क ख ग घ ङ<\/td><td>कंठ<\/td><\/tr>\n<tr><td>च-वर्ग<\/td><td>च छ ज झ ञ<\/td><td>तालु<\/td><\/tr>\n<tr><td>ट-वर्ग<\/td><td>ट ठ ड ढ ण<\/td><td>मूर्धा<\/td><\/tr>\n<tr><td>त-वर्ग<\/td><td>त थ द ध न<\/td><td>दंत<\/td><\/tr>\n<tr><td>प-वर्ग<\/td><td>प फ ब भ म<\/td><td>ओष्ठ<\/td><\/tr><\/table>\n<p>हर वर्ग का पाँचवाँ वर्ण (ङ ञ ण न म) नासिक्य है, यानी साँस मुख और नाक दोनों से निकलती है। इन्हें <b>पंचमाक्षर<\/b> भी कहते हैं।<\/p>\n\n<h3>२. अंतस्थ व्यंजन (४): य र ल व<\/h3>\n<p>इनका उच्चारण स्वर और व्यंजन के बीच का है, इसीलिए \"अंतस्थ\" (बीच में स्थित) नाम पड़ा (गुरु, पृ. ६२)। इनमें य तालव्य, र मूर्धन्य, ल दंत्य और व दंतोष्ठ्य है। चारों घोष और अल्पप्राण हैं।<\/p>\n\n<h3>३. ऊष्म व्यंजन (४): श ष स ह<\/h3>\n<p>इनके उच्चारण में एक प्रकार का घर्षण (रगड़) होता है, इसलिए इन्हें ऊष्म कहते हैं। श तालव्य, ष मूर्धन्य, स दंत्य और ह कंठ्य है। चारों <b>महाप्राण<\/b> हैं। श, ष, स अघोष हैं और ह घोष है (गुरु की तालिका, पृ. ७२)।<\/p>\n\n<h3>४. संयुक्त व्यंजन<\/h3>\n<p>जब दो या अधिक व्यंजनों के बीच में स्वर नहीं रहता, तब उन्हें संयुक्त (संयोगी) व्यंजन कहते हैं: क्य, स्म, त्र (पृ. ५९, अंक १८)। हिंदी में प्रायः तीन से अधिक व्यंजनों का संयोग नहीं होता: स्तम्भ, मत्स्य, माहात्म्य। जब किसी व्यंजन का संयोग उसी व्यंजन से हो, तब वह <b>द्वित्व<\/b> कहलाता है: अन्न, सत्ता (अंक १९)।<\/p>\n<table><tr><th>संयुक्त<\/th><th>बनावट<\/th><th>टिप्पणी<\/th><\/tr>\n<tr><td>क्ष<\/td><td>क् + ष<\/td><td>केवल संस्कृत शब्दों में: मोक्ष (गुरु, पृ. ५६)<\/td><\/tr>\n<tr><td>त्र<\/td><td>त् + र<\/td><td>पत्र, मित्र<\/td><\/tr>\n<tr><td>ज्ञ<\/td><td>ज् + ञ<\/td><td>केवल संस्कृत शब्दों में: संज्ञा। उच्चारण प्रायः 'ग्य' जैसा (पृ. ७०, अंक ५५)<\/td><\/tr>\n<tr><td>श्र<\/td><td>श् + र<\/td><td>स्कूली पुस्तकों में चौथा संयुक्त व्यंजन; गुरु केवल पहले तीन गिनते हैं<\/td><\/tr><\/table>\n<p>लिखने के नियम (गुरु, पृ. ५९-६०): खड़ी पाई वाले व्यंजनों की पाई संयोग में गिर जाती है (प्+य = प्य, त्+थ = त्थ)। ङ, छ, ट, ठ, ड, ढ, ह, ये सात संयोग के आदि में पूरे लिखे जाते हैं और उनके बाद का व्यंजन नीचे लिखा जाता है: अङ्कुर, उच्छ्वास, टट्टी, हड्डी, प्रह्लाद। र् अगर बाद के व्यंजन से पहले आए तो उसके ऊपर रेफ बनता है (धर्म, सर्व)। र अगर किसी व्यंजन के बाद आए तो खड़ी पाई वालों के नीचे तिरछी रेखा (चक्र, भद्र) और दूसरों के नीचे ^ जैसा चिह्न (राष्ट्र) बनता है।<\/p>\n\n<h3>५. उत्क्षिप्त / द्विस्पृष्ट: ड़ और ढ़<\/h3>\n<p>गुरु (पृ. ६७, अंक ४५): ड और ढ के हिंदी में दो-दो उच्चारण हैं, मूर्धन्य और द्विस्पृष्ट। द्विस्पृष्ट उच्चारण में जीभ का अग्र भाग उलटाकर मूर्धा में लगाया जाता है, और इसके लिए अक्षर के नीचे बिंदी लगती है: ड़, ढ़। <b>मूर्धन्य (ड, ढ) कहाँ:<\/b> शब्द के आदि में (डाक, ढोल), द्वित्व में (अड्डा), ह्रस्व स्वर के बाद अनुनासिक व्यंजन के साथ (मंडप, पिंडी)। <b>द्विस्पृष्ट (ड़, ढ़) कहाँ:<\/b> शब्द के मध्य या अंत में (सड़क, पकड़ना, आड़, गढ़)। स्कूल में इन्हें उत्क्षिप्त कहा जाता है, और ये शब्द के आदि में नहीं आते।<\/p>\n<p>उर्दू के प्रभाव से ज और फ के भी एक-एक और उच्चारण हैं (ज़, फ़), जिनके नीचे बिंदी (नुक्ता) लगती है: ज़रूरत, फ़ुरसत, फ़ीस (पृ. ७०, अंक ५४)। यह आगत ध्वनि मानी जाती है।<\/p>\n\n<h2>उच्चारण स्थान: पूरी तालिका<\/h2>\n<p>गुरु ने स्थान के आधार पर वर्णों को कंठ्य, तालव्य, मूर्धन्य, दंत्य, ओष्ठ्य, अनुनासिक, कंठ-तालव्य, कंठोष्ठ्य और दंत्योष्ठ्य बताया है (पृ. ६१, अंक ३१)। पूरी तालिका:<\/p>\n<table><tr><th>स्थान (नाम)<\/th><th>उच्चारण कहाँ से<\/th><th>वर्ण<\/th><\/tr>\n<tr><td>कंठ्य<\/td><td>कंठ (गला)<\/td><td>अ आ, क ख ग घ ङ, ह, विसर्ग (ः)<\/td><\/tr>\n<tr><td>तालव्य<\/td><td>तालु<\/td><td>इ ई, च छ ज झ ञ, य, श<\/td><\/tr>\n<tr><td>मूर्धन्य<\/td><td>मूर्धा (तालु का ऊपरी भाग)<\/td><td>ऋ, ट ठ ड ढ ण, र, ष<\/td><\/tr>\n<tr><td>दंत्य<\/td><td>ऊपर के दाँत<\/td><td>त थ द ध न, ल, स<\/td><\/tr>\n<tr><td>ओष्ठ्य<\/td><td>दोनों ओठ<\/td><td>उ ऊ, प फ ब भ म<\/td><\/tr>\n<tr><td>कंठ-तालव्य<\/td><td>कंठ और तालु<\/td><td>ए, ऐ<\/td><\/tr>\n<tr><td>कंठोष्ठ्य<\/td><td>कंठ और ओठ<\/td><td>ओ, औ<\/td><\/tr>\n<tr><td>दंतोष्ठ्य<\/td><td>दाँत और ओठ<\/td><td>व (और फ़)<\/td><\/tr>\n<tr><td>अनुनासिक (नासिक्य)<\/td><td>अपना स्थान और नाक<\/td><td>ङ ञ ण न म और अनुस्वार<\/td><\/tr><\/table>\n<div class=\"trap\"><b>वे वर्ण जिन पर भूल होती है (गुरु पृ. ६१):<\/b> ल दंत्य है (2022 Q43 का उत्तर: दंत), मूर्धा नहीं। र मूर्धन्य है। श तालव्य, ष मूर्धन्य, स दंत्य। ह कंठ्य। य तालव्य। ऋ मूर्धन्य। व दंतोष्ठ्य (ओष्ठ्य नहीं)। ए-ऐ कंठ-तालव्य और ओ-औ कंठोष्ठ्य हैं।<br>याद रखने की तरकीब: श-ष-स तीनों अलग स्थान के हैं: तालु, मूर्धा, दाँत। मुँह के भीतर से बाहर का क्रम है कंठ, तालु, मूर्धा, दाँत, ओठ।<\/div>\n<p><b>क्रम याद रखें:<\/b> 'कंठ → तालु → मूर्धा → दंत → ओष्ठ' वही क्रम है जिसमें वर्गों के नाम चलते हैं: क-च-ट-त-प। हर वर्ग का स्वर भी इसी के पास है: कंठ में अ, तालु में इ, मूर्धा में ऋ, ओष्ठ में उ।<\/p>\n\n<h2>अल्पप्राण और महाप्राण<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> \"जिन व्यंजनों में हकार की ध्वनि विशेष रूप से सुनाई देती है, उनको महाप्राण और शेष व्यंजनों को अल्पप्राण कहते हैं\" (गुरु, पृ. ६६, अंक ४४)। प्राण का अर्थ है साँस की मात्रा।<\/div>\n<p>गुरु (पृ. ६७): \"स्पर्श व्यंजनों में प्रत्येक वर्ग का दूसरा और चौथा अक्षर तथा ऊष्म महाप्राण हैं।\" यानी ख, घ, छ, झ, ठ, ढ, थ, ध, फ, भ और श, ष, स, ह महाप्राण हैं। शेष व्यंजन अल्पप्राण हैं। सब स्वर अल्पप्राण हैं।<\/p>\n<p>गुरु की सूचना यह भी बताती है कि क्यों: ख = क्+ह, छ = च्+ह, यानी इनमें पहले व्यंजन के साथ 'ह' की ध्वनि मिली सुनाई देती है, और इसमें प्राणवायु का उपयोग अधिक श्रम से करना पड़ता है।<\/p>\n<table><tr><th>वर्ग<\/th><th>अल्पप्राण<\/th><th>महाप्राण<\/th><\/tr>\n<tr><td>क-वर्ग<\/td><td>क, ग, ङ<\/td><td>ख, घ<\/td><\/tr>\n<tr><td>च-वर्ग<\/td><td>च, ज, ञ<\/td><td>छ, झ<\/td><\/tr>\n<tr><td>ट-वर्ग<\/td><td>ट, ड, ण<\/td><td>ठ, ढ<\/td><\/tr>\n<tr><td>त-वर्ग<\/td><td>त, द, न<\/td><td>थ, ध<\/td><\/tr>\n<tr><td>प-वर्ग<\/td><td>प, ब, म<\/td><td>फ, भ<\/td><\/tr>\n<tr><td>शेष<\/td><td>य र ल व (और सब स्वर)<\/td><td>श ष स ह<\/td><\/tr><\/table>\n<p><b>पहचानने की सरल विधि:<\/b> हर वर्ग में 1-2-3-4-5 गिनिए। 2 और 4 महाप्राण, बाकी (1, 3, 5) अल्पप्राण। ऊष्म (श ष स ह) सब महाप्राण। इसलिए 2021 Q35 में 'ष' को अल्पप्राण बताना ग़लत है।<\/p>\n<p>गुरु (पृ. ७०, अंक ५३): दो महाप्राण व्यंजनों का उच्चारण एक साथ नहीं हो सकता, इसलिए उनके संयोग में पूर्व वर्ण अल्पप्राण ही रहता है। इसीलिए 'छ् + छ' नहीं, बल्कि 'च्छ' (अच्छा) और 'थ्थ' नहीं, बल्कि 'त्थ' (पत्थर) और 'ख्ख' नहीं, बल्कि 'क्ख' (रक्खा) लिखा जाता है।<\/p>\n\n<h2>घोष और अघोष<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिन वर्णों के उच्चारण में केवल श्वास का उपयोग होता है और नाद (गूँज, स्वर-तंत्री का कंपन) नहीं होता, वे <b>अघोष<\/b> हैं। जिनके उच्चारण में नाद का उपयोग होता है, वे <b>घोष<\/b> हैं (गुरु, पृ. ६२, अंक ३४)।<\/div>\n<p>गुरु: अघोष वर्ण हैं क, ख, च, छ, ट, ठ, त, थ, प, फ और श, ष, स। घोष वर्ण हैं शेष व्यंजन और सब स्वर। इस तरह अघोष केवल १३ हैं।<\/p>\n<table><tr><th>वर्ग<\/th><th>अघोष (1, 2)<\/th><th>घोष (3, 4, 5)<\/th><\/tr>\n<tr><td>क-वर्ग<\/td><td>क ख<\/td><td>ग घ ङ<\/td><\/tr>\n<tr><td>च-वर्ग<\/td><td>च छ<\/td><td>ज झ ञ<\/td><\/tr>\n<tr><td>ट-वर्ग<\/td><td>ट ठ<\/td><td>ड ढ ण<\/td><\/tr>\n<tr><td>त-वर्ग<\/td><td>त थ<\/td><td>द ध न<\/td><\/tr>\n<tr><td>प-वर्ग<\/td><td>प फ<\/td><td>ब भ म<\/td><\/tr>\n<tr><td>शेष<\/td><td>श ष स<\/td><td>य र ल व ह, और सब स्वर<\/td><\/tr><\/table>\n<p><b>सूत्र:<\/b> हर वर्ग के पहले दो अघोष, अंतिम तीन घोष। ऊष्म में श-ष-स अघोष और ह घोष। यह सन्धि में भी काम आता है: व्यंजन सन्धि के कई नियम \"बाद में घोष वर्ण हो तो\" से शुरू होते हैं।<\/p>\n<div class=\"ex\"><b>एक नज़र में तीनों गुण (गुरु का वर्गीकरण)<\/b><br>क: कंठ्य, अल्पप्राण, अघोष। ख: कंठ्य, महाप्राण, अघोष। ग: कंठ्य, अल्पप्राण, घोष। घ: कंठ्य, महाप्राण, घोष। य: तालव्य, अल्पप्राण, घोष। ष: मूर्धन्य, महाप्राण, अघोष। ल: दंत्य, अल्पप्राण, घोष। ब: ओष्ठ्य, अल्पप्राण, घोष। ह: कंठ्य, महाप्राण, घोष।<\/div>\n\n<h2>गुरु की वर्णमाला तालिका (पृ. ७२)<\/h2>\n<p>गुरु ने \"देवनागरी वर्णमाला का कोष्ठक\" में स्थान, घोष-अघोष, प्राण और प्रयत्न को एक ही तालिका में रखा है। उसे इस तरह पढ़ें (पंक्ति = स्थान):<\/p>\n<table><tr><th>स्थान<\/th><th>अघोष (स्पर्श अल्प, महा; ऊष्म)<\/th><th>घोष (स्पर्श अल्प, महा, नासिक्य; अंतस्थ; स्वर)<\/th><\/tr>\n<tr><td>कंठ<\/td><td>क, ख<\/td><td>ग, घ, ङ; ह (ऊष्म, महाप्राण); स्वर अ, आ<\/td><\/tr>\n<tr><td>तालु<\/td><td>च, छ, श<\/td><td>ज, झ, ञ; य; स्वर इ, ई; संयुक्त स्वर ए, ऐ (कंठ+तालु)<\/td><\/tr>\n<tr><td>मूर्धा<\/td><td>ट, ठ, ष<\/td><td>ड, ढ, ण; र; ऋ<\/td><\/tr>\n<tr><td>दंत<\/td><td>त, थ, स<\/td><td>द, ध, न; ल<\/td><\/tr>\n<tr><td>ओष्ठ<\/td><td>प, फ<\/td><td>ब, भ, म; व (दंत+ओष्ठ); उ, ऊ; संयुक्त स्वर ओ, औ (कंठ+ओष्ठ)<\/td><\/tr><\/table>\n<p>तालिका के नीचे गुरु की टिप्पणी: ड़, ढ़ = द्विस्पृष्ट; ज़ = दंत-तालव्य; फ़ = दंतोष्ठ्य। 'स्थान + नासिका' वाला स्तंभ बताता है कि ङ, ञ, ण, न, म का उच्चारण अपने स्थान और नाक दोनों से होता है।<\/p>\n<p><b>तालिका से सवाल हल करना:<\/b> वर्ण चुनिए → उसकी पंक्ति देखिए → स्थान मिल गया; स्तंभ देखिए → घोष-अघोष और प्राण मिल गया। उदाहरण 'ध': दंत पंक्ति, घोष स्तंभ, स्पर्श महाप्राण → दंत्य, घोष, महाप्राण।<\/p>\n\n<h2>अनुस्वार, अनुनासिक और विसर्ग<\/h2>\n<h3>अनुस्वार (ं)<\/h3>\n<p>गुरु (पृ. ५६, अंक ६) इसे व्यंजनों में गिनते हैं। इसका चिह्न स्वर के ऊपर एक बिंदी है: अं। इसके उच्चारण में स्वर पहले आता है, फिर नासिक्य ध्वनि: अ+ं (जबकि व्यंजन में स्वर बाद में आता है: क्+अ)। इसकी ध्वनि स्वतंत्र है और केवल नाक से निकलती है (पृ. ६८, अंक ४८)। पंचमाक्षर के स्थान पर विकल्प से अनुस्वार आता है: अङ्ग = अंग, कण्ठ = कंठ, गङ्गा = गंगा। संस्कृत शब्दों के अंत में अनुस्वार का उच्चारण 'म्' जैसा होता है: वरं, स्वयं, एवं (अंक ४९)। गुरु (अंक ४७) के अनुसार अनुस्वार के आगे अंतस्थ या ह हो तो उसका उच्चारण दंत-तालव्य होता है, और श ष स के साथ बहुधा 'न्' जैसा: संवाद, सिंह, अंश, हंस।<\/p>\n<h3>अनुनासिक (ँ, चंद्रबिंदु)<\/h3>\n<p>अनुनासिक स्वर की ध्वनि है। इसके उच्चारण में साँस मुख और नाक दोनों से एक साथ निकलती है, जबकि अनुस्वार में केवल नाक से (पृ. ६८, अंक ४८)। अनुस्वार तीव्र और अनुनासिक धीमी ध्वनि है। गुरु का उदाहरण: रंग/राँग, कंबल/कँबल, हंस/हँसना। चंद्रबिंदु कोई स्वतंत्र वर्ण नहीं, केवल अनुनासिक स्वर का चिह्न है। गुरु बताते हैं कि लिखने में अनुनासिक के बदले अक्सर अनुस्वार लिखा जाता है, खासकर जब शिरोरेखा के ऊपर पहले से मात्रा हो: मैं, में, नहीं, आंख/आँख। जहाँ अर्थ-भ्रम का डर हो, वहाँ दोनों अलग-अलग लिखने चाहिए (हँस और हंस)।<\/p>\n<table><tr><th>पहलू<\/th><th>अनुस्वार (ं)<\/th><th>अनुनासिक (ँ)<\/th><\/tr>\n<tr><td>साँस का मार्ग<\/td><td>केवल नाक<\/td><td>मुख और नाक दोनों<\/td><\/tr>\n<tr><td>स्वरूप<\/td><td>स्वतंत्र ध्वनि (अयोगवाह)<\/td><td>स्वर की विशेषता, स्वतंत्र वर्ण नहीं<\/td><\/tr>\n<tr><td>उदाहरण<\/td><td>रंग, कंबल, हंस (पक्षी)<\/td><td>राँग, कँबल, हँस (हँसना)<\/td><\/tr><\/table>\n<h3>विसर्ग (ः)<\/h3>\n<p>गुरु (पृ. ६९, अंक ५१): विसर्ग कंठ्य वर्ण है। इसके उच्चारण में 'ह' को एक झटका-सा देकर साँस को मुँह से एकदम छोड़ते हैं। यह 'ह' से कुछ धीमा बोला जाता है। इसका उच्चारण भी स्वर के बाद होता है: दुःख, अंतःकरण, छः। यह शब्द के आदि में नहीं आता और हिंदी के थोड़े से शब्दों में ही मिलता है (पृ. ५६)। तत्सम शब्दों में इसका प्रयोग अधिक है।<\/p>\n\n<h2>वर्ण-विचार की कुछ और बातें (गुरु)<\/h2>\n<ul>\n<li><b>वर्ण केवल संस्कृत शब्दों में:<\/b> ऋ, ण, ङ, ञ, क्ष, ज्ञ। ङ और ञ अलग से केवल संस्कृत शब्दों में आते हैं: पराङ्मुख (पृ. ५६)।<\/li>\n<li><b>शब्द के आदि में नहीं आते:<\/b> ङ, ञ (हिंदी में), अनुस्वार और विसर्ग।<\/li>\n<li><b>अंत्य 'अ' का उच्चारण:<\/b> हिंदी में शब्द के अंत का अ प्रायः हल् जैसा बोला जाता है: गुण, रात, धन। अपवाद: संयुक्त अंत्याक्षर (सत्य, धर्म), इ-ई-ऊ के बाद य (प्रिय), एकाक्षरी शब्द (न, व) (पृ. ६४-६५, अंक ४०)।<\/li>\n<li><b>ऐ और औ:<\/b> तत्सम शब्दों में संस्कृत के अनुसार, पर हिंदी में बहुधा 'अय्' और 'अव्' जैसे: है, और, चौथा (पृ. ६६, अंक ४१)।<\/li>\n<li><b>स्वराघात<\/b> (शब्द में अक्षरों पर पड़ने वाला ज़ोर) का अलग अध्याय है (पृ. ७०, अंक ५६)।<\/li>\n<\/ul>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li>प्रश्न पढ़ें: \"असंगत/ग़लत\" माँगा है या \"संगत/सही\"? इस पर ग़लती सबसे ज़्यादा होती है।<\/li>\n<li>सीधे स्थान वाला प्रश्न हो तो वर्ण को वर्ग में रखें: क-वर्ग कंठ, च-वर्ग तालु, ट-वर्ग मूर्धा, त-वर्ग दंत, प-वर्ग ओष्ठ। जो वर्ग में नहीं हैं (य र ल व श ष स ह), उन्हें याद करें: य-तालु, र-मूर्धा, ल-दंत, व-दंतोष्ठ, श-तालु, ष-मूर्धा, स-दंत, ह-कंठ।<\/li>\n<li>हर विकल्प में तीन गुण दिए हों तो पहले <b>स्थान<\/b> जाँचें, फिर <b>प्राण<\/b> (वर्ग में 2 और 4 और ऊष्म महाप्राण), फिर <b>घोष<\/b> (वर्ग में 1 और 2 और श-ष-स अघोष)।<\/li>\n<li>एक ग़लत गुण दिखते ही वह विकल्प असंगत है। बाकी विकल्पों की जाँच ज़रूरी नहीं, पर एक बार देख लें।<\/li>\n<li>स्वर वाले विकल्प में तीन आधार जाँचें: जीभ (अग्र-मध्य-पश्च), मुख-द्वार (संवृत-विवृत), ओठ (वृत्तमुखी-अवृत्तमुखी)।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>जोड़ा<\/th><th>अंतर<\/th><th>याद रखें<\/th><\/tr>\n<tr><td>अनुस्वार / अनुनासिक<\/td><td>अनुस्वार केवल नाक से; अनुनासिक मुख-नाक से<\/td><td>हंस (पक्षी) / हँस (हँसना)<\/td><\/tr>\n<tr><td>ड, ढ / ड़, ढ़<\/td><td>पहला मूर्धन्य, दूसरा द्विस्पृष्ट (उत्क्षिप्त)<\/td><td>डाक, अड्डा / सड़क, गढ़<\/td><\/tr>\n<tr><td>ह्रस्व / दीर्घ<\/td><td>ए, ऐ, ओ, औ भी दीर्घ हैं<\/td><td>एकमात्र ह्रस्व: अ इ उ ऋ<\/td><\/tr>\n<tr><td>अंतस्थ / ऊष्म<\/td><td>अंतस्थ: य र ल व (घोष, अल्पप्राण); ऊष्म: श ष स ह (महाप्राण)<\/td><td>ल दंत्य, स दंत्य, दोनों दंत<\/td><\/tr>\n<tr><td>श / ष / स<\/td><td>तालु / मूर्धा / दंत<\/td><td>स्थान-क्रम: तालु, मूर्धा, दंत<\/td><\/tr>\n<tr><td>ए-ऐ / ओ-औ<\/td><td>कंठ-तालव्य / कंठोष्ठ्य<\/td><td>ओ-औ में ओष्ठ जुड़ता है<\/td><\/tr>\n<tr><td>व / ब<\/td><td>व दंतोष्ठ्य, अंतस्थ; ब ओष्ठ्य, स्पर्श<\/td><td>'व' में ऊपर के दाँत निचले ओठ को छूते हैं<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n<h3>HTET 2021 Q35<\/h3>\n<p>प्रश्न: निम्नलिखित वर्णों के संदर्भ में कौन-सा विकल्प <b>असंगत<\/b> है? (A) य: तालव्य, अल्पप्राण, घोष (B) इ: तालव्य, ह्रस्व, अवृत्तमुखी (C) ब: ओष्ठ्य, घोष, अल्पप्राण (D) ष: मूर्धन्य, अल्पप्राण, अघोष<\/p>\n<div class=\"ex\"><b>उत्तर: (D)<\/b><ol class=\"steps\">\n<li>(A) य तालव्य है (गुरु पृ. ६१), अंतस्थ होने से अल्पप्राण और घोष। सही।<\/li>\n<li>(B) इ तालव्य है, ह्रस्व है (मूल स्वर), और अग्र स्वर होने से अवृत्तमुखी (ओठ गोल नहीं होते)। सही।<\/li>\n<li>(C) ब प-वर्ग का तीसरा वर्ण है: ओष्ठ्य, घोष, अल्पप्राण। सही।<\/li>\n<li>(D) ष मूर्धन्य और अघोष है, पर <b>महाप्राण<\/b> है, क्योंकि ऊष्म वर्ण महाप्राण होते हैं (पृ. ६७)। 'अल्पप्राण' ग़लत है, इसलिए यही असंगत है।<\/li><\/ol><\/div>\n<h3>HTET 2022 Q43<\/h3>\n<p>प्रश्न: उच्चारण की दृष्टि से 'ल' वर्ण का उच्चारण स्थान होगा: (A) ओष्ठ (B) मूर्धा (C) तालु (D) दन्त<\/p>\n<div class=\"ex\"><b>उत्तर: (D) दन्त<\/b><br>गुरु (पृ. ६१): \"दंत्य: त, थ, द, ध, न, ल और स।\" 'ल' का उच्चारण जीभ को ऊपर के दाँतों पर लगाने से होता है। मूर्धा का भ्रम इसलिए होता है कि ट-वर्ग और 'र' में जीभ पीछे मुड़ती है, पर ल में नहीं।<\/div>\n<h3>HTET 2024 Q44<\/h3>\n<p>प्रश्न: वर्णों की ध्वनिगत विशेषताओं के संदर्भ में <b>असंगत<\/b> चुनिए: (A) उ: पश्च, संवृत, वृत्तमुखी (B) ऋ: अग्र, संवृत, वृत्तमुखी (C) अ: मध्य, ह्रस्व, उदासीन (D) आ: पश्च, विवृत, अवृत्तमुखी<\/p>\n<div class=\"ex\"><b>उत्तर: (B)<\/b><ol class=\"steps\">\n<li>(A) उ: पश्च स्वर, संवृत, ओठ गोल (वृत्तमुखी)। सही।<\/li>\n<li>(B) ऋ: हिंदी में इसका उच्चारण 'रि' जैसा है, इसलिए इसे इ की तरह अग्र और संवृत माना जाता है, पर इसमें ओठ गोल नहीं होते, यानी वह <b>अवृत्तमुखी<\/b> है। 'वृत्तमुखी' कहना ग़लत है।<\/li>\n<li>(C) अ: मध्य स्वर, ह्रस्व, उदासीन। सही।<\/li>\n<li>(D) आ: पश्च, विवृत (मुख पूरा खुला), अवृत्तमुखी। सही।<\/li><\/ol>\n<b>नोट:<\/b> यह वर्गीकरण स्कूली पाठ्यपुस्तकों का है, गुरु में नहीं। गुरु में ऋ का स्थान मूर्धा बताया गया है। पर प्रश्न में गुण 'वृत्तमुखी' बताना सबसे स्पष्ट ग़लती है, क्योंकि केवल उ ऊ ओ औ में ओठ गोल होते हैं।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>वर्ण = भाषा की सबसे छोटी ध्वनि। गुरु के अनुसार हिंदी में ४६ वर्ण: ११ स्वर + ३३ व्यंजन + अनुस्वार, विसर्ग (स्कूल में अनुस्वार-विसर्ग अयोगवाह, संयुक्त क्ष त्र ज्ञ श्र)।<\/li>\n<li>स्वर: मूल अ इ उ ऋ; ह्रस्व अ इ उ ऋ, दीर्घ आ ई ऊ ए ऐ ओ औ; प्लुत में तीन मात्राएँ (हिंदी में प्रचलित नहीं)।<\/li>\n<li>व्यंजन: स्पर्श २५ (क से म), अंतस्थ ४ (य र ल व), ऊष्म ४ (श ष स ह)। संयुक्त = क्ष, त्र, ज्ञ (और श्र)।<\/li>\n<li>स्थान: कंठ अ आ क-वर्ग ह विसर्ग; तालु इ ई च-वर्ग य श; मूर्धा ऋ ट-वर्ग र ष; दंत त-वर्ग ल स; ओष्ठ उ ऊ प-वर्ग; ए ऐ कंठ-तालु; ओ औ कंठ-ओष्ठ; व दंतोष्ठ।<\/li>\n<li>महाप्राण: हर वर्ग का दूसरा-चौथा और श ष स ह; शेष और सब स्वर अल्पप्राण।<\/li>\n<li>अघोष: हर वर्ग के पहले दो और श ष स; शेष व्यंजन और सब स्वर घोष।<\/li>\n<li>अनुस्वार केवल नाक से; अनुनासिक (चंद्रबिंदु) मुख और नाक से; विसर्ग 'ह' जैसा झटके से, कंठ्य।<\/li>\n<li>ड़, ढ़ द्विस्पृष्ट/उत्क्षिप्त हैं और शब्द के बीच या अंत में आते हैं, आदि में नहीं।<\/li>\n<li>असंगत प्रश्न में तीनों गुण (स्थान, प्राण, घोष) एक-एक करके जाँचें; ष, ह, ल पर सबसे ज़्यादा फँसाते हैं।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: 'श' का उच्चारण स्थान है: (A) कंठ (B) तालु (C) मूर्धा (D) दंत<\/summary><p><b>उत्तर: (B)<\/b> श तालव्य है; ष मूर्धन्य और स दंत्य हैं (गुरु पृ. ६१)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: महाप्राण वर्णों का समूह है: (A) क ग च (B) ख घ छ (C) प ब म (D) य र ल<\/summary><p><b>उत्तर: (B)<\/b> वर्ग का दूसरा और चौथा वर्ण महाप्राण है: ख, घ, छ। बाकी समूहों में अल्पप्राण हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: केवल अघोष वर्णों वाला समूह है: (A) ग घ ज (B) क च ट (C) द ध न (D) ब भ म<\/summary><p><b>उत्तर: (B)<\/b> क, च, ट अपने-अपने वर्ग के पहले वर्ण हैं और अघोष हैं। बाकी समूहों में तीसरे, चौथे, पाँचवें वर्ण (घोष) हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: असंगत चुनिए: (A) ग: कंठ्य, अल्पप्राण, घोष (B) झ: तालव्य, महाप्राण, घोष (C) थ: दंत्य, महाप्राण, घोष (D) म: ओष्ठ्य, अल्पप्राण, घोष<\/summary><p><b>उत्तर: (C)<\/b> थ त-वर्ग का दूसरा वर्ण है, इसलिए महाप्राण तो है पर <b>अघोष<\/b> है, घोष नहीं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: जो वर्ण ह्रस्व स्वर नहीं है: (A) अ (B) इ (C) ऋ (D) ए<\/summary><p><b>उत्तर: (D)<\/b> ए दीर्घ (संयुक्त स्वर) है। ह्रस्व स्वर अ, इ, उ, ऋ हैं (गुरु पृ. ६३)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'ओ' और 'औ' का उच्चारण स्थान है: (A) कंठ-तालु (B) कंठ-ओष्ठ (C) दंतोष्ठ (D) ओष्ठ<\/summary><p><b>उत्तर: (B)<\/b> ओ, औ कंठोष्ठ्य हैं; ए, ऐ कंठ-तालव्य (पृ. ६१)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'व' का उच्चारण स्थान है: (A) ओष्ठ (B) दंत (C) दंतोष्ठ (D) तालु<\/summary><p><b>उत्तर: (C)<\/b> व दंत्योष्ठ्य है (दाँत और ओठ)। ब ओष्ठ्य है, यही भ्रम पैदा करता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: 'ज्ञ' किन वर्णों से बना है? (A) ज्+ञ (B) द्+य (C) ग्+य (D) ज्+न<\/summary><p><b>उत्तर: (A)<\/b> गुरु (पृ. ५९, अंक २१): ज् और ञ के मेल से ज्ञ बनता है। उच्चारण भले ही 'ग्य' जैसा सुनाई दे।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अनुस्वार और अनुनासिक का सही अंतर: (A) दोनों एक ही हैं (B) अनुस्वार केवल नाक से, अनुनासिक मुख और नाक से (C) अनुनासिक केवल नाक से (D) अनुस्वार केवल कंठ से<\/summary><p><b>उत्तर: (B)<\/b> गुरु पृ. ६८, अंक ४८।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अंतस्थ वर्ण हैं: (A) श ष स ह (B) य र ल व (C) क ख ग घ (D) त थ द ध<\/summary><p><b>उत्तर: (B)<\/b> इनका उच्चारण स्वर और व्यंजन के बीच का है (पृ. ६२)। (A) ऊष्म हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: ड़ और ढ़ किस प्रकार के व्यंजन हैं और कहाँ नहीं आते? (A) द्विस्पृष्ट; शब्द के आदि में (B) स्पर्श; अंत में (C) ऊष्म; मध्य में (D) अंतस्थ; आदि में<\/summary><p><b>उत्तर: (A)<\/b> ये द्विस्पृष्ट (उत्क्षिप्त) हैं और शब्द के मध्य या अंत में आते हैं: सड़क, गढ़। आदि में ड, ढ आते हैं।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामता प्रसाद गुरु, हिंदी व्याकरण: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५५\">पृ. ५५-५६<\/a> (वर्णमाला, स्वर, व्यंजन, अनुस्वार-विसर्ग), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५७\">५७-६०<\/a> (लिपि, मात्रा, बारहखड़ी, संयुक्त व्यंजन), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६१\">६१-६५<\/a> (स्थान, प्रयत्न, स्वर-भेद, अनुनासिक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६६\">६६-७०<\/a> (व्यंजन-भेद, ड़-ढ़, अनुस्वार, विसर्ग), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७२\">७२<\/a> (वर्णमाला का कोष्ठक)। स्वरों का अग्र/मध्य/पश्च, संवृत/विवृत, वृत्तमुखी वर्गीकरण और 'अयोगवाह'/'श्र' की गिनती स्कूली पाठ्यपुस्तकों की परंपरा है, गुरु की नहीं।<\/p>\n","hin-spe":"<p class=\"key\"><b>HTET में क्या पूछा गया:<\/b> 2020, 2023 और 2024 में हर बार 1 प्रश्न, यानी कुल 3, और तीनों में \"शुद्ध या अशुद्ध शब्द/शब्द-समूह पहचानना\" था। 2020 Q32 (अशुद्ध चुनना: मृत्योपरान्त), 2023 Q39 (सभी शब्द शुद्ध वाला विकल्प) और 2024 Q42 (अशुद्ध शब्द-समूह: सीधा साधा)। तीनों में ग़लती किसी साफ़ नियम की थी (सन्धि, ह्रस्व-दीर्घ, हाइफ़न), यानी नियम समझकर हल हो सकते थे, रटकर नहीं।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> किसी शब्द को लिखने का वह तरीक़ा जो मान लिया गया हो और सबके लिए एक जैसा हो, <b>वर्तनी<\/b> (स्पेलिंग) कहलाता है। हर शब्द के लिए एक मानक रूप तय करने की प्रक्रिया <b>मानकीकरण<\/b> है। हिंदी के लिए यह काम भारत सरकार के केंद्रीय हिंदी निदेशालय (CHD) ने \"देवनागरी लिपि तथा हिंदी वर्तनी का मानकीकरण\" पुस्तिका में किया है। सरकारी काम, NCERT की पाठ्यपुस्तकें और परीक्षाएँ इसी को आधार मानती हैं।<\/div>\n<p>गुरु ने भी वर्तनी की सामान्य भूलों की ओर ध्यान दिलाया है। जैसे वे लिखते हैं (पृ. ६०, अंक २८) कि \"हकार से मिलनेवाले व्यंजन, कभी-कभी, भूल से उसके पूर्व लिख दिए जाते हैं\", और उदाहरण देते हैं: चिन्ह (चिह्न), ब्रम्ह (ब्रह्म), आव्हान (आह्वान), आल्हाद (आह्लाद)। यानी सौ साल पहले भी यही भूलें होती थीं।<\/p>\n<p><b>क्यों ज़रूरी है:<\/b> अगर 'वाङ्मय' को कोई 'वाँमय' लिखे, कोई 'वांग्मय', तो एक ही शब्द की चार तस्वीरें बन जाएँगी। मानक वर्तनी का एक ही लक्ष्य है: एक शब्द, एक रूप। परीक्षा में यही प्रश्न बनता है: चारों में से एक रूप चुनो।<\/p>\n<p><b>एक रोज़मर्रा की तुलना:<\/b> वर्तनी वैसी है जैसे सड़क पर यातायात के नियम। गाड़ी बाएँ चलानी है या दाएँ, यह कारण से कम और सहमति से ज़्यादा तय है। फिर भी नियम हों तो ही सब एक-दूसरे को समझते हैं। लेकिन कई नियम, जैसे सन्धि के कारण 'अत्यधिक', तर्क से भी निकलते हैं। इसीलिए आगे हर नियम के साथ वजह भी दी गई है।<\/p>\n\n<h2>मूल अवधारणा: शुद्ध शब्द कैसे तय होता है<\/h2>\n<p>हिंदी के शब्द चार तरह के होते हैं, और वर्तनी का नियम इन चारों पर अलग-अलग लगता है।<\/p>\n<div class=\"cards\">\n<div><h3>तत्सम<\/h3><p>संस्कृत से ज्यों के त्यों आए: ब्रह्मा, चिह्न, गृहीत, द्रष्टव्य। इनकी वर्तनी संस्कृत जैसी ही रहती है।<\/p><\/div>\n<div><h3>तद्भव<\/h3><p>संस्कृत से बदलकर आए: दूध, आग, सात। इनमें बोलचाल के हिसाब से छूट है: दुख/दुःख।<\/p><\/div>\n<div><h3>देशज<\/h3><p>लोक से आए: ठेठ, झंडा, डिबिया। इनके रूप बोलचाल से तय हैं।<\/p><\/div>\n<div><h3>विदेशी<\/h3><p>अंग्रेज़ी, अरबी, फ़ारसी, तुर्की से आए: डॉक्टर, कॉलेज, ज़रूर, दाग़। इनमें ऑ और नुक्ते के नियम लगते हैं।<\/p><\/div>\n<\/div>\n<p>इसलिए शब्द देखते ही पहले पूछें: यह किस श्रेणी का है? <b>तत्सम हो तो उसे संस्कृत नियमों (सन्धि, ऋ, ह्रस्व-दीर्घ) से जाँचें। तद्भव हो तो बोलचाल का रूप देखें। विदेशी हो तो ऑ और नुक्ता जाँचें।<\/b><\/p>\n\n<h2>CHD के मानक नियम, विस्तार से<\/h2>\n\n<h3>१. वर्णों के संयोग और हल् (्) चिह्न<\/h3>\n<p><b>नियम:<\/b> जिन व्यंजनों में खड़ी पाई नहीं होती (ङ, छ, ट, ठ, ड, ढ, द, ह), उनके संयुक्त रूप में हल् चिह्न लगाकर बाद का व्यंजन जोड़ा जाता है। गुरु (पृ. ५९, अंक २३) भी यही बताते हैं कि ङ, छ, ट, ठ, ड, ढ, ह संयोग के आदि में पूरे लिखे जाते हैं।<\/p>\n<table><tr><th>शब्द<\/th><th>बनावट<\/th><th>नियम<\/th><\/tr>\n<tr><td>वाङ्मय<\/td><td>वाङ् + मय<\/td><td>ङ में हल्<\/td><\/tr>\n<tr><td>लट्टू, बुड्ढा<\/td><td>ट्+ट, ड्+ढ<\/td><td>ट, ड में हल्<\/td><\/tr>\n<tr><td>विद्या, उद्देश्य<\/td><td>द्+य, द्+द<\/td><td>द में हल्<\/td><\/tr>\n<tr><td>चिह्न, ब्रह्मा<\/td><td>ह्+न, ह्+म<\/td><td>ह में हल्; न/म बाद में<\/td><\/tr><\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> ह के संयुक्त रूप में 'ह' हमेशा <b>पहले<\/b> आता है और दूसरा व्यंजन बाद में: चिह्न (चिन्ह नहीं), ब्रह्म (ब्रम्ह नहीं), आह्वान (आव्हान नहीं), आह्लाद (आल्हाद नहीं), उन्हें, तुम्हें (गुरु पृ. ६०)। उच्चारण में बोला 'चिन्ह' जैसा जाता है, पर लिखा जाता है 'चिह्न'। यही सबसे बड़ी भूल है।<\/div>\n\n<h3>२. अनुस्वार और पंचमाक्षर<\/h3>\n<p><b>नियम:<\/b> पंचमाक्षर (ङ ञ ण न म) के बाद अगर उसी वर्ग का व्यंजन आए, तो पंचमाक्षर की जगह अनुस्वार (ं) लिखा जाता है। अगर बाद में दूसरे वर्ग का वर्ण हो, या वही पंचमाक्षर दोबारा आए, तो पंचमाक्षर आधा बना रहता है। गुरु (पृ. ६०, अंक २७) भी इसे बताते हैं: ङ्, ञ्, ण्, न्, म् अपने ही वर्ग के व्यंजनों से मिल सकते हैं, पर उनके बदले विकल्प से अनुस्वार आ सकता है, जैसे गङ्गा = गंगा, चञ्चल = चंचल, पण्डित = पंडित, दन्त = दंत, कम्प = कंप। और यह भी कि कई शब्दों में इस नियम का भंग होता है: वाङ्मय, मृण्मय, धन्वन्तरि, सम्राट्, उन्हें, तुम्हें।<\/p>\n<table><tr><th>स्थिति<\/th><th>लिखें<\/th><th>कारण<\/th><\/tr>\n<tr><td>बाद में उसी वर्ग का व्यंजन<\/td><td>गंगा, चंचल, ठंडा, पंडित, दंत, कंप, संध्या, संपादक<\/td><td>ङ/ञ/ण/न/म → ं<\/td><\/tr>\n<tr><td>बाद में दूसरे वर्ग का व्यंजन<\/td><td>वाङ्मय, अन्य, चिन्मय, उन्मुख<\/td><td>पंचमाक्षर बना रहता है<\/td><\/tr>\n<tr><td>पंचमाक्षर के बाद वही पंचमाक्षर<\/td><td>अन्न, सम्मेलन, सम्मति, उन्नति, जन्म<\/td><td>द्वित्व में अनुस्वार नहीं<\/td><\/tr><\/table>\n<div class=\"trap\"><b>जाँचने की तरकीब:<\/b> पंचमाक्षर के ठीक बाद के वर्ण को देखें और पूछें, \"क्या यह उसी वर्ग का है?\" 'ठंडा': ण्+ड (दोनों ट-वर्ग) → अनुस्वार, इसलिए ठंडा। 'अन्य': न्+य (य किसी वर्ग में नहीं) → पंचमाक्षर, इसलिए अन्य (अंय नहीं)। 'वाङ्मय': ङ्+म (म प-वर्ग, ङ क-वर्ग) → पंचमाक्षर बना रहेगा (वांमय या वाँमय नहीं)।<\/div>\n\n<h3>३. चंद्रबिंदु (ँ) और बिंदु (ं)<\/h3>\n<p><b>नियम:<\/b> अर्थ-भेद करने के लिए चंद्रबिंदु अनिवार्य है: हँस (हँसना) और हंस (पक्षी), अँगना (आँगन) और अंगना (स्त्री)। जहाँ शिरोरेखा के ऊपर पहले से मात्रा लगी हो (इ, ई, ए, ऐ, ओ, औ की मात्रा), वहाँ चंद्रबिंदु की जगह बिंदु लिखने की छूट है: नहीं, में, मैं, कहीं, गोंद, सौंप। गुरु (पृ. ६९, अंक ५०(क)) भी यही बताते हैं कि बहुधा अनुनासिक अ, आ, उ, ऊ में ही चंद्रबिंदु लगता है (अँधेरा, हँसना, आँख, ऊँट), क्योंकि इन पर ऊपर कोई मात्रा नहीं होती।<\/p>\n<p>पहचान: अगर अनुस्वार (ं) के साथ 'ँ' का अर्थ-भेद संभव हो तो चंद्रबिंदु लगाइए; वरना सुविधा के लिए बिंदु चलेगा। परीक्षा में जब 'हँस' और 'हंस' दोनों विकल्प हों, तो सही अर्थ के हिसाब से चुनें।<\/p>\n\n<h3>४. नुक्ता<\/h3>\n<p><b>नियम:<\/b> हिंदी में जो अरबी-फ़ारसी शब्द रच-बस गए हैं, उन्हें नुक्ते के बिना लिखा जाता है: कलम, किला, दाग। जहाँ शुद्ध विदेशी उच्चारण दिखाना हो, या शब्दों में अर्थ-भेद करना हो, वहाँ नुक्ता लगता है: ख़ाना, राज़ (रहस्य) और राज (शासन), फ़न (कला) और फन (साँप का), ज़ात, फ़ीस, ज़रूरत। गुरु (पृ. ७०, अंक ५४) बताते हैं कि उर्दू के प्रभाव से ज और फ का एक-एक और उच्चारण होता है (दंत-तालव्य ज़ और दंतोष्ठ्य फ़), जिनके नीचे बिंदी लगाई जाती है। अर्थ-भेद वाले जोड़े याद रखें।<\/p>\n<p>हिंदी में चलने वाले नुक्ते वाले वर्ण क़, ख़, ग़, ज़, फ़ हैं। ड़ और ढ़ में नुक्ता अलग बात है, वे हिंदी की अपनी ध्वनियाँ हैं।<\/p>\n\n<h3>५. आगत ध्वनि 'ऑ'<\/h3>\n<p>अंग्रेज़ी के ध्वनि 'ऑ' (जो 'ऑ' और 'ओ' के बीच है) के लिए अर्द्ध-चंद्र (ॉ) का चिह्न मान्य है: डॉक्टर, कॉलेज, ऑफ़िस, बॉल, हॉल। यह चिह्न केवल अंग्रेज़ी मूल के शब्दों में लगता है। हिंदी शब्द में 'ऑ' नहीं आता। गुरु (पृ. ५६-५७, अंक ४२) ने भी बताया है कि उर्दू और अंग्रेज़ी की ध्वनियाँ दिखाने के लिए बिंदी और अर्द्ध-चंद्र लगाए जाते हैं, जैसे लॉर्ड।<\/p>\n\n<h3>६. विभक्ति-चिह्न: अलग या मिलाकर<\/h3>\n<table><tr><th>किसके साथ<\/th><th>नियम<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>संज्ञा<\/td><td>अलग<\/td><td>राम ने, स्त्री को, मेज़ पर, घर में<\/td><\/tr>\n<tr><td>सर्वनाम<\/td><td>मिलाकर<\/td><td>उसने, उससे, उसपर, मुझको, तुमसे<\/td><\/tr>\n<tr><td>सर्वनाम + दो विभक्तियाँ<\/td><td>पहली मिली, दूसरी अलग<\/td><td>उसके लिए, इसमें से, तुम्हारे लिए<\/td><\/tr><\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> \"उस ने कहा\" या \"रामने कहा\" दोनों अशुद्ध हैं। सर्वनाम के साथ विभक्ति मिलेगी, संज्ञा के साथ अलग।<\/div>\n\n<h3>७. अव्यय, क्रिया-रूप और संयुक्त क्रियाएँ<\/h3>\n<ul>\n<li><b>अव्यय अलग:<\/b> आपके साथ, यहाँ तक, मेरे लिए, राम की तरह, श्री, जी (श्रीमान, महात्मा जी)। समास में मिलकर: प्रतिदिन, यथासमय, मानवमात्र, आजन्म।<\/li>\n<li><b>संयुक्त क्रियाओं के सभी अंग अलग:<\/b> पढ़ा करता है, जा सकता है, चल रहा है, कर दिया, उठ बैठा। इन्हें एक में नहीं मिलाते।<\/li>\n<li><b>'सा', 'जैसा' आदि के साथ हाइफ़न:<\/b> तुम-सा, आप-जैसा, चाकू-से तीखे, कभी-कभी, धीरे-धीरे।<\/li>\n<\/ul>\n\n<h3>८. हाइफ़न (योजक चिह्न -)<\/h3>\n<ul>\n<li><b>द्वंद्व समास में हाइफ़न अनिवार्य:<\/b> राम-लक्ष्मण, खाना-पीना, देख-रेख, सीधा-सादा, माता-पिता, भला-बुरा। इसी कारण 2024 के प्रश्न का 'सीधा साधा' अशुद्ध है।<\/li>\n<li><b>पुनरुक्त शब्दों में:<\/b> धीरे-धीरे, बार-बार, घर-घर, कभी-कभी, अलग-अलग।<\/li>\n<li><b>तत्पुरुष में सामान्यतः नहीं:<\/b> रामराज्य, गंगाजल, राजकुमार। भ्रम की स्थिति हो तो हाइफ़न: भू-तत्त्व (भूतत्त्व अलग शब्द है)।<\/li>\n<li><b>सा, जैसा, तुल्य जैसे शब्दों से पहले:<\/b> फूल-सा, चाँद-जैसा।<\/li>\n<\/ul>\n\n<h3>९. 'य' और 'व' (श्रुतिमूलक)<\/h3>\n<p>जब दो स्वर साथ-साथ आएँ तो बोलने में बीच में 'य' या 'व' की हल्की ध्वनि आ जाती है (श्रुतिमूलक)। CHD का नियम: जहाँ स्वर अंत में है और बोलचाल में स्वर ही सुनाई देता है, वहाँ स्वरात्मक रूप लिखें: किए, गए, नई, हुआ, आए, लिए, गई। और जहाँ 'य' मूल शब्द का अंग है, वहाँ 'य' रहेगा: स्थायी (स्थाई नहीं), अव्ययीभाव, दायित्व (दाइत्व नहीं), आवश्यक, पर 'नयी/नई' दोनों में 'नई' ही प्राथमिक है।<\/p>\n\n<h3>१०. तत्सम शब्द और विसर्ग<\/h3>\n<ul>\n<li><b>तत्सम जैसे के तैसे:<\/b> ब्रह्मा (ब्रम्हा नहीं), चिह्न, उऋण (उरिण नहीं), गृहीत (ग्रहीत नहीं), द्रष्टव्य (दृष्टव्य नहीं), प्रदर्शनी (प्रदर्शिनी नहीं), अत्यधिक (अत्याधिक नहीं), अनधिकार।<\/li>\n<li><b>विसर्ग:<\/b> तत्सम में अवश्य: दुःखानुभूति, अंतःकरण, प्रातःकाल, निःसंदेह। तद्भव में छूट: दुख।<\/li>\n<\/ul>\n\n<h3>११. दोनों रूप मान्य<\/h3>\n<p>कुछ शब्दों के दोनों रूप मानक हैं, इन पर परीक्षा में प्रश्न बनाना ठीक नहीं माना जाता: गरमी/गर्मी, कुरसी/कुर्सी, दुकान/दूकान, बरतन/बर्तन, सन्तोष/संतोष, पण्डित/पंडित (पंचमाक्षर/अनुस्वार)।<\/p>\n\n<h2>सामान्य अशुद्धियाँ: कारण के अनुसार<\/h2>\n<p>अशुद्धियाँ याद करने से बेहतर है कि उनका कारण याद रखा जाए। कारण समझ में आ जाए तो नई अशुद्धि भी पकड़ में आती है।<\/p>\n\n<h3>कारण १: सन्धि का नियम न जानना<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>मृत्योपरान्त<\/td><td>मृत्युपरांत<\/td><td>मृत्यु+उपरांत: 'ओ' गुण सन्धि में अ/आ के बाद बनता है, उ के बाद नहीं; मानक रूप मृत्युपरांत है<\/td><\/tr>\n<tr><td>अत्याधिक<\/td><td>अत्यधिक<\/td><td>अति+अधिक = अत्यधिक (इ→य्, अ बना रहा)<\/td><\/tr>\n<tr><td>दुरूपयोग<\/td><td>दुरुपयोग<\/td><td>दुः+उपयोग = दुरुपयोग (र् + उ = रु)<\/td><\/tr>\n<tr><td>निर्पराध<\/td><td>निरपराध<\/td><td>निः+अपराध = निरपराध<\/td><\/tr>\n<tr><td>उज्वल<\/td><td>उज्ज्वल<\/td><td>उत्+ज्वल = उज्ज्वल (त्+ज = ज्ज)<\/td><\/tr>\n<\/table>\n<p>इस समूह में 2020 का प्रश्न आता है। 'मृत्योपरान्त' में 'ओ' इसलिए नहीं बन सकता कि गुण सन्धि का 'ओ' अ/आ + उ/ऊ से बनता है (चंद्र+उदय = चंद्रोदय), जबकि यहाँ पहला पद मृत्यु है, जिसके अंत में उ है। इसलिए मानक रूप मृत्युपरांत है।<\/p>\n\n<h3>कारण २: ह्रस्व-दीर्घ (ि और ी, ु और ू) की भूल<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>कवियत्री<\/td><td>कवयित्री<\/td><td>कवि का स्त्रीलिंग मानक रूप<\/td><\/tr>\n<tr><td>श्रीमति<\/td><td>श्रीमती<\/td><td>स्त्रीलिंग रूप दीर्घ ई से<\/td><\/tr>\n<tr><td>वैदेहि<\/td><td>वैदेही<\/td><td>विदेह की पुत्री सीता: 'ई' स्त्रीलिंग<\/td><\/tr>\n<tr><td>मैथली<\/td><td>मैथिली<\/td><td>मिथिला से बना: 'इ' ह्रस्व<\/td><\/tr>\n<tr><td>परिक्षा<\/td><td>परीक्षा<\/td><td>परि+ईक्षा = परीक्षा (दीर्घ सन्धि)<\/td><\/tr>\n<tr><td>पत्नि, गृहणी<\/td><td>पत्नी, गृहिणी<\/td><td>स्त्रीलिंग शब्द; गृहिणी में 'ह' के बाद ि<\/td><\/tr>\n<tr><td>रचियता<\/td><td>रचयिता<\/td><td>मानक रूप रचयिता<\/td><\/tr><\/table>\n<p>ध्यान दें: HTET 2023 के विकल्पों में 'मैथली' और 'वैदेहि' दोनों इसी कारण अशुद्ध थे।<\/p>\n\n<h3>कारण ३: श, ष, स का भ्रम<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>प्रसंशा<\/td><td>प्रशंसा<\/td><td>तत्सम शब्द; श पहले, स बाद में<\/td><\/tr>\n<tr><td>अभिलाशा<\/td><td>अभिलाषा<\/td><td>तत्सम: ष<\/td><\/tr>\n<tr><td>निशेध<\/td><td>निषेध<\/td><td>नि+सेध = निषेध (इ के बाद स → ष, गुरु पृ. ७८)<\/td><\/tr>\n<tr><td>दुशासन<\/td><td>दुःशासन / दुश्शासन<\/td><td>दुः+शासन, गुरु पृ. ७९ के अनुसार दोनों रूप<\/td><\/tr><\/table>\n\n<h3>कारण ४: संयुक्त वर्ण और ऋ-मात्रा की भूल<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>ब्रम्हा, चिन्ह<\/td><td>ब्रह्मा, चिह्न<\/td><td>ह पहले, दूसरा व्यंजन बाद में (हल्)<\/td><\/tr>\n<tr><td>आव्हान, आल्हाद<\/td><td>आह्वान, आह्लाद<\/td><td>वही कारण (गुरु पृ. ६०)<\/td><\/tr>\n<tr><td>ग्रहीत<\/td><td>गृहीत<\/td><td>तत्सम; ग+ऋ (गृ)<\/td><\/tr>\n<tr><td>दृष्टव्य<\/td><td>द्रष्टव्य<\/td><td>दृश् धातु से द्रष्टव्य<\/td><\/tr>\n<tr><td>प्रथ्वी<\/td><td>पृथ्वी<\/td><td>प+ऋ (पृ), र नहीं<\/td><\/tr><\/table>\n\n<h3>कारण ५: अनावश्यक या ग़लत स्वर<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>त्यौहार<\/td><td>त्योहार<\/td><td>मानक रूप 'त्योहार' (ौ वाला रूप अशुद्ध)<\/td><\/tr>\n<tr><td>स्थाई, दाइत्व<\/td><td>स्थायी, दायित्व<\/td><td>श्रुतिमूलक नहीं, मूल 'य' है<\/td><\/tr>\n<tr><td>वापिस<\/td><td>वापस<\/td><td>मानक रूप: वापस<\/td><\/tr>\n<tr><td>अभ्यार्थी<\/td><td>अभ्यर्थी<\/td><td>अभि+अर्थी, 'अर्थी' में दीर्घ आ नहीं<\/td><\/tr>\n<tr><td>प्रदर्शिनी<\/td><td>प्रदर्शनी<\/td><td>प्रदर्शन से: 'ना'<\/td><\/tr><\/table>\n\n<h3>कारण ६: हाइफ़न और मिलाकर लिखना<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>सीधा साधा<\/td><td>सीधा-सादा<\/td><td>द्वंद्व में हाइफ़न (2024 का प्रश्न)<\/td><\/tr>\n<tr><td>उस ने, राम-ने<\/td><td>उसने, राम ने<\/td><td>सर्वनाम से मिलाकर; संज्ञा से अलग<\/td><\/tr>\n<tr><td>जा सकता है (जासकता है)<\/td><td>जा सकता है<\/td><td>संयुक्त क्रिया अलग-अलग<\/td><\/tr><\/table>\n\n<h3>कारण ७: ऊ और उ, वर्तनी के और भ्रम<\/h3>\n<table><tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>उहापोह<\/td><td>ऊहापोह<\/td><td>'ऊह' (तर्क) से बना: दीर्घ ऊ<\/td><\/tr>\n<tr><td>सन्यासी<\/td><td>संन्यासी<\/td><td>सम्+न्यास: म् के बाद न (अनुस्वार), फिर न्या<\/td><\/tr><\/table>\n<p>अगर किसी विकल्प-समूह में कई शब्द हों, तो हर शब्द पर एक-एक कारण जाँचें: सन्धि, ह्रस्व-दीर्घ, श-ष-स, संयुक्त, स्वर, हाइफ़न। एक भी गड़बड़ मिली तो पूरा समूह अशुद्ध।<\/p>\n\n<h2>पहचान की विधि: MCQ में शुद्ध वर्तनी कैसे खोजें<\/h2>\n<ol class=\"steps\">\n<li><b>प्रश्न की दिशा पढ़ें:<\/b> \"शुद्ध\" माँगा है या \"अशुद्ध\"? और माँगा क्या है: एक शब्द, या शब्द-समूह जिसमें सभी शब्द शुद्ध/अशुद्ध हों? समूह वाले प्रश्न में एक भी अशुद्ध शब्द मिलते ही वह समूह \"सभी शुद्ध\" वाला नहीं रहा।<\/li>\n<li><b>शब्द की श्रेणी तय करें:<\/b> तत्सम (संस्कृत जैसा), तद्भव, या विदेशी।<\/li>\n<li><b>तत्सम हो तो मूल बनावट खोलें:<\/b> क्या यह सन्धि से बना है? विच्छेद करके देखें: मृत्यु+उपरांत, अति+अधिक, दुः+उपयोग। सन्धि का नियम लगाकर रूप निकालें और विकल्प से मिलाएँ।<\/li>\n<li><b>स्त्रीलिंग और व्यक्ति-वाचक शब्द देखें:<\/b> इनमें अक्सर ई/इ का भ्रम होता है (वैदेही, मैथिली, श्रीमती, कवयित्री)।<\/li>\n<li><b>संयुक्त वर्ण में ह देखें:<\/b> 'ह' पहले आना चाहिए (चिह्न, ब्रह्मा, आह्वान)।<\/li>\n<li><b>पंचमाक्षर/अनुस्वार जाँचें:<\/b> बाद का वर्ण उसी वर्ग का है तो अनुस्वार; नहीं तो आधा पंचमाक्षर।<\/li>\n<li><b>हाइफ़न और विभक्ति:<\/b> द्वंद्व समास में हाइफ़न (सीधा-सादा), सर्वनाम के साथ विभक्ति मिली (उसने)।<\/li>\n<li><b>विकल्प-निरसन:<\/b> अगर दो रूप बराबर लगें (गर्मी/गरमी), तो दोनों मान्य हैं; ऐसे में चुनी हुई जगह कहीं और अशुद्धि है।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>जोड़ा<\/th><th>अंतर<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>चिह्न / चिन्ह<\/td><td>पहला शुद्ध (ह+न), दूसरा अशुद्ध<\/td><td>चिह्न, ब्रह्म<\/td><\/tr>\n<tr><td>हँस / हंस<\/td><td>पहला हँसने की क्रिया; दूसरा पक्षी<\/td><td>अर्थ-भेद वाला चंद्रबिंदु<\/td><\/tr>\n<tr><td>राज़ / राज<\/td><td>रहस्य / शासन<\/td><td>नुक्ते से अर्थ-भेद<\/td><\/tr>\n<tr><td>अत्यधिक / अत्याधिक<\/td><td>पहला शुद्ध (अति+अधिक)<\/td><td>यण् सन्धि<\/td><\/tr>\n<tr><td>वाङ्मय / वांग्मय<\/td><td>वाङ्मय मानक, ङ् के बाद म<\/td><td>पंचमाक्षर बना रहता है<\/td><\/tr>\n<tr><td>उसने / उस ने<\/td><td>सर्वनाम में मिलाकर<\/td><td>राम ने (संज्ञा में अलग)<\/td><\/tr>\n<tr><td>सीधा-सादा / सीधा साधा<\/td><td>द्वंद्व में हाइफ़न<\/td><td>खाना-पीना, भला-बुरा<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n<h3>HTET 2020 Q32<\/h3>\n<p>प्रश्न: वर्तनी की दृष्टि से <b>अशुद्ध<\/b> विकल्प चुनिए: (A) मृत्योपरान्त (B) योगिराज (C) प्रोज्ज्वल (D) प्रज्वलित<\/p>\n<div class=\"ex\"><b>उत्तर: (A)<\/b><ol class=\"steps\">\n<li>(A) मृत्योपरान्त: शब्द मृत्यु+उपरांत से बना है और मानक रूप <b>मृत्युपरांत<\/b> है। 'ओ' तब बनता है जब पहले शब्द के अंत में अ/आ हो और आगे उ/ऊ (चंद्र+उदय = चंद्रोदय); यहाँ पहले शब्द के अंत में उ है। इसलिए अशुद्ध।<\/li>\n<li>(B) योगिराज: योगी+राज, समास में पहले पद का ई प्रायः ह्रस्व हो जाता है। कुंजी में शुद्ध।<\/li>\n<li>(C) प्रोज्ज्वल: प्र+उज्ज्वल, अ+उ = ओ (गुण), तो प्रोज्ज्वल। शुद्ध।<\/li>\n<li>(D) प्रज्वलित: प्र+ज्वलित। शुद्ध।<\/li><\/ol><\/div>\n<h3>HTET 2023 Q39<\/h3>\n<p>प्रश्न: वर्तनी की दृष्टि से किस विकल्प के <b>सभी शब्द शुद्ध<\/b> हैं? (A) अभ्यार्थी, त्यौहार (B) याज्ञवल्क्य, हस्तक्षेप (C) मैथली, अहिल्या (D) वैदेहि, वापिस<\/p>\n<div class=\"ex\"><b>उत्तर: (B)<\/b><ol class=\"steps\">\n<li>(A) अभ्यर्थी (अभ्यार्थी नहीं) और त्योहार (त्यौहार नहीं)। दोनों अशुद्ध।<\/li>\n<li>(B) याज्ञवल्क्य और हस्तक्षेप दोनों शुद्ध हैं। यही उत्तर है।<\/li>\n<li>(C) 'मैथली' अशुद्ध है, शुद्ध मैथिली; अहिल्या सही है। एक अशुद्ध शब्द काफ़ी है।<\/li>\n<li>(D) वैदेही (वैदेहि नहीं) और वापस (वापिस नहीं)। दोनों अशुद्ध।<\/li><\/ol><\/div>\n<h3>HTET 2024 Q42<\/h3>\n<p>प्रश्न: निम्नलिखित में से <b>अशुद्ध<\/b> शब्द समूह का चयन कीजिए: (A) सीधा साधा, अठोतर, उहापोह (B) दाशरथि, स्थायित्व, विद्यार्थिपरिषद् (C) सुधीजन, प्रेयसी, निजीकरण (D) वेश्या, शशिभूषण, शक्तीकरण<\/p>\n<div class=\"ex\"><b>उत्तर: (A)<\/b><ol class=\"steps\">\n<li>(A) में 'सीधा साधा' द्वंद्व समास है, इसलिए हाइफ़न चाहिए: सीधा-सादा। और 'उहापोह' का मानक रूप ऊहापोह है। अशुद्ध शब्द दिखते ही पूरा समूह अशुद्ध है।<\/li>\n<li>(B), (C), (D) के शब्द कुंजी में शुद्ध माने गए हैं: दाशरथि, स्थायित्व (स्थायी+त्व, स्थाई नहीं), प्रेयसी, निजीकरण, शशिभूषण आदि।<\/li><\/ol>\n<b>नोट:<\/b> इस प्रश्न में 'अठोतर' पर संदेह हो सकता है, पर विकल्प (A) अशुद्ध ठहराने के लिए 'सीधा साधा' (हाइफ़न की भूल) ही काफ़ी है। (B), (C), (D) में अशुद्ध शब्द खोजने की ज़रूरत नहीं, क्योंकि कुंजी के अनुसार (A) एकमात्र अशुद्ध समूह है।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>वर्तनी = शब्द का मानक लिखित रूप। हिंदी का आधार: केंद्रीय हिंदी निदेशालय का मानकीकरण।<\/li>\n<li>पहले शब्द की श्रेणी तय करें: तत्सम, तद्भव, देशज या विदेशी।<\/li>\n<li>ह-संयुक्त: ह पहले आता है: चिह्न, ब्रह्मा, आह्वान, आह्लाद (चिन्ह, ब्रम्हा, आव्हान नहीं)।<\/li>\n<li>पंचमाक्षर: बाद में उसी वर्ग का व्यंजन हो तो अनुस्वार (गंगा, पंडित); दूसरे वर्ग का या वही पंचमाक्षर हो तो आधा बना रहेगा (वाङ्मय, अन्य, अन्न)।<\/li>\n<li>चंद्रबिंदु अर्थ-भेद के लिए अनिवार्य (हँस/हंस); शिरोरेखा पर मात्रा हो तो बिंदु की छूट (मैं, नहीं)।<\/li>\n<li>विभक्ति: संज्ञा से अलग (राम ने), सर्वनाम से मिली (उसने)।<\/li>\n<li>द्वंद्व और पुनरुक्त शब्दों में हाइफ़न: सीधा-सादा, धीरे-धीरे।<\/li>\n<li>श्रुतिमूलक य/व: स्वरात्मक (किए, गए) पर मूल 'य' रहे (स्थायी, दायित्व)।<\/li>\n<li>तत्सम शब्द जैसे के तैसे: गृहीत, द्रष्टव्य, प्रदर्शनी, अत्यधिक, उज्ज्वल।<\/li>\n<li>सन्धि जानें तो आधी वर्तनी आ जाती है: मृत्युपरांत, अत्यधिक, दुरुपयोग।<\/li>\n<li>HTET के अशुद्ध पुराने शब्द: मृत्योपरान्त, अभ्यार्थी, त्यौहार, मैथली, वैदेहि, वापिस, सीधा साधा, उहापोह।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न: शुद्ध वर्तनी है: (A) अत्याधिक (B) अत्यधिक (C) अतिअधिक (D) अत्यधीक<\/summary><p><b>उत्तर: (B)<\/b> अति+अधिक, यण् सन्धि (इ→य्)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: मानक रूप है: (A) वाङमय (B) वांमय (C) वाङ्मय (D) वाँमय<\/summary><p><b>उत्तर: (C)<\/b> ङ् के बाद म (दूसरे वर्ग का) है, इसलिए ङ् बना रहता है। गुरु ने भी इसे नियम का अपवाद बताया है (पृ. ६०)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: चंद्रबिंदु अनिवार्य है ताकि अर्थ-भेद रहे: (A) हंस/हँस (B) गंगा (C) संपादक (D) ठंडा<\/summary><p><b>उत्तर: (A)<\/b> पक्षी बनाम हँसना। बाकी शब्दों में अनुस्वार नियमानुसार।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: सही वाक्य: (A) उस ने कहा (B) उसने कहा (C) राम-ने कहा (D) रामने कहा<\/summary><p><b>उत्तर: (B)<\/b> सर्वनाम के साथ विभक्ति मिलती है, संज्ञा के साथ अलग (राम ने)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अशुद्ध वर्तनी है: (A) दुरुपयोग (B) निरपराध (C) उज्ज्वल (D) निर्पराध<\/summary><p><b>उत्तर: (D)<\/b> निः+अपराध = निरपराध। 'निर्पराध' में र् दो बार आ गया।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: शुद्ध शब्द-युग्म है: (A) चिन्ह, ब्रम्हा (B) चिह्न, ब्रह्मा (C) चिह्न, ब्रम्हा (D) चिन्ह, ब्रह्मा<\/summary><p><b>उत्तर: (B)<\/b> ह-संयुक्त में ह पहले आता है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: शुद्ध है: (A) श्रीमति (B) श्रीमती (C) श्रिमती (D) श्रीमत्ती<\/summary><p><b>उत्तर: (B)<\/b> स्त्रीलिंग रूप दीर्घ ई से।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: शुद्ध है: (A) परिक्षा (B) परीक्षा (C) परीक्शा (D) परिख्षा<\/summary><p><b>उत्तर: (B)<\/b> परि+ईक्षा = परीक्षा (दीर्घ सन्धि)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: द्वंद्व समास का शुद्ध रूप: (A) माता पिता (B) माता-पिता (C) माताऽपिता (D) माता_पिता<\/summary><p><b>उत्तर: (B)<\/b> द्वंद्व समास में हाइफ़न।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न: अशुद्ध चुनिए: (A) स्थायी (B) दायित्व (C) स्थाई (D) आवश्यक<\/summary><p><b>उत्तर: (C)<\/b> मूल शब्द में 'य' है: स्थायी। श्रुतिमूलक 'य' वाला नियम यहाँ लागू नहीं होता।<\/p><\/details>\n\n<p class=\"src\">स्रोत: <a href=\"https://cdnbbsr.s3waas.gov.in/s380537a945c7aaa788ccfcdf1b99b5d8f/uploads/2025/08/202508251337000008.pdf\">केंद्रीय हिंदी निदेशालय: देवनागरी लिपि तथा हिंदी वर्तनी का मानकीकरण<\/a>; कामता प्रसाद गुरु, हिंदी व्याकरण: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/५९\">पृ. ५९-६०<\/a> (संयुक्त व्यंजन, हल्, अनुस्वार, 'ह' की भूलें), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६९\">६९<\/a> (चंद्रबिंदु), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७०\">७०<\/a> (ज़, फ़)। टिप्पणी: CHD की पुस्तिका के पृष्ठ-क्रम का उल्लेख नहीं किया गया है।<\/p>\n","hin-san":"<p class=\"key\"><b>HTET में क्या पूछा गया:<\/b> 2020 से 2024 तक हर साल 1 प्रश्न, यानी कुल 5। इनमें दो प्रश्न <b>संधि-विच्छेद की जाँच<\/b> के थे (2021 Q34, 2023 Q34), दो <b>संधि का प्रकार पहचानने<\/b> के (2020 Q37 व्यंजन, 2022 Q39 विसर्ग) और एक (2024 Q39) में यण्, दीर्घ, व्यंजन और विसर्ग चारों मिलाकर \"अनुपयुक्त विकल्प\" चुनना था। यानी तीनों भेद (स्वर, व्यंजन, विसर्ग) परीक्षा में आते हैं। जो विद्यार्थी केवल रटे हुए उदाहरण जानता है, वह फँस जाता है; जो नियम समझता है, उसे हर प्रश्न दो मिनट में हल हो जाता है।<\/p>\n\n<h2>परिचय: संधि क्या है<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जब दो वर्ण (ध्वनियाँ) पास-पास आते हैं, तो उनके मेल से उच्चारण की सुविधा के लिए जो बदलाव (विकार) होता है, उसे <b>संधि<\/b> कहते हैं। संधि का अर्थ ही है \"मेल\"। संधि में दो अलग-अलग शब्द जुड़कर एक नया शब्द बनाते हैं और बीच की ध्वनि बदल जाती है। जैसे विद्या + आलय = विद्यालय: 'विद्या' का अंतिम 'आ' और 'आलय' का पहला 'आ' मिलकर एक ही 'आ' बन गया।<\/div>\n<p>कामता प्रसाद गुरु की परिभाषा (पृ. ७२, अंक ५९): \"दो निर्दिष्ट अक्षरों के पास पास आने के कारण उनके मेल से जो विकार होता है उसे संधि कहते हैं।\" इसी जगह वे संधि और संयोग का अंतर भी बताते हैं: \"संयोग में अक्षर जैसे के तैसे रहते हैं, परंतु संधि में उच्चारण के नियमानुसार दो अक्षरों के मेल में उनकी जगह कोई भिन्न अक्षर हो जाता है।\"<\/p>\n<p>गुरु की एक और ज़रूरी सूचना (पृ. ७२-७३): संधि का विषय संस्कृत व्याकरण से संबंध रखता है। संस्कृत में पदसिद्धि, समास और वाक्यों में संधि का प्रयोजन पड़ता है। हिंदी में संधि के नियमों से मिले हुए संस्कृत के जो समासिक शब्द आते हैं, केवल उन्हीं के संबंध से इस विषय को पढ़ना पड़ता है। इसलिए हिंदी की संधि का अर्थ है: <b>तत्सम (संस्कृत मूल के) शब्दों को तोड़ना और जोड़ना<\/b>। हिंदी के अपने शब्दों (घर+आँगन) में संधि नहीं होती।<\/p>\n<p><b>संधि-विच्छेद<\/b> इसका उलटा काम है: मिले हुए शब्द को तोड़कर उसके मूल दो भागों में दिखाना। विद्यालय → विद्या + आलय। संधि करना जोड़ना है, विच्छेद करना तोड़ना। HTET में ज़्यादातर विच्छेद की जाँच ही पूछी गई है।<\/p>\n<p><b>रोज़मर्रा की तुलना:<\/b> जब आप तेज़ी से बोलते हैं, \"क्या हुआ\" का \"क्या हुआ\" ही रहता है, पर \"जा रहा हूँ\" जल्दी में \"जा रा हूँ\" जैसा सुनाई देता है। जीभ के पास हर ध्वनि के लिए अलग जगह जाने का समय नहीं होता, इसलिए वह दो ध्वनियों को पास लाकर एक कर देती है। संधि इसी सुविधा का व्याकरणिक रूप है।<\/p>\n\n<h2>मूल अवधारणा: संधि होती क्यों है<\/h2>\n<ol class=\"steps\">\n<li><b>जीभ का आलस:<\/b> हर वर्ण मुँह के किसी स्थान से निकलता है (कंठ, तालु, मूर्धा, दंत, ओठ)। जब एक वर्ण दंत से निकले और अगला तालु से, तो जीभ को तेज़ी से जगह बदलनी पड़ती है। यह कठिन होता है। इसलिए पहली ध्वनि दूसरी जैसी बन जाती है। उत्+चारण में 'त्' (दंत) के बाद 'च' (तालु) आता है, तो त् भी तालव्य 'च्' बन जाता है: उच्चारण।<\/li>\n<li><b>घोष-अघोष का मेल:<\/b> अघोष ध्वनि (जैसे क्, त्) के बाद अगर घोष ध्वनि (जैसे ई, ग, द) आए, तो गले की गूँज बीच में बदलनी पड़ती है। इसलिए अघोष भी घोष हो जाता है: जगत्+ईश → जगदीश (त् → द्), वाक्+ईश → वागीश (क् → ग्)।<\/li>\n<li><b>स्वरों का मेल:<\/b> दो स्वर पास आएँ तो बीच में रुकना पड़ता है। इसलिए वे एक नए स्वर में घुल जाते हैं: राम+अवतार → रामावतार (अ+अ = आ), देव+इंद्र → देवेंद्र (अ+इ = ए)।<\/li>\n<li><b>विसर्ग का बदलना:<\/b> विसर्ग (ः) 'ह' जैसी हल्की साँस की ध्वनि है। अगले वर्ण के हिसाब से वह ओ, र्, श्, ष्, स् आदि में बदल जाता है: मनः+हर → मनोहर।<\/li>\n<\/ol>\n<p>यानी संधि कोई मनमाना रटन नहीं, यह <b>ध्वनि-मेल का नियम<\/b> है। नियम जान लें तो नया शब्द भी जोड़ा-तोड़ा जा सकता है।<\/p>\n\n<h3>संधि, संयोग और समास में अंतर<\/h3>\n<table><tr><th>बात<\/th><th>संधि<\/th><th>समास<\/th><\/tr>\n<tr><td>किनका मेल<\/td><td>वर्णों (ध्वनियों) का<\/td><td>शब्दों (पदों) का<\/td><\/tr>\n<tr><td>क्या होता है<\/td><td>वर्ण बदल सकते हैं (विद्या+आलय = विद्यालय)<\/td><td>वर्ण नहीं बदलते; बीच की विभक्ति लुप्त होती है (राजा का पुत्र = राजपुत्र)<\/td><\/tr>\n<tr><td>तोड़ने को क्या कहते हैं<\/td><td>संधि-विच्छेद<\/td><td>विग्रह<\/td><\/tr>\n<tr><td>कहाँ होता है<\/td><td>एक शब्द के भीतर या दो शब्दों के बीच<\/td><td>केवल दो या अधिक शब्दों के बीच<\/td><\/tr>\n<tr><td>भाषा में<\/td><td>संस्कृत तत्सम शब्दों में, हिंदी में कम<\/td><td>हिंदी में खूब चलता है<\/td><\/tr><\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> संधि और समास साथ-साथ भी हो सकते हैं। जगदीश = जगत्+ईश (संधि-विच्छेद) और \"जगत् का ईश\" (तत्पुरुष समास का विग्रह)। संधि वर्णों के मेल को देखती है, समास अर्थ के संबंध को। प्रश्न में \"संधि-विच्छेद\" लिखा हो तो आपको दो भाग दिखाने हैं (जगत्+ईश); \"विग्रह\" या \"समास\" लिखा हो तो अर्थ बताना है (जगत् का ईश)।<\/div>\n<p>गुरु के अनुसार <b>संयोग<\/b> में वर्ण जैसे के तैसे रहते हैं (अन्न, सत्कार), संधि में बदलते हैं। जैसे 'रामावतार' में 'अ+अ' का 'आ' बन गया (संधि), पर 'सत्कार' में 'त्' और 'क' ज्यों के त्यों साथ-साथ लिखे गए (संयोग)।<\/p>\n\n<h3>संधि के तीन भेद (गुरु, पृ. ७३, अंक ६०)<\/h3>\n<div class=\"cards\">\n<div><h3>स्वर संधि<\/h3><p>दो स्वर पास आएँ। राम+अवतार = रामावतार<\/p><\/div>\n<div><h3>व्यंजन संधि<\/h3><p>पहला वर्ण व्यंजन हो, दूसरा स्वर या व्यंजन। जगत्+ईश = जगदीश, जगत्+नाथ = जगन्नाथ<\/p><\/div>\n<div><h3>विसर्ग संधि<\/h3><p>पहला पद विसर्ग (ः) पर समाप्त हो। तपः+वन = तपोवन, निः+अंतर = निरंतर<\/p><\/div>\n<\/div>\n<p>गुरु के शब्दों में: दो स्वरों के पास आने से जो संधि होती है, वह स्वर-संधि; जिन दो वर्णों में संधि होती है, उनमें से पहला वर्ण व्यंजन हो और दूसरा चाहे स्वर हो चाहे व्यंजन, तो व्यंजन-संधि; और विसर्ग के साथ स्वर या व्यंजन की संधि विसर्ग-संधि। <b>तेज़ पहचान:<\/b> पहले पद का आख़िरी वर्ण देखें। स्वर है → स्वर संधि। व्यंजन (हल्) है → व्यंजन संधि। विसर्ग (ः) है → विसर्ग संधि।<\/p>\n\n<h2>स्वर संधि<\/h2>\n<p>स्वर संधि के पाँच भेद हैं। गुरु इनमें दीर्घ, गुण, वृद्धि और यण् की चर्चा करते हैं (पृ. ७३-७६) और ए/ओ/ऐ/औ के आगे स्वर आने के नियम को भी बताते हैं (अंक ६५); 'अयादि' नाम स्कूली पुस्तकों का है।<\/p>\n<div class=\"cards\">\n<div><h3>दीर्घ<\/h3><p>सवर्ण (सजातीय) स्वर मिलें → दीर्घ: अ/आ+अ/आ = आ; इ/ई+इ/ई = ई; उ/ऊ+उ/ऊ = ऊ<\/p><\/div>\n<div><h3>गुण<\/h3><p>अ/आ + इ/ई = ए; अ/आ + उ/ऊ = ओ; अ/आ + ऋ = अर्<\/p><\/div>\n<div><h3>वृद्धि<\/h3><p>अ/आ + ए/ऐ = ऐ; अ/आ + ओ/औ = औ<\/p><\/div>\n<div><h3>यण्<\/h3><p>इ/ई → य्, उ/ऊ → व्, ऋ → र् (बाद में असमान स्वर)<\/p><\/div>\n<div><h3>अयादि<\/h3><p>ए → अय्, ऐ → आय्, ओ → अव्, औ → आव् (बाद में कोई स्वर)<\/p><\/div>\n<\/div>\n\n<h3>१. दीर्घ संधि (गुरु, पृ. ७३-७४, अंक ६१)<\/h3>\n<div class=\"def\"><b>नियम<\/b> यदि दो सवर्ण (सजातीय) स्वर पास-पास आएँ, तो दोनों के बदले उसी जाति का एक दीर्घ स्वर हो जाता है। सवर्ण यानी जिनके स्थान और प्रयत्न एक ही हों: अ-आ, इ-ई, उ-ऊ (पृ. ६४, अंक ३८)।<\/div>\n<p class=\"eq\"><span>अ/आ<\/span> + <span>अ/आ<\/span> = <b>आ<\/b><\/p>\n<p class=\"eq\"><span>इ/ई<\/span> + <span>इ/ई<\/span> = <b>ई<\/b><\/p>\n<p class=\"eq\"><span>उ/ऊ<\/span> + <span>उ/ऊ<\/span> = <b>ऊ<\/b><\/p>\n<p><b>क्यों:<\/b> एक ही जगह से निकलने वाली दो ध्वनियों को अलग-अलग बोलना बेकार है। जीभ वहीं रुककर उसे थोड़ा लंबा खींच देती है, और ह्रस्व+ह्रस्व = दीर्घ बन जाता है (एक मात्रा + एक मात्रा = दो मात्रा)।<\/p>\n<p><b>कैसे पहचानें:<\/b> विच्छेद में पहले शब्द का अंत और दूसरे शब्द का आदि एक ही जाति के स्वर हों (अ/आ या इ/ई या उ/ऊ) और जोड़ में दीर्घ स्वर (आ, ई, ऊ) दिखे।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>कल्पांत<\/td><td>कल्प + अंत<\/td><td>अ + अ = आ<\/td><\/tr>\n<tr><td>कुशासन<\/td><td>कुश + आसन<\/td><td>अ + आ = आ<\/td><\/tr>\n<tr><td>रेखांश<\/td><td>रेखा + अंश<\/td><td>आ + अ = आ<\/td><\/tr>\n<tr><td>विद्यालय<\/td><td>विद्या + आलय<\/td><td>आ + आ = आ<\/td><\/tr>\n<tr><td>गिरींद्र<\/td><td>गिरि + इंद्र<\/td><td>इ + इ = ई<\/td><\/tr>\n<tr><td>कपीश्वर<\/td><td>कपि + ईश्वर<\/td><td>इ + ई = ई<\/td><\/tr>\n<tr><td>जानकीश<\/td><td>जानकी + ईश<\/td><td>ई + ई = ई<\/td><\/tr>\n<tr><td>महींद्र<\/td><td>मही + इंद्र<\/td><td>ई + इ = ई<\/td><\/tr>\n<tr><td>भानूदय<\/td><td>भानु + उदय<\/td><td>उ + उ = ऊ<\/td><\/tr>\n<tr><td>लघूर्मि<\/td><td>लघु + ऊर्मि<\/td><td>उ + ऊ = ऊ<\/td><\/tr>\n<tr><td>वधूत्सव<\/td><td>वधू + उत्सव<\/td><td>ऊ + उ = ऊ<\/td><\/tr><\/table>\n<div class=\"ex\"><b>कार्य-विधि: रामावतार<\/b> (गुरु, पृ. ७३)<ol class=\"steps\">\n<li>राम + अवतार। पहले पद का अंत 'म' है, यानी म्+अ, और दूसरे का आदि 'अ'।<\/li>\n<li>दोनों 'अ' सवर्ण हैं → दीर्घ संधि।<\/li>\n<li>अ + अ = आ → रामावतार।<\/li><\/ol><\/div>\n<div class=\"trap\"><b>दीर्घ ऋ:<\/b> गुरु (पृ. ७४) के अनुसार ऋ+ऋ का उदाहरण (मातृ+ऋण = मातृण) में भी विकल्प से 'भातृण' रूप होता है, इसलिए दीर्घ ऋ की ज़रूरत नहीं है। हिंदी में ऋ का दीर्घ नहीं माना जाता। <b>जाल से बचें:<\/b> 'दैत्य+अरि' में आख़िरी वर्ण 'य' है (दैत्य = दैत्य्+अ), इसलिए 'अ+अ = आ' से दैत्यारि बनता है, यह <b>दीर्घ<\/b> संधि है, यण् नहीं (2024 Q39 का जाल)।<\/div>\n\n<h3>२. गुण संधि (गुरु, पृ. ७४-७५, अंक ६२)<\/h3>\n<div class=\"def\"><b>नियम<\/b> अ या आ के बाद इ/ई आए तो दोनों मिलकर <b>ए<\/b>; उ/ऊ आए तो <b>ओ<\/b>; और ऋ आए तो <b>अर्<\/b> हो जाता है। इस विकार को गुण कहते हैं।<\/div>\n<p class=\"eq\"><span>अ/आ<\/span> + <span>इ/ई<\/span> = <b>ए<\/b><\/p>\n<p class=\"eq\"><span>अ/आ<\/span> + <span>उ/ऊ<\/span> = <b>ओ<\/b><\/p>\n<p class=\"eq\"><span>अ/आ<\/span> + <span>ऋ<\/span> = <b>अर्<\/b><\/p>\n<p><b>क्यों:<\/b> अ (कंठ) और इ (तालु) अलग स्थान के स्वर हैं (असवर्ण)। जब मिलते हैं तो दोनों का मिला-जुला स्थान बनता है: ए कंठ-तालु का स्वर है (अ का कंठ और इ का तालु)। इसी तरह ओ कंठ और ओष्ठ का स्वर है (अ का कंठ और उ का ओष्ठ)। यानी नया स्वर दोनों के गुण रखता है, इसीलिए नाम 'गुण'।<\/p>\n<p><b>कैसे पहचानें:<\/b> विच्छेद में पहला स्वर अ/आ और दूसरा इ, ई, उ, ऊ या ऋ हो। जोड़ में ए, ओ या अर् दिखे।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>देवेंद्र<\/td><td>देव + इंद्र<\/td><td>अ + इ = ए<\/td><\/tr>\n<tr><td>सुरेश<\/td><td>सुर + ईश<\/td><td>अ + ई = ए<\/td><\/tr>\n<tr><td>महेंद्र<\/td><td>महा + इंद्र<\/td><td>आ + इ = ए<\/td><\/tr>\n<tr><td>रमेश<\/td><td>रमा + ईश<\/td><td>आ + ई = ए<\/td><\/tr>\n<tr><td>चंद्रोदय<\/td><td>चंद्र + उदय<\/td><td>अ + उ = ओ<\/td><\/tr>\n<tr><td>समुद्रोर्मि<\/td><td>समुद्र + ऊर्मि<\/td><td>अ + ऊ = ओ<\/td><\/tr>\n<tr><td>महोत्सव<\/td><td>महा + उत्सव<\/td><td>आ + उ = ओ<\/td><\/tr>\n<tr><td>महोरु<\/td><td>महा + ऊरु<\/td><td>आ + ऊ = ओ<\/td><\/tr>\n<tr><td>सप्तर्षि<\/td><td>सप्त + ऋषि<\/td><td>अ + ऋ = अर्<\/td><\/tr>\n<tr><td>महर्षि<\/td><td>महा + ऋषि<\/td><td>आ + ऋ = अर्<\/td><\/tr><\/table>\n<div class=\"ex\"><b>कार्य-विधि: महर्षि<\/b><ol class=\"steps\">\n<li>महा + ऋषि। पहला पद आ पर समाप्त (म्+ह्+आ, यानी 'महा'), दूसरे का आदि ऋ।<\/li>\n<li>आ + ऋ → गुण संधि, नियम 'अ/आ + ऋ = अर्'।<\/li>\n<li>'आ' और 'ऋ' हटाकर उनकी जगह 'अर्' लगाइए: मह् + अर् + षि = महर्षि।<\/li><\/ol><\/div>\n<div class=\"trap\"><b>अपवाद (गुरु, पृ. ७५):<\/b> कुछ शब्दों में गुण की जगह वृद्धि होती है: ख+ईर = खैर, अक्ष+ऊहिनी = अक्षौहिणी, प्र+ऊढ = प्रौढ, सुख+ऋत = सुखार्त, दश+ऋण = दशार्ण। इन्हें शब्दों के रूप में याद रखें। <b>सबसे आम भूल:<\/b> गुरु+उपदेश = गुरूपदेश (दीर्घ, उ+उ = ऊ), 'गुरोपदेश' नहीं, क्योंकि 'गुरु' के अंत में उ है, अ/आ नहीं। अभि+इप्सा = अभीप्सा (इ+इ = ई), 'अभिप्सा' या 'अभेप्सा' नहीं। पर+उपदेश = परोपदेश (अ+उ = ओ, गुण), यह विसर्ग नहीं है।<\/div>\n\n<h3>३. वृद्धि संधि (गुरु, पृ. ७५, अंक ६३)<\/h3>\n<div class=\"def\"><b>नियम<\/b> अ या आ के बाद ए या ऐ आए तो दोनों मिलकर <b>ऐ<\/b>; और ओ या औ आए तो <b>औ<\/b> हो जाता है। इस विकार को वृद्धि कहते हैं।<\/div>\n<p class=\"eq\"><span>अ/आ<\/span> + <span>ए/ऐ<\/span> = <b>ऐ<\/b><\/p>\n<p class=\"eq\"><span>अ/आ<\/span> + <span>ओ/औ<\/span> = <b>औ<\/b><\/p>\n<p><b>क्यों:<\/b> वृद्धि का अर्थ बढ़ना है। अ/आ के बाद गुण वाले स्वर (ए, ओ) या वृद्धि वाले स्वर (ऐ, औ) आने पर परिणाम और भी \"बढ़ा\" हुआ स्वर (ऐ, औ) बनता है।<\/p>\n<p><b>कैसे पहचानें:<\/b> विच्छेद में दूसरा शब्द ए, ऐ, ओ या औ से शुरू हो; जोड़ में ऐ या औ दिखे और पहले पद का अंत अ/आ हो।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>एकैक<\/td><td>एक + एक<\/td><td>अ + ए = ऐ<\/td><\/tr>\n<tr><td>मतैक्य<\/td><td>मत + ऐक्य<\/td><td>अ + ऐ = ऐ<\/td><\/tr>\n<tr><td>सदैव<\/td><td>सदा + एव<\/td><td>आ + ए = ऐ<\/td><\/tr>\n<tr><td>महैश्वर्य<\/td><td>महा + ऐश्वर्य<\/td><td>आ + ऐ = ऐ<\/td><\/tr>\n<tr><td>जलौघ<\/td><td>जल + ओघ<\/td><td>अ + ओ = औ<\/td><\/tr>\n<tr><td>महौज<\/td><td>महा + ओज<\/td><td>आ + ओ = औ<\/td><\/tr>\n<tr><td>परमौषध<\/td><td>परम + औषध<\/td><td>अ + औ = औ<\/td><\/tr>\n<tr><td>महौदार्य<\/td><td>महा + औदार्य<\/td><td>आ + औ = औ<\/td><\/tr><\/table>\n<div class=\"trap\"><b>अपवाद (गुरु, पृ. ७५):<\/b> अ/आ के आगे 'ओष्ठ' शब्द आए तो विकल्प से ओ या औ होता है: बिंब+ओष्ठ = बिंबोष्ठ या बिंबौष्ठ; अधर+ओष्ठ = अधरोष्ठ या अधरौष्ठ। <b>गुण बनाम वृद्धि:<\/b> दोनों में पहला स्वर अ/आ होता है। फ़र्क़ दूसरे स्वर का है: दूसरा इ/ई/उ/ऊ/ऋ → गुण; दूसरा ए/ऐ/ओ/औ → वृद्धि।<\/div>\n\n<h3>४. यण् संधि (गुरु, पृ. ७५-७६, अंक ६४)<\/h3>\n<div class=\"def\"><b>नियम<\/b> ह्रस्व या दीर्घ इ, उ या ऋ के आगे कोई असवर्ण (विजातीय) स्वर आए, तो इ/ई के बदले <b>य्<\/b>, उ/ऊ के बदले <b>व्<\/b> और ऋ के बदले <b>र्<\/b> हो जाता है। इस विकार को यण् कहते हैं।<\/div>\n<p class=\"eq\"><span>इ/ई<\/span> + <span>असमान स्वर<\/span> = <b>य्<\/b> + स्वर<\/p>\n<p class=\"eq\"><span>उ/ऊ<\/span> + <span>असमान स्वर<\/span> = <b>व्<\/b> + स्वर<\/p>\n<p class=\"eq\"><span>ऋ<\/span> + <span>असमान स्वर<\/span> = <b>र्<\/b> + स्वर<\/p>\n<p><b>क्यों:<\/b> इ और उ के पास अर्द्ध-स्वर बनने की क्षमता है: इ का 'य' और उ का 'व' जैसा रूप होता है। जब असमान स्वर आता है, तो इ/उ \"स्वर\" का काम छोड़कर \"अर्द्ध-स्वर\" (य्, व्) का काम करने लगता है और अगला स्वर उसी में जुड़ जाता है। 'य, र, ल, व' को 'अंतस्थ' इसीलिए कहते हैं।<\/p>\n<p><b>कैसे पहचानें:<\/b> जोड़ में बीच में आधा 'य्', 'व्' या 'र्' दिखे और उसके बाद स्वर की मात्रा। पहले पद का अंत इ/ई/उ/ऊ/ऋ। जैसे 'यद्यपि' में 'द्य' (द् + य) दिखता है।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>यद्यपि<\/td><td>यदि + अपि<\/td><td>इ + अ = य<\/td><\/tr>\n<tr><td>इत्यादि<\/td><td>इति + आदि<\/td><td>इ + आ = या<\/td><\/tr>\n<tr><td>प्रत्युपकार<\/td><td>प्रति + उपकार<\/td><td>इ + उ = यु<\/td><\/tr>\n<tr><td>न्यून<\/td><td>नि + ऊन<\/td><td>इ + ऊ = यू<\/td><\/tr>\n<tr><td>प्रत्येक<\/td><td>प्रति + एक<\/td><td>इ + ए = ये<\/td><\/tr>\n<tr><td>नद्यर्पण<\/td><td>नदी + अर्पण<\/td><td>ई + अ = य<\/td><\/tr>\n<tr><td>देव्यागमन<\/td><td>देवी + आगमन<\/td><td>ई + आ = या<\/td><\/tr>\n<tr><td>सख्युचित<\/td><td>सखी + उचित<\/td><td>ई + उ = यु<\/td><\/tr>\n<tr><td>देव्यैश्वर्य<\/td><td>देवी + ऐश्वर्य<\/td><td>ई + ऐ = यै<\/td><\/tr>\n<tr><td>मन्वंतर<\/td><td>मनु + अंतर<\/td><td>उ + अ = व<\/td><\/tr>\n<tr><td>स्वागत<\/td><td>सु + आगत<\/td><td>उ + आ = वा<\/td><\/tr>\n<tr><td>अन्वित<\/td><td>अनु + इत<\/td><td>उ + इ = वि<\/td><\/tr>\n<tr><td>अन्वेषण<\/td><td>अनु + एषण<\/td><td>उ + ए = वे<\/td><\/tr>\n<tr><td>पित्रनुमति<\/td><td>पितृ + अनुमति<\/td><td>ऋ + अ = र<\/td><\/tr>\n<tr><td>मात्रानंद<\/td><td>मातृ + आनंद<\/td><td>ऋ + आ = रा<\/td><\/tr><\/table>\n<div class=\"ex\"><b>कार्य-विधि: यद्यपि<\/b><ol class=\"steps\">\n<li>यदि + अपि। 'यदि' का अंतिम स्वर इ और 'अपि' का पहला स्वर अ असवर्ण हैं।<\/li>\n<li>इ के बदले 'य्' हो जाता है: यद् + य् + अपि।<\/li>\n<li>'य्' में 'अ' जुड़कर 'य' बन जाता है: यद् + य + पि = <b>यद्यपि<\/b>।<\/li>\n<li>ध्यान दें: मूल 'द' (द्+इ) में से इ हट गया, इसलिए 'द' आधा 'द्' हो गया।<\/li><\/ol><\/div>\n<div class=\"ex\"><b>कार्य-विधि: स्वागत<\/b><ol class=\"steps\">\n<li>सु + आगत। 'सु' का अंत उ, 'आगत' का आदि आ।<\/li>\n<li>उ के बदले 'व्': स् + व् + आगत।<\/li>\n<li>व् + आ = वा: स् + वा + गत = <b>स्वागत<\/b>।<\/li><\/ol><\/div>\n<div class=\"trap\"><b>यण् में सबसे बड़ा जाल:<\/b> यण् तभी होता है जब पहला स्वर इ/ई/उ/ऊ/ऋ हो और जोड़ में पहला वर्ण आधा (हल्) हो जाए (यद्+य, न्+यू, प्रत्+ये)। इसलिए दैत्यारि (दैत्य+अरि) यण् नहीं, दीर्घ है: 'दैत्य' के अंत में य् के बाद अ है, यानी अ+अ = आ। शुद्ध रूप याद रखें: गति+अनुसार = <b>गत्यनुसार<\/b> (गत्यानुसार नहीं); गति+अवरोध = <b>गत्यवरोध<\/b> (गत्यावरोध नहीं, 2021 Q34 का ग़लत विकल्प); अग्नि+आशय = अग्न्याशय (अगन्याशय नहीं)। यण् में दूसरे पद का स्वर जैसा है वैसा ही जुड़ता है: अ रहे तो अ, आ रहे तो आ। अपने मन से 'आ' न जोड़ें।<\/div>\n\n<h3>५. अयादि संधि (गुरु, पृ. ७६, अंक ६५)<\/h3>\n<div class=\"def\"><b>नियम<\/b> ए, ऐ, ओ या औ के आगे कोई (दूसरा) स्वर हो तो इनके स्थान में क्रमशः <b>अय्, आय्, अव्, आव्<\/b> हो जाता है।<\/div>\n<p class=\"eq\"><span>ए<\/span> + <span>स्वर<\/span> = <b>अय्<\/b> + स्वर<\/p>\n<p class=\"eq\"><span>ऐ<\/span> + <span>स्वर<\/span> = <b>आय्<\/b> + स्वर<\/p>\n<p class=\"eq\"><span>ओ<\/span> + <span>स्वर<\/span> = <b>अव्<\/b> + स्वर<\/p>\n<p class=\"eq\"><span>औ<\/span> + <span>स्वर<\/span> = <b>आव्<\/b> + स्वर<\/p>\n<p><b>क्यों:<\/b> ए, ऐ, ओ, औ संयुक्त स्वर हैं (ए = अ+इ, ऐ = आ+ई, ओ = अ+उ, औ = आ+ऊ)। इनके बाद दूसरा स्वर आए तो इन्हें तोड़कर पहला भाग अ/आ रहता है और दूसरा भाग (इ/उ) अर्द्ध-स्वर य्/व् बन जाता है। इसीलिए ए → अ+य, ऐ → आ+य, ओ → अ+व, औ → आ+व।<\/p>\n<p><b>कैसे पहचानें:<\/b> जोड़ में बीच में 'य' या 'व' मिले और उसके पहले का स्वर अ या आ हो (नयन, गायन, पवन, पावन)। पहले पद का अंत ए/ऐ/ओ/औ।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>नयन<\/td><td>ने + अन<\/td><td>ए → अय्<\/td><\/tr>\n<tr><td>शयन<\/td><td>शे + अन<\/td><td>ए → अय्<\/td><\/tr>\n<tr><td>गायन<\/td><td>गै + अन<\/td><td>ऐ → आय्<\/td><\/tr>\n<tr><td>नायक<\/td><td>नै + अक<\/td><td>ऐ → आय्<\/td><\/tr>\n<tr><td>पवन<\/td><td>पो + अन<\/td><td>ओ → अव्<\/td><\/tr>\n<tr><td>गवीश<\/td><td>गो + ईश<\/td><td>ओ → अव्<\/td><\/tr>\n<tr><td>पावन<\/td><td>पौ + अन<\/td><td>औ → आव्<\/td><\/tr>\n<tr><td>नाविक<\/td><td>नौ + इक<\/td><td>औ → आव्<\/td><\/tr>\n<tr><td>भावुक<\/td><td>भौ + उक<\/td><td>औ → आव्<\/td><\/tr><\/table>\n<div class=\"ex\"><b>कार्य-विधि: नाविक<\/b> (गुरु, पृ. ७६)<ol class=\"steps\">\n<li>नौ + इक = न् + औ + इ + क।<\/li>\n<li>औ → आव्: न् + आव् + इ + क।<\/li>\n<li>व् + इ = वि: न् + आ + वि + क = <b>नाविक<\/b>।<\/li><\/ol><\/div>\n<div class=\"trap\"><b>ध्यान दें (गुरु, पृ. ७६-७७, अंक ६६):<\/b> ए या ओ के आगे अ आए तो अ का लोप हो जाता है और उसकी जगह लुप्त अकार का चिह्न (ऽ) लगता है: ते+अपि = तेऽपि, सो+अनुमानै = सोऽनुमानै। गुरु स्वयं लिखते हैं कि हिंदी में इस संधि का प्रचार नहीं है। हिंदी के शब्दों में अयादि का रूप (नयन, पवन) ही चलता है।<\/div>\n\n<h2>व्यंजन संधि<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिन दो वर्णों में संधि होती है, उनमें पहला वर्ण व्यंजन हो और दूसरा चाहे स्वर हो चाहे व्यंजन, तो उसे व्यंजन संधि कहते हैं (गुरु, पृ. ७३)। जगत्+ईश = जगदीश; जगत्+नाथ = जगन्नाथ।<\/div>\n<p><b>क्यों:<\/b> व्यंजन संधि के पीछे तीन विचार हैं। (१) <b>घोष-अघोष का मेल:<\/b> अघोष के बाद घोष आए तो अघोष भी घोष हो जाता है। (२) <b>स्थान का मेल:<\/b> पहला व्यंजन अगले व्यंजन के स्थान की ओर खिसक जाता है (त् → च् जब च आए)। (३) <b>अनुनासिक का मेल:<\/b> अगला वर्ण नासिक्य (न, म) हो तो पहला भी अपने वर्ग का नासिक्य बन जाता है। इन तीनों में एक बात सामान्य है: दोनों ध्वनियाँ एक-दूसरे जैसी बनने की कोशिश करती हैं।<\/p>\n<div class=\"cards\">\n<div><h3>वर्ग का पहला → तीसरा<\/h3><p>क्,च्,ट्,प् + घोष वर्ण<\/p><\/div>\n<div><h3>पहला → पाँचवाँ<\/h3><p>वर्ग का पहला + अनुनासिक (न, म)<\/p><\/div>\n<div><h3>त्/द् संबंधी<\/h3><p>त् के बाद स्वर/घोष, च-छ, ज-झ, ट-ठ, ड-ढ, ल, श, ह<\/p><\/div>\n<div><h3>छ संबंधी<\/h3><p>स्वर के बाद छ → च्छ<\/p><\/div>\n<div><h3>म् संबंधी<\/h3><p>म् + स्पर्श / अंतस्थ / ऊष्म<\/p><\/div>\n<div><h3>न → ण, स → ष<\/h3><p>ऋ र ष के बाद; इ-उ आदि के बाद<\/p><\/div>\n<\/div>\n\n<h3>१. वर्ग का पहला वर्ण → तीसरा (गुरु, पृ. ७७, अंक ६७)<\/h3>\n<div class=\"def\"><b>नियम<\/b> क्, च्, ट्, प् के आगे अनुनासिक को छोड़कर कोई घोष वर्ण (स्वर, या ग घ ज झ ड ढ द ध ब भ य र ल व ह) हो, तो उनके स्थान में क्रम से अपने वर्ग का तीसरा अक्षर (ग्, ज्, ड्, ब्) हो जाता है।<\/div>\n<p class=\"eq\"><span>क्<\/span> + <span>घोष<\/span> = <b>ग्<\/b> &nbsp; <span>च्<\/span> + <span>घोष<\/span> = <b>ज्<\/b> &nbsp; <span>ट्<\/span> + <span>घोष<\/span> = <b>ड्<\/b> &nbsp; <span>प्<\/span> + <span>घोष<\/span> = <b>ब्<\/b><\/p>\n<p><b>क्यों:<\/b> अघोष के बाद घोष आए तो गले की गूँज बीच में बंद-चालू करनी पड़ती है। आसान यह है कि पहला वर्ण भी घोष हो जाए, और अपने ही वर्ग का घोष अल्पप्राण यानी तीसरा वर्ण चुना जाता है।<\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>दिग्गज<\/td><td>दिक् + गज<\/td><td>क् + ग = ग्ग<\/td><\/tr>\n<tr><td>वागीश<\/td><td>वाक् + ईश<\/td><td>क् + स्वर → ग्<\/td><\/tr>\n<tr><td>दिग्भ्रम<\/td><td>दिक् + भ्रम<\/td><td>क् + भ → ग्<\/td><\/tr>\n<tr><td>षड्रिपु<\/td><td>षट् + रिपु<\/td><td>ट् + र → ड्<\/td><\/tr>\n<tr><td>षडानन<\/td><td>षट् + आनन<\/td><td>ट् + स्वर → ड्<\/td><\/tr>\n<tr><td>अब्ज<\/td><td>अप् + ज<\/td><td>प् + ज → ब्<\/td><\/tr>\n<tr><td>अजंत<\/td><td>अच् + अंत<\/td><td>च् + स्वर → ज्<\/td><\/tr><\/table>\n<div class=\"trap\"><b>अपवाद की सीमा:<\/b> इस नियम में बाद का वर्ण <b>अनुनासिक नहीं<\/b> होना चाहिए। अगर बाद में न या म हो, तो अगला नियम (पहला → पाँचवाँ) लगता है: वाक्+मय = वाङ्मय।<\/div>\n\n<h3>२. वर्ग का पहला वर्ण → पाँचवाँ (पृ. ७७, अंक ६८)<\/h3>\n<div class=\"def\"><b>नियम<\/b> किसी वर्ग के प्रथम अक्षर के बाद कोई अनुनासिक वर्ण (न, म) हो, तो प्रथम वर्ण के बदले उसी वर्ग का अनुनासिक (पाँचवाँ) वर्ण हो जाता है।<\/div>\n<p class=\"eq\"><span>क्<\/span> + <span>न/म<\/span> = <b>ङ्<\/b> &nbsp; <span>ट्<\/span> + <span>न/म<\/span> = <b>ण्<\/b> &nbsp; <span>त्<\/span> + <span>न/म<\/span> = <b>न्<\/b> &nbsp; <span>प्<\/span> + <span>न/म<\/span> = <b>म्<\/b><\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>वाङ्मय<\/td><td>वाक् + मय<\/td><td>क् + म → ङ्<\/td><\/tr>\n<tr><td>षण्मास<\/td><td>षट् + मास<\/td><td>ट् + म → ण्<\/td><\/tr>\n<tr><td>जगन्नाथ<\/td><td>जगत् + नाथ<\/td><td>त् + न → न्<\/td><\/tr>\n<tr><td>सन्मार्ग<\/td><td>सत् + मार्ग<\/td><td>त् + म → न्<\/td><\/tr>\n<tr><td>चिन्मय<\/td><td>चित् + मय<\/td><td>त् + म → न्<\/td><\/tr>\n<tr><td>उन्मत्त<\/td><td>उत् + मत्त<\/td><td>त् + म → न्<\/td><\/tr>\n<tr><td>अम्मय<\/td><td>अप् + मय<\/td><td>प् + म → म्<\/td><\/tr><\/table>\n\n<h3>३. त्/द् संबंधी नियम (पृ. ७७-७८, अंक ६९-७१)<\/h3>\n<p>त् और द् सबसे ज़्यादा बदलते हैं। इनके बाद आने वाले वर्ण के अनुसार छह स्थितियाँ बनती हैं:<\/p>\n<table><tr><th>त्/द् के बाद<\/th><th>परिणाम<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>स्वर, ग घ द ध ब भ, य र व<\/td><td>त् → द्<\/td><td>सदानंद (सत्+आनंद), जगदीश, उद्गम, सद्धर्म, भगवद्भक्ति, तद्रूप, उद्योग<\/td><\/tr>\n<tr><td>च, छ<\/td><td>त्/द् → च्<\/td><td>उच्चारण (उत्+चारण), शरच्चंद्र (शरद्+चंद्र), महच्छत्र (महत्+छत्र)<\/td><\/tr>\n<tr><td>ज, झ<\/td><td>त्/द् → ज्<\/td><td>सज्जन (सत्+जन), उज्ज्वल (उत्+ज्वल), विपज्जाल (विपद्+जाल)<\/td><\/tr>\n<tr><td>ट, ठ<\/td><td>त्/द् → ट्<\/td><td>उट्टंकन (उत्+टंकन)<\/td><\/tr>\n<tr><td>ड, ढ<\/td><td>त्/द् → ड्<\/td><td>उड्डयन (उत्+डयन)<\/td><\/tr>\n<tr><td>ल<\/td><td>त्/द् → ल्<\/td><td>तल्लीन (तत्+लीन), उल्लास (उत्+लास)<\/td><\/tr>\n<tr><td>श<\/td><td>त् → च्, श → छ<\/td><td>सच्छास्त्र (सत्+शास्त्र), उच्छ्वास (उत्+श्वास)<\/td><\/tr>\n<tr><td>ह<\/td><td>त् → द्, ह → ध<\/td><td>उद्धार (उत्+हार), तद्धित (तत्+हित)<\/td><\/tr><\/table>\n<p><b>क्यों:<\/b> त् दंत से निकलता है। बाद में कोई घोष वर्ण हो तो त् घोष (द्) बन जाता है। बाद में तालव्य (च, छ, ज, झ, श) हो तो त् भी तालव्य (च्, ज्) बन जाता है। बाद में मूर्धन्य (ट, ठ, ड, ढ) हो तो मूर्धन्य बन जाता है। बाद में ल हो तो त् भी ल बन जाता है (ल् + ल = ल्ल)। इसे <b>पूर्ण सादृश्य<\/b> कहते हैं: पहली ध्वनि अगली के रूप में ढल जाती है। श और ह के साथ ज़रा अलग: श के साथ त् → च् और श → छ; ह के साथ त् → द् और ह → ध (क्योंकि 'ह' घोष महाप्राण है, उसका स्पर्श रूप 'ध' है)।<\/p>\n<div class=\"ex\"><b>कार्य-विधि: उच्चारण<\/b><ol class=\"steps\">\n<li>उत् + चारण। पहले पद का अंत 'त्' (व्यंजन), तो व्यंजन संधि।<\/li>\n<li>त् के बाद 'च' (तालव्य) है → त् भी च् हो जाता है।<\/li>\n<li>उच् + चारण = <b>उच्चारण<\/b>। (च् + च = च्च)।<\/li><\/ol><\/div>\n<div class=\"ex\"><b>कार्य-विधि: उद्धार<\/b><ol class=\"steps\">\n<li>उत् + हार। 'त्' के बाद 'ह'।<\/li>\n<li>त् → द् और ह → ध: उद् + धार।<\/li>\n<li>उद्धार।<\/li><\/ol><\/div>\n\n<h3>४. 'छ' संबंधी नियम (पृ. ७८, अंक ७२)<\/h3>\n<div class=\"def\"><b>नियम<\/b> छ के पहले कोई स्वर हो तो छ के बदले <b>च्छ<\/b> हो जाता है।<\/div>\n<p class=\"eq\"><span>स्वर<\/span> + <span>छ<\/span> = स्वर + <b>च्छ<\/b><\/p>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>आच्छादन<\/td><td>आ + छादन<\/td><td>आ के बाद छ → च्छ<\/td><\/tr>\n<tr><td>परिच्छेद<\/td><td>परि + छेद<\/td><td>इ के बाद छ → च्छ<\/td><\/tr>\n<tr><td>विच्छेद<\/td><td>वि + छेद<\/td><td>इ के बाद छ → च्छ<\/td><\/tr>\n<tr><td>अनुच्छेद<\/td><td>अनु + छेद<\/td><td>उ के बाद छ → च्छ<\/td><\/tr><\/table>\n<p><b>क्यों:<\/b> 'छ' महाप्राण है। स्वर के ठीक बाद अकेला छ बोलना कठिन होता है, इसलिए उसके पहले अल्पप्राण 'च्' जुड़ जाता है (च्+छ)। इसी कारण दो महाप्राण साथ नहीं आते (गुरु, पृ. ७०, अंक ५३)।<\/p>\n\n<h3>५. 'म्' संबंधी नियम (पृ. ७८, अंक ७३-७४)<\/h3>\n<p>म् का व्यवहार उसके बाद आने वाले वर्ण पर निर्भर करता है:<\/p>\n<table><tr><th>म् के बाद<\/th><th>परिणाम<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>स्पर्श वर्ण (क से म तक)<\/td><td>अनुस्वार, या उसी वर्ग का पंचमाक्षर (विकल्प)<\/td><td>संकल्प/सङ्कल्प, किंचित्, संतोष/सन्तोष, संपूर्ण/सम्पूर्ण, संगम, संबंध<\/td><\/tr>\n<tr><td>अंतस्थ (य र ल व) या ऊष्म (श ष स ह)<\/td><td>अनुस्वार (ं)<\/td><td>संयोग, संवाद, संहार, संसार, संरक्षण, किंवा<\/td><\/tr>\n<tr><td>म (वही वर्ण)<\/td><td>म् बना रहता है<\/td><td>सम्मान, सम्मति, सम्मेलन<\/td><\/tr><\/table>\n<div class=\"trap\"><b>अपवाद (गुरु, पृ. ७८):<\/b> सम्+राज = सम्राज (सम्राट्)। यहाँ म् अनुस्वार नहीं बनता। <b>याद रखें:<\/b> म् के बाद य आए तो भी अनुस्वार ही लगता है: संयोग (सम्योग नहीं)। 'संतोष' के दो रूप हैं (संतोष, सन्तोष), दोनों मान्य हैं, इसलिए विकल्प में दोनों मिल जाएँ तो प्रश्न की भाषा देखें।<\/div>\n\n<h3>६. न → ण का नियम (पृ. ७८, अंक ७५)<\/h3>\n<div class=\"def\"><b>नियम<\/b> ऋ, र या ष के बाद 'न' आए और इनके बीच में चाहे कोई स्वर, क-वर्ग, प-वर्ग, अनुस्वार, य, व, ह आ जाए, तो न का ण हो जाता है।<\/div>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>भरण<\/td><td>भर् + अन<\/td><td>र् के बाद न → ण<\/td><\/tr>\n<tr><td>भूषण<\/td><td>भूष् + अन<\/td><td>ष् के बाद न → ण<\/td><\/tr>\n<tr><td>प्रमाण<\/td><td>प्र + मान<\/td><td>र (प्र में) के बाद, बीच में म और आ; न → ण<\/td><\/tr>\n<tr><td>रामायण<\/td><td>राम + अयन<\/td><td>र के बाद बीच में आ, म, य; न → ण<\/td><\/tr>\n<tr><td>तृष्णा<\/td><td>तृष् + ना<\/td><td>ष् के बाद न → ण<\/td><\/tr>\n<tr><td>ऋण<\/td><td>ऋ + न<\/td><td>ऋ के बाद न → ण<\/td><\/tr><\/table>\n<p><b>क्यों:<\/b> ऋ, र, ष तीनों मूर्धन्य हैं। इनके बाद दंत्य न बोलने के लिए जीभ को फिर दाँतों तक आना पड़ता है। आसान यह है कि न भी मूर्धन्य बन जाए, यानी ण।<\/p>\n<div class=\"trap\"><b>ध्यान दें:<\/b> अगर र और न के बीच च-वर्ग, ट-वर्ग, त-वर्ग या श, स आ जाएँ, तो न का ण नहीं होता: अर्चन, दर्शन।<\/div>\n\n<h3>७. स → ष का नियम (पृ. ७८-७९, अंक ७६)<\/h3>\n<div class=\"def\"><b>नियम<\/b> यदि किसी शब्द के आदि के 'स' से पहले अ, आ को छोड़कर कोई स्वर आए, तो 'स' के स्थान में 'ष' हो जाता है।<\/div>\n<table><tr><th>शब्द<\/th><th>विच्छेद<\/th><th>नियम<\/th><\/tr>\n<tr><td>अभिषेक<\/td><td>अभि + सेक<\/td><td>इ के बाद स → ष<\/td><\/tr>\n<tr><td>निषिद्ध<\/td><td>नि + सिद्ध<\/td><td>इ के बाद स → ष<\/td><\/tr>\n<tr><td>विषम<\/td><td>वि + सम<\/td><td>इ के बाद स → ष<\/td><\/tr>\n<tr><td>सुषुप्ति<\/td><td>सु + सुप्ति<\/td><td>उ के बाद स → ष<\/td><\/tr>\n<tr><td>युधिष्ठिर<\/td><td>युधि + स्थिर<\/td><td>इ के बाद स → ष (और स्थ → ष्ठ)<\/td><\/tr><\/table>\n<div class=\"trap\"><b>अपवाद (गुरु, पृ. ७९):<\/b> जिस संस्कृत धातु में पहले से 'स' हो और उसके बाद ऋ या र, उससे बने शब्द का स, ऊपर के स्वरों के बाद आने पर भी, ष नहीं होता: वि+स्मरण (स्मृ धातु) = विस्मरण, अनु+सरण (सृ धातु) = अनुसरण, वि+सर्ग (सृज् धातु) = विसर्ग। <b>'युधिष्ठिर' के बारे में:<\/b> युधि+स्थिर में इ के बाद स → ष् होता है, और मूर्धन्य ष के साथ त-वर्ग का थ भी मूर्धन्य ठ बन जाता है, इसलिए स्थ → ष्ठ। यह व्यंजन संधि का सबसे प्रसिद्ध उदाहरण है, और HTET 2021 में इसे सही संधि कहा गया।<\/div>\n\n<h3>८. न् का लोप और अहन् (पृ. ७९, अंक ७७)<\/h3>\n<p>यौगिक शब्दों में अगर पहले शब्द के अंत में 'न्' हो, तो उसका लोप हो जाता है: राजन्+आज्ञा = राजाज्ञा; हस्तिन्+दंत = हस्तिदंत; प्राणिन्+मात्र = प्राणिमात्र; धनिन्+त्व = धनित्व। <b>अहन्<\/b> के आगे कोई वर्ण आए तो न् के बदले र् होता है: अहन्+गण = अहर्गण, अहन्+मुख = अहर्मुख। पर रात्रि और रूप शब्द आएँ तो न् → उ (ओ): अहन्+रात्र = अहोरात्र, अहन्+रूप = अहोरूप।<\/p>\n\n<h2>विसर्ग संधि<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> विसर्ग (ः) के साथ स्वर या व्यंजन की संधि को विसर्ग संधि कहते हैं (गुरु, पृ. ७३): तपः+वन = तपोवन, निः+अंतर = निरंतर।<\/div>\n<p><b>विसर्ग क्या है:<\/b> विसर्ग (ः) हल्की 'ह' जैसी साँस है और अकेला नहीं बोला जाता। यह प्रायः दो चीज़ों से बनता है: (१) <b>स्<\/b> से (निस्, मनस्, तेजस्, यशस्) और (२) <b>र्<\/b> से (पुनर्, अंतर्, प्रातर्)। इसीलिए संधि में विसर्ग कभी 'स्' के रूप में लौटता है (नमस्कार) और कभी 'र्' के रूप में (दुर्जन)। गुरु (पृ. ८१, अंक ८४-८५) इसे इस तरह समझाते हैं: \"अंत्य स् के बदले विसर्ग हो जाता है\" और \"अंत्य र के बदले भी विसर्ग होता है\"।<\/p>\n<div class=\"cards\">\n<div><h3>अः + घोष → ओ<\/h3><p>मनः+हर = मनोहर<\/p><\/div>\n<div><h3>इः/उः + घोष → र्<\/h3><p>निः+आशा = निराशा<\/p><\/div>\n<div><h3>च छ / ट ठ / त थ के पहले<\/h3><p>ः → श् / ष् / स्<\/p><\/div>\n<div><h3>क ख प फ के पहले<\/h3><p>ः बना रहे; या इ-उ के बाद ः → ष्<\/p><\/div>\n<div><h3>अः + अ → ओऽ<\/h3><p>प्रथमः+अध्याय = प्रथमोऽध्याय<\/p><\/div>\n<div><h3>र् के आगे र्<\/h3><p>पहला र् लुप्त, स्वर दीर्घ: नीरस<\/p><\/div>\n<\/div>\n\n<h3>१. विसर्ग के आगे च/छ, ट/ठ, त/थ (पृ. ७९, अंक ७८)<\/h3>\n<div class=\"def\"><b>नियम<\/b>
