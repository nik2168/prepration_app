ववाचक<\/td><td>बचना → बचाव; बहना → बहाव; चढ़ना → चढ़ाव; लगना → लगाव<\/td><\/tr>\n<tr><td><b>आवट<\/b><\/td><td>भाववाचक<\/td><td>लिखना → लिखावट; सजना → सजावट; थकना → थकावट; बनना → बनावट; मिलना → मिलावट<\/td><\/tr>\n<tr><td><b>आहट<\/b><\/td><td>भाववाचक (प्रायः अनुकरणवाची धातु से)<\/td><td>चिल्लाना → चिल्लाहट; घबराना → घबराहट; गुर्राना → गुर्राहट; गड़गड़ाना → गड़गड़ाहट<\/td><\/tr>\n<tr><td><b>इयल<\/b><\/td><td>कर्तृवाचक / विशेषण<\/td><td>अड़ना → अड़ियल; सड़ना → सड़ियल; मरना → मरियल; बढ़ना → बढ़ियल<\/td><\/tr>\n<tr><td>इया<\/td><td>कर्तृवाचक / गुणवाचक<\/td><td>जड़ना → जड़िया; बढ़ना → बढ़िया; घटना → घटिया<\/td><\/tr>\n<tr><td>ई<\/td><td>भाववाचक / करणवाचक<\/td><td>हँसना → हँसी; बोलना → बोली; रेतना → रेती<\/td><\/tr>\n<tr><td>ऊ<\/td><td>कर्तृ / करणवाचक<\/td><td>खाना → खाऊ; चलना → चालू; झाड़ना → झाड़ू<\/td><\/tr>\n<tr><td>एरा<\/td><td>कर्तृवाचक<\/td><td>लूटना → लुटेरा; बसना → बसेरा<\/td><\/tr>\n<tr><td>ऐया / वैया<\/td><td>कर्तृवाचक<\/td><td>काटना → कटैया; खाना → खवैया; गाना → गवैया<\/td><\/tr>\n<tr><td><b>ऐत<\/b><\/td><td>कर्तृवाचक<\/td><td>लड़ना → लड़ैत; चढ़ना → चढ़ैत; फेंकना → फिकैत<\/td><\/tr>\n<tr><td>औता, औती, औना<\/td><td>भाववाचक / विविध<\/td><td>समझाना → समझौता; मनाना → मनौती; खेलना → खिलौना; बिछाना → बिछौना<\/td><\/tr>\n<tr><td>कर, के, करके<\/td><td>पूर्वकालिक<\/td><td>देकर, जाकर, उठके, दौड़ करके<\/td><\/tr>\n<tr><td>ता, ते<\/td><td>वर्तमान / अपूर्ण क्रिया<\/td><td>जाता, आता, देखता; जाते, खोजते<\/td><\/tr>\n<tr><td>न, ना, नी<\/td><td>भाव / करण / क्रियार्थक<\/td><td>चलना → चलन; झाड़ना → झाड़न; बोलना; करना → करनी<\/td><\/tr>\n<tr><td>वाला, हार, हारा<\/td><td>कर्तृवाचक<\/td><td>जानेवाला, रोकनेवाला; मरनहार; होनहार<\/td><\/tr><\/table>\n<div class=\"trap\"><b>आवट, आहट और इयल: जो आम तौर पर गड़बड़ाते हैं।<\/b>\n<ul><li>सजावट (सज+<b>आवट<\/b>), बुनावट (बुन+आवट), तरावट (तर+आवट) में आवट है। <b>गुर्राहट<\/b> में प्रत्यय <b>आहट<\/b> है (गुर्रा + हट), आवट नहीं। इसी तरह घबराहट, चिल्लाहट, जगमगाहट, चिकनाहट, कड़वाहट: सब आहट।<\/li>\n<li><b>मरियल<\/b> में प्रत्यय <b>इयल<\/b> है (मर + इयल), \"इल\" नहीं। \"इल\" संस्कृत तद्धित है: जटिल (जट+इल), फेनिल, पंकिल, तुंदिल।<\/li>\n<li><b>फिकैत, डकैत, लड़ैत<\/b> में <b>ऐत<\/b> (हिंदी), \"एत\" नहीं।<\/li><\/ul><\/div>\n\n<h3>तद्धित प्रत्यय (संज्ञा / सर्वनाम / विशेषण से)<\/h3>\n<p>तद्धित शब्द कई तरह के अर्थ बनाते हैं: <b>भाववाचक<\/b> (गुरुता), <b>गुणवाचक<\/b> (धनवान), <b>अपत्यवाचक<\/b> (संतान: राघव), <b>संबंधवाचक<\/b> (नारदीय), <b>ऊनवाचक<\/b> (छोटापन: खटिया), <b>स्थानवाचक<\/b>, <b>समूहवाचक<\/b>, <b>क्रमवाचक<\/b> (पाँचवाँ), आदि।<\/p>\n\n<h4>संस्कृत तद्धित (गुरु पृ. ४१४-४२१)<\/h4>\n<table><tr><th>प्रत्यय<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>अ<\/td><td>अपत्य / गुण / भाव (आदि स्वर की वृद्धि)<\/td><td>रघु → राघव; कुरु → कौरव; शिव → शैव; शुचि → शौच; पुरुष → पौरुष; गुरु → गौरव; मिथुन → मैथुन<\/td><\/tr>\n<tr><td>इ<\/td><td>अपत्य (पुत्र)<\/td><td>दशरथ → दाशरथि; मरुत् → मारुति<\/td><\/tr>\n<tr><td>इक<\/td><td>जानने वाला / गुण (वृद्धि सहित)<\/td><td>वर्ष → वार्षिक; धर्म → धार्मिक; दिन → दैनिक; लोक → लौकिक; इतिहास → ऐतिहासिक; समाज → सामाजिक; अध्यात्म → आध्यात्मिक<\/td><\/tr>\n<tr><td>इत<\/td><td>गुणवाचक<\/td><td>पुष्प → पुष्पित; पल्लव → पल्लवित; आनंद → आनंदित; हर्ष → हर्षित<\/td><\/tr>\n<tr><td>इमा<\/td><td>भाववाचक<\/td><td>महत् → महिमा; गुरु → गरिमा; नील → नीलिमा; अरुण → अरुणिमा<\/td><\/tr>\n<tr><td><b>इल<\/b><\/td><td>गुणवाचक<\/td><td>जट → जटिल; फेन → फेनिल; पंक → पंकिल; तुंद → तुंदिल<\/td><\/tr>\n<tr><td>ईन<\/td><td>गुणवाचक<\/td><td>कुल → कुलीन; नव → नवीन; ग्राम → ग्रामीण<\/td><\/tr>\n<tr><td><b>ईय<\/b><\/td><td>संबंधवाचक<\/td><td>नारद → नारदीय; पाणिनि → पाणिनीय; भवत् → भवदीय; स्व → स्वकीय; राज → राजकीय<\/td><\/tr>\n<tr><td><b>एय<\/b><\/td><td>अपत्यवाचक<\/td><td>भगिनी → भागिनेय; गंगा → गांगेय; विनता → वैनतेय; राधा → राधेय<\/td><\/tr>\n<tr><td>ता, त्व<\/td><td>भाववाचक<\/td><td>गुरुता, सुंदरता; गुरुत्व, ब्राह्मणत्व, सतीत्व<\/td><\/tr>\n<tr><td>मत् / वत् (मान / वान)<\/td><td>गुणवाचक<\/td><td>श्रीमान, बुद्धिमान, आयुष्मान; धनवान, विद्यावान, गुणवान<\/td><\/tr>\n<tr><td><b>य<\/b><\/td><td>भाववाचक (वृद्धि सहित)<\/td><td>मधुर → माधुर्य; चतुर → चातुर्य; पंडित → पांडित्य; धीर → धैर्य; स्वस्थ → स्वास्थ्य; अधिपति → आधिपत्य<\/td><\/tr>\n<tr><td>र, ल, लु, व<\/td><td>गुणवाचक<\/td><td>मधु → मधुर; वत्स → वत्सल; श्याम → श्यामल; दया → दयालु; श्रद्धा → श्रद्धालु<\/td><\/tr>\n<tr><td>विन्<\/td><td>गुणवाचक<\/td><td>तपस् → तपस्वी; यशस् → यशस्वी; तेजस् → तेजस्वी; मेधा → मेधावी<\/td><\/tr><\/table>\n<div class=\"trap\"><b>\"य\" और \"एय\" एक नहीं:<\/b> \"भागिनेय\" में प्रत्यय <b>एय<\/b> है (भगिनी + एय), \"य\" नहीं (2021 का प्रश्न)। जबकि वार्धक्य = वर्धक + य, ऐश्वर्य = ईश्वर + य, वैशिष्ट्य = विशिष्ट + य में प्रत्यय <b>य<\/b> है और मूल शब्द के आदि स्वर में वृद्धि हुई है। \"सौजन्य\" (सुजन + य), \"कौमार्य\" (कुमार + य) में भी \"य\" है, \"एय\" नहीं। \"एय\" वाले: कौशेय, गांगेय, वैनतेय, भागिनेय, राधेय।<\/div>\n<div class=\"trap\"><b>\"त्य\" प्रत्यय पर सावधानी:<\/b> गुरु (पृ. ४१८) एक \"त्य\" प्रत्यय भी बताते हैं (दक्षिण → दाक्षिणात्य; पश्चात् → पाश्चात्य), पर <b>आभिजात्य<\/b> में प्रत्यय \"य\" है (अभिजात + य); \"त\" मूल शब्द अभिजात का ही हिस्सा है। यही कारण है कि \"अभिजात + त्य = आभिजात्य\" वाला विभाजन असंगत है (2020 का प्रश्न)।<\/div>\n<div class=\"ex\"><b>वृद्धि क्या है:<\/b> तद्धित प्रत्यय लगते समय मूल शब्द के पहले स्वर का रूप बढ़ जाता है: अ → आ, इ/ई → ऐ, उ/ऊ → औ। इसे वृद्धि कहते हैं: मधुर (मधुर) → माधुर्य; दिन → दैनिक; शुचि → शौच; कुमार → कौमार्य; विशिष्ट → वैशिष्ट्य। विभाजन करते समय पहले वृद्धि को वापस लौटाइए, तब मूल शब्द मिलेगा।<\/div>\n\n<h4>हिंदी तद्धित (गुरु पृ. ४३७-४४९)<\/h4>\n<table><tr><th>प्रत्यय<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>आई<\/td><td>भाववाचक<\/td><td>भला → भलाई; चतुर → चतुराई; ठाकुर → ठकुराई; पंडित → पंडिताई<\/td><\/tr>\n<tr><td>आ<\/td><td>विशेषण / स्थूलता<\/td><td>भूख → भूखा; प्यास → प्यासा; लकड़ी → लकड़ा<\/td><\/tr>\n<tr><td>आलू, आऊ<\/td><td>गुणवाचक<\/td><td>झगड़ा → झगड़ालू; दया → दयालु; घर → घराऊ<\/td><\/tr>\n<tr><td>आस, आहट<\/td><td>भाववाचक (विशेषण से)<\/td><td>मीठा → मिठास; खट्टा → खटास; कड़वा → कड़वाहट; चिकना → चिकनाहट<\/td><\/tr>\n<tr><td>इया<\/td><td>कर्तृ / ऊनवाचक / आदर-अनादर<\/td><td>मुख → मुखिया; खाट → खटिया; बेटी → बिटिया<\/td><\/tr>\n<tr><td>ई<\/td><td>विशेषण / भाव / ऊनवाचक<\/td><td>देश → देशी; भार → भारी; चोर → चोरी; पहाड़ → पहाड़ी; ढोलक → ढोलकी<\/td><\/tr>\n<tr><td>ईला<\/td><td>गुणवाचक<\/td><td>रंग → रँगीला; छबि → छबीला; लाज → लजीला; जहर → जहरीला<\/td><\/tr>\n<tr><td>एरा<\/td><td>व्यापार / संबंध<\/td><td>साँप → सँपेरा; चाचा → चचेरा; मामा → ममेरा; फूफा → फुफेरा<\/td><\/tr>\n<tr><td>ऐत<\/td><td>व्यवसाय<\/td><td>लट्ठ → लठैत; डाका → डकैत; दंगा → दंगैत<\/td><\/tr>\n<tr><td>पन, पा<\/td><td>भाववाचक<\/td><td>काला → कालापन; बचपन; पागलपन; बूढ़ा → बुढ़ापा; मोटापा<\/td><\/tr>\n<tr><td>वाला, हारा, हार<\/td><td>करने / रखने वाला<\/td><td>टोपीवाला; गाड़ीवाला; लकड़हारा; पनहारा<\/td><\/tr>\n<tr><td>वाँ, था, सरा<\/td><td>क्रमवाचक<\/td><td>पाँचवाँ, छठवाँ, दसवाँ; चौथा; दूसरा, तीसरा<\/td><\/tr>\n<tr><td>ला, ली, री<\/td><td>गुणवाचक / ऊनवाचक<\/td><td>आगे → अगला; पीछे → पिछला; खाज → खुजली; कोठा → कोठरी<\/td><\/tr><\/table>\n\n<h3>उर्दू (फ़ारसी/अरबी) प्रत्यय (गुरु पृ. ४४९-४५६)<\/h3>\n<p>गुरु (अं. ४३७, पृ. ४४९) के अनुसार उर्दू यौगिक शब्द भी कृदंत और तद्धित, दो प्रकार के हैं। नीचे के प्रत्यय <b>विदेशी (विदेशज)<\/b> हैं, इसलिए ऐसे शब्दों पर \"विदेशी प्रत्यय\" का लेबल लगता है (2023 का प्रश्न)।<\/p>\n<table><tr><th>प्रत्यय<\/th><th>अर्थ<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td><b>खोर<\/b><\/td><td>खाने वाला<\/td><td>सूदखोर, हरामखोर, चुग़लख़ोर, रिश्वतखोर (रिश्वत + ख़ोर)<\/td><\/tr>\n<tr><td><b>गार<\/b><\/td><td>कर्तृवाचक<\/td><td>मददगार, यादगार, ख़िदमतगार, गुनाहगार; रोज़गार (रोज़ + गार)<\/td><\/tr>\n<tr><td>दार<\/td><td>रखने वाला<\/td><td>ज़मींदार, दुकानदार, चोबदार, मालदार; हिंदी में भी: चमकदार, थानेदार<\/td><\/tr>\n<tr><td>गर, कार<\/td><td>कर्तृवाचक<\/td><td>सौदागर, कारीगर; पेशकार, काश्तकार, सलाहकार<\/td><\/tr>\n<tr><td>बाज़<\/td><td>खेलने / करने वाला<\/td><td>दग़ाबाज़, नशेबाज़, चालबाज़, धोखेबाज़<\/td><\/tr>\n<tr><td>दान, खाना, गाह<\/td><td>पात्र / स्थान<\/td><td>कलमदान, पानदान; कारख़ाना, दवाख़ाना; ईदगाह, चरागाह<\/td><\/tr>\n<tr><td>इस्तान, आबाद<\/td><td>स्थानवाचक<\/td><td>हिंदुस्तान, अफ़ग़ानिस्तान; हैदराबाद, इलाहाबाद<\/td><\/tr>\n<tr><td>ई<\/td><td>भाववाचक<\/td><td>ख़ुशी, नेकी, बदी, सियाही; दोस्ती, दुश्मनी, दलाली<\/td><\/tr>\n<tr><td>आना, नाक, मंद<\/td><td>विविध<\/td><td>जुर्माना, नज़राना, मर्दाना; दर्दनाक, ख़ौफ़नाक; अक़्लमंद, दौलतमंद<\/td><\/tr>\n<tr><td>नामा, नवीस, बंद, पोश, साज़, बीन<\/td><td>लेखन / बंधन / धारण<\/td><td>इकरारनामा; अर्ज़ीनवीस; कमरबंद; सफ़ेदपोश; जालसाज़; ख़ुर्दबीन, दूरबीन<\/td><\/tr><\/table>\n<p>इनके बरक्स <b>पल्लवित<\/b> (संस्कृत इत), <b>नीलिमा<\/b> (संस्कृत इमा), <b>अड़ियल<\/b> (हिंदी इयल), <b>कसावट<\/b> (हिंदी आवट), <b>झगड़ालू<\/b> (हिंदी आलू), <b>हठीला<\/b> (हिंदी ईला) संस्कृत या हिंदी के प्रत्यय हैं।<\/p>\n\n<h2>पहचान की विधि<\/h2>\n<h3>उपसर्ग वाले प्रश्न<\/h3>\n<ol class=\"steps\">\n<li><b>शब्द के शुरू का अंश अलग करें।<\/b> जाँचें कि बाक़ी हिस्सा सार्थक शब्द है या नहीं: अनीति में \"नीति\" सार्थक है, इसलिए अ + नीति।<\/li>\n<li><b>सन्धि वापस लौटाएँ।<\/b> अगर शब्द के बीच य, व, च्छ, ष, श्श, र जैसे वर्ण हैं तो सन्धि हुई है (अत्यंत → अति+अंत; निश्चल → निस्+चल)।<\/li>\n<li><b>उपसर्ग की सूची से मिलान करें:<\/b> मिलाने पर जो उपसर्ग सूची में है और जिसका अर्थ शब्द में बैठता है, वही सही।<\/li>\n<li><b>एक से अधिक उपसर्ग?<\/b> मूल धातु तक पहुँचें: व्याधि (वि + आ + धि), प्रत्युपकार (प्रति + उप + कार), निराकरण (निर् + आ + करण)।<\/li>\n<li><b>वृद्धि से भ्रम न खाएँ:<\/b> आधुनिक (अधुना + इक), आधिकारिक (अधिकार + इक), आरण्यक (अरण्य + क) में \"आ\" उपसर्ग नहीं, वृद्धि का \"आ\" है। जबकि आलम्बित = आ + लम्बित, आगमन = आ + गमन में उपसर्ग है।<\/li>\n<li><b>\"अ\" बनाम \"अन्\":<\/b> आगे व्यंजन तो \"अ\", आगे स्वर तो \"अन्\"। हिंदी के अनबन, अनमेल अपवाद हैं।<\/li><\/ol>\n<h3>प्रत्यय वाले प्रश्न (मूल + प्रत्यय में बाँटना)<\/h3>\n<ol class=\"steps\">\n<li><b>अंत से तोड़ें।<\/b> शब्द के अंतिम अक्षर-समूह को प्रत्यय मानकर हटाएँ और देखें कि बाक़ी हिस्सा सार्थक है: सजावट → सज + आवट; गुर्राहट → गुर्रा + हट (आहट)।<\/li>\n<li><b>सबसे लंबा प्रत्यय लें।<\/b> मरियल में \"इल\" नहीं, \"इयल\"; फिकैत में \"एत\" नहीं, \"ऐत\"; पाणिनीय में \"ईय\", सिर्फ़ \"य\" नहीं।<\/li>\n<li><b>वृद्धि / गुण को पलटें।<\/b> राघव (रा → र) = रघु + अ; वार्धक्य (वा → व) = वर्धक + य; दैनिक = दिन + इक।<\/li>\n<li><b>कृत् या तद्धित?<\/b> बाक़ी बचा मूल अगर <b>क्रिया की धातु<\/b> है (लिख, चल, सज) तो कृत्; अगर <b>संज्ञा / विशेषण<\/b> है (सुंदर, पंडित, वर्ष) तो तद्धित।<\/li>\n<li><b>भाषा देखें।<\/b> फ़ारसी/अरबी का पहचानने का तरीक़ा: खोर, गार, दार, बाज़, गर, कार, आना, ई (ख़ुशी), नामा। इन्हें \"विदेशी\" कहा जाता है।<\/li>\n<li><b>अर्थ से पुष्टि करें:<\/b> भाववाचक (भाव), कर्तृवाचक (करने वाला), अपत्यवाचक (संतान), गुणवाचक (वाला/युक्त)।<\/li><\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table><tr><th>जोड़ा<\/th><th>भेद कैसे करें<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>इल / इयल<\/td><td>इल: संस्कृत तद्धित; इयल: हिंदी कृत् (धातु + इयल)<\/td><td>जटिल, फेनिल / मरियल, अड़ियल<\/td><\/tr>\n<tr><td>आवट / आहट<\/td><td>शब्द के अंत में \"वट\" या \"हट\" देखें<\/td><td>सजावट, बनावट / गुर्राहट, घबराहट<\/td><\/tr>\n<tr><td>य / एय<\/td><td>एय: अपत्यवाचक (संतान); य: भाववाचक<\/td><td>भागिनेय, गांगेय / माधुर्य, वार्धक्य<\/td><\/tr>\n<tr><td>ऐत / एत<\/td><td>हिंदी कृत् \"ऐत\" होता है<\/td><td>लड़ैत, फिकैत, डकैत<\/td><\/tr>\n<tr><td>अनीय / ईय<\/td><td>अनीय कृत् (धातु); ईय तद्धित (संज्ञा)<\/td><td>दर्शनीय, माननीय / नारदीय, पाणिनीय<\/td><\/tr>\n<tr><td>अ / अन् (उपसर्ग)<\/td><td>व्यंजन से पहले \"अ\"; स्वर से पहले \"अन्\"<\/td><td>अनीति / अनंतर, अनिष्ट, अनाचार<\/td><\/tr>\n<tr><td>अप / अ<\/td><td>अप = बुरा, विरुद्ध; अ = नहीं<\/td><td>अपमान, अपहरण / अपरोक्ष, अपरिग्रह<\/td><\/tr>\n<tr><td>आ उपसर्ग / वृद्धि का आ<\/td><td>आ+शब्द सार्थक हो तो उपसर्ग; मूल से वृद्धि हुई हो तो नहीं<\/td><td>आगमन, आलम्बित / आधुनिक, आधिकारिक<\/td><\/tr>\n<tr><td>निस् / निर् / निः<\/td><td>एक ही उपसर्ग के रूप, आगे के वर्ण से तय<\/td><td>निश्चल, निष्पक्ष, निर्भय, निःसंदेह<\/td><\/tr>\n<tr><td>कृत् / तद्धित<\/td><td>धातु से जुड़े तो कृत्, संज्ञा-विशेषण से जुड़े तो तद्धित<\/td><td>लेखक (लिख+अक) / वार्षिक (वर्ष+इक)<\/td><\/tr><\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2020 Q34<\/h3>\n<p>किस विकल्प में 'इल' प्रत्यय का प्रयोग <b>नहीं<\/b> हुआ है? (A) उर्मिल (B) मरियल (C) फेनिल (D) जटिल<\/p>\n<div class=\"ex\"><b>उत्तर: (B)।<\/b> हल: (C) फेनिल = फेन + इल, (D) जटिल = जट + इल (दोनों गुरु पृ. ४१७ के उदाहरण)। (A) उर्मिल में \"इल\" माना गया है (यह शब्द गुरु में नहीं मिला)। (B) मरियल = मर + <b>इयल<\/b> (हिंदी कृत् प्रत्यय, गुरु पृ. ४३०-४३१): यहाँ \"इल\" नहीं, इसलिए उत्तर (B)।<\/div>\n\n<h3>HTET 2020 Q44<\/h3>\n<p>प्रत्यय की दृष्टि से <b>असंगत<\/b> विकल्प: (A) गृहस्थ + इक = गार्हस्थिक (B) दिष्ट + इक = दैष्टिक (C) अभिजात + त्य = आभिजात्य (D) पाणिनि + ईय = पाणिनीय<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> हल: (A) और (B): इक (वृद्धि: गृ→गा, दि→दै), सही (गुरु पृ. ४१५)। (D) पाणिनि + ईय, सही (गुरु का उदाहरण, पृ. ४१७)। (C) आभिजात्य में प्रत्यय \"य\" है (अभिजात + य, आदि स्वर में वृद्धि), \"त्य\" नहीं; \"त\" तो अभिजात का ही हिस्सा है। इसलिए (C) असंगत।<\/div>\n\n<h3>HTET 2020 Q45<\/h3>\n<p>किस विकल्प में 'आ' उपसर्ग का प्रयोग हुआ है? (A) आधिकारिक (B) आधुनिक (C) आलम्बित (D) आरण्यक<\/p>\n<div class=\"ex\"><b>नियम से उत्तर: (C)।<\/b> हल: आलम्बित = आ + लम्बित (उपसर्ग आ, जैसे आकर्षण, आगमन; गुरु पृ. ४००)। (A) आधिकारिक = अधिकार + इक (वृद्धि), (B) आधुनिक = अधुना + इक (वृद्धि), (D) आरण्यक = अरण्य + क (वृद्धि): तीनों में \"आ\" उपसर्ग नहीं, वृद्धि का \"आ\" है।<\/div>\n<div class=\"trap\"><b>कुंजी संदिग्ध है।<\/b> हमारे डेटा में उत्तर (B) दर्ज है, पर आधुनिक में आ उपसर्ग नहीं है (अधुना + इक), इसलिए नियम के अनुसार सही विकल्प (C) बनता है। परीक्षा में आप वही चुनें जो नियम से सिद्ध हो; और 2024 Q40 में भी यही बात आई है (\"आरण्यक, आवश्यक, आधुनिक: आ उपसर्ग\" को ग़लत बताया गया)।<\/div>\n\n<h3>HTET 2021 Q36<\/h3>\n<p>प्रत्यय की दृष्टि से <b>असुमेलित<\/b> विकल्प: (A) भागिनेय = भगिनी + य (B) वार्धक्य = वर्धक + य (C) ऐश्वर्य = ईश्वर + य (D) वैशिष्ट्य = विशिष्ट + य<\/p>\n<div class=\"ex\"><b>उत्तर: (A)।<\/b> हल: (B), (C), (D) में प्रत्यय \"य\" ही है (भाववाचक तद्धित: माधुर्य, चातुर्य जैसे, गुरु पृ. ४२०)। (A) भागिनेय में प्रत्यय \"एय\" है (भगिनी + एय, अपत्यवाचक; गुरु पृ. ४१७), \"य\" नहीं। इसलिए (A) असुमेलित।<\/div>\n\n<h3>HTET 2021 Q37<\/h3>\n<p>उपसर्ग से निर्मित शब्दों के संदर्भ में <b>असंगत<\/b> विकल्प: (A) परि: पर्यंक, पारिभाषिक, पर्युषण (B) अति: अत्युक्ति, अतीत, अत्यावश्यक (C) अन: अनसूया, अनधिकार, अनशन (D) प्रति: प्रत्यर्पण, प्रतीक्षा, प्रतीक<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> हल: (A) पर्यंक = परि+अंक, पर्युषण = परि+उषण; (B) अत्युक्ति = अति+उक्ति, अतीत = अति+इत, अत्यावश्यक = अति+आवश्यक; (D) प्रत्यर्पण = प्रति+अर्पण, प्रतीक्षा = प्रति+ईक्षा, प्रतीक = प्रति+इक। इन तीनों में शीर्षक संस्कृत की सूची का मान्य उपसर्ग है (परि, अति, प्रति)। (C) का शीर्षक \"अन\" है: संस्कृत उपसर्ग-सूची में \"अन\" नहीं, उपसर्ग \"अ\" है, जो स्वर के पहले \"अन्\" बन जाता है (अनधिकार = अन्+अधिकार, अनशन = अन्+अशन; गुरु पृ. ४०१)। इसलिए (C) असंगत।<\/div>\n<div class=\"trap\"><b>टिप्पणी:<\/b> पारिभाषिक में \"परि\" प्रत्यक्ष नहीं दिखता: वह परिभाषा + इक है, वृद्धि से \"पा\" बना। फिर भी कुंजी (C) की है। गुरु के हिंदी उपसर्गों में \"अन\" व्यंजन से पहले भी आता है (अनबन, अनमेल), पर वह हिंदी उपसर्ग है, संस्कृत उपसर्ग नहीं।<\/div>\n\n<h3>HTET 2022 Q37<\/h3>\n<p>किस शब्द में एक से अधिक उपसर्गों का प्रयोग हुआ है? (A) अध्यापक (B) अन्वेषण (C) अनुष्ठान (D) व्याधि<\/p>\n<div class=\"ex\"><b>उत्तर: (D)।<\/b> हल: (A) अध्यापक = अधि + आपक (उपसर्ग एक: अधि); (B) अन्वेषण = अनु + एषण (एक: अनु); (C) अनुष्ठान = अनु + स्थान (एक: अनु; स्+थ → ष्ठ); (D) व्याधि = वि + आ + धि: <b>दो उपसर्ग<\/b> (वि और आ)। गुरु (अं. ४३४, पृ. ४०१) ऐसे शब्दों के उदाहरण देते हैं: निराकरण, प्रत्युपकार, समालोचना।<\/div>\n\n<h3>HTET 2022 Q42<\/h3>\n<p>किस शब्द में 'आवट' प्रत्यय का प्रयोग <b>नहीं<\/b> हुआ है? (A) गुर्राहट (B) सजावट (C) बुनावट (D) तरावट<\/p>\n<div class=\"ex\"><b>उत्तर: (A)।<\/b> हल: सजावट = सज + आवट, बुनावट = बुन + आवट, तरावट = तर + आवट (गुरु पृ. ४३० की सूची: लिखावट, सजावट, बनावट...)। गुर्राहट = गुर्रा + <b>आहट<\/b> (गुरु पृ. ४३० में \"गुर्राना → गुर्राहट\"), इसलिए आवट नहीं।<\/div>\n\n<h3>HTET 2023 Q36<\/h3>\n<p>किस विकल्प का शब्द 'अन्' उपसर्ग से निर्मित <b>नहीं<\/b> है? (A) अनंतर (B) अनीति (C) अनिष्ट (D) अनाचार<\/p>\n<div class=\"ex\"><b>उत्तर: (B)।<\/b> हल: अ+न्=अन् तभी बनता है जब आगे <b>स्वर<\/b> हो (गुरु पृ. ४०१)। अनंतर = अन्+अंतर, अनिष्ट = अन्+इष्ट, अनाचार = अन्+आचार: तीनों में आगे स्वर। अनीति = <b>अ<\/b> + नीति: आगे \"न\" व्यंजन है, इसलिए \"अ\" उपसर्ग, \"अन्\" नहीं।<\/div>\n\n<h3>HTET 2023 Q37<\/h3>\n<p>किस विकल्प के शब्द विदेशज प्रत्ययों से निर्मित हैं? (A) पल्लवित, नीलिमा (B) अड़ियल, कसावट (C) रिश्वतखोर, रोज़गार (D) झगड़ालू, हठीला<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> हल: (A) पल्लवित (इत), नीलिमा (इमा): संस्कृत। (B) अड़ियल (इयल), कसावट (आवट): हिंदी। (D) झगड़ालू (आलू), हठीला (ईला): हिंदी। (C) रिश्वतखोर = रिश्वत + <b>खोर<\/b> (फ़ारसी, गुरु पृ. ४५५) और रोज़गार = रोज़ + <b>गार<\/b> (फ़ारसी, पृ. ४५२): दोनों विदेशी प्रत्यय।<\/div>\n\n<h3>HTET 2024 Q37<\/h3>\n<p>प्रत्यय की दृष्टि से <b>संगत<\/b> विभाजन चुनिए: (A) मैथुन, शौच, राघव: 'अ' प्रत्यय (B) फिकैत, डकैत, लड़ैत: 'एत' प्रत्यय (C) नारदीय, स्थानीय, मानवीय: 'अनीय' प्रत्यय (D) कौशेय, सौजन्य, कौमार्य: 'एय' प्रत्यय<\/p>\n<div class=\"ex\"><b>उत्तर: (A)।<\/b> हल: (A) मैथुन = मिथुन + अ, शौच = शुचि + अ, राघव = रघु + अ (गुरु पृ. ४१४-४१५): तीनों में वृद्धि सहित \"अ\", सही। (B) प्रत्यय \"ऐत\" है, \"एत\" नहीं (गुरु पृ. ४३२)। (C) प्रत्यय \"ईय\" है (नारद+ईय, स्थान+ईय, मानव+ईय), \"अनीय\" नहीं। (D) कौशेय में \"एय\" है, पर सौजन्य (सुजन+य) और कौमार्य (कुमार+य) में \"य\"।<\/div>\n\n<h3>HTET 2024 Q40<\/h3>\n<p>किस विकल्प में उपसर्ग-विभाजन नियमानुसार है? (A) अपरिग्रह, अपरोक्ष, अपर्ण: 'अप' (B) आरण्यक, आवश्यक, आधुनिक: 'आ' (C) निश्शुल्क, निष्पक्ष, निस्स्वार्थ: 'निस्' (D) व्याधि, वीक्षण, व्यतिरेक: 'वी'<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> हल: (A) अपरिग्रह = अ+परिग्रह, अपरोक्ष = अ+परोक्ष, अपर्ण = अ+पर्ण: उपसर्ग \"अ\", \"अप\" नहीं। (B) तीनों वृद्धि वाले तद्धित शब्द हैं (अरण्य+क, अवश्य+क, अधुना+इक): \"आ\" उपसर्ग नहीं। (D) व्याधि = वि+आ+धि, वीक्षण = वि+ईक्षण, व्यतिरेक = वि+अति+रेक: उपसर्ग \"वि\", \"वी\" नहीं। (C) निश्शुल्क = निस्+शुल्क, निष्पक्ष = निस्+पक्ष, निस्स्वार्थ = निस्+स्वार्थ: तीनों में \"निस्\", इसलिए सही। (गुरु पृ. ७९-८०: निः+संदेह = निस्संदेह, निः+पक्ष = निष्पक्ष)<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>उपसर्ग शब्द के <b>पहले<\/b> जुड़कर अर्थ बदलता है (प्र+हार = प्रहार, आ+हार = आहार); प्रत्यय <b>बाद<\/b> में जुड़ता है।<\/li>\n<li>गुरु की सूची के संस्कृत उपसर्ग: अति, अधि, अनु, अप, अभि, अव, आ, उत्, उप, दुर्/दुस्, नि, निर्/निस्, परा, परि, प्र, प्रति, वि, सम्, सु।<\/li>\n<li>एक शब्द में दो-तीन उपसर्ग: व्याधि (वि+आ+धि), प्रत्युपकार (प्रति+उप+कार), निराकरण (निर्+आ+करण)।<\/li>\n<li>\"अ\" व्यंजन से पहले, \"अन्\" स्वर से पहले (अनीति बनाम अनंतर, अनिष्ट, अनाचार)। हिंदी अनबन, अनमेल अपवाद।<\/li>\n<li>सन्धि के बाद उपसर्ग का रूप बदलता है: अति→अत्य-, प्रति→प्रत्य-, उत्+ल→उल्-, निस्+पक्ष→निष्पक्ष, निस्+शुल्क→निश्शुल्क।<\/li>\n<li>वृद्धि वाले शब्द (आधुनिक, आरण्यक, आधिकारिक) में \"आ\" उपसर्ग नहीं; आलम्बित, आगमन में है।<\/li>\n<li>प्रत्यय दो तरह के: कृत् (धातु से: लेखक, सजावट) और तद्धित (संज्ञा-विशेषण से: वार्षिक, सुंदरता)।<\/li>\n<li>सबसे आम गड़बड़ियाँ: मरियल = इयल (इल नहीं); गुर्राहट = आहट (आवट नहीं); फिकैत = ऐत; भागिनेय = एय (य नहीं); नारदीय = ईय (अनीय नहीं); आभिजात्य = अभिजात+य।<\/li>\n<li>विदेशी प्रत्यय: खोर, गार, दार, बाज़, गर, कार, नामा, आना, नाक, मंद, ई (ख़ुशी)।<\/li>\n<li>विभाजन करते समय पहले वृद्धि/सन्धि पलटें, फिर सबसे लंबा प्रत्यय अलग करें।<\/li><\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: 'आलम्बित' में कौन-सा उपसर्ग है? (A) अल् (B) आ (C) आल (D) अम्<\/summary><p><b>उत्तर: (B)<\/b> आ + लम्बित।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: 'रिश्वतखोर' में प्रत्यय: (A) संस्कृत (B) हिंदी (C) विदेशी (D) कृत्<\/summary><p><b>उत्तर: (C)<\/b> \"खोर\" फ़ारसी प्रत्यय है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: 'व्याधि' में उपसर्ग हैं: (A) केवल वि (B) केवल व्य (C) वि और आ (D) कोई नहीं<\/summary><p><b>उत्तर: (C)<\/b> वि + आ + धि।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: 'मरियल' में प्रत्यय: (A) इल (B) इयल (C) अल (D) एल<\/summary><p><b>उत्तर: (B)<\/b> मर + इयल (हिंदी कृत्)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: 'निष्पक्ष' में उपसर्ग: (A) निः (B) नि (C) निस् (D) निर्<\/summary><p><b>उत्तर: (C)<\/b> निस् + पक्ष; स् → ष् (इ के बाद, प से पहले)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: 'प्रत्यक्ष' का सही विच्छेद: (A) प्र + त्यक्ष (B) प्रति + अक्ष (C) प्रत्य + क्ष (D) प्र + अक्ष<\/summary><p><b>उत्तर: (B)<\/b> प्रति + अक्ष (आँख के सामने); इ + अ = य् (यण), और अक्षि → अक्ष (गुरु पृ. ४६६)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: 'सजावट' और 'घबराहट' के प्रत्यय क्रम से: (A) आहट, आवट (B) आवट, आहट (C) आवट, आवट (D) हट, वट<\/summary><p><b>उत्तर: (B)<\/b> सज + आवट; घबरा + आहट।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: निम्न में से किसमें 'ईय' प्रत्यय है? (A) दर्शनीय (B) माननीय (C) पाणिनीय (D) रमणीय<\/summary><p><b>उत्तर: (C)<\/b> पाणिनि + ईय। बाक़ी तीन में \"अनीय\" (दृश्+अनीय, मन्+अनीय, रम्+अनीय) कृत् प्रत्यय है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: 'अनायास' में उपसर्ग है: (A) अ (B) अन् (C) अना (D) आ<\/summary><p><b>उत्तर: (B)<\/b> अन् + आयास; आगे स्वर \"आ\" है, इसलिए \"अन्\" (गुरु पृ. ४०१)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: किस शब्द में 'वृद्धि' के साथ तद्धित प्रत्यय लगा है? (A) लेखक (B) दैनिक (C) चलन (D) पढ़ाई<\/summary><p><b>उत्तर: (B)<\/b> दिन + इक = दैनिक (इ → ऐ)। लेखक, चलन, पढ़ाई कृत् प्रत्यय वाले हैं (धातु से)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 11: 'बेईमान' और 'नादान' में उपसर्ग क्रम से: (A) बे, ना (B) बे, न (C) बि, ना (D) ब, ना<\/summary><p><b>उत्तर: (A)<\/b> बे + ईमान; ना + दान (दान = जानने वाला, फ़ारसी \"दाना\")। दोनों उर्दू उपसर्ग (गुरु पृ. ४०५)।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामता प्रसाद गुरु, हिंदी व्याकरण (नागरी प्रचारिणी सभा): शब्द-रचना और उपसर्ग <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३९६\">पृ. ३९६-३९८<\/a> (अं. ४३०-४३२), संस्कृत उपसर्ग <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३९९\">३९९-४०३<\/a> (अं. ४३३-४३५), हिंदी-उर्दू उपसर्ग <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४०३\">४०३-४०६<\/a>, संस्कृत कृत् <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४०७\">४०७-४१४<\/a>, संस्कृत तद्धित <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४१४\">४१४-४२२<\/a>, हिंदी कृत् <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४२६\">४२६-४३७<\/a>, हिंदी तद्धित <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४३७\">४३७-४४९<\/a>, उर्दू प्रत्यय <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४४९\">४४९-४५६<\/a>; सन्धि के नियम <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/७३\">पृ. ७३-८१<\/a> (अं. ५९-८५); समास में सन्धि <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४६३\">पृ. ४६३<\/a>। पृष्ठ-संख्या विकिस्रोत की स्कैन-पृष्ठ संख्या है (लिंक में वही)। पिछले HTET प्रश्न (2020–24)। गुरु में न मिलने वाले शब्द, जिनका विश्लेषण स्कूली चलन और नियमों से किया गया: मरियल के सिवा उर्मिल, आभिजात्य, वार्धक्य, वैशिष्ट्य, ऐश्वर्य, सौजन्य, कौमार्य, कौशेय, मैथुन, आधिकारिक, आधुनिक, आरण्यक, निश्शुल्क, निस्स्वार्थ, अध्यापक, अनसूया, पारिभाषिक, पर्यंक, पर्युषण, गुर्राहट का \"आहट\" वर्ग (गुरु पृ. ४३० में गुर्राना → गुर्राहट मिलता है)।<\/p>\n","hin-noun":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2020 से 2023 तक हर साल संज्ञा से 1 प्रश्न, यानी कुल 4। चारों प्रश्न संज्ञा के भेद पहचानने या भाववाचक संज्ञा बनाने से जुड़े हैं: भाववाचक का जातिवाचक की तरह प्रयोग (2020), सर्वनाम और अव्यय से बनी भाववाचक संज्ञा तथा विशेषण से उसका अंतर (2021), 'धोखा' जैसी भाववाचक संज्ञा (2022) और वाक्य में व्यक्तिवाचक संज्ञाएँ पहचानना (2023)। लिंग, वचन और कारक पर अभी सीधा प्रश्न नहीं आया, पर ये व्याकरण-खंड के बुनियादी विषय हैं और संज्ञा के प्रश्नों को हल करने में भी काम आते हैं। इसलिए यह पृष्ठ चारों को पूरा पढ़ाता है।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> किसी व्यक्ति, स्थान, वस्तु, प्राणी, गुण, अवस्था या काम के नाम को <b>संज्ञा<\/b> कहते हैं। जैसे: राम, दिल्ली, नदी, किताब, मिठास, बुढ़ापा, दौड़।<\/div>\n<p>कामताप्रसाद गुरु की परिभाषा: \"संज्ञा उस विकारी शब्द को कहते हैं जिससे प्रकृत किंवा कल्पित सृष्टि की किसी वस्तु का नाम सूचित हो\" (पृ. ९४)। इसमें तीन बातें ध्यान देने की हैं।<\/p>\n<ul>\n<li><b>विकारी शब्द:<\/b> जिस शब्द का रूप लिंग, वचन और कारक के कारण बदल सकता है। संज्ञा विकारी है: लड़का, लड़की, लड़के, लड़कों को।<\/li>\n<li><b>प्रकृत किंवा कल्पित सृष्टि:<\/b> जो सचमुच है (पहाड़) और जो केवल कल्पना में है (भूत, परी, देवता) दोनों के नाम संज्ञा हैं।<\/li>\n<li><b>वस्तु का नाम:<\/b> यहाँ 'वस्तु' बहुत व्यापक अर्थ में है। इसमें प्राणी और पदार्थ ही नहीं, उनके धर्म (गुण, भाव) भी आते हैं। गुरु कहते हैं कि संज्ञा 'वस्तु' नहीं, वस्तु का <i>नाम<\/i> है: जिस कागज़ पर किताब छपी है वह पदार्थ है, पर 'कागज़' शब्द संज्ञा है (पृ. ९५–९६)।<\/li>\n<\/ul>\n<p><b>रोज़ की मिसाल:<\/b> कक्षा में हाज़िरी बोलते समय शिक्षक 'रोहित' कहता है तो एक ही बच्चा खड़ा होता है। 'बच्चा' कहे तो सब खड़े हो सकते हैं। 'शरारत' कहे तो किसी बच्चे की नहीं, एक भाव की बात होती है। ये तीनों नाम तीन अलग तरह की संज्ञाएँ हैं: व्यक्तिवाचक, जातिवाचक, भाववाचक।<\/p>\n\n<h2>मूल अवधारणा: संज्ञा की तीन परतें<\/h2>\n<p>गुरु संज्ञा को दो आधारों पर बाँटते हैं (पृ. १०३ की टिप्पणी)। पहले यह देखिए कि शब्द <b>वस्तु<\/b> बताता है या उसका <b>धर्म<\/b>। वस्तु बताए तो <b>पदार्थवाचक<\/b>, धर्म बताए तो <b>भाववाचक<\/b> (पृ. ९६)। फिर पदार्थवाचक में देखिए कि शब्द <b>अकेली वस्तु<\/b> बताता है या <b>पूरी जाति<\/b>। अकेली बताए तो <b>व्यक्तिवाचक<\/b>, पूरी जाति बताए तो <b>जातिवाचक<\/b> (पृ. ९६)। इस तरह गुरु के तीन मुख्य भेद बनते हैं: व्यक्तिवाचक, जातिवाचक, भाववाचक।<\/p>\n<p>स्कूली पाठ्यपुस्तकों में पाँच भेद पढ़ाए जाते हैं और HTET के विकल्पों में 'समुदायवाचक' तक आ जाता है (2022 Q35 के विकल्प देखिए)। इसलिए पाँचों जानना ज़रूरी है।<\/p>\n<div class=\"cards\">\n<div><h3>व्यक्तिवाचक<\/h3><p>एक ही व्यक्ति, स्थान या वस्तु का नाम<\/p><p class=\"eq\"><span>राम<\/span> <span>काशी<\/span> <span>गंगा<\/span><\/p><\/div>\n<div><h3>जातिवाचक<\/h3><p>पूरी जाति या वर्ग का बोध<\/p><p class=\"eq\"><span>मनुष्य<\/span> <span>नदी<\/span> <span>पहाड़<\/span><\/p><\/div>\n<div><h3>भाववाचक<\/h3><p>गुण, अवस्था या व्यापार का बोध<\/p><p class=\"eq\"><span>मिठास<\/span> <span>नींद<\/span> <span>चढ़ाई<\/span><\/p><\/div>\n<div><h3>समुदायवाचक<\/h3><p>व्यक्तियों या वस्तुओं के समूह का बोध<\/p><p class=\"eq\"><span>सभा<\/span> <span>भीड़<\/span> <span>दल<\/span><\/p><\/div>\n<div><h3>द्रव्यवाचक<\/h3><p>नापे-तौले जाने वाले पदार्थ का बोध<\/p><p class=\"eq\"><span>सोना<\/span> <span>घी<\/span> <span>शक्कर<\/span><\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>गुरु बनाम स्कूली पुस्तकें:<\/b> गुरु मुख्य भेद तीन ही मानते हैं (पृ. १०३) और कहते हैं कि समुदायवाचक का समावेश व्यक्तिवाचक और जातिवाचक में, तथा द्रव्यवाचक का जातिवाचक में हो जाता है (पृ. १०४)। परीक्षा में स्कूली पाँच भेद चलते हैं, इसलिए पाँचों याद रखिए। यदि विकल्प में केवल तीन-चार भेद हों और 'सभा' या 'सोना' जैसा शब्द हो, तो विकल्प देखकर उत्तर चुनिए।<\/div>\n\n<h2>व्यक्तिवाचक संज्ञा<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिस संज्ञा से एक ही व्यक्ति, एक ही वस्तु या एक ही समूह का बोध हो, वह व्यक्तिवाचक है। (गुरु, पृ. ९६)<\/div>\n<ul>\n<li><b>किसके नाम:<\/b> व्यक्ति (राम, गांधी), स्थान (काशी, भारत, हिमालय), नदी (गंगा), ग्रंथ (रामायण), संस्था (नागरी प्रचारिणी सभा), दिन-महीने (सोमवार, चैत) और पर्व (दीवाली)।<\/li>\n<li><b>पहचान:<\/b> यह नाम किसी दूसरे व्यक्ति या वस्तु का नहीं हो सकता, यानी वह अकेली पहचान है। 'गंगा' कहने से एक ही नदी का बोध होता है। 'नदी' कहने से सब नदियों का।<\/li>\n<li><b>अर्थहीनता:<\/b> गुरु कहते हैं कि व्यक्तिवाचक संज्ञाएँ बहुधा अर्थहीन होती हैं। नाम केवल पहचान का संकेत है। इच्छानुसार बदला भी जा सकता है (पृ. ९७)। पर कुछ व्यक्तिवाचक संज्ञाएँ अर्थवान भी हैं: ईश्वर, परमात्मा, ब्रह्मांड, प्रकृति (पृ. ९८)।<\/li>\n<\/ul>\n\n<h2>जातिवाचक संज्ञा<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिस संज्ञा से एक पूरी जाति के सब पदार्थों का बोध हो, वह जातिवाचक है। (गुरु, पृ. ९८)<\/div>\n<p>गुरु का उदाहरण: हिमालय, विंध्याचल, नीलगिरि और आबू अलग-अलग पहाड़ हैं, पर सब ऊँचे भूभाग हैं। इस साझे धर्म के कारण सबका एक नाम 'पहाड़' है। इसी तरह गंगा, यमुना, सिंधु सब 'नदी' हैं (पृ. ९८)। जातिवाचक संज्ञाएँ अर्थवान होती हैं। 'प्रयाग' को 'इलाहाबाद' कह दें तो लोग मान लेंगे, पर 'शहर' को 'नदी' नहीं कह सकते।<\/p>\n<p>उदाहरण: मनुष्य, लड़का, पशु, पेड़, पर्वत, नगर, पुस्तक, शिक्षक, कुर्सी, गाय।<\/p>\n\n<h2>भाववाचक संज्ञा<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिस संज्ञा से पदार्थ में पाए जाने वाले किसी धर्म (गुण, अवस्था या व्यापार) का बोध हो, उसे भाववाचक संज्ञा कहते हैं। (गुरु, पृ. ९९)<\/div>\n<h3>धर्म को वस्तु से अलग करके सोचना<\/h3>\n<p>पानी में शीतलता है, आग में उष्णता, सोने में भारीपन। ये गुण पानी, आग और सोने से अलग नहीं रह सकते। फिर भी मन में हम केवल 'शीतलता' या 'बल' का विचार अलग कर सकते हैं। घोड़े के बल की तुलना हाथी के बल से भी कर लेते हैं (पृ. १००)। इसी अलग किए गए गुण का नाम भाववाचक संज्ञा है। इसलिए इसे हम छू या देख नहीं सकते, केवल अनुभव कर सकते हैं।<\/p>\n<h3>भाव के तीन अर्थ (गुरु, पृ. १००)<\/h3>\n<table>\n<tr><th>अर्थ<\/th><th>उदाहरण<\/th><th>पहचान<\/th><\/tr>\n<tr><td>धर्म या गुण<\/td><td>ठंडाई, शीतलता, धीरज, मिठास, बल, बुद्धि, क्रोध<\/td><td>कैसा होना<\/td><\/tr>\n<tr><td>अवस्था<\/td><td>नींद, रोग, उजेला, अँधेरा, पीड़ा, दरिद्रता, सफ़ाई<\/td><td>किस हालत में होना<\/td><\/tr>\n<tr><td>व्यापार (काम)<\/td><td>चढ़ाई, बहाव, दान, भजन, बोलचाल, दौड़, पढ़ना<\/td><td>क्या करना<\/td><\/tr>\n<\/table>\n<p>एक पहचान-चाल: शब्द के आगे 'का होना' या 'की बात' लगाकर देखिए। 'मिठास की बात', 'नींद की बात' ठीक बैठता है, पर 'मेज़ की बात' भी बैठ जाता है, इसलिए यह चाल अकेली काफ़ी नहीं। असली कसौटी यह है कि शब्द किसी चीज़ को नहीं, उसके गुण, अवस्था या काम को बता रहा हो।<\/p>\n\n<h3>भाववाचक संज्ञा कैसे बनती है<\/h3>\n<p>गुरु के अनुसार भाववाचक संज्ञाएँ बहुधा तीन प्रकार के शब्दों से बनती हैं: जातिवाचक संज्ञा, विशेषण और क्रिया (पृ. १००–१०१)। स्कूली पाठ्यपुस्तकों और HTET में सर्वनाम और अव्यय को भी जोड़ा जाता है (2021 Q40 में यही पूछा गया है)।<\/p>\n<table>\n<tr><th>किस शब्द से<\/th><th>मूल शब्द<\/th><th>भाववाचक संज्ञा<\/th><\/tr>\n<tr><td>जातिवाचक संज्ञा से<\/td><td>मित्र, बूढ़ा, लड़का, पंडित, दास<\/td><td>मित्रता, बुढ़ापा, लड़कपन, पंडिताई, दासत्व<\/td><\/tr>\n<tr><td>विशेषण से<\/td><td>गरम, मीठा, चतुर, कठोर, बड़ा, धीर<\/td><td>गरमी, मिठास, चतुराई, कठोरता, बड़प्पन, धैर्य<\/td><\/tr>\n<tr><td>क्रिया से<\/td><td>घबराना, सजाना, चढ़ना, बहना, चलना<\/td><td>घबराहट, सजावट, चढ़ाई, बहाव, चलन<\/td><\/tr>\n<tr><td>सर्वनाम से (स्कूली)<\/td><td>अपना, निज<\/td><td>अपनापन, निजता<\/td><\/tr>\n<tr><td>अव्यय से (स्कूली)<\/td><td>निकट, सतत, शीघ्र<\/td><td>निकटता, सातत्य, शीघ्रता<\/td><\/tr>\n<\/table>\n<div class=\"def\"><b>प्रत्ययों की सूची<\/b> ता: मित्रता, मधुरता। त्व: दासत्व, सतीत्व। पन: लड़कपन, बड़प्पन। पा: बुढ़ापा। आई: चतुराई, पंडिताई, चढ़ाई। आहट: घबराहट। आवट: सजावट। आव: बहाव। आस: मिठास। ई: गरमी, सरदी। य या र्य: राज्य, धैर्य।<\/div>\n<div class=\"trap\"><b>फँसाने वाली बात:<\/b> जिस शब्द में भाववाचक जैसा प्रत्यय हो, वह हमेशा भाववाचक नहीं होता। 'शक्तिशाली', 'रोगी', 'उद्यमी', 'परिश्रमी' विशेषण हैं, संज्ञा नहीं। अंत में 'ई' देखकर भाववाचक न मान लें: 'गरमी' (भाव) भाववाचक है, पर 'रोगी' (रोग वाला) विशेषण है। सूत्र: भाववाचक संज्ञा <i>किसी की<\/i> होती है (शक्ति की, रोग की); विशेषण <i>किसी के<\/i> साथ आता है (शक्तिशाली व्यक्ति, रोगी बालक)।<\/div>\n\n<h3>एक संज्ञा का दूसरे भेद में बदल जाना (गुरु, पृ. १०१–१०२)<\/h3>\n<ul>\n<li><b>व्यक्तिवाचक → जातिवाचक:<\/b> जब नाम कई व्यक्तियों के लिए आए या किसी असाधारण गुण को बताए। \"कहु रावण, रावण जग केते\": दूसरा 'रावण' जातिवाचक है। \"यशोदा हमारे घर की लक्ष्मी है\": यहाँ 'लक्ष्मी' का अर्थ विष्णु की पत्नी नहीं, लक्ष्मी जैसी गुणवती स्त्री है। \"कलियुग के भीम\": भीम जैसा बली।<\/li>\n<li><b>जातिवाचक → व्यक्तिवाचक:<\/b> कुछ जातिवाचक शब्द एक ही व्यक्ति या वस्तु के लिए चल पड़ते हैं: पुरी (जगन्नाथ), देवी (दुर्गा), दाऊ (बलदेव), संवत् (विक्रमी संवत्), गुसाईंजी (तुलसीदास)।<\/li>\n<li><b>भाववाचक → जातिवाचक:<\/b> जब भाववाचक संज्ञा किसी वस्तु या व्यक्ति के लिए आए। गुरु का उदाहरण: \"रूपवती स्त्रियाँ निरादर हैं\": 'निरादर' यहाँ निरादर के योग्य स्त्री है (पृ. १०२)।<\/li>\n<li><b>बहुवचन के संकेत:<\/b> गुरु लिखते हैं कि बहुधा जातिवाचक संज्ञाएँ ही बहुवचन में आती हैं। जब व्यक्तिवाचक या भाववाचक का प्रयोग जातिवाचक की तरह होता है, तभी उनका बहुवचन बनता है (पृ. २६६)। इसीलिए 'बुराइयाँ', 'अच्छाइयाँ', 'ऊँचाइयाँ' का बहुवचन रूप जातिवाचक प्रयोग का संकेत है (2020 Q36 इसी पर टिका है)।<\/li>\n<\/ul>\n\n<h3>समुदायवाचक और द्रव्यवाचक<\/h3>\n<p><b>समुदायवाचक:<\/b> जो व्यक्तियों या वस्तुओं के समूह का बोध कराए: सभा, भीड़, दल, सेना, परिवार, कक्षा, झुंड। यह एकवचन में होकर भी समूह को एक इकाई मानता है। <b>द्रव्यवाचक:<\/b> जो ऐसा पदार्थ बताए जो ढेर के रूप में तौला या नापा जाए: अनाज, घी, शक्कर, सोना (गुरु की पाद-टिप्पणी, पृ. १०४)। द्रव्यवाचक संज्ञा का बहुवचन बहुधा नहीं होता। पर जब द्रव्य की अलग-अलग जातियाँ बतानी हों तब बहुवचन में आती है: \"बाज़ार में कई तेल बिकते हैं\" (पृ. २६७)।<\/p>\n\n<h3>संज्ञा के स्थान पर आने वाले शब्द (पृ. १०२)<\/h3>\n<p>सर्वनाम (मैं, यह), विशेषण (बड़ों का कहना माना, गरीबों की मदद) और कभी-कभी क्रियाविशेषण या विस्मयादिबोधक (हाय-हाय मची है) भी संज्ञा की तरह प्रयोग में आ जाते हैं। इसीलिए वाक्य में शब्द का भेद उसके <i>प्रयोग<\/i> से तय होता है, केवल रूप से नहीं।<\/p>\n\n<h2>लिंग<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा के जिस रूप से पुरुष या स्त्री जाति का बोध होता है, उसे लिंग कहते हैं। हिंदी में दो लिंग हैं: पुल्लिंग और स्त्रीलिंग। (गुरु, पृ. २३७)<\/div>\n<h3>लिंग क्यों जानना ज़रूरी है<\/h3>\n<p>हिंदी में लिंग केवल संज्ञा तक नहीं रहता। वह विशेषण, क्रिया और संबंध-कारक के चिह्न तक को बदल देता है: 'अच्छा लड़का गया', 'अच्छी लड़की गई', 'लड़के का घर', 'लड़की की किताब'। संस्कृत, मराठी और गुजराती में तीन लिंग होते हैं (नपुंसक भी); हिंदी में नपुंसक लिंग नहीं है, इसलिए हर निर्जीव वस्तु को भी पुरुष या स्त्री की कल्पना में रखना पड़ता है (पृ. २३७–२३८)।<\/p>\n<p>गुरु के अनुसार पुल्लिंग वह है जिससे यथार्थ या कल्पित पुरुषत्व का बोध हो (लड़का, बैल, पेड़, नगर), और स्त्रीलिंग वह जिससे यथार्थ या कल्पित स्त्रीत्व का बोध हो (लड़की, गाय, लता, पुरी)। 'पेड़' में सचमुच पुरुषत्व नहीं, केवल कल्पित है (पृ. २३८)।<\/p>\n\n<h3>निर्णय के दो आधार: अर्थ और रूप<\/h3>\n<p>गुरु साफ़ कहते हैं कि हिंदी में लिंग का पूरा निर्णय कठिन है और व्यापक नियम नहीं बन सकते। मोटा सूत्र यह है: <b>प्राणिवाचक शब्दों का लिंग अर्थ से और अप्राणिवाचक का रूप से<\/b> तय होता है; शेष शब्दों का लिंग व्यवहार से माना जाता है (पृ. २३८–२३९)। यानी नियम अपवादों से भरे हैं, इसलिए सूचियों को उदाहरणों सहित रटना पड़ता है।<\/p>\n\n<h3>प्राणिवाचक शब्द (अर्थ के अनुसार)<\/h3>\n<ul>\n<li>जोड़े वाले प्राणियों में पुरुषबोधक शब्द पुल्लिंग और स्त्रीबोधक शब्द स्त्रीलिंग होते हैं: पुरुष-स्त्री, घोड़ा-घोड़ी, मोर-मोरनी। अपवाद: 'संतान' और 'सवारी' (यात्री) स्त्रीलिंग हैं, चाहे पुरुष हो (पृ. २३९)।<\/li>\n<li><b>नित्य पुल्लिंग<\/b> (मनुष्येतर प्राणी, जिनका एक ही लिंग चलता है): पक्षी, कौआ, भेड़िया, चीता, खटमल, केंचुआ।<\/li>\n<li><b>नित्य स्त्रीलिंग:<\/b> चील, कोयल, बटेर, मैना, गिलहरी, जोंक, तितली, मक्खी, मछली। इन शब्दों के प्रयोग में कोई नहीं देखता कि प्राणी नर है या मादा। 'हाथी' को स्त्रीलिंग बोलना अशुद्ध है (पृ. २३९)।<\/li>\n<li><b>नर या मादा बताना हो<\/b> तो एकलिंग प्राणियों के आगे 'नर' या 'मादा' लगाते हैं: नर-चील, मादा-चील, मादा-भेड़िया (पृ. २५६)।<\/li>\n<li><b>समुदायवाचक प्राणी-नाम:<\/b> पुल्लिंग: समूह, झुंड, कुटुंब, संघ, दल, मंडल। स्त्रीलिंग: भीड़, फ़ौज, सभा, प्रजा, सरकार, टोली (पृ. २३९)।<\/li>\n<\/ul>\n\n<h3>अप्राणिवाचक शब्द: अर्थ के अनुसार (पृ. २४१–२४२)<\/h3>\n<p>गुरु ये नियम दूसरे व्याकरणों से लेकर देते हैं और साथ में कहते हैं कि ये अव्यापक और अपूर्ण हैं, क्योंकि लगभग जितने उदाहरण हैं उतने अपवाद भी हैं (पृ. २४०)। इन्हें प्रवृत्ति की तरह पढ़ें, नियम की तरह नहीं।<\/p>\n<table>\n<tr><th>वर्ग<\/th><th>सामान्यतः पुल्लिंग<\/th><th>अपवाद (स्त्रीलिंग)<\/th><\/tr>\n<tr><td>शरीर के अंग<\/td><td>बाल, सिर, दाँत, मुँह, कान, गाल, हाथ, पाँव, नख<\/td><td>आँख, नाक, जीभ, जाँघ, नस, हड्डी<\/td><\/tr>\n<tr><td>धातुएँ<\/td><td>सोना, ताँबा, पीतल, लोहा, सीसा, टीन<\/td><td>चाँदी, मिट्टी, धातु<\/td><\/tr>\n<tr><td>रत्न<\/td><td>हीरा, मोती, माणिक, मूँगा, पन्ना<\/td><td>मणि, चुन्नी, लालड़ी<\/td><\/tr>\n<tr><td>पेड़<\/td><td>पीपल, बड़, शीशम, देवदार, अशोक<\/td><td>नीम, जामुन, कचनार<\/td><\/tr>\n<tr><td>अनाज<\/td><td>जौ, गेहूँ, चावल, बाजरा, चना, तिल<\/td><td>मक्का, ज्वार, मूँग, अरहर<\/td><\/tr>\n<tr><td>द्रव<\/td><td>घी, तेल, पानी, दही, शर्बत<\/td><td>छाछ, स्याही<\/td><\/tr>\n<tr><td>भू-भाग<\/td><td>देश, नगर, द्वीप, पहाड़, समुद्र, आकाश, घर<\/td><td>पृथ्वी, नदी, झील, घाटी<\/td><\/tr>\n<tr><td>ग्रह<\/td><td>सूर्य, चंद्र, मंगल, बुध, राहु, शनि<\/td><td>पृथ्वी<\/td><\/tr>\n<\/table>\n<table>\n<tr><th>वर्ग<\/th><th>सामान्यतः स्त्रीलिंग<\/th><th>अपवाद (पुल्लिंग)<\/th><\/tr>\n<tr><td>नदियाँ<\/td><td>गंगा, यमुना, नर्मदा, ताप्ती, कृष्णा<\/td><td>सोन, सिंधु, ब्रह्मपुत्र<\/td><\/tr>\n<tr><td>तिथियाँ<\/td><td>परिवा, दूज, तीज, चौथ<\/td><td><\/td><\/tr>\n<tr><td>नक्षत्र<\/td><td>अश्विनी, भरणी, कृत्तिका, रोहिणी<\/td><td><\/td><\/tr>\n<tr><td>किराने की चीज़ें<\/td><td>लौंग, इलायची, सुपारी, जावित्री, केसर<\/td><td>तेजपात, कपूर<\/td><\/tr>\n<tr><td>भोजन<\/td><td>पूरी, कचौरी, खीर, दाल, रोटी, खिचड़ी, कढ़ी<\/td><td>भात, रायता, हलुआ<\/td><\/tr>\n<\/table>\n<p>वर्णमाला के अक्षरों में इ, ई और ऋ को छोड़कर शेष पुल्लिंग हैं (पृ. २४२)।<\/p>\n\n<h3>अप्राणिवाचक शब्द: रूप के अनुसार (पृ. २४२–२४७)<\/h3>\n<p>गुरु शब्दों को तीन स्रोतों में बाँटते हैं: हिंदी, संस्कृत और उर्दू। उनके अनुसार ये नियम 'अपूर्ण हैं, पर बहुधा निरपवाद' (पृ. २४२)।<\/p>\n<h3>हिंदी शब्द<\/h3>\n<table>\n<tr><th>अंत या प्रत्यय<\/th><th>लिंग और उदाहरण<\/th><th>अपवाद<\/th><\/tr>\n<tr><td>ऊनवाचक को छोड़ आकारांत<\/td><td>पुल्लिंग: कपड़ा, गन्ना, पैसा, आटा, चमड़ा<\/td><td><\/td><\/tr>\n<tr><td>भाववाचक में -ना, -आव, -पन, -पा<\/td><td>पुल्लिंग: आना, गाना, बहाव, चढ़ाव, बड़प्पन, बुढ़ापा<\/td><td><\/td><\/tr>\n<tr><td>कृदंत की -आन<\/td><td>पुल्लिंग: लगान, मिलान, उठान, नहान<\/td><td><\/td><\/tr>\n<tr><td>ईकारांत<\/td><td>स्त्रीलिंग: नदी, चिट्ठी, रोटी, टोपी, उदासी<\/td><td>पानी, घी, जी, मोती, दही, मही (पुल्लिंग)<\/td><\/tr>\n<tr><td>ऊनवाचक -इया<\/td><td>स्त्रीलिंग: खटिया, डिबिया, पुड़िया<\/td><td><\/td><\/tr>\n<tr><td>तकारांत<\/td><td>स्त्रीलिंग: रात, बात, लात, छत, भीत<\/td><td>भात, खेत, सूत, दाँत (पुल्लिंग)<\/td><\/tr>\n<tr><td>ऊकारांत<\/td><td>स्त्रीलिंग: बालू, दारू, झाड़ू<\/td><td>आँसू, आलू, रतालू<\/td><\/tr>\n<tr><td>सकारांत<\/td><td>स्त्रीलिंग: प्यास, मिठास, साँस<\/td><td>निकास, कास, रास (नृत्य)<\/td><\/tr>\n<tr><td>कृदंत की -न (उपांत्य अ)<\/td><td>स्त्रीलिंग: रहन, सूजन, जलन, उलझन<\/td><td>चलन उभयलिंग<\/td><\/tr>\n<tr><td>कृदंत की अकारांत<\/td><td>स्त्रीलिंग: लूट, मार, समझ, दौड़, चमक, पुकार<\/td><td>खेल, नाच, मेल, बोल (पुल्लिंग)<\/td><\/tr>\n<tr><td>भाववाचक -ट, -वट, -हट<\/td><td>स्त्रीलिंग: सजावट, बनावट, घबराहट, आहट<\/td><td><\/td><\/tr>\n<tr><td>-ख<\/td><td>स्त्रीलिंग: ईख, भूख, राख, चीख, आँख, कोख<\/td><td>पाख, रूख<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> 'दही' को कहीं-कहीं स्त्रीलिंग बोलते हैं, पर गुरु इसे अशुद्ध कहते हैं (पृ. २४३)। 'हाथी' को स्त्रीलिंग कहना भी अशुद्ध है। 'पानी' और 'घी' ईकारांत होकर भी पुल्लिंग हैं, इसीलिए परीक्षा में बार-बार पूछे जाते हैं।<\/div>\n<h3>संस्कृत शब्द<\/h3>\n<table>\n<tr><th>अंत या प्रत्यय<\/th><th>पुल्लिंग उदाहरण<\/th><th>अपवाद<\/th><\/tr>\n<tr><td>-त्र<\/td><td>चित्र, क्षेत्र, पात्र, नेत्र, गोत्र, चरित्र, शस्त्र<\/td><td><\/td><\/tr>\n<tr><td>-न (नांत)<\/td><td>पालन, पोषण, दमन, वचन, नयन, गमन, हरण<\/td><td>पवन उभयलिंग<\/td><\/tr>\n<tr><td>-ज<\/td><td>जलज, स्वेदज, पिंडज, सरोज<\/td><td><\/td><\/tr>\n<tr><td>भाववाचक -त्व, -त्य, -व, -र्य<\/td><td>सतीत्व, बहुत्व, नृत्य, कृत्य, लाघव, गौरव, माधुर्य, धैर्य<\/td><td><\/td><\/tr>\n<tr><td>-आर, -आय, -आस<\/td><td>विकार, विस्तार, संसार, उपाय, अध्याय, विकास, उल्लास, हास<\/td><td>सहाय (उभय), आय (स्त्री)<\/td><\/tr>\n<tr><td>-अ प्रत्यय<\/td><td>क्रोध, मोह, पाक, त्याग, दोष, स्पर्श<\/td><td>जय स्त्रीलिंग, विनय उभय<\/td><\/tr>\n<tr><td>-त<\/td><td>चरित, फलित, गणित, मत, गीत, स्वागत<\/td><td><\/td><\/tr>\n<tr><td>-ख<\/td><td>नख, मुख, सुख, दुख, लेख, शंख<\/td><td><\/td><\/tr>\n<\/table>\n<table>\n<tr><th>अंत या प्रत्यय<\/th><th>स्त्रीलिंग उदाहरण<\/th><th>अपवाद<\/th><\/tr>\n<tr><td>आकारांत<\/td><td>दया, माया, कृपा, लज्जा, क्षमा, शोभा, सभा<\/td><td><\/td><\/tr>\n<tr><td>-ना (नाकारांत)<\/td><td>प्रार्थना, वंदना, प्रस्तावना, वेदना, रचना, घटना<\/td><td><\/td><\/tr>\n<tr><td>-उ प्रत्यय<\/td><td>वायु, रेणु, मृत्यु, आयु, वस्तु, धातु, ऋतु<\/td><td>मधु, अश्रु, तालु, तरु, हेतु, सेतु (पुल्लिंग)<\/td><\/tr>\n<tr><td>-ति, -नि<\/td><td>गति, मति, जाति, रीति, हानि, ग्लानि, बुद्धि, सिद्धि<\/td><td><\/td><\/tr>\n<tr><td>-ता भाववाचक<\/td><td>नम्रता, लघुता, सुंदरता, प्रभुता, जड़ता<\/td><td><\/td><\/tr>\n<tr><td>इकारांत<\/td><td>निधि, विधि, परिधि, राशि, अग्नि, छवि, रुचि<\/td><td>वारि, जलधि, पाणि, गिरि, आदि, बलि (पुल्लिंग)<\/td><\/tr>\n<tr><td>-इमा<\/td><td>महिमा, गरिमा, कालिमा, लालिमा<\/td><td><\/td><\/tr>\n<\/table>\n<h3>उर्दू शब्द<\/h3>\n<p><b>पुल्लिंग:<\/b> -आब (गुलाब, हिसाब, जवाब; अपवाद शराब, किताब); -आर या -आन (बाज़ार, इनकार, मकान, सामान; अपवाद दुकान, सरकार, तकरार); जिनके अंत में 'ह' था, जो हिंदी में 'आ' हो गया (परदा, गुस्सा, किस्सा, रास्ता, चश्मा; अपवाद दफ़ा)। <b>स्त्रीलिंग:<\/b> ईकारांत भाववाचक (ग़रीबी, गरमी, सरदी, बीमारी, चालाकी); -श (कोशिश, तलाश, मालिश; अपवाद ताश, होश); -त (दौलत, कसरत, अदालत, कीमत; अपवाद शरबत, वक़्त, तख़्त); आकारांत (हवा, दवा, सज़ा, दुनिया; अपवाद दगा पुल्लिंग, मज़ा उभय); हकारांत (सुबह, तरह, राह, आह, सलाह; अपवाद माह, गुनाह) (पृ. २४६–२४७)।<\/p>\n\n<h3>उभयलिंग शब्द (पृ. २४७)<\/h3>\n<p>कुछ शब्द दोनों लिंगों में चलते हैं: सहाय, विनय, घास, बर्फ़, तमाखू, दरार, श्वास, गेंद, गड़बड़, कलम, आत्मा, मज़ा, समाज, चलन, पुस्तक, पवन।<\/p>\n\n<h3>जब हिंदी में लिंग बदल गया (पृ. २४७–२४८)<\/h3>\n<p>गुरु के अनुसार हिंदी के लगभग तीन-चौथाई शब्द संस्कृत के हैं, और संस्कृत के पुल्लिंग तथा नपुंसकलिंग शब्द बहुधा हिंदी में पुल्लिंग, स्त्रीलिंग शब्द बहुधा स्त्रीलिंग रहते हैं। पर कुछ शब्दों का लिंग हिंदी में बदल गया है:<\/p>\n<table>\n<tr><th>शब्द<\/th><th>संस्कृत में<\/th><th>हिंदी में<\/th><\/tr>\n<tr><td>अग्नि (आग), देह, राशि, शपथ<\/td><td>पुल्लिंग<\/td><td>स्त्रीलिंग<\/td><\/tr>\n<tr><td>आयु, वस्तु, जय<\/td><td>नपुंसक<\/td><td>स्त्रीलिंग<\/td><\/tr>\n<tr><td>तारा (नक्षत्र), देवता, व्यक्ति<\/td><td>स्त्रीलिंग<\/td><td>पुल्लिंग<\/td><\/tr>\n<tr><td>आत्मा, पुस्तक, पवन<\/td><td>पुल्लिंग या नपुंसक<\/td><td>उभयलिंग<\/td><\/tr>\n<\/table>\n<p>अंग्रेज़ी शब्दों में बहुधा हिंदी समानार्थी शब्द का लिंग आता है: कंपनी (मंडली) स्त्री, कोट (अँगरखा) पुं., बूट (जूता) पुं., कमेटी (सभा) स्त्री। आकारांत हो तो पुल्लिंग (सोडा, डेल्टा) और ईकारांत हो तो स्त्रीलिंग (चिमनी, लायब्रेरी) (पृ. २४९)।<\/p>\n<p><b>सामासिक शब्द:<\/b> अधिकांश का लिंग अंतिम शब्द के अनुसार होता है: रसोईघर (पुं.), धर्मशाला (स्त्री.), माँ-बाप (पुं.)। पर बहुव्रीहि में पूरे शब्द का लिंग विशेष्य से तय होता है (पृ. २४९)।<\/p>\n\n<h3>पुल्लिंग से स्त्रीलिंग बनाना (पृ. २५०–२५६)<\/h3>\n<p>गुरु हिंदी में स्त्री-प्रत्यय ये बताते हैं: ई, इया, इन, नी, आनी, आइन, आ (पृ. २५०)। नीचे हर नियम उदाहरण सहित है।<\/p>\n<table>\n<tr><th>प्रत्यय और नियम<\/th><th>पुल्लिंग<\/th><th>स्त्रीलिंग<\/th><\/tr>\n<tr><td>ई: प्राणिवाचक आकारांत का अंतिम 'आ' हटाकर<\/td><td>लड़का, घोड़ा, बकरा, बेटा, चेला<\/td><td>लड़की, घोड़ी, बकरी, बेटी, चेली<\/td><\/tr>\n<tr><td>ई: संबंधवाचक शब्द<\/td><td>काका, नाना, मामा, दादा, साला<\/td><td>काकी, नानी, मामी, दादी, साली<\/td><\/tr>\n<tr><td>इया: निरादर या प्यार में<\/td><td>कुत्ता, बुड्ढा, बेटा<\/td><td>कुतिया, बुढ़िया, बिटिया<\/td><\/tr>\n<tr><td>इन: ब्राह्मणेतर वर्ण और व्यवसाय के नाम<\/td><td>सुनार, धोबी, तेली, लुहार, माली<\/td><td>सुनारिन, धोबिन, तेलिन, लुहारिन, मालिन<\/td><\/tr>\n<tr><td>नी: कुछ प्राणियों के<\/td><td>ऊँट, मोर, रीछ, सिंह, हाथी<\/td><td>ऊँटनी, मोरनी, रीछनी, सिंहनी, हथिनी<\/td><\/tr>\n<tr><td>आइन: उपनामवाचक<\/td><td>ठाकुर, पांडे, दुबे, बाबू, लाला<\/td><td>ठकुराइन, पँडाइन, दुबाइन, बबुआइन, ललाइन<\/td><\/tr>\n<tr><td>आनी: कुछ शब्द<\/td><td>सेठ, देवर, नौकर, चौधरी<\/td><td>सेठानी, देवरानी, नौकरानी, चौधरानी<\/td><\/tr>\n<tr><td>ई: संस्कृत व्यंजनांत और अकारांत<\/td><td>श्रीमान्, विद्वान्, भगवान्, पुत्र, देव, कुमार<\/td><td>श्रीमती, विदुषी, भगवती, पुत्री, देवी, कुमारी<\/td><\/tr>\n<tr><td>त्री: ऋकारांत<\/td><td>कर्ता, दाता, धाता, कवयिता<\/td><td>कर्त्री, दात्री, धात्री, कवयित्री<\/td><\/tr>\n<tr><td>आ: संस्कृत<\/td><td>सुत, प्रिय, बाल, शिव, पंडित<\/td><td>सुता, प्रिया, बाला, शिवा, पंडिता<\/td><\/tr>\n<tr><td>-अक का -इका<\/td><td>पाठक, बालक, नायक, उपदेशक<\/td><td>पाठिका, बालिका, नायिका, उपदेशिका<\/td><\/tr>\n<tr><td>अरबी -आ<\/td><td>मलिक, साहब, वालिद<\/td><td>मलिका, साहबा, वालिदा<\/td><\/tr>\n<\/table>\n<p><b>बिलकुल अलग शब्द<\/b> (पृ. २५६): राजा-रानी, पिता-माता, ससुर-सास, पुरुष-स्त्री, भाई-बहिन, पुत्र-कन्या, वर-वधू, साहब-मेम, नर-मादा, बेटा-बेटी।<\/p>\n<div class=\"trap\"><b>उलटी दिशा और ऊनवाचक:<\/b> कभी-कभी पुल्लिंग शब्द स्त्रीलिंग से बनता है: भैंस-भैंसा, भेड़-भेड़ा, चींटी-चींटा (पृ. २५२)। आकार में छोटा या सूक्ष्म बताने के लिए स्त्रीलिंग प्रत्यय आता है: रस्सा-रस्सी, लोटा-लुटिया, घंटा-घंटी, गगरा-गगरी। इन्हें <b>ऊनवाचक<\/b> कहते हैं। विनोद में स्थूलता के लिए उलटा भी होता है: घड़ी-घड़ा, डाल-डाला। साथ ही कुछ जोड़े-जैसे दिखने वाले शब्द वास्तव में जोड़े नहीं हैं: डाकू (चोर) और डाकिन (चुड़ैल); भेड़ और भेड़िया (पृ. २५३)।<\/div>\n\n<h2>वचन<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा (और दूसरे विकारी शब्दों) के जिस रूप से संख्या का बोध होता है, उसे वचन कहते हैं। हिंदी में दो वचन हैं: एकवचन और बहुवचन। (गुरु, पृ. २५७)<\/div>\n<p>एकवचन एक वस्तु बताता है: लड़का, टोपी, रंग। बहुवचन एक से अधिक: लड़के, टोपियाँ, रंगों में। संस्कृत और अरबी में तीन वचन हैं (द्विवचन भी); हिंदी में दो ही हैं (पृ. २५८)। <b>आदर के लिए भी बहुवचन<\/b> आता है: \"राजा के बड़े बेटे आए हैं\", \"तुम बच्चे हो\" (पृ. २५७)।<\/p>\n<h3>विभक्ति-रहित बहुवचन बनाने के नियम (कर्ता कारक, पृ. २५८–२६३)<\/h3>\n<table>\n<tr><th>अंत<\/th><th>बहुवचन बनाना<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>हिंदी आकारांत पुल्लिंग<\/td><td>अंतिम 'आ' के स्थान पर 'ए'<\/td><td>लड़का-लड़के, घोड़ा-घोड़े, बच्चा-बच्चे, कपड़ा-कपड़े<\/td><\/tr>\n<tr><td>अकारांत स्त्रीलिंग<\/td><td>अंत में 'एँ'<\/td><td>बहिन-बहिनें, आँख-आँखें, रात-रातें, बात-बातें<\/td><\/tr>\n<tr><td>इकारांत, ईकारांत स्त्रीलिंग<\/td><td>'ई' को ह्रस्व करके 'याँ'<\/td><td>तिथि-तिथियाँ, टोपी-टोपियाँ, रानी-रानियाँ, नदी-नदियाँ<\/td><\/tr>\n<tr><td>याकारांत (ऊनवाचक) स्त्रीलिंग<\/td><td>केवल अनुस्वार<\/td><td>डिबिया-डिबियाँ, गुड़िया-गुड़ियाँ, खटिया-खटियाँ<\/td><\/tr>\n<tr><td>शेष स्त्रीलिंग (आ, उ, ऊ)<\/td><td>अंत्य स्वर के बाद 'एँ'; 'ऊ' ह्रस्व हो जाता है<\/td><td>लता-लताएँ, वस्तु-वस्तुएँ, बहू-बहुएँ, माता-माताएँ<\/td><\/tr>\n<tr><td>शेष पुल्लिंग (आकारांत हिंदी को छोड़)<\/td><td>दोनों वचनों में एक-से<\/td><td>घर-घर, भाई-भाई, पक्षी-पक्षी, साधु-साधु, डाकू-डाकू<\/td><\/tr>\n<\/table>\n<p><b>याद रखने का सूत्र:<\/b> पुल्लिंग में केवल हिंदी आकारांत बदलता है (आ→ए)। स्त्रीलिंग में लगभग हर शब्द बदलता है: अकारांत में 'एँ', इ/ई-अंत में 'याँ', बाकी में 'एँ'।<\/p>\n<div class=\"trap\"><b>पुल्लिंग के अपवाद (पृ. २५९–२६०):<\/b> (1) साला, भानजा, भतीजा, बेटा, पोता को छोड़कर शेष संबंधवाचक, उपनामवाचक और प्रतिष्ठावाचक आकारांत पुल्लिंग दोनों वचनों में एक-से रहते हैं: काका, मामा, बाबा, नाना, राणा, पंडा। (2) संस्कृत के ऋकारांत और नकारांत शब्द, जो हिंदी में आकारांत हो गए (कर्ता, पिता, योद्धा, राजा, युवा, आत्मा, देवता, जामाता), बहुवचन में नहीं बदलते। 'राजा' का बहुवचन 'राजे' कुछ लेखक लिखते हैं, पर गुरु के अनुसार शिष्ट प्रयोग 'राजा' ही है। (3) व्यक्तिवाचक आकारांत (सुदामा, शतधन्वा) नहीं बदलते। इसलिए 'पिता' का बहुवचन 'पिते' और 'देवता' का 'देवते' लिखना ग़लत है।<\/div>\n<h3>जब रूप नहीं बदलता तो बहुत्व कैसे बताएँ<\/h3>\n<p>जिन मनुष्यवाचक पुल्लिंग शब्दों के रूप नहीं बदलते, उनके साथ 'लोग' जोड़ते हैं: ऋषि लोग, योद्धा लोग, आर्य लोग। 'गण' (देवतागण, शिक्षकगण), 'वर्ग' (पाठकवर्ग), 'जन' (भक्तजन, गुरुजन), 'जाति' (मनुष्यजाति) जैसे समूहवाचक शब्द भी बहुवचन का अर्थ देते हैं (पृ. २६५–२६६)।<\/p>\n<h3>विशेष बातें (पृ. २६६–२६७)<\/h3>\n<ul>\n<li><b>भाववाचक संज्ञा<\/b> बहुधा एकवचन में रहती है, पर जातिवाचक की तरह आने पर बहुवचन बनता है (बुराइयाँ)। 'पन' वाली भाववाचक का बहुवचन 'ए' से: सीधापन-सीधेपन।<\/li>\n<li><b>बड़ी संख्या या परिमाण<\/b> बताने के लिए जातिवाचक भी एकवचन में आती है: \"मेले में शहर का आदमी आया\", \"उसके पास बहुत रुपया मिला\"।<\/li>\n<li><b>प्रायः बहुवचन ही में आने वाले शब्द:<\/b> समाचार, प्राण, दाम, लोग, होश, हिज्जे, भाग्य, दर्शन।<\/li>\n<li><b>द्रव्यवाचक<\/b> का बहुवचन तभी होता है जब अलग-अलग किस्में बतानी हों (कई तेल)।<\/li>\n<\/ul>\n<h3>विभक्ति के साथ बहुवचन (विकृत रूप, पृ. २८३–२८४)<\/h3>\n<p>जब संज्ञा के आगे कारक-चिह्न (ने, को, से, में, का...) आता है तो उसका रूप 'विकृत' हो जाता है। बहुवचन में यह विकृत रूप 'ओं' से बनता है: घरों को, बातों में, लड़कों का, डिबियों में, राजाओं को, माताओं से। ईकारांत में ह्रस्व स्वर के बाद 'यों': नदियों में, शक्तियों का, हाथियों से। एकवचन में केवल हिंदी आकारांत पुल्लिंग बदलता है (लड़का से लड़के को; पर राजा को, काका से, देवता में नहीं बदलता)।<\/p>\n\n<h2>कारक<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा या सर्वनाम के जिस रूप से उसका संबंध वाक्य के किसी दूसरे शब्द (विशेषकर क्रिया) के साथ प्रकाशित होता है, उसे कारक कहते हैं। कारक सूचित करने के लिए संज्ञा या सर्वनाम के आगे जो चिह्न लगते हैं, वे <b>विभक्ति<\/b> कहलाते हैं। (गुरु, पृ. २६९–२७०)<\/div>\n<p><b>सरल रूप में:<\/b> वाक्य में हर संज्ञा का एक काम होता है। कोई काम करता है, किसी पर काम का असर पड़ता है, कोई साधन बनता है। संज्ञा का यही काम 'कारक' है और उसे दिखाने वाला चिह्न 'विभक्ति' है। गुरु का वाक्य: \"रामचंद्रजी ने खारी जल के समुद्र पर बंदरों से पुल बँधवा दिया।\" इसमें 'रामचंद्रजी ने' (कर्ता), 'समुद्र पर' (अधिकरण), 'बंदरों से' (करण), 'पुल' (कर्म), 'जल के' (संबंध)।<\/p>\n<div class=\"trap\"><b>कारक और विभक्ति:<\/b> संस्कृत में दोनों अलग हैं (एक विभक्ति कई कारकों में आ सकती है, जैसे 'को')। गुरु हिंदी में दोनों को एक अर्थ में लेते हैं और आठ कारक गिनते हैं (पृ. २७०–२७३)। संस्कृत में सात विभक्तियाँ और छह कारक हैं (संबंध कारक नहीं माना जाता)। स्कूली पुस्तकों में विभक्तियों के नाम (प्रथमा से सप्तमी) भी दिए जाते हैं; गुरु ये नाम नहीं लेते।<\/div>\n\n<h3>आठ कारक, उनकी विभक्ति और पहचान (पृ. २७३–२७५)<\/h3>\n<table>\n<tr><th>कारक (स्कूली विभक्ति)<\/th><th>चिह्न<\/th><th>प्रश्न से पहचान<\/th><\/tr>\n<tr><td>कर्ता (प्रथमा)<\/td><td>ने, (शून्य)<\/td><td>किसने? कौन?<\/td><\/tr>\n<tr><td>कर्म (द्वितीया)<\/td><td>को<\/td><td>किसको? क्या?<\/td><\/tr>\n<tr><td>करण (तृतीया)<\/td><td>से<\/td><td>किससे? (साधन)<\/td><\/tr>\n<tr><td>संप्रदान (चतुर्थी)<\/td><td>को<\/td><td>किसके लिए?<\/td><\/tr>\n<tr><td>अपादान (पंचमी)<\/td><td>से<\/td><td>किससे अलग?<\/td><\/tr>\n<tr><td>संबंध (षष्ठी)<\/td><td>का, के, की<\/td><td>किसका?<\/td><\/tr>\n<tr><td>अधिकरण (सप्तमी)<\/td><td>में, पर<\/td><td>कहाँ? कब?<\/td><\/tr>\n<tr><td>संबोधन<\/td><td>हे, अजी, अहो, अरे<\/td><td>पुकारना<\/td><\/tr>\n<\/table>\n<h3>1. कर्ता कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> क्रिया से जिस वस्तु के विषय में विधान किया जाए, उसे सूचित करने वाला रूप कर्ता कारक है। (गुरु)<\/div>\n<p>उदाहरण: \"लड़का सोता है।\" \"नौकर ने दरवाज़ा खोला।\" \"चिट्ठी भेजी जाएगी।\" पहले वाक्य में कोई चिह्न नहीं (शून्य विभक्ति); दूसरे में 'ने'। गुरु की परिभाषा में 'सोता है' जैसी स्थिति-दर्शक क्रियाओं के कर्ता भी आते हैं। <b>'ने' का नियम<\/b> (स्कूली पुस्तकों से): 'ने' सामान्यतः सकर्मक क्रिया के भूतकाल में आता है: 'राम ने खाना खाया'। वर्तमान और भविष्य में 'ने' नहीं आता: 'राम खाना खाता है'।<\/p>\n<h3>2. कर्म कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> जिस वस्तु पर क्रिया के व्यापार का फल पड़े, उसे सूचित करने वाला रूप कर्म कारक है।<\/div>\n<p>उदाहरण: \"लड़का पत्थर फेंकता है।\" \"मालिक ने नौकर को बुलाया।\" पहले वाक्य में 'को' नहीं है, फिर भी 'पत्थर' कर्म है। गुरु कहते हैं कि कर्म कारक में 'को' बहुधा लुप्त हो जाता है (पृ. २७७)। कर्म की पहचान: क्रिया से पहले 'क्या' या 'किसको' लगाइए।<\/p>\n<h3>3. करण कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा के उस रूप को करण कहते हैं जिससे क्रिया के साधन का बोध हो।<\/div>\n<p>उदाहरण: \"सिपाही चोर को रस्सी से बाँधता है।\" \"लड़के ने हाथ से फल तोड़ा।\" \"मनुष्य आँखों से देखते हैं, कानों से सुनते हैं।\" पहचान: 'किस चीज़ की मदद से?'<\/p>\n<h3>4. संप्रदान कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> जिस वस्तु के लिए कोई क्रिया की जाए, उसकी वाचक संज्ञा का रूप संप्रदान है।<\/div>\n<p>उदाहरण: \"राजा ने ब्राह्मण को धन दिया।\" \"शुकदेव मुनि राजा परीक्षित को कथा सुनाते हैं।\" \"लड़का नहाने को गया है।\" पहचान: 'किसके लिए?' देने, सुनाने, भेजने जैसी क्रियाओं में 'को' प्रायः संप्रदान होता है।<\/p>\n<h3>5. अपादान कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा के उस रूप को अपादान कहते हैं जिससे क्रिया के विभाग (अलगाव) की अवधि सूचित हो।<\/div>\n<p>उदाहरण: \"पेड़ से फल गिरा।\" \"गंगा हिमालय से निकलती है।\" पहचान: 'किससे अलग हुआ?' गुरु के अनुसार तुलना में भी उपमान अपादान कारक में आता है: \"मारनेवाले से पालनेवाला बड़ा होता है\" (पृ. ३१०)।<\/p>\n<h3>6. संबंध कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा के जिस रूप से उसकी वाच्य वस्तु का संबंध किसी दूसरी वस्तु से सूचित हो, वह संबंध कारक है।<\/div>\n<p>उदाहरण: \"राजा का महल\", \"लड़के की पुस्तक\", \"पत्थर के टुकड़े\"। इसका चिह्न <b>संबंधी शब्द<\/b> (जिसके साथ संबंध है) के लिंग और वचन के अनुसार बदलता है (गुरु, पृ. २७५): का (पुं. एकवचन), के (पुं. बहुवचन या विकृत), की (स्त्री.)। 'राजा की पुस्तक' में 'की' इसलिए है कि पुस्तक स्त्रीलिंग है, राजा नहीं। सर्वनाम में का-के-की के बदले मेरा-मेरे-मेरी, तेरा, हमारा आते हैं (पृ. २९६)।<\/p>\n<h3>7. अधिकरण कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा का वह रूप जिससे क्रिया के आधार (स्थान या समय) का बोध हो, अधिकरण कारक है।<\/div>\n<p>उदाहरण: \"सिंह वन में रहता है।\" \"बंदर पेड़ पर चढ़ रहे हैं।\" पहचान: 'कहाँ?' या 'कब?'। 'में' भीतर की स्थिति के लिए और 'पर' ऊपर या सतह के लिए सामान्यतः आता है।<\/p>\n<h3>8. संबोधन कारक<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> जिस रूप से किसी को चेताना या पुकारना सूचित हो, उसे संबोधन कारक कहते हैं।<\/div>\n<p>उदाहरण: \"हे नाथ! मेरे अपराधों को क्षमा करना।\" \"अरे लड़के, इधर आ।\" गुरु के अनुसार सर्वनामों में संबोधन कारक नहीं होता, क्योंकि पुकारते समय नाम या उपनाम ही कहा जाता है (पृ. २९६)।<\/p>\n<h3>सब कारक एक वाक्य में<\/h3>\n<ol class=\"steps\">\n<li>वाक्य: \"राजा ने ब्राह्मण को हाथ से धन दिया।\"<\/li>\n<li>कर्ता: राजा ने (किसने दिया?)।<\/li>\n<li>संप्रदान: ब्राह्मण को (किसके लिए दिया?)।<\/li>\n<li>करण: हाथ से (किस साधन से?)।<\/li>\n<li>कर्म: धन (क्या दिया?)। यहाँ 'को' नहीं है।<\/li>\n<\/ol>\n\n<h3>कारक-चिह्नों के भ्रम: को, से, में<\/h3>\n<table>\n<tr><th>चिह्न<\/th><th>कौन-कौन से कारक<\/th><th>कैसे अलग करें<\/th><\/tr>\n<tr><td>को<\/td><td>कर्म, संप्रदान<\/td><td>जिस पर क्रिया का फल पड़े: कर्म ('नौकर को बुलाया'); जिसके लिए दिया-किया जाए: संप्रदान ('ब्राह्मण को धन दिया')<\/td><\/tr>\n<tr><td>से<\/td><td>करण, अपादान<\/td><td>साधन हो तो करण ('रस्सी से बाँधा'); अलगाव हो तो अपादान ('पेड़ से गिरा')<\/td><\/tr>\n<tr><td>में, पर<\/td><td>अधिकरण<\/td><td>आधार (स्थान, समय): 'वन में', 'पेड़ पर'<\/td><\/tr>\n<tr><td>ने<\/td><td>कर्ता<\/td><td>केवल कर्ता के साथ, भूतकाल की सकर्मक क्रिया में<\/td><\/tr>\n<tr><td>का, के, की<\/td><td>संबंध<\/td><td>संबंधी शब्द के लिंग-वचन के अनुसार<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>एक और बात:<\/b> 'को' का एक ही प्रयोग 'कर्म' या 'संप्रदान' हो सकता है, इसलिए दोनों में एक ही चिह्न है। 'द्वारा', 'के लिए', 'तक', 'के पास' गुरु के अनुसार संबंधसूचक अव्यय हैं (पृ. २९०–२९१), कारक-विभक्ति नहीं। पर स्कूली पुस्तकें इन्हें कारक-चिह्न की तरह गिनती हैं ('द्वारा' करण का, 'के लिए' संप्रदान का)। विकल्प में दोनों दृष्टियाँ दिखें तो प्रश्न की भाषा (स्कूली या गुरु) देखकर निर्णय करें।<\/div>\n\n<h2>पहचान की विधि<\/h2>\n<ol class=\"steps\">\n<li><b>संज्ञा का भेद पूछा हो:<\/b> पहले देखें कि शब्द अकेले का नाम है (राम, भारत: व्यक्तिवाचक) या पूरी जाति का (लड़का, नदी: जातिवाचक)।<\/li>\n<li>फिर देखें कि शब्द गुण, अवस्था या काम बता रहा है (मिठास, नींद, धोखा, चढ़ाई)। तब वह भाववाचक है।<\/li>\n<li>समूह (सभा, भीड़) हो तो समुदायवाचक; तौलने-नापने का पदार्थ (घी, सोना) हो तो द्रव्यवाचक। विकल्प में ये भेद न हों तो जातिवाचक चुनें।<\/li>\n<li><b>भाववाचक बनाने का प्रश्न हो:<\/b> मूल शब्द का वर्ग देखें (संज्ञा, विशेषण, क्रिया, सर्वनाम, अव्यय) और विकल्प में 'शक्तिशाली', 'रोगी' जैसे विशेषण पहचान लें।<\/li>\n<li><b>लिंग का प्रश्न हो:<\/b> प्राणी हो तो अर्थ से; निर्जीव हो तो अंत देखें (ईकारांत, -ता, -इमा, -आवट, -आहट स्त्रीलिंग; -त्व, -पन, आकारांत पुल्लिंग)। फिर अपवाद-सूची में ढूँढें।<\/li>\n<li><b>वचन का प्रश्न हो:<\/b> आ→ए तभी, जब हिंदी का आकारांत पुल्लिंग हो। स्त्रीलिंग में एँ या याँ। संबंध, उपनाम और संस्कृत ऋकारांत शब्दों को छोड़ दें।<\/li>\n<li><b>कारक का प्रश्न हो:<\/b> चिह्न देखें; फिर क्रिया से संबंध पूछें: किसने (कर्ता), किसको (कर्म), किस साधन से (करण), किसके लिए (संप्रदान), किससे अलग (अपादान), किसका (संबंध), कहाँ-कब (अधिकरण), पुकार (संबोधन)।<\/li>\n<\/ol>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table>\n<tr><th>जोड़ा<\/th><th>अंतर<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>भाववाचक / विशेषण<\/td><td>भाववाचक गुण का नाम है; विशेषण संज्ञा के साथ आकर उसकी विशेषता बताता है<\/td><td>शक्ति (भाव), शक्तिशाली (विशेषण)<\/td><\/tr>\n<tr><td>भाववाचक / जातिवाचक<\/td><td>भाववाचक का बहुवचन या वस्तुबोधक प्रयोग जातिवाचक है<\/td><td>ऊँचाई (भाव), ऊँचाइयाँ (जातिवाचक प्रयोग)<\/td><\/tr>\n<tr><td>जातिवाचक / व्यक्तिवाचक<\/td><td>नाम केवल एक के लिए हो तो व्यक्तिवाचक<\/td><td>नदी / गंगा<\/td><\/tr>\n<tr><td>कर्म / संप्रदान<\/td><td>दोनों में 'को'; फल पड़े तो कर्म, 'के लिए' हो तो संप्रदान<\/td><td>नौकर को बुलाया / ब्राह्मण को दान दिया<\/td><\/tr>\n<tr><td>करण / अपादान<\/td><td>दोनों में 'से'; साधन करण, अलगाव अपादान<\/td><td>कलम से लिखा / पेड़ से गिरा<\/td><\/tr>\n<tr><td>ईकारांत पुल्लिंग / स्त्रीलिंग<\/td><td>ईकारांत शब्द सामान्यतः स्त्रीलिंग; पानी, घी, दही, मोती, हाथी पुल्लिंग<\/td><td>रोटी (स्त्री.) / मोती (पुं.)<\/td><\/tr>\n<\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n<h3>HTET 2020 Q36<\/h3>\n<p>प्रश्न: जातिवाचक संज्ञा युक्त वाक्य <b>नहीं<\/b> है: (A) आजकल की पढ़ाइयाँ बहुत महँगी हैं। (B) ऊँचाइयाँ नापनी हैं तो पर्वतों की सैर कीजिए। (C) कभी-कभी बुराइयाँ ही अच्छाइयाँ बन जाती हैं। (D) मैंने अनुभव किया है कि उसे ऊँचाई से डर लगता है।<\/p>\n<div class=\"ex\"><b>उत्तर: (D)।<\/b> (A), (B), (C) में 'पढ़ाइयाँ', 'ऊँचाइयाँ', 'बुराइयाँ', 'अच्छाइयाँ' भाववाचक संज्ञाएँ बहुवचन में आई हैं। गुरु के अनुसार भाववाचक संज्ञा का बहुवचन तभी बनता है जब उसका प्रयोग जातिवाचक की तरह हो (पृ. २६६)। इसलिए इन वाक्यों में जातिवाचक प्रयोग है। (B) में 'पर्वतों' भी जातिवाचक है। (D) में 'ऊँचाई' एकवचन में शुद्ध भाववाचक है (ऊँचाई का भाव), और वाक्य में जातिवाचक संज्ञा का प्रयोग नहीं है। इसलिए (D) सही उत्तर है।<\/div>\n<h3>HTET 2021 Q40<\/h3>\n<p>प्रश्न: निम्न में से असंगत विकल्प पहचानिए: (A) सातत्य: अव्यय से निर्मित भाववाचक संज्ञा। (B) निजता: सर्वनाम से निर्मित भाववाचक संज्ञा। (C) रोगिणी: भाववाचक संज्ञा से निर्मित विशेषण। (D) शक्तिशाली: विशेषण से निर्मित भाववाचक संज्ञा।<\/p>\n<div class=\"ex\"><b>उत्तर: (D)।<\/b> (A) 'सतत' (अव्यय, लगातार) से 'सातत्य' ठीक है। (B) 'निज' (सर्वनाम/विशेषण) से 'निजता' ठीक है। (C) रोग (भाववाचक) से रोगी, रोगिणी विशेषण ठीक है। (D) 'शक्तिशाली' स्वयं विशेषण है, भाववाचक संज्ञा नहीं; वह 'शक्ति' (संज्ञा) + 'शाली' से बना विशेषण है। विकल्प में उलटा लिखा गया है, इसलिए यही असंगत है।<\/div>\n<h3>HTET 2022 Q35<\/h3>\n<p>प्रश्न: \"उसने मुझे सदैव धोखा दिया।\" वाक्य में 'धोखा' शब्द कौन-सी संज्ञा का उदाहरण है? (A) समुदायवाचक (B) जातिवाचक (C) भाववाचक (D) व्यक्तिवाचक।<\/p>\n<div class=\"ex\"><b>उत्तर: (C) भाववाचक।<\/b> 'धोखा' किसी वस्तु या जाति का नाम नहीं, एक भाव या कर्म (छल) का नाम है, जैसे 'छल'। गुरु के अनुसार जो संज्ञा पदार्थ के धर्म, अवस्था या व्यापार का बोध कराए, वह भाववाचक है (पृ. १००)। इसी वर्ग में 'दान', 'मार', 'दौड़' भी आते हैं।<\/div>\n<h3>HTET 2023 Q40<\/h3>\n<p>प्रश्न: 'महात्मा गांधी ने भारत को आज़ाद कराया।' रेखांकित शब्द क्रमशः हैं (रेखांकित: महात्मा गांधी, भारत, आज़ाद): (A) व्यक्तिवाचक तथा जातिवाचक (B) जातिवाचक तथा भाववाचक (C) व्यक्तिवाचक तथा व्यक्तिवाचक (D) भाववाचक तथा व्यक्तिवाचक।<\/p>\n<div class=\"ex\"><b>उत्तर: (C)।<\/b> 'महात्मा गांधी' एक ही व्यक्ति का नाम है; 'भारत' एक ही देश का नाम है। दोनों व्यक्तिवाचक हैं। प्रश्न में तीन शब्द रेखांकित हैं, पर हर विकल्प में दो ही भेद दिए हैं; जाँचने पर पहले दो शब्द 'महात्मा गांधी' और 'भारत' दोनों व्यक्तिवाचक हैं, इसलिए (C) मेल खाता है। 'आज़ाद' इस वाक्य में विशेषण की तरह आया है (भाववाचक संज्ञा 'आज़ादी' होती)। यह प्रश्न इसी विसंगति के कारण अस्पष्ट है, पर आयोग की कुंजी (C) है।<\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li>संज्ञा उस विकारी शब्द को कहते हैं जो किसी वस्तु (व्यक्ति, स्थान, पदार्थ, गुण, भाव) का नाम बताए। गुरु के अनुसार मुख्य भेद तीन: व्यक्तिवाचक, जातिवाचक, भाववाचक; स्कूली पुस्तकों में पाँच (समुदायवाचक और द्रव्यवाचक सहित)।<\/li>\n<li>भाववाचक संज्ञा गुण, अवस्था या व्यापार का नाम है (मिठास, नींद, चढ़ाई, धोखा)। वह जातिवाचक संज्ञा, विशेषण और क्रिया से बनती है; स्कूली पुस्तकों में सर्वनाम और अव्यय से भी (निजता, सातत्य)।<\/li>\n<li>'शक्तिशाली', 'रोगी', 'उद्यमी' विशेषण हैं, भाववाचक संज्ञा नहीं (2021 Q40)।<\/li>\n<li>भाववाचक का बहुवचन जातिवाचक प्रयोग का संकेत है (बुराइयाँ, ऊँचाइयाँ: 2020 Q36)।<\/li>\n<li>हिंदी में दो लिंग: प्राणियों का लिंग अर्थ से, निर्जीव का रूप से। ईकारांत, -ता, -इमा, -आवट, -आहट स्त्रीलिंग; -त्व, -पन, -आव और आकारांत पुल्लिंग।<\/li>\n<li>अपवाद: पानी, घी, दही, मोती, हाथी पुल्लिंग; आयु, वस्तु, ऋतु स्त्रीलिंग; देवता, व्यक्ति, तारा पुल्लिंग। संतान और सवारी स्त्रीलिंग।<\/li>\n<li>बहुवचन: आ→ए केवल हिंदी आकारांत पुल्लिंग में (लड़का-लड़के); अकारांत स्त्री. में एँ (बहनें), इ/ई-अंत में याँ (तिथियाँ, लड़कियाँ), शेष में एँ (लताएँ, बहुएँ)।<\/li>\n<li>काका, मामा, पिता, राजा, आत्मा, देवता, पक्षी, मुनि, घर दोनों वचनों में एक-से रहते हैं। विभक्ति के साथ बहुवचन में 'ओं': घरों में।<\/li>\n<li>कारक आठ: कर्ता (ने), कर्म (को), करण (से), संप्रदान (को), अपादान (से), संबंध (का-के-की), अधिकरण (में, पर), संबोधन (हे, अरे)।<\/li>\n<li>साधन हो तो 'से' करण; अलगाव हो तो अपादान। फल पड़े तो 'को' कर्म; किसी के लिए हो तो संप्रदान।<\/li>\n<li>गुरु के अनुसार 'द्वारा', 'के लिए' संबंधसूचक अव्यय हैं; स्कूली पुस्तकों में कारक-चिह्न।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: 'चतुर' (विशेषण) से बनी भाववाचक संज्ञा है: (A) चतुरी (B) चतुराई (C) चतुरन (D) चतुरत्व<\/summary><p><b>उत्तर: (B)<\/b> चतुर + आई = चतुराई। गुरु ने भी इसे विशेषण से बनी भाववाचक संज्ञा के उदाहरणों में गिनाया है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: 'हिमालय से गंगा निकलती है' में 'से' किस कारक का चिह्न है? (A) करण (B) अपादान (C) अधिकरण (D) संप्रदान<\/summary><p><b>उत्तर: (B)<\/b> हिमालय से अलगाव (निकलना) बताता है, इसलिए अपादान। यह गुरु का अपना उदाहरण है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: नित्य स्त्रीलिंग शब्द कौन-सा है? (A) कौआ (B) खटमल (C) तितली (D) चीता<\/summary><p><b>उत्तर: (C)<\/b> तितली, मक्खी, कोयल, मैना नित्य स्त्रीलिंग हैं। कौआ, खटमल, चीता नित्य पुल्लिंग हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: निम्नलिखित में से 'पुल्लिंग' शब्द कौन-सा है? (A) रोटी (B) मोती (C) चिट्ठी (D) टोपी<\/summary><p><b>उत्तर: (B)<\/b> रोटी, चिट्ठी, टोपी ईकारांत स्त्रीलिंग हैं। 'मोती' ईकारांत होकर भी पुल्लिंग है (पृ. २४३ का अपवाद)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: 'लड़की' का बहुवचन है: (A) लड़के (B) लड़कियाँ (C) लड़कीएँ (D) लड़कियों<\/summary><p><b>उत्तर: (B)<\/b> ईकारांत स्त्रीलिंग में 'ई' ह्रस्व होकर 'याँ' जुड़ता है। 'लड़कियों' विभक्ति के साथ आने वाला विकृत बहुवचन है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: 'पिता' का बहुवचन रूप क्या होगा? (A) पिते (B) पितागण (C) पिता (D) पितायें<\/summary><p><b>उत्तर: (C)<\/b> संस्कृत के ऋकारांत शब्द, जो हिंदी में आकारांत हैं (पिता, कर्ता, दाता), विभक्ति-रहित बहुवचन में नहीं बदलते (पृ. २५९)। बहुत्व 'लोग' जोड़कर या संदर्भ से जताते हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: 'गुरु ने शिष्य को ज्ञान दिया।' में 'शिष्य को' किस कारक में है? (A) कर्म (B) संप्रदान (C) अपादान (D) करण<\/summary><p><b>उत्तर: (B)<\/b> देने की क्रिया में जिसके लिए दिया जाए (शिष्य), वह संप्रदान है। यहाँ कर्म 'ज्ञान' है, जिस पर क्रिया का फल पड़ा।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: 'घबराहट' शब्द है: (A) जातिवाचक संज्ञा (B) विशेषण (C) क्रिया से बनी भाववाचक संज्ञा (D) विशेषण से बनी भाववाचक संज्ञा<\/summary><p><b>उत्तर: (C)<\/b> घबराना (क्रिया) + आहट = घबराहट। गुरु ने क्रिया से बनी भाववाचक संज्ञाओं में 'घबराहट, सजावट' गिनाए हैं (पृ. १०१)। यह स्त्रीलिंग भी है (-हट)।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: 'लड़कों ने' में विभक्ति से पहले बहुवचन का विकृत रूप बनाने के लिए कौन-सा प्रत्यय लगा है? (A) ए (B) याँ (C) ओं (D) एँ<\/summary><p><b>उत्तर: (C)<\/b> विभक्ति आने पर बहुवचन का विकृत रूप 'ओं' से बनता है: लड़कों, घरों, बातों (पृ. २८४)। ईकारांत में 'यों': नदियों।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: कौन-सा शब्द सदा बहुवचन में प्रयुक्त होता है? (A) पुस्तक (B) समाचार (C) लड़का (D) नदी<\/summary><p><b>उत्तर: (B)<\/b> समाचार, प्राण, दाम, लोग, होश, भाग्य, दर्शन प्रायः बहुवचन ही में आते हैं (पृ. २६७)।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामताप्रसाद गुरु, <i>हिंदी व्याकरण<\/i>, हिंदी विकिस्रोत, पृष्ठ <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/९४\">९४–९७<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/९६\">९६<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/९९\">९९–१०४<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२३७\">२३७–२५७<\/a> (लिंग), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२५७\">२५७–२६७<\/a> (वचन), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२६९\">२६९–२७५, २८३–२८४, २९०–२९१, २९६<\/a> (कारक), <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/३१०\">३१०<\/a>; पिछले HTET प्रश्न (2020–2023)। 'ने' का नियम और विभक्तियों के प्रथमा-सप्तमी नाम स्कूली पाठ्यपुस्तकों की परिपाटी हैं।<\/p>\n","hin-pron":"<p class=\"key\"><b>HTET क्या पूछता है:<\/b> 2020 से 2023 तक 3 प्रश्न। इनमें से 2 में <b>निजवाचक सर्वनाम<\/b> पहचानना है (2020: आदरसूचक 'आप' और निजवाचक 'आप' का अंतर; 2022: अपना, स्वयं वाला वाक्य)। तीसरे (2023) में सर्वनाम के भेदों के बारे में <b>असत्य कथन<\/b> छाँटना है (पुरुषवाचक के भेद तीन हैं, चार नहीं)। इसलिए 'आप' के दोनों रूपों और छह भेदों की ठोस समझ ज़रूरी है। सर्वनाम और सार्वनामिक विशेषण का अंतर विशेषण वाले प्रश्नों (2024 Q38) में भी काम आता है।<\/p>\n\n<h2>परिचय<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> संज्ञा के स्थान पर प्रयोग होने वाले शब्द को <b>सर्वनाम<\/b> कहते हैं। जैसे: मैं, तुम, वह, यह, जो, कौन, कोई, कुछ।<\/div>\n<p>गुरु की परिभाषा: \"सर्वनाम उस विकारी शब्द को कहते हैं जो पूर्वापर संबंध से किसी भी संज्ञा के बदले उपयोग में आता है; जैसे मैं (बोलनेवाला), तू (सुननेवाला), यह (निकटवर्ती वस्तु), वह (दूरवर्ती वस्तु)\" (पृ. १०५)।<\/p>\n<h3>सर्वनाम की ज़रूरत क्या है<\/h3>\n<p>सोचिए कि सर्वनाम न हों तो यह वाक्य कैसा लगेगा: \"सुरेश ने सुरेश की किताब खोली और सुरेश पढ़ने लगा।\" इसे हम सहज रूप से कहते हैं: \"सुरेश ने अपनी किताब खोली और वह पढ़ने लगा।\" एक ही संज्ञा को बार-बार दोहराने से भाषा भद्दी और दरिद्र लगती है (गुरु, पृ. १०६)। सर्वनाम यही दोहराव बचाता है।<\/p>\n<p>पर सर्वनाम की एक और बड़ी ख़ूबी है। संज्ञा से सदा उसी वस्तु का बोध होता है जिसका वह नाम है ('लड़का' से लड़के का)। सर्वनाम से <b>प्रसंग के अनुसार<\/b> किसी भी वस्तु का बोध हो सकता है। 'वह' शब्द कभी लड़के के लिए, कभी किताब के लिए, कभी किसी विचार के लिए आता है (पृ. १०५)। यही उसे संज्ञा से अलग करता है।<\/p>\n<p><b>नाम की व्युत्पत्ति:<\/b> सर्व + नाम = सब नामों (संज्ञाओं) के बदले आने वाला शब्द। गुरु के अनुसार संस्कृत में 'सर्व' की तरह रूप बदलने वाले नामों को यह संज्ञा दी गई थी; हिंदी में 'सब नामों के बदले' वाला अर्थ चलता है (पृ. १०५)।<\/p>\n\n<h2>मूल अवधारणा: तीन पुरुष<\/h2>\n<p>सर्वनामों को समझने की कुंजी 'पुरुष' है। गुरु के अनुसार बोलने वाले की दृष्टि से पूरी सृष्टि के तीन भाग हैं: (1) स्वयं वक्ता या लेखक, (2) श्रोता या पाठक, (3) बाकी सब, यानी कथा का विषय। इन्हें ही उत्तम, मध्यम और अन्य पुरुष कहते हैं (पृ. १०६–१०७)।<\/p>\n<table>\n<tr><th>पुरुष<\/th><th>कौन<\/th><th>सर्वनाम<\/th><\/tr>\n<tr><td>उत्तम पुरुष<\/td><td>बोलने वाला<\/td><td>मैं, हम<\/td><\/tr>\n<tr><td>मध्यम पुरुष<\/td><td>सुनने वाला<\/td><td>तू, तुम, आप (आदर)<\/td><\/tr>\n<tr><td>अन्य पुरुष<\/td><td>जिसके बारे में बात हो<\/td><td>वह, वे, यह, ये, जो, कौन, कोई, सब संज्ञाएँ<\/td><\/tr>\n<\/table>\n<p>गुरु बताते हैं कि उत्तम और मध्यम पुरुष का अर्थ निश्चित रहता है, जबकि अन्य पुरुष में बाकी की पूरी सृष्टि आ जाती है। इसलिए सब संज्ञाएँ भी अन्य पुरुष हैं (पृ. १०७)।<\/p>\n\n<h2>गुरु के 11 सर्वनाम और 6 भेद<\/h2>\n<p>गुरु के अनुसार हिंदी में कुल <b>11 सर्वनाम<\/b> हैं: मैं, तू, आप, यह, वह, सो, जो, कोई, कुछ, कौन, क्या (पृ. १०६)। हम, तुम, ये, वे इनके बहुवचन-रूप हैं, अलग सर्वनाम नहीं। प्रयोग के आधार पर इन्हें <b>छह भेदों<\/b> में बाँटा गया है:<\/p>\n<div class=\"cards\">\n<div><h3>पुरुषवाचक<\/h3><p>वक्ता, श्रोता या अन्य के लिए<\/p><p class=\"eq\"><span>मैं<\/span> <span>तू<\/span> <span>वह<\/span><\/p><\/div>\n<div><h3>निजवाचक<\/h3><p>कर्ता स्वयं का बोध<\/p><p class=\"eq\"><span>आप<\/span> <span>अपना<\/span> <span>स्वयं<\/span><\/p><\/div>\n<div><h3>निश्चयवाचक<\/h3><p>पास या दूर की निश्चित वस्तु<\/p><p class=\"eq\"><span>यह<\/span> <span>वह<\/span> <span>सो<\/span><\/p><\/div>\n<div><h3>अनिश्चयवाचक<\/h3><p>किसी अनिश्चित का बोध<\/p><p class=\"eq\"><span>कोई<\/span> <span>कुछ<\/span><\/p><\/div>\n<div><h3>संबंधवाचक<\/h3><p>दो उपवाक्यों को जोड़े<\/p><p class=\"eq\"><span>जो<\/span> <span>सो<\/span><\/p><\/div>\n<div><h3>प्रश्नवाचक<\/h3><p>प्रश्न पूछने के लिए<\/p><p class=\"eq\"><span>कौन<\/span> <span>क्या<\/span><\/p><\/div>\n<\/div>\n<div class=\"trap\"><b>गुरु और स्कूली पुस्तकें:<\/b> गुरु पुरुषवाचक में मैं, तू और आदरसूचक आप गिनते हैं, और बाक़ी भेदों को अन्य पुरुष के उपभेद मानते हैं (पृ. १०७)। स्कूली पुस्तकें पुरुषवाचक के तीन भेद (उत्तम, मध्यम, अन्य) बताती हैं। दोनों में पुरुष तीन ही हैं, इसलिए 'पुरुषवाचक के चार भेद' कहने वाला वाक्य हमेशा असत्य है (HTET 2023 Q43)।<\/div>\n\n<h2>1. पुरुषवाचक सर्वनाम<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जो सर्वनाम बोलने वाले, सुनने वाले या किसी तीसरे के लिए आए, वह पुरुषवाचक है। इसके तीन भेद हैं: उत्तम, मध्यम, अन्य पुरुष।<\/div>\n<h3>उत्तम पुरुष: मैं, हम (पृ. १०८–११०)<\/h3>\n<ul>\n<li><b>मैं:<\/b> जब वक्ता केवल अपने बारे में कुछ कहे: \"यह थैली मुझे मिली है।\" अपने से बड़ों से बात करने में या देवता से प्रार्थना में भी 'मैं' आता है। स्त्रियाँ बहुधा अपने लिए 'मैं' ही बोलती हैं।<\/li>\n<li><b>हम:<\/b> गुरु बताते हैं कि 'हम' का अर्थ संज्ञा के बहुवचन से अलग है। 'लड़के' का मतलब एक से अधिक लड़के हैं, पर 'हम' का अर्थ एक से अधिक 'मैं' नहीं है। यह वक्ता और उसके साथियों का प्रतिनिधि है (पृ. १०८)। 'हम' इन अवसरों पर एक व्यक्ति के लिए भी आता है:\n<ul>\n<li>संपादक और लेखक अपने लिए: \"हमने एक ही बात को दो-दो तीन-तीन तरह से लिखा है।\"<\/li>\n<li>बड़े अधिकारी, राजा-महाराजा: \"इसलिए अब हम इश्तिहार देते हैं।\"<\/li>\n<li>अपने कुटुंब, देश या मनुष्य-जाति की ओर से: \"हवा के बिना हम पल भर भी नहीं जी सकते।\"<\/li>\n<li>अभिमान या क्रोध में।<\/li>\n<\/ul><\/li>\n<li>बहुत्व साफ़ करने के लिए 'हम लोग' कहते हैं।<\/li>\n<\/ul>\n<h3>मध्यम पुरुष: तू, तुम, आप (पृ. ११०–११२)<\/h3>\n<ul>\n<li><b>तू:<\/b> इसमें निरादर या हलकापन झलकता है, इसीलिए एक व्यक्ति के लिए भी बहुधा 'तुम' कहते हैं। पर 'तू' इन जगहों पर आता है: देवता के लिए (\"देव, तू दयालु, दीन हौं\"), छोटे बच्चे या चेले के लिए प्यार में, परम मित्र के लिए, अपने से छोटे के लिए, और तिरस्कार या क्रोध में।<\/li>\n<li><b>तुम:<\/b> रूप से बहुवचन है, पर शिष्टाचार में एक व्यक्ति के लिए चलता है। तिरस्कार और क्रोध को छोड़ बाक़ी जगह 'तू' के बदले 'तुम' चलता है। बहुत्व के लिए 'तुम लोग' कहते हैं।<\/li>\n<li><b>आप:<\/b> आदर के लिए, देखिए आगे।<\/li>\n<\/ul>\n<h3>अन्य पुरुष: वह, वे, यह, ये (पृ. ११२–११३)<\/h3>\n<p>हिंदी में अन्य पुरुष का कोई अलग सर्वनाम नहीं है; दूरवर्ती निश्चयवाचक 'वह' ही उसका काम करता है (पृ. १२०)। इसलिए यह, वह, जो, कौन, कोई सब अन्य पुरुष हैं। 'वह' के प्रयोग: किसी एक प्राणी या पदार्थ के बारे में बोलने के लिए; बड़े आदमी के प्रति तिरस्कार दिखाने के लिए; आदर और बहुत्व के लिए (वे)। बहुवचन का शुद्ध रूप 'वे' है, 'वह' नहीं (पृ. ११२)। एक ही व्यक्ति के आदर के लिए भी 'वे' आता है: \"वे असामान्य वैयाकरण थे।\"<\/p>\n\n<h2>2. आप के प्रयोग: आदरसूचक और निजवाचक<\/h2>\n<p>'आप' इस पृष्ठ का सबसे ज़रूरी शब्द है, क्योंकि HTET बार-बार इसी पर पूछता है। 'आप' दो अलग काम करता है और दोनों का भेद तय करना होता है।<\/p>\n<h3>(क) आदरसूचक 'आप' (पुरुषवाचक, पृ. ११३–११५)<\/h3>\n<ul>\n<li>मध्यम और अन्य पुरुष के लिए आदर में आता है। संस्कृत में इसके लिए 'भवान्' आता है।<\/li>\n<li><b>अपने से बड़े<\/b> के लिए 'तुम' के बदले 'आप' शिष्ट और आवश्यक है। <b>बराबर वाले<\/b> और कुछ छोटे के लिए भी बहुधा 'आप' कहने की प्रथा है।<\/li>\n<li>बहुत्व के साथ आदर जताने के लिए 'आप लोग' आता है।<\/li>\n<li>आदर और बढ़ाना हो तो बड़े अधिकारियों के लिए श्रीमान्, महाराज, सरकार, हुज़ूर आते हैं; अपने लिए नम्रता दिखाने को दास, सेवक आदि।<\/li>\n<li>इसके साथ क्रिया बहुवचन में आती है: \"आप बैठिए\", \"आप आए हैं\"।<\/li>\n<li>एक ही प्रसंग में 'आप' और 'तुम' मिलाना असंगत है (\"महाराज\" और \"आप\" भी साथ-साथ नहीं)।<\/li>\n<\/ul>\n<h3>(ख) निजवाचक 'आप' (पृ. ११६–११८)<\/h3>\n<div class=\"def\"><b>परिभाषा<\/b> जिस सर्वनाम से कर्ता स्वयं का बोध हो और जो उसी वाक्य के किसी संज्ञा या सर्वनाम के साथ आए, वह निजवाचक है। रूप: आप, अपना, अपने; साथ में स्वयं, खुद।<\/div>\n<p>गुरु के अनुसार निजवाचक 'आप' के प्रयोग:<\/p>\n<ul>\n<li><b>अवधारण (ज़ोर) के लिए:<\/b> \"मैं आप वहीं से आया हूँ।\" (अर्थ: मैं स्वयं।)<\/li>\n<li><b>दूसरे के निराकरण के लिए:<\/b> \"श्रीकृष्णजी ने ब्राह्मण को विदा किया और आप चलने का विचार करने लगे।\" \"वह अपने को सुधार रहा है।\"<\/li>\n<li><b>'ही' जोड़कर:<\/b> \"मैं तो आप ही आती थी।\"<\/li>\n<li><b>'अपना' के साथ:<\/b> \"अपने आप\", \"अपने आपको भूल गया।\"<\/li>\n<li>कभी अकेला अन्य पुरुष के बोध के लिए (\"आप रहे मख की रखवारी\"), और सर्वसाधारण के लिए (\"आप भला तो जग भला\")।<\/li>\n<li><b>'आपस':<\/b> परस्पर के अर्थ में, केवल संबंध और अधिकरण कारक में: \"आपस की फूट\", \"आपस में\"।<\/li>\n<li><b>'आपही आप', 'अपने आप':<\/b> मन से या स्वभाव से, क्रियाविशेषण की तरह: \"मेरा दिल आपसे आप उमड़ा आता है।\"<\/li>\n<\/ul>\n<p>'स्वयं', 'खुद', 'स्वतः' के बारे में गुरु लिखते हैं कि ये हिंदी में अव्यय हैं और क्रियाविशेषण जैसे चलते हैं, 'आप' के साथ आते हैं। आदरसूचक 'आप' के साथ दुहराव से बचने के लिए इनमें से एक लगाना आवश्यक है: \"आप खुद यह बात समझ सकते हैं\" (पृ. ११७)। स्कूली पुस्तकें 'स्वयं', 'खुद' को भी निजवाचक सर्वनाम की सूची में गिनती हैं, इसलिए HTET के विकल्पों में ये निजवाचक मानकर चलते हैं।<\/p>\n\n<h3>अंतर एक नज़र में (गुरु, पृ. ११६)<\/h3>\n<table>\n<tr><th>बिंदु<\/th><th>आदरसूचक आप<\/th><th>निजवाचक आप<\/th><\/tr>\n<tr><td>कौन-सा भेद<\/td><td>पुरुषवाचक<\/td><td>निजवाचक<\/td><\/tr>\n<tr><td>वाक्य में<\/td><td>अकेला आता है<\/td><td>किसी संज्ञा/सर्वनाम के साथ आता है<\/td><\/tr>\n<tr><td>पुरुष<\/td><td>केवल मध्यम और अन्य<\/td><td>तीनों पुरुषों में<\/td><\/tr>\n<tr><td>वचन<\/td><td>सदा बहुवचन<\/td><td>दोनों वचनों में एक ही रूप<\/td><\/tr>\n<tr><td>अर्थ<\/td><td>आप = आदरणीय आप<\/td><td>आप = स्वयं, खुद<\/td><\/tr>\n<tr><td>उदाहरण<\/td><td>आप बैठिए।<\/td><td>लड़का आप आया था।<\/td><\/tr>\n<\/table>\n<h3>वाक्यों में पहचान<\/h3>\n<table>\n<tr><th>वाक्य<\/th><th>'आप' का भेद<\/th><th>कारण<\/th><\/tr>\n<tr><td>आप अत्यंत आकर्षक व्यक्तित्व के स्वामी हैं।<\/td><td>आदरसूचक पुरुषवाचक<\/td><td>श्रोता से आदरपूर्वक<\/td><\/tr>\n<tr><td>आप लोग शांत हो जाएँ।<\/td><td>आदरसूचक पुरुषवाचक<\/td><td>श्रोताओं से आदर<\/td><\/tr>\n<tr><td>लड़के आप ही चले जाएँगे।<\/td><td>निजवाचक<\/td><td>'आप ही' = स्वयं, कर्ता 'लड़के' पहले आ चुका<\/td><\/tr>\n<tr><td>मैं आप वहीं से आया हूँ।<\/td><td>निजवाचक<\/td><td>'मैं' पर ज़ोर<\/td><\/tr>\n<tr><td>वह अपने को सुधार रहा है।<\/td><td>निजवाचक (अपने = आप का रूप)<\/td><td>कर्ता स्वयं<\/td><\/tr>\n<\/table>\n<p><b>कसौटी:<\/b> वाक्य से 'आप' हटाकर 'स्वयं' या 'खुद' लगाइए। अर्थ ठीक रहे और 'आप' से पहले कोई कर्ता (लड़के, मैं, वह) मौजूद हो तो निजवाचक। 'आप' से सीधे श्रोता को संबोधित किया जा रहा हो तो आदरसूचक।<\/p>\n\n<h2>3. निश्चयवाचक सर्वनाम<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिस सर्वनाम से वक्ता के पास या दूर की किसी वस्तु का बोध हो, वह निश्चयवाचक है। ये तीन हैं: यह, वह, सो। (गुरु, पृ. ११८)<\/div>\n<ul>\n<li><b>यह, ये:<\/b> निकट की वस्तु के लिए (\"यह किसका पराक्रमी बालक है?\"); पहले कही संज्ञा या वाक्य के बदले (\"माधवीलता तो मेरी बहिन है, इसे क्यों न सींचती?\"); आगे आने वाले वाक्य के बदले (\"उन्होंने यह चाहा कि...\"); और आदर या बहुत्व के लिए।<\/li>\n<li><b>वह, वे:<\/b> दूर की वस्तु के लिए; अन्य पुरुष के रूप में।<\/li>\n<li><b>सो:<\/b> दोनों वचनों में एक-सा। बहुधा 'जो' के साथ आता है और अर्थ 'वह' या 'वे' होता है: \"जो बोले सो घी को जाए।\" अलग वाक्य में 'वह' की तरह अकेला 'सो' नहीं आता (पृ. १२१)।<\/li>\n<li><b>दो वस्तुओं में:<\/b> पहले कही हुई दो वस्तुओं में से पहली के लिए 'वह' और पिछली के लिए 'यह': \"महात्मा और दुरात्मा में इतना ही भेद है कि उनके मन, वचन, कर्म एक रहते हैं, इनके भिन्न-भिन्न\" (पृ. १२०)।<\/li>\n<li>अवधारण के लिए 'ही' जुड़ता है: यही, वही, सोई (पृ. १३१)।<\/li>\n<\/ul>\n\n<h2>4. अनिश्चयवाचक सर्वनाम<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जिस सर्वनाम से किसी विशेष वस्तु का बोध न हो, वह अनिश्चयवाचक है। ये दो हैं: कोई, कुछ। (गुरु, पृ. १२१–१२२)<\/div>\n<p>साधारण अंतर: <b>'कोई' पुरुष (प्राणी) के लिए<\/b> और <b>'कुछ' पदार्थ या धर्म के लिए<\/b> (पृ. १२२)।<\/p>\n<ul>\n<li><b>कोई:<\/b> अज्ञात पुरुष या बड़े जंतु के लिए (\"दरवाज़े पर कोई खड़ा है\"); बहुत से ज्ञात पुरुषों में से किसी अनिश्चित के लिए; दोनों वचनों में। 'कोई एक', 'कोई और', 'हर कोई', 'सब कोई' (सब लोग)। निषेध वाक्य में 'कोई' का अर्थ 'सब' होता है।<\/li>\n<li><b>कुछ:<\/b> किसी अज्ञात पदार्थ या धर्म के लिए (\"घी में कुछ मिला है\"); छोटे जंतु या पदार्थ के लिए (\"पानी में कुछ है\")। 'सब कुछ' (सब पदार्थ), 'बहुत कुछ', 'कुछ और', 'कुछ का कुछ' (विपरीत)। 'कुछ' का रूपांतर नहीं होता।<\/li>\n<li>अवधारण के लिए 'कोई न कोई', 'कुछ न कुछ'; अनिश्चय में 'भी': 'कोई भी', 'कुछ भी' (पृ. १३१)।<\/li>\n<\/ul>\n\n<h2>5. संबंधवाचक सर्वनाम<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> जो सर्वनाम दो उपवाक्यों को जोड़े और जिसके साथ दूसरे उपवाक्य में नित्य-संबंधी सर्वनाम (वह या सो) आए, वह संबंधवाचक है। हिंदी में एक ही है: <b>जो<\/b>। (गुरु, पृ. १२५–१२६)<\/div>\n<ul>\n<li><b>जो + वह/सो:<\/b> \"जो परिश्रम करेगा, वह सफल होगा।\" 'जो' वाले उपवाक्य का संबंध दूसरे उपवाक्य के 'वह' से रहता है। 'वह' संबंधवाचक के साथ आने पर नित्य-संबंधी सर्वनाम कहलाता है।<\/li>\n<li>दोनों एक ही संज्ञा के बदले आते हैं: \"राजा भीष्मक का बड़ा बेटा, जिसका नाम रुक्म था, झुँझलाकर बोला।\"<\/li>\n<li>'जो' दोनों वचनों में एक-सा है। आदर और बहुत्व में भी आता है। समूह के अर्थ में द्विरुक्ति: \"जो जो कहा, सो सो किया।\"<\/li>\n<li>'जो कोई', 'जो कुछ': \"जो कुछ कहो, सोच-समझकर कहो।\"<\/li>\n<li>कभी-कभी 'जो' समुच्चयबोधक की तरह 'यदि' या 'कि' के अर्थ में आता है।<\/li>\n<\/ul>\n\n<h2>6. प्रश्नवाचक सर्वनाम<\/h2>\n<div class=\"def\"><b>परिभाषा<\/b> प्रश्न करने के लिए जिन सर्वनामों का प्रयोग हो, वे प्रश्नवाचक हैं: कौन, क्या। (गुरु, पृ. १२८)<\/div>\n<p>'कौन' और 'क्या' में वही अंतर है जो 'कोई' और 'कुछ' में है: <b>'कौन' प्राणियों (विशेषकर मनुष्यों) के लिए<\/b>, <b>'क्या' क्षुद्र प्राणी, पदार्थ या धर्म के लिए<\/b> (पृ. १२८)।<\/p>\n<ul>\n<li><b>कौन:<\/b> निर्धारण में तीनों के लिए (\"वह कौन?\", \"तुम्हारा घर कौन-सा है?\"); तिरस्कार में (\"रोकने वाली तुम कौन हो!\"); आश्चर्य में; द्विरुक्ति से अनेकता (\"सभा में कौन-कौन आए थे?\")।<\/li>\n<li><b>क्या:<\/b> लक्षण पूछने के लिए (\"आत्मा क्या है?\"); तिरस्कार, आश्चर्य, धमकी, दशा बताने में; क्रियाविशेषण की तरह भी।<\/li>\n<li>'कौन' का रूप 'किसे/किसको' होकर 'कहना' क्रिया के साथ आता है: \"नदी किसे कहते हैं?\"<\/li>\n<\/ul>\n<h3>प्रश्नवाचक या अनिश्चयवाचक<\/h3>\n<p>'कौन आया है?' (प्रश्न), 'कोई आया है' (अनिश्चित)। 'क्या हुआ?' (प्रश्न), 'कुछ हुआ' (अनिश्चित)। जो सर्वनाम प्रश्न का रूप ले, वह प्रश्नवाचक; जो केवल अनिश्चित बताए, अनिश्चयवाचक।<\/p>\n\n<h2>सर्वनाम और सार्वनामिक विशेषण<\/h2>\n<p>पुरुषवाचक और निजवाचक को छोड़कर बाकी सर्वनाम <b>संज्ञा के साथ आकर<\/b> विशेषण का काम भी करते हैं। गुरु का सूत्र: जब ये अकेले आते हैं तो सर्वनाम, और जब इनके साथ संज्ञा आती है तब विशेषण (पृ. १३८–१३९)।<\/p>\n<table>\n<tr><th>वाक्य<\/th><th>शब्द<\/th><th>भेद<\/th><\/tr>\n<tr><td>नौकर आया है; वह बाहर खड़ा है।<\/td><td>वह<\/td><td>सर्वनाम (संज्ञा के बदले)<\/td><\/tr>\n<tr><td>वह नौकर नहीं आया।<\/td><td>वह<\/td><td>सार्वनामिक विशेषण (नौकर की व्याप्ति सीमित)<\/td><\/tr>\n<tr><td>किसी को बुलाओ।<\/td><td>किसी<\/td><td>सर्वनाम<\/td><\/tr>\n<tr><td>किसी ब्राह्मण को बुलाओ।<\/td><td>किसी<\/td><td>सार्वनामिक विशेषण<\/td><\/tr>\n<tr><td>यह पुस्तक किससे मँगवाऊँ?<\/td><td>यह / किससे<\/td><td>यह: विशेषण; किससे: सर्वनाम<\/td><\/tr>\n<tr><td>कौन आया? / कौन मनुष्य आया?<\/td><td>कौन<\/td><td>सर्वनाम / विशेषण<\/td><\/tr>\n<\/table>\n<p>मैं, तू, आप संज्ञा के साथ आकर उसकी व्याप्ति सीमित नहीं करते, इसलिए ये विशेषण नहीं बनते: \"मैं मोहनलाल इकरार करता हूँ\" में 'मैं' विशेषण नहीं, अलग सर्वनाम है, जिसे 'मोहनलाल' स्पष्ट कर रहा है (पृ. १३९)।<\/p>\n<h3>यौगिक सर्वनाम (पृ. १३५, १४०)<\/h3>\n<p>यह, वह, सो, जो, कौन के विकृत रूप इस, उस, तिस, जिस, किस हैं। इनके अंत में 'तना' लगाने से परिमाणवाचक और 'ऐ/वै + सा' से गुणवाचक विशेषण बनते हैं:<\/p>\n<table>\n<tr><th>सर्वनाम<\/th><th>परिमाणवाचक<\/th><th>गुणवाचक<\/th><\/tr>\n<tr><td>यह<\/td><td>इतना<\/td><td>ऐसा<\/td><\/tr>\n<tr><td>वह<\/td><td>उतना<\/td><td>वैसा<\/td><\/tr>\n<tr><td>जो<\/td><td>जितना<\/td><td>जैसा<\/td><\/tr>\n<tr><td>कौन<\/td><td>कितना<\/td><td>कैसा<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>ध्यान दें:<\/b> स्कूली पुस्तकें 'जैसा-वैसा', 'जितना-उतना', 'कैसा', 'ऐसा' को संबंधवाचक या प्रश्नवाचक सर्वनाम की सूची में दे देती हैं। गुरु इन्हें सर्वनामों से बने <b>यौगिक सार्वनामिक विशेषण<\/b> मानते हैं, और बिना संज्ञा के आने पर संज्ञा की तरह प्रयोग (पृ. १४०)। HTET की भाषा में 'तेते पाँव पसारिये, जेती लाँबी सौर' का 'जेती', 'तेते' निजवाचक नहीं हैं।<\/div>\n\n<h2>सर्वनाम के साथ कारक-चिह्न
