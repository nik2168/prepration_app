uo;कि&rsquo; वाला कर्म-उपवाक्य<\/td><\/tr>\n<\/table>\n\n<h2>अर्थ के आधार पर आठ भेद<\/h2>\n<p>गुरु (अंक ५०६-क, पृ. ४९९–५००) अर्थ के अनुसार वाक्य आठ प्रकार के गिनाते हैं। स्कूल में भी यही आठ पढ़ाए जाते हैं।<\/p>\n<div class=\"cards\">\n<div><h3>1. विधानवाचक<\/h3><p>किसी बात का होना/कथन<\/p><p>मनुष्य अन्न खाता है। इंदौर पहले एक गाँव था।<\/p><\/div>\n<div><h3>2. निषेधवाचक<\/h3><p>किसी बात का अभाव (नहीं, न)<\/p><p>आपका जाना उचित नहीं है।<\/p><\/div>\n<div><h3>3. आज्ञावाचक<\/h3><p>आज्ञा, विनती, उपदेश<\/p><p>वहाँ मत जाना। माता-पिता का कहना मानो।<\/p><\/div>\n<div><h3>4. प्रश्नवाचक<\/h3><p>प्रश्न पूछना<\/p><p>यह लड़का कौन है?<\/p><\/div>\n<div><h3>5. विस्मयादिबोधक<\/h3><p>आश्चर्य, हर्ष, शोक आदि भाव<\/p><p>वह कैसा मूर्ख है!<\/p><\/div>\n<div><h3>6. इच्छावाचक<\/h3><p>इच्छा या आशीर्वाद<\/p><p>ईश्वर सबका भला करे। तुम्हारी बढ़ती हो।<\/p><\/div>\n<div><h3>7. संदेहवाचक<\/h3><p>संदेह या संभावना<\/p><p>शायद आज पानी बरसे। गाड़ी आती होगी।<\/p><\/div>\n<div><h3>8. संकेतवाचक<\/h3><p>शर्त; एक क्रिया दूसरी पर निर्भर<\/p><p>पानी न बरसता तो धान सूख जाता।<\/p><\/div>\n<\/div>\n<p><b>गुरु के नाम:<\/b> विधानार्थक, निषेधवाचक, आज्ञार्थक, प्रश्नार्थक, विस्मयादिबोधक, इच्छाबोधक, संदेहसूचक, संकेतार्थक। स्कूल और HTET में &lsquo;-वाचक/-बोधक/-सूचक&rsquo; की भिन्न-भिन्न छाप दिखती है (जैसे &lsquo;निषेधबोधक&rsquo;, &lsquo;संकेतार्थक&rsquo;), पर अर्थ वही रहता है।<\/p>\n<h3>पहचान के संकेत<\/h3>\n<table>\n<tr><th>भेद<\/th><th>पहचान-संकेत<\/th><th>अंत में/बीच में<\/th><\/tr>\n<tr><td>विधानवाचक<\/td><td>सीधा कथन<\/td><td>है, था, गा<\/td><\/tr>\n<tr><td>निषेधवाचक<\/td><td>नहीं, न, मत (वाक्य का कथन उलटा)<\/td><td>नहीं है, न होगा<\/td><\/tr>\n<tr><td>आज्ञावाचक<\/td><td>क्रिया आज्ञा रूप में; पुरुष मध्यम<\/td><td>जाओ, कीजिए, मत जाना<\/td><\/tr>\n<tr><td>प्रश्नवाचक<\/td><td>क्या, कौन, क्यों, कैसे, कब; चिह्न (?)<\/td><td>?<\/td><\/tr>\n<tr><td>विस्मयादिबोधक<\/td><td>अरे, वाह, हाय, कैसा, कितना; चिह्न (!)<\/td><td>!<\/td><\/tr>\n<tr><td>इच्छावाचक<\/td><td>कामना, आशीष, शुभकामना<\/td><td>करे, हो, जीओ<\/td><\/tr>\n<tr><td>संदेहवाचक<\/td><td>शायद, संभवतः, कदाचित्, हो सकता है; होगा<\/td><td>आता होगा<\/td><\/tr>\n<tr><td>संकेतवाचक<\/td><td>यदि&mdash;तो, जो&mdash;तो, अगर&mdash;तो; शर्त<\/td><td>(तो) होता, करता<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>HTET 2021 Q44 में गलत जोड़ी:<\/b> &ldquo;हो सकता है वह आज शाम को आए&rdquo; को <i>इच्छाबोधक<\/i> कहा गया था। इसमें कोई कामना नहीं, <b>संभावना/संदेह<\/b> है, इसलिए यह <b>संदेहवाचक<\/b> है। गुरु के अनुसार संदेहसूचक वाक्य &ldquo;संदेह या संभावना&rdquo; और इच्छाबोधक &ldquo;इच्छा वा आशीष&rdquo; प्रकट करता है (पृ. ५००)। &lsquo;हो सकता है, शायद, संभवतः&rsquo; आते ही संदेहवाचक सोचिए।<\/div>\n<div class=\"trap\"><b>मिलते-जुलते:<\/b> &ldquo;समय पर भोजन करोगे तो स्वस्थ रहोगे&rdquo; में &lsquo;तो&rsquo; शर्त बताता है: संकेतार्थक/संकेतवाचक। &ldquo;मैंने माँ का कहना नहीं माना&rdquo; में &lsquo;नहीं&rsquo; है: निषेधवाचक। &ldquo;दुष्ट! तुझे धिक्कार है!&rdquo; में तिरस्कार का भाव है: विस्मयादिबोधक।<\/div>\n\n<h2>वाक्य-रूपांतरण<\/h2>\n<h3>रचना बदलना (सरल &harr; संयुक्त &harr; मिश्र)<\/h3>\n<p>नियम: आश्रित उपवाक्य को एक शब्द या वाक्यांश में बदल दें तो वाक्य सरल हो जाता है; सरल वाक्य के एक शब्द को उपवाक्य बना दें तो मिश्र बन जाता है (गुरु, पृ. ६२२)। संयुक्त बनाने के लिए दो स्वतंत्र वाक्यों को &lsquo;और/परंतु/इसलिए&rsquo; से जोड़ते हैं।<\/p>\n<table>\n<tr><th>सरल<\/th><th>संयुक्त<\/th><th>मिश्र<\/th><\/tr>\n<tr><td>सूर्योदय होते ही हम चल पड़े।<\/td><td>सूर्य निकला और हम चल पड़े।<\/td><td>जैसे ही सूर्य निकला, हम चल पड़े।<\/td><\/tr>\n<tr><td>बीमार होने के कारण वह नहीं आया।<\/td><td>वह बीमार था, इसलिए नहीं आया।<\/td><td>वह नहीं आया क्योंकि वह बीमार था।<\/td><\/tr>\n<tr><td>धनवान मनुष्य को सब चाहते हैं।<\/td><td>मनुष्य धनवान है और उसे सब चाहते हैं।<\/td><td>जो मनुष्य धनवान है, उसे सब चाहते हैं।<\/td><\/tr>\n<\/table>\n<h3>अर्थ बदलना (विधान &harr; निषेध, विधान &harr; प्रश्न आदि)<\/h3>\n<ul>\n<li><b>विधान &rarr; निषेध:<\/b> &lsquo;वह ईमानदार है&rsquo; &rarr; &lsquo;वह बेईमान नहीं है&rsquo; (विलोम शब्द या &lsquo;नहीं&rsquo; लगाएँ; अर्थ वही रहे)।<\/li>\n<li><b>विधान &rarr; प्रश्न:<\/b> &lsquo;वह जा रहा है&rsquo; &rarr; &lsquo;क्या वह जा रहा है?&rsquo;<\/li>\n<li><b>विधान &rarr; आज्ञा:<\/b> &lsquo;तुम पढ़ते हो&rsquo; &rarr; &lsquo;तुम पढ़ो&rsquo;।<\/li>\n<li><b>विधान &rarr; संदेह:<\/b> &lsquo;वह आएगा&rsquo; &rarr; &lsquo;शायद वह आए&rsquo; / &lsquo;वह आता होगा&rsquo;।<\/li>\n<li><b>विधान &rarr; विस्मय:<\/b> &lsquo;वह बहुत सुंदर है&rsquo; &rarr; &lsquo;वह कितना सुंदर है!&rsquo;<\/li>\n<li><b>विधान &rarr; संकेत:<\/b> &lsquo;वर्षा हुई, फ़सल अच्छी हुई&rsquo; &rarr; &lsquo;यदि वर्षा होती तो फ़सल अच्छी होती&rsquo;।<\/li>\n<\/ul>\n<div class=\"trap\"><b>ध्यान दें:<\/b> रूपांतरण में अर्थ न बदले। &lsquo;सुंदर&rsquo; का &lsquo;असुंदर नहीं&rsquo; बन सकता है, पर &lsquo;अच्छा&rsquo; का &lsquo;बुरा नहीं&rsquo; वही अर्थ नहीं देता (&lsquo;ठीक-ठाक&rsquo; का भाव आ जाता है)। विधान को निषेध बनाने पर उसके विलोम का ही प्रयोग कीजिए।<\/div>\n\n<h2>वाक्य-शुद्धि: त्रुटि के प्रकार<\/h2>\n<p>वाक्य अशुद्ध तब होता है जब ऊपर की तीन कसौटियों या व्याकरण के नियमों में से कोई टूटे। नीचे अशुद्धियाँ <b>किस्म<\/b> के हिसाब से हैं। जहाँ स्रोत गुरु है, पृष्ठ दिया है; बाकी स्कूल का सामान्य नियम है।<\/p>\n\n<h3>1. लिंग-दोष<\/h3>\n<p>क्रिया, विशेषण या संबंध-कारक का लिंग कर्ता/कर्म/विशेष्य के लिंग के अनुसार होना चाहिए (गुरु का &lsquo;अन्वय&rsquo;, अंक ५०७-क, पृ. ५००)।<\/p>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>लड़कियाँ पढ़ता है।<\/td><td>लड़कियाँ पढ़ती हैं।<\/td><td>कर्ता स्त्रीलिंग बहुवचन<\/td><\/tr>\n<tr><td>मैंने रोटी खाया।<\/td><td>मैंने रोटी खाई।<\/td><td>कर्म &lsquo;रोटी&rsquo; स्त्रीलिंग; क्रिया कर्म के अनुसार<\/td><\/tr>\n<tr><td>वह एक अच्छा लड़की है।<\/td><td>वह एक अच्छी लड़की है।<\/td><td>विशेषण विशेष्य के अनुसार<\/td><\/tr>\n<\/table>\n<h3>2. वचन-दोष<\/h3>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>लड़के खेलता है।<\/td><td>लड़के खेलते हैं।<\/td><td>बहुवचन कर्ता, बहुवचन क्रिया<\/td><\/tr>\n<tr><td>मेरे पास बहुत सारी पुस्तक हैं।<\/td><td>मेरे पास बहुत सारी पुस्तकें हैं।<\/td><td>संज्ञा का बहुवचन रूप<\/td><\/tr>\n<tr><td>सभी विद्यार्थी उपस्थित है।<\/td><td>सभी विद्यार्थी उपस्थित हैं।<\/td><td>&lsquo;सभी&rsquo; के साथ बहुवचन क्रिया<\/td><\/tr>\n<\/table>\n<h3>3. कारक या विभक्ति-दोष<\/h3>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>यह काम कोई वकील से ही हो सकता है।<\/td><td>यह काम किसी वकील से ही हो सकता है।<\/td><td>विभक्ति लगने पर &lsquo;कोई&rsquo; का रूप &lsquo;किसी&rsquo; हो जाता है (जैसे &lsquo;किसी को&rsquo;)<\/td><\/tr>\n<tr><td>मैंने उनका धन्यवाद किया।<\/td><td>मैंने उन्हें धन्यवाद दिया।<\/td><td>&lsquo;धन्यवाद&rsquo; दिया जाता है, किया नहीं; &lsquo;उन्हें&rsquo; संप्रदान<\/td><\/tr>\n<tr><td>मेरे से वहाँ नहीं जाया जाएगा।<\/td><td>मुझसे वहाँ नहीं जाया जाएगा।<\/td><td>सर्वनाम के साथ &lsquo;से&rsquo;: &lsquo;मुझसे&rsquo;<\/td><\/tr>\n<tr><td>मेरे से लोग<\/td><td>मुझसे लोग<\/td><td>गुरु (पृ. २०९): समता कहनेवाले (मैं) से की जाती है, उसके संबंधी से नहीं<\/td><\/tr>\n<tr><td>वह पाँव से जूता उतार रहा है।<\/td><td>(शुद्ध है)<\/td><td>यहाँ &lsquo;से&rsquo; करण/साधन में ठीक है; अशुद्ध मत मानिए<\/td><\/tr>\n<\/table>\n<p>गुरु का &lsquo;अधिकार&rsquo; (अंक ५०७-ख): किसी शब्द के प्रयोग से दूसरी संज्ञा या सर्वनाम किसी विशेष कारक में आती है, जैसे &ldquo;लड़का बंदर <b>से<\/b> डरता है&rdquo; (&lsquo;डरना&rsquo; के साथ अपादान &lsquo;से&rsquo;)। अशुद्ध प्रयोग इसी नियम को तोड़ने से बनते हैं।<\/p>\n<h3>4. अन्वय-दोष (कर्ता, कर्म, क्रिया का मेल)<\/h3>\n<p>गुरु (अंक ५०७-क): दो शब्दों में लिंग, वचन, पुरुष, कारक या काल की समानता को <b>अन्वय<\/b> कहते हैं: &ldquo;छोटा लड़का रोता है&rdquo; में &lsquo;छोटा&rsquo; का &lsquo;लड़का&rsquo; से लिंग-वचन का और &lsquo;रोता है&rsquo; का लिंग-वचन-पुरुष का अन्वय है।<\/p>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>मैं जाता हो।<\/td><td>मैं जाता हूँ।<\/td><td>पुरुष के अनुसार सहायक क्रिया (मैं&mdash;हूँ)<\/td><\/tr>\n<tr><td>राम और श्याम गया।<\/td><td>राम और श्याम गए।<\/td><td>दो कर्ता, बहुवचन क्रिया<\/td><\/tr>\n<tr><td>तुम कल आया था।<\/td><td>तुम कल आए थे।<\/td><td>&lsquo;तुम&rsquo; के साथ बहुवचन क्रिया<\/td><\/tr>\n<tr><td>शीला ने पुस्तक पढ़ा।<\/td><td>शीला ने पुस्तक पढ़ी।<\/td><td>&lsquo;ने&rsquo; वाले वाक्य में क्रिया कर्म के अनुसार<\/td><\/tr>\n<\/table>\n<h3>5. शब्द-क्रम (आसक्ति) दोष<\/h3>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>मैंने रोटी खाई एक।<\/td><td>मैंने एक रोटी खाई।<\/td><td>विशेषण संज्ञा के पहले<\/td><\/tr>\n<tr><td>पुस्तक पढ़ता राम है।<\/td><td>राम पुस्तक पढ़ता है।<\/td><td>क्रम: कर्ता, कर्म, क्रिया<\/td><\/tr>\n<tr><td>मैंने केवल उसे पाँच रुपये दिए (जब अर्थ &lsquo;सिर्फ़ पाँच&rsquo; हो)<\/td><td>मैंने उसे केवल पाँच रुपये दिए।<\/td><td>&lsquo;केवल/ही/भी&rsquo; उसी शब्द के पास रखें जिस पर बल हो<\/td><\/tr>\n<\/table>\n<p>गुरु (पृ. २०६, अंक २३६) का उदाहरण: उर्दू रचना में संबंधसूचक संज्ञा से पहले आता है (&lsquo;साथ होशियारी के करो&rsquo;); हिंदी में यह रचना कम होती है; हिंदी में &lsquo;होशियारी के साथ&rsquo; कहना शुद्ध है।<\/p>\n<h3>6. पुनरुक्ति या द्विरुक्ति (दोहराव)<\/h3>\n<p>जब वही अर्थ दो बार कहा जाए तो वाक्य दोषपूर्ण होता है।<\/p>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>कृपया दरवाज़ा बंद करने की कृपा करें।<\/td><td>कृपया दरवाज़ा बंद कीजिए।<\/td><td>&lsquo;कृपया&rsquo; और &lsquo;कृपा&rsquo; का दोहराव<\/td><\/tr>\n<tr><td>वह अत्यंत सुंदरतम है।<\/td><td>वह सुंदरतम है / वह अत्यंत सुंदर है।<\/td><td>&lsquo;अत्यंत&rsquo; और &lsquo;तम&rsquo; दोनों उत्कृष्टता बताते हैं<\/td><\/tr>\n<tr><td>सब लोग एक साथ मिलकर चलें।<\/td><td>सब लोग साथ चलें।<\/td><td>साथ और मिलकर में अर्थ दोहराव<\/td><\/tr>\n<tr><td>आज के इस युग में<\/td><td>आज के युग में<\/td><td>&lsquo;आज के&rsquo; और &lsquo;इस&rsquo; में दोहराव<\/td><\/tr>\n<\/table>\n<h3>7. शब्द-चयन और विशेषण-रूप का दोष<\/h3>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>हम सभी में मनुष्यी दुर्बलताएँ हैं।<\/td><td>हम सभी में मानवीय दुर्बलताएँ हैं।<\/td><td>&lsquo;मनुष्यी&rsquo; शब्द ही नहीं; विशेषण &lsquo;मानवीय&rsquo; या &lsquo;मानवोचित&rsquo;<\/td><\/tr>\n<tr><td>तुम्हारा व्यवहार सर्वश्रेष्ठतम है।<\/td><td>तुम्हारा व्यवहार सर्वश्रेष्ठ है।<\/td><td>&lsquo;सर्व&rsquo; से श्रेष्ठता पूरी हो चुकी<\/td><\/tr>\n<tr><td>उसने मुझे शुभकामनाएँ दीं और धन्यवाद किया।<\/td><td>...और मैंने धन्यवाद दिया।<\/td><td>&lsquo;धन्यवाद&rsquo; दिया जाता है (क्रिया-प्रयोग)<\/td><\/tr>\n<\/table>\n<h3>8. काल या पुरुष-दोष<\/h3>\n<table>\n<tr><th>अशुद्ध<\/th><th>शुद्ध<\/th><th>कारण<\/th><\/tr>\n<tr><td>कल मैं स्कूल जाता हूँ।<\/td><td>कल मैं स्कूल जाऊँगा।<\/td><td>&lsquo;कल&rsquo; (भविष्य) के साथ भविष्यत् क्रिया<\/td><\/tr>\n<tr><td>तू बहुत अच्छे हो।<\/td><td>तू बहुत अच्छा है / तुम बहुत अच्छे हो।<\/td><td>मध्यम पुरुष में &lsquo;तू&rsquo; के साथ &lsquo;है&rsquo;<\/td><\/tr>\n<\/table>\n<div class=\"trap\"><b>गुरु से जुड़े कुछ और तथ्य:<\/b> (1) &lsquo;भर&rsquo; और &lsquo;तक&rsquo; के साथ संज्ञा का विकृत रूप आता है: &lsquo;कटोरे-भर खून&rsquo; शुद्ध है, &lsquo;कटोरी-भर&rsquo; अशुद्ध (पृ. २१०)। (2) &lsquo;न&rsquo; को क्रिया के प्रत्यय के बीच नहीं लगाया जाता (पृ. १९०)। (3) &lsquo;के अनुसार&rsquo; में &lsquo;के&rsquo; लगता है, पर स्वरादि संस्कृत शब्द के साथ संधि हो जाती है: &lsquo;आज्ञानुसार&rsquo; (पृ. २०७)। (4) &lsquo;व&rsquo; और &lsquo;वा&rsquo; में भ्रम न करें: &lsquo;व&rsquo; = और, &lsquo;वा&rsquo; = या (पृ. २१६)।<\/div>\n\n<h2>पहचान की विधि<\/h2>\n<p><b>शुद्ध/अशुद्ध वाक्य चुनने के प्रश्न में:<\/b><\/p>\n<ol class=\"steps\">\n<li>कर्ता और क्रिया के <b>लिंग, वचन, पुरुष<\/b> का मेल देखिए (अन्वय)।<\/li>\n<li>सर्वनाम/संज्ञा के साथ <b>विभक्ति<\/b> का रूप देखिए (किसी/कोई, मुझसे/मेरे से, उन्हें/उनका)।<\/li>\n<li>क्रिया का <b>प्रयोग<\/b> देखिए (धन्यवाद देना, आशीर्वाद देना, प्रणाम करना, भोजन करना)।<\/li>\n<li>एक ही अर्थ दो बार तो नहीं आया? (द्विरुक्ति/पुनरुक्ति)।<\/li>\n<li>विशेषण-शब्द का <b>रूप<\/b> सही है? (मानवीय, मानवोचित; मनुष्यी नहीं)।<\/li>\n<li>शब्द-क्रम और बल देनेवाले शब्द (ही, भी, केवल) सही जगह हैं?<\/li>\n<li>इन सब जाँचों में से किसी एक में भी दोष मिले तो वाक्य अशुद्ध है।<\/li>\n<\/ol>\n<p><b>वाक्य-भेद चुनने के प्रश्न में:<\/b> पहले रचना (क्रियाएँ गिनें; और/कि/जो/यदि देखें), फिर अर्थ (शर्त, प्रश्न, संभावना, कामना, निषेध)। सुमेल में सबसे पहले <b>शब्द-संकेत<\/b> (शायद, हो सकता है, यदि, मत, !) खोजिए।<\/p>\n\n<h2>भ्रम वाले जोड़े<\/h2>\n<table>\n<tr><th>जोड़ा<\/th><th>फ़र्क कैसे करें<\/th><\/tr>\n<tr><td>संयुक्त बनाम मिश्र वाक्य<\/td><td>संयुक्त में उपवाक्य बराबर (और, पर, या); मिश्र में एक आश्रित (कि, जो, जब, यदि)<\/td><\/tr>\n<tr><td>इच्छावाचक बनाम संदेहवाचक<\/td><td>कामना/आशीर्वाद = इच्छा; शायद/हो सकता है = संदेह<\/td><\/tr>\n<tr><td>संकेतवाचक बनाम सामान्य मिश्र<\/td><td>शर्त (यदि&mdash;तो, ...तो होता) = संकेतवाचक; रचना की दृष्टि से वह मिश्र भी है<\/td><\/tr>\n<tr><td>वाक्यांश बनाम उपवाक्य<\/td><td>उपवाक्य में अपनी क्रिया होती है; वाक्यांश में नहीं<\/td><\/tr>\n<tr><td>निषेधवाचक बनाम विधानवाचक<\/td><td>&lsquo;नहीं, न, मत&rsquo; होने पर निषेध; पर &lsquo;नहीं तो&rsquo; विभाजक है, निषेध नहीं<\/td><\/tr>\n<tr><td>आज्ञावाचक बनाम इच्छावाचक<\/td><td>सीधे आदेश/विनती = आज्ञा; कामना/आशीर्वाद = इच्छा<\/td><\/tr>\n<\/table>\n\n<h2>HTET के प्रश्न, हल सहित<\/h2>\n\n<h3>HTET 2020 Q38<\/h3>\n<p>शुद्ध वाक्य का चयन कीजिए: (A) यह काम कोई वकील से ही हो सकता है। (B) मैंने उनका धन्यवाद किया। (C) कृपया दरवाज़ा बंद करने की कृपा करें। (D) हम सभी में मानवीय दुर्बलताएँ हैं।<\/p>\n<div class=\"ex\"><b>उत्तर: (D)<\/b>\n<ol class=\"steps\">\n<li>A: &lsquo;कोई वकील से&rsquo; अशुद्ध; विभक्ति &lsquo;से&rsquo; लगने पर &lsquo;किसी वकील से&rsquo; होना चाहिए (गुरु पृ. १२२)।<\/li>\n<li>B: धन्यवाद &lsquo;दिया&rsquo; जाता है, &lsquo;किया&rsquo; नहीं, और &lsquo;उनका&rsquo; की जगह &lsquo;उन्हें&rsquo;। अशुद्ध।<\/li>\n<li>C: &lsquo;कृपया&rsquo; और &lsquo;कृपा करें&rsquo; में पुनरुक्ति। अशुद्ध।<\/li>\n<li>D: &lsquo;मानवीय दुर्बलताएँ&rsquo; शुद्ध; कर्ता &lsquo;हम सभी&rsquo; का &lsquo;में&rsquo; के साथ प्रयोग सही।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2021 Q44<\/h3>\n<p>वाक्य के संदर्भ में कौन-सा विकल्प सुमेलित <b>नहीं<\/b> है? (A) दुष्ट! तुझे धिक्कार है। &mdash; विस्मयादिबोधक वाक्य (B) मैंने माँ का कहना नहीं माना। &mdash; निषेधबोधक वाक्य (C) हो सकता है वह आज शाम को आए। &mdash; इच्छाबोधक वाक्य (D) समय पर भोजन करोगे तो स्वस्थ रहोगे। &mdash; संकेतार्थक वाक्य<\/p>\n<div class=\"ex\"><b>उत्तर: (C)<\/b>\n<ol class=\"steps\">\n<li>A: तिरस्कार का भाव, चिह्न (!): विस्मयादिबोधक, सही।<\/li>\n<li>B: &lsquo;नहीं माना&rsquo; में निषेध: निषेधबोधक, सही।<\/li>\n<li>C: &lsquo;हो सकता है&rsquo; से संभावना/संदेह प्रकट हो रहा है, कामना नहीं। इसे <b>संदेहवाचक<\/b> कहना चाहिए, इच्छाबोधक नहीं। इसलिए यह जोड़ी गलत है।<\/li>\n<li>D: &lsquo;करोगे तो रहोगे&rsquo; में शर्त: संकेतार्थक, सही।<\/li>\n<\/ol><\/div>\n\n<h3>HTET 2022 Q36<\/h3>\n<p>इनमें से कौन-सा वाक्य <b>अशुद्ध<\/b> है? (A) तुम्हारा व्यवहार सर्वश्रेष्ठ है। (B) हम सभी में मनुष्यी दुर्बलताएँ हैं। (C) वह पाँव से जूता उतार रहा है। (D) शीला को अपनी योग्यता पर गर्व है।<\/p>\n<div class=\"ex\"><b>उत्तर: (B)<\/b>\n<ol class=\"steps\">\n<li>A: &lsquo;सर्वश्रेष्ठ&rsquo; शुद्ध (&lsquo;सर्वश्रेष्ठतम&rsquo; होता तो द्विरुक्ति)।<\/li>\n<li>B: &lsquo;मनुष्यी&rsquo; हिंदी का मान्य विशेषण नहीं है; शुद्ध रूप &lsquo;मानवीय/मानवोचित&rsquo;। अशुद्ध।<\/li>\n<li>C: &lsquo;पाँव से जूता उतारना&rsquo; में &lsquo;से&rsquo; करण/साधन में ठीक है। शुद्ध।<\/li>\n<li>D: &lsquo;शीला को ... गर्व है&rsquo; (संप्रदान/कर्ता-रूप के साथ) और &lsquo;पर&rsquo; का प्रयोग सही। शुद्ध।<\/li>\n<\/ol><\/div>\n\n<h2>सार<\/h2>\n<div class=\"recap\"><ul>\n<li><b>वाक्य<\/b> = पूर्ण विचार प्रकट करनेवाला शब्द-समूह (गुरु, अंक ६७७)। स्कूल की तीन कसौटियाँ: आकांक्षा, योग्यता, आसक्ति।<\/li>\n<li>मुख्य दो अवयव: <b>उद्देश्य<\/b> (किसके बारे में) और <b>विधेय<\/b> (क्या कहा)। विधेय में पूरक (कर्म/पूर्ति) और विस्तारक आते हैं।<\/li>\n<li><b>वाक्यांश<\/b> में क्रिया नहीं होती; <b>उपवाक्य<\/b> में अपनी क्रिया होती है।<\/li>\n<li>रचना से 3 भेद: <b>साधारण/सरल<\/b> (एक क्रिया), <b>संयुक्त<\/b> (बराबर के मुख्य उपवाक्य), <b>मिश्र<\/b> (मुख्य + आश्रित)।<\/li>\n<li>आश्रित उपवाक्य के तीन भेद: <b>संज्ञा-, विशेषण-, क्रियाविशेषण-उपवाक्य<\/b>; चौथा नहीं।<\/li>\n<li>अर्थ से 8 भेद: विधान, निषेध, आज्ञा, प्रश्न, विस्मय, इच्छा, संदेह, संकेत।<\/li>\n<li>&lsquo;हो सकता है / शायद / आता होगा&rsquo; = <b>संदेहवाचक<\/b>; &lsquo;भगवान भला करे&rsquo; = <b>इच्छावाचक<\/b>।<\/li>\n<li>वाक्य-शुद्धि की जाँच: लिंग, वचन, पुरुष, विभक्ति (कोई/किसी), क्रिया-प्रयोग (धन्यवाद देना), द्विरुक्ति (कृपया...कृपा), विशेषण-रूप (मानवीय)।<\/li>\n<li>वाच्य बदलते समय <b>काल और अर्थ वही<\/b> रहें; रूपांतरण में अर्थ न बदले।<\/li>\n<li>गुरु का &lsquo;साधारण वाक्य&rsquo; = स्कूल का &lsquo;सरल वाक्य&rsquo;।<\/li>\n<\/ul><\/div>\n\n<h2>अभ्यास<\/h2>\n<details class=\"quiz\"><summary>प्रश्न 1: &ldquo;वह जानता है कि मैं आऊँगा&rdquo; में &lsquo;कि मैं आऊँगा&rsquo; है: (A) संज्ञा-उपवाक्य (B) विशेषण-उपवाक्य (C) क्रियाविशेषण-उपवाक्य (D) वाक्यांश<\/summary><p><b>उत्तर: (A)<\/b> यह &lsquo;जानता है&rsquo; का कर्म है: &lsquo;मेरे आने&rsquo; (संज्ञा) की जगह उपवाक्य आया।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 2: &ldquo;वर्षा हुई और नदियाँ भर गईं&rdquo; किस रचना का वाक्य है? (A) सरल (B) संयुक्त (C) मिश्र (D) विधानवाचक<\/summary><p><b>उत्तर: (B)<\/b> दो स्वतंत्र उपवाक्य &lsquo;और&rsquo; से जुड़े हैं। (D) अर्थ का भेद है, रचना का नहीं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 3: &ldquo;भगवान तुम्हारा भला करे&rdquo; अर्थ के आधार पर कौन-सा वाक्य है? (A) संदेहवाचक (B) इच्छावाचक (C) विधानवाचक (D) प्रश्नवाचक<\/summary><p><b>उत्तर: (B)<\/b> आशीर्वाद/शुभकामना इच्छावाचक है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 4: शुद्ध वाक्य चुनिए: (A) लड़के खेलता है। (B) मैं आपसे प्रार्थना करता हूँ। (C) वह कोई लड़के से मिला। (D) वह अत्यंत सुंदरतम है।<\/summary><p><b>उत्तर: (B)<\/b> A में वचन-दोष, C में &lsquo;किसी&rsquo; की जगह &lsquo;कोई&rsquo; और D में द्विरुक्ति है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 5: &ldquo;यदि वर्षा होगी तो फ़सल अच्छी होगी&rdquo; का अर्थ-भेद है: (A) निषेधवाचक (B) संदेहवाचक (C) संकेतवाचक (D) आज्ञावाचक<\/summary><p><b>उत्तर: (C)<\/b> शर्त (यदि&mdash;तो) संकेत बताती है; रचना से यह मिश्र वाक्य भी है।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 6: &ldquo;नदी के किनारे&rdquo; क्या है? (A) वाक्य (B) उपवाक्य (C) वाक्यांश (D) मिश्र वाक्य<\/summary><p><b>उत्तर: (C)<\/b> इसमें क्रिया नहीं; &lsquo;के किनारे&rsquo; संबंधसूचक है और पूरा विचार नहीं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 7: &ldquo;वह आग से सींचता है&rdquo; में कौन-सी कसौटी टूटती है? (A) आकांक्षा (B) योग्यता (C) आसक्ति (D) कोई नहीं<\/summary><p><b>उत्तर: (B)<\/b> अर्थ में तालमेल नहीं; आग से सींचना संभव नहीं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 8: &ldquo;जो मनुष्य धनवान् होता है, उसे सभी चाहते हैं&rdquo; में &lsquo;जो मनुष्य धनवान् होता है&rsquo; कौन-सा उपवाक्य है? (A) संज्ञा (B) विशेषण (C) क्रियाविशेषण (D) मुख्य<\/summary><p><b>उत्तर: (B)<\/b> यह &lsquo;मनुष्य&rsquo; की विशेषता बताता है; &lsquo;धनवान्&rsquo; विशेषण के बदले आया।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 9: &ldquo;क्या वह कल आएगा?&rdquo; वाक्य है: (A) विधानवाचक (B) प्रश्नवाचक (C) संकेतवाचक (D) इच्छावाचक<\/summary><p><b>उत्तर: (B)<\/b> &lsquo;क्या&rsquo; और (?) चिह्न प्रश्न बताते हैं।<\/p><\/details>\n<details class=\"quiz\"><summary>प्रश्न 10: &ldquo;सब लोग एक साथ मिलकर चलें&rdquo; में मुख्य दोष है: (A) लिंग (B) वचन (C) पुनरुक्ति (D) कारक<\/summary><p><b>उत्तर: (C)<\/b> &lsquo;एक साथ&rsquo; और &lsquo;मिलकर&rsquo; का अर्थ दोहराया गया है।<\/p><\/details>\n\n<p class=\"src\">स्रोत: कामताप्रसाद गुरु, <i>हिंदी व्याकरण<\/i>: <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/४९९\">अर्थ के भेद, अन्वय-अधिकार (४९९–५००)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६०४\">वाक्य, उद्देश्य-विधेय, रचना के भेद, वाक्यांश (६०४–६०६)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६०६\">साधारण वाक्य, विस्तार, पृथक्करण (६०६–६२०)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/६२०\">मिश्र वाक्य, आश्रित उपवाक्य (६२०–६२३)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/१२२\">किसी/कोई (१२२)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२०९\">सा, भर, तक (२०९–२१०)<\/a>, <a href=\"https://hi.wikisource.org/wiki/पृष्ठ:हिंदी_व्याकरण.pdf/२१६\">समानाधिकरण समुच्चयबोधक (२१६)<\/a>। आकांक्षा-योग्यता-आसक्ति, सरल/संयुक्त/मिश्र के रूपांतरण-उदाहरण और शुद्धि के अधिकांश उदाहरण स्कूली परिपाटी हैं, गुरु में नहीं।<\/p>\n"},"name":"PGT Computer Science","lvl":"PGT","mp":"CS: ","ml":"Computer Science","ms":"CS","mn":60,"part":2026,"syl":true,"date":[2026,11,26,15],"when":"Level 3 is on 26 December 2026, 3:00 to 5:30 pm.","about":"2021 to 2024 use BSEH final keys. 2020 uses BSEH draft keys. July 2026 uses a video instructor's answers, and doubtful ones carry a note. All papers are Set A."};</script><script>// pure scoring functions (also run by test.js)
const C={
 ok:(q,a)=>q.a==='*'?true:!!a&&q.a.includes(a),          // '*' = mark to all, as in the official key
 score(qs,ans,neg=0){let r={n:qs.length,c:0,w:0,s:0};for(const q of qs){const a=ans[q.i];if(C.ok(q,a))r.c++;else if(a)r.w++;else r.s++}r.pct=r.n?100*r.c/r.n:0;r.m=r.c-r.w*neg;return r},
 avg(l){return l.length?l.reduce((a,b)=>a+b,0)/l.length:null},
 latest(attempts){const m={};for(const t of [...attempts].sort((a,b)=>a.date-b.date))for(const i in t.ans)m[i]=t.ans[i];return m},
 // accuracy on each question's latest answer; unanswered questions are not counted
 acc(qs,latest,key){const m={};for(const q of qs){const a=latest[q.i];if(!a||q.a==='*')continue;const k=key(q);(m[k]=m[k]||{n:0,c:0}).n++;if(C.ok(q,a))m[k].c++}for(const k in m)m[k].pct=100*m[k].c/m[k].n;return m},
 weak:(acc,min=5,cut=60)=>Object.entries(acc).filter(([k,v])=>v.n>=min&&v.pct<cut).sort((a,b)=>a[1].pct-b[1].pct).map(x=>x[0]),
 focus:(perPaper,acc)=>perPaper*(1-(acc&&acc.n>=3?acc.pct/100:.5))
};

// Saved results. The key and shape must stay as they are so earlier attempts keep loading.
let U={theme:'auto'};
try{U=Object.assign(U,JSON.parse(localStorage.getItem('htetmock-ui')||'{}'))}catch(e){}
const SK='htetmock',Qm=Object.fromEntries(D.qs.map(q=>[q.i,q]));
let S={attempts:[],cur:null,pass:60,cleared:0,done:{}},warned=false;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(SK)||'{}'))}catch(e){}
if(!Array.isArray(S.attempts))S.attempts=[];if(!S.done||typeof S.done!=='object')S.done={};
// results or an unfinished mock that use a removed paper (CS 2018, 2019) cannot be shown, so they are dropped
S.attempts=S.attempts.filter(t=>t.ids.every(i=>Qm[i]));if(S.cur&&!S.cur.ids.every(i=>Qm[i]))S.cur=null;
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){if(!warned){warned=true;ask('This browser is not saving your progress. Export a backup before closing.',[['OK','p']])}}}
// Cloud sync (api/sync.js). Does nothing without a key or when opened as a local file; a failure leaves local results as they are.
let syncMsg='';
async function sync(){if(!U.key||!location.protocol.startsWith('http'))return;
 const sent=new Set(S.attempts.map(t=>t.id)),was=JSON.stringify([S.attempts,S.done]);
 try{const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+U.key},body:JSON.stringify({attempts:S.attempts,cleared:S.cleared,done:S.done})}),o=await r.json().catch(()=>({}));
  if(!r.ok||!Array.isArray(o.attempts))throw Error(o.error||'Server error '+r.status);

Object.assign(act,{rg(v){setR('g',v)},rtab(v){setR('tab',v)},rclr(){Object.assign(R(),{area:'all',yrs:'all',syl:'all',q:''});saveUI();render()},rdrill(s){const r=R();r.g=s==='cs'||isCS(s)?'cs':s;r.area=s!=='cs'&&isCS(s)?s:'all';saveUI();render()},
tsheet(t){const x=stats(ys).find(v=>v.t===t),mx=Math.max(1,...Object.values(x.y));sheet(`<div class="stack"><div class="row bet" style="flex-wrap:nowrap;align-items:flex-start"><div><h2>${esc(tn(t))}</h2><p class="sm mut">${esc(sn(x.s))}</p></div><button type="button" class="btn s" data-close>Close</button></div><div class="row num" style="justify-content:space-between;gap:4px">${x.P.map(v=>`<div style="text-align:center;display:grid;gap:6px;justify-items:center"><span style="height:46px;display:grid;place-items:center">${bub(x.y[v],mx)}</span><span class="sm mut">${v}</span></div>`).join('')}</div><p>${x.tot} questions, ${x.avg.toFixed(1)} a paper, in ${x.seen} of ${x.P.length} papers. ${x.acc?`You have ${x.acc.c} of ${x.acc.n} right.`:'You have not tried this topic.'}</p>${isCS(x.s)?`<p class="sm mut">${D.top[t][1]?'Broadly listed in the BSEH 2025-26 class 9-12 Computer Science syllabus.':'Not listed in the BSEH 2025-26 class 9-12 Computer Science syllabus. Earlier HTET papers still asked it, so do not skip it.'}</p>`:''}<button type="button" class="btn p" data-act="topic" data-v="${t}">Practise all ${x.tot}</button></div>`)}});

// Guide: exam facts and the 30-day plan. Static text, checked against BSEH/HPSC documents on 26 Nov 2026.
const gt=(h,rows)=>`<div class="gt"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
V.guide=()=>`<div class="stack guide"><div><h1>Exam guide</h1><p class="mut">From the official BSEH HTET-2026 bulletin and HPSC documents, checked 26 Nov 2026. Pass rates are from news reports.</p></div>
<section class="card stack tint"><h2>My application</h2><ul>
<li><b>Applied:</b> HTET-2026 Level 3, PGT Computer Science. Application no. 538037.</li>
<li><b>Fee:</b> ₹1,200 paid online on 26 Nov 2026.</li>
<li><b>Exam:</b> Sat 26 Dec 2026, 3:00–5:30 pm, centre preference Rewari. Target: 90/150.</li>
<li><b>Admit card:</b> expected mid-December on htet2026.org, downloaded with the application number.</li>
<li><b>To confirm:</b> the bulletin says PGT CS needs a "three-year" MCA, but mine is the 2-year course. Check with the BSEH helpline.</li></ul></section>
<section class="card stack"><h2>HTET-2026 key facts</h2><ul>
<li><b>Exam:</b> PGT (Level 3) on Sat 26 Dec 2026, 3:00–5:30 pm. 150 questions, 1 mark each.</li>
<li><b>Negative marking:</b> none. The bulletin (p. 16) says "There shall be no negative marking."</li>
<li><b>Form:</b> last date 27 Nov 2026, 11:59 pm. Corrections allowed 28–29 Nov.</li>
<li><b>Fee (General/BC):</b> ₹1,200 for one level, ₹2,000 for two, ₹2,600 for three.</li>
<li><b>Pass mark:</b> 90/150 (60%) for General and BC-A/BC-B. Only Haryana SC and PwD candidates get 82 (55%).</li>
<li><b>Validity:</b> the certificate is valid for life (clause 9(i)). No limit on attempts, and you can re-sit to improve your score.</li></ul></section>
<section class="card stack"><h2>HTET levels</h2>${gt(['Level','Teaches','Main qualification'],[
['1 – PRT','Classes I–V','12th with 50% + 2-year D.El.Ed (or 4-year B.El.Ed); or graduation + D.El.Ed'],
['2 – TGT','Classes VI–VIII','Graduation with 50% in that subject + B.Ed or D.El.Ed with it as a teaching subject'],
['3 – PGT','Classes IX–XII','PG / MCA / B.Tech in the subject + HTET (PGT CS: M.Sc CS, MCA or B.Tech CS/IT with 55%)']])}
<p class="sm mut">BC candidates get 5% off the qualification percentage (for example 47.5% instead of 50%), but not off the 90-mark HTET pass mark. Each level is a separate application and a separate paper, and the job needs the level that matches the post.</p></section>
<section class="card stack"><h2>Pass rates and cutoffs</h2><p>HTET's pass mark has been fixed at 90/150 every year.</p>${gt(['HTET PGT exam','Pass rate'],[['Jan 2021','4.1%'],['Dec 2021','~14.5%'],['Dec 2022','9.9%'],['Dec 2023','8.9%'],['Jul 2025','9.6%'],['Jul 2026','not found']])}
<p><b>HPSC PGT CS (the job).</b> HPSC doesn't publish cutoffs. These counts come from its official marks lists.</p>${gt(['Advt','BC-B posts','BC-B result','Effective cutoff'],[
['26/2023','82 + 4 Mewat','~430 sat; 4 passed, all 4 selected','35% minimum. 39 selected for 1,711 posts'],
['23/2026','82 + 4 Mewat','402 sat, 94 passed','35% minimum (52.5/150). ~1,068 selected for 1,672 posts']])}
<p>In both cycles fewer people passed than there were posts, so the cutoff was just the 35% minimum. For BC-B, the hard part is reaching 35% in the subject test.</p></section>
<section class="card stack"><h2>My 2024 paper: 76/150, 39 skipped</h2>${gt(['Section','Score','Weak topics'],[
['CS (Q91–150)','37/60','MS Access 0/4, Excel 3/6, Python lists/dicts 1/3, SE testing, CPU/ports'],
['Child Development & Pedagogy','16/30','Teaching methods 0/3, learning theories 1/3, growth principles 1/3'],
['Hindi','2/15','उपसर्ग-प्रत्यय, संधि, समास, वर्ण, गद्यांश'],
['English','8/15','English teaching 2/5'],
['Haryana GK','2/10','History, polity, schemes, sports (8 skipped)'],
['Quantitative Aptitude','4/10','Geometry and mensuration 0/5 (all skipped)'],
['Reasoning','7/10','–']])}
<p><b>Never skip.</b> With no negative marking, guessing the 39 blanks is worth about +10 marks on average.</p>
<p><b>30-day order:</b> Hindi grammar and Haryana GK, then pedagogy theories, then MS Access/Excel and Python, then geometry formulas. Do one full past paper each week.</p></section>
<section class="card stack"><h2>The job: PGT Computer Science</h2><ul>
<li><b>Recruiter:</b> HPSC. Screening test (100 questions, −0.25 per wrong answer, sometimes skipped), a 150-mark subject test with a 35% minimum, then an interview.</li>
<li><b>Eligibility:</b> M.Sc CS / MCA / B.Tech CS or IT with 55%, plus HTET, plus Hindi at Matric. A 2025 corrigendum added NCTE norms (PG + B.Ed); check that you meet them.</li>
<li><b>Pay:</b> Level 8, ₹47,600 basic. With 63% DA plus HRA, about ₹82–87k gross, or about ₹74–79k in hand before tax.</li>
<li><b>Pension:</b> NPS or UPS. There is no Old Pension Scheme.</li>
<li><b>Permanence:</b> a regular government post with 1–2 years of probation. The 2012 rules said "on contract" for the first 5 years; it's not confirmed whether that clause was removed, though the 2026 advertisement shows the regular pay scale. Check the current rules.</li></ul></section></div>`;

// Revise: one module per subject from the official syllabus (htet/syllabus.json), a notes page per topic (htet/revise/<id>.html).

<div class="grid">${D.mods.map(m=>{const L=mtop(m),d=L.filter(t=>isDone(t.id)).length;return `<button type="button" class="card paper" data-act="mod" data-v="${m.id}"><span><b>${esc(m.name)}</b><span class="sm mut">${m.marks} marks, ${L.length} topics</span></span>${bar(100*d/L.length)}<span class="sm mut num">${d} of ${L.length} done</span></button>`}).join('')}</div>

${m.units.map(u=>`<section class="card"><h2 style="margin-bottom:4px">${esc(u.name)}</h2>${u.topics.map(t=>{const n=tq(t).length;return `<div class="li">${tick_(t.id,t.name)}<div class="grow"><button type="button" class="lnk" data-act="topen" data-v="${t.id}">${esc(t.name)}</button><p class="sm mut">${n?n+' past question'+(n===1?'':'s'):'Not asked yet'}${D.notes[t.id]?'':', notes coming'}</p></div></div>`}).join('')}</section>`).join('')}</div>`};

return `<div class="stack notes-page"><div class="row">${btn(esc(t.m.name),'mod',t.m.id,'l s')}</div><div class="row bet" style="flex-wrap:nowrap;align-items:flex-start"><h1 class="grow">${esc(t.name)}</h1>${tick_(t.id,t.name)}</div>

<nav class="toc" aria-label="इस पेज में"></nav><article class="notes">${D.notes[t.id]||'<p class="mut">Notes for this topic are coming. Practise its past questions meanwhile.</p>'}</article>
<div class="row">${btn(`Practise ${Q.length} past question${Q.length===1?'':'s'}`,'tprac',t.id,'p',!Q.length)}${aiOn()?btn('Ask AI about this topic','aitopic',t.id):''}</div>
${G.length?`<section class="card"><h2>Asked again</h2>${G.map(([g,i])=>`<div class="li"><span class="b y" style="width:40px;height:40px">${g.length}×</span><p class="grow sm num">${g.map(x=>Qm[x].y+' Q'+Qm[x].n).join(', ')}</p>${btn('Try','grp',i,'s')}</div>`).join('')}</section>`:''}</div>`};

 n.innerHTML='<b>इस पेज में</b>'+hs.map((h,i)=>{h.id='s'+i;return `<a href="#s${i}">${esc(h.textContent)}</a>`}).join('');
 n.onclick=e=>{const a=e.target.closest('a');if(a){e.preventDefault();document.getElementById(a.hash.slice(1)).scrollIntoView({behavior:'smooth'})}}};

// Ask AI (api/ai.js). Needs the sync key and the hosted page; answers are shown, not saved.
const aiOn=()=>!!U.key&&location.protocol.startsWith('http');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[*-] /gm,'• ');
let aiCtx='';
function aiSheet(title,body){sheet(`<div class="stack"><div class="row bet" style="flex-wrap:nowrap;align-items:flex-start"><h2 class="grow">${esc(title)}</h2><button type="button" class="btn s" data-close>Close</button></div>${body}<div id="aiout" class="ai-out" role="status" aria-live="polite"></div></div>`)}
async function askAI(q){const o=$('#aiout');if(!o)return;o.innerHTML='<p class="mut">Thinking…</p>';
 try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+U.key},body:JSON.stringify({q})}),j=await r.json().catch(()=>({}));
  if(!r.ok||!j.text)throw Error(j.error||'Server error '+r.status);if($('#aiout')===o)o.innerHTML=`<div class="ai-txt">${md(j.text)}</div>`}
 catch(e){if($('#aiout')===o)o.innerHTML=`<p class="mut">Not answered: ${esc(e.message)}</p>`}}
const aiQ=q=>`HTET ${yl(q.y)} Q${q.n} (${sn(sub(q))}: ${tn(q.t)})\n${q.x}\n${q.o.map((o,k)=>'ABCD'[k]+') '+o).join('\n')}\n`+(q.a==='*'?'Official key: mark given to everyone (question was faulty).':'Official answer: '+q.a.map(k=>'ABCD'[k-1]).join(' or '))+(q.note?`\nNote: ${q.note}`:'');
const aiBox=ph=>`<form class="row ai-ask" data-aiform style="flex-wrap:nowrap"><input class="inp grow" id="aiq" placeholder="${esc(ph)}" autocomplete="off" enterkeyhint="send" maxlength="500">${btn('Ask','aiask','','p')}</form>`;
Object.assign(act,{
 ai(v){const q=Qm[v];aiCtx=aiQ(q);aiSheet('AI: '+yl(q.y)+' Q'+q.n,aiBox('Ask a follow-up'));askAI(aiCtx)},
 aitopic(v){const t=TM[v];aiCtx=`Topic from the HTET PGT syllabus: ${t.m.name} > ${t.name}. Official syllabus text: ${t.syl}\n`;aiSheet('AI: '+t.name,aiBox('For example: difference between TCP and UDP'));$('#aiq').focus()},
 aiask(){const v=$('#aiq').value.trim();if(!v)return;$('#aiq').value='';$('#aiq').blur();askAI(aiCtx+'\nStudent asks: '+v)}});

V.data=()=>`<div class="stack"><h1>Settings</h1><div class="g2"><div class="stack"><section class="card stack"><div><h2>Cloud sync</h2><p class="mut">Shares finished mocks and ticked topics between devices. Once the key is in, it syncs by itself when you open the app, finish a mock, tick a topic, come back to it or reconnect.</p></div><label class="fld">Sync key<input class="inp" id="key" type="password" autocomplete="off" value="${esc(U.key||'')}"></label><div class="row">${btn('Sync now','sync','','p')}${aiOn()?btn('Copy setup link','slink'):''}</div><p class="sm mut" role="status">${esc(syncMsg)}</p>${aiOn()?'<p class="sm mut">Open the setup link once on another phone or computer and it is set up, with no typing.</p>':''}</section>
<section class="card stack"><div><h2>AI help</h2><p class="mut">${aiOn()?'On. Tap Ask AI under any answer, or on a Revise topic.':location.protocol.startsWith('http')?'Turns on once the sync key is in.':'Works on the online version of this page, not the saved file.'}</p></div><p class="sm mut">Uses Google Gemini through this app's server. Questions you ask go to Google.</p></section>
<section class="card stack"><h2>Appearance</h2>${select('theme','Theme',[['auto','Same as this device'],['light','Light'],['dark','Dark']],U.theme)}</section></div>

<section class="card tint"><h2>About the answers</h2><p class="mut" style="margin-top:6px">${esc(D.about)}</p></section></div></div></div>`;
A.data=()=>{$('#key').onchange=e=>{U.key=e.target.value.trim();saveUI();syncMsg='';sync()};$('#imp').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());const good=Array.isArray(o.attempts)&&o.attempts.every(t=>t&&Array.isArray(t.ids)&&t.ids.every(i=>Object.hasOwn(Qm,i))&&t.ans&&typeof t.ans==='object'&&Number.isFinite(t.date)&&Number.isFinite(t.id)&&typeof t.label==='string'&&Number.isFinite(t.time));if(!good)throw 0;if(await ask(`Replace current results with ${o.attempts.length} from the backup?${U.key?' Results already in the cloud will be added back.':''}`,[['Replace','p'],['Cancel']])===0){S={attempts:o.attempts.map(t=>({...t,at:Date.now()})),cur:null,pass:o.pass===55?55:60,cleared:S.cleared,done:S.done};save();go('prog');sync()}}catch(x){ask('That file is not a valid backup. Nothing was changed.',[['OK','p']])}}};
Object.assign(act,{exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='htet-mock-backup-cs.json';a.click()},impb(){$('#imp').click()},async slink(){const l=location.origin+location.pathname+'#setup='+encodeURIComponent(U.key);try{await navigator.clipboard.writeText(l);syncMsg='Setup link copied. Keep it private: it opens your results.'}catch(e){syncMsg='Copy failed. The link is: '+l}render()},sync(){U.key=$('#key').value.trim();saveUI();syncMsg=U.key?'Syncing…':'Enter the sync key first.';render();sync()},async reset(){if(await ask('Delete every saved result, here and in the cloud? This cannot be undone.',[['Delete','p'],['Cancel']])===0){S={attempts:[],cur:null,pass:S.pass,cleared:Date.now(),done:S.done};save();render();sync()}}});

setTheme();render();sync();</script></body></html>
