:root{--bg:#F2F7FE;--surface:#fff;--ice:#EAF2FE;--sky:#DCE9FD;--sky2:#B5D0FA;--pri:#1F5FE0;--navy:#0C2766;--ink:#0D1F42;--mut:#51647F;--line:#DDE7F5;--on:#fff;--bad:#B23A48;--badb:#FBECEE;--hero:#0C2766;--heroink:#fff;--heromut:#BBD0F7;
--sh:0 1px 2px rgba(12,39,102,.05),0 14px 30px -22px rgba(12,39,102,.4);--r:24px;--f:Lexend,"Noto Sans Devanagari","Kohinoor Devanagari",system-ui,sans-serif;color-scheme:light}
:root[data-theme=dark]{--bg:#071329;--surface:#0F2040;--ice:#152A50;--sky:#1B3566;--sky2:#2B5199;--pri:#7FAEFF;--navy:#CFE0FF;--ink:#EAF1FF;--mut:#A3B7D8;--line:#21385F;--on:#071329;--bad:#FF9DA8;--badb:#40202F;--hero:#153A8F;--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0}html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 var(--f);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;padding:0;cursor:pointer}button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px}h1{font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.015em}h2{font-size:18px;font-weight:600;line-height:1.3}h3{font-size:15px;font-weight:600}
.num{font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.sm{font-size:13.5px}.grow{flex:1;min-width:0}.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:16px}.bet{justify-content:space-between}
/* frame: floating tabs on phones, sidebar from 768px */
.app{min-height:100dvh}.brand{display:none}
main{padding:18px 16px calc(env(safe-area-inset-bottom) + 112px);max-width:1180px;margin:auto}
.nav{position:fixed;z-index:20;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:5px;border-radius:32px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 16px 36px -14px rgba(12,39,102,.45)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:27px;font-size:11.5px;font-weight:500;color:var(--mut);min-height:52px}.nav button[aria-current]{background:var(--pri);color:var(--on)}
@media(min-width:768px){.app{display:grid;grid-template-columns:232px minmax(0,1fr)}.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 20px}.brand b{display:block;font-weight:600;line-height:1.25}.nav{position:static;flex-direction:column;padding:0;background:none;box-shadow:none;border-radius:0}.nav button{flex-direction:row;gap:12px;font-size:15px;padding:11px 13px;border-radius:14px;min-height:46px}.nav button:not([aria-current]):hover{background:var(--ice)}main{padding:28px 32px 56px;width:100%}}
.focus .side{display:none}.focus.app{display:block}
/* buttons, chips, segments */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:99px;font-weight:500;background:var(--sky);color:var(--navy);white-space:nowrap}.btn.p{background:var(--pri);color:var(--on)}.btn.l{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}.btn.s{min-height:40px;padding:7px 15px;font-size:14px}.btn.w{background:#fff;color:#0C2766}
@media(hover:hover){.btn:not(:disabled):hover{filter:brightness(.96)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none;scroll-snap-type:x proximity}.chips button{flex:none;min-height:42px;padding:8px 16px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;scroll-snap-align:start}.chips button[aria-pressed=true]{background:var(--navy);color:var(--on);box-shadow:none}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible}}
.seg{display:flex;background:var(--sky);border-radius:99px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg button{flex:1 0 auto;min-height:40px;padding:6px 16px;border-radius:99px;font-size:14.5px;font-weight:500;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--surface);color:var(--navy);box-shadow:var(--sh)}
.tag{display:inline-block;font-size:12.5px;line-height:1.4;border-radius:99px;padding:2px 10px;background:var(--sky);color:var(--navy);white-space:nowrap}.tag.o{background:none;box-shadow:inset 0 0 0 1px var(--sky2)}.tag.bad{background:var(--badb);color:var(--bad)}
/* native dropdowns: the browser's own select, styled where supported */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13.5px;color:var(--mut)}
select,.inp{width:100%;min-height:48px;border:0;border-radius:15px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:10px 14px;font-size:15px;color:var(--ink);cursor:pointer}.inp{cursor:text}.inp::placeholder{color:var(--mut)}
select:hover{box-shadow:inset 0 0 0 1px var(--sky2)}
@supports (appearance:base-select){select,::picker(select){appearance:base-select}select{display:flex;align-items:center;justify-content:space-between;gap:10px}selectedcontent{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
select::picker-icon{content:"";width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translate(-3px,-3px);transition:transform .18s}select:open::picker-icon{transform:rotate(225deg) translate(-3px,-3px)}select:open{box-shadow:inset 0 0 0 2px var(--pri)}
::picker(select){margin-block:7px;padding:7px;border:0;border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 26px 54px -20px rgba(12,39,102,.5);max-height:min(400px,60dvh);min-width:anchor-size(width);max-width:calc(100vw - 24px)}
option{display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 13px;border-radius:13px;font-size:15px}option:hover,option:focus-visible{background:var(--ice);outline:0}option:checked{background:var(--sky);color:var(--navy);font-weight:500}option::checkmark{content:"✓";order:2;margin-left:auto;color:var(--pri)}optgroup{font-weight:500;color:var(--mut);font-size:13px}optgroup legend{padding:10px 13px 4px}optgroup option{color:var(--ink)}}
.sw{display:flex;align-items:center;gap:11px;min-height:48px;cursor:pointer;color:var(--ink);font-size:15px}.sw input{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--sky2);position:relative;cursor:pointer;flex:none;transition:background .18s}.sw input::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .18s}.sw input:checked{background:var(--pri)}.sw input:checked::after{left:21px}
/* surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}.tint{background:var(--sky);box-shadow:none}.flat{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.hero{background:var(--hero);color:var(--heroink);border-radius:30px;padding:24px;display:grid;gap:22px;overflow:hidden;position:relative}.hero .mut{color:var(--heromut)}.hero h1{font-size:clamp(26px,4.4vw,38px)}@media(min-width:900px){.hero{grid-template-columns:1.2fr 1fr;padding:34px;align-items:center}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}.g2{display:grid;gap:14px}@media(min-width:1000px){.g2{grid-template-columns:1fr 1fr;align-items:start}}
.filters{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.filters .wide{grid-column:1/-1}@media(min-width:900px){.filters{grid-template-columns:1.4fr 1fr 1fr 1fr}.filters .wide{grid-column:auto}}
.setup{display:grid;gap:12px}@media(min-width:700px){.setup{grid-template-columns:1.5fr 1.3fr auto;align-items:end}}
.paper{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}.paper b{font-size:18px;font-weight:600;display:block}.vwrap{max-width:820px;margin:auto;padding:16px 16px 80px}.vq .opts{max-width:none}.vq .eye{flex:none}.vq .eye .i{width:20px;height:20px}@media(max-width:560px){.wd2{display:none}}
/* OMR bubbles */
.omr{display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid var(--sky2);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--mut)}
.mx{overflow-x:auto;margin:0 -18px;padding:0 18px}.mx table{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}.mx th{font-weight:500;font-size:13px;color:var(--mut);padding:4px 2px 10px;text-align:center}.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;padding-right:10px;min-width:150px;max-width:250px}.mx td{border-top:1px solid var(--line);padding:6px 2px;text-align:center;height:56px}
.b{display:inline-grid;place-items:center;border-radius:50%;background:var(--pri);color:var(--on);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}.b.z{background:none;border:1.5px solid var(--line);width:12px;height:12px}.b.y{background:var(--sky2);color:#0C2766}.b.na{background:none;color:var(--mut)}
.lnk{color:var(--pri);font-weight:500;text-align:left}.lnk:hover{text-decoration:underline}.nm{font-weight:500;color:var(--ink)}
.bar{height:8px;border-radius:9px;background:var(--sky);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--pri)}.bar.wk i{background:var(--bad)}
/* accordion */
details.acc{background:var(--surface);border-radius:20px;box-shadow:var(--sh)}.acc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 84px 52px 20px;gap:12px;align-items:center;padding:14px 18px;border-radius:20px}.acc summary::-webkit-details-marker{display:none}.acc summary .i{width:18px;transition:transform .18s}.acc[open] summary .i{transform:rotate(180deg)}.acc .in{padding:0 18px 14px}.tr{display:grid;grid-template-columns:minmax(0,1fr) 84px 52px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.tr .sm{overflow-wrap:anywhere}
@media(min-width:700px){.acc summary,.acc .tr{grid-template-columns:minmax(0,1fr) 200px 60px 20px}.acc .tr{grid-template-columns:minmax(0,1fr) 200px 80px}}
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}.li:first-child{border:0}
/* mock */

phonetic dictionary","Gramophones","Television","Film & film strips Direction : (Q. No. 51 to 60) : Read the following passage and answer the questions that follow : I worked for a brief while in a college in Delhi, and among my more uncomfortable memories is a language exercise, I gave a group of eight undergraduates: I asked them to imagine that they had already graduated and wanted them to write an application for a suitable job. Seven of the eight students wrote applications for the jobs of clerks. Even in one of the good universities, and in a college that had a reputation for its academic standards, the system had snuffed out all youthful ambition. Even the highest youthful ambition in the prestigious colleges is to pass the competitive examination for appointments in the administrative services, and there are colleges that are more proud of the bureaucrats among their alumni than of any scholars, scientists or leaders of opinion. And these latter, understandably, are a small number. Students derive the meanness of their ambitions from the meanness of the goals that the colleges propose to themselves. And of the most ambitious, as well as of the least, among the students, it could be said that they think more of what society will do to or for them, than of what they would be able to do for and to society. This is an excellent apprenticeship for joining the ranks of hirelings or of the unemployed."]},{"i":"2024_51","y":2024,"n":51,"t":"ENG.com","a":[2],"x":"How long did the author work in a Delhi College ?","o":["long time","short time","three years","seven years"]},{"i":"2024_52","y":2024,"n":52,"t":"ENG.com","a":[4],"x":"What exercise did the author give the students ?","o":["a comprehension passage","precis writing","expansion of a poem","a language exercise"]},{"i":"2024_53","y":2024,"n":53,"t":"ENG.com","a":[3],"x":"Seven out of the eight students wanted to become …………… .","o":["scholars","bureaucrats","clerks","scientists"]},{"i":"2024_54","y":2024,"n":54 क संज्ञा","क्रोध, सत्य, रोग – स्वतंत्र भाववाचक संज्ञाएँ","ऐश्वर्य, कौमार्य, उपयोगिता – अयौगिक भाववाचक संज्ञाएँ"]},{"i":"2024_44","y":2024,"n":44,"t":"HIN.sam","a":[4],"x":"समास की दृष्टि से [[असंगत]] विकल्प चुनिए :","o":["कूपमंडूक – अधिकरण तत्पुरुष","मधुमक्खी – लुप्तपद तत्पुरुष","काजल – कर्मधारय","हीन-भावना – अपादान तत्पुरुष"]},{"i":"2024_45","y":2024,"n":45,"t":"HIN.noun","a":[2],"x":"किस विकल्प में एकवचन से बहुवचन बना युग्म [[असंगत]] है ?","o":["डाकू – डाकुओं","साधु – साधूओं","पत्नी – पत्नियों","काग़ज़ – काग़ज़ात"]},{"i":"2024_46","y":2024,"n":46,"t":"ENG.ped","a":[2],"x":"Which one of the following is not an advantage of multi-media materials ?","o":["improved learning and retention","cost and technical issues","good learning outcomes","increased interactivity"]},{"i":"2024_47","y":2024,"n":47,"t":"ENG.ped","a":[4],"x":"Which one of the following is not a result of multilingualistic resource ?","o":["it increases learner participation","the teacher's role is that of the facilitator","students learn to observe, deduce and formulate","the emphasis is on language structure rather than on the message"]},{"i":"2024_48","y":2024,"n":48,"t":"ENG.ped","a":[1],"x":"Which one of the following is not true of the role of grammar in language learning ?","o":["Grammar should be taught deductively followed by inductive application.","Knowledge of grammar is a means and not an end in itself.","Unless absolutely necessary, grammatical terminology is to be avoided.","Examples that support the rule are to be taught; exceptions are to be avoided."]},{"i":"2024_49","y":2024,"n":49,"t":"ENG.ped","a":[2],"x":"Which one of the following is not a principle of teaching English ?","o":["Principle of linking life","Substitution table method","Habit formation","Gradation"]},{"i":"2024_50","y":2024,"n":50,"t":"ENG.ped","a":[3],"x":"Match the following correctly : A. Behaviourist (i) Piaget B. Innateness (ii) Bruner C. Cognitive (iii) Skinner D. Interaction (iv) Chomsky","o":["A-i, B-iii, C-ii, D-iv","A-iv, B-i, C-iii, D-ii","A-iii, B-iv, C-i, D-ii","A-ii, B-iii, C-iv, D-i Direction : (Q. No. 51 to 60) : Read the following passage and answer the questions that follow : The third great defect of our civilization is that it does not know what to do with its knowledge. Science has given us powers fit for the gods, yet we use them like small children. For example, we do not know how to manage our machines. Machines were made to be man's servants; yet he has grown so dependent on them that they are in a fair way to become his masters. Already most men spend most of their lives looking after and waiting upon machines. And the machines are very stern masters. They must be fed with coal, and given petrol to drink, and oil to wash with, and they must be kept at the right temperature. And if they do not get their meals when they expect them, they grow sulky and refuse to work, or burst with rage, and blow up, and spread ruin and destruction all round them. So we have to wait upon them very attentively and do all that we can to keep them in a good temper. Already we find it difficult either to work or play without the machines, and a time may come when they will rule us altogether, just as we rule the animals. And this brings me to the point at which I asked, \"What do we do with all the time which the machines have saved for us, and the new energy they have given us ?\" On the whole, it must be admitted, we do very little. For the most part we use our time and energy to make more and better machines; but more and better machines will only give us still more time and still more energy, and what are we to do with them ? The answer, I think, is that we should try to become mere civilized. For the machines themselves, and the power which the machines have given us, are not civilization but aids to civilization. But you will remember that we agreed at the beginning that being civilized meant making and 1inking beautiful things, thinking freely, and living rightly and maintaining justice equally between man and man. Man has a better chance today to do these things than he ever had before; he has more time, more energy, less to fear and less to fight against. If he will give his time and energy which his machines have won for him to making more beautiful things, to finding out more and more about the universe, to removing the causes of quarrels between nations, to discovering how to prevent poverty, then I think our civilization would undoubtedly be the greater, as it would be the most lasting that there has ever been."]},{"i":"2024_58","y":2024,"n":58,"t":"ENG.sent","a":[3],"x":"Fill in the blank with the correct option : \"Yet we use them like small children\" is an example of ………. .","o":["metaphor","irony","simile","climax"]},{"i":"2024_59","y":2024,"n":59,"t":"ENG.pos","a":[4],"x":"Fill in the blank with the correct option : \"To manage\", \"to become\", \"to work\" are ………. .","o":["finites","main verbs","present participle","infinitives"]},{"i":"2024_61","y":2024,"n":61,"t":"Q.geo","a":[3],"x":"How many solid balls each of radius 1 cm can be made from a solid sphere whose radius is 8 cm?","o":["64","256","512","1024"]},{"i":"2024_62","y":2024,"n":62,"t":"Q.pct","a":[3],"x":"In an examination, a candidate must get 40% marks to pass. A candidate got 210 marks and failed by 90 marks. Maximum marks is :","o":["600","700","750","900"]},{"i":"2024_63","y":2024,"n":63,"t":"R.blo","a":[3],"x":"If A is the brother of the son of B's son, then how is A related to B ?","o":["Son","Brother","Grandson","Cousin"]},{"i":"2024_64","y":2024,"n":64,"t":"R.ser","a":[2],"x":"Find the missing term of the following number series : 1, 4, 27, 16, ?, 36, 343, 64","o":["25","125","625","64"]},{"i":"2024_65","y":2024,"n":65,"t":"R.ana","a":[4],"x":"Newspaper : Press : : Cloth : ?","o":["Tailor","Shop","Fibre","Mill"]},{"i":"2024_66","y":2024,"n":66,"t":"R.ser","a":[3],"x":"Next term of the following letter series will be : AD, HK, OR, -------","o":["UX if(r.tab==='again'){const l=D.rep.map((g,i)=>[g,i]).filter(([g])=>{const t=Qm[g[0]].t,x=all.find(y=>y.t===t);return match(x,r)&&g.some(i=>P.includes(Qm[i].y))});return l.length?`<p class="sm mut">${l.length} questions came back in a later year, the same or nearly so. Hindi is not compared.</p><div class="card">${l.map(([g,i])=>`<div class="li"><span class="b y" style="width:40px;height:40px">${g.length}×</span><div class="grow"><p class="nm">${esc(tn(Qm[g[0]].t))}</p><p class="sm mut num">${esc(sn(sub(Qm[g[0]])))}: ${g.map(x=>Qm[x].y+' Q'+Qm[x].n).join(', ')}</p></div>${btn('Try','grp',i,'s')}</div>`).join('')}</div>`:none}
if(!sel.length)return none;
if(r.tab==='focus'){const l=sel.map(x=>({...x,f:C.focus((x.avg+x.last)/2,x.acc)})).filter(x=>x.tot).sort((a,b)=>b.f-a.f).slice(0,9);return `<p class="sm mut">Ranked by marks per paper, with recent papers counting extra, and by how you score on each. Topics with fewer than 3 answers count as 50%.</p><div class="grid">${l.map((x,i)=>`<article class="card stack ${i<3?'tint':''}" style="gap:10px"><div><h3>${i+1}. ${esc(tn(x.t))}</h3><p class="sm mut">${esc(sn(x.s))}</p></div><p class="num"><b style="font-size:24px;font-weight:600">${x.avg.toFixed(1)}</b> marks a paper</p><p class="sm mut num">Last 3 papers ${x.last.toFixed(1)}. In ${x.seen} of ${x.P.length}.${x.acc?` You: ${pc(x.acc.pct)}.`:' Not tried yet.'}</p><div class="row" style="margin-top:auto">${btn('Details','tsheet',x.t,'s '+(i<3?'l':''))}${btn('Practise','topic',x.t,'p s')}</div></article>`).join('')}</div>`}
const list=[...sel].sort(SORT[r.sort]);
if(r.tab==='topics')return `<p class="sm mut">${list.length} topics</p><div class="card">${list.map(x=>`<div class="li"><span class="b y num" style="width:46px;height:46px;font-size:14px;flex:none">${x.avg.toFixed(1)}</span><div class="grow"><button type="button" class="lnk" data-act="tsheet" data-v="${x.t}">${esc(tn(x.t))}</button><p class="sm mut num">${esc(sn(x.s))}. ${x.tot} question${x.tot===1?'':'s'}, in ${x.seen} of ${x.P.length} paper${x.P.length===1?'':'s'}.${x.acc?` You: ${pc(x.acc.pct)}.`:''}</p>${D.syl&&isCS(x.s)&&!D.top[x.t][1]?'<span class="tag o">Not in 2025-26 syllabus</span>':''}</div>${btn('Practise','topic',x.t,'s')}</div>`).join('')}</div>`;
// By year: subjects, or topics once one subject or area is chosen
const one=(r.g!=='all'&&r.g!=='cs')||r.area!=='all'||r.q,rows=one?list.map(x=>({n:tn(x.t),t:x.t,s:x.s,y:x.y})):Object.values(sel.reduce((m,x)=>{const k=r.g==='all'&&isCS(x.s)?'cs':x.s,b=m[k]=m[k]||{n:k==='cs'?'Computer Science':sn(k),k,s:x.s,y:{}};for(const v in x.y)b.y[v]=(b.y[v]||0)+x.y[v];return m},{})).sort((a,b)=>P.reduce((n,v)=>n+(b.y[v]||0)-(a.y[v]||0),0)),mx=Math.max(1,...rows.flatMap(x=>P.map(v=>x.y[v]||0)));
return `<p class="sm mut">Bigger bubble, more marks. ${one?'Tap a topic for details.':'Tap a subject to see its topics.'}</p><div class="card"><div class="mx" tabindex="0" role="region" aria-label="Marks by year"><table style="min-width:${120+P.length*50}px"><thead><tr><th scope="col">${one?'Topic':'Subject'}</th>${P.map(y=>`<th scope="col">${y}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr><td><button type="button" class="lnk" data-act="${one?'tsheet':'rdrill'}" data-v="${one?x.t:x.k}">${esc(x.n)}</button></td>${P.map(v=>`<td>${bub(x.y[v],mx,v===2026&&!isCS(x.s))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>${cs26(r,P)}`}
const cs26=(r,P)=>P.includes(2026)&&r.g!=='cs'?'<p class="sm mut">July 2026 has the Computer Science part only.</p>':'';
